<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- wall -->
  <rect x="0" y="0" width="800" height="800" fill="#e8dcc2"/>
  <!-- window with fog -->
  <rect x="600" y="50" width="150" height="170" fill="#d3dadb" stroke="#2b2118" stroke-width="3"/>
  <line x1="675" y1="50" x2="675" y2="220" stroke="#2b2118" stroke-width="3"/>
  <line x1="600" y1="135" x2="750" y2="135" stroke="#2b2118" stroke-width="3"/>
  <path d="M608 85 Q640 75 670 88 T742 84" fill="none" stroke="#aeb8ba" stroke-width="6"/>
  <path d="M608 110 Q640 100 670 114 T742 108" fill="none" stroke="#aeb8ba" stroke-width="6"/>
  <path d="M608 165 Q640 155 670 168 T742 162" fill="none" stroke="#aeb8ba" stroke-width="6"/>

  <!-- cork board -->
  <rect x="60" y="110" width="250" height="200" fill="#c79b67" stroke="#2b2118" stroke-width="3"/>
  <g fill="#a57444">
    <circle cx="82" cy="130" r="2.5"/><circle cx="120" cy="290" r="2.5"/><circle cx="210" cy="126" r="2.5"/>
    <circle cx="290" cy="150" r="2.5"/><circle cx="96" cy="250" r="2.5"/><circle cx="262" cy="292" r="2.5"/>
    <circle cx="180" cy="300" r="2.5"/><circle cx="296" cy="236" r="2.5"/><circle cx="72" cy="180" r="2.5"/>
  </g>

  <!-- notice -->
  <path d="M112 152 L252 152 L252 300 L112 300 Z" fill="#f6f0dc" stroke="#2b2118" stroke-width="2.5"/>
  <path d="M232 152 L252 152 L252 172 Z" fill="#e3d2a0" stroke="#2b2118" stroke-width="2"/>
  <rect x="112" y="152" width="140" height="16" fill="#e6cf8a"/>
  <line x1="112" y1="168" x2="252" y2="168" stroke="#2b2118" stroke-width="1"/>
  <text x="120" y="164" font-family="serif" font-size="11" font-weight="bold" fill="#2b2118">COLLECTIONS:</text>
  <g font-family="serif" font-size="10" fill="#2b2118">
    <text x="120" y="188">Mon, Wed, Fri,</text>
    <text x="120" y="202">10 a.m.</text>
    <text x="120" y="222">Parcels must be</text>
    <text x="120" y="235">signed for.</text>
    <text x="120" y="256">Please ring the bell</text>
    <text x="120" y="269">if the counter is</text>
    <text x="120" y="282">unattended.</text>
  </g>
  <circle cx="122" cy="160" r="0" fill="none"/>
  <circle cx="240" cy="132" r="5" fill="#b8322a" stroke="#2b2118" stroke-width="1.5"/>
  <circle cx="200" cy="136" r="5" fill="#b8322a" stroke="#2b2118" stroke-width="1.5"/>

  <!-- clock behind counter -->
  <circle cx="520" cy="290" r="62" fill="#fbf8ee" stroke="#2b2118" stroke-width="4"/>
  <circle cx="520" cy="290" r="50" fill="none" stroke="#2b2118" stroke-width="1.5"/>
  <g stroke="#2b2118" stroke-width="3">
    <line x1="520" y1="246" x2="520" y2="256"/>
    <line x1="564" y1="290" x2="554" y2="290"/>
    <line x1="520" y1="334" x2="520" y2="324"/>
    <line x1="476" y1="290" x2="486" y2="290"/>
  </g>
  <line x1="520" y1="290" x2="520" y2="262" stroke="#2b2118" stroke-width="4" stroke-linecap="round"/>
  <line x1="520" y1="290" x2="544" y2="302" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/>
  <circle cx="520" cy="290" r="4" fill="#b8322a"/>

  <!-- counter -->
  <rect x="120" y="440" width="560" height="220" fill="#8a5a3b" stroke="#2b2118" stroke-width="3"/>
  <rect x="100" y="418" width="600" height="28" fill="#6b4329" stroke="#2b2118" stroke-width="3"/>
  <g stroke="#5a3822" stroke-width="2" fill="none">
    <path d="M160 480 Q200 470 240 480"/>
    <path d="M400 530 Q440 520 480 530"/>
    <path d="M200 580 Q240 570 280 580"/>
    <path d="M560 500 Q600 490 640 500"/>
  </g>
  <rect x="330" y="470" width="140" height="60" fill="none" stroke="#5a3822" stroke-width="2"/>

  <!-- bell -->
  <path d="M460 418 Q460 372 500 372 Q540 372 540 418 Z" fill="#b08a3e" stroke="#2b2118" stroke-width="3"/>
  <path d="M460 418 Q460 384 470 378 Q462 392 462 418 Z" fill="#7a5a24"/>
  <path d="M540 418 Q540 384 530 378 Q538 392 538 418 Z" fill="#7a5a24"/>
  <ellipse cx="500" cy="418" rx="40" ry="5" fill="#7a5a24" stroke="#2b2118" stroke-width="2"/>
  <ellipse cx="500" cy="374" rx="14" ry="6" fill="#8a6a2e" stroke="#2b2118" stroke-width="2.5"/>
  <ellipse cx="500" cy="372" rx="8" ry="3" fill="#f0d27a"/>
  <path d="M488 380 Q494 376 500 376" fill="none" stroke="#f0d27a" stroke-width="2"/>

  <!-- stamp handle and rubber block -->
  <rect x="196" y="392" width="100" height="18" rx="9" fill="#9a6a40" stroke="#2b2118" stroke-width="3"/>
  <line x1="214" y1="396" x2="214" y2="406" stroke="#6b4329" stroke-width="2"/>
  <line x1="236" y1="396" x2="236" y2="406" stroke="#6b4329" stroke-width="2"/>
  <rect x="290" y="386" width="36" height="30" fill="#222" stroke="#2b2118" stroke-width="2"/>
  <rect x="290" y="386" width="5" height="5" fill="#8a8a8a"/>
  <rect x="321" y="386" width="5" height="5" fill="#8a8a8a"/>
  <rect x="290" y="411" width="5" height="5" fill="#8a8a8a"/>
  <rect x="321" y="411" width="5" height="5" fill="#8a8a8a"/>
  <rect x="296" y="392" width="24" height="18" fill="#3a3a8a"/>
  <text x="298" y="404" font-family="serif" font-size="5" fill="#f6f0dc">MOSSBROOK</text>

  <!-- sign on counter edge -->
  <rect x="150" y="530" width="110" height="26" fill="#f6f0dc" stroke="#2b2118" stroke-width="2"/>
  <text x="158" y="547" font-family="serif" font-size="9" fill="#2b2118">MOSSBROOK POST OFFICE</text>

  <!-- signature -->
  <text x="752" y="784" font-family="serif" font-size="18" fill="#2b2118" text-anchor="end">P.</text>
</svg>