    <ellipse cx="402" cy="612" rx="12" ry="5"/>
    <ellipse cx="360" cy="630" rx="14" ry="6"/>
    <ellipse cx="410" cy="648" rx="16" ry="6"/>
    <ellipse cx="350" cy="676" rx="18" ry="7"/>
    <ellipse cx="430" cy="700" rx="20" ry="8"/>
    <ellipse cx="310" cy="735" rx="24" ry="9"/>
    <ellipse cx="500" cy="752" rx="26" ry="9"/>
    <ellipse cx="160" cy="770" rx="30" ry="10"/>
    <ellipse cx="640" cy="780" rx="32" ry="10"/>
  </g>

  <!-- fog bands -->
