  <g fill="#ffffff">
    <circle cx="90" cy="120" r="3" opacity="0.9"/>
    <circle cx="180" cy="200" r="2.5" opacity="0.8"/>
    <circle cx="260" cy="90" r="2" opacity="0.7"/>
    <circle cx="330" cy="230" r="3.5" opacity="0.9"/>
    <circle cx="410" cy="150" r="2" opacity="0.7"/>
    <circle cx="470" cy="60" r="2.5" opacity="0.8"/>
    <circle cx="700" cy="110" r="3" opacity="0.9"/>
    <circle cx="750" cy="260" r="2" opacity="0.6"/>
    <circle cx="640" cy="200" r="2.5" opacity="0.7"/>
    <circle cx="520" cy="110" r="2" opacity="0.6"/>
    <circle cx="610" cy="330" r="3" opacity="0.8"/>
    <circle cx="500" cy="360" r="2" opacity="0.7"/>
    <circle cx="455" cy="290" r="3" opacity="0.85"/>
    <circle cx="380" cy="380" r="2.5" opacity="0.75"/>
    <circle cx="300" cy="320" r="2" opacity="0.7"/>
    <circle cx="220" cy="360" r="3" opacity="0.85"/>
    <circle cx="40" cy="330" r="2.5" opacity="0.7"/>
    <circle cx="120" cy="260" r="2" opacity="0.6"/>
    <circle cx="700" cy="400" r="3" opacity="0.8"/>
    <circle cx="760" cy="500" r="2.5" opacity="0.7"/>
    <circle cx="60" cy="520" r="3" opacity="0.8"/>
    <circle cx="330" cy="480" r="2" opacity="0.7"/>
    <circle cx="470" cy="470" r="2.5" opacity="0.75"/>
    <circle cx="560" cy="520" r="3" opacity="0.8"/>
    <circle cx="640" cy="610" r="2.5" opacity="0.8"/>
    <circle cx="120" cy="640" r="3" opacity="0.85"/>
    <circle cx="250" cy="690" r="2" opacity="0.7"/>
    <circle cx="560" cy="700" r="3" opacity="0.85"/>
    <circle cx="700" cy="740" r="2.5" opacity="0.8"/>
    <circle cx="90" cy="760" r="2" opacity="0.7"/>
    <circle cx="420" cy="420" r="2" opacity="0.6"/>
    <circle cx="180" cy="580" r="2" opacity="0.6"/>
    <circle cx="735" cy="620" r="2" opacity="0.6"/>
