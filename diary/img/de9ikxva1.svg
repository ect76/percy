  <!-- signature "P." -->
  <g fill="none" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round">
    <path d="M740 752 V772 M740 752 H748 Q755 752 755 759 Q755 766 748 766 H740"/>
  </g>
  <circle cx="762" cy="772" r="2.2" fill="#f4f1ea"/>
