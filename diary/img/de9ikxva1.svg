<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262f4a"/>
      <stop offset="0.6" stop-color="#5b5f7c"/>
      <stop offset="1" stop-color="#9a9aae"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="800" fill="url(#sky)"/>

  <!-- distant hills in fog -->
  <path d="M0 500 Q120 440 240 490 T480 480 T800 470 L800 560 L0 560 Z" fill="#7d8299" stroke="#1d1a17" stroke-width="2"/>

  <!-- bell tower -->
  <rect x="540" y="300" width="60" height="262" fill="#5a5566" stroke="#1d1a17" stroke-width="3"/>
  <rect x="532" y="220" width="76" height="82" fill="#4a4658" stroke="#1d1a17" stroke-width="3"/>
  <path d="M532 220 L570 130 L608 220 Z" fill="#3a3648" stroke="#1d1a17" stroke-width="3"/>
  <line x1="544" y1="240" x2="544" y2="290" stroke="#1d1a17" stroke-width="2"/>
  <line x1="596" y1="240" x2="596" y2="290" stroke="#1d1a17" stroke-width="2"/>
  <line x1="540" y1="330" x2="540" y2="520" stroke="#1d1a17" stroke-width="1.5" opacity="0.6"/>
  <line x1="600" y1="330" x2="600" y2="520" stroke="#1d1a17" stroke-width="1.5" opacity="0.6"/>

  <!-- clock face -->
  <circle cx="570" cy="262" r="28" fill="#e8e4d6" stroke="#1d1a17" stroke-width="3"/>
  <path d="M558 248 L566 259 L560 266 L571 277" fill="none" stroke="#1d1a17" stroke-width="1.5"/>
  <line x1="570" y1="262" x2="556" y2="268" stroke="#1d1a17" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 262 L584 249 Q588 245 584 241" fill="none" stroke="#1d1a17" stroke-width="3" stroke-linecap="round"/>
  <!-- snow veiling the clock -->
  <circle cx="576" cy="270" r="26" fill="#f4f6fb" opacity="0.45"/>

  <!-- cottage glow -->
  <circle cx="140" cy="485" r="110" fill="url(#glow)"/>

  <!-- cottage -->
  <rect x="70" y="420" width="220" height="180" fill="#8a6a55" stroke="#1d1a17" stroke-width="3"/>
  <path d="M56 420 L180 330 L304 420 Z" fill="#3d3a48" stroke="#1d1a17" stroke-width="3"/>
  <path d="M74 412 L180 336 L286 412 L270 408 L180 344 L90 408 Z" fill="#f4f6fb" stroke="#1d1a17" stroke-width="1.5"/>
  <rect x="110" y="460" width="60" height="50" fill="#f2c46d" stroke="#1d1a17" stroke-width="3"/>
  <line x1="140" y1="460" x2="140" y2="510" stroke="#1d1a17" stroke-width="2"/>
  <line x1="110" y1="485" x2="170" y2="485" stroke="#1d1a17" stroke-width="2"/>
  <rect x="210" y="500" width="40" height="100" fill="#3b2a22" stroke="#1d1a17" stroke-width="3"/>
  <circle cx="244" cy="552" r="2.5" fill="#f2c46d"/>

  <!-- ground and lane -->
  <rect x="0" y="560" width="800" height="240" fill="#aab2c4"/>
  <path d="M0 800 L800 800 L450 570 L350 570 Z" fill="#dfe4ee" stroke="#1d1a17" stroke-width="3"/>
  <path d="M0 800 L350 570 M800 800 L450 570" fill="none" stroke="#1d1a17" stroke-width="2" opacity="0.5"/>
