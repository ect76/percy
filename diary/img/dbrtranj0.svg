    <path d="M250 585 Q330 575 410 585" fill="none" stroke-width="3"/>
    <path d="M255 615 Q330 625 405 615" fill="none" stroke-width="3"/>
    <circle cx="285" cy="600" r="5" fill="#f2c94c"/>
    <circle cx="335" cy="600" r="5" fill="#f2c94c"/>
    <circle cx="380" cy="600" r="5" fill="#f2c94c"/>
