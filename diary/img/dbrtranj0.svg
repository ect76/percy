    <rect x="300" y="636" width="24" height="40" fill="#b4c4d2"/>
    <rect x="355" y="636" width="24" height="40" fill="#b4c4d2"/>
    <rect x="392" y="630" width="24" height="44" fill="#b4c4d2"/>
