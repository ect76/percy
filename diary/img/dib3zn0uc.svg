<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6470"/>
      <stop offset="0.6" stop-color="#9c9a98"/>
      <stop offset="1" stop-color="#bdb6a8"/>
    </linearGradient>
    <pattern id="cobbles" width="30" height="24" patternUnits="userSpaceOnUse">
      <rect width="30" height="24" fill="#7d7468"/>
      <ellipse cx="8" cy="7" rx="7" ry="5" fill="#8f8577" stroke="#3a332d" stroke-width="1.2"/>
      <ellipse cx="22" cy="6" rx="6" ry="4.5" fill="#6f665b" stroke="#3a332d" stroke-width="1.2"/>
      <ellipse cx="14" cy="19" rx="7" ry="4.5" fill="#877d70" stroke="#3a332d" stroke-width="1.2"/>
      <ellipse cx="28" cy="20" rx="4" ry="3.5" fill="#6f665b" stroke="#3a332d" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe3"/>

  <!-- sky -->
  <rect x="20" y="20" width="760" height="760" fill="url(#dusk)" stroke="#2a2622" stroke-width="2"/>

  <!-- far hills in fog -->
  <path d="M20 430 Q120 380 230 410 T460 420 T780 400 L780 470 L20 470 Z" fill="#7a817c" stroke="#2a2622" stroke-width="1.5"/>

  <!-- bell tower -->
  <polygon points="435,190 465,118 495,190" fill="#5f5b58" stroke="#2a2622" stroke-width="2"/>
  <rect x="440" y="186" width="52" height="260" fill="#8e8a86" stroke="#2a2622" stroke-width="2"/>
  <rect x="452" y="150" width="28" height="30" fill="#4a4644" stroke="#2a2622" stroke-width="1.5"/>
  <circle cx="466" cy="260" r="24" fill="#e9e4d6" stroke="#2a2622" stroke-width="2"/>
  <!-- cracks in the face -->
  <path d="M452 240 L460 252 L455 262 L468 276 L462 284" fill="none" stroke="#5a544e" stroke-width="1.3"/>
  <!-- crooked minute hand and hour hand -->
  <line x1="466" y1="260" x2="466" y2="244" stroke="#2a2622" stroke-width="3" stroke-linecap="round"/>
  <polyline points="466,260 471,241 478,244" fill="none" stroke="#2a2622" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="466" cy="260" r="2.5" fill="#2a2622"/>
  <!-- tower fog -->
  <rect x="425" y="230" width="90" height="120" fill="#e8e6e0" opacity="0.45"/>

  <!-- right wall beside lane -->
  <polygon points="650,800 430,440 470,430 800,520 800,800" fill="#6b7a6a" stroke="#2a2622" stroke-width="2"/>

  <!-- cottage -->
  <polygon points="230,380 330,430 330,650 230,680" fill="#b08e62" stroke="#2a2622" stroke-width="2"/>
  <polygon points="250,450 300,470 300,520 250,500" fill="#5b4a3e" stroke="#2a2622" stroke-width="1.5"/>
  <rect x="30" y="380" width="200" height="300" fill="#c9a77c" stroke="#2a2622" stroke-width="2"/>
  <polygon points="20,380 130,300 240,380" fill="#5b4a44" stroke="#2a2622" stroke-width="2"/>
  <rect x="70" y="440" width="60" height="70" fill="#f2c46d" stroke="#2a2622" stroke-width="2"/>
  <line x1="100" y1="440" x2="100" y2="510" stroke="#2a2622" stroke-width="2"/>
  <line x1="70" y1="475" x2="130" y2="475" stroke="#2a2622" stroke-width="2"/>
  <circle cx="100" cy="475" r="48" fill="#f2c46d" opacity="0.18"/>
  <rect x="150" y="520" width="50" height="160" fill="#4a3a30" stroke="#2a2622" stroke-width="2"/>
  <circle cx="190" cy="600" r="3" fill="#d9b25a"/>

  <!-- lane -->
  <polygon points="150,800 650,800 430,440 370,440" fill="url(#cobbles)" stroke="#2a2622" stroke-width="2"/>

  <!-- lamp post -->
  <line x1="300" y1="560" x2="300" y2="400" stroke="#2a2622" stroke-width="3"/>
  <circle cx="300" cy="392" r="26" fill="#f2c46d" opacity="0.22"/>
  <rect x="294" y="384" width="12" height="14" fill="#f2c46d" stroke="#2a2622" stroke-width="1.5"/>

  <!-- fog bands -->
  <rect x="20" y="250" width="760" height="50" fill="#e8e6e0" opacity="0.3"/>
  <rect x="20" y="380" width="760" height="60" fill="#e8e6e0" opacity="0.5"/>
  <rect x="20" y="430" width="760" height="80" fill="#e8e6e0" opacity="0.6"/>
  <rect x="20" y="540" width="760" height="70" fill="#e8e6e0" opacity="0.38"/>
  <rect x="20" y="680" width="760" height="60" fill="#e8e6e0" opacity="0.2"/>

  <!-- ink frame -->
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="#2a2622" stroke-width="2"/>

  <!-- signature -->
  <text x="752" y="780" font-family="serif" font-size="20" fill="#2a2622">P.</text>
</svg>