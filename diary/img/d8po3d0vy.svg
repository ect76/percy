<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#efe6d2"/>
  <!-- distant fog banks -->
  <rect x="0" y="90" width="800" height="60" fill="#d9d6cc" opacity="0.6"/>
  <rect x="0" y="180" width="800" height="50" fill="#e8e4d8" opacity="0.7"/>
  <rect x="0" y="470" width="800" height="40" fill="#e8e4d8" opacity="0.6"/>
  <!-- building body -->
  <rect x="180" y="230" width="440" height="330" fill="#c9a88a" stroke="#2a2320" stroke-width="3"/>
  <!-- roof -->
  <path d="M160 240 L400 110 L640 240 Z" fill="#7a5a4a" stroke="#2a2320" stroke-width="3" stroke-linejoin="round"/>
  <!-- roof tile lines -->
  <path d="M230 210 L400 118 L570 210" fill="none" stroke="#2a2320" stroke-width="1.5" opacity="0.6"/>
  <path d="M290 178 L400 118 L510 178" fill="none" stroke="#2a2320" stroke-width="1.5" opacity="0.6"/>
  <!-- weathervane pole -->
  <line x1="400" y1="110" x2="400" y2="78" stroke="#2a2320" stroke-width="3"/>
  <!-- kite-shaped weathervane -->
  <path d="M400 18 L428 50 L400 84 L372 50 Z" fill="#b5483a" stroke="#2a2320" stroke-width="3" stroke-linejoin="round"/>
  <line x1="372" y1="50" x2="428" y2="50" stroke="#2a2320" stroke-width="2"/>
  <path d="M400 84 Q392 96 404 104 Q414 112 402 120" fill="none" stroke="#2a2320" stroke-width="2"/>
  <path d="M400 84 L388 100 L400 96 Z" fill="#e2b04a" stroke="#2a2320" stroke-width="1.5"/>
  <path d="M400 84 L412 100 L400 96 Z" fill="#e2b04a" stroke="#2a2320" stroke-width="1.5"/>
  <!-- fascia board with faded KITES sign -->
  <rect x="200" y="250" width="400" height="58" fill="#f3e3b8" stroke="#2a2320" stroke-width="3"/>
  <rect x="200" y="250" width="400" height="58" fill="#b5483a" opacity="0.18"/>
  <text x="400" y="292" text-anchor="middle" font-family="serif" font-size="40" font-weight="bold" letter-spacing="10" fill="#8f5a4e" opacity="0.8">KITES</text>
  <!-- window frame -->
  <rect x="226" y="326" width="152" height="150" fill="#3b4a54" stroke="#2a2320" stroke-width="3"/>
  <!-- glass -->
  <rect x="236" y="336" width="132" height="130" fill="#b9cdd1" stroke="#2a2320" stroke-width="2"/>
  <!-- glass reflection -->
  <path d="M252 350 L280 350 L252 400 Z" fill="#ffffff" opacity="0.5"/>
  <!-- cracks -->
  <path d="M236 336 L290 390 L268 420 L300 466" fill="none" stroke="#2a2320" stroke-width="2"/>
  <path d="M290 390 L340 372 L368 386" fill="none" stroke="#2a2320" stroke-width="1.8"/>
  <path d="M268 420 L240 440" fill="none" stroke="#2a2320" stroke-width="1.5"/>
  <path d="M340 372 L346 340" fill="none" stroke="#2a2320" stroke-width="1.5"/>
  <!-- yellowed tape pieces, lifting corners -->
  <path d="M236 336 L270 336 L262 350 L236 352 Z" fill="#d9c27a" stroke="#2a2320" stroke-width="1"/>
  <path d="M338 414 L368 412 L368 442 L350 446 Z" fill="#d9c27a" stroke="#2a2320" stroke-width="1"/>
  <path d="M356 336 L368 336 L368 350 L354 346 Z" fill="#d9c27a" stroke="#2a2320" stroke-width="1"/>
  <!-- door -->
  <rect x="446" y="330" width="96" height="190" fill="#2f5a4a" stroke="#2a2320" stroke-width="3"/>
  <rect x="462" y="346" width="64" height="48" fill="#b9cdd1" stroke="#2a2320" stroke-width="2"/>
  <circle cx="526" cy="440" r="4" fill="#e2b04a" stroke="#2a2320" stroke-width="1.5"/>
  <!-- cream card beside door, curled -->
  <path d="M556 344 L598 340 L600 418 L560 422 Z" fill="#fbf6e6" stroke="#2a2320" stroke-width="2"/>
  <path d="M590 340 L600 352 L594 344 Z" fill="#e8dcc0" stroke="#2a2320" stroke-width="1"/>
  <line x1="564" y1="362" x2="592" y2="360" stroke="#2a2320" stroke-width="1.5"/>
  <line x1="564" y1="374" x2="592" y2="372" stroke="#2a2320" stroke-width="1.5"/>
  <line x1="564" y1="386" x2="588" y2="384" stroke="#2a2320" stroke-width="1.5"/>
  <line x1="564" y1="398" x2="590" y2="396" stroke="#2a2320" stroke-width="1.5"/>
  <!-- step -->
  <rect x="170" y="520" width="460" height="18" fill="#a09080" stroke="#2a2320" stroke-width="3"/>
  <!-- cobbles -->
  <g fill="#8f8a84" stroke="#2a2320" stroke-width="2">
    <ellipse cx="120" cy="570" rx="46" ry="18"/>
    <ellipse cx="240" cy="570" rx="46" ry="18"/>
    <ellipse cx="360" cy="570" rx="46" ry="18"/>
    <ellipse cx="480" cy="570" rx="46" ry="18"/>
    <ellipse cx="600" cy="570" rx="46" ry="18"/>
    <ellipse cx="700" cy="570" rx="46" ry="18"/>
    <ellipse cx="60" cy="620" rx="46" ry="18"/>
    <ellipse cx="180" cy="620" rx="46" ry="18"/>
    <ellipse cx="300" cy="620" rx="46" ry="18"/>
    <ellipse cx="420" cy="620" rx="46" ry="18"/>
    <ellipse cx="540" cy="620" rx="46" ry="18"/>
    <ellipse cx="660" cy="620" rx="46" ry="18"/>
    <ellipse cx="120" cy="675" rx="46" ry="18"/>
    <ellipse cx="240" cy="675" rx="46" ry="18"/>
    <ellipse cx="360" cy="675" rx="46" ry="18"/>
    <ellipse cx="480" cy="675" rx="46" ry="18"/>
    <ellipse cx="600" cy="675" rx="46" ry="18"/>
    <ellipse cx="720" cy="675" rx="46" ry="18"/>
    <ellipse cx="60" cy="730" rx="46" ry="18"/>
    <ellipse cx="180" cy="730" rx="46" ry="18"/>
    <ellipse cx="300" cy="730" rx="46" ry="18"/>
    <ellipse cx="420" cy="730" rx="46" ry="18"/>
    <ellipse cx="540" cy="730" rx="46" ry="18"/>
    <ellipse cx="660" cy="730" rx="46" ry="18"/>
  </g>
  <!-- foreground fog -->
  <rect x="0" y="600" width="800" height="70" fill="#efe6d2" opacity="0.55"/>
  <rect x="0" y="700" width="800" height="100" fill="#efe6d2" opacity="0.7"/>
  <!-- signature -->
  <text x="762" y="782" text-anchor="end" font-family="serif" font-size="22" fill="#2a2320">P.</text>
</svg>