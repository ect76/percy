<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe2"/>

  <!-- back wall -->
  <rect x="20" y="20" width="760" height="460" fill="#e6dcc4" stroke="#2b2a28" stroke-width="3"/>

  <!-- wainscot band -->
  <rect x="20" y="380" width="760" height="100" fill="#d6c9a8"/>
  <line x1="20" y1="380" x2="780" y2="380" stroke="#2b2a28" stroke-width="2"/>

  <!-- tall windows -->
  <g>
    <rect x="90" y="70" width="120" height="300" fill="#f7f3e0" stroke="#2b2a28" stroke-width="3"/>
    <line x1="150" y1="70" x2="150" y2="370" stroke="#2b2a28" stroke-width="3"/>
    <line x1="90" y1="160" x2="210" y2="160" stroke="#2b2a28" stroke-width="3"/>
    <rect x="250" y="70" width="120" height="300" fill="#f7f3e0" stroke="#2b2a28" stroke-width="3"/>
    <line x1="310" y1="70" x2="310" y2="370" stroke="#2b2a28" stroke-width="3"/>
    <line x1="250" y1="160" x2="370" y2="160" stroke="#2b2a28" stroke-width="3"/>
  </g>

  <!-- wall clock -->
  <g>
    <circle cx="560" cy="170" r="54" fill="#2b2a28"/>
    <circle cx="560" cy="170" r="46" fill="#f7f2e4"/>
    <line x1="560" y1="170" x2="560" y2="136" stroke="#2b2a28" stroke-width="4" stroke-linecap="round"/>
    <line x1="560" y1="170" x2="585" y2="180" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <circle cx="560" cy="170" r="4" fill="#2b2a28"/>
    <line x1="560" y1="130" x2="560" y2="138" stroke="#2b2a28" stroke-width="3"/>
    <line x1="520" y1="170" x2="528" y2="170" stroke="#2b2a28" stroke-width="3"/>
    <line x1="592" y1="170" x2="600" y2="170" stroke="#2b2a28" stroke-width="3"/>
    <line x1="560" y1="210" x2="560" y2="218" stroke="#2b2a28" stroke-width="3"/>
  </g>

  <!-- sink counter and cabinet -->
  <g>
    <rect x="590" y="388" width="170" height="16" fill="#8a7a64" stroke="#2b2a28" stroke-width="2"/>
    <rect x="598" y="404" width="154" height="100" fill="#c9b994" stroke="#2b2a28" stroke-width="2"/>
    <line x1="675" y1="404" x2="675" y2="504" stroke="#2b2a28" stroke-width="2"/>
    <rect x="620" y="330" width="50" height="58" fill="#f7f3e0" stroke="#2b2a28" stroke-width="2"/>
  </g>

  <!-- dented kettle on the sink -->
  <g>
    <ellipse cx="650" cy="352" rx="34" ry="28" fill="#7d8a92" stroke="#2b2a28" stroke-width="2.5"/>
    <path d="M612 346 Q598 332 604 318" fill="none" stroke="#2b2a28" stroke-width="4" stroke-linecap="round"/>
    <path d="M618 352 L600 340 L604 336 L622 348 Z" fill="#7d8a92" stroke="#2b2a28" stroke-width="2"/>
    <path d="M626 326 Q650 304 676 326" fill="none" stroke="#2b2a28" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="664" cy="343" rx="9" ry="6" fill="#5e6a71"/>
    <line x1="636" y1="366" x2="660" y2="372" stroke="#e6e0d0" stroke-width="2"/>
  </g>

  <!-- floor with bare boards -->
  <rect x="20" y="480" width="760" height="300" fill="#c4a574" stroke="#2b2a28" stroke-width="3"/>
  <g stroke="#8a6a44" stroke-width="2" fill="none">
    <line x1="20" y1="520" x2="780" y2="520"/>
    <line x1="20" y1="560" x2="780" y2="560"/>
    <line x1="20" y1="610" x2="780" y2="610"/>
    <line x1="20" y1="665" x2="780" y2="665"/>
    <line x1="20" y1="730" x2="780" y2="730"/>
  </g>
  <g stroke="#8a6a44" stroke-width="1.5" fill="none" opacity="0.6">
    <line x1="120" y1="520" x2="110" y2="560"/>
    <line x1="360" y1="560" x2="350" y2="610"/>
    <line x1="600" y1="520" x2="612" y2="560"/>
    <line x1="260" y1="610" x2="250" y2="665"/>
    <line x1="520" y1="665" x2="534" y2="730"/>
  </g>

  <!-- afternoon light patches from windows -->
  <polygon points="90,370 210,370 300,700 40,700" fill="#fff8d8" opacity="0.75"/>
  <polygon points="250,370 370,370 470,700 190,700" fill="#fff8d8" opacity="0.7"/>

  <!-- desk -->
  <g>
    <rect x="180" y="470" width="340" height="16" fill="#8a6a4a" stroke="#2b2a28" stroke-width="2.5"/>
    <rect x="200" y="486" width="14" height="114" fill="#6e5238" stroke="#2b2a28" stroke-width="2"/>
    <rect x="486" y="486" width="14" height="114" fill="#6e5238" stroke="#2b2a28" stroke-width="2"/>
  </g>

  <!-- green-backed ledger -->
  <g>
    <rect x="220" y="412" width="120" height="58" fill="#2f5d4a" stroke="#2b2a28" stroke-width="2.5"/>
    <rect x="220" y="412" width="12" height="58" fill="#234a3a" stroke="#2b2a28" stroke-width="2"/>
    <path d="M232 418 L238 430 L232 440" fill="none" stroke="#1b3b2e" stroke-width="1.5"/>
    <rect x="334" y="416" width="4" height="50" fill="#f7f3e0" stroke="#2b2a28" stroke-width="1"/>
    <rect x="246" y="424" width="84" height="32" fill="#f7f3e0" stroke="#2b2a28" stroke-width="1"/>
    <text x="250" y="434" font-size="6.5" fill="#2b2a28" font-family="serif">Attendance.</text>
    <text x="250" y="443" font-size="6.5" fill="#2b2a28" font-family="serif">Mossbrook School.</text>
    <text x="250" y="452" font-size="6.5" fill="#2b2a28" font-family="serif">Please sign on arrival.</text>
  </g>

  <!-- red tin -->
  <g>
    <rect x="400" y="430" width="56" height="40" fill="#b5532f" stroke="#2b2a28" stroke-width="2.5"/>
    <ellipse cx="428" cy="430" rx="28" ry="7" fill="#8e3a22" stroke="#2b2a28" stroke-width="2.5"/>
    <path d="M404 424 Q418 419 438 423" fill="none" stroke="#2b2a28" stroke-width="1.5"/>
    <rect x="400" y="444" width="56" height="14" fill="#f7f3e0" stroke="#2b2a28" stroke-width="1"/>
    <text x="428" y="454" font-size="6" text-anchor="middle" fill="#2b2a28" font-family="sans-serif">CLOCK OIL</text>
  </g>

  <!-- signature -->
  <text x="752" y="784" font-size="20" text-anchor="end" fill="#2b2a28" font-family="serif">P.</text>
</svg>