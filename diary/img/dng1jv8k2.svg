    <rect x="296" y="322" width="118" height="16" fill="#7d2e20"/>
    <rect x="318" y="356" width="74" height="50" fill="#efe6cf"/>
    <path d="M355 395 V374" fill="none" stroke-width="3"/>
    <path d="M355 378 Q340 366 332 372 Q342 384 355 378 Z" fill="#6f8f4e" stroke-width="2.5"/>
    <path d="M355 376 Q370 364 378 370 Q368 382 355 376 Z" fill="#6f8f4e" stroke-width="2.5"/>
  </g>
  <line x1="316" y1="346" x2="394" y2="346" stroke="#1d1a17" stroke-width="2" opacity="0.5"/>

  <!-- window -->
  <rect x="580" y="120" width="170" height="230" fill="#8f9ca4" stroke="#1d1a17" stroke-width="6"/>
  <g stroke="#1d1a17" stroke-width="4">
    <line x1="665" y1="120" x2="665" y2="350"/>
    <line x1="580" y1="235" x2="750" y2="235"/>
  </g>
  <g stroke="#e8f0f4" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="597" y1="140" x2="588" y2="162"/>
    <line x1="622" y1="150" x2="613" y2="174"/>
    <line x1="640" y1="132" x2="631" y2="156"/>
    <line x1="690" y1="144" x2="681" y2="168"/>
    <line x1="724" y1="128" x2="715" y2="152"/>
    <line x1="604" y1="200" x2="595" y2="222"/>
    <line x1="636" y1="190" x2="627" y2="214"/>
    <line x1="706" y1="196" x2="697" y2="220"/>
    <line x1="734" y1="262" x2="725" y2="286"/>
    <line x1="598" y1="268" x2="589" y2="292"/>
    <line x1="620" y1="300" x2="611" y2="324"/>
    <line x1="700" y1="290" x2="691" y2="314"/>
  </g>
  <rect x="565" y="350" width="200" height="14" fill="#a07850" stroke="#1d1a17" stroke-width="4"/>

