<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#d9d1c3"/>
  <rect x="0" y="0" width="800" height="90" fill="#e7e2d8" opacity="0.7"/>
  <rect x="0" y="690" width="800" height="110" fill="#5e5249"/>
  <g fill="#4a3f38" stroke="#1d1a17" stroke-width="2.5">
    <ellipse cx="60" cy="735" rx="34" ry="12"/>
    <ellipse cx="150" cy="760" rx="38" ry="13"/>
    <ellipse cx="260" cy="738" rx="30" ry="10"/>
    <ellipse cx="380" cy="770" rx="40" ry="12"/>
    <ellipse cx="500" cy="744" rx="34" ry="11"/>
    <ellipse cx="610" cy="772" rx="36" ry="12"/>
