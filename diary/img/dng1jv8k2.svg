    <rect x="115" y="430" width="380" height="14" fill="#a07850"/>
    <rect x="115" y="570" width="380" height="14" fill="#a07850"/>
  </g>
  <!-- faint ring marks on empty shelves -->
  <g fill="none" stroke="#6b4e33" stroke-width="2.5" opacity="0.7">
