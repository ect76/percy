    <line x1="612" y1="250" x2="606" y2="272"/>
    <line x1="700" y1="242" x2="694" y2="266"/>
  </g>

  <!-- P. signature -->
  <g fill="none" stroke="#1d1a17" stroke-width="3" stroke-linecap="round">
    <path d="M735 735 V775"/>
    <path d="M735 735 H750 Q762 735 762 747 Q762 759 750 759 H735"/>
  </g>
  <circle cx="770" cy="775" r="3" fill="#1d1a17"/>
