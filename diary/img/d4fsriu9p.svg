<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4f6f7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f4f6f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lanefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e9ec"/>
      <stop offset="1" stop-color="#fbfdfd"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#efe9dc"/>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="360" fill="#dde5ea"/>

  <!-- distant roofs in fog -->
  <polygon points="300,300 340,262 380,300" fill="#b9c3c9" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="420,300 462,256 500,300" fill="#b9c3c9" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="520" y="290" width="70" height="70" fill="#c5ced3" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="260" y="296" width="50" height="60" fill="#c5ced3" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- bell tower at end of lane -->
  <polygon points="378,150 401,96 424,150" fill="#6f6a62" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="380" y="148" width="42" height="30" fill="#8c8478" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="391" y="156" width="20" height="16" fill="#2b2b2b"/>
  <line x1="380" y1="160" x2="422" y2="160" stroke="#2b2b2b" stroke-width="1"/>
  <rect x="385" y="178" width="32" height="150" fill="#cfc8ba" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="396" y="200" width="10" height="20" fill="#4a463f"/>
  <rect x="396" y="250" width="10" height="20" fill="#4a463f"/>
  <rect x="388" y="300" width="24" height="28" fill="#5a4636" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- lane ground -->
  <polygon points="230,800 800,800 800,520 416,340 384,340 370,352" fill="url(#lanefade)" stroke="#2b2b2b" stroke-width="2"/>

  <!-- low stone wall on right of lane -->
  <polygon points="800,500 800,540 430,352 416,340 416,334" fill="#b8b0a2" stroke="#2b2b2b" stroke-width="2"/>

  <!-- cobbles peeking through snow -->
  <g fill="#b9b2a6" stroke="#2b2b2b" stroke-width="1.2">
    <ellipse cx="300" cy="380" rx="6" ry="3"/>
    <ellipse cx="330" cy="372" rx="5" ry="3"/>
    <ellipse cx="360" cy="390" rx="7" ry="3"/>
    <ellipse cx="270" cy="440" rx="9" ry="4"/>
    <ellipse cx="330" cy="430" rx="8" ry="4"/>
    <ellipse cx="395" cy="425" rx="7" ry="3"/>
    <ellipse cx="450" cy="420" rx="8" ry="3"/>
    <ellipse cx="240" cy="520" rx="12" ry="5"/>
    <ellipse cx="310" cy="500" rx="11" ry="5"/>
    <ellipse cx="380" cy="490" rx="10" ry="4"/>
    <ellipse cx="470" cy="480" rx="12" ry="5"/>
    <ellipse cx="560" cy="470" rx="13" ry="5"/>
    <ellipse cx="290" cy="600" rx="18" ry="7"/>
    <ellipse cx="400" cy="590" rx="16" ry="6"/>
    <ellipse cx="520" cy="620" rx="20" ry="7"/>
    <ellipse cx="660" cy="580" rx="22" ry="8"/>
    <ellipse cx="330" cy="720" rx="26" ry="9"/>
    <ellipse cx="480" cy="730" rx="28" ry="9"/>
    <ellipse cx="640" cy="700" rx="30" ry="10"/>
    <ellipse cx="380" cy="770" rx="34" ry="11"/>
    <ellipse cx="600" cy="775" rx="36" ry="12"/>
  </g>

  <!-- cottage wall (foreground left) -->
  <rect x="0" y="250" width="230" height="550" fill="#d8cdb8" stroke="#2b2b2b" stroke-width="2.5"/>
  <polygon points="0,240 120,196 240,236 240,262 0,262" fill="#5d6469" stroke="#2b2b2b" stroke-width="2.5"/>
  <polygon points="0,240 120,196 240,236 232,240 120,204 8,244" fill="#ffffff"/>

  <!-- window with lamp glow -->
  <rect x="30" y="330" width="62" height="74" fill="#f6e6a8" stroke="#2b2b2b" stroke-width="2.5"/>
  <line x1="61" y1="330" x2="61" y2="404" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="30" y1="367" x2="92" y2="367" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="22" y="404" width="78" height="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- door -->
  <rect x="120" y="430" width="84" height="210" fill="#5a4636" stroke="#2b2b2b" stroke-width="2.5"/>
  <circle cx="190" cy="540" r="4" fill="#c9a94b" stroke="#2b2b2b" stroke-width="1"/>
  <line x1="162" y1="430" x2="162" y2="640" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- doorstep -->
  <rect x="104" y="640" width="116" height="26" fill="#b5ad9f" stroke="#2b2b2b" stroke-width="2.5"/>
  <rect x="104" y="640" width="116" height="7" fill="#ffffff"/>
  <path d="M104 666 L80 800 L240 800 L220 666 Z" fill="#f7fbfc" stroke="#2b2b2b" stroke-width="2"/>

  <!-- fog bands -->
  <rect x="0" y="280" width="800" height="150" fill="url(#fog)"/>
  <rect x="0" y="380" width="800" height="120" fill="url(#fog)" opacity="0.7"/>

  <!-- foreground snow drift at door edge -->
  <path d="M230 800 Q260 760 240 720" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <!-- Percy's signature -->
  <path d="M752 790 V762 H762 Q770 762 770 770 Q770 778 762 778 H752" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="776" cy="790" r="2" fill="#2b2b2b"/>
</svg>