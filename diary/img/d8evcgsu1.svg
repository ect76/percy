<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4ecd8"/>
  <!-- far sky wash -->
  <rect x="0" y="0" width="800" height="330" fill="#dfe5e3"/>
  <!-- distant bell tower -->
  <g stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round">
    <rect x="352" y="250" width="40" height="130" fill="#c9cfcc"/>
    <path d="M346 250 L372 200 L398 250 Z" fill="#b7bfbb"/>
    <rect x="362" y="272" width="20" height="16" fill="#8d9893"/>
    <line x1="372" y1="200" x2="372" y2="180"/>
  </g>
  <!-- cottage -->
  <g stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round">
    <rect x="0" y="380" width="250" height="250" fill="#e8d3b0"/>
    <path d="M-10 385 L120 300 L260 385 Z" fill="#8a5a44"/>
    <rect x="30" y="430" width="34" height="34" fill="#5f7c8a"/>
    <line x1="47" y1="430" x2="47" y2="464"/>
    <rect x="150" y="470" width="60" height="160" fill="#6e4b36"/>
    <circle cx="200" cy="550" r="4" fill="#d9b34a" stroke="none"/>
  </g>
  <!-- village green -->
  <path d="M0 520 Q260 470 520 500 Q700 520 800 500 L800 800 L0 800 Z" fill="#a9bf86" stroke="#2b2b2b" stroke-width="3"/>
  <!-- pond -->
  <ellipse cx="470" cy="580" rx="170" ry="48" fill="#6f939f" stroke="#2b2b2b" stroke-width="3"/>
  <path d="M400 572 Q440 562 480 572 M520 596 Q560 588 590 598" fill="none" stroke="#3f5f6b" stroke-width="2"/>
  <!-- sign post and board -->
  <g stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round">
    <rect x="598" y="400" width="14" height="230" fill="#7a5638"/>
    <path d="M548 300 L620 282 L692 300 L620 316 Z" fill="#6b4a33"/>
    <rect x="555" y="326" width="130" height="78" rx="14" fill="#efe6c8" stroke="#4d7a3a" stroke-width="7"/>
    <path d="M575 350 L575 382 M575 350 L588 382 L601 350 M615 350 L615 382 M615 350 L640 382 M640 350 L640 382 M655 350 L655 382" fill="none" stroke="#3a3a3a" stroke-width="4"/>
  </g>
  <g fill="#5d8a45" stroke="#2b2b2b" stroke-width="1.5">
    <ellipse cx="596" cy="622" rx="16" ry="8"/>
    <ellipse cx="620" cy="626" rx="14" ry="7"/>
    <ellipse cx="612" cy="616" rx="9" ry="6"/>
  </g>
  <!-- foreground doorstep and cobbles -->
  <g stroke="#2b2b2b" stroke-width="2.5" fill="#bfb6a4">
    <rect x="0" y="630" width="260" height="30"/>
    <rect x="0" y="660" width="330" height="140" fill="#cfc5b0"/>
  </g>
  <g fill="none" stroke="#7d7463" stroke-width="2">
    <ellipse cx="60" cy="700" rx="26" ry="12"/>
    <ellipse cx="140" cy="730" rx="30" ry="13"/>
    <ellipse cx="220" cy="700" rx="26" ry="12"/>
    <ellipse cx="90" cy="770" rx="34" ry="14"/>
    <ellipse cx="250" cy="770" rx="30" ry="13"/>
    <ellipse cx="300" cy="700" rx="22" ry="10"/>
  </g>
  <!-- fog layers -->
  <g fill="#f4ecd8">
    <rect x="0" y="230" width="800" height="70" opacity="0.55"/>
    <rect x="0" y="330" width="800" height="90" opacity="0.5"/>
    <rect x="0" y="440" width="800" height="70" opacity="0.45"/>
    <rect x="0" y="540" width="800" height="60" opacity="0.4"/>
    <rect x="0" y="640" width="800" height="50" opacity="0.25"/>
    <ellipse cx="300" cy="320" rx="260" ry="40" opacity="0.5"/>
    <ellipse cx="700" cy="420" rx="200" ry="30" opacity="0.45"/>
    <ellipse cx="460" cy="520" rx="230" ry="26" opacity="0.4"/>
  </g>
  <!-- ink reinforcement of fog edges -->
  <g fill="none" stroke="#2b2b2b" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
    <path d="M40 300 Q120 290 200 304"/>
    <path d="M420 380 Q500 366 560 384"/>
    <path d="M700 470 Q760 462 800 474"/>
  </g>
  <!-- P. signature -->
  <g stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M752 760 L752 782 M752 760 L764 760 Q772 760 772 768 Q772 776 764 776 L752 776"/>
  </g>
  <circle cx="780" cy="782" r="2.5" fill="#2b2b2b"/>
</svg>