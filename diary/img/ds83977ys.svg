<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#f4ecd8"/>

  <!-- wall -->
  <rect x="20" y="40" width="760" height="520" fill="#e4d9bf" stroke="#2a2420" stroke-width="2.5"/>
  <g stroke="#cbbd9c" stroke-width="1" fill="none">
    <path d="M30 80 L770 80"/><path d="M30 120 L770 120"/><path d="M30 160 L770 160"/>
    <path d="M30 200 L770 200"/><path d="M30 240 L770 240"/><path d="M30 280 L770 280"/>
    <path d="M30 320 L770 320"/><path d="M30 360 L770 360"/><path d="M30 400 L770 400"/>
    <path d="M30 440 L770 440"/><path d="M30 480 L770 480"/><path d="M30 520 L770 520"/>
  </g>

  <!-- door frame at left -->
  <rect x="40" y="110" width="150" height="450" fill="#7b5a3c" stroke="#2a2420" stroke-width="2.5"/>
  <rect x="58" y="130" width="114" height="200" fill="#5c4129" stroke="#2a2420" stroke-width="2"/>
  <rect x="58" y="350" width="114" height="190" fill="#5c4129" stroke="#2a2420" stroke-width="2"/>
  <circle cx="172" cy="380" r="5" fill="#d9b35a" stroke="#2a2420" stroke-width="1.5"/>

  <!-- cork board -->
  <rect x="260" y="110" width="200" height="220" fill="#c9a06a" stroke="#2a2420" stroke-width="2.5"/>
  <g fill="#9c7444">
    <circle cx="275" cy="125" r="2"/><circle cx="310" cy="190" r="2"/><circle cx="400" cy="122" r="2"/>
    <circle cx="447" cy="200" r="2"/><circle cx="278" cy="290" r="2"/><circle cx="330" cy="318" r="2"/>
    <circle cx="420" cy="315" r="2"/><circle cx="360" cy="125" r="2"/><circle cx="452" cy="260" r="2"/>
    <circle cx="268" cy="240" r="2"/><circle cx="395" cy="250" r="2"/>
  </g>

  <!-- notice paper -->
  <path d="M285 140 L420 140 L435 158 L435 300 L285 300 Z" fill="#f7f1e1" stroke="#2a2420" stroke-width="2"/>
  <path d="M285 140 L420 140 L420 152 L285 152 Z" fill="#e3c978" opacity="0.8"/>
  <path d="M420 140 L435 158 L420 158 Z" fill="#e0d6bb" stroke="#2a2420" stroke-width="1.5"/>
  <g font-family="serif" font-size="11" fill="#2a2420">
    <text x="296" y="172" font-weight="bold">COLLECTIONS:</text>
    <text x="296" y="190">Mon, Wed, Fri, 10 a.m.</text>
    <text x="296" y="210">Parcels must be signed</text>
    <text x="296" y="224">for.</text>
    <text x="296" y="244">Please ring the bell if</text>
    <text x="296" y="258">the counter is</text>
    <text x="296" y="272">unattended.</text>
  </g>
  <!-- pins -->
  <circle cx="300" cy="146" r="4" fill="#b5523b" stroke="#2a2420" stroke-width="1"/>
  <circle cx="420" cy="148" r="4" fill="#b5523b" stroke="#2a2420" stroke-width="1"/>

  <!-- counter top -->
  <rect x="180" y="430" width="500" height="18" fill="#a57a4f" stroke="#2a2420" stroke-width="2.5"/>
  <!-- counter front -->
  <rect x="180" y="448" width="500" height="190" fill="#8a6a4a" stroke="#2a2420" stroke-width="2.5"/>
  <g stroke="#5c4129" stroke-width="2" fill="none">
    <rect x="210" y="475" width="130" height="140"/>
    <rect x="360" y="475" width="130" height="140"/>
    <rect x="510" y="475" width="130" height="140"/>
  </g>

  <!-- bell: dome -->
  <path d="M565 428 Q565 372 600 372 Q635 372 635 428 Z" fill="#8b6a3a" stroke="#2a2420" stroke-width="2.5"/>
  <path d="M585 412 Q586 386 600 380 Q606 386 606 412 Z" fill="#d9b35a" opacity="0.85"/>
  <!-- bell base -->
  <rect x="555" y="424" width="90" height="10" rx="2" fill="#6e5230" stroke="#2a2420" stroke-width="2"/>
  <!-- push-button -->
  <ellipse cx="600" cy="372" rx="14" ry="5" fill="#7a5526" stroke="#2a2420" stroke-width="1.5"/>
  <ellipse cx="600" cy="371" rx="7" ry="2.5" fill="#e8c46a"/>

  <!-- fog -->
  <g fill="#d6d4cc" opacity="0.75">
    <ellipse cx="200" cy="650" rx="260" ry="34"/>
    <ellipse cx="560" cy="690" rx="300" ry="38"/>
    <ellipse cx="330" cy="740" rx="320" ry="40"/>
  </g>
  <g fill="#ebe9e2" opacity="0.8">
    <ellipse cx="420" cy="620" rx="240" ry="22"/>
    <ellipse cx="120" cy="720" rx="200" ry="26"/>
  </g>

  <!-- signature -->
  <text x="760" y="780" font-family="serif" font-size="14" fill="#2a2420" text-anchor="end">P.</text>
</svg>