<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect width="800" height="800" fill="#f4f1ea"/>
  <!-- distant sky wash -->
  <rect x="0" y="0" width="800" height="330" fill="#dfe3e4"/>

  <!-- bell tower -->
  <rect x="600" y="230" width="110" height="230" fill="#c9c2b4" stroke="#2a2a2a" stroke-width="4"/>
  <rect x="615" y="170" width="80" height="60" fill="#b8b0a0" stroke="#2a2a2a" stroke-width="4"/>
  <path d="M615 230 Q655 200 695 230" fill="none" stroke="#2a2a2a" stroke-width="3"/>
  <path d="M605 170 L655 110 L705 170 Z" fill="#7d6f63" stroke="#2a2a2a" stroke-width="4"/>
  <rect x="628" y="186" width="16" height="30" fill="#4a4a4a"/>
  <rect x="666" y="186" width="16" height="30" fill="#4a4a4a"/>
  <!-- clock face -->
  <circle cx="655" cy="290" r="40" fill="#f7f3e6" stroke="#2a2a2a" stroke-width="4"/>
  <path d="M655 290 L678 303" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round"/>
  <!-- crooked minute hand -->
  <path d="M655 290 L668 254 L676 256" fill="none" stroke="#2a2a2a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crack in face -->
  <path d="M637 268 L648 281 L643 294 L658 307 L656 318" fill="none" stroke="#2a2a2a" stroke-width="2"/>

  <!-- village green -->
  <polygon points="250,460 800,450 800,560 250,535" fill="#a9bb86" stroke="#2a2a2a" stroke-width="3"/>
  <!-- faded trees on green -->
  <ellipse cx="380" cy="430" rx="34" ry="42" fill="#8fa473" opacity="0.7"/>
  <ellipse cx="520" cy="425" rx="28" ry="36" fill="#8fa473" opacity="0.6"/>
  <rect x="377" y="460" width="6" height="20" fill="#6b5a48" opacity="0.7"/>
  <rect x="517" y="455" width="6" height="22" fill="#6b5a48" opacity="0.7"/>

  <!-- cottage -->
  <rect x="80" y="380" width="220" height="190" fill="#d9c3a0" stroke="#2a2a2a" stroke-width="4"/>
  <polygon points="60,385 190,290 320,385" fill="#7a5a4a" stroke="#2a2a2a" stroke-width="4" stroke-linejoin="round"/>
  <rect x="235" y="305" width="22" height="50" fill="#8a7060" stroke="#2a2a2a" stroke-width="3"/>
  <rect x="100" y="420" width="42" height="40" fill="#cfe0e6" stroke="#2a2a2a" stroke-width="3"/>
  <path d="M121 420 V460 M100 440 H142" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="165" y="470" width="50" height="100" fill="#5b4636" stroke="#2a2a2a" stroke-width="4"/>
  <circle cx="206" cy="522" r="3" fill="#e0c060"/>

  <!-- pond -->
  <ellipse cx="450" cy="600" rx="160" ry="48" fill="#6f8fa0" stroke="#2a2a2a" stroke-width="4"/>
  <ellipse cx="420" cy="596" rx="60" ry="8" fill="none" stroke="#c8d8df" stroke-width="2"/>
  <ellipse cx="490" cy="612" rx="40" ry="5" fill="none" stroke="#c8d8df" stroke-width="2"/>

  <!-- foreground doorstep and cobbles -->
  <rect x="150" y="566" width="80" height="14" fill="#9a958c" stroke="#2a2a2a" stroke-width="3"/>
  <g fill="none" stroke="#2a2a2a" stroke-width="2" opacity="0.8">
    <path d="M0 650 Q60 640 120 652 T240 650 T360 656 T480 650 T600 656 T720 650 T800 654"/>
    <path d="M30 720 Q90 712 150 724 T270 720 T390 726 T510 720 T630 726 T800 720"/>
    <path d="M60 780 Q130 772 200 784 T340 780 T480 786 T620 780 T800 784"/>
    <path d="M100 680 L130 700 M300 690 L330 672 M520 700 L560 688 M680 740 L700 764 M220 750 L250 770"/>
  </g>

  <!-- fog bands -->
  <rect x="0" y="200" width="800" height="90" fill="#e6e7e3" opacity="0.55"/>
  <rect x="520" y="250" width="280" height="90" fill="#eceeea" opacity="0.7"/>
  <ellipse cx="300" cy="500" rx="260" ry="26" fill="#eceeea" opacity="0.6"/>
  <ellipse cx="640" cy="390" rx="200" ry="30" fill="#eceeea" opacity="0.65"/>
  <rect x="0" y="520" width="800" height="50" fill="#e9ebe7" opacity="0.5"/>
  <rect x="0" y="600" width="800" height="40" fill="#e9ebe7" opacity="0.35"/>

  <!-- signature P. -->
  <g fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M735 735 V770 M735 735 H750 Q760 735 760 745 Q760 755 750 755 H735"/>
  </g>
  <circle cx="770" cy="768" r="2.5" fill="#2a2a2a"/>
</svg>