<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efeae0"/>

  <!-- sky and distant fog -->
  <rect x="130" y="90" width="540" height="350" fill="#cfd9de"/>
  <rect x="130" y="250" width="540" height="70" fill="#e4ecef" opacity="0.7"/>
  <rect x="130" y="330" width="540" height="60" fill="#f1f5f6" opacity="0.8"/>

  <!-- distant cottages, softened by fog -->
  <g fill="#a7aeb2" stroke="#1d1d1d" stroke-width="1.5" opacity="0.6">
    <rect x="150" y="360" width="60" height="80"/>
    <polygon points="150,360 180,335 210,360"/>
    <rect x="215" y="380" width="50" height="60"/>
    <polygon points="215,380 240,360 265,380"/>
    <rect x="520" y="370" width="55" height="70"/>
    <polygon points="520,370 547,348 575,370"/>
    <rect x="580" y="388" width="45" height="52"/>
  </g>

  <!-- bell tower at end of lane -->
  <g stroke="#1d1d1d" stroke-width="2.5" stroke-linejoin="round">
    <rect x="378" y="250" width="44" height="190" fill="#8d7b6a"/>
    <rect x="372" y="212" width="56" height="42" fill="#6d5d50"/>
    <polygon points="370,214 400,158 430,214" fill="#4f5b62"/>
    <rect x="384" y="222" width="10" height="22" fill="#2b2b2b"/>
    <rect x="406" y="222" width="10" height="22" fill="#2b2b2b"/>
    <circle cx="400" cy="290" r="13" fill="#f4efe4"/>
    <path d="M400 290 V281 M400 290 L408 296" fill="none" stroke="#1d1d1d" stroke-width="2"/>
    <rect x="382" y="330" width="36" height="60" fill="#5d4f44"/>
    <rect x="370" y="436" width="60" height="12" fill="#5f5850"/>
  </g>
  <!-- snow on spire and belfry -->
  <path d="M378 212 L400 170 L422 212 Q400 206 378 212 Z" fill="#f7fafb" opacity="0.9"/>
  <path d="M372 212 H428 V218 Q400 212 372 218 Z" fill="#f7fafb"/>

  <!-- lane: cobbled and snowy, converging to the tower -->
  <polygon points="130,700 670,700 430,440 370,440" fill="#8b8074" stroke="#1d1d1d" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- lane edges with snow banks -->
  <path d="M130 700 L370 440 L372 446 L140 700 Z" fill="#f4f7f8" stroke="#1d1d1d" stroke-width="1.5"/>
  <path d="M670 700 L430 440 L428 446 L660 700 Z" fill="#f4f7f8" stroke="#1d1d1d" stroke-width="1.5"/>

  <!-- cobble rows (perspective) -->
  <g fill="none" stroke="#2b2b2b" stroke-width="1.5" opacity="0.8">
    <ellipse cx="300" cy="470" rx="14" ry="5"/>
    <ellipse cx="350" cy="472" rx="12" ry="4"/>
    <ellipse cx="448" cy="474" rx="13" ry="4.5"/>
    <ellipse cx="500" cy="470" rx="12" ry="4"/>
    <ellipse cx="260" cy="520" rx="22" ry="7"/>
    <ellipse cx="340" cy="526" rx="20" ry="6"/>
    <ellipse cx="420" cy="524" rx="20" ry="6"/>
    <ellipse cx="530" cy="520" rx="22" ry="7"/>
    <ellipse cx="200" cy="600" rx="34" ry="10"/>
    <ellipse cx="320" cy="610" rx="30" ry="9"/>
    <ellipse cx="470" cy="610" rx="30" ry="9"/>
    <ellipse cx="600" cy="600" rx="34" ry="10"/>
    <ellipse cx="250" cy="670" rx="48" ry="12"/>
    <ellipse cx="420" cy="676" rx="46" ry="12"/>
    <ellipse cx="560" cy="668" rx="44" ry="11"/>
  </g>

  <!-- snow patches on cobbles -->
  <g fill="#f4f7f8" opacity="0.9">
    <ellipse cx="330" cy="520" rx="30" ry="5"/>
    <ellipse cx="470" cy="560" rx="40" ry="6"/>
    <ellipse cx="260" cy="640" rx="50" ry="8"/>
    <ellipse cx="560" cy="650" rx="44" ry="7"/>
    <ellipse cx="400" cy="600" rx="28" ry="5"/>
  </g>

  <!-- cottage doorway: left and right jambs, lintel, threshold -->
  <polygon points="0,0 130,90 130,700 0,800" fill="#b9a58c" stroke="#1d1d1d" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="800,0 670,90 670,700 800,800" fill="#a8957c" stroke="#1d1d1d" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="0,0 800,0 670,90 130,90" fill="#7a6a5a" stroke="#1d1d1d" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="0,800 800,800 670,700 130,700" fill="#6b6259" stroke="#1d1d1d" stroke-width="3" stroke-linejoin="round"/>

  <!-- stone texture on jambs -->
  <g fill="none" stroke="#1d1d1d" stroke-width="1.2" opacity="0.5">
    <path d="M10 150 H110 M40 230 H120 M10 330 H110 M30 430 H120 M10 540 H110"/>
    <path d="M700 160 H790 M680 250 H790 M700 350 H790 M690 460 H790 M700 580 H790"/>
  </g>

  <!-- fog bank in front of the lane's far end -->
  <rect x="130" y="400" width="540" height="50" fill="#f1f5f6" opacity="0.75"/>
  <rect x="130" y="440" width="540" height="30" fill="#f7fafb" opacity="0.5"/>

  <!-- falling rain -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.7" stroke-linecap="round">
    <line x1="190" y1="120" x2="172" y2="160"/>
    <line x1="260" y1="100" x2="242" y2="140"/>
    <line x1="330" y1="130" x2="312" y2="170"/>
    <line x1="520" y1="110" x2="502" y2="150"/>
    <line x1="590" y1="140" x2="572" y2="180"/>
    <line x1="640" y1="200" x2="622" y2="240"/>
    <line x1="560" y1="260" x2="542" y2="300"/>
    <line x1="220" y1="260" x2="202" y2="300"/>
    <line x1="290" y1="330" x2="272" y2="370"/>
    <line x1="600" y1="420" x2="582" y2="460"/>
    <line x1="240" y1="540" x2="222" y2="580"/>
    <line x1="500" y1="580" x2="482" y2="620"/>
    <line x1="620" y1="560" x2="602" y2="600"/>
    <line x1="170" y1="640" x2="152" y2="680"/>
  </g>

  <!-- small signature "P." drawn as paths -->
  <g fill="none" stroke="#1d1d1d" stroke-width="2.5" stroke-linecap="round">
    <path d="M758 762 V786 M758 762 H766 A6 6 0 0 1 766 774 H758"/>
  </g>
  <circle cx="774" cy="786" r="2" fill="#1d1d1d"/>
</svg>