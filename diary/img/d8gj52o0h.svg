<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <clipPath id="teapotClip">
      <circle cx="600" cy="405" r="56"/>
    </clipPath>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe3"/>

  <!-- distant fog bank -->
  <rect x="0" y="330" width="800" height="90" fill="#dcd6c8"/>
  <rect x="0" y="360" width="800" height="50" fill="#e9e4d7"/>

  <!-- left building -->
  <rect x="0" y="110" width="380" height="490" fill="#c9b8a0" stroke="#2b2622" stroke-width="3"/>
  <rect x="0" y="110" width="380" height="18" fill="#8d7a63" stroke="#2b2622" stroke-width="2"/>

  <!-- café window -->
  <rect x="120" y="250" width="180" height="170" fill="#5b4a3a" stroke="#2b2622" stroke-width="4"/>
  <rect x="128" y="258" width="164" height="154" fill="#efe2b8"/>
  <!-- counter -->
  <rect x="128" y="360" width="164" height="52" fill="#8a6240" stroke="#2b2622" stroke-width="2"/>
  <line x1="128" y1="360" x2="292" y2="360" stroke="#2b2622" stroke-width="2"/>
  <!-- nail -->
  <line x1="210" y1="248" x2="210" y2="256" stroke="#2b2622" stroke-width="3"/>

  <!-- crooked clock on nail -->
  <g transform="rotate(-9 210 300)">
    <circle cx="210" cy="300" r="46" fill="#7a4a26" stroke="#2b2622" stroke-width="3"/>
    <circle cx="210" cy="300" r="36" fill="#ffffff" stroke="#2b2622" stroke-width="2"/>
    <line x1="210" y1="300" x2="210" y2="274" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <line x1="210" y1="300" x2="226" y2="300" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="210" cy="300" r="3" fill="#111"/>
  </g>

  <!-- right building -->
  <rect x="640" y="110" width="160" height="490" fill="#b9a88c" stroke="#2b2622" stroke-width="3"/>
  <rect x="640" y="110" width="160" height="18" fill="#8d7a63" stroke="#2b2622" stroke-width="2"/>

  <!-- bracket for teapot sign -->
  <line x1="640" y1="290" x2="500" y2="290" stroke="#2b2622" stroke-width="6" stroke-linecap="round"/>
  <line x1="640" y1="340" x2="560" y2="290" stroke="#2b2622" stroke-width="4" stroke-linecap="round"/>

  <!-- chains -->
  <line x1="545" y1="290" x2="552" y2="352" stroke="#2b2622" stroke-width="2"/>
  <line x1="575" y1="290" x2="572" y2="352" stroke="#2b2622" stroke-width="2"/>

  <!-- teapot sign -->
  <path d="M552 398 L522 352 L508 356 L518 368 L546 418 Z" fill="#ffffff" stroke="#2b2622" stroke-width="3" stroke-linejoin="round"/>
  <path d="M519 352 L512 362 L518 366 Z" fill="#c9b8a0"/>
  <path d="M648 380 Q686 405 648 432" fill="none" stroke="#2b2622" stroke-width="9" stroke-linecap="round"/>
  <circle cx="600" cy="405" r="56" fill="#ffffff" stroke="#2b2622" stroke-width="3"/>
  <g clip-path="url(#teapotClip)">
    <rect x="540" y="392" width="120" height="18" fill="#2d5fa0"/>
  </g>
  <circle cx="600" cy="405" r="56" fill="none" stroke="#2b2622" stroke-width="3"/>
  <!-- lid -->
  <g transform="rotate(-6 600 352)">
    <ellipse cx="600" cy="352" rx="24" ry="7" fill="#ffffff" stroke="#2b2622" stroke-width="3"/>
    <circle cx="600" cy="340" r="5" fill="#2b2622"/>
  </g>
  <!-- ink highlight -->
  <path d="M575 380 Q580 372 590 370" fill="none" stroke="#2b2622" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- cobbled lane -->
  <polygon points="0,800 800,800 540,600 260,600" fill="#b5aa98" stroke="#2b2622" stroke-width="3"/>
  <g fill="#a39782" stroke="#2b2622" stroke-width="1.5">
    <ellipse cx="380" cy="630" rx="22" ry="8"/>
    <ellipse cx="330" cy="660" rx="28" ry="10"/>
    <ellipse cx="430" cy="665" rx="26" ry="9"/>
    <ellipse cx="290" cy="705" rx="34" ry="12"/>
    <ellipse cx="400" cy="715" rx="36" ry="12"/>
    <ellipse cx="500" cy="700" rx="30" ry="11"/>
    <ellipse cx="200" cy="760" rx="46" ry="16"/>
    <ellipse cx="350" cy="765" rx="44" ry="15"/>
    <ellipse cx="520" cy="760" rx="42" ry="15"/>
    <ellipse cx="660" cy="770" rx="60" ry="20"/>
    <ellipse cx="90" cy="775" rx="70" ry="22"/>
  </g>

  <!-- fog over lane and base of buildings -->
  <rect x="0" y="560" width="800" height="60" fill="#f4efe3" opacity="0.55"/>
  <rect x="0" y="600" width="800" height="40" fill="#f4efe3" opacity="0.35"/>

  <!-- signature -->
  <text x="752" y="782" font-size="22" fill="#2b2622">P.</text>
</svg>