<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3a4d"/>
      <stop offset="0.6" stop-color="#6b6f7a"/>
      <stop offset="1" stop-color="#c79a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="800" fill="url(#dusk)"/>

  <!-- distant rooftops in fog -->
  <path d="M0 400 L60 360 L90 372 L140 330 L170 350 L230 318 L280 355 L340 340 L380 372 L440 348 L500 368 L560 332 L620 360 L690 330 L740 356 L800 340 L800 430 L0 430 Z" fill="#4a5262" opacity="0.8"/>
  <path d="M0 420 L40 396 L110 410 L180 384 L260 408 L330 390 L410 414 L490 392 L570 412 L650 388 L730 410 L800 396 L800 440 L0 440 Z" fill="#363e4e" opacity="0.9"/>

  <!-- lane, receding to vanishing point -->
  <path d="M0 800 L800 800 L800 470 L440 440 L380 440 L0 640 Z" fill="#5a5651" stroke="#221e1a" stroke-width="3"/>
  <!-- cobbles -->
  <g fill="none" stroke="#2f2b27" stroke-width="2" opacity="0.8">
    <ellipse cx="120" cy="720" rx="22" ry="8"/>
    <ellipse cx="260" cy="760" rx="28" ry="9"/>
    <ellipse cx="420" cy="735" rx="20" ry="7"/>
    <ellipse cx="560" cy="690" rx="14" ry="5"/>
    <ellipse cx="60" cy="660" rx="14" ry="5"/>
    <ellipse cx="200" cy="640" rx="12" ry="4"/>
    <ellipse cx="330" cy="600" rx="9" ry="3"/>
    <ellipse cx="470" cy="580" rx="8" ry="3"/>
    <ellipse cx="640" cy="620" rx="10" ry="4"/>
    <ellipse cx="700" cy="760" rx="30" ry="10"/>
  </g>

  <!-- left cottage wall, bare plaster -->
  <path d="M0 120 L300 260 L300 560 L0 720 Z" fill="#cbbd9f" stroke="#2a2420" stroke-width="4"/>
  <!-- faint pencil frame for a future painting -->
  <path d="M70 250 L230 325 L230 500 L70 560 Z" fill="none" stroke="#6d6253" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- pencil sketch of hills and snow inside the frame -->
  <g fill="none" stroke="#7d7060" stroke-width="2" opacity="0.7">
    <path d="M85 470 Q130 410 170 450 Q200 425 225 455"/>
    <path d="M90 520 Q150 480 220 505"/>
  </g>
  <!-- wall stone seams -->
  <g fill="none" stroke="#a89a82" stroke-width="2">
    <path d="M10 180 L290 310"/>
    <path d="M10 260 L290 390"/>
    <path d="M10 340 L290 470"/>
    <path d="M10 420 L290 550"/>
    <path d="M10 500 L290 630"/>
  </g>
  <!-- left wall shadow edge -->
  <path d="M0 120 L40 138 L40 700 L0 720 Z" fill="#8f826c" opacity="0.5"/>

  <!-- right cottage wall -->
  <path d="M800 80 L540 250 L540 600 L800 760 Z" fill="#8a7a6a" stroke="#221e1a" stroke-width="4"/>
  <!-- right cottage lit window -->
  <path d="M610 370 L670 384 L670 446 L610 432 Z" fill="#f2c77a" stroke="#221e1a" stroke-width="3"/>
  <circle cx="640" cy="410" r="90" fill="url(#glow)"/>
  <path d="M640 370 L640 440" stroke="#221e1a" stroke-width="2"/>

  <!-- lamp post -->
  <path d="M470 690 L470 420" stroke="#1d1a17" stroke-width="6" stroke-linecap="round"/>
  <path d="M458 426 L482 426 L478 410 L462 410 Z" fill="#2a2622"/>
  <circle cx="470" cy="418" r="60" fill="url(#glow)"/>
  <circle cx="470" cy="418" r="6" fill="#ffe7a8"/>

  <!-- fog bands -->
  <rect x="0" y="430" width="800" height="36" fill="#dfe3e8" opacity="0.22"/>
  <rect x="0" y="500" width="800" height="50" fill="#dfe3e8" opacity="0.18"/>
  <rect x="0" y="600" width="800" height="70" fill="#e6e9ee" opacity="0.14"/>
  <rect x="0" y="330" width="800" height="28" fill="#dfe3e8" opacity="0.16"/>

  <!-- falling snow -->
  <g fill="#f4f6f8" opacity="0.85">
    <circle cx="150" cy="200" r="3"/>
    <circle cx="210" cy="140" r="2.5"/>
    <circle cx="330" cy="90" r="3"/>
    <circle cx="410" cy="200" r="2"/>
    <circle cx="520" cy="130" r="3"/>
    <circle cx="610" cy="210" r="2.5"/>
    <circle cx="700" cy="120" r="3"/>
    <circle cx="90" cy="90" r="2"/>
    <circle cx="260" cy="250" r="2"/>
    <circle cx="360" cy="330" r="2.5"/>
    <circle cx="560" cy="500" r="2"/>
    <circle cx="730" cy="560" r="3"/>
    <circle cx="180" cy="580" r="2.5"/>
    <circle cx="300" cy="650" r="2"/>
    <circle cx="640" cy="700" r="2.5"/>
  </g>

  <!-- signature "P." in bottom-right corner -->
  <g fill="none" stroke="#f1ece2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M752 748 L752 778 M752 748 L764 748 Q772 748 772 756 Q772 764 764 764 L752 764"/>
  </g>
  <circle cx="780" cy="778" r="2.5" fill="#f1ece2"/>
</svg>