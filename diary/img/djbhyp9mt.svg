<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#efe9dc"/>
  <!-- wall -->
  <rect x="60" y="80" width="680" height="560" fill="#d9d2c3" stroke="#3a3530" stroke-width="4"/>
  <!-- bare shelf brackets and shelves -->
  <g stroke="#3a3530" stroke-width="3" fill="#8a6a4a">
    <rect x="110" y="250" width="260" height="14"/>
    <rect x="110" y="370" width="260" height="14"/>
    <rect x="130" y="264" width="10" height="26" fill="#6b5238"/>
    <rect x="340" y="264" width="10" height="26" fill="#6b5238"/>
    <rect x="130" y="384" width="10" height="26" fill="#6b5238"/>
    <rect x="340" y="384" width="10" height="26" fill="#6b5238"/>
  </g>
  <!-- drip cup: closed top, no spout, on wet shelf -->
  <g stroke="#3a3530" stroke-width="3">
    <rect x="220" y="300" width="70" height="70" fill="#b7bcc0"/>
    <ellipse cx="255" cy="300" rx="35" ry="6" fill="#8e979e"/>
    <ellipse cx="255" cy="370" rx="42" ry="6" fill="#5f7385" opacity="0.6"/>
  </g>
  <!-- wet marks on shelf -->
  <g fill="#5f7385" opacity="0.35">
    <ellipse cx="180" cy="378" rx="18" ry="3"/>
    <ellipse cx="310" cy="377" rx="12" ry="2.5"/>
  </g>
  <!-- tap and drip above sink -->
  <g stroke="#3a3530" stroke-width="3">
    <rect x="536" y="340" width="20" height="70" fill="#9aa3aa"/>
    <path d="M556 384 H580 V398 H556 Z" fill="#9aa3aa"/>
    <path d="M547 408 C540 422 540 430 547 436 C554 430 554 422 547 408 Z" fill="#5f7385"/>
  </g>
  <!-- counter -->
  <g stroke="#3a3530" stroke-width="3">
    <rect x="80" y="520" width="640" height="26" fill="#a89070"/>
    <rect x="80" y="546" width="640" height="94" fill="#7d6a52"/>
    <ellipse cx="548" cy="530" rx="88" ry="12" fill="#4d5b66"/>
  </g>
  <!-- rain -->
  <g stroke="#6b7b8a" stroke-width="2" opacity="0.45" stroke-linecap="round">
    <line x1="150" y1="110" x2="130" y2="150"/>
    <line x1="260" y1="100" x2="240" y2="140"/>
    <line x1="380" y1="120" x2="360" y2="160"/>
    <line x1="470" y1="95" x2="450" y2="135"/>
    <line x1="640" y1="110" x2="620" y2="150"/>
    <line x1="700" y1="200" x2="680" y2="240"/>
    <line x1="190" y1="200" x2="170" y2="236"/>
    <line x1="700" y1="300" x2="684" y2="334"/>
    <line x1="90" y1="460" x2="72" y2="496"/>
    <line x1="720" y1="460" x2="702" y2="496"/>
  </g>
  <!-- fog -->
  <g fill="#f4f1ea" opacity="0.5">
    <ellipse cx="400" cy="640" rx="420" ry="40"/>
    <ellipse cx="60" cy="400" rx="50" ry="200"/>
  </g>
  <text x="752" y="784" font-size="22" fill="#3a3530" text-anchor="end">P.</text>
</svg>