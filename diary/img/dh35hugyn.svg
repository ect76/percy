<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e0e4"/>
      <stop offset="1" stop-color="#b9c4ca"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f5"/>
      <stop offset="0.5" stop-color="#9aa3a9"/>
      <stop offset="1" stop-color="#e6eaec"/>
    </linearGradient>
  </defs>

  <!-- paper and fog background -->
  <rect x="0" y="0" width="800" height="800" fill="url(#fog)"/>

  <!-- doorway frame -->
  <path d="M40 60 H760 V780 H40 Z" fill="none" stroke="#3b2a1e" stroke-width="10"/>
  <path d="M60 80 H740 V760 H60 Z" fill="#e9dfcb" stroke="#3b2a1e" stroke-width="3"/>

  <!-- back wall tiles -->
  <rect x="60" y="80" width="680" height="380" fill="#efe6d2"/>
  <g stroke="#cbbd9f" stroke-width="2" fill="none">
    <path d="M60 140 H740 M60 200 H740 M60 260 H740 M60 320 H740 M60 380 H740 M60 440 H740"/>
    <path d="M160 80 V460 M260 80 V460 M360 80 V460 M460 80 V460 M560 80 V460 M660 80 V460"/>
  </g>

  <!-- window with fog outside, top left -->
  <rect x="90" y="100" width="150" height="120" fill="#c9d3d8" stroke="#3b2a1e" stroke-width="5"/>
  <path d="M90 150 H240 M90 190 H240" stroke="#3b2a1e" stroke-width="3"/>
  <ellipse cx="150" cy="130" rx="60" ry="14" fill="#e8edf0" opacity="0.8"/>
  <ellipse cx="200" cy="175" rx="50" ry="12" fill="#e8edf0" opacity="0.8"/>

  <!-- drip tap on back wall -->
  <rect x="628" y="190" width="24" height="40" rx="4" fill="#a7adb2" stroke="#3b2a1e" stroke-width="3"/>
  <rect x="610" y="170" width="60" height="22" rx="6" fill="#b9c0c5" stroke="#3b2a1e" stroke-width="3"/>
  <path d="M640 230 V290" stroke="#3b2a1e" stroke-width="3"/>
  <!-- drip falling -->
  <path d="M640 300 C632 316 630 324 640 336 C650 324 648 316 640 300 Z" fill="#7fb3c9" stroke="#3b2a1e" stroke-width="2"/>
  <!-- wet stain on tiles -->
  <path d="M632 262 Q640 258 648 262 L652 300 Q640 306 628 300 Z" fill="#c9bfa6" opacity="0.6"/>

  <!-- counter top -->
  <rect x="60" y="460" width="680" height="60" fill="#8a5d3b" stroke="#3b2a1e" stroke-width="4"/>
  <rect x="60" y="460" width="680" height="14" fill="#a87650" stroke="#3b2a1e" stroke-width="3"/>
  <!-- counter front panel -->
  <rect x="60" y="520" width="680" height="240" fill="#6e4a2f" stroke="#3b2a1e" stroke-width="4"/>
  <g stroke="#55371f" stroke-width="3" fill="none">
    <path d="M200 540 V740 M400 540 V740 M600 540 V740"/>
  </g>

  <!-- drip puddle on counter -->
  <ellipse cx="640" cy="468" rx="22" ry="5" fill="#8fbccd" stroke="#3b2a1e" stroke-width="2"/>

  <!-- brass spirit-level box -->
  <rect x="120" y="392" width="200" height="68" rx="6" fill="#c59a3e" stroke="#3b2a1e" stroke-width="4"/>
  <rect x="130" y="402" width="180" height="20" rx="10" fill="#e8c77a" stroke="#3b2a1e" stroke-width="2"/>
  <ellipse cx="220" cy="412" rx="34" ry="7" fill="#d8efe9" stroke="#3b2a1e" stroke-width="2"/>
  <circle cx="232" cy="412" r="3.5" fill="#3b2a1e"/>
  <!-- worn black keys -->
  <g fill="#1f1f1f" stroke="#000" stroke-width="1">
    <rect x="138" y="434" width="18" height="16" rx="3"/>
    <rect x="162" y="434" width="18" height="16" rx="3" fill="#4a4a4a"/>
    <rect x="186" y="434" width="18" height="16" rx="3"/>
    <rect x="210" y="434" width="18" height="16" rx="3" fill="#333"/>
    <rect x="234" y="434" width="18" height="16" rx="3"/>
    <rect x="258" y="434" width="18" height="16" rx="3" fill="#4a4a4a"/>
    <rect x="282" y="434" width="18" height="16" rx="3"/>
  </g>

  <!-- cardboard tube in soft brown paper -->
  <rect x="360" y="418" width="130" height="50" fill="#b98d5d" stroke="#3b2a1e" stroke-width="4"/>
  <ellipse cx="490" cy="443" rx="12" ry="25" fill="#d9b56a" stroke="#3b2a1e" stroke-width="4"/>
  <ellipse cx="360" cy="443" rx="10" ry="25" fill="#c9a06a" stroke="#3b2a1e" stroke-width="3"/>
  <!-- yellowed edges -->
  <path d="M360 418 H372 V468 H360 Z" fill="#dcc07e" opacity="0.8"/>
  <path d="M478 418 H490 V468 H478 Z" fill="#dcc07e" opacity="0.8"/>
  <!-- label band -->
  <rect x="400" y="424" width="50" height="38" fill="#efe3c8" stroke="#3b2a1e" stroke-width="2"/>
  <path d="M407 436 H444 M407 446 H440 M407 456 H430" stroke="#6e4a2f" stroke-width="2"/>

  <!-- star-shaped silver loop -->
  <path d="M590 430 L598 452 L622 452 L603 466 L610 490 L590 476 L570 490 L577 466 L558 452 L582 452 Z M590 448 L584 459 L594 459 Z"
        fill="url(#silver)" stroke="#3b2a1e" stroke-width="3" fill-rule="evenodd"/>
  <path d="M590 452 m-6 0 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0" fill="#f4f6f7" stroke="#3b2a1e" stroke-width="2"/>

  <!-- cream recipe card, face up, curled corners -->
  <g transform="rotate(-4 280 500)">
    <path d="M200 478 L340 476 Q346 476 344 484 L342 516 Q340 522 334 521 L196 523 Q190 523 191 516 L194 484 Q194 478 200 478 Z"
          fill="#f6efdc" stroke="#3b2a1e" stroke-width="3"/>
    <path d="M334 521 L340 514 L336 518 Z" fill="#e3d7b8" stroke="#3b2a1e" stroke-width="1.5"/>
    <path d="M200 478 L206 482 L202 486 Z" fill="#e3d7b8" stroke="#3b2a1e" stroke-width="1.5"/>
    <circle cx="326" cy="490" r="9" fill="none" stroke="#9a6a3c" stroke-width="2.5" opacity="0.8"/>
    <g stroke="#5d5448" stroke-width="2" stroke-linecap="round">
      <path d="M206 492 H270"/>
      <path d="M206 500 H300"/>
      <path d="M206 508 H250"/>
    </g>
  </g>

  <!-- counter shadow -->
  <path d="M60 520 H740" stroke="#3b2a1e" stroke-width="3" opacity="0.5"/>

  <!-- signature -->
  <text x="672" y="745" font-size="26" fill="#3b2a1e">P.</text>
</svg>