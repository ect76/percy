<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Dusk sky, flat bands -->
  <rect x="0" y="0" width="800" height="300" fill="#4f5d70"/>
  <rect x="0" y="300" width="800" height="140" fill="#6d7383"/>
  <rect x="0" y="380" width="800" height="60" fill="#a88f80"/>
  <!-- Last light behind tower -->
  <circle cx="400" cy="430" r="110" fill="#e9c48a" opacity="0.55"/>
  <circle cx="400" cy="430" r="60" fill="#f3d9a0" opacity="0.6"/>

  <!-- Wind streaks -->
  <g fill="none" stroke="#1d1f24" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M20 120 q60 -15 120 5 t120 0"/>
    <path d="M520 90 q50 -12 110 4 t110 2"/>
    <path d="M150 210 q55 -10 105 4"/>
    <path d="M560 250 q60 -14 120 3"/>
    <path d="M40 300 q45 -8 90 4"/>
  </g>

  <!-- Bell tower at the end of the lane -->
  <rect x="370" y="230" width="60" height="210" fill="#5e5a63" stroke="#1d1f24" stroke-width="3"/>
  <polygon points="358,232 400,118 442,232" fill="#3f3c47" stroke="#1d1f24" stroke-width="3" stroke-linejoin="round"/>
  <rect x="382" y="240" width="36" height="26" fill="#2a2730"/>
  <path d="M382 246 H418 M382 253 H418 M382 260 H418" stroke="#4d4a55" stroke-width="2"/>
  <!-- Clock face: small and pale -->
  <circle cx="400" cy="292" r="20" fill="#eee9d6" stroke="#1d1f24" stroke-width="2.5"/>
  <line x1="400" y1="292" x2="400" y2="279" stroke="#2a2730" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="400" y1="292" x2="410" y2="295" stroke="#2a2730" stroke-width="2" stroke-linecap="round"/>
  <!-- Lit window with tin silhouette -->
  <rect x="386" y="332" width="28" height="36" fill="#f0b95a" opacity="0.8" stroke="#1d1f24" stroke-width="2"/>
  <rect x="392" y="348" width="12" height="14" fill="#a0432e" stroke="#1d1f24" stroke-width="1"/>

  <!-- Lane -->
  <polygon points="0,800 800,800 420,440 380,440" fill="#7d7468" stroke="#1d1f24" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#5f574f" opacity="0.7">
    <ellipse cx="300" cy="700" rx="14" ry="6"/>
    <ellipse cx="520" cy="720" rx="16" ry="7"/>
    <ellipse cx="200" cy="610" rx="8" ry="4"/>
    <ellipse cx="470" cy="600" rx="9" ry="4"/>
    <ellipse cx="400" cy="520" rx="5" ry="3"/>
    <ellipse cx="360" cy="480" rx="4" ry="2"/>
    <ellipse cx="440" cy="500" rx="5" ry="2.5"/>
    <ellipse cx="90" cy="760" rx="18" ry="7"/>
    <ellipse cx="680" cy="760" rx="20" ry="8"/>
  </g>

  <!-- Cottage on the left -->
  <rect x="60" y="470" width="200" height="170" fill="#8c6d5a" stroke="#1d1f24" stroke-width="3"/>
  <polygon points="48,472 160,380 272,472" fill="#4a3d38" stroke="#1d1f24" stroke-width="3" stroke-linejoin="round"/>
  <rect x="78" y="500" width="40" height="40" fill="#f2c46d" stroke="#1d1f24" stroke-width="2.5"/>
  <path d="M98 500 V540 M78 520 H118" stroke="#1d1f24" stroke-width="2"/>
  <rect x="200" y="500" width="40" height="40" fill="#f2c46d" stroke="#1d1f24" stroke-width="2.5"/>
  <path d="M220 500 V540 M200 520 H240" stroke="#1d1f24" stroke-width="2"/>
  <rect x="140" y="560" width="40" height="80" fill="#3b2c24" stroke="#1d1f24" stroke-width="2.5"/>
  <circle cx="174" cy="602" r="2.5" fill="#c9a77c"/>

  <!-- Fence along right verge -->
  <g stroke="#1d1f24" stroke-width="2.5" fill="none">
    <line x1="560" y1="470" x2="560" y2="520"/>
    <line x1="520" y1="455" x2="520" y2="495"/>
    <line x1="490" y1="446" x2="490" y2="478"/>
    <line x1="460" y1="438" x2="460" y2="464"/>
    <path d="M560 480 L460 448 M560 500 L460 466"/>
  </g>

  <!-- Bent grass tufts -->
  <g fill="none" stroke="#2f3a2e" stroke-width="2" stroke-linecap="round">
    <path d="M30 650 q10 -20 25 -10 M40 650 q14 -26 30 -14"/>
    <path d="M700 620 q-12 -22 -28 -10 M690 620 q-10 -28 -24 -16"/>
    <path d="M330 470 q-8 -14 -18 -6"/>
  </g>

  <!-- Fog banks -->
  <g fill="#d7dde3" opacity="0.5">
    <ellipse cx="400" cy="440" rx="260" ry="18"/>
    <ellipse cx="200" cy="470" rx="220" ry="16"/>
    <ellipse cx="620" cy="500" rx="240" ry="22"/>
    <ellipse cx="300" cy="560" rx="300" ry="20"/>
    <ellipse cx="600" cy="640" rx="260" ry="24"/>
  </g>

  <!-- Signature "P." in lower right corner -->
  <g fill="none" stroke="#1d1f24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M736 738 V768 M736 738 H748 Q756 738 756 746 Q756 754 748 754 H736"/>
  </g>
  <circle cx="765" cy="768" r="2.5" fill="#1d1f24"/>
</svg>