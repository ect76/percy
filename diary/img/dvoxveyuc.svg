<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>
  <!-- back wall -->
  <rect x="60" y="80" width="680" height="500" fill="#d9cfbd" stroke="#241f1a" stroke-width="4"/>
  <!-- floor -->
  <polygon points="60,580 740,580 760,720 40,720" fill="#bfb29b" stroke="#241f1a" stroke-width="4"/>
  <!-- small window with fog -->
  <rect x="350" y="120" width="100" height="90" fill="#c9d3d6" stroke="#241f1a" stroke-width="4"/>
  <line x1="400" y1="120" x2="400" y2="210" stroke="#241f1a" stroke-width="3"/>
  <line x1="350" y1="165" x2="450" y2="165" stroke="#241f1a" stroke-width="3"/>
  <path d="M352 196 Q375 186 400 196 T448 196" fill="none" stroke="#8fa0a6" stroke-width="3"/>
  <!-- bare shelves on left wall -->
  <g stroke="#241f1a" stroke-width="3">
    <rect x="110" y="220" width="220" height="14" fill="#9c7b57"/>
    <rect x="110" y="330" width="220" height="14" fill="#9c7b57"/>
    <line x1="130" y1="234" x2="130" y2="262"/>
    <line x1="310" y1="234" x2="310" y2="262"/>
    <line x1="130" y1="344" x2="130" y2="372"/>
    <line x1="310" y1="344" x2="310" y2="372"/>
  </g>
  <!-- empty cupboard with open door -->
  <rect x="470" y="170" width="250" height="270" fill="#3b322b" stroke="#241f1a" stroke-width="4"/>
  <g stroke="#6d5a47" stroke-width="4">
    <line x1="480" y1="250" x2="710" y2="250"/>
    <line x1="480" y1="330" x2="710" y2="330"/>
    <line x1="480" y1="410" x2="710" y2="410"/>
  </g>
  <polygon points="720,170 752,182 752,438 720,440" fill="#c8b89c" stroke="#241f1a" stroke-width="4"/>
  <circle cx="738" cy="305" r="4" fill="#241f1a"/>
  <!-- table -->
  <rect x="200" y="440" width="400" height="24" fill="#8a6a4a" stroke="#241f1a" stroke-width="4"/>
  <rect x="214" y="464" width="16" height="136" fill="#6d5238" stroke="#241f1a" stroke-width="3"/>
  <rect x="570" y="464" width="16" height="136" fill="#6d5238" stroke="#241f1a" stroke-width="3"/>
  <!-- sprout tin -->
  <rect x="330" y="356" width="110" height="84" fill="#9aa3a0" stroke="#241f1a" stroke-width="4"/>
  <ellipse cx="385" cy="356" rx="55" ry="12" fill="#b9c1be" stroke="#241f1a" stroke-width="4"/>
  <rect x="330" y="384" width="110" height="34" fill="#5f7d4a" stroke="#241f1a" stroke-width="3"/>
  <g fill="#3f5e33" stroke="#241f1a" stroke-width="2">
    <circle cx="352" cy="401" r="8"/>
    <circle cx="370" cy="397" r="8"/>
    <circle cx="388" cy="401" r="8"/>
    <circle cx="406" cy="397" r="8"/>
    <circle cx="422" cy="401" r="7"/>
  </g>
  <!-- signature -->
  <text x="752" y="782" font-family="serif" font-size="22" fill="#241f1a" text-anchor="end">P.</text>
</svg>