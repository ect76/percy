<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#ece7db"/>
  <!-- back wall -->
  <rect x="120" y="40" width="560" height="520" fill="#d8d0bf" stroke="#2b2620" stroke-width="3"/>
  <!-- floor seen from doorway -->
  <polygon points="120,560 680,560 800,800 0,800 120,560" fill="#b5a88f" stroke="#2b2620" stroke-width="3"/>
  <!-- snow light from window onto floor -->
  <polygon points="170,280 320,280 430,560 210,560" fill="#fbfdfd" opacity="0.75"/>
  <!-- window -->
  <rect x="170" y="110" width="150" height="170" fill="#f7fafc" stroke="#2b2620" stroke-width="4"/>
  <line x1="245" y1="110" x2="245" y2="280" stroke="#2b2620" stroke-width="4"/>
  <line x1="170" y1="195" x2="320" y2="195" stroke="#2b2620" stroke-width="4"/>
  <!-- doorway jambs and lintel -->
  <rect x="0" y="0" width="120" height="800" fill="#6f665a" stroke="#2b2620" stroke-width="3"/>
  <rect x="120" y="0" width="560" height="40" fill="#6f665a" stroke="#2b2620" stroke-width="3"/>
  <!-- cupboard -->
  <rect x="400" y="150" width="200" height="330" fill="#8a6e52" stroke="#2b2620" stroke-width="4"/>
  <rect x="420" y="170" width="160" height="290" fill="#5b4733" stroke="#2b2620" stroke-width="2"/>
  <rect x="420" y="250" width="160" height="10" fill="#a7896a" stroke="#2b2620" stroke-width="2"/>
  <rect x="420" y="350" width="160" height="10" fill="#a7896a" stroke="#2b2620" stroke-width="2"/>
  <rect x="420" y="450" width="160" height="10" fill="#a7896a" stroke="#2b2620" stroke-width="2"/>
  <!-- shelf 1: two full tins, gap at right -->
  <rect x="432" y="206" width="44" height="44" rx="5" fill="#c9a54a" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="432" y="222" width="44" height="8" fill="#3d5f7a"/>
  <rect x="484" y="206" width="44" height="44" rx="5" fill="#c9a54a" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="484" y="222" width="44" height="8" fill="#3d5f7a"/>
  <!-- shelf 2: one empty open tin -->
  <rect x="436" y="306" width="50" height="44" rx="5" fill="#b9a06a" stroke="#2b2620" stroke-width="2.5"/>
  <ellipse cx="461" cy="306" rx="25" ry="5" fill="#2b2620"/>
  <path d="M436 306 Q461 312 486 306" fill="none" stroke="#2b2620" stroke-width="2"/>
  <!-- shelf 3: bare place where the missing tin stood -->
  <rect x="436" y="402" width="50" height="46" rx="5" fill="none" stroke="#2b2620" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="446" y1="440" x2="476" y2="440" stroke="#8a7d68" stroke-width="2"/>
  <!-- signature -->
  <text x="752" y="780" font-family="serif" font-size="22" fill="#2b2620">P.</text>
</svg>