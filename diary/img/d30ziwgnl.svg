  <rect x="300" y="470" width="470" height="30" fill="#a77d52" stroke="#2a2118" stroke-width="4"/>
  <rect x="320" y="500" width="22" height="200" fill="#8a6a4a" stroke="#2a2118" stroke-width="3"/>
  <rect x="724" y="500" width="22" height="200" fill="#8a6a4a" stroke="#2a2118" stroke-width="3"/>

  <!-- fish -->
  <path d="M640 452 L706 408 Q712 452 706 496 Z" fill="#b3bec4" stroke="#2a2118" stroke-width="4" stroke-linejoin="round"/>
  <path d="M500 414 Q530 396 575 404 L585 414 Z" fill="#b3bec4" stroke="#2a2118" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="520" cy="452" rx="130" ry="40" fill="#d6dfe3" stroke="#2a2118" stroke-width="4"/>
  <path d="M420 440 Q395 452 420 466" fill="none" stroke="#2a2118" stroke-width="3"/>
  <path d="M430 425 Q470 411 510 420 Q560 428 600 418" fill="none" stroke="#7c8b93" stroke-width="2.5" opacity="0.9"/>
  <path d="M450 452 Q480 440 512 448 Q546 456 580 446" fill="none" stroke="#7c8b93" stroke-width="2.5" opacity="0.9"/>
  <path d="M440 472 Q470 480 500 472 Q534 464 566 472" fill="none" stroke="#7c8b93" stroke-width="2.5" opacity="0.7"/>
  <path d="M470 418 Q500 404 540 412" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="462" cy="446" r="8" fill="#2a2118"/>
  <circle cx="460" cy="443" r="2.5" fill="#f4efe3"/>

