  <line x1="80" y1="352" x2="300" y2="352" stroke="#2a2118" stroke-width="5"/>
  <line x1="80" y1="438" x2="300" y2="438" stroke="#2a2118" stroke-width="5"/>

  <!-- empty tins on shelves -->
