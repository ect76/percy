    <ellipse cx="260" cy="700" rx="46" ry="15"/>
    <ellipse cx="420" cy="650" rx="38" ry="12"/>
    <ellipse cx="600" cy="720" rx="50" ry="16"/>
    <ellipse cx="700" cy="640" rx="34" ry="11"/>
    <ellipse cx="380" cy="750" rx="44" ry="14"/>
  </g>

  <!-- window with fog -->
