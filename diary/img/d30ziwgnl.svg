    <rect x="98" y="300" width="64" height="52" rx="8" fill="#9aa5ab"/>
    <rect x="98" y="300" width="64" height="12" rx="4" fill="#6f7b82"/>
    <rect x="186" y="306" width="68" height="46" rx="8" fill="#9aa5ab"/>
    <rect x="186" y="306" width="68" height="10" rx="4" fill="#6f7b82"/>
    <rect x="110" y="372" width="60" height="50" rx="8" fill="#9aa5ab"/>
    <rect x="110" y="372" width="60" height="10" rx="4" fill="#6f7b82"/>
    <rect x="200" y="380" width="72" height="42" rx="8" fill="#9aa5ab"/>
