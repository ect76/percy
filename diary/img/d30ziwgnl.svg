<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe3"/>

  <!-- wall and floor -->
  <rect x="0" y="0" width="800" height="560" fill="#e6dccb"/>
