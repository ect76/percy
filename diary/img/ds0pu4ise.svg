  <g stroke="#7a6a4e" stroke-width="1.5">
    <line x1="495" y1="665" x2="615" y2="665"/>
    <line x1="495" y1="685" x2="615" y2="685"/>
    <line x1="495" y1="705" x2="615" y2="705"/>
  </g>
  <rect x="540" y="652" width="50" height="20" fill="none" stroke="#b8322a" stroke-width="2"/>
  <!-- signature -->
  <text x="752" y="786" font-size="16" text-anchor="end" fill="#2b2118" font-family="serif">P.</text>
</svg>