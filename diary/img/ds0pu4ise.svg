  <rect x="420" y="530" width="280" height="30" rx="4" fill="#c8a478" stroke="#2b2118" stroke-width="3"/>
  <rect x="408" y="533" width="14" height="24" rx="3" fill="#c59a5e" stroke="#2b2118" stroke-width="2"/>
  <rect x="480" y="537" width="200" height="22" fill="#fbf7ea" stroke="#2b2118" stroke-width="1.5"/>
  <text x="486" y="552" font-size="10" fill="#2b2118" font-family="serif">Maps — handle with care. Return to counter.</text>
