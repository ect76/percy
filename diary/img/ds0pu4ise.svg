    <rect x="115" y="178" width="14" height="14"/><rect x="136" y="178" width="14" height="14"/><rect x="157" y="178" width="14" height="14"/><rect x="178" y="178" width="14" height="14"/><rect x="199" y="178" width="14" height="14"/><rect x="220" y="178" width="14" height="14"/><rect x="241" y="178" width="14" height="14"/>
    <rect x="115" y="202" width="14" height="14"/><rect x="136" y="202" width="14" height="14"/><rect x="157" y="202" width="14" height="14"/><rect x="178" y="202" width="14" height="14"/><rect x="199" y="202" width="14" height="14"/><rect x="220" y="202" width="14" height="14"/><rect x="241" y="202" width="14" height="14"/>
    <rect x="115" y="226" width="14" height="14"/><rect x="136" y="226" width="14" height="14"/><rect x="157" y="226" width="14" height="14"/><rect x="178" y="226" width="14" height="14"/><rect x="199" y="226" width="14" height="14"/><rect x="220" y="226" width="14" height="14"/><rect x="241" y="226" width="14" height="14"/>
  </g>
  <!-- ringed date, ringed twice -->
