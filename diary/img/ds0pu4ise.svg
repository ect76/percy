  <rect x="300" y="660" width="120" height="50" fill="#b8322a" stroke="#2b2118" stroke-width="3"/>
  <rect x="200" y="640" width="40" height="30" rx="8" fill="#3a2e26" stroke="#2b2118" stroke-width="2"/>
  <rect x="180" y="670" width="80" height="20" fill="#5a4a3e" stroke="#2b2118" stroke-width="2"/>
