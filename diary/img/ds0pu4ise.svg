  <rect x="596" y="326" width="20" height="10" fill="#7d8790" stroke="#2b2118" stroke-width="2"/>
  <path d="M606 344 C600 356 600 368 606 368 C612 368 612 356 606 344Z" fill="#7fb8d6" stroke="#2b2118" stroke-width="2"/>
