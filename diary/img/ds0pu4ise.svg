  <rect x="120" y="522" width="260" height="36" rx="18" fill="#d4af37" stroke="#2b2118" stroke-width="3"/>
  <rect x="140" y="530" width="220" height="20" rx="10" fill="#dfeff5" stroke="#2b2118" stroke-width="2"/>
  <circle cx="250" cy="540" r="6" fill="#2b2118"/>
