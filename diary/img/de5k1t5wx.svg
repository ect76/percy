<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe4"/>

  <!-- distant fog bands -->
  <rect x="0" y="120" width="800" height="90" fill="#e6e2d8" opacity="0.8"/>
  <rect x="0" y="200" width="800" height="60" fill="#dcd8cd" opacity="0.6"/>

  <!-- distant bare trees, faded -->
  <g fill="none" stroke="#9a958a" stroke-width="3" opacity="0.6">
    <path d="M90 300 V200 M90 240 L70 220 M90 250 L112 228"/>
    <path d="M660 290 V190 M660 230 L640 210 M660 250 L682 226"/>
  </g>

  <!-- chimney -->
  <rect x="455" y="205" width="42" height="90" fill="#8c7b6b" stroke="#2b2620" stroke-width="4"/>
  <path d="M449 205 H503 V196 H449 Z" fill="#f7f7f2" stroke="#2b2620" stroke-width="3"/>
  <!-- chimney smoke, muffled by fog -->
  <path d="M476 190 q-18 -20 0 -40 q18 -20 0 -40" fill="none" stroke="#b9b5ab" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- cottage body -->
  <rect x="220" y="330" width="300" height="260" fill="#d9c7a7" stroke="#2b2620" stroke-width="4"/>
  <!-- stone courses -->
  <g stroke="#a89672" stroke-width="2" fill="none">
    <path d="M220 370 H520 M220 410 H520 M220 450 H520 M220 490 H520 M220 530 H520 M220 565 H520"/>
  </g>

  <!-- roof -->
  <polygon points="196,342 370,188 544,342" fill="#7d6a5a" stroke="#2b2620" stroke-width="4" stroke-linejoin="round"/>
  <!-- roof tiles -->
  <g stroke="#5a4c40" stroke-width="2" fill="none">
    <path d="M240 320 L370 205 L500 320"/>
    <path d="M260 300 L370 222 L480 300"/>
  </g>
  <!-- snow on roof -->
  <path d="M196 342 L370 188 L544 342 L530 336 Q370 200 210 336 Z" fill="#fbfbf7" stroke="#2b2620" stroke-width="2" stroke-linejoin="round"/>

  <!-- windows -->
  <g stroke="#2b2620" stroke-width="4">
    <rect x="250" y="380" width="60" height="60" fill="#bcd0d6"/>
    <rect x="430" y="380" width="60" height="60" fill="#bcd0d6"/>
  </g>
  <g stroke="#2b2620" stroke-width="3">
    <path d="M280 380 V440 M250 410 H310"/>
    <path d="M460 380 V440 M430 410 H490"/>
  </g>
  <!-- window sills with a small level on the sill -->
  <rect x="244" y="440" width="72" height="8" fill="#8c7b6b"/>
  <rect x="424" y="440" width="72" height="8" fill="#8c7b6b"/>
  <rect x="446" y="430" width="26" height="10" fill="#e8dcc0" stroke="#2b2620" stroke-width="2"/>
  <circle cx="459" cy="435" r="2.5" fill="#c9a227"/>

  <!-- door -->
  <path d="M335 590 V470 Q335 440 370 440 Q405 440 405 470 V590 Z" fill="#6b4a33" stroke="#2b2620" stroke-width="4"/>
  <!-- door planks -->
  <path d="M356 445 V590 M384 445 V590" stroke="#4a3322" stroke-width="2" fill="none"/>
  <!-- brass letterbox -->
  <rect x="352" y="492" width="36" height="14" rx="2" fill="#c9a227" stroke="#2b2620" stroke-width="2"/>
  <rect x="356" y="497" width="28" height="3" fill="#2b2620"/>
  <path d="M348 510 H392" stroke="#2b2620" stroke-width="2"/>
  <!-- doorstep -->
  <rect x="326" y="590" width="88" height="10" fill="#b5a88f" stroke="#2b2620" stroke-width="3"/>

  <!-- crooked sign on bracket -->
  <path d="M220 350 H180 L172 362" fill="none" stroke="#2b2620" stroke-width="4" stroke-linecap="round"/>
  <path d="M176 330 L178 350" stroke="#2b2620" stroke-width="2"/>
  <g transform="rotate(-9 175 380)">
    <rect x="128" y="354" width="96" height="52" fill="#8a5a2b" stroke="#2b2620" stroke-width="4"/>
    <rect x="128" y="354" width="96" height="52" fill="none" stroke="#5a3a1c" stroke-width="2" stroke-dasharray="2 4" transform="translate(4 4)"/>
    <!-- lettering suggested by strokes -->
    <g stroke="#f4efe4" stroke-width="4" stroke-linecap="round">
      <path d="M145 372 H205"/>
      <path d="M145 386 H190"/>
      <path d="M145 398 H200"/>
    </g>
  </g>

  <!-- lane: cobbled ground -->
  <polygon points="0,800 800,800 800,640 0,680" fill="#bfb49c" stroke="#2b2620" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="250,600 540,600 800,640 800,800 0,800 0,680 250,600" fill="none"/>
  <g fill="none" stroke="#7d7261" stroke-width="2">
    <ellipse cx="90" cy="730" rx="26" ry="10"/>
    <ellipse cx="170" cy="762" rx="30" ry="11"/>
    <ellipse cx="300" cy="710" rx="24" ry="9"/>
    <ellipse cx="410" cy="752" rx="32" ry="11"/>
    <ellipse cx="540" cy="690" rx="22" ry="8"/>
    <ellipse cx="640" cy="735" rx="28" ry="10"/>
    <ellipse cx="730" cy="778" rx="34" ry="12"/>
    <ellipse cx="520" cy="782" rx="26" ry="9"/>
    <ellipse cx="230" cy="785" rx="22" ry="8"/>
  </g>

  <!-- snowy lane edge -->
  <path d="M0 668 Q40 650 80 664 T160 662 T250 648 T340 660 T430 650 T520 630 T610 640 T700 620 T800 628 V650 Q740 640 700 654 T610 660 T520 648 T430 668 T340 676 T250 664 T160 680 T80 680 T0 690 Z" fill="#fbfbf7" stroke="#2b2620" stroke-width="3" stroke-linejoin="round"/>

  <!-- fog layers over the lane and cottage base -->
  <ellipse cx="260" cy="620" rx="340" ry="46" fill="#f4efe4" opacity="0.7"/>
  <ellipse cx="620" cy="520" rx="260" ry="60" fill="#f4efe4" opacity="0.65"/>
  <ellipse cx="120" cy="440" rx="220" ry="70" fill="#f4efe4" opacity="0.55"/>
  <rect x="0" y="300" width="800" height="70" fill="#f4efe4" opacity="0.35"/>
  <rect x="0" y="560" width="800" height="50" fill="#f4efe4" opacity="0.4"/>

  <!-- artist's mark "P." in top-left corner, drawn as strokes -->
  <g fill="none" stroke="#2b2620" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 34 V64"/>
    <path d="M32 34 H44 Q54 34 54 44 Q54 54 44 54 H32"/>
  </g>
  <circle cx="64" cy="62" r="3.5" fill="#2b2620"/>
</svg>