<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>

  <!-- window frame and fog beyond -->
  <rect x="420" y="70" width="330" height="320" fill="#d6dde1" stroke="#2a2420" stroke-width="4"/>
  <!-- lane receding -->
  <path d="M470 390 L520 250 L640 250 L700 390 Z" fill="#b9b2a4" stroke="#2a2420" stroke-width="2"/>
  <path d="M500 330 L600 330 M490 360 L610 360 M520 290 L620 290" stroke="#8d8577" stroke-width="2" fill="none"/>
  <!-- cottages in fog -->
  <rect x="440" y="150" width="60" height="100" fill="#c9c2b3" stroke="#2a2420" stroke-width="2"/>
  <rect x="640" y="170" width="70" height="80" fill="#c9c2b3" stroke="#2a2420" stroke-width="2"/>
  <!-- fog bands -->
  <ellipse cx="500" cy="200" rx="120" ry="22" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="620" cy="300" rx="110" ry="18" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="560" cy="360" rx="150" ry="16" fill="#ffffff" opacity="0.5"/>
  <rect x="420" y="70" width="330" height="320" fill="none" stroke="#2a2420" stroke-width="4"/>
  <line x1="585" y1="70" x2="585" y2="390" stroke="#2a2420" stroke-width="4"/>

  <!-- old computer on desk -->
  <rect x="575" y="265" width="120" height="100" rx="6" fill="#4a4a4f" stroke="#2a2420" stroke-width="3"/>
  <rect x="588" y="278" width="94" height="72" fill="#7d9a94" stroke="#2a2420" stroke-width="2"/>
  <rect x="625" y="365" width="30" height="12" fill="#4a4a4f" stroke="#2a2420" stroke-width="2"/>

  <!-- desk top and legs -->
  <rect x="50" y="430" width="700" height="34" fill="#8b5e3c" stroke="#2a2420" stroke-width="4"/>
  <rect x="80" y="464" width="20" height="296" fill="#6e4a2f" stroke="#2a2420" stroke-width="3"/>
  <rect x="700" y="464" width="20" height="296" fill="#6e4a2f" stroke="#2a2420" stroke-width="3"/>

  <!-- paper stack and pencils at left -->
  <rect x="90" y="380" width="150" height="50" fill="#fffdf6" stroke="#2a2420" stroke-width="2" transform="rotate(-4 165 405)"/>
  <line x1="110" y1="400" x2="220" y2="392" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="110" y1="412" x2="220" y2="404" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="120" y1="428" x2="250" y2="420" stroke="#e0b234" stroke-width="7" stroke-linecap="round"/>
  <line x1="120" y1="440" x2="240" y2="433" stroke="#c9a27a" stroke-width="6" stroke-linecap="round"/>

  <!-- tin mouse -->
  <g stroke="#2a2420" stroke-width="3">
    <!-- tail -->
    <path d="M272 395 C230 420 220 370 200 360" fill="none" stroke-width="6" stroke-linecap="round"/>
    <!-- back legs -->
    <rect x="300" y="418" width="12" height="16" fill="#7f8c99"/>
    <rect x="352" y="418" width="12" height="16" fill="#7f8c99"/>
    <!-- body -->
    <ellipse cx="340" cy="390" rx="70" ry="38" fill="#9aa7b4"/>
    <!-- front legs -->
    <rect x="290" y="416" width="12" height="16" fill="#7f8c99"/>
    <rect x="320" y="420" width="12" height="14" fill="#7f8c99"/>
    <!-- ears -->
    <circle cx="262" cy="344" r="14" fill="#b8c2cc"/>
    <circle cx="282" cy="340" r="14" fill="#b8c2cc"/>
    <!-- head -->
    <circle cx="272" cy="378" r="28" fill="#9aa7b4"/>
    <!-- snout and eye -->
    <ellipse cx="244" cy="386" rx="10" ry="7" fill="#7f8c99"/>
    <circle cx="262" cy="372" r="4" fill="#2a2420"/>
    <!-- wing-like panel and tin seam -->
    <path d="M300 378 Q340 360 380 378" fill="none" stroke-width="2"/>
    <rect x="325" y="368" width="26" height="10" rx="2" fill="#c3ccd5"/>
  </g>

  <!-- rust-red spring key on mouse side -->
  <g stroke="#2a2420" stroke-width="3">
    <rect x="404" y="352" width="10" height="34" fill="#b5482a"/>
    <circle cx="409" cy="346" r="14" fill="#b5482a"/>
    <circle cx="409" cy="346" r="5" fill="#f3ecdc"/>
    <path d="M404 370 L414 378 L404 386" fill="none" stroke-width="3"/>
  </g>

  <!-- folded rag beside mouse -->
  <g stroke="#2a2420" stroke-width="3">
    <path d="M458 428 L462 404 L528 398 L532 420 Z" fill="#e8e2d2"/>
    <path d="M462 404 L468 428 M494 401 L498 425" fill="none" stroke-width="2"/>
    <path d="M472 412 L524 408" fill="none" stroke="#b8b0a0" stroke-width="2"/>
  </g>

  <!-- signature -->
  <text x="760" y="780" font-size="28" fill="#2a2420" text-anchor="end">P.</text>
</svg>