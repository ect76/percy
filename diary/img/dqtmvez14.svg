<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ead8"/>

  <!-- sky seen through window -->
  <rect x="30" y="30" width="740" height="740" fill="#dfe6e8"/>

  <!-- afternoon sun glow and light shafts -->
  <circle cx="640" cy="170" r="130" fill="#f6e3a1" opacity="0.75"/>
  <circle cx="640" cy="170" r="60" fill="#fbf0c4" opacity="0.9"/>
  <polygon points="600,200 700,200 520,700 380,700" fill="#f6e3a1" opacity="0.22"/>
  <polygon points="660,200 720,200 600,760 520,760" fill="#f6e3a1" opacity="0.16"/>

  <!-- distant rooftops -->
  <polygon points="30,360 90,330 150,360 150,420 30,420" fill="#b8c2c6" stroke="#2b2620" stroke-width="2"/>
  <polygon points="650,350 720,315 770,350 770,420 650,420" fill="#b8c2c6" stroke="#2b2620" stroke-width="2"/>
  <polygon points="200,380 240,350 280,380 280,420 200,420" fill="#c7cfd2" stroke="#2b2620" stroke-width="2"/>

  <!-- bell tower at end of Pond Lane -->
  <rect x="362" y="300" width="76" height="170" fill="#d6cbb6" stroke="#2b2620" stroke-width="3"/>
  <rect x="368" y="232" width="64" height="70" fill="#cbbfa8" stroke="#2b2620" stroke-width="3"/>
  <rect x="376" y="244" width="12" height="36" fill="#4a4338"/>
  <rect x="412" y="244" width="12" height="36" fill="#4a4338"/>
  <circle cx="400" cy="318" r="0" fill="#4a4338"/>
  <polygon points="360,234 400,160 440,234" fill="#8d6f5a" stroke="#2b2620" stroke-width="3"/>
  <line x1="400" y1="160" x2="400" y2="138" stroke="#2b2620" stroke-width="3"/>
  <rect x="362" y="440" width="76" height="30" fill="#bfb29a" stroke="#2b2620" stroke-width="2"/>

  <!-- fog bank over the horizon -->
  <rect x="30" y="370" width="740" height="60" fill="#f4f6f5" opacity="0.55"/>
  <rect x="30" y="420" width="740" height="40" fill="#f4f6f5" opacity="0.4"/>

  <!-- left cottage row -->
  <polygon points="30,170 300,330 300,470 30,640" fill="#dcc7a2" stroke="#2b2620" stroke-width="3"/>
  <rect x="70" y="260" width="36" height="46" fill="#7d8a8c" stroke="#2b2620" stroke-width="2"/>
  <rect x="150" y="300" width="34" height="44" fill="#7d8a8c" stroke="#2b2620" stroke-width="2"/>
  <rect x="70" y="390" width="36" height="46" fill="#7d8a8c" stroke="#2b2620" stroke-width="2"/>

  <!-- right cottage row -->
  <polygon points="770,170 500,330 500,470 770,640" fill="#e4d2ae" stroke="#2b2620" stroke-width="3"/>
  <rect x="700" y="260" width="36" height="46" fill="#7d8a8c" stroke="#2b2620" stroke-width="2"/>
  <rect x="616" y="300" width="34" height="44" fill="#7d8a8c" stroke="#2b2620" stroke-width="2"/>
  <rect x="700" y="390" width="36" height="46" fill="#7d8a8c" stroke="#2b2620" stroke-width="2"/>

  <!-- Pond Lane cobbles -->
  <polygon points="30,800 770,800 432,440 368,440" fill="#b9a88f" stroke="#2b2620" stroke-width="3"/>
  <g fill="none" stroke="#7a6c58" stroke-width="2">
    <ellipse cx="200" cy="740" rx="22" ry="9"/>
    <ellipse cx="330" cy="700" rx="16" ry="7"/>
    <ellipse cx="520" cy="720" rx="20" ry="8"/>
    <ellipse cx="640" cy="770" rx="26" ry="10"/>
    <ellipse cx="400" cy="590" rx="12" ry="5"/>
    <ellipse cx="450" cy="620" rx="14" ry="6"/>
    <ellipse cx="350" cy="560" rx="10" ry="4"/>
    <ellipse cx="120" cy="650" rx="18" ry="7"/>
    <ellipse cx="690" cy="620" rx="16" ry="6"/>
    <ellipse cx="400" cy="500" rx="8" ry="3"/>
  </g>

  <!-- seated figure beside the lane: golden pedestal, halo, saffron cloth -->
  <circle cx="230" cy="402" r="52" fill="none" stroke="#f2d27a" stroke-width="6" opacity="0.7"/>
  <rect x="180" y="506" width="100" height="26" fill="#d9a638" stroke="#2b2620" stroke-width="2"/>
  <polygon points="190,506 270,506 262,486 198,486" fill="#e6b84f" stroke="#2b2620" stroke-width="2"/>
  <ellipse cx="230" cy="470" rx="60" ry="40" fill="#e8892b" stroke="#2b2620" stroke-width="3"/>
  <path d="M185 470 Q200 500 230 504 Q262 500 275 470" fill="none" stroke="#b8651c" stroke-width="2"/>
  <path d="M205 448 Q230 462 255 448" fill="none" stroke="#b8651c" stroke-width="2"/>
  <ellipse cx="230" cy="452" rx="26" ry="11" fill="#e0a046" stroke="#2b2620" stroke-width="2"/>
  <rect x="216" y="368" width="28" height="30" fill="#e0b25a" stroke="#2b2620" stroke-width="2"/>
  <circle cx="230" cy="394" r="30" fill="#e0b25a" stroke="#2b2620" stroke-width="3"/>
  <circle cx="230" cy="362" r="6" fill="#e0b25a" stroke="#2b2620" stroke-width="2"/>
  <path d="M215 392 Q220 396 225 392" fill="none" stroke="#2b2620" stroke-width="2"/>
  <path d="M236 392 Q241 396 246 392" fill="none" stroke="#2b2620" stroke-width="2"/>
  <path d="M222 408 Q230 412 238 408" fill="none" stroke="#2b2620" stroke-width="2"/>

  <!-- window frame -->
  <rect x="0" y="0" width="800" height="30" fill="#6b5744"/>
  <rect x="0" y="0" width="30" height="800" fill="#6b5744"/>
  <rect x="770" y="0" width="30" height="800" fill="#6b5744"/>
  <rect x="0" y="770" width="800" height="30" fill="#8a7158" stroke="#2b2620" stroke-width="3"/>
  <rect x="26" y="26" width="748" height="748" fill="none" stroke="#2b2620" stroke-width="3"/>

  <!-- small sill objects -->
  <rect x="600" y="738" width="60" height="30" rx="8" fill="#b0503a" stroke="#2b2620" stroke-width="2"/>
  <rect x="600" y="738" width="60" height="8" rx="4" fill="#8a3b2a" stroke="#2b2620" stroke-width="2"/>

  <!-- signature -->
  <text x="752" y="790" font-size="22" fill="#2b2620">P.</text>
</svg>