<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe3"/>

  <!-- sky and fog -->
  <rect x="0" y="0" width="800" height="430" fill="#d3dadf"/>
  <circle cx="610" cy="120" r="46" fill="#eef0ea" opacity="0.7"/>

  <!-- bell tower, lost in the grey -->
  <g opacity="0.55">
    <rect x="560" y="200" width="70" height="230" fill="#9fa9b1" stroke="#2b2b2b" stroke-width="2"/>
    <polygon points="555,200 595,120 635,200" fill="#8b959e" stroke="#2b2b2b" stroke-width="2"/>
    <rect x="575" y="235" width="40" height="30" fill="#6f7a84" stroke="#2b2b2b" stroke-width="1.5"/>
    <line x1="595" y1="120" x2="595" y2="98" stroke="#2b2b2b" stroke-width="2"/>
  </g>

  <!-- distant roofs -->
  <g opacity="0.45">
    <polygon points="380,380 430,335 480,380" fill="#8d8a86" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="385" y="380" width="90" height="60" fill="#b8b2a8" stroke="#2b2b2b" stroke-width="1.5"/>
  </g>

  <!-- cottage on the left -->
  <rect x="60" y="330" width="240" height="200" fill="#e8c9a0" stroke="#2b2b2b" stroke-width="3"/>
  <polygon points="40,335 180,235 320,335" fill="#7a5a4a" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="88" y="368" width="54" height="42" fill="#f7e7a8" stroke="#2b2b2b" stroke-width="2.5"/>
  <line x1="115" y1="368" x2="115" y2="410" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="222" y="368" width="54" height="42" fill="#f7e7a8" stroke="#2b2b2b" stroke-width="2.5"/>
  <line x1="249" y1="368" x2="249" y2="410" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="160" y="430" width="50" height="100" fill="#5b4030" stroke="#2b2b2b" stroke-width="2.5"/>
  <circle cx="200" cy="482" r="3" fill="#e0b84a"/>

  <!-- ground beside the lane -->
  <rect x="0" y="530" width="800" height="270" fill="#a7b49a"/>
  <rect x="0" y="530" width="800" height="6" fill="#7f8f75"/>

  <!-- fog-hidden lane -->
  <polygon points="150,800 650,800 430,440 340,440" fill="#b9ab98" stroke="#2b2b2b" stroke-width="3"/>
  <g fill="none" stroke="#6e6255" stroke-width="1.6">
    <ellipse cx="260" cy="760" rx="18" ry="9"/>
    <ellipse cx="330" cy="720" rx="12" ry="6"/>
    <ellipse cx="500" cy="770" rx="20" ry="10"/>
    <ellipse cx="450" cy="700" rx="11" ry="6"/>
    <ellipse cx="380" cy="600" rx="8" ry="4"/>
    <ellipse cx="410" cy="560" rx="6" ry="3"/>
    <ellipse cx="300" cy="650" rx="10" ry="5"/>
    <ellipse cx="560" cy="650" rx="9" ry="5"/>
    <ellipse cx="365" cy="480" rx="5" ry="2.5"/>
    <ellipse cx="200" cy="700" rx="14" ry="7"/>
  </g>

  <!-- tin whistle-spinner mouse on the cobbles -->
  <g stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round">
    <!-- wire legs -->
    <path d="M360,668 L345,700 L332,708" fill="none" stroke-width="2"/>
    <path d="M385,672 L382,705 L398,716" fill="none" stroke-width="2"/>
    <path d="M412,670 L420,700 L408,712" fill="none" stroke-width="2"/>
    <!-- tail -->
    <path d="M330,650 Q300,640 310,615 Q318,600 332,612" fill="none" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="385" cy="650" rx="48" ry="28" fill="#c9d2d7"/>
    <!-- head -->
    <circle cx="430" cy="632" r="22" fill="#c9d2d7"/>
    <!-- ears -->
    <circle cx="420" cy="612" r="10" fill="#e6b7b0"/>
    <circle cx="442" cy="610" r="10" fill="#e6b7b0"/>
    <!-- eye and whistle nose -->
    <circle cx="438" cy="628" r="3" fill="#2b2b2b"/>
    <rect x="448" y="626" width="10" height="6" fill="#8a949c"/>
    <!-- winding key lever -->
    <rect x="372" y="612" width="24" height="8" fill="#8a949c"/>
    <line x1="384" y1="612" x2="392" y2="596" stroke-width="2"/>
    <circle cx="392" cy="594" r="4" fill="#d9a441"/>
    <!-- wire spring on the back -->
    <path d="M350,636 Q370,618 392,636 Q410,650 396,642" fill="none" stroke-width="1.8"/>
  </g>

  <!-- fog bands drifting across the lane and tower -->
  <rect x="0" y="400" width="800" height="50" fill="#f4f6f3" opacity="0.6"/>
  <rect x="0" y="470" width="800" height="36" fill="#f4f6f3" opacity="0.45"/>
  <rect x="0" y="560" width="800" height="48" fill="#f4f6f3" opacity="0.3"/>
  <rect x="0" y="180" width="800" height="60" fill="#f4f6f3" opacity="0.35"/>

  <!-- signature -->
  <text x="752" y="776" font-family="serif" font-size="26" fill="#2b2b2b">P.</text>
</svg>