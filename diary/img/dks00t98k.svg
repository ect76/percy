<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe3"/>

  <!-- distant fog hills -->
  <path d="M0 430 Q120 380 240 420 T480 410 T800 400 L800 800 L0 800 Z" fill="#c9d2c4" stroke="#2a2a2a" stroke-width="2"/>
  <path d="M0 470 Q160 430 320 465 T640 455 T800 460 L800 800 L0 800 Z" fill="#aebfa9" stroke="#2a2a2a" stroke-width="2"/>

  <!-- cobbled street -->
  <path d="M0 640 L800 620 L800 800 L0 800 Z" fill="#b9b2a4" stroke="#2a2a2a" stroke-width="3"/>
  <g fill="none" stroke="#6d675d" stroke-width="2">
    <ellipse cx="60" cy="680" rx="26" ry="10"/>
    <ellipse cx="150" cy="700" rx="28" ry="11"/>
    <ellipse cx="260" cy="690" rx="24" ry="9"/>
    <ellipse cx="370" cy="715" rx="30" ry="11"/>
    <ellipse cx="480" cy="700" rx="26" ry="10"/>
    <ellipse cx="590" cy="745" rx="32" ry="12"/>
    <ellipse cx="720" cy="730" rx="28" ry="11"/>
    <ellipse cx="90" cy="760" rx="30" ry="11"/>
    <ellipse cx="300" cy="775" rx="34" ry="12"/>
    <ellipse cx="520" cy="780" rx="30" ry="11"/>
    <ellipse cx="740" cy="785" rx="34" ry="11"/>
  </g>

  <!-- Welcome to Mossville post -->
  <rect x="190" y="230" width="22" height="470" fill="#8a5d34" stroke="#2a2a2a" stroke-width="3"/>
  <path d="M170 150 L200 120 L230 150 Z" fill="#5b3b22" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="150" y="160" width="100" height="72" rx="14" fill="#f6ecd2" stroke="#2a2a2a" stroke-width="3"/>
  <rect x="158" y="168" width="84" height="56" rx="10" fill="none" stroke="#3f7a4a" stroke-width="7"/>
  <text x="200" y="192" text-anchor="middle" font-family="serif" font-size="13" fill="#222">Welcome to</text>
  <text x="200" y="212" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#222">Mossville</text>
  <!-- moss tufts at base -->
  <g fill="#5d8f4e" stroke="#2a2a2a" stroke-width="2">
    <path d="M176 700 Q180 682 186 698 Q190 680 196 700 Q202 684 208 700 L208 712 L176 712 Z"/>
    <path d="M186 640 Q192 626 198 640 Q204 624 210 642 L210 650 L186 650 Z"/>
    <path d="M172 720 Q178 708 184 720 L184 728 L172 728 Z"/>
  </g>

  <!-- Thermometer on painted board -->
  <rect x="478" y="360" width="84" height="170" rx="6" fill="#fbfbf6" stroke="#2a2a2a" stroke-width="3"/>
  <rect x="512" y="300" width="18" height="210" rx="9" fill="#e9f1f3" stroke="#2a2a2a" stroke-width="3"/>
  <rect x="516" y="400" width="10" height="100" rx="5" fill="#c2302a"/>
  <g stroke="#2a2a2a" stroke-width="2">
    <line x1="478" y1="390" x2="492" y2="390"/>
    <line x1="478" y1="415" x2="490" y2="415"/>
    <line x1="478" y1="440" x2="492" y2="440"/>
    <line x1="478" y1="465" x2="490" y2="465"/>
    <line x1="478" y1="490" x2="492" y2="490"/>
  </g>
  <g font-family="serif" font-size="9" fill="#222">
    <text x="496" y="393">80</text>
    <text x="496" y="443">40</text>
    <text x="496" y="493">-20</text>
  </g>

  <!-- Rain gauge: funnel, cylinder, wooden post -->
  <rect x="617" y="600" width="18" height="120" fill="#8a5d34" stroke="#2a2a2a" stroke-width="3"/>
  <polygon points="582,520 668,520 642,572 608,572" fill="#fbfbf6" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="604" y="460" width="42" height="120" rx="4" fill="#e9f1f3" stroke="#2a2a2a" stroke-width="3"/>
  <rect x="606" y="550" width="38" height="26" fill="#6fa6c9" opacity="0.85"/>
  <g stroke="#2a2a2a" stroke-width="2">
    <line x1="604" y1="500" x2="614" y2="500"/>
    <line x1="604" y1="530" x2="614" y2="530"/>
  </g>
  <text x="626" y="505" text-anchor="middle" font-family="serif" font-size="9" fill="#222">0 10 20</text>

  <!-- fog bands -->
  <g fill="#f4efe3" opacity="0.55">
    <rect x="0" y="330" width="800" height="50"/>
    <rect x="0" y="520" width="800" height="40"/>
    <ellipse cx="400" cy="600" rx="420" ry="30"/>
  </g>
  <g fill="#f4efe3" opacity="0.35">
    <ellipse cx="120" cy="260" rx="160" ry="40"/>
    <ellipse cx="700" cy="250" rx="120" ry="34"/>
  </g>

  <!-- signature -->
  <text x="768" y="780" text-anchor="end" font-family="serif" font-size="18" fill="#2a2a2a">P.</text>
</svg>