<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cobbles" patternUnits="userSpaceOnUse" width="56" height="36">
      <rect width="56" height="36" fill="#9a9284"/>
      <ellipse cx="14" cy="10" rx="11" ry="7" fill="#aca494" stroke="#3a352f" stroke-width="1.5"/>
      <ellipse cx="42" cy="8" rx="10" ry="6" fill="#8e8779" stroke="#3a352f" stroke-width="1.5"/>
      <ellipse cx="28" cy="27" rx="12" ry="7" fill="#a79f8f" stroke="#3a352f" stroke-width="1.5"/>
      <ellipse cx="0" cy="30" rx="8" ry="5" fill="#8e8779" stroke="#3a352f" stroke-width="1.5"/>
      <ellipse cx="56" cy="30" rx="8" ry="5" fill="#8e8779" stroke="#3a352f" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="800" fill="#dfe3e4"/>
  <rect x="0" y="0" width="800" height="260" fill="#e9ecec"/>

  <!-- thin winter sun -->
  <circle cx="120" cy="150" r="70" fill="#f6efd6" opacity="0.8"/>
  <circle cx="120" cy="150" r="42" fill="#faf5e2"/>

  <!-- bell tower at the end of the lane -->
  <polygon points="368,150 400,78 432,150" fill="#6f6a66" stroke="#2b2b2b" stroke-width="2.5"/>
  <rect x="370" y="150" width="60" height="45" fill="#8f877a" stroke="#2b2b2b" stroke-width="2.5"/>
  <rect x="381" y="160" width="12" height="24" fill="#3b3a40"/>
  <rect x="407" y="160" width="12" height="24" fill="#3b3a40"/>
  <rect x="375" y="195" width="50" height="150" fill="#b9b1a2" stroke="#2b2b2b" stroke-width="2.5"/>
  <circle cx="400" cy="232" r="14" fill="#ece6d4" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="400" y1="232" x2="400" y2="222" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="400" y1="232" x2="409" y2="236" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="390" y="300" width="20" height="45" fill="#4a4540" stroke="#2b2b2b" stroke-width="2"/>

  <!-- low stone wall on the right, receding -->
  <polygon points="430,345 800,410 800,455 430,352" fill="#c4bba9" stroke="#2b2b2b" stroke-width="2.5"/>
  <line x1="430" y1="345" x2="800" y2="410" stroke="#2b2b2b" stroke-width="1.5" opacity="0.6"/>

  <!-- fog bands across the distance -->
  <rect x="0" y="260" width="800" height="110" fill="#f4f6f7" opacity="0.55"/>
  <rect x="0" y="330" width="800" height="45" fill="#f4f6f7" opacity="0.4"/>

  <!-- cobbled lane -->
  <polygon points="-50,800 850,800 430,345 370,345" fill="url(#cobbles)" stroke="#2b2b2b" stroke-width="2.5"/>

  <!-- cottage on the left -->
  <polygon points="40,352 180,250 320,352" fill="#6e5a4a" stroke="#2b2b2b" stroke-width="2.5"/>
  <rect x="230" y="262" width="24" height="50" fill="#7a5f4f" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="50" y="352" width="260" height="258" fill="#d8c9a8" stroke="#2b2b2b" stroke-width="2.5"/>
  <rect x="72" y="392" width="44" height="50" fill="#f2e8c4" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="94" y1="392" x2="94" y2="442" stroke="#2b2b2b" stroke-width="1.5"/>
  <line x1="72" y1="417" x2="116" y2="417" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="224" y="392" width="44" height="50" fill="#f2e8c4" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="246" y1="392" x2="246" y2="442" stroke="#2b2b2b" stroke-width="1.5"/>
  <line x1="224" y1="417" x2="268" y2="417" stroke="#2b2b2b" stroke-width="1.5"/>
  <path d="M130 610 V470 Q130 430 170 430 Q210 430 210 470 V610 Z" fill="#5a3d2b" stroke="#2b2b2b" stroke-width="2.5"/>
  <circle cx="200" cy="520" r="3" fill="#d9b25a"/>
  <rect x="118" y="606" width="104" height="10" fill="#8f877a" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- bare winter shrub beside the cottage -->
  <path d="M330 610 Q335 540 318 480 M332 560 Q360 530 372 500 M336 590 Q350 575 362 572" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- near fog wash at the lane's foot -->
  <rect x="0" y="700" width="800" height="100" fill="#eef1f1" opacity="0.18"/>

  <!-- signature: small P. in the corner -->
  <g fill="#2b2b2b">
    <path d="M740 752 V778 M740 752 H750 Q758 752 758 760 Q758 768 750 768 H740" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="766" cy="778" r="2.5"/>
  </g>
</svg>