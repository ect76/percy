<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3eee2"/>

  <!-- stone cottage wall -->
  <rect x="0" y="0" width="800" height="440" fill="#bdb5a4"/>
  <g fill="none" stroke="#3d3731" stroke-width="3" stroke-linejoin="round">
    <path d="M0 60 H800"/>
    <path d="M0 130 H800"/>
    <path d="M0 200 H800"/>
    <path d="M0 270 H800"/>
    <path d="M0 340 H800"/>
    <path d="M120 0 V60 M330 0 V60 M560 0 V60 M220 60 V130 M450 60 V130 M700 60 V130"/>
    <path d="M60 130 V200 M280 130 V200 M610 130 V200 M160 200 V270 M400 200 V270 M720 200 V270"/>
    <path d="M90 270 V340 M330 270 V340 M520 270 V340 M250 340 V440 M640 340 V440"/>
  </g>

  <!-- faint fog band across the wall -->
  <rect x="0" y="150" width="800" height="60" fill="#e6e1d6" opacity="0.45"/>

  <!-- empty tins standing behind the plate -->
  <g stroke="#1f1a16" stroke-width="4" stroke-linejoin="round">
    <!-- tin one -->
    <rect x="200" y="300" width="96" height="130" fill="#9fb0b6"/>
    <ellipse cx="248" cy="300" rx="48" ry="12" fill="#3a3a3a"/>
    <rect x="200" y="350" width="96" height="16" fill="#c4543a"/>
    <!-- tin two -->
    <rect x="330" y="330" width="84" height="100" fill="#b3bfc3"/>
    <ellipse cx="372" cy="330" rx="42" ry="10" fill="#3a3a3a"/>
    <rect x="330" y="372" width="84" height="14" fill="#c4543a"/>
    <!-- tin three, lying on its side -->
    <rect x="450" y="352" width="120" height="78" rx="6" fill="#8e9ea4"/>
    <ellipse cx="450" cy="391" rx="12" ry="39" fill="#3a3a3a"/>
    <rect x="470" y="372" width="80" height="14" fill="#c4543a"/>
  </g>

  <!-- table top -->
  <rect x="90" y="430" width="620" height="44" fill="#8a5e3c" stroke="#1f1a16" stroke-width="4"/>
  <!-- table scars and grain -->
  <g fill="none" stroke="#3b2715" stroke-width="3" stroke-linecap="round">
    <path d="M140 450 H230"/>
    <path d="M330 462 L390 458"/>
    <path d="M560 448 H640"/>
    <path d="M600 466 H690"/>
    <path d="M150 458 L165 452"/>
  </g>
  <!-- table front -->
  <rect x="90" y="474" width="620" height="110" fill="#6b4628" stroke="#1f1a16" stroke-width="4"/>
  <!-- drawers along the front -->
  <g fill="none" stroke="#1f1a16" stroke-width="3">
    <rect x="130" y="492" width="130" height="72" rx="3"/>
    <rect x="335" y="492" width="130" height="72" rx="3"/>
    <rect x="540" y="492" width="130" height="72" rx="3"/>
  </g>
  <g fill="#3f2a18">
    <circle cx="195" cy="528" r="5"/>
    <circle cx="400" cy="528" r="5"/>
    <circle cx="605" cy="528" r="5"/>
  </g>
  <!-- legs -->
  <rect x="120" y="584" width="34" height="170" fill="#573820" stroke="#1f1a16" stroke-width="4"/>
  <rect x="646" y="584" width="34" height="170" fill="#573820" stroke="#1f1a16" stroke-width="4"/>

  <!-- plate shadow -->
  <ellipse cx="410" cy="516" rx="200" ry="52" fill="#5e4a33" opacity="0.35"/>

  <!-- plate -->
  <ellipse cx="400" cy="500" rx="190" ry="50" fill="#f8f7f1" stroke="#1f1a16" stroke-width="4"/>
  <ellipse cx="400" cy="500" rx="150" ry="36" fill="none" stroke="#b9b4a8" stroke-width="3"/>

  <!-- fish one -->
  <g stroke="#1f1a16" stroke-width="4" stroke-linejoin="round">
    <polygon points="380,494 432,468 428,498 432,524 380,504" fill="#7f9ca9"/>
    <ellipse cx="335" cy="494" rx="62" ry="25" fill="#9cb6c2"/>
    <path d="M300 480 Q318 494 300 508" fill="none" stroke-width="3"/>
    <path d="M330 472 Q344 494 330 516" fill="none" stroke-width="3"/>
  </g>
  <circle cx="306" cy="489" r="5" fill="#1f1a16"/>

  <!-- fish two -->
  <g stroke="#1f1a16" stroke-width="4" stroke-linejoin="round">
    <polygon points="488,512 528,486 524,516 528,540 488,520" fill="#86a6b3"/>
    <ellipse cx="446" cy="512" rx="56" ry="22" fill="#a9c4cf"/>
    <path d="M414 500 Q428 512 414 524" fill="none" stroke-width="3"/>
    <path d="M440 496 Q452 512 440 528" fill="none" stroke-width="3"/>
  </g>
  <circle cx="425" cy="506" r="4" fill="#1f1a16"/>

  <!-- signature -->
  <text x="752" y="782" font-family="sans-serif" font-size="26" fill="#2b2620" text-anchor="end">P.</text>
</svg>