<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ebd9"/>

  <!-- interior wall -->
  <rect x="90" y="70" width="620" height="540" fill="#e4d6b8"/>
  <!-- floor -->
  <rect x="90" y="610" width="620" height="190" fill="#bcae95"/>
  <!-- cobble lines on floor -->
  <g fill="none" stroke="#7d6f5a" stroke-width="2" opacity="0.7">
    <path d="M90 650 Q200 640 300 655 T520 650 T710 655"/>
    <path d="M90 700 Q210 690 330 705 T600 700 T710 712"/>
    <path d="M150 760 Q280 748 400 764 T710 758"/>
    <path d="M250 630 L240 660 M420 625 L430 655 M600 640 L585 672"/>
  </g>

  <!-- doorway frame -->
  <rect x="0" y="0" width="90" height="800" fill="#6b5840" stroke="#2a2420" stroke-width="3"/>
  <rect x="710" y="0" width="90" height="800" fill="#6b5840" stroke="#2a2420" stroke-width="3"/>
  <rect x="0" y="0" width="800" height="70" fill="#5a4a36" stroke="#2a2420" stroke-width="3"/>

  <!-- calendar -->
  <g stroke="#2a2420" stroke-width="3">
    <rect x="150" y="130" width="130" height="160" fill="#fbf7ec"/>
    <rect x="160" y="140" width="110" height="18" fill="#9c4a3a"/>
    <rect x="160" y="165" width="110" height="78" fill="#bcd3d6"/>
    <path d="M160 230 L160 215 Q215 190 270 215 L270 230 Z" fill="#7a9a6a"/>
    <path d="M175 225 L175 205 M255 225 L255 205 M180 210 L250 210" fill="none" stroke="#5a4a36" stroke-width="4"/>
    <circle cx="150" cy="130" r="5" fill="#b33" stroke-width="2"/>
  </g>
  <text x="215" y="152" font-family="sans-serif" font-size="9" fill="#fbf7ec" text-anchor="middle">MOSSBROOK</text>
  <text x="215" y="270" font-family="sans-serif" font-size="8" fill="#2a2420" text-anchor="middle">VILLAGE HALL</text>
  <text x="215" y="282" font-family="sans-serif" font-size="7" fill="#2a2420" text-anchor="middle">Monthly Notices</text>

  <!-- sign card on wall -->
  <g stroke="#2a2420" stroke-width="3">
    <rect x="330" y="150" width="210" height="80" fill="#fffdf6"/>
  </g>
  <text x="435" y="176" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2a2420" text-anchor="middle">LOST PROPERTY - MOSSBROOK</text>
  <text x="435" y="200" font-family="sans-serif" font-size="11" fill="#2a2420" text-anchor="middle">Please enter date, item,</text>
  <text x="435" y="216" font-family="sans-serif" font-size="11" fill="#2a2420" text-anchor="middle">and finder's name.</text>

  <!-- nail, string and tag -->
  <circle cx="600" cy="180" r="4" fill="#2a2420"/>
  <path d="M600 184 Q596 215 592 240" fill="none" stroke="#2a2420" stroke-width="2"/>
  <path d="M566 240 L634 240 L632 292 Q600 298 568 290 Z" fill="#fbf7ec" stroke="#2a2420" stroke-width="3"/>
  <path d="M632 240 L634 250 Q628 252 632 258" fill="none" stroke="#2a2420" stroke-width="1.5"/>
  <text x="600" y="256" font-family="sans-serif" font-size="8" fill="#2a2420" text-anchor="middle">Unclaimed - 30 days.</text>
  <text x="600" y="270" font-family="sans-serif" font-size="8" fill="#2a2420" text-anchor="middle">Ask at counter.</text>

  <!-- counter -->
  <rect x="300" y="470" width="380" height="140" fill="#8a6a4a" stroke="#2a2420" stroke-width="3"/>
  <rect x="300" y="470" width="380" height="14" fill="#a5835c" stroke="#2a2420" stroke-width="3"/>

  <!-- hardback book with ribbon -->
  <rect x="460" y="402" width="124" height="68" rx="3" fill="#2f5a45" stroke="#2a2420" stroke-width="3"/>
  <rect x="470" y="400" width="104" height="6" fill="#f3ebd9" stroke="#2a2420" stroke-width="1.5"/>
  <path d="M470 430 L470 445 M476 425 L476 450" stroke="#a9b89a" stroke-width="1" opacity="0.4"/>
  <path d="M530 470 L530 402 M538 470 L538 402" fill="none" stroke="#b2463a" stroke-width="0"/>
  <path d="M528 402 L536 402 L538 478 L532 472 L528 480 Z" fill="#b2463a" stroke="#2a2420" stroke-width="1.5"/>
  <rect x="470" y="418" width="30" height="4" fill="#d9c9a0" opacity="0.6"/>

  <!-- umbrella stand: three umbrellas -->
  <g stroke="#2a2420" stroke-width="3" fill="none">
    <path d="M205 490 L200 352"/>
    <path d="M200 352 Q200 332 186 332"/>
    <path d="M240 490 L244 340"/>
    <path d="M244 340 Q244 320 258 320"/>
    <path d="M270 490 L276 360"/>
    <path d="M276 360 Q276 344 290 344"/>
  </g>
  <g fill="#6b4a2e" stroke="#2a2420" stroke-width="1.5">
    <path d="M200 352 Q200 332 186 332 L184 340 Q196 342 196 356 Z"/>
    <path d="M244 340 Q244 320 258 320 L260 328 Q250 330 248 344 Z"/>
    <path d="M276 360 Q276 344 290 344 L292 352 Q282 354 280 368 Z"/>
  </g>

  <!-- cylinder body -->
  <rect x="170" y="490" width="120" height="160" fill="#8c8677" stroke="#2a2420" stroke-width="3"/>
  <rect x="180" y="500" width="10" height="140" fill="#b0a998" opacity="0.8"/>
  <path d="M170 560 L290 560 M170 600 L290 600" stroke="#5f5a4e" stroke-width="2" opacity="0.6"/>
  <!-- wide rim -->
  <ellipse cx="230" cy="490" rx="72" ry="14" fill="#a39c8a" stroke="#2a2420" stroke-width="3"/>
  <ellipse cx="230" cy="490" rx="58" ry="8" fill="#6f695b" stroke="#2a2420" stroke-width="2"/>
  <ellipse cx="230" cy="650" rx="60" ry="9" fill="#6f695b" stroke="#2a2420" stroke-width="3"/>

  <!-- fog -->
  <g fill="#f7f2e6">
    <rect x="90" y="300" width="620" height="60" opacity="0.45"/>
    <rect x="90" y="520" width="620" height="50" opacity="0.5"/>
    <ellipse cx="400" cy="640" rx="360" ry="36" opacity="0.55"/>
    <ellipse cx="620" cy="720" rx="300" ry="40" opacity="0.5"/>
  </g>

  <!-- signature -->
  <text x="772" y="780" font-family="sans-serif" font-size="16" fill="#2a2420" text-anchor="end">P.</text>
</svg>