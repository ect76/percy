<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cob" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect width="60" height="40" fill="#b9b3a4"/>
      <ellipse cx="15" cy="12" rx="13" ry="9" fill="#a39d8e" stroke="#4a4740" stroke-width="2"/>
      <ellipse cx="45" cy="30" rx="13" ry="9" fill="#a39d8e" stroke="#4a4740" stroke-width="2"/>
      <ellipse cx="50" cy="8" rx="8" ry="6" fill="#968f80" stroke="#4a4740" stroke-width="2"/>
      <ellipse cx="8" cy="34" rx="8" ry="6" fill="#968f80" stroke="#4a4740" stroke-width="2"/>
    </pattern>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f4efe3" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4d3de"/>
      <stop offset="1" stop-color="#7f97a8"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe3"/>

  <!-- distant cottage wall hint -->
  <rect x="0" y="120" width="800" height="220" fill="#e6dccb" opacity="0.6"/>
  <path d="M120 120 L200 60 L280 120 Z" fill="#d8ccb4" stroke="#4a4740" stroke-width="3"/>
  <rect x="150" y="120" width="90" height="90" fill="#e0d4bc" stroke="#4a4740" stroke-width="3"/>
  <rect x="180" y="150" width="28" height="60" fill="#8c7a66" stroke="#4a4740" stroke-width="3"/>

  <!-- fog bands -->
  <rect x="0" y="260" width="800" height="90" fill="url(#fog)"/>
  <rect x="0" y="400" width="800" height="70" fill="url(#fog)" opacity="0.7"/>
  <rect x="0" y="520" width="800" height="50" fill="url(#fog)" opacity="0.5"/>

  <!-- cobbled floor -->
  <rect x="0" y="590" width="800" height="210" fill="url(#cob)"/>
  <line x1="0" y1="590" x2="800" y2="590" stroke="#4a4740" stroke-width="4"/>

  <!-- shadow -->
  <ellipse cx="400" cy="590" rx="210" ry="18" fill="#4a4740" opacity="0.25"/>

  <!-- tail -->
  <path d="M236 420 C180 430 170 380 200 360 C222 345 240 366 220 380" fill="none" stroke="#4a4740" stroke-width="8" stroke-linecap="round"/>
  <path d="M236 420 C180 430 170 380 200 360 C222 345 240 366 220 380" fill="none" stroke="#c4d3de" stroke-width="3" stroke-linecap="round"/>

  <!-- legs -->
  <g stroke="#4a4740" stroke-width="4" fill="#9fb3c2">
    <rect x="290" y="470" width="22" height="70" rx="8"/>
    <rect x="335" y="470" width="22" height="70" rx="8"/>
    <rect x="420" y="470" width="22" height="70" rx="8"/>
    <rect x="465" y="470" width="22" height="70" rx="8"/>
  </g>

  <!-- wire linkage from legs down to cam -->
  <g fill="none" stroke="#4a4740" stroke-width="3" stroke-linecap="round">
    <path d="M301 540 L301 575 L262 592"/>
    <path d="M346 540 L346 560 L300 578"/>
  </g>

  <!-- body -->
  <ellipse cx="380" cy="420" rx="150" ry="80" fill="url(#tin)" stroke="#222" stroke-width="4"/>
  <!-- body rivets / seam -->
  <path d="M260 420 Q380 445 500 420" fill="none" stroke="#4a4740" stroke-width="2" opacity="0.6"/>
  <circle cx="300" cy="400" r="4" fill="#4a4740"/>
  <circle cx="380" cy="440" r="4" fill="#4a4740"/>

  <!-- ears -->
  <circle cx="496" cy="346" r="26" fill="#e8a7a0" stroke="#222" stroke-width="4"/>
  <circle cx="530" cy="340" r="22" fill="#e8a7a0" stroke="#222" stroke-width="4"/>

  <!-- head -->
  <ellipse cx="520" cy="385" rx="60" ry="50" fill="url(#tin)" stroke="#222" stroke-width="4"/>
  <!-- snout -->
  <ellipse cx="572" cy="400" rx="20" ry="14" fill="#c4d3de" stroke="#222" stroke-width="4"/>
  <circle cx="580" cy="398" r="4" fill="#222"/>
  <!-- eye -->
  <circle cx="538" cy="372" r="7" fill="#222"/>
  <circle cx="540" cy="370" r="2" fill="#f4efe3"/>
  <!-- whiskers -->
  <g stroke="#4a4740" stroke-width="2" fill="none">
    <line x1="588" y1="396" x2="630" y2="386"/>
    <line x1="588" y1="404" x2="630" y2="410"/>
  </g>

  <!-- winding key on the flank -->
  <g stroke="#222" stroke-width="4" fill="none">
    <line x1="232" y1="410" x2="200" y2="410"/>
    <circle cx="222" cy="410" r="0"/>
  </g>
  <circle cx="232" cy="410" r="0"/>
  <circle cx="190" cy="410" r="20" fill="#c9a24a" stroke="#222" stroke-width="4"/>
  <circle cx="190" cy="410" r="6" fill="#f4efe3" stroke="#222" stroke-width="2"/>
  <line x1="170" y1="410" x2="210" y2="410" stroke="#222" stroke-width="3"/>
  <rect x="226" y="396" width="14" height="28" rx="3" fill="#c9a24a" stroke="#222" stroke-width="3"/>

  <!-- cam disc with low notch -->
  <circle cx="250" cy="630" r="58" fill="#c9a24a" stroke="#222" stroke-width="4"/>
  <circle cx="250" cy="630" r="14" fill="#f4efe3" stroke="#222" stroke-width="3"/>
  <path d="M250 572 A58 58 0 0 1 306 615" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M286 640 A38 38 0 0 1 300 600" fill="none" stroke="#7a5f1e" stroke-width="3"/>
  <line x1="250" y1="630" x2="250" y2="600" stroke="#7a5f1e" stroke-width="3"/>

  <!-- brass gears -->
  <circle cx="420" cy="650" r="46" fill="#c9a24a" stroke="#222" stroke-width="4" stroke-dasharray="9 8" stroke-linejoin="round"/>
  <circle cx="420" cy="650" r="40" fill="#c9a24a" stroke="#222" stroke-width="3"/>
  <circle cx="420" cy="650" r="10" fill="#f4efe3" stroke="#222" stroke-width="3"/>
  <circle cx="512" cy="622" r="30" fill="#d9b25c" stroke="#222" stroke-width="4" stroke-dasharray="7 6"/>
  <circle cx="512" cy="622" r="25" fill="#d9b25c" stroke="#222" stroke-width="3"/>
  <circle cx="512" cy="622" r="7" fill="#f4efe3" stroke="#222" stroke-width="2"/>

  <!-- pencil tip held beside the wire, not touching -->
  <g transform="rotate(-35 300 560)">
    <rect x="296" y="520" width="12" height="70" fill="#e9c94a" stroke="#222" stroke-width="3"/>
    <polygon points="296,590 308,590 302,606" fill="#f4efe3" stroke="#222" stroke-width="3"/>
    <rect x="296" y="520" width="12" height="10" fill="#c96b5a" stroke="#222" stroke-width="3"/>
  </g>

  <!-- signature P. in corner -->
  <path d="M722 738 V782 M722 738 H736 Q750 738 750 752 Q750 766 736 766 H722" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="762" cy="781" r="3.5" fill="#222"/>
</svg>