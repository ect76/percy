<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- outside: fog and rain -->
  <rect width="800" height="800" fill="#c9d3d6"/>
  <ellipse cx="150" cy="260" rx="260" ry="50" fill="#dfe6e7" opacity="0.8"/>
  <ellipse cx="680" cy="420" rx="240" ry="45" fill="#dfe6e7" opacity="0.7"/>
  <ellipse cx="200" cy="600" rx="300" ry="40" fill="#dfe6e7" opacity="0.6"/>
  <g stroke="#7c8fa0" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="30" y1="40" x2="10" y2="80"/>
    <line x1="90" y1="150" x2="70" y2="190"/>
    <line x1="60" y1="300" x2="40" y2="340"/>
    <line x1="30" y1="470" x2="10" y2="510"/>
    <line x1="110" y1="560" x2="90" y2="600"/>
    <line x1="700" y1="50" x2="680" y2="90"/>
    <line x1="750" y1="200" x2="730" y2="240"/>
    <line x1="720" y1="340" x2="700" y2="380"/>
    <line x1="765" y1="520" x2="745" y2="560"/>
    <line x1="690" y1="650" x2="670" y2="690"/>
    <line x1="40" y1="700" x2="20" y2="740"/>
    <line x1="150" y1="740" x2="130" y2="780"/>
    <line x1="740" y1="760" x2="720" y2="790"/>
  </g>
  <!-- cobbles outside -->
  <g fill="#8e8a84" stroke="#2b2118" stroke-width="1.5">
    <ellipse cx="60" cy="740" rx="30" ry="12"/>
    <ellipse cx="130" cy="770" rx="34" ry="13"/>
    <ellipse cx="620" cy="760" rx="36" ry="13"/>
    <ellipse cx="730" cy="720" rx="30" ry="12"/>
    <ellipse cx="50" cy="680" rx="26" ry="10"/>
  </g>
  <!-- doorway wall with opening -->
  <path fill-rule="evenodd" fill="#6b4f38" stroke="#2b2118" stroke-width="3"
        d="M0 0H800V800H0Z M170 70H630V800H170Z"/>
  <!-- interior back wall -->
  <rect x="170" y="70" width="460" height="730" fill="#f1e3c4"/>
  <!-- interior floor -->
  <rect x="170" y="640" width="460" height="160" fill="#b98c5b"/>
  <g stroke="#7a5a3a" stroke-width="2">
    <line x1="170" y1="670" x2="630" y2="670"/>
    <line x1="170" y1="705" x2="630" y2="705"/>
    <line x1="170" y1="740" x2="630" y2="740"/>
    <line x1="170" y1="775" x2="630" y2="775"/>
  </g>
  <!-- rain just inside threshold -->
  <g stroke="#7c8fa0" stroke-width="1.5" opacity="0.6">
    <line x1="190" y1="620" x2="180" y2="645"/>
    <line x1="260" y1="650" x2="250" y2="675"/>
    <line x1="570" y1="630" x2="560" y2="655"/>
  </g>
  <!-- shelves: bare planks with brackets -->
  <g stroke="#2b2118" stroke-width="2.5" fill="#8a6244">
    <rect x="200" y="200" width="400" height="12"/>
    <rect x="200" y="320" width="400" height="12"/>
    <rect x="200" y="420" width="400" height="12"/>
  </g>
  <g fill="#5a4330" stroke="#2b2118" stroke-width="1.5">
    <path d="M220 212 L240 212 L230 240 Z"/>
    <path d="M560 212 L580 212 L570 240 Z"/>
    <path d="M220 332 L240 332 L230 360 Z"/>
    <path d="M560 332 L580 332 L570 360 Z"/>
  </g>
  <!-- empty tins on middle shelf (no contents) -->
  <g fill="#bfa27a" stroke="#2b2118" stroke-width="1.5">
    <rect x="240" y="280" width="40" height="40"/>
    <rect x="300" y="290" width="30" height="30"/>
  </g>
  <!-- drip mug on lower shelf, on a wet patch -->
  <ellipse cx="410" cy="432" rx="34" ry="5" fill="#7c8fa0" opacity="0.6"/>
  <rect x="390" y="370" width="40" height="60" fill="#e8e0d0" stroke="#2b2118" stroke-width="2"/>
  <ellipse cx="410" cy="370" rx="20" ry="5" fill="#f7f2e6" stroke="#2b2118" stroke-width="2"/>
  <!-- counter -->
  <rect x="200" y="500" width="400" height="100" fill="#9a6b43" stroke="#2b2118" stroke-width="3"/>
  <rect x="190" y="488" width="420" height="22" fill="#c99a6a" stroke="#2b2118" stroke-width="3"/>
  <g stroke="#6e4b2e" stroke-width="2">
    <line x1="200" y1="540" x2="600" y2="540"/>
    <line x1="200" y1="575" x2="600" y2="575"/>
  </g>
  <!-- door frame outline -->
  <path d="M170 70 V800 M630 70 V800 M170 70 H630" fill="none" stroke="#2b2118" stroke-width="3"/>
  <!-- signature -->
  <text x="752" y="784" font-family="serif" font-size="22" fill="#2b2118">P.</text>
</svg>