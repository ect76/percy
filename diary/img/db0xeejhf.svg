<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>
  <rect x="40" y="40" width="720" height="720" fill="#e9e1cc" opacity="0.6"/>
  <!-- wall fog wash -->
  <rect x="60" y="60" width="680" height="680" fill="#d9d4c6" opacity="0.5"/>
  <!-- cupboard outer frame -->
  <rect x="150" y="120" width="500" height="580" fill="#8a6a4a"/>
  <!-- cupboard interior back -->
  <rect x="180" y="150" width="440" height="520" fill="#5e4632"/>
  <!-- shelves -->
  <rect x="180" y="260" width="440" height="16" fill="#b08c63"/>
  <rect x="180" y="430" width="440" height="16" fill="#b08c63"/>
  <rect x="180" y="600" width="440" height="16" fill="#b08c63"/>
  <!-- shelf undersides -->
  <rect x="180" y="276" width="440" height="6" fill="#3e2e20"/>
  <rect x="180" y="446" width="440" height="6" fill="#3e2e20"/>
  <rect x="180" y="616" width="440" height="6" fill="#3e2e20"/>
  <!-- top shelf: bare, dust ghosts -->
  <rect x="230" y="222" width="90" height="38" fill="none" stroke="#2a2420" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="350" y="222" width="90" height="38" fill="none" stroke="#2a2420" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>
  <rect x="190" y="262" width="420" height="4" fill="#d8c7a8" opacity="0.5"/>
  <!-- seed tin on middle shelf -->
  <ellipse cx="340" cy="430" rx="50" ry="10" fill="#6f7d86"/>
  <rect x="290" y="350" width="100" height="80" fill="#8fa0a8"/>
  <ellipse cx="340" cy="350" rx="50" ry="10" fill="#c4d0d6"/>
  <rect x="304" y="372" width="72" height="36" fill="#e8dcc0"/>
  <rect x="304" y="372" width="72" height="36" fill="none" stroke="#2a2420" stroke-width="2"/>
  <circle cx="340" cy="390" r="8" fill="#c2543a"/>
  <path d="M290 350 L290 430 M390 350 L390 430" stroke="#2a2420" stroke-width="3" fill="none"/>
  <ellipse cx="340" cy="350" rx="50" ry="10" fill="none" stroke="#2a2420" stroke-width="3"/>
  <path d="M290 430 Q340 440 390 430" stroke="#2a2420" stroke-width="3" fill="none"/>
  <!-- empty space where the fish tins were (bottom shelf) -->
  <rect x="220" y="540" width="260" height="60" fill="#3e2e20" opacity="0.45"/>
  <rect x="220" y="540" width="260" height="60" fill="none" stroke="#2a2420" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="238" y="584" width="224" height="16" fill="#b8a07a" opacity="0.5"/>
  <!-- remaining sardine tin at far right -->
  <rect x="500" y="550" width="80" height="50" fill="#c9a24a"/>
  <rect x="500" y="550" width="80" height="50" fill="none" stroke="#2a2420" stroke-width="3"/>
  <rect x="512" y="564" width="56" height="22" fill="#e8dcc0"/>
  <!-- ink contours of shelves -->
  <rect x="150" y="120" width="500" height="580" fill="none" stroke="#2a2420" stroke-width="4"/>
  <rect x="180" y="150" width="440" height="520" fill="none" stroke="#2a2420" stroke-width="2"/>
  <line x1="180" y1="260" x2="620" y2="260" stroke="#2a2420" stroke-width="3"/>
  <line x1="180" y1="430" x2="620" y2="430" stroke="#2a2420" stroke-width="3"/>
  <line x1="180" y1="600" x2="620" y2="600" stroke="#2a2420" stroke-width="3"/>
  <!-- cupboard feet and floor shadow -->
  <rect x="130" y="700" width="540" height="18" fill="#a48a6a"/>
  <path d="M130 718 L670 718" stroke="#2a2420" stroke-width="3"/>
  <!-- fog at base -->
  <rect x="0" y="700" width="800" height="100" fill="#f3ecdc" opacity="0.55"/>
  <text x="740" y="770" font-family="serif" font-size="22" fill="#2a2420">P.</text>
</svg>