    <line x1="600" y1="30" x2="580" y2="70"/>
    <line x1="650" y1="90" x2="630" y2="130"/>
    <line x1="720" y1="40" x2="700" y2="80"/>
    <line x1="770" y1="140" x2="750" y2="180"/>
    <line x1="40" y1="40" x2="20" y2="80"/>
    <line x1="120" y1="130" x2="100" y2="170"/>
    <line x1="150" y1="200" x2="130" y2="240"/>
    <line x1="280" y1="200" x2="260" y2="240"/>
    <line x1="430" y1="200" x2="410" y2="240"/>
    <line x1="500" y1="330" x2="480" y2="370"/>
    <line x1="300" y1="420" x2="280" y2="460"/>
