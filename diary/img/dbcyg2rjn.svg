  <path d="M396 470 L396 452 Q400 446 404 452 L404 470 Z" fill="#b08a4a" stroke="#1f1b18" stroke-width="1"/>

  <!-- fog bands over the tower base -->
  <ellipse cx="400" cy="400" rx="320" ry="26" fill="#f3ecdc" opacity="0.55"/>
  <ellipse cx="420" cy="455" rx="260" ry="22" fill="#f3ecdc" opacity="0.5"/>

  <!-- cobbled lane converging to the tower -->
  <path d="M0 800 L800 800 L432 480 L368 480 Z" fill="#7d7467" stroke="#1f1b18" stroke-width="2.5"/>
  <g fill="none" stroke="#4e463e" stroke-width="1.5" opacity="0.8">
    <ellipse cx="120" cy="740" rx="26" ry="10"/>
    <ellipse cx="260" cy="770" rx="30" ry="11"/>
    <ellipse cx="520" cy="760" rx="28" ry="10"/>
    <ellipse cx="660" cy="725" rx="22" ry="9"/>
