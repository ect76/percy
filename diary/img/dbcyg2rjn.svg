<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="430" fill="#c9d3d6"/>

  <!-- distant hills in fog -->
  <path d="M0 330 Q120 290 240 320 T480 318 T800 300 L800 380 L0 380 Z" fill="#aebcc0" stroke="#1f1b18" stroke-width="1.5"/>

  <!-- bell tower at the end of the lane -->
  <rect x="365" y="270" width="70" height="210" fill="#8a7f72" stroke="#1f1b18" stroke-width="2.5"/>
  <rect x="372" y="225" width="56" height="48" fill="#6d6358" stroke="#1f1b18" stroke-width="2"/>
  <path d="M358 230 L400 168 L442 230 Z" fill="#4b4a52" stroke="#1f1b18" stroke-width="2.5"/>
  <rect x="381" y="236" width="10" height="26" fill="#2a2724"/>
  <rect x="409" y="236" width="10" height="26" fill="#2a2724"/>
  <circle cx="400" cy="306" r="15" fill="#f3ecdc" stroke="#1f1b18" stroke-width="2"/>
