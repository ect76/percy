    <line x1="250" y1="520" x2="228" y2="560"/>
    <line x1="560" y1="540" x2="538" y2="580"/>
    <line x1="640" y1="600" x2="618" y2="640"/>
    <line x1="420" y1="660" x2="398" y2="700"/>
    <line x1="170" y1="700" x2="148" y2="740"/>
    <line x1="700" y1="740" x2="678" y2="780"/>
    <line x1="520" y1="760" x2="498" y2="795"/>
  </g>

  <!-- signature -->
  <text x="762" y="782" font-size="22" text-anchor="end" fill="#1f1b18">P.</text>
