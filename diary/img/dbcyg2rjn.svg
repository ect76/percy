    <ellipse cx="740" cy="630" rx="18" ry="8"/>
    <ellipse cx="300" cy="700" rx="14" ry="6"/>
    <ellipse cx="560" cy="690" rx="15" ry="6"/>
  </g>
  <!-- wet sheen on the lane -->
  <path d="M250 800 L330 520 L345 520 L300 800 Z" fill="#f3ecdc" opacity="0.12"/>

  <!-- bakery front on the left -->
  <rect x="0" y="150" width="190" height="500" fill="#b98c6a" stroke="#1f1b18" stroke-width="2.5"/>
  <rect x="30" y="300" width="150" height="40" fill="#e8d5b0" stroke="#1f1b18" stroke-width="2"/>
  <text x="105" y="328" font-size="18" text-anchor="middle" fill="#1f1b18">Crumb's Bakery</text>
  <path d="M60 620 L60 400 Q60 370 100 370 Q140 370 140 400 L140 620 Z" fill="#3b2d26" stroke="#1f1b18" stroke-width="2.5"/>
  <path d="M70 620 L70 405 Q70 382 100 382 Q130 382 130 405 L130 620 Z" fill="#f2b45c"/>
  <path d="M100 382 L100 620" stroke="#3b2d26" stroke-width="2"/>
  <rect x="150" y="380" width="26" height="40" fill="#f5d88a" stroke="#1f1b18" stroke-width="2"/>

  <!-- doorway step -->
  <rect x="50" y="620" width="110" height="14" fill="#6d6358" stroke="#1f1b18" stroke-width="2"/>

  <!-- Pond Lane cottage on the right -->
  <rect x="560" y="260" width="240" height="390" fill="#9fb3a0" stroke="#1f1b18" stroke-width="2.5"/>
  <path d="M548 262 L680 168 L812 262 Z" fill="#6b5a4e" stroke="#1f1b18" stroke-width="2.5"/>
  <rect x="612" y="326" width="70" height="90" fill="#f5d88a" stroke="#1f1b18" stroke-width="2.5"/>
  <path d="M647 326 L647 416 M612 371 L682 371" stroke="#1f1b18" stroke-width="2"/>
  <rect x="612" y="326" width="70" height="90" fill="none" stroke="#1f1b18" stroke-width="2.5"/>
  <rect x="705" y="470" width="40" height="70" fill="#5a4636" stroke="#1f1b18" stroke-width="2"/>

  <!-- fog veil in the foreground middle -->
  <ellipse cx="400" cy="560" rx="420" ry="40" fill="#f3ecdc" opacity="0.35"/>

  <!-- rain -->
  <g stroke="#4f5e6b" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
