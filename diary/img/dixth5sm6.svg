<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cobbles" x="0" y="0" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect width="60" height="40" fill="#8d8a84"/>
      <ellipse cx="15" cy="10" rx="14" ry="8" fill="#a39f97" stroke="#3a3835" stroke-width="2"/>
      <ellipse cx="45" cy="30" rx="14" ry="8" fill="#a39f97" stroke="#3a3835" stroke-width="2"/>
    </pattern>
    <pattern id="stone" x="0" y="0" width="50" height="30" patternUnits="userSpaceOnUse">
      <rect width="50" height="30" fill="#8f897d"/>
      <path d="M0 15 H50 M25 0 V15 M0 30 V15 M50 15 V30" stroke="#5e5a52" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <!-- paper and sky -->
  <rect width="800" height="800" fill="#e9e3d3"/>
  <rect x="0" y="0" width="800" height="330" fill="#cfd6d6"/>

  <!-- distant fog banks -->
  <rect x="0" y="260" width="800" height="70" fill="#f4f1ea" opacity="0.7"/>
  <rect x="0" y="330" width="800" height="40" fill="#f4f1ea" opacity="0.5"/>

  <!-- tower -->
  <rect x="250" y="120" width="300" height="560" fill="url(#stone)" stroke="#222" stroke-width="8"/>
  <!-- battlements -->
  <g fill="url(#stone)" stroke="#222" stroke-width="6">
    <rect x="250" y="88" width="42" height="40"/>
    <rect x="308" y="88" width="42" height="40"/>
    <rect x="366" y="88" width="42" height="40"/>
    <rect x="424" y="88" width="42" height="40"/>
    <rect x="482" y="88" width="68" height="40"/>
  </g>
  <rect x="250" y="120" width="300" height="12" fill="#5e5a52"/>

  <!-- clock face -->
  <circle cx="400" cy="300" r="124" fill="#4a4740" stroke="#222" stroke-width="8"/>
  <circle cx="400" cy="300" r="108" fill="#f2ead8" stroke="#222" stroke-width="5"/>
  <!-- hour marks -->
  <g stroke="#222" stroke-width="5" stroke-linecap="round">
    <line x1="400" y1="208" x2="400" y2="224"/>
    <line x1="492" y1="300" x2="476" y2="300"/>
    <line x1="400" y1="392" x2="400" y2="376"/>
    <line x1="308" y1="300" x2="324" y2="300"/>
    <line x1="455" y1="225" x2="444" y2="236"/>
    <line x1="475" y1="345" x2="462" y2="340"/>
    <line x1="345" y1="345" x2="338" y2="340"/>
    <line x1="325" y1="225" x2="336" y2="236"/>
  </g>
  <!-- cracks in the face -->
  <polyline points="356,246 368,262 360,276 376,290 366,306 384,322 378,340" fill="none" stroke="#3a3835" stroke-width="3"/>
  <polyline points="376,290 396,284 410,296" fill="none" stroke="#3a3835" stroke-width="2"/>
  <polyline points="440,250 432,266 446,276" fill="none" stroke="#3a3835" stroke-width="2"/>

  <!-- hands -->
  <line x1="400" y1="300" x2="442" y2="314" stroke="#222" stroke-width="10" stroke-linecap="round"/>
  <!-- crooked minute hand -->
  <path d="M400 300 L402 232 L392 218 L398 206" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="300" r="9" fill="#222"/>

  <!-- arched window below clock -->
  <path d="M378 430 V470 Q378 486 400 486 Q422 486 422 470 V430 Z" fill="#3b3a36" stroke="#222" stroke-width="6"/>

  <!-- lane -->
  <polygon points="0,560 800,560 800,800 0,800" fill="url(#cobbles)"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#222" stroke-width="6"/>

  <!-- tower base shadow on lane -->
  <rect x="250" y="560" width="300" height="20" fill="#3a3835" opacity="0.35"/>

  <!-- sign post and board -->
  <rect x="598" y="380" width="12" height="330" fill="#5a422b" stroke="#222" stroke-width="5"/>
  <rect x="520" y="330" width="200" height="68" rx="6" fill="#7a5a3a" stroke="#222" stroke-width="6"/>
  <text x="620" y="373" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#f2ead8">the bell tower</text>

  <!-- foreground fog -->
  <rect x="0" y="600" width="800" height="60" fill="#f4f1ea" opacity="0.55"/>
  <rect x="0" y="700" width="800" height="100" fill="#f4f1ea" opacity="0.35"/>

  <!-- signature -->
  <text x="766" y="782" text-anchor="end" font-family="sans-serif" font-size="22" fill="#222">P.</text>
</svg>