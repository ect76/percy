<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- wall -->
  <rect x="0" y="0" width="800" height="800" fill="#e9e1cf"/>

  <!-- window frame -->
  <rect x="136" y="46" width="528" height="364" fill="#4a4540"/>

  <!-- glass with fog -->
  <rect x="150" y="60" width="500" height="336" fill="#a9b8bb"/>
  <rect x="150" y="60" width="500" height="120" fill="#c3cfd0" opacity="0.7"/>
  <ellipse cx="260" cy="150" rx="140" ry="30" fill="#dfe6e6" opacity="0.8"/>
  <ellipse cx="560" cy="200" rx="160" ry="34" fill="#dfe6e6" opacity="0.7"/>

  <!-- faint bell tower in the fog -->
  <rect x="384" y="150" width="34" height="140" fill="#7d8c90" opacity="0.6"/>
  <path d="M378 150 L401 112 L424 150 Z" fill="#6d7d82" opacity="0.6"/>

  <!-- lane and cobbles -->
  <path d="M150 300 L650 300 L650 396 L150 396 Z" fill="#7f8b86"/>
  <g fill="none" stroke="#56615e" stroke-width="2" opacity="0.7">
    <ellipse cx="200" cy="330" rx="14" ry="7"/>
    <ellipse cx="250" cy="352" rx="14" ry="7"/>
    <ellipse cx="310" cy="335" rx="14" ry="7"/>
    <ellipse cx="380" cy="360" rx="14" ry="7"/>
    <ellipse cx="450" cy="332" rx="14" ry="7"/>
    <ellipse cx="520" cy="356" rx="14" ry="7"/>
    <ellipse cx="590" cy="334" rx="14" ry="7"/>
    <ellipse cx="230" cy="382" rx="14" ry="7"/>
    <ellipse cx="420" cy="384" rx="14" ry="7"/>
    <ellipse cx="600" cy="380" rx="14" ry="7"/>
  </g>

  <!-- rain streaks -->
  <g stroke="#4f6166" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="175" y1="80" x2="168" y2="104"/>
    <line x1="232" y1="72" x2="225" y2="98"/>
    <line x1="290" y1="92" x2="283" y2="118"/>
    <line x1="346" y1="66" x2="339" y2="92"/>
    <line x1="410" y1="86" x2="403" y2="112"/>
    <line x1="468" y1="70" x2="461" y2="96"/>
    <line x1="520" y1="94" x2="513" y2="120"/>
    <line x1="582" y1="76" x2="575" y2="102"/>
    <line x1="628" y1="100" x2="621" y2="126"/>
    <line x1="200" y1="150" x2="193" y2="176"/>
    <line x1="500" y1="236" x2="493" y2="262"/>
    <line x1="620" y1="250" x2="613" y2="276"/>
    <line x1="180" y1="250" x2="173" y2="276"/>
    <line x1="290" y1="220" x2="283" y2="246"/>
    <line x1="560" y1="130" x2="553" y2="156"/>
    <line x1="260" y1="30" x2="253" y2="50"/>
  </g>

  <!-- window mullions -->
  <g stroke="#4a4540" stroke-width="10">
    <line x1="400" y1="60" x2="400" y2="396"/>
    <line x1="150" y1="228" x2="650" y2="228"/>
  </g>
  <!-- sill -->
  <rect x="124" y="396" width="552" height="16" fill="#5a524b"/>

  <!-- desk -->
  <rect x="0" y="430" width="800" height="370" fill="#7a5a3c"/>
  <rect x="0" y="430" width="800" height="12" fill="#5b412a"/>
  <g stroke="#5b412a" stroke-width="2" opacity="0.5">
    <line x1="0" y1="500" x2="800" y2="506"/>
    <line x1="0" y1="600" x2="800" y2="594"/>
    <line x1="0" y1="720" x2="800" y2="726"/>
  </g>

  <!-- folded map sheet -->
  <rect x="150" y="470" width="280" height="230" fill="#f4efe1" stroke="#2b2a28" stroke-width="3"/>
  <g stroke="#8c8476" stroke-width="2" stroke-dasharray="8 6" fill="none">
    <line x1="290" y1="470" x2="290" y2="700"/>
    <line x1="150" y1="585" x2="430" y2="585"/>
  </g>
  <!-- pencil lines on map -->
  <g stroke="#6b6b6b" stroke-width="2" fill="none">
    <path d="M176 530 Q230 512 282 540 T400 530"/>
    <path d="M176 620 L250 606 L330 630 L404 612"/>
    <path d="M320 500 L400 500 L400 560"/>
    <path d="M176 650 Q240 668 300 646"/>
  </g>
  <!-- compass rose -->
  <g transform="translate(386 668)" stroke="#2b2a28" stroke-width="2" fill="none">
    <circle r="18"/>
    <path d="M0 -24 L5 0 L0 24 L-5 0 Z" fill="#2b2a28"/>
    <path d="M-24 0 L0 4 L24 0 L0 -4 Z" fill="#2b2a28" opacity="0.5"/>
  </g>

  <!-- coin shadow -->
  <ellipse cx="552" cy="580" rx="64" ry="20" fill="#4a3320" opacity="0.45"/>
  <!-- coin -->
  <circle cx="540" cy="560" r="62" fill="#d9a93c" stroke="#2b2a28" stroke-width="3"/>
  <circle cx="540" cy="560" r="50" fill="none" stroke="#9c7322" stroke-width="3"/>
  <!-- tower emblem on coin -->
  <g fill="#9c7322">
    <rect x="530" y="530" width="20" height="50"/>
    <path d="M526 530 L540 508 L554 530 Z"/>
    <rect x="520" y="572" width="40" height="8"/>
  </g>
  <path d="M480 540 Q500 520 520 528" stroke="#fff3c4" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- pencils in cup -->
  <rect x="650" y="470" width="50" height="60" fill="#c9c2b3" stroke="#2b2a28" stroke-width="2"/>
  <g stroke="#2b2a28" stroke-width="2">
    <line x1="660" y1="470" x2="648" y2="420" stroke="#d9573b" stroke-width="7"/>
    <line x1="672" y1="470" x2="672" y2="412" stroke="#e7b437" stroke-width="7"/>
    <line x1="686" y1="470" x2="698" y2="416" stroke="#3b6a8c" stroke-width="7"/>
  </g>

  <!-- sardine tin -->
  <rect x="610" y="660" width="80" height="44" rx="4" fill="#3b6a8c" stroke="#2b2a28" stroke-width="3"/>
  <rect x="610" y="672" width="80" height="20" fill="#e7b437"/>
  <line x1="610" y1="660" x2="690" y2="660" stroke="#2b2a28" stroke-width="2"/>

  <!-- signature -->
  <text x="752" y="780" font-size="22" fill="#2b2a28">P.</text>
</svg>