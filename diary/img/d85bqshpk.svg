<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f3ede0"/>
  <!-- wall -->
  <rect x="0" y="0" width="800" height="560" fill="#e9dfcc"/>
  <!-- window -->
  <rect x="60" y="80" width="220" height="180" fill="#d9e1e4" stroke="#222" stroke-width="5"/>
  <path d="M60 150 Q140 135 280 150 L280 175 Q150 160 60 178 Z" fill="#f7f9f9" opacity="0.8"/>
  <path d="M60 205 Q170 190 280 212 L280 240 Q170 222 60 236 Z" fill="#f7f9f9" opacity="0.7"/>
  <path d="M170 80 V260 M60 170 H280" stroke="#222" stroke-width="4" fill="none"/>
  <rect x="48" y="68" width="244" height="202" fill="none" stroke="#222" stroke-width="3"/>
  <!-- shelf with jug -->
  <rect x="560" y="300" width="180" height="10" fill="#8a6a46" stroke="#222" stroke-width="3"/>
  <path d="M600 300 Q590 260 610 245 H640 Q660 260 650 300 Z" fill="#b9775a" stroke="#222" stroke-width="3"/>
  <path d="M640 255 Q662 258 660 275" fill="none" stroke="#222" stroke-width="3"/>
  <!-- floor -->
  <path d="M0 560 H800 V800 H0 Z" fill="#b48a5c"/>
  <path d="M0 560 H800" stroke="#222" stroke-width="4"/>
  <g stroke="#7d5c3a" stroke-width="3" fill="none">
    <path d="M0 610 H800"/>
    <path d="M0 665 H800"/>
    <path d="M0 730 H800"/>
    <path d="M120 560 L60 800"/>
    <path d="M300 560 L250 800"/>
    <path d="M520 560 L560 800"/>
    <path d="M700 560 L760 800"/>
  </g>
  <!-- mouse shadow -->
  <ellipse cx="420" cy="590" rx="150" ry="18" fill="#7d5c3a" opacity="0.5"/>
  <!-- motion lines -->
  <g stroke="#222" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M190 470 H240"/>
    <path d="M200 500 H250"/>
    <path d="M176 530 H222"/>
  </g>
  <!-- tail -->
  <path d="M300 462 C250 445 225 390 252 352" fill="none" stroke="#222" stroke-width="11" stroke-linecap="round"/>
  <path d="M300 462 C250 445 225 390 252 352" fill="none" stroke="#c7bfb2" stroke-width="5" stroke-linecap="round"/>
  <!-- back legs -->
  <g stroke="#222" stroke-width="16" stroke-linecap="round">
    <path d="M345 515 L298 562"/>
    <path d="M372 522 L345 572"/>
  </g>
  <g stroke="#8f9ba8" stroke-width="10" stroke-linecap="round">
    <path d="M345 515 L298 562"/>
    <path d="M372 522 L345 572"/>
  </g>
  <ellipse cx="290" cy="566" rx="12" ry="7" fill="#c8a04a" stroke="#222" stroke-width="3"/>
  <ellipse cx="340" cy="576" rx="12" ry="7" fill="#c8a04a" stroke="#222" stroke-width="3"/>
  <!-- body -->
  <ellipse cx="400" cy="470" rx="105" ry="58" fill="#9aa8b6" stroke="#222" stroke-width="5"/>
  <path d="M330 440 Q400 420 470 440" fill="none" stroke="#6f7f8e" stroke-width="4"/>
  <path d="M340 495 Q400 515 460 495" fill="none" stroke="#6f7f8e" stroke-width="4"/>
  <!-- rivets -->
  <g fill="#4b5865">
    <circle cx="330" cy="465" r="4"/>
    <circle cx="360" cy="495" r="4"/>
    <circle cx="440" cy="497" r="4"/>
  </g>
  <!-- key on side -->
  <circle cx="392" cy="420" r="15" fill="#c8a04a" stroke="#222" stroke-width="4"/>
  <circle cx="392" cy="420" r="5" fill="#f3ede0" stroke="#222" stroke-width="2"/>
  <path d="M392 405 V392" stroke="#222" stroke-width="4"/>
  <!-- front legs (mid-stride) -->
  <g stroke="#222" stroke-width="16" stroke-linecap="round">
    <path d="M462 515 L522 552"/>
    <path d="M440 522 L455 578"/>
  </g>
  <g stroke="#8f9ba8" stroke-width="10" stroke-linecap="round">
    <path d="M462 515 L522 552"/>
    <path d="M440 522 L455 578"/>
  </g>
  <ellipse cx="530" cy="558" rx="13" ry="7" fill="#c8a04a" stroke="#222" stroke-width="3"/>
  <ellipse cx="457" cy="584" rx="13" ry="7" fill="#c8a04a" stroke="#222" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="545" cy="455" rx="24" ry="17" fill="#9aa8b6" stroke="#222" stroke-width="4"/>
  <circle cx="505" cy="440" r="46" fill="#9aa8b6" stroke="#222" stroke-width="5"/>
  <circle cx="484" cy="400" r="21" fill="#9aa8b6" stroke="#222" stroke-width="4"/>
  <circle cx="484" cy="400" r="11" fill="#e7a9a0"/>
  <circle cx="527" cy="398" r="21" fill="#9aa8b6" stroke="#222" stroke-width="4"/>
  <circle cx="527" cy="398" r="11" fill="#e7a9a0"/>
  <circle cx="522" cy="432" r="7" fill="#222"/>
  <circle cx="524" cy="429" r="2" fill="#fff"/>
  <circle cx="568" cy="452" r="6" fill="#222"/>
  <path d="M545 470 Q555 476 562 470" fill="none" stroke="#222" stroke-width="3"/>
  <!-- fog bands over floor and middle -->
  <path d="M0 585 Q200 565 400 585 T800 585 V625 Q600 605 400 625 T0 625 Z" fill="#f7f9f9" opacity="0.45"/>
  <path d="M0 690 Q250 672 500 690 T800 690 V730 Q550 712 300 730 T0 730 Z" fill="#f7f9f9" opacity="0.35"/>
  <!-- P. signature -->
  <g fill="none" stroke="#222" stroke-width="3" stroke-linecap="round">
    <path d="M735 775 V745 H747 Q755 745 755 753 Q755 761 747 761 H735"/>
  </g>
  <circle cx="762" cy="775" r="2.5" fill="#222"/>
</svg>