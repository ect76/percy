<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2640"/>
      <stop offset="1" stop-color="#34405c"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d1d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#c9d1d6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe6d2"/>

  <!-- night sky -->
  <rect x="20" y="20" width="760" height="420" fill="url(#sky)" stroke="#1d1d1d" stroke-width="3"/>

  <!-- stars -->
  <g fill="#f4efd8">
    <circle cx="90" cy="70" r="2.5"/><circle cx="160" cy="120" r="1.8"/><circle cx="240" cy="60" r="2.2"/>
    <circle cx="330" cy="110" r="1.6"/><circle cx="470" cy="70" r="2.4"/><circle cx="560" cy="140" r="1.8"/>
    <circle cx="650" cy="80" r="2.6"/><circle cx="720" cy="150" r="1.7"/><circle cx="700" cy="40" r="1.5"/>
    <circle cx="120" cy="200" r="1.6"/><circle cx="250" cy="250" r="1.4"/><circle cx="600" cy="230" r="1.5"/>
    <circle cx="520" cy="30" r="1.6"/><circle cx="380" cy="40" r="1.8"/><circle cx="190" cy="320" r="1.3"/>
  </g>

  <!-- distant hills -->
  <path d="M20 380 Q120 330 230 370 T420 350 T620 360 T780 340 L780 440 L20 440 Z" fill="#2b3446" stroke="#1d1d1d" stroke-width="2"/>

  <!-- bell tower at end of lane -->
  <path d="M372 330 L372 190 L400 130 L428 190 L428 330 Z" fill="#5a5148" stroke="#1d1d1d" stroke-width="3"/>
  <path d="M365 190 L400 120 L435 190 Z" fill="#3a3530" stroke="#1d1d1d" stroke-width="3"/>
  <rect x="383" y="150" width="34" height="22" fill="#1d1d1d"/>
  <!-- clock face -->
  <circle cx="400" cy="224" r="22" fill="#e9e3cf" stroke="#1d1d1d" stroke-width="2.5"/>
  <line x1="400" y1="224" x2="400" y2="208" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="400" y1="224" x2="412" y2="229" stroke="#1d1d1d" stroke-width="2"/>
  <!-- crooked minute hand -->
  <line x1="400" y1="224" x2="389" y2="204" stroke="#1d1d1d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- crack -->
  <path d="M410 204 L416 212 L412 218 L420 228 L414 236" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
  <rect x="380" y="260" width="40" height="60" fill="#2d2823" stroke="#1d1d1d" stroke-width="2"/>
  <path d="M390 275 L410 275 M390 290 L410 290 M390 305 L410 305" stroke="#6b6055" stroke-width="2"/>

  <!-- lane -->
  <path d="M150 800 L385 330 L415 330 L650 800 Z" fill="#8a7d6b" stroke="#1d1d1d" stroke-width="3"/>
  <g fill="none" stroke="#4d4539" stroke-width="1.5">
    <ellipse cx="260" cy="700" rx="14" ry="6"/><ellipse cx="400" cy="740" rx="18" ry="7"/>
    <ellipse cx="520" cy="690" rx="12" ry="5"/><ellipse cx="350" cy="560" rx="8" ry="3.5"/>
    <ellipse cx="455" cy="520" rx="7" ry="3"/><ellipse cx="380" cy="440" rx="5" ry="2.2"/>
    <ellipse cx="300" cy="620" rx="10" ry="4.5"/><ellipse cx="500" cy="600" rx="10" ry="4.5"/>
  </g>

  <!-- far cottages -->
  <path d="M320 350 L340 320 L360 350 Z" fill="#4a4036" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="322" y="350" width="36" height="34" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <path d="M440 350 L460 320 L480 350 Z" fill="#4a4036" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="442" y="350" width="36" height="34" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>

  <!-- left cottages -->
  <path d="M10 430 L85 355 L160 430 Z" fill="#6b4a3a" stroke="#1d1d1d" stroke-width="3"/>
  <rect x="10" y="430" width="150" height="270" fill="#a88a6e" stroke="#1d1d1d" stroke-width="3"/>
  <rect x="32" y="462" width="34" height="40" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="104" y="462" width="34" height="40" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="32" y="550" width="34" height="40" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="104" y="550" width="34" height="40" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="68" y="620" width="30" height="80" fill="#4a3a2c" stroke="#1d1d1d" stroke-width="2"/>

  <path d="M205 400 L250 362 L290 400 Z" fill="#6b4a3a" stroke="#1d1d1d" stroke-width="2.5"/>
  <rect x="205" y="400" width="85" height="120" fill="#8f7559" stroke="#1d1d1d" stroke-width="2.5"/>
  <rect x="220" y="425" width="22" height="28" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="1.8"/>
  <rect x="260" y="425" width="22" height="28" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="1.8"/>

  <!-- right cottages -->
  <path d="M640 430 L715 355 L790 430 Z" fill="#6b4a3a" stroke="#1d1d1d" stroke-width="3"/>
  <rect x="640" y="430" width="150" height="270" fill="#a88a6e" stroke="#1d1d1d" stroke-width="3"/>
  <rect x="662" y="462" width="34" height="40" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="734" y="462" width="34" height="40" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="662" y="550" width="34" height="40" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="734" y="550" width="34" height="40" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="700" y="620" width="30" height="80" fill="#4a3a2c" stroke="#1d1d1d" stroke-width="2"/>

  <path d="M510 400 L555 362 L595 400 Z" fill="#6b4a3a" stroke="#1d1d1d" stroke-width="2.5"/>
  <rect x="510" y="400" width="85" height="120" fill="#8f7559" stroke="#1d1d1d" stroke-width="2.5"/>
  <rect x="525" y="425" width="22" height="28" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="1.8"/>
  <rect x="565" y="425" width="22" height="28" fill="#0d0d1a" stroke="#1d1d1d" stroke-width="1.8"/>

  <!-- Hattersley Clocks case beside the lane -->
  <path d="M600 560 L612 470 L640 470 L652 560 Z" fill="#4a2f1e" stroke="#1d1d1d" stroke-width="2"/>
  <circle cx="626" cy="490" r="9" fill="#f2ecd9" stroke="#1d1d1d" stroke-width="1.5"/>
  <rect x="618" y="520" width="16" height="22" fill="#1d1d1d"/>
  <line x1="626" y1="520" x2="626" y2="508" stroke="#c9a24a" stroke-width="1.5"/>
  <rect x="604" y="545" width="44" height="7" fill="#e9e3cf" stroke="#1d1d1d" stroke-width="1"/>
  <text x="626" y="551" font-family="serif" font-size="4" text-anchor="middle" fill="#1d1d1d">HATTERSLEY CLOCKS - MOSSBROOK</text>

  <!-- fog bands -->
  <rect x="20" y="560" width="760" height="120" fill="url(#fog)"/>
  <ellipse cx="200" cy="700" rx="260" ry="50" fill="#dfe5e8" opacity="0.55"/>
  <ellipse cx="620" cy="730" rx="250" ry="45" fill="#dfe5e8" opacity="0.5"/>
  <ellipse cx="400" cy="770" rx="300" ry="35" fill="#e6ebee" opacity="0.6"/>

  <!-- frame -->
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="#1d1d1d" stroke-width="3"/>

  <!-- signature P. -->
  <path d="M735 752 L735 778 M735 752 L746 752 Q752 752 752 759 Q752 766 746 766 L735 766" fill="none" stroke="#1d1d1d" stroke-width="2.2"/>
  <circle cx="757" cy="778" r="2" fill="#1d1d1d"/>
</svg>