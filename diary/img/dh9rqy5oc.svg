<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dfe0"/>
      <stop offset="1" stop-color="#eef0e6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb1ad"/>
      <stop offset="1" stop-color="#5e8a87"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c48a"/>
      <stop offset="1" stop-color="#86a66a"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4f1e8"/>
  <rect x="0" y="0" width="800" height="800" fill="url(#sky)"/>

  <!-- distant cottages and bell tower in fog -->
  <g stroke="#2b2b2b" stroke-width="2" fill="#c9cdc6">
    <rect x="120" y="270" width="90" height="70"/>
    <polygon points="110,270 165,225 220,270"/>
    <rect x="230" y="285" width="70" height="55"/>
    <polygon points="222,285 265,250 308,285"/>
    <rect x="360" y="170" width="60" height="130"/>
    <polygon points="352,170 390,110 428,170"/>
    <circle cx="390" cy="210" r="14" fill="#f4f1e8"/>
    <line x1="390" y1="210" x2="390" y2="200"/>
    <line x1="390" y1="210" x2="398" y2="214"/>
    <rect x="620" y="275" width="100" height="60"/>
    <polygon points="612,275 670,230 728,275"/>
  </g>

  <!-- fog bands -->
  <g fill="#f4f1e8" opacity="0.7">
    <rect x="0" y="240" width="800" height="38"/>
    <rect x="0" y="300" width="800" height="30"/>
  </g>
  <g fill="#e6e9e2" opacity="0.6">
    <ellipse cx="200" cy="330" rx="260" ry="26"/>
    <ellipse cx="620" cy="345" rx="240" ry="22"/>
  </g>

  <!-- rain streaks -->
  <g stroke="#7d8a8c" stroke-width="1.2" opacity="0.6">
    <line x1="60" y1="60" x2="48" y2="90"/>
    <line x1="150" y1="30" x2="138" y2="60"/>
    <line x1="260" y1="80" x2="248" y2="110"/>
    <line x1="410" y1="40" x2="398" y2="70"/>
    <line x1="520" y1="95" x2="508" y2="125"/>
    <line x1="690" y1="50" x2="678" y2="80"/>
    <line x1="740" y1="150" x2="728" y2="180"/>
    <line x1="80" y1="170" x2="68" y2="200"/>
  </g>

  <!-- village green -->
  <path d="M0 335 Q400 320 800 340 L800 590 Q400 560 0 600 Z" fill="url(#grass)" stroke="#2b2b2b" stroke-width="2"/>

  <!-- pond -->
  <ellipse cx="330" cy="478" rx="176" ry="62" fill="#4d4a40" opacity="0.35" transform="translate(6,8)"/>
  <ellipse cx="330" cy="478" rx="172" ry="60" fill="url(#water)" stroke="#2b2b2b" stroke-width="3"/>
  <ellipse cx="330" cy="478" rx="150" ry="46" fill="none" stroke="#dfe8e4" stroke-width="2" opacity="0.6"/>
  <!-- rain ripples -->
  <g fill="none" stroke="#e8f0ec" stroke-width="2" opacity="0.85">
    <ellipse cx="250" cy="450" rx="22" ry="6"/>
    <ellipse cx="250" cy="450" rx="40" ry="11" opacity="0.6"/>
    <ellipse cx="400" cy="500" rx="18" ry="5"/>
    <ellipse cx="400" cy="500" rx="32" ry="9" opacity="0.6"/>
    <ellipse cx="320" cy="512" rx="12" ry="3.5"/>
    <ellipse cx="190" cy="500" rx="10" ry="3"/>
  </g>
  <!-- reeds -->
  <g stroke="#2b2b2b" stroke-width="2" fill="none">
    <path d="M160 470 Q158 440 164 418"/>
    <path d="M170 472 Q172 446 166 430"/>
    <path d="M490 470 Q492 442 486 420"/>
  </g>
  <g fill="#6f8c5a">
    <ellipse cx="164" cy="416" rx="4" ry="12"/>
    <ellipse cx="166" cy="428" rx="4" ry="10"/>
    <ellipse cx="486" cy="418" rx="4" ry="12"/>
  </g>

  <!-- Welcome sign beside the pond -->
  <rect x="585" y="380" width="12" height="262" fill="#7a5a3a" stroke="#2b2b2b" stroke-width="2"/>
  <!-- brass chains -->
  <g stroke="#b8924a" stroke-width="3" fill="none">
    <line x1="552" y1="420" x2="552" y2="450"/>
    <line x1="630" y1="420" x2="630" y2="450"/>
  </g>
  <g fill="#c9a25a" stroke="#2b2b2b" stroke-width="1">
    <circle cx="552" cy="452" r="4"/>
    <circle cx="630" cy="452" r="4"/>
  </g>
  <!-- board -->
  <rect x="528" y="330" width="176" height="92" rx="14" fill="#2f6b3c" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="536" y="338" width="160" height="76" rx="10" fill="#f3ead2" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- roof cap -->
  <polygon points="520,332 616,284 712,332" fill="#5f4530" stroke="#2b2b2b" stroke-width="2"/>
  <text x="616" y="377" text-anchor="middle" font-family="serif" font-size="17" fill="#2b2b2b">Welcome to Mossbrook</text>
  <!-- moss at base -->
  <g fill="#6f9a52" stroke="#2b2b2b" stroke-width="1">
    <ellipse cx="580" cy="636" rx="18" ry="8"/>
    <ellipse cx="600" cy="642" rx="14" ry="6"/>
    <ellipse cx="594" cy="628" rx="8" ry="4"/>
  </g>

  <!-- cobbled path in foreground -->
  <path d="M0 610 Q400 590 800 615 L800 800 L0 800 Z" fill="#b9b2a4" stroke="#2b2b2b" stroke-width="2"/>
  <g fill="#cfc8ba" stroke="#2b2b2b" stroke-width="1.5">
    <ellipse cx="60" cy="650" rx="34" ry="14"/>
    <ellipse cx="150" cy="640" rx="30" ry="12"/>
    <ellipse cx="240" cy="655" rx="36" ry="14"/>
    <ellipse cx="340" cy="642" rx="30" ry="12"/>
    <ellipse cx="430" cy="660" rx="34" ry="14"/>
    <ellipse cx="520" cy="645" rx="30" ry="12"/>
    <ellipse cx="610" cy="662" rx="36" ry="14"/>
    <ellipse cx="710" cy="648" rx="32" ry="13"/>
    <ellipse cx="100" cy="710" rx="40" ry="16"/>
    <ellipse cx="220" cy="725" rx="38" ry="15"/>
    <ellipse cx="350" cy="708" rx="42" ry="16"/>
    <ellipse cx="480" cy="730" rx="38" ry="15"/>
    <ellipse cx="610" cy="712" rx="42" ry="16"/>
    <ellipse cx="730" cy="735" rx="40" ry="15"/>
    <ellipse cx="60" cy="775" rx="46" ry="18"/>
    <ellipse cx="200" cy="785" rx="44" ry="16"/>
    <ellipse cx="380" cy="772" rx="48" ry="18"/>
    <ellipse cx="560" cy="790" rx="44" ry="16"/>
    <ellipse cx="720" cy="772" rx="46" ry="18"/>
  </g>
  <!-- wet sheen on cobbles -->
  <g fill="none" stroke="#f4f1e8" stroke-width="2" opacity="0.6">
    <path d="M120 690 Q150 684 180 690"/>
    <path d="M400 745 Q430 739 460 745"/>
    <path d="M600 680 Q630 674 660 680"/>
  </g>

  <!-- signature -->
  <text x="772" y="784" text-anchor="end" font-family="serif" font-size="18" fill="#2b2b2b">P.</text>
</svg>