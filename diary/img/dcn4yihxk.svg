<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe7d6"/>
  <!-- outside fog bands -->
  <rect x="0" y="0" width="800" height="260" fill="#e4dccb" opacity="0.7"/>
  <rect x="0" y="300" width="800" height="90" fill="#f7f2e7" opacity="0.6"/>
  <!-- sign board with loaf -->
  <rect x="236" y="48" width="328" height="56" rx="4" fill="#7d5a3a" stroke="#2b2118" stroke-width="3"/>
  <path d="M352 62 Q400 40 448 62 L448 92 Q400 100 352 92 Z" fill="#d9a35f" stroke="#2b2118" stroke-width="2.5"/>
  <path d="M374 66 L372 90 M400 64 L400 92 M426 66 L428 90" stroke="#8a5f30" stroke-width="2" fill="none"/>
  <!-- doorway frame -->
  <rect x="164" y="118" width="36" height="532" fill="#5a4632" stroke="#2b2118" stroke-width="3"/>
  <rect x="600" y="118" width="36" height="532" fill="#5a4632" stroke="#2b2118" stroke-width="3"/>
  <rect x="164" y="104" width="472" height="22" fill="#6b5339" stroke="#2b2118" stroke-width="3"/>
  <!-- interior -->
  <rect x="200" y="126" width="400" height="524" fill="#d6c4a0"/>
  <!-- back wall shelves, empty -->
  <rect x="240" y="200" width="320" height="10" fill="#b08a5c" stroke="#2b2118" stroke-width="2"/>
  <rect x="240" y="300" width="320" height="10" fill="#b08a5c" stroke="#2b2118" stroke-width="2"/>
  <rect x="240" y="400" width="320" height="10" fill="#b08a5c" stroke="#2b2118" stroke-width="2"/>
  <rect x="240" y="160" width="6" height="250" fill="#8a6540"/>
  <rect x="554" y="160" width="6" height="250" fill="#8a6540"/>
  <!-- bell above door -->
  <path d="M390 128 Q400 110 410 128 Z" fill="#9b7b4a" stroke="#2b2118" stroke-width="2"/>
  <circle cx="400" cy="131" r="3" fill="#2b2118"/>
  <!-- counter -->
  <rect x="240" y="470" width="320" height="16" fill="#a77c4f" stroke="#2b2118" stroke-width="2.5"/>
  <rect x="244" y="486" width="312" height="74" fill="#8a6540" stroke="#2b2118" stroke-width="2.5"/>
  <line x1="300" y1="486" x2="300" y2="560" stroke="#6b4f32" stroke-width="2"/>
  <line x1="400" y1="486" x2="400" y2="560" stroke="#6b4f32" stroke-width="2"/>
  <line x1="500" y1="486" x2="500" y2="560" stroke="#6b4f32" stroke-width="2"/>
  <!-- five bare outlines where things were -->
  <g fill="none" stroke="#6b4f32" stroke-width="2" stroke-dasharray="5 4">
    <ellipse cx="290" cy="478" rx="18" ry="5"/>
    <ellipse cx="346" cy="478" rx="18" ry="5"/>
    <ellipse cx="402" cy="478" rx="18" ry="5"/>
    <ellipse cx="458" cy="478" rx="18" ry="5"/>
    <ellipse cx="514" cy="478" rx="18" ry="5"/>
  </g>
  <!-- floor -->
  <path d="M200 650 L600 650 L600 690 L200 690 Z" fill="#b9a58a" stroke="#2b2118" stroke-width="2"/>
  <line x1="200" y1="670" x2="600" y2="670" stroke="#9a8669" stroke-width="2"/>
  <!-- doorstep and cobbles -->
  <rect x="170" y="650" width="460" height="16" fill="#7d6a52" stroke="#2b2118" stroke-width="2"/>
  <g fill="#c9bba2" stroke="#6b5a44" stroke-width="2">
    <ellipse cx="120" cy="720" rx="40" ry="16"/>
    <ellipse cx="220" cy="745" rx="44" ry="18"/>
    <ellipse cx="330" cy="722" rx="40" ry="16"/>
    <ellipse cx="450" cy="752" rx="46" ry="18"/>
    <ellipse cx="570" cy="724" rx="42" ry="16"/>
    <ellipse cx="680" cy="748" rx="44" ry="18"/>
  </g>
  <!-- fog over the doorway edges -->
  <rect x="0" y="560" width="800" height="240" fill="#f7f2e7" opacity="0.35"/>
  <!-- tally of return visits, chalked on the right doorpost -->
  <rect x="628" y="170" width="92" height="120" fill="#3a3128" stroke="#2b2118" stroke-width="3"/>
  <g stroke="#f3ecdc" stroke-width="3" stroke-linecap="round">
    <line x1="644" y1="192" x2="644" y2="262"/>
    <line x1="658" y1="192" x2="658" y2="262"/>
    <line x1="672" y1="192" x2="672" y2="262"/>
    <line x1="686" y1="192" x2="686" y2="262"/>
    <line x1="636" y1="240" x2="700" y2="214"/>
  </g>
  <!-- signature -->
  <text x="760" y="780" font-size="22" fill="#2b2118" text-anchor="end">P.</text>
</svg>