<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7584"/>
      <stop offset="0.6" stop-color="#b8a7a4"/>
      <stop offset="1" stop-color="#e2cdaa"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3224"/>
      <stop offset="1" stop-color="#8a5f3c"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="800" fill="url(#dusk)"/>

  <!-- distant rooftops in fog -->
  <polygon points="0,260 60,200 120,260 120,420 0,420" fill="#8e8590" stroke="#2a2420" stroke-width="3"/>
  <polygon points="680,230 740,170 800,230 800,420 680,420" fill="#8e8590" stroke="#2a2420" stroke-width="3"/>

  <!-- workshop facade -->
  <rect x="140" y="250" width="520" height="390" fill="#c9b08a" stroke="#2a2420" stroke-width="3"/>
  <polygon points="130,252 400,150 670,252" fill="#5b4a48" stroke="#2a2420" stroke-width="3"/>
  <rect x="150" y="260" width="500" height="10" fill="#8c7258"/>
  <!-- small hanging sign -->
  <line x1="590" y1="280" x2="590" y2="310" stroke="#2a2420" stroke-width="2"/>
  <polygon points="570,310 610,310 606,335 574,335" fill="#e9dcc0" stroke="#2a2420" stroke-width="2"/>
  <line x1="578" y1="318" x2="602" y2="318" stroke="#7a5a3a" stroke-width="2"/>

  <!-- wide doorway opening -->
  <rect x="240" y="330" width="320" height="310" fill="#2c211b" stroke="#2a2420" stroke-width="3"/>

  <!-- warm light spilling from interior -->
  <rect x="270" y="340" width="260" height="300" fill="url(#interior)"/>
  <circle cx="400" cy="500" r="220" fill="url(#lamp)" opacity="0.5"/>

  <!-- back wall details: kites hanging left -->
  <polygon points="310,370 330,400 310,430 290,400" fill="#d2452f" stroke="#2a2420" stroke-width="2"/>
  <line x1="310" y1="430" x2="300" y2="470" stroke="#2a2420" stroke-width="1.5"/>
  <polygon points="490,380 508,405 490,430 472,405" fill="#e0b93f" stroke="#2a2420" stroke-width="2"/>
  <line x1="490" y1="430" x2="496" y2="466" stroke="#2a2420" stroke-width="1.5"/>

  <!-- round clock in dark wooden case -->
  <circle cx="400" cy="400" r="62" fill="#3b2618" stroke="#2a2420" stroke-width="3"/>
  <circle cx="400" cy="400" r="50" fill="#f7f4ec" stroke="#2a2420" stroke-width="2"/>
  <line x1="400" y1="400" x2="400" y2="368" stroke="#1a1512" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="400" x2="424" y2="410" stroke="#1a1512" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="400" r="4" fill="#1a1512"/>
  <!-- pendulum window below face -->
  <rect x="380" y="458" width="40" height="46" fill="#cfe0dd" opacity="0.55" stroke="#2a2420" stroke-width="2"/>
  <line x1="400" y1="458" x2="400" y2="486" stroke="#8a6a2a" stroke-width="2"/>
  <circle cx="400" cy="492" r="9" fill="#c9a13b" stroke="#2a2420" stroke-width="2"/>

  <!-- long low table -->
  <rect x="300" y="520" width="200" height="10" fill="#e3cfa3" stroke="#2a2420" stroke-width="2"/>
  <polygon points="300,530 500,530 508,552 292,552" fill="#d9bf8f" stroke="#2a2420" stroke-width="3"/>
  <!-- pencil marks -->
  <g stroke="#3a3430" stroke-width="1.5" stroke-linecap="round">
    <line x1="318" y1="537" x2="352" y2="535"/>
    <line x1="366" y1="541" x2="392" y2="539"/>
    <line x1="410" y1="536" x2="446" y2="538"/>
    <line x1="458" y1="542" x2="480" y2="541"/>
    <line x1="332" y1="545" x2="350" y2="544"/>
  </g>
  <!-- burn spots -->
  <circle cx="380" cy="543" r="4" fill="#5a2d12"/>
  <circle cx="436" cy="535" r="3" fill="#5a2d12"/>
  <circle cx="470" cy="546" r="2.5" fill="#5a2d12"/>
  <!-- curl of masking tape at one end -->
  <path d="M488 530 Q500 524 504 534 Q498 540 492 536 Q494 530 488 530 Z" fill="#f2ead8" stroke="#2a2420" stroke-width="1.5"/>

  <!-- table legs -->
  <rect x="306" y="552" width="8" height="30" fill="#8a6a46"/>
  <rect x="486" y="552" width="8" height="30" fill="#8a6a46"/>

  <!-- door frames -->
  <rect x="236" y="326" width="10" height="318" fill="#5b4a3a" stroke="#2a2420" stroke-width="2"/>
  <rect x="554" y="326" width="10" height="318" fill="#5b4a3a" stroke="#2a2420" stroke-width="2"/>
  <polygon points="236,326 218,338 218,644 236,644" fill="#7a5f45" stroke="#2a2420" stroke-width="2"/>
  <polygon points="564,326 582,338 582,644 564,644" fill="#7a5f45" stroke="#2a2420" stroke-width="2"/>

  <!-- lane and cobbles -->
  <polygon points="0,640 800,640 800,800 0,800" fill="#7c7068" stroke="#2a2420" stroke-width="3"/>
  <g fill="#5e5550" stroke="#2a2420" stroke-width="1.5">
    <ellipse cx="60" cy="670" rx="26" ry="10"/>
    <ellipse cx="150" cy="700" rx="32" ry="12"/>
    <ellipse cx="260" cy="668" rx="22" ry="8"/>
    <ellipse cx="350" cy="690" rx="30" ry="11"/>
    <ellipse cx="470" cy="672" rx="24" ry="9"/>
    <ellipse cx="560" cy="705" rx="34" ry="12"/>
    <ellipse cx="680" cy="676" rx="26" ry="10"/>
    <ellipse cx="740" cy="730" rx="36" ry="13"/>
    <ellipse cx="90" cy="750" rx="40" ry="14"/>
    <ellipse cx="230" cy="752" rx="36" ry="13"/>
    <ellipse cx="410" cy="756" rx="42" ry="14"/>
    <ellipse cx="600" cy="768" rx="44" ry="14"/>
    <ellipse cx="300" cy="785" rx="50" ry="12"/>
    <ellipse cx="520" cy="790" rx="48" ry="11"/>
  </g>

  <!-- wet glints on lane -->
  <g fill="#e9e2d0" opacity="0.5">
    <rect x="210" y="690" width="60" height="3"/>
    <rect x="500" y="740" width="70" height="3"/>
    <rect x="80" y="720" width="50" height="3"/>
  </g>

  <!-- fog bands -->
  <rect x="0" y="560" width="800" height="50" fill="#f2ede3" opacity="0.35"/>
  <rect x="0" y="610" width="800" height="40" fill="#f2ede3" opacity="0.45"/>
  <rect x="0" y="300" width="800" height="60" fill="#f2ede3" opacity="0.25"/>
  <rect x="0" y="180" width="800" height="50" fill="#f2ede3" opacity="0.2"/>

  <!-- signature -->
  <text x="752" y="784" font-size="18" fill="#2a2420" text-anchor="end">P.</text>
</svg>