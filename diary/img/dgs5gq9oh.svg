<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e3d8"/>
      <stop offset="1" stop-color="#d3d9d3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="mist" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- paper and sky -->
  <rect width="800" height="800" fill="#f4efe3"/>
  <rect x="0" y="0" width="800" height="440" fill="url(#sky)"/>

  <!-- blurred buildings in the mist -->
  <g filter="url(#soft)" fill="#8f9a98" opacity="0.8">
    <!-- bell tower -->
    <rect x="345" y="250" width="50" height="175"/>
    <polygon points="338,252 370,205 402,252"/>
    <!-- left cottages -->
    <rect x="80" y="330" width="120" height="100"/>
    <polygon points="72,332 140,290 208,332"/>
    <rect x="215" y="350" width="90" height="80"/>
    <polygon points="208,352 260,320 312,352"/>
    <!-- right buildings -->
    <rect x="520" y="335" width="110" height="95"/>
    <polygon points="512,337 575,298 638,337"/>
    <rect x="645" y="360" width="90" height="70"/>
    <polygon points="638,362 690,330 742,362"/>
  </g>

  <!-- distant trees -->
  <g filter="url(#soft)" fill="#7d8c86" opacity="0.7">
    <circle cx="190" cy="385" r="34"/>
    <circle cx="470" cy="380" r="28"/>
    <circle cx="760" cy="390" r="30"/>
  </g>

  <!-- mist band over the buildings -->
  <rect x="0" y="330" width="800" height="90" fill="#f4f2ec" opacity="0.6" filter="url(#mist)"/>

  <!-- grass -->
  <path d="M0 425 Q200 412 400 422 T800 418 L800 800 L0 800 Z" fill="#a3b58e"/>
  <path d="M0 425 Q200 412 400 422 T800 418" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- grass strokes -->
  <g fill="none" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <path d="M60 470 l-4 -14 M64 470 l1 -17 M68 470 l5 -13"/>
    <path d="M120 540 l-4 -14 M124 540 l1 -17 M128 540 l5 -13"/>
    <path d="M640 500 l-4 -14 M644 500 l1 -17 M648 500 l5 -13"/>
    <path d="M700 600 l-4 -14 M704 600 l1 -17 M708 600 l5 -13"/>
    <path d="M90 700 l-4 -14 M94 700 l1 -17 M98 700 l5 -13"/>
    <path d="M600 730 l-4 -14 M604 730 l1 -17 M608 730 l5 -13"/>
    <path d="M300 460 l-3 -11 M303 460 l1 -14 M306 460 l4 -10"/>
    <path d="M520 455 l-3 -11 M523 455 l1 -14 M526 455 l4 -10"/>
  </g>

  <!-- cobbled path curving to the green -->
  <path d="M330 800 Q340 700 380 660 Q420 640 470 640 Q520 630 560 600 L600 610 Q560 660 500 680 Q430 700 420 800 Z"
        fill="#c9c2b2" stroke="#2b2b2b" stroke-width="2"/>
  <g fill="none" stroke="#2b2b2b" stroke-width="1.2" opacity="0.8">
    <ellipse cx="360" cy="740" rx="8" ry="5"/>
    <ellipse cx="385" cy="725" rx="8" ry="5"/>
    <ellipse cx="372" cy="705" rx="7" ry="4"/>
    <ellipse cx="410" cy="770" rx="8" ry="5"/>
    <ellipse cx="440" cy="755" rx="8" ry="5"/>
    <ellipse cx="455" cy="745" rx="7" ry="4"/>
    <ellipse cx="400" cy="690" rx="7" ry="4"/>
    <ellipse cx="480" cy="700" rx="7" ry="4"/>
    <ellipse cx="520" cy="720" rx="8" ry="5"/>
    <ellipse cx="500" cy="660" rx="6" ry="3"/>
  </g>

  <!-- pond -->
  <ellipse cx="420" cy="590" rx="190" ry="62" fill="#2b2b2b" opacity="0.15" transform="translate(6 8)"/>
  <ellipse cx="420" cy="590" rx="190" ry="62" fill="#8fa9ab" stroke="#2b2b2b" stroke-width="3"/>
  <!-- faint reflection of bell tower -->
  <rect x="402" y="560" width="30" height="22" fill="#6f8789" opacity="0.5" filter="url(#soft)"/>
  <!-- ripples -->
  <g fill="none" stroke="#2b2b2b" stroke-width="1.5" opacity="0.7">
    <ellipse cx="360" cy="598" rx="36" ry="9"/>
    <ellipse cx="478" cy="578" rx="28" ry="7"/>
    <ellipse cx="430" cy="620" rx="52" ry="12"/>
  </g>
  <g fill="#f4f2ec" opacity="0.8">
    <ellipse cx="500" cy="606" rx="10" ry="2.5"/>
    <ellipse cx="330" cy="582" rx="8" ry="2"/>
  </g>

  <!-- sign post and board -->
  <rect x="281" y="500" width="8" height="110" fill="#6b5b48" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="185" y="466" width="200" height="38" rx="3" fill="#e8dcc0" stroke="#2b2b2b" stroke-width="2.5"/>
  <text x="285" y="491" font-family="serif" font-size="15" text-anchor="middle" fill="#2b2b2b">Welcome to Mossbrook</text>

  <!-- foreground fog wisps -->
  <rect x="0" y="470" width="800" height="50" fill="#f4f2ec" opacity="0.45" filter="url(#mist)"/>
  <rect x="0" y="690" width="800" height="80" fill="#f4f2ec" opacity="0.35" filter="url(#mist)"/>

  <!-- signature -->
  <text x="772" y="780" font-family="serif" font-size="22" text-anchor="end" fill="#2b2b2b">P.</text>
</svg>