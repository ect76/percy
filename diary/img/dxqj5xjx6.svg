<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ead6"/>
  <!-- wall -->
  <rect x="20" y="20" width="760" height="560" fill="#d8c9a8"/>
  <!-- window opening -->
  <rect x="90" y="80" width="340" height="320" fill="#dfe6e6" stroke="#1d1a17" stroke-width="3"/>
  <!-- lane (cobbles) -->
  <path d="M90 400 L430 400 L330 250 L190 250 Z" fill="#9c9a94" stroke="#1d1a17" stroke-width="2"/>
  <!-- left cottage -->
  <rect x="110" y="200" width="80" height="150" fill="#b98a6a" stroke="#1d1a17" stroke-width="2"/>
  <path d="M100 200 L150 160 L200 200 Z" fill="#6f5a4a" stroke="#1d1a17" stroke-width="2"/>
  <rect x="133" y="235" width="20" height="28" fill="#5d7a86" stroke="#1d1a17" stroke-width="1.5"/>
  <!-- right cottage -->
  <rect x="340" y="180" width="70" height="170" fill="#c9a27e" stroke="#1d1a17" stroke-width="2"/>
  <path d="M332 180 L375 140 L418 180 Z" fill="#6f5a4a" stroke="#1d1a17" stroke-width="2"/>
  <rect x="360" y="220" width="22" height="28" fill="#5d7a86" stroke="#1d1a17" stroke-width="1.5"/>
  <!-- cobble marks -->
  <g fill="none" stroke="#1d1a17" stroke-width="1.2" opacity="0.6">
    <ellipse cx="160" cy="370" rx="14" ry="6"/>
    <ellipse cx="250" cy="375" rx="16" ry="6"/>
    <ellipse cx="330" cy="362" rx="10" ry="5"/>
    <ellipse cx="200" cy="300" rx="8" ry="4"/>
    <ellipse cx="270" cy="312" rx="8" ry="4"/>
    <ellipse cx="220" cy="340" rx="11" ry="5"/>
  </g>
  <!-- fog veil -->
  <rect x="90" y="80" width="340" height="320" fill="#f2f5f4" opacity="0.55"/>
  <rect x="90" y="300" width="340" height="100" fill="#f2f5f4" opacity="0.35"/>
  <!-- window frame -->
  <g stroke="#1d1a17" stroke-width="6" fill="none">
    <rect x="90" y="80" width="340" height="320"/>
    <line x1="260" y1="80" x2="260" y2="400"/>
  </g>
  <!-- sill -->
  <rect x="75" y="400" width="370" height="14" fill="#8a6a4c" stroke="#1d1a17" stroke-width="3"/>

  <!-- cupboard -->
  <rect x="500" y="230" width="230" height="330" fill="#a57a52" stroke="#1d1a17" stroke-width="3"/>
  <rect x="515" y="250" width="95" height="295" fill="#8a6442" stroke="#1d1a17" stroke-width="2"/>
  <rect x="620" y="250" width="95" height="295" fill="#8a6442" stroke="#1d1a17" stroke-width="2"/>
  <!-- open interior, bare shelves -->
  <rect x="530" y="270" width="65" height="265" fill="#3b2c20"/>
  <rect x="635" y="270" width="65" height="265" fill="#3b2c20"/>
  <g stroke="#1d1a17" stroke-width="3">
    <line x1="530" y1="330" x2="595" y2="330"/>
    <line x1="530" y1="400" x2="595" y2="400"/>
    <line x1="530" y1="470" x2="595" y2="470"/>
    <line x1="635" y1="330" x2="700" y2="330"/>
    <line x1="635" y1="400" x2="700" y2="400"/>
    <line x1="635" y1="470" x2="700" y2="470"/>
  </g>
  <circle cx="606" cy="410" r="4" fill="#d8b04a" stroke="#1d1a17" stroke-width="1.5"/>
  <circle cx="622" cy="410" r="4" fill="#d8b04a" stroke="#1d1a17" stroke-width="1.5"/>

  <!-- table -->
  <rect x="50" y="560" width="700" height="18" fill="#7b5a3c" stroke="#1d1a17" stroke-width="3"/>
  <rect x="60" y="578" width="700" height="30" fill="#6a4c31" stroke="#1d1a17" stroke-width="2"/>
  <rect x="80" y="608" width="18" height="150" fill="#6a4c31" stroke="#1d1a17" stroke-width="2"/>
  <rect x="700" y="608" width="18" height="150" fill="#6a4c31" stroke="#1d1a17" stroke-width="2"/>

  <!-- tin mouse -->
  <g stroke="#1d1a17" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M300 528 C270 530 250 510 232 492" fill="none"/>
    <!-- legs -->
    <rect x="320" y="552" width="12" height="10" fill="#b9c3c8"/>
    <rect x="345" y="552" width="12" height="10" fill="#b9c3c8"/>
    <rect x="380" y="552" width="12" height="10" fill="#b9c3c8"/>
    <rect x="400" y="552" width="12" height="10" fill="#b9c3c8"/>
    <!-- body -->
    <rect x="300" y="500" width="110" height="56" rx="26" fill="#b9c3c8"/>
    <!-- ears -->
    <circle cx="396" cy="484" r="13" fill="#d9a7a0"/>
    <circle cx="420" cy="482" r="13" fill="#d9a7a0"/>
    <!-- head -->
    <circle cx="412" cy="512" r="25" fill="#b9c3c8"/>
    <!-- nose -->
    <circle cx="436" cy="520" r="4" fill="#c0564a"/>
    <!-- key -->
    <circle cx="340" cy="524" r="9" fill="#8f9aa0"/>
    <line x1="340" y1="524" x2="340" y2="516"/>
    <!-- seam -->
    <line x1="300" y1="528" x2="410" y2="528" stroke-width="1.5"/>
  </g>
  <circle cx="420" cy="506" r="3" fill="#1d1a17"/>

  <!-- signature -->
  <text x="752" y="784" font-family="serif" font-size="22" fill="#1d1a17" text-anchor="end">P.</text>
</svg>