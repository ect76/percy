<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe3"/>
  <!-- wall wash -->
  <rect x="0" y="0" width="800" height="680" fill="#e6dccb" opacity="0.6"/>
  <!-- floor -->
  <rect x="0" y="660" width="800" height="140" fill="#b9b1a2"/>
  <g fill="none" stroke="#6d675c" stroke-width="2" opacity="0.7">
    <ellipse cx="120" cy="712" rx="46" ry="16"/>
    <ellipse cx="270" cy="748" rx="54" ry="18"/>
    <ellipse cx="430" cy="716" rx="50" ry="15"/>
    <ellipse cx="600" cy="752" rx="58" ry="18"/>
    <ellipse cx="710" cy="712" rx="40" ry="14"/>
  </g>

  <!-- cupboard body -->
  <rect x="180" y="140" width="440" height="520" fill="#8b5e3c" stroke="#222" stroke-width="6"/>
  <!-- interior back wall -->
  <rect x="220" y="180" width="360" height="440" fill="#c9a77c" stroke="#222" stroke-width="4"/>

  <!-- open doors -->
  <polygon points="180,140 120,160 120,680 180,660" fill="#a3744c" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="620,140 680,160 680,680 620,660" fill="#a3744c" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#222" stroke-width="3" opacity="0.6">
    <line x1="145" y1="200" x2="145" y2="630"/>
    <line x1="655" y1="200" x2="655" y2="630"/>
  </g>

  <!-- shelves -->
  <rect x="220" y="380" width="360" height="12" fill="#7a5233" stroke="#222" stroke-width="3"/>
  <rect x="220" y="540" width="360" height="12" fill="#7a5233" stroke="#222" stroke-width="3"/>

  <!-- sardine tins on top shelf, two on shelf and one stacked at the back wall -->
  <g stroke="#222" stroke-width="3" stroke-linejoin="round">
    <!-- tin A (shelf) -->
    <rect x="250" y="330" width="100" height="50" rx="6" fill="#9fb3bf"/>
    <rect x="250" y="346" width="100" height="18" fill="#e8c547"/>
    <line x1="265" y1="330" x2="265" y2="380" stroke-width="1.5"/>
    <!-- tin B (shelf) -->
    <rect x="370" y="330" width="100" height="50" rx="6" fill="#9fb3bf"/>
    <rect x="370" y="346" width="100" height="18" fill="#e8c547"/>
    <line x1="385" y1="330" x2="385" y2="380" stroke-width="1.5"/>
    <!-- tin C (stacked on A) -->
    <rect x="250" y="280" width="100" height="50" rx="6" fill="#9fb3bf"/>
    <rect x="250" y="296" width="100" height="18" fill="#e8c547"/>
    <line x1="265" y1="280" x2="265" y2="330" stroke-width="1.5"/>
  </g>

  <!-- loaves on bottom shelf -->
  <g stroke="#222" stroke-width="3">
    <ellipse cx="320" cy="502" rx="72" ry="38" fill="#b7713a"/>
    <ellipse cx="478" cy="506" rx="64" ry="34" fill="#c2803f"/>
  </g>
  <g fill="none" stroke="#5a3418" stroke-width="3" stroke-linecap="round">
    <path d="M285 484 Q300 470 318 482"/>
    <path d="M330 478 Q345 468 360 480"/>
    <path d="M448 490 Q462 478 478 490"/>
    <path d="M490 484 Q500 476 512 486"/>
  </g>

  <!-- fog wisps -->
  <g fill="#f4efe3" opacity="0.5">
    <rect x="0" y="600" width="800" height="26" rx="13"/>
    <rect x="40" y="250" width="110" height="18" rx="9"/>
    <rect x="650" y="420" width="130" height="20" rx="10"/>
  </g>

  <!-- signature -->
  <text x="760" y="782" font-family="serif" font-size="28" fill="#222" text-anchor="end">P.</text>
</svg>