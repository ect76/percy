<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and fog-grey wall -->
  <rect x="0" y="0" width="800" height="800" fill="#eef0eb"/>
  <rect x="0" y="0" width="800" height="560" fill="#d9ddd5"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#3a3a3a" stroke-width="2"/>

  <!-- ticket roll bracket and spindle -->
  <rect x="520" y="112" width="110" height="8" fill="#5a4330" stroke="#2b2118" stroke-width="2"/>
  <rect x="548" y="118" width="6" height="22" fill="#5a4330" stroke="#2b2118" stroke-width="1.5"/>
  <rect x="612" y="118" width="6" height="22" fill="#5a4330" stroke="#2b2118" stroke-width="1.5"/>
  <ellipse cx="555" cy="150" rx="12" ry="20" fill="#d4e6f5" stroke="#2b2118" stroke-width="2"/>
  <rect x="555" y="130" width="60" height="40" fill="#bfd9ee" stroke="#2b2118" stroke-width="2"/>
  <ellipse cx="615" cy="150" rx="12" ry="20" fill="#a9c9e2" stroke="#2b2118" stroke-width="2"/>

  <!-- hanging tickets -->
  <rect x="558" y="172" width="112" height="170" fill="#a9c9e2" stroke="#2b2118" stroke-width="2"/>
  <rect x="562" y="176" width="110" height="64" fill="#d4e6f5" stroke="#2b2118" stroke-width="2"/>
  <line x1="562" y1="250" x2="672" y2="250" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="562" y1="262" x2="672" y2="262" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="562" y1="276" x2="672" y2="276" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="562" y1="290" x2="672" y2="290" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="562" y1="304" x2="672" y2="304" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="562" y1="318" x2="672" y2="318" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="562" y1="332" x2="672" y2="332" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="572" y="192" font-family="serif" font-size="11" font-weight="bold" fill="#1f2a36">RAFFLE 50p</text>
  <text x="572" y="208" font-family="serif" font-size="9" fill="#1f2a36">Numbered 001 to 200.</text>
  <text x="572" y="224" font-family="serif" font-size="9" fill="#1f2a36">Draw at Summer Fete.</text>
  <text x="572" y="236" font-family="serif" font-size="9" fill="#1f2a36">No. 001</text>

  <!-- counter -->
  <rect x="120" y="560" width="560" height="22" fill="#9a6a44" stroke="#2b2118" stroke-width="2"/>
  <path d="M150 600 H650 V800 H150 Z" fill="#6b4429" stroke="#2b2118" stroke-width="2"/>
  <path d="M250 560 H420 L410 572 H260 Z" fill="#c08a58" opacity="0.8"/>
  <rect x="300" y="630" width="200" height="60" fill="#58371f" stroke="#2b2118" stroke-width="2"/>
  <rect x="380" y="654" width="40" height="8" fill="#c9a24a" stroke="#2b2118" stroke-width="1.5"/>

  <!-- brass bell -->
  <ellipse cx="170" cy="562" rx="30" ry="5" fill="#a88335" stroke="#2b2118" stroke-width="1.5"/>
  <path d="M142 560 Q146 520 170 516 Q194 520 198 560 Z" fill="#c9a24a" stroke="#2b2118" stroke-width="2"/>
  <circle cx="170" cy="510" r="5" fill="#c9a24a" stroke="#2b2118" stroke-width="1.5"/>

  <!-- guestbook open on counter -->
  <rect x="222" y="458" width="356" height="116" fill="#7a4e2c" stroke="#2b2118" stroke-width="2"/>
  <path d="M236 470 Q320 458 400 470 L400 566 Q320 556 236 568 Z" fill="#fbf6ea" stroke="#2b2118" stroke-width="2"/>
  <path d="M400 470 Q480 458 564 470 L564 568 Q480 556 400 566 Z" fill="#fbf6ea" stroke="#2b2118" stroke-width="2"/>
  <!-- earlier signatures -->
  <path d="M250 490 Q270 484 290 490 T330 490" fill="none" stroke="#2c4a7a" stroke-width="1.6"/>
  <path d="M250 510 Q275 504 300 510 T350 508" fill="none" stroke="#2c4a7a" stroke-width="1.6"/>
  <path d="M250 530 Q268 524 290 530 T338 528" fill="none" stroke="#2c4a7a" stroke-width="1.6"/>
  <path d="M250 550 Q272 544 296 550 T340 548" fill="none" stroke="#2c4a7a" stroke-width="1.6"/>
  <!-- printed request on right page -->
  <text x="416" y="490" font-family="serif" font-size="12" fill="#2b2118">Please sign in and tell</text>
  <text x="416" y="508" font-family="serif" font-size="12" fill="#2b2118">us where you have</text>
  <text x="416" y="526" font-family="serif" font-size="12" fill="#2b2118">travelled from.</text>
  <line x1="416" y1="542" x2="548" y2="542" stroke="#8aa0b8" stroke-width="1"/>
  <line x1="416" y1="556" x2="548" y2="556" stroke="#8aa0b8" stroke-width="1"/>

  <!-- folded map with faded blue cover -->
  <rect x="598" y="440" width="132" height="130" fill="#5f8fb5" stroke="#2b2118" stroke-width="2"/>
  <rect x="604" y="446" width="120" height="118" fill="none" stroke="#a9c6dc" stroke-width="2" stroke-dasharray="2 3"/>
  <rect x="612" y="470" width="104" height="60" fill="#f1ead2" stroke="#2b2118" stroke-width="1.2"/>
  <text x="618" y="486" font-family="serif" font-size="8" fill="#1f2a36">Ordnance Survey</text>
  <text x="618" y="498" font-family="serif" font-size="8" fill="#1f2a36">Landranger, Sheet 118</text>
  <text x="618" y="510" font-family="serif" font-size="8" fill="#1f2a36">Scale 1:50,000</text>
  <path d="M618 520 Q640 512 660 522 T700 518" fill="none" stroke="#7a9a6a" stroke-width="1.2"/>

  <!-- fog veil -->
  <ellipse cx="400" cy="90" rx="420" ry="60" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="200" cy="330" rx="260" ry="50" fill="#ffffff" opacity="0.25"/>
  <ellipse cx="400" cy="520" rx="420" ry="30" fill="#ffffff" opacity="0.2"/>

  <!-- signature -->
  <text x="760" y="780" font-family="serif" font-size="18" fill="#2b2118" text-anchor="end">P.</text>
</svg>