<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d2b0"/>
      <stop offset="0.55" stop-color="#c7c0b4"/>
      <stop offset="1" stop-color="#8e979b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff0c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- evening sky and low sun in fog -->
  <rect x="0" y="0" width="800" height="800" fill="url(#sky)"/>
  <circle cx="610" cy="300" r="150" fill="url(#sun)"/>

  <!-- distant trees in fog -->
  <path d="M0 470 Q40 400 90 455 Q120 380 170 450 L170 520 L0 520 Z" fill="#6f7a74" opacity="0.5" stroke="#4a5550" stroke-width="2"/>
  <path d="M640 455 Q680 390 730 450 Q760 395 800 460 L800 520 L640 520 Z" fill="#6f7a74" opacity="0.5" stroke="#4a5550" stroke-width="2"/>

  <!-- cottage body -->
  <rect x="190" y="300" width="340" height="290" fill="#d8c29c" stroke="#3b3228" stroke-width="4"/>
  <g stroke="#9c8a6c" stroke-width="2" fill="none" opacity="0.7">
    <path d="M190 340 H530 M190 380 H530 M190 420 H530 M190 460 H530 M190 500 H530 M190 545 H530"/>
    <path d="M240 300 V340 M300 340 V380 M360 300 V340 M420 340 V380 M480 300 V340 M240 380 V420 M330 420 V460 M480 420 V460 M240 460 V500 M420 460 V500 M300 500 V545 M480 500 V545"/>
  </g>

  <!-- slate roof -->
  <polygon points="170,300 360,170 550,300" fill="#6e5a4a" stroke="#2f2620" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#4f3f34" stroke-width="2" opacity="0.8">
    <path d="M200 285 L360 185 L520 285"/>
    <path d="M230 270 L360 195 L490 270"/>
  </g>

  <!-- sagging gutter, eastern corner dropped -->
  <path d="M160 298 Q300 304 420 304 Q500 310 556 324" fill="none" stroke="#3a3a3a" stroke-width="9" stroke-linecap="round"/>
  <path d="M530 318 L556 324 L552 340" fill="none" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>

  <!-- left window with lamp light -->
  <rect x="215" y="350" width="62" height="62" fill="#f6d98a" stroke="#2b2420" stroke-width="4"/>
  <path d="M246 350 V412 M215 381 H277" stroke="#2b2420" stroke-width="3"/>
  <!-- right window -->
  <rect x="400" y="350" width="62" height="62" fill="#e9c77c" stroke="#2b2420" stroke-width="4"/>
  <path d="M431 350 V412 M400 381 H462" stroke="#2b2420" stroke-width="3"/>
  <path d="M400 350 Q412 372 400 412 M462 350 Q450 372 462 412" fill="none" stroke="#8a4a3a" stroke-width="5" opacity="0.7"/>

  <!-- front door -->
  <rect x="300" y="390" width="70" height="200" fill="#5a3a26" stroke="#2b2420" stroke-width="4"/>
  <path d="M335 390 V590" stroke="#2b2420" stroke-width="2" opacity="0.6"/>
  <circle cx="356" cy="500" r="4" fill="#c9b47a"/>
  <!-- letterbox, brass painted over -->
  <rect x="318" y="440" width="36" height="10" fill="#7a6f4a" stroke="#2b2420" stroke-width="2"/>
  <path d="M322 444 H350" stroke="#a0945f" stroke-width="2" opacity="0.6"/>

  <!-- tin house number 4 -->
  <rect x="392" y="395" width="36" height="44" rx="4" fill="#4f6b52" stroke="#2b2420" stroke-width="3"/>
  <path d="M412 404 L402 422 L418 422 M412 410 V431" fill="none" stroke="#ece4c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- crooked hanging sign -->
  <line x1="190" y1="352" x2="132" y2="362" stroke="#2b2420" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(-8 150 405)">
    <line x1="122" y1="362" x2="122" y2="385" stroke="#2b2420" stroke-width="2"/>
    <line x1="168" y1="362" x2="168" y2="385" stroke="#2b2420" stroke-width="2"/>
    <rect x="104" y="385" width="92" height="42" fill="#8a5a33" stroke="#2b2420" stroke-width="3"/>
    <g stroke="#ece0c2" stroke-width="3" stroke-linecap="round">
      <path d="M118 402 H182"/>
      <path d="M118 414 H168"/>
    </g>
  </g>

  <!-- fog bands over the middle ground -->
  <rect x="0" y="430" width="800" height="40" fill="#ffffff" opacity="0.28"/>
  <rect x="0" y="500" width="800" height="50" fill="#ffffff" opacity="0.22"/>

  <!-- cobbled path in foreground -->
  <polygon points="250,800 330,590 480,590 620,800" fill="#7d7468" stroke="#2f2a24" stroke-width="3"/>
  <g fill="#6a6258" stroke="#3a332c" stroke-width="2">
    <ellipse cx="360" cy="620" rx="22" ry="8"/>
    <ellipse cx="420" cy="622" rx="18" ry="7"/>
    <ellipse cx="310" cy="660" rx="26" ry="10"/>
    <ellipse cx="400" cy="668" rx="24" ry="9"/>
    <ellipse cx="480" cy="662" rx="20" ry="8"/>
    <ellipse cx="290" cy="725" rx="32" ry="12"/>
    <ellipse cx="400" cy="735" rx="30" ry="11"/>
    <ellipse cx="510" cy="728" rx="28" ry="11"/>
    <ellipse cx="350" cy="790" rx="40" ry="14"/>
    <ellipse cx="500" cy="782" rx="38" ry="14"/>
  </g>
  <!-- cottage base shadow -->
  <rect x="190" y="584" width="340" height="10" fill="#2b2420" opacity="0.35"/>

  <!-- heavy fog at the foot of the scene -->
  <rect x="0" y="600" width="800" height="200" fill="#ffffff" opacity="0.12"/>
  <rect x="0" y="700" width="800" height="100" fill="#ffffff" opacity="0.18"/>

  <!-- artist's mark -->
  <text x="752" y="782" font-family="serif" font-size="26" fill="#2b2420" text-anchor="end">P.</text>
</svg>