<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>

  <!-- distant fog banks -->
  <ellipse cx="400" cy="200" rx="420" ry="60" fill="#d9d4c7" opacity="0.6"/>
  <ellipse cx="260" cy="250" rx="300" ry="40" fill="#e6e1d3" opacity="0.7"/>

  <!-- cobbled ground -->
  <rect x="0" y="640" width="800" height="160" fill="#cfc6b3"/>
  <g fill="none" stroke="#5a5045" stroke-width="1.5" opacity="0.7">
    <ellipse cx="60" cy="670" rx="18" ry="7"/><ellipse cx="110" cy="690" rx="16" ry="6"/>
    <ellipse cx="40" cy="735" rx="20" ry="7"/><ellipse cx="200" cy="665" rx="15" ry="6"/>
    <ellipse cx="260" cy="700" rx="18" ry="7"/><ellipse cx="340" cy="665" rx="16" ry="6"/>
    <ellipse cx="420" cy="720" rx="20" ry="7"/><ellipse cx="500" cy="680" rx="16" ry="6"/>
    <ellipse cx="560" cy="760" rx="18" ry="7"/><ellipse cx="760" cy="700" rx="18" ry="7"/>
    <ellipse cx="700" cy="750" rx="20" ry="7"/><ellipse cx="330" cy="775" rx="18" ry="6"/>
    <ellipse cx="460" cy="620" rx="0" ry="0"/>
  </g>

  <!-- Library with bricked-over doorway -->
  <rect x="40" y="300" width="300" height="340" fill="#b9653f" stroke="#3a2e27" stroke-width="3"/>
  <path d="M30 300 L190 250 L350 300 Z" fill="#5b4a3e" stroke="#3a2e27" stroke-width="3"/>
  <g stroke="#7a3d25" stroke-width="1.5" opacity="0.6">
    <line x1="40" y1="340" x2="340" y2="340"/><line x1="40" y1="380" x2="340" y2="380"/>
    <line x1="40" y1="420" x2="340" y2="420"/><line x1="40" y1="460" x2="340" y2="460"/>
    <line x1="40" y1="500" x2="340" y2="500"/><line x1="40" y1="540" x2="340" y2="540"/>
    <line x1="40" y1="580" x2="340" y2="580"/><line x1="40" y1="620" x2="340" y2="620"/>
  </g>
  <!-- bricked doorway: arch outline with paler mortar -->
  <path d="M150 640 L150 460 Q150 400 210 400 Q270 400 270 460 L270 640 Z" fill="#a85a38" stroke="#3a2e27" stroke-width="2"/>
  <path d="M150 460 Q150 400 210 400 Q270 400 270 460" fill="none" stroke="#e8e2d2" stroke-width="4" stroke-dasharray="6 4"/>
  <g stroke="#e8e2d2" stroke-width="3" opacity="0.9">
    <line x1="150" y1="480" x2="270" y2="480"/><line x1="150" y1="510" x2="270" y2="510"/>
    <line x1="150" y1="540" x2="270" y2="540"/><line x1="150" y1="570" x2="270" y2="570"/>
    <line x1="150" y1="600" x2="270" y2="600"/><line x1="150" y1="625" x2="270" y2="625"/>
    <line x1="180" y1="465" x2="180" y2="495"/><line x1="210" y1="495" x2="210" y2="525"/>
    <line x1="240" y1="465" x2="240" y2="495"/><line x1="195" y1="525" x2="195" y2="555"/>
    <line x1="225" y1="555" x2="225" y2="585"/><line x1="170" y1="585" x2="170" y2="615"/>
  </g>
  <!-- brass Book Return plate -->
  <rect x="290" y="500" width="44" height="28" rx="3" fill="#c9a227" stroke="#3a2e27" stroke-width="2"/>
  <rect x="297" y="510" width="30" height="4" fill="#5a4310"/>
  <text x="312" y="521" font-size="5" text-anchor="middle" fill="#3a2e27" font-family="sans-serif">BOOK RETURN</text>

  <!-- Museum of Maps -->
  <rect x="370" y="380" width="170" height="260" fill="#e7d9b5" stroke="#3a2e27" stroke-width="3"/>
  <path d="M360 380 L455 300 L550 380 Z" fill="#4d6a7a" stroke="#3a2e27" stroke-width="3"/>
  <line x1="455" y1="300" x2="455" y2="236" stroke="#3a2e27" stroke-width="3"/>
  <!-- compass-rose vane with bent north point -->
  <g transform="translate(455,232)">
    <polygon points="-4,-4 -12,-30 4,-4 20,0 4,4 0,18 -4,4 -18,0" fill="#8a5a2b" stroke="#2a211b" stroke-width="2"/>
    <polyline points="-4,-4 -10,-14 -6,-22 -12,-30" fill="none" stroke="#2a211b" stroke-width="1.5"/>
    <circle r="3" fill="#c9a227" stroke="#2a211b" stroke-width="1"/>
  </g>
  <!-- window and counter -->
  <rect x="395" y="450" width="120" height="110" fill="#f5efd9" stroke="#3a2e27" stroke-width="2"/>
  <rect x="395" y="540" width="120" height="50" fill="#a9764a" stroke="#3a2e27" stroke-width="2"/>
  <rect x="397" y="540" width="116" height="10" fill="#d8b98f"/>
  <ellipse cx="420" cy="545" rx="14" ry="4" fill="#e8cfa6"/>
  <ellipse cx="490" cy="545" rx="14" ry="4" fill="#e8cfa6"/>
  <!-- brass bell -->
  <path d="M447 530 Q455 514 463 530 Z" fill="#c9a227" stroke="#3a2e27" stroke-width="1.5"/>
  <rect x="444" y="530" width="22" height="4" fill="#c9a227" stroke="#3a2e27" stroke-width="1"/>
  <!-- shallow drawer -->
  <rect x="410" y="570" width="90" height="14" fill="#8a5a33" stroke="#3a2e27" stroke-width="1.5"/>
  <rect x="448" y="574" width="14" height="4" rx="2" fill="#c9a227"/>

  <!-- Weather Museum -->
  <rect x="600" y="330" width="180" height="310" fill="#f0e6cf" stroke="#3a2e27" stroke-width="3"/>
  <path d="M590 330 L690 280 L790 330 Z" fill="#7a6a58" stroke="#3a2e27" stroke-width="3"/>
  <text x="690" y="352" font-size="12" text-anchor="middle" fill="#3a2e27" font-family="sans-serif">WEATHER</text>
  <!-- barometer dial in dark case -->
  <rect x="610" y="362" width="150" height="110" rx="6" fill="#3b2a1f" stroke="#1d140e" stroke-width="2"/>
  <circle cx="685" cy="417" r="48" fill="#fbf7ec" stroke="#3a2e27" stroke-width="2"/>
  <g font-size="7" fill="#3a2e27" font-family="sans-serif" text-anchor="middle">
    <text x="652" y="442">STORMY</text>
    <text x="640" y="392">RAIN</text>
    <text x="685" y="381">CHANGE</text>
    <text x="728" y="392">FAIR</text>
    <text x="722" y="442">VERY DRY</text>
  </g>
  <line x1="685" y1="417" x2="708" y2="384" stroke="#b8892b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="685" cy="417" r="3" fill="#3a2e27"/>
  <circle cx="685" cy="417" r="48" fill="#ffffff" opacity="0.15"/>

  <!-- rain gauge: funnel, cylinder, post -->
  <rect x="533" y="500" width="8" height="120" fill="#6b4a2e" stroke="#2a211b" stroke-width="1.5"/>
  <polygon points="500,470 580,470 552,512 528,512" fill="#ffffff" stroke="#3a2e27" stroke-width="2"/>
  <rect x="527" y="512" width="26" height="50" rx="2" fill="#e3f0f1" stroke="#3a2e27" stroke-width="2"/>
  <rect x="530" y="550" width="20" height="12" fill="#5b8fb0"/>
  <text x="540" y="606" font-size="8" text-anchor="middle" fill="#3a2e27" font-family="sans-serif">0 10 20 30 mm</text>

  <!-- thermometer board -->
  <rect x="640" y="560" width="40" height="120" fill="#ffffff" stroke="#3a2e27" stroke-width="2"/>
  <rect x="654" y="570" width="10" height="100" rx="5" fill="#ffffff" stroke="#3a2e27" stroke-width="1.5"/>
  <rect x="657" y="592" width="4" height="78" fill="#c0302a"/>
  <text x="660" y="696" font-size="7" text-anchor="middle" fill="#3a2e27" font-family="sans-serif">-20 0 20 40 60 80 100 F</text>

  <!-- Crumb's Bakery star cutter with wooden grip -->
  <rect x="110" y="668" width="20" height="14" rx="3" fill="#9a6b3d" stroke="#2a211b" stroke-width="1.5"/>
  <path d="M120 693 L131 720 L158 723 L137 741 L144 767 L120 753 L97 767 L103 741 L82 723 L109 720 Z" fill="none" stroke="#9aa3a8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 693 L131 720 L158 723 L137 741 L144 767 L120 753 L97 767 L103 741 L82 723 L109 720 Z" fill="none" stroke="#5d656a" stroke-width="1"/>

  <!-- fog veil over lower village -->
  <rect x="0" y="560" width="800" height="80" fill="#efe9dc" opacity="0.35"/>
  <ellipse cx="400" cy="620" rx="460" ry="30" fill="#e6e1d3" opacity="0.5"/>

  <!-- signature -->
  <text x="772" y="784" font-size="16" text-anchor="end" fill="#3a2e27" font-family="serif">P.</text>
</svg>