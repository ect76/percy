<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Crumb's Bakery and the loaf weather vane, Mossbrook</title>
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4ecd8"/>

  <!-- distant fog banks -->
  <ellipse cx="160" cy="250" rx="220" ry="34" fill="#d9d5ca" opacity="0.7"/>
  <ellipse cx="660" cy="200" rx="200" ry="30" fill="#d9d5ca" opacity="0.7"/>
  <ellipse cx="400" cy="560" rx="380" ry="26" fill="#e6e1d4" opacity="0.8"/>

  <!-- weather vane pole -->
  <line x1="400" y1="250" x2="400" y2="150" stroke="#2b2118" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="250" r="6" fill="#2b2118"/>

  <!-- loaf-shaped weather vane -->
  <path d="M338 142 Q336 116 378 114 L422 114 Q464 116 462 142 Q460 168 420 168 L380 168 Q340 168 338 142 Z"
        fill="#c98a3f" stroke="#2b2118" stroke-width="4" stroke-linejoin="round"/>
  <path d="M368 124 L380 150 M396 122 L406 156 M424 124 L434 150"
        stroke="#7a4a32" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- vane tail and tip -->
  <path d="M338 142 L300 132 L304 142 L300 152 Z" fill="#7a4a32" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
  <path d="M462 142 L490 142" stroke="#2b2118" stroke-width="4" stroke-linecap="round"/>

  <!-- roof -->
  <polygon points="150,336 400,256 650,336" fill="#7a4a32" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"/>
  <line x1="180" y1="330" x2="620" y2="330" stroke="#2b2118" stroke-width="2" opacity="0.5"/>

  <!-- building facade -->
  <rect x="170" y="336" width="460" height="304" fill="#e8b98a" stroke="#2b2118" stroke-width="5"/>

  <!-- sign board -->
  <rect x="236" y="352" width="328" height="52" rx="4" fill="#5b3a24" stroke="#2b2118" stroke-width="3"/>
  <text x="400" y="390" text-anchor="middle" font-family="serif" font-size="32" fill="#f4ecd8">Crumb's</text>

  <!-- awning -->
  <path d="M210 410 L450 410 L440 386 L220 386 Z" fill="#b8453a" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
  <path d="M240 386 L232 410 M270 386 L262 410 M300 386 L292 410 M330 386 L322 410 M360 386 L352 410 M390 386 L382 410 M420 386 L412 410"
        stroke="#f4ecd8" stroke-width="5" opacity="0.8"/>
  <path d="M210 410 Q220 424 230 410 Q240 424 250 410 Q260 424 270 410 Q280 424 290 410 Q300 424 310 410 Q320 424 330 410 Q340 424 350 410 Q360 424 370 410 Q380 424 390 410 Q400 424 410 410 Q420 424 430 410 Q440 424 450 410"
        fill="#b8453a" stroke="#2b2118" stroke-width="3"/>

  <!-- shop window -->
  <rect x="222" y="436" width="220" height="168" fill="#f7d98b" stroke="#2b2118" stroke-width="5"/>
  <line x1="332" y1="436" x2="332" y2="604" stroke="#2b2118" stroke-width="4"/>
  <line x1="222" y1="520" x2="442" y2="520" stroke="#2b2118" stroke-width="4"/>
  <!-- loaves on shelves -->
  <ellipse cx="270" cy="500" rx="30" ry="17" fill="#b87333" stroke="#2b2118" stroke-width="3"/>
  <ellipse cx="385" cy="500" rx="30" ry="17" fill="#c98a3f" stroke="#2b2118" stroke-width="3"/>
  <ellipse cx="270" cy="584" rx="34" ry="16" fill="#a8652b" stroke="#2b2118" stroke-width="3"/>
  <ellipse cx="385" cy="584" rx="28" ry="15" fill="#c98a3f" stroke="#2b2118" stroke-width="3"/>
  <path d="M258 496 L266 480 M380 496 L388 480" stroke="#f4ecd8" stroke-width="3" stroke-linecap="round"/>

  <!-- door -->
  <rect x="500" y="436" width="92" height="204" fill="#4f6b5a" stroke="#2b2118" stroke-width="5"/>
  <circle cx="578" cy="545" r="6" fill="#d9b44a" stroke="#2b2118" stroke-width="2"/>
  <rect x="512" y="452" width="68" height="36" fill="none" stroke="#2b2118" stroke-width="3"/>

  <!-- cobbles -->
  <g fill="#bfb6a3" stroke="#2b2118" stroke-width="3">
    <ellipse cx="180" cy="680" rx="34" ry="14"/>
    <ellipse cx="260" cy="700" rx="38" ry="15"/>
    <ellipse cx="350" cy="682" rx="34" ry="14"/>
    <ellipse cx="430" cy="706" rx="40" ry="15"/>
    <ellipse cx="520" cy="684" rx="34" ry="14"/>
    <ellipse cx="610" cy="700" rx="36" ry="15"/>
    <ellipse cx="220" cy="750" rx="40" ry="16"/>
    <ellipse cx="320" cy="766" rx="36" ry="15"/>
    <ellipse cx="420" cy="748" rx="38" ry="15"/>
    <ellipse cx="530" cy="768" rx="40" ry="16"/>
    <ellipse cx="620" cy="748" rx="34" ry="14"/>
  </g>

  <!-- fog over the street -->
  <ellipse cx="400" cy="650" rx="420" ry="24" fill="#f4ecd8" opacity="0.55"/>
  <ellipse cx="400" cy="735" rx="400" ry="20" fill="#f4ecd8" opacity="0.45"/>

  <!-- signature -->
  <text x="760" y="780" text-anchor="end" font-family="serif" font-size="20" fill="#2b2118">P.</text>
</svg>