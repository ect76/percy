<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe8d8"/>
  <!-- foggy village beyond the door -->
  <rect x="30" y="30" width="740" height="740" fill="#c3cdca"/>
  <g fill="#9aa8a4" stroke="#2a2420" stroke-width="2">
    <rect x="40" y="40" width="70" height="90"/>
    <polygon points="40,40 75,15 110,40"/>
    <rect x="650" y="50" width="100" height="70"/>
    <polygon points="650,50 700,22 750,50"/>
    <rect x="40" y="620" width="60" height="120"/>
    <rect x="690" y="640" width="70" height="110"/>
  </g>
  <g fill="#e8eeec" opacity="0.7">
    <ellipse cx="200" cy="90" rx="160" ry="22"/>
    <ellipse cx="620" cy="140" rx="150" ry="18"/>
    <ellipse cx="180" cy="760" rx="170" ry="20"/>
    <ellipse cx="640" cy="730" rx="140" ry="16"/>
  </g>
  <!-- cobbles outside -->
  <g fill="none" stroke="#8a9592" stroke-width="2">
    <ellipse cx="90" cy="770" rx="22" ry="8"/>
    <ellipse cx="160" cy="782" rx="24" ry="7"/>
    <ellipse cx="720" cy="772" rx="22" ry="8"/>
  </g>
  <!-- doorway frame -->
  <rect x="60" y="60" width="680" height="690" fill="#6b4b33" stroke="#2a2420" stroke-width="3"/>
  <rect x="100" y="100" width="600" height="620" fill="#dcc89c" stroke="#2a2420" stroke-width="3"/>
  <!-- interior wall panels -->
  <g stroke="#b8a377" stroke-width="3" fill="none">
    <line x1="100" y1="250" x2="700" y2="250"/>
    <line x1="250" y1="100" x2="250" y2="250"/>
    <line x1="550" y1="100" x2="550" y2="250"/>
  </g>
  <!-- floor -->
  <rect x="100" y="700" width="600" height="20" fill="#9a7650" stroke="#2a2420" stroke-width="2"/>
  <!-- calendar with footbridge -->
  <rect x="440" y="170" width="120" height="130" fill="#f7f2e6" stroke="#2a2420" stroke-width="2"/>
  <rect x="448" y="178" width="104" height="60" fill="#a9c4c8"/>
  <path d="M458 230 Q500 200 542 230" fill="none" stroke="#5c4330" stroke-width="5"/>
  <g stroke="#5c4330" stroke-width="2">
    <line x1="470" y1="215" x2="470" y2="232"/>
    <line x1="490" y1="206" x2="490" y2="226"/>
    <line x1="510" y1="206" x2="510" y2="226"/>
    <line x1="530" y1="215" x2="530" y2="232"/>
  </g>
  <text x="500" y="266" font-size="7" text-anchor="middle" fill="#2a2420" font-family="serif">MOSSBROOK VILLAGE HALL</text>
  <text x="500" y="278" font-size="6" text-anchor="middle" fill="#2a2420" font-family="serif">Monthly Notices</text>
  <circle cx="450" cy="180" r="3" fill="#a63b2e"/>
  <!-- tag on string -->
  <line x1="600" y1="150" x2="612" y2="262" stroke="#8a7a5c" stroke-width="2"/>
  <g transform="rotate(-6 612 300)">
    <rect x="582" y="262" width="60" height="78" fill="#f8f3e2" stroke="#2a2420" stroke-width="2"/>
    <text x="588" y="290" font-size="6" fill="#2a2420" font-family="serif">Unclaimed -</text>
    <text x="588" y="300" font-size="6" fill="#2a2420" font-family="serif">30 days.</text>
    <text x="588" y="312" font-size="6" fill="#2a2420" font-family="serif">Ask at counter.</text>
  </g>
  <!-- shelf -->
  <rect x="130" y="430" width="540" height="16" fill="#7a5a3a" stroke="#2a2420" stroke-width="2"/>
  <rect x="130" y="446" width="540" height="6" fill="#5c4330"/>
  <!-- book -->
  <rect x="150" y="330" width="70" height="100" fill="#2e4a3a" stroke="#2a2420" stroke-width="2"/>
  <rect x="150" y="330" width="70" height="8" fill="#4c6b58"/>
  <rect x="160" y="370" width="50" height="30" fill="#f4eedb" stroke="#2a2420" stroke-width="1"/>
  <text x="165" y="381" font-size="5" fill="#2a2420" font-family="serif">LOST PROPERTY</text>
  <text x="165" y="390" font-size="5" fill="#2a2420" font-family="serif">MOSSBROOK</text>
  <rect x="200" y="322" width="4" height="30" fill="#a63b2e"/>
  <!-- bird: tail -->
  <polygon points="262,335 200,298 206,382" fill="#7fa653" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>
  <!-- legs with jointed knees -->
  <g fill="none" stroke="#2a2420" stroke-width="3" stroke-linecap="round">
    <polyline points="322,398 312,420 324,430"/>
    <polyline points="360,398 370,420 358,430"/>
  </g>
  <g fill="#c9a227" stroke="#2a2420" stroke-width="2">
    <circle cx="312" cy="420" r="5"/>
    <circle cx="370" cy="420" r="5"/>
    <rect x="316" y="426" width="18" height="6"/>
    <rect x="354" y="426" width="18" height="6"/>
  </g>
  <!-- bird: body -->
  <ellipse cx="340" cy="350" rx="85" ry="60" fill="#4f8a4b" stroke="#2a2420" stroke-width="3"/>
  <!-- bird: yellow breast -->
  <ellipse cx="368" cy="372" rx="48" ry="34" fill="#f2cc3c" stroke="#2a2420" stroke-width="2"/>
  <!-- bird: head -->
  <circle cx="392" cy="290" r="36" fill="#4f8a4b" stroke="#2a2420" stroke-width="3"/>
  <!-- bird: beak -->
  <polygon points="422,282 456,292 422,302" fill="#e8952e" stroke="#2a2420" stroke-width="2" stroke-linejoin="round"/>
  <!-- bird: eye -->
  <circle cx="404" cy="282" r="8" fill="#f7f2e6" stroke="#2a2420" stroke-width="2"/>
  <circle cx="406" cy="282" r="3" fill="#2a2420"/>
  <!-- bird: wing -->
  <path d="M290 340 Q330 300 380 335 Q345 352 320 378 Q300 372 290 340 Z" fill="#f2cc3c" stroke="#2a2420" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- bird: tin rivets and seam -->
  <g fill="#2a2420">
    <circle cx="258" cy="348" r="2.5"/>
    <circle cx="300" cy="392" r="2.5"/>
    <circle cx="390" cy="330" r="2.5"/>
  </g>
  <path d="M250 352 Q340 300 430 340" fill="none" stroke="#2a2420" stroke-width="1.5" opacity="0.5"/>
  <!-- brass key on back -->
  <line x1="340" y1="292" x2="340" y2="256" stroke="#c9a227" stroke-width="5"/>
  <circle cx="340" cy="244" r="13" fill="none" stroke="#c9a227" stroke-width="5"/>
  <rect x="336" y="256" width="8" height="5" fill="#c9a227" stroke="#2a2420" stroke-width="1"/>
  <rect x="336" y="268" width="10" height="4" fill="#c9a227" stroke="#2a2420" stroke-width="1"/>
  <rect x="336" y="278" width="6" height="4" fill="#c9a227" stroke="#2a2420" stroke-width="1"/>
  <!-- cabinet with glass top -->
  <rect x="440" y="560" width="230" height="140" fill="#7a5a3a" stroke="#2a2420" stroke-width="3"/>
  <rect x="440" y="550" width="230" height="14" fill="#b9d3d1" opacity="0.8" stroke="#2a2420" stroke-width="2"/>
  <line x1="455" y1="556" x2="520" y2="556" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <!-- spectacles in cases -->
  <g fill="#f4eedb" stroke="#2a2420" stroke-width="1.5">
    <rect x="455" y="580" width="40" height="26" rx="4"/>
    <rect x="505" y="580" width="40" height="26" rx="4"/>
    <rect x="555" y="580" width="40" height="26" rx="4"/>
    <rect x="605" y="580" width="40" height="26" rx="4"/>
  </g>
  <g fill="none" stroke="#2a2420" stroke-width="2">
    <circle cx="470" cy="593" r="7"/><circle cx="484" cy="593" r="7"/>
    <circle cx="520" cy="593" r="7"/><circle cx="534" cy="593" r="7"/>
    <circle cx="570" cy="593" r="7"/><circle cx="584" cy="593" r="7"/>
    <circle cx="620" cy="593" r="7"/><circle cx="634" cy="593" r="7"/>
  </g>
  <rect x="455" y="620" width="40" height="60" fill="#6b4b33" stroke="#2a2420" stroke-width="2"/>
  <rect x="505" y="620" width="40" height="60" fill="#6b4b33" stroke="#2a2420" stroke-width="2"/>
  <rect x="555" y="620" width="40" height="60" fill="#6b4b33" stroke="#2a2420" stroke-width="2"/>
  <rect x="605" y="620" width="40" height="60" fill="#6b4b33" stroke="#2a2420" stroke-width="2"/>
  <!-- signature -->
  <text x="722" y="778" font-size="18" fill="#2a2420" font-family="serif">P.</text>
</svg>