<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe8d8"/>

  <!-- distant fog bands -->
  <rect x="0" y="60" width="800" height="90" fill="#ffffff" opacity="0.35"/>
  <rect x="0" y="330" width="800" height="60" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="400" cy="200" rx="420" ry="50" fill="#ffffff" opacity="0.25"/>

  <!-- cobbled ground -->
  <rect x="0" y="700" width="800" height="100" fill="#9a968e"/>
  <g fill="#b8b4aa" stroke="#4a4740" stroke-width="2">
    <ellipse cx="60" cy="730" rx="34" ry="14"/>
    <ellipse cx="150" cy="752" rx="38" ry="14"/>
    <ellipse cx="260" cy="728" rx="32" ry="13"/>
    <ellipse cx="340" cy="762" rx="40" ry="14"/>
    <ellipse cx="90" cy="782" rx="30" ry="12"/>
    <ellipse cx="230" cy="785" rx="36" ry="12"/>
    <ellipse cx="410" cy="735" rx="30" ry="12"/>
    <ellipse cx="500" cy="775" rx="40" ry="13"/>
    <ellipse cx="740" cy="745" rx="36" ry="13"/>
    <ellipse cx="620" cy="782" rx="34" ry="12"/>
  </g>

  <!-- library cabinet body -->
  <rect x="150" y="90" width="260" height="540" fill="#3a2e28" stroke="#1a1410" stroke-width="4"/>
  <rect x="150" y="630" width="260" height="12" fill="#261e1a" stroke="#1a1410" stroke-width="3"/>

  <!-- drawers: 4 columns x 6 rows -->
  <g stroke="#1a1410" stroke-width="2.5" fill="#4a3b33">
    <rect x="172" y="112" width="50" height="76"/>
    <rect x="227" y="112" width="50" height="76"/>
    <rect x="282" y="112" width="50" height="76"/>
    <rect x="337" y="112" width="50" height="76"/>

    <rect x="172" y="195" width="50" height="76"/>
    <rect x="227" y="195" width="50" height="76"/>
    <rect x="282" y="195" width="50" height="76"/>
    <rect x="337" y="195" width="50" height="76"/>

    <rect x="172" y="278" width="50" height="76"/>
    <rect x="282" y="278" width="50" height="76"/>
    <rect x="337" y="278" width="50" height="76"/>

    <rect x="172" y="361" width="50" height="76"/>
    <rect x="227" y="361" width="50" height="76"/>
    <rect x="282" y="361" width="50" height="76"/>
    <rect x="337" y="361" width="50" height="76"/>

    <rect x="172" y="444" width="50" height="76"/>
    <rect x="227" y="444" width="50" height="76"/>
    <rect x="282" y="444" width="50" height="76"/>
    <rect x="337" y="444" width="50" height="76"/>

    <rect x="172" y="527" width="50" height="76"/>
    <rect x="227" y="527" width="50" height="76"/>
    <rect x="282" y="527" width="50" height="76"/>
    <rect x="337" y="527" width="50" height="76"/>
  </g>

  <!-- brass pulls on closed drawers -->
  <g fill="#c9a227" stroke="#5a4510" stroke-width="1.5">
    <circle cx="197" cy="150" r="5"/><circle cx="252" cy="150" r="5"/><circle cx="307" cy="150" r="5"/><circle cx="362" cy="150" r="5"/>
    <circle cx="197" cy="233" r="5"/><circle cx="252" cy="233" r="5"/><circle cx="307" cy="233" r="5"/><circle cx="362" cy="233" r="5"/>
    <circle cx="197" cy="316" r="5"/><circle cx="307" cy="316" r="5"/><circle cx="362" cy="316" r="5"/>
    <circle cx="197" cy="399" r="5"/><circle cx="252" cy="399" r="5"/><circle cx="307" cy="399" r="5"/><circle cx="362" cy="399" r="5"/>
    <circle cx="197" cy="482" r="5"/><circle cx="252" cy="482" r="5"/><circle cx="307" cy="482" r="5"/><circle cx="362" cy="482" r="5"/>
    <circle cx="197" cy="565" r="5"/><circle cx="252" cy="565" r="5"/><circle cx="307" cy="565" r="5"/><circle cx="362" cy="565" r="5"/>
  </g>

  <!-- the open drawer: empty slot behind, drawer pulled forward -->
  <rect x="227" y="278" width="50" height="76" fill="#120d0a" stroke="#1a1410" stroke-width="2.5"/>
  <rect x="210" y="292" width="50" height="76" fill="#5a4539" stroke="#1a1410" stroke-width="2.5"/>
  <rect x="210" y="292" width="50" height="10" fill="#2a201a" stroke="#1a1410" stroke-width="1.5"/>
  <circle cx="235" cy="332" r="5" fill="#c9a227" stroke="#5a4510" stroke-width="1.5"/>

  <!-- desk -->
  <rect x="440" y="470" width="300" height="28" fill="#6b4f3a" stroke="#2a1e14" stroke-width="3"/>
  <rect x="455" y="498" width="12" height="102" fill="#4e3828" stroke="#2a1e14" stroke-width="2"/>
  <rect x="713" y="498" width="12" height="102" fill="#4e3828" stroke="#2a1e14" stroke-width="2"/>

  <!-- ink pad -->
  <rect x="500" y="440" width="90" height="30" fill="#2e4a3a" stroke="#14231b" stroke-width="3"/>
  <rect x="506" y="446" width="78" height="18" fill="#3f6450"/>

  <!-- date stamp: black rubber head and handle, beside the pad -->
  <rect x="616" y="400" width="32" height="52" rx="6" fill="#1c1c1c" stroke="#000" stroke-width="2"/>
  <circle cx="632" cy="396" r="14" fill="#262626" stroke="#000" stroke-width="2"/>
  <rect x="604" y="450" width="56" height="20" rx="3" fill="#0d0d0d" stroke="#000" stroke-width="2"/>
  <rect x="608" y="466" width="48" height="4" fill="#3a3a3a"/>

  <!-- red dented box on the cobbles -->
  <polygon points="570,630 600,605 730,605 710,630" fill="#d9504f" stroke="#3a0d0d" stroke-width="3"/>
  <rect x="570" y="630" width="140" height="70" fill="#b3262a" stroke="#3a0d0d" stroke-width="3"/>
  <g fill="#7a1619" stroke="#3a0d0d" stroke-width="1.5">
    <ellipse cx="610" cy="660" rx="10" ry="6"/>
    <ellipse cx="655" cy="675" rx="14" ry="7"/>
    <ellipse cx="688" cy="652" rx="9" ry="5"/>
    <ellipse cx="630" cy="688" rx="8" ry="4"/>
  </g>
  <rect x="580" y="636" width="120" height="4" fill="#e88a86" opacity="0.6"/>

  <!-- foreground fog -->
  <rect x="0" y="640" width="800" height="50" fill="#ffffff" opacity="0.18"/>
  <ellipse cx="400" cy="720" rx="460" ry="30" fill="#ffffff" opacity="0.2"/>

  <!-- signature -->
  <text x="24" y="776" font-size="22" fill="#2a2420">P.</text>
</svg>