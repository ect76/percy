    <circle cx="521" cy="256" r="3.5"/>
    <circle cx="454" cy="294" r="3.5"/>
    <circle cx="490" cy="294" r="3.5"/>
    <circle cx="521" cy="294" r="3.5"/>
    <circle cx="454" cy="332" r="3.5"/>
    <circle cx="490" cy="332" r="3.5"/>
    <circle cx="521" cy="332" r="3.5"/>
    <circle cx="454" cy="370" r="3.5"/>
    <circle cx="521" cy="370" r="3.5"/>
    <circle cx="454" cy="408" r="3.5"/>
    <circle cx="490" cy="408" r="3.5"/>
