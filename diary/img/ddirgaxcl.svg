  <!-- fog wisps over doorway edge -->
  <g fill="#f7f4ec" opacity="0.45">
    <ellipse cx="160" cy="720" rx="90" ry="22"/>
    <ellipse cx="650" cy="650" rx="80" ry="20"/>
