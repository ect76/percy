    <rect x="270" y="290" width="16" height="50" fill="#9a7d4a"/>
    <rect x="288" y="284" width="12" height="56" fill="#6b3a3a"/>
    <rect x="302" y="292" width="14" height="48" fill="#4f6a5a"/>
    <rect x="318" y="288" width="12" height="52" fill="#8c7140"/>
    <rect x="256" y="356" width="16" height="54" fill="#5b4a7a"/>
    <rect x="274" y="360" width="12" height="50" fill="#7a3b2e"/>
