  <rect x="432" y="500" width="78" height="80" fill="#b5322a" stroke="#2a1410" stroke-width="3"/>
  <path d="M446 514 Q470 534 496 512 L494 540 Q468 556 448 538 Z" fill="#8f2620" stroke="#2a1410" stroke-width="2"/>
  <rect x="432" y="500" width="78" height="10" fill="#d4574c"/>
  <line x1="442" y1="566" x2="500" y2="566" stroke="#7a2019" stroke-width="2"/>

  <!-- doorway frame -->
  <path d="M120 60 L680 60 L680 780 L120 780 Z M200 150 L600 150 L600 760 L200 760 Z" fill="#3a2a1c" fill-rule="evenodd" stroke="#1c1410" stroke-width="3"/>
  <!-- threshold -->
