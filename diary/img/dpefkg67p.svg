<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efeade"/>

  <!-- sky, grey and wet -->
  <rect x="0" y="0" width="800" height="330" fill="#d6dde0"/>

  <!-- distant roofs in fog -->
  <path d="M0 300 L60 262 L120 290 L170 250 L230 292 L300 270 L340 300 L340 360 L0 360 Z" fill="#b9c3c7" stroke="#3a3f44" stroke-width="1.5"/>
  <path d="M340 330 L400 300 L450 320 L520 290 L560 318 L600 300 L640 330 L640 380 L340 380 Z" fill="#c4ccd0" stroke="#3a3f44" stroke-width="1.5"/>

  <!-- fog bands -->
  <rect x="0" y="300" width="800" height="50" fill="#e6ebec" opacity="0.7"/>
  <rect x="0" y="352" width="800" height="36" fill="#f1f3f2" opacity="0.6"/>

  <!-- left building wall -->
  <polygon points="0,150 340,300 340,420 0,760" fill="#a9a196" stroke="#2e2b28" stroke-width="2"/>
  <g stroke="#7d766c" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M20 200 L120 244"/><path d="M20 260 L180 330"/><path d="M60 330 L230 390"/>
    <path d="M10 420 L120 470"/><path d="M160 300 L160 360"/><path d="M250 340 L250 400"/>
  </g>
  <!-- left window, dark and shut -->
  <polygon points="60,280 120,306 120,350 60,326" fill="#5d625f" stroke="#2e2b28" stroke-width="1.5"/>

  <!-- cottage on right -->
  <rect x="470" y="330" width="290" height="330" fill="#c9a77c" stroke="#2e2b28" stroke-width="2.5"/>
  <!-- roof -->
  <polygon points="450,330 620,220 780,330" fill="#4a4f57" stroke="#2e2b28" stroke-width="2.5"/>
  <polygon points="620,220 780,330 760,330 620,236" fill="#3a3f46"/>
  <!-- chimney -->
  <rect x="680" y="250" width="28" height="60" fill="#8f6e55" stroke="#2e2b28" stroke-width="2"/>
  <!-- chimney smoke, damp -->
  <path d="M694 240 q-14 -18 0 -34 q14 -16 0 -32" fill="none" stroke="#9aa3a8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- lit window -->
  <rect x="540" y="390" width="120" height="100" fill="#f4d37c" stroke="#2e2b28" stroke-width="3"/>
  <rect x="540" y="390" width="120" height="100" fill="#fff3bf" opacity="0.5"/>
  <path d="M600 390 L600 490 M540 440 L660 440" stroke="#2e2b28" stroke-width="3"/>
  <!-- window sill -->
  <rect x="530" y="490" width="140" height="10" fill="#6e5a48" stroke="#2e2b28" stroke-width="1.5"/>
  <!-- glow around window -->
  <rect x="520" y="380" width="160" height="130" fill="none" stroke="#f4d37c" stroke-width="6" opacity="0.35"/>

  <!-- door -->
  <rect x="690" y="520" width="58" height="140" fill="#3f5b4a" stroke="#2e2b28" stroke-width="2.5"/>
  <circle cx="738" cy="590" r="3" fill="#d9b25a"/>
  <rect x="682" y="510" width="74" height="10" fill="#6e5a48"/>

  <!-- lane: wet cobbles -->
  <polygon points="-20,800 820,800 440,420 330,420" fill="#7f7d78" stroke="#2e2b28" stroke-width="2.5"/>
  <!-- cobble rows -->
  <g fill="none" stroke="#4f4d49" stroke-width="1.5" opacity="0.85">
    <path d="M330 440 L440 440"/>
    <path d="M300 480 L470 480"/>
    <path d="M240 540 L520 540"/>
    <path d="M160 610 L580 610"/>
    <path d="M60 700 L680 700"/>
  </g>
  <g fill="#6a6864" stroke="#4f4d49" stroke-width="1.2">
    <ellipse cx="380" cy="458" rx="18" ry="6"/>
    <ellipse cx="420" cy="462" rx="14" ry="5"/>
    <ellipse cx="350" cy="500" rx="22" ry="7"/>
    <ellipse cx="410" cy="505" rx="16" ry="6"/>
    <ellipse cx="270" cy="560" rx="26" ry="8"/>
    <ellipse cx="380" cy="572" rx="20" ry="7"/>
    <ellipse cx="200" cy="650" rx="34" ry="10"/>
    <ellipse cx="520" cy="630" rx="30" ry="9"/>
    <ellipse cx="90" cy="760" rx="50" ry="14"/>
  </g>

  <!-- light from window spilling onto wet cobbles -->
  <polygon points="540,500 660,500 700,640 500,640" fill="#f4d37c" opacity="0.45"/>
  <ellipse cx="600" cy="560" rx="70" ry="18" fill="#f8e29a" opacity="0.7"/>
  <ellipse cx="560" cy="620" rx="60" ry="14" fill="#f8e29a" opacity="0.55"/>
  <ellipse cx="640" cy="690" rx="90" ry="20" fill="#f8e29a" opacity="0.4"/>
  <!-- reflected cottage edge in puddle -->
  <path d="M470 500 L470 540 M500 520 L500 580" stroke="#f4d37c" stroke-width="4" opacity="0.5"/>

  <!-- kerb / gutter stones along the lane edge -->
  <path d="M330 420 L-20 800" stroke="#2e2b28" stroke-width="2" fill="none"/>
  <path d="M440 420 L820 800" stroke="#2e2b28" stroke-width="2" fill="none"/>

  <!-- rain -->
  <g stroke="#5f6f80" stroke-width="1.3" stroke-linecap="round" opacity="0.55">
    <path d="M90 90 l-10 30"/><path d="M150 40 l-10 30"/><path d="M210 120 l-10 30"/>
    <path d="M260 60 l-10 30"/><path d="M300 170 l-10 30"/><path d="M40 210 l-10 30"/>
    <path d="M380 110 l-10 30"/><path d="M420 40 l-10 30"/><path d="M500 80 l-10 30"/>
    <path d="M560 150 l-10 30"/><path d="M640 40 l-10 30"/><path d="M720 110 l-10 30"/>
    <path d="M770 180 l-10 30"/><path d="M180 260 l-10 30"/><path d="M400 240 l-10 30"/>
    <path d="M110 330 l-10 30"/><path d="M30 410 l-10 30"/><path d="M360 350 l-10 30"/>
    <path d="M60 520 l-10 30"/><path d="M160 480 l-10 30"/><path d="M250 610 l-10 30"/>
    <path d="M130 700 l-10 30"/><path d="M320 700 l-10 30"/><path d="M470 730 l-10 30"/>
    <path d="M600 760 l-10 30"/><path d="M750 700 l-10 30"/><path d="M700 380 l-10 30"/>
    <path d="M230 330 l-10 30"/><path d="M780 430 l-10 30"/><path d="M20 120 l-10 30"/>
  </g>

  <!-- signature -->
  <text x="28" y="48" font-size="22" fill="#2e2b28" font-family="serif">P.</text>
</svg>