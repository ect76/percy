<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f4efe3"/>
  <!-- fog bands -->
  <rect x="0" y="90" width="800" height="70" fill="#dcdcd6" opacity="0.6"/>
  <rect x="0" y="560" width="800" height="50" fill="#dcdcd6" opacity="0.5"/>
  <ellipse cx="120" cy="250" rx="160" ry="30" fill="#e8e6df" opacity="0.8"/>
  <ellipse cx="690" cy="420" rx="170" ry="34" fill="#e8e6df" opacity="0.8"/>
  <!-- cupboard body -->
  <rect x="200" y="140" width="400" height="500" fill="#8a6a4a" stroke="#1d1d1d" stroke-width="4"/>
  <rect x="226" y="166" width="348" height="448" fill="#4e3a28" stroke="#1d1d1d" stroke-width="3"/>
  <!-- door split -->
  <line x1="400" y1="166" x2="400" y2="614" stroke="#1d1d1d" stroke-width="3"/>
  <!-- shelves -->
  <rect x="226" y="298" width="348" height="12" fill="#b08a5e" stroke="#1d1d1d" stroke-width="3"/>
  <rect x="226" y="438" width="348" height="12" fill="#b08a5e" stroke="#1d1d1d" stroke-width="3"/>
  <!-- darkened shelf shadows -->
  <rect x="226" y="166" width="348" height="10" fill="#2e2118" opacity="0.6"/>
  <rect x="226" y="310" width="348" height="8" fill="#2e2118" opacity="0.4"/>
  <rect x="226" y="450" width="348" height="8" fill="#2e2118" opacity="0.4"/>
  <!-- door handles -->
  <circle cx="386" cy="390" r="7" fill="#c9b07a" stroke="#1d1d1d" stroke-width="2"/>
  <circle cx="414" cy="390" r="7" fill="#c9b07a" stroke="#1d1d1d" stroke-width="2"/>
  <!-- the single fish on middle shelf -->
  <path d="M 452 378 L 496 356 L 496 402 Z" fill="#9fb3b8" stroke="#1d1d1d" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="380" cy="380" rx="74" ry="30" fill="#9fb3b8" stroke="#1d1d1d" stroke-width="3"/>
  <path d="M 350 352 Q 370 334 392 352" fill="#7d939a" stroke="#1d1d1d" stroke-width="2.5"/>
  <path d="M 330 372 Q 340 380 330 390" fill="none" stroke="#1d1d1d" stroke-width="2.5"/>
  <path d="M 372 362 Q 380 380 372 398" fill="none" stroke="#5f767d" stroke-width="2"/>
  <path d="M 396 366 Q 404 380 396 394" fill="none" stroke="#5f767d" stroke-width="2"/>
  <circle cx="330" cy="374" r="5" fill="#1d1d1d"/>
  <!-- cobbles -->
  <g fill="#b9b1a2" stroke="#1d1d1d" stroke-width="2">
    <ellipse cx="120" cy="690" rx="40" ry="16"/>
    <ellipse cx="200" cy="716" rx="46" ry="18"/>
    <ellipse cx="290" cy="688" rx="38" ry="15"/>
    <ellipse cx="380" cy="724" rx="50" ry="18"/>
    <ellipse cx="480" cy="692" rx="42" ry="16"/>
    <ellipse cx="570" cy="720" rx="46" ry="17"/>
    <ellipse cx="660" cy="690" rx="40" ry="15"/>
    <ellipse cx="140" cy="760" rx="44" ry="14"/>
    <ellipse cx="300" cy="768" rx="40" ry="13"/>
    <ellipse cx="520" cy="766" rx="48" ry="14"/>
    <ellipse cx="680" cy="764" rx="42" ry="13"/>
  </g>
  <!-- signature -->
  <text x="752" y="772" font-size="28" fill="#1d1d1d" text-anchor="end">P.</text>
</svg>