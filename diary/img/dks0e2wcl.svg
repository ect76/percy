<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>

  <!-- fog bands -->
  <rect x="0" y="60" width="800" height="70" fill="#d9d6cc" opacity="0.6"/>
  <rect x="0" y="180" width="110" height="520" fill="#d9d6cc" opacity="0.5"/>
  <rect x="690" y="150" width="110" height="520" fill="#d9d6cc" opacity="0.5"/>
  <rect x="0" y="100" width="800" height="30" fill="#e8e4d8" opacity="0.8"/>

  <!-- building wall -->
  <rect x="120" y="120" width="560" height="560" fill="#b9a68c" stroke="#2a2420" stroke-width="3"/>
  <g stroke="#8f7b63" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="120" y1="200" x2="680" y2="200"/>
    <line x1="120" y1="620" x2="680" y2="620"/>
    <line x1="120" y1="680" x2="680" y2="680"/>
    <line x1="200" y1="120" x2="200" y2="200"/>
    <line x1="420" y1="120" x2="420" y2="200"/>
    <line x1="600" y1="120" x2="600" y2="200"/>
  </g>

  <!-- sign board -->
  <rect x="170" y="142" width="460" height="82" fill="#2e4a3f" stroke="#2a2420" stroke-width="3"/>
  <rect x="182" y="154" width="436" height="58" fill="none" stroke="#d8c9a4" stroke-width="1.5"/>
  <text x="400" y="180" text-anchor="middle" font-size="22" fill="#f3ecdc" font-family="sans-serif" letter-spacing="2">LOST PROPERTY - MOSSBROOK</text>
  <text x="400" y="204" text-anchor="middle" font-size="13" fill="#f3ecdc" font-family="sans-serif">Please enter date, item, and finder's name.</text>

  <!-- window glass -->
  <rect x="170" y="250" width="460" height="250" fill="#cfd9d4" stroke="#2a2420" stroke-width="3"/>
  <!-- mullions -->
  <rect x="393" y="250" width="12" height="250" fill="#5b4a3a"/>

  <!-- umbrella cylinder body -->
  <rect x="232" y="388" width="76" height="112" fill="#8c8a82" stroke="#2a2420" stroke-width="3"/>
  <rect x="232" y="388" width="22" height="112" fill="#a7a59c" opacity="0.7"/>
  <rect x="290" y="388" width="18" height="112" fill="#6c6a63" opacity="0.6"/>
  <ellipse cx="270" cy="500" rx="38" ry="8" fill="#6c6a63" stroke="#2a2420" stroke-width="3"/>
  <!-- wide rim -->
  <ellipse cx="270" cy="388" rx="42" ry="9" fill="#b3b0a6" stroke="#2a2420" stroke-width="3"/>
  <ellipse cx="270" cy="388" rx="34" ry="5" fill="#5b5a54"/>

  <!-- umbrellas: wooden handles and folded canopies -->
  <path d="M254 388 L254 330 Q254 310 266 310 Q278 310 278 326" fill="none" stroke="#2a2420" stroke-width="7"/>
  <path d="M254 388 L254 330 Q254 310 266 310 Q278 310 278 326" fill="none" stroke="#9a6236" stroke-width="3.5"/>
  <path d="M270 388 L270 296 Q270 274 284 274 Q298 274 298 292" fill="none" stroke="#2a2420" stroke-width="7"/>
  <path d="M270 388 L270 296 Q270 274 284 274 Q298 274 298 292" fill="none" stroke="#a06c3e" stroke-width="3.5"/>
  <path d="M286 388 L286 340 Q286 322 300 322 Q312 322 312 336" fill="none" stroke="#2a2420" stroke-width="7"/>
  <path d="M286 388 L286 340 Q286 322 300 322 Q312 322 312 336" fill="none" stroke="#8a5a2b" stroke-width="3.5"/>
  <!-- folded canopies -->
  <path d="M244 360 Q262 340 280 360 L276 372 Q262 366 246 372 Z" fill="#3d4a57" stroke="#2a2420" stroke-width="2"/>
  <path d="M262 352 Q282 318 300 350 L296 360 Q282 352 266 360 Z" fill="#4b5563" stroke="#2a2420" stroke-width="2"/>

  <!-- green cloth book -->
  <rect x="340" y="385" width="86" height="115" fill="#2f5b45" stroke="#2a2420" stroke-width="3"/>
  <line x1="352" y1="390" x2="352" y2="496" stroke="#1f3d2e" stroke-width="2"/>
  <rect x="340" y="385" width="10" height="10" fill="#a9b8a0"/>
  <rect x="416" y="385" width="10" height="10" fill="#a9b8a0"/>
  <rect x="340" y="490" width="10" height="10" fill="#a9b8a0"/>
  <rect x="416" y="490" width="10" height="10" fill="#a9b8a0"/>
  <path d="M388 385 L388 420 L392 420 L392 500 L384 500 L384 420 Z" fill="#b2665a" stroke="#2a2420" stroke-width="1.5"/>

  <!-- till -->
  <rect x="560" y="430" width="84" height="70" fill="#3c3a38" stroke="#2a2420" stroke-width="3"/>
  <rect x="570" y="440" width="64" height="22" fill="#7d8a80"/>
  <rect x="570" y="470" width="64" height="20" fill="#56534f"/>

  <!-- saucer -->
  <ellipse cx="490" cy="497" rx="40" ry="8" fill="#e8e6df" stroke="#2a2420" stroke-width="3"/>

  <!-- chipped mug with blue rim -->
  <path d="M466 440 L468 490 Q490 500 512 490 L514 440 Z" fill="#f4f2ea" stroke="#2a2420" stroke-width="3"/>
  <path d="M514 452 Q532 452 530 470 Q528 486 512 484" fill="none" stroke="#2a2420" stroke-width="3"/>
  <ellipse cx="490" cy="440" rx="24" ry="6" fill="#8a5a33" stroke="#2a2420" stroke-width="2"/>
  <path d="M472 441 Q490 450 508 441" fill="none" stroke="#5a3a20" stroke-width="2" stroke-dasharray="3 2"/>
  <rect x="466" y="438" width="48" height="6" fill="#2b5fa8"/>
  <path d="M505 438 L511 444 L507 446 L512 452" fill="none" stroke="#2a2420" stroke-width="1.5"/>
  <path d="M478 452 L482 480" stroke="#d9d4c6" stroke-width="3"/>

  <!-- sill -->
  <rect x="170" y="500" width="460" height="30" fill="#8a6a4c" stroke="#2a2420" stroke-width="3"/>
  <rect x="170" y="500" width="460" height="6" fill="#a4835f"/>

  <!-- dust overlay -->
  <rect x="170" y="250" width="460" height="250" fill="#e6dec6" opacity="0.38"/>
  <g fill="#e2d9bd" opacity="0.55">
    <ellipse cx="230" cy="300" rx="50" ry="14"/>
    <ellipse cx="600" cy="280" rx="60" ry="18"/>
    <ellipse cx="520" cy="380" rx="44" ry="10"/>
    <ellipse cx="260" cy="455" rx="40" ry="8"/>
  </g>
  <path d="M300 265 Q340 300 330 340" fill="none" stroke="#c9bfa3" stroke-width="3" opacity="0.6"/>
  <path d="M560 470 Q600 455 620 480" fill="none" stroke="#c9bfa3" stroke-width="2" opacity="0.6"/>

  <!-- cobbles -->
  <g fill="#8f8577" stroke="#2a2420" stroke-width="2">
    <ellipse cx="200" cy="730" rx="50" ry="18"/>
    <ellipse cx="320" cy="750" rx="60" ry="22"/>
    <ellipse cx="460" cy="725" rx="48" ry="16"/>
    <ellipse cx="600" cy="752" rx="58" ry="20"/>
    <ellipse cx="130" cy="775" rx="40" ry="14"/>
    <ellipse cx="700" cy="720" rx="40" ry="14"/>
  </g>
  <rect x="0" y="700" width="800" height="100" fill="#d9d6cc" opacity="0.35"/>

  <!-- signature -->
  <text x="752" y="780" text-anchor="end" font-size="20" fill="#2a2420" font-family="serif">P.</text>
</svg>