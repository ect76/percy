<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect width="800" height="800" fill="#efe8d6"/>
  <!-- distant fog-shrouded cottages -->
  <g fill="#c9c3b0" stroke="#4a4a44" stroke-width="2">
    <path d="M40 420 L40 360 L90 320 L140 360 L140 420 Z"/>
    <path d="M650 430 L650 350 L700 310 L750 350 L750 430 Z"/>
  </g>
  <!-- green -->
  <path d="M0 400 Q200 380 400 400 T800 395 L800 800 L0 800 Z" fill="#8fae6a" stroke="#2a2a2a" stroke-width="2"/>
  <!-- lane -->
  <path d="M0 610 Q400 590 800 615 L800 690 Q400 668 0 688 Z" fill="#d7cdb4" stroke="#2a2a2a" stroke-width="2"/>
  <g fill="none" stroke="#8d8270" stroke-width="2">
    <ellipse cx="60" cy="640" rx="10" ry="5"/><ellipse cx="120" cy="652" rx="10" ry="5"/>
    <ellipse cx="200" cy="636" rx="10" ry="5"/><ellipse cx="300" cy="650" rx="10" ry="5"/>
    <ellipse cx="420" cy="640" rx="10" ry="5"/><ellipse cx="520" cy="655" rx="10" ry="5"/>
    <ellipse cx="700" cy="642" rx="10" ry="5"/><ellipse cx="760" cy="660" rx="10" ry="5"/>
  </g>
  <!-- Mossbrook Welcome sign on the green -->
  <rect x="240" y="370" width="22" height="240" fill="#6b4a2b" stroke="#2a2a2a" stroke-width="2"/>
  <path d="M170 302 L251 248 L332 302 Z" fill="#3d6b3a" stroke="#2a2a2a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="172" y="300" width="158" height="78" rx="12" fill="#f3ead2" stroke="#3d6b3a" stroke-width="10"/>
  <rect x="172" y="300" width="158" height="78" rx="12" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="251" y="346" text-anchor="middle" font-family="serif" font-size="15" fill="#2a2a2a">Welcome to Mossville</text>
  <g fill="none" stroke="#b5893a" stroke-width="3" stroke-dasharray="5 3">
    <line x1="200" y1="378" x2="200" y2="408"/>
    <line x1="302" y1="378" x2="302" y2="408"/>
  </g>
  <g fill="#b5893a" stroke="#2a2a2a" stroke-width="1">
    <circle cx="200" cy="410" r="4"/><circle cx="302" cy="410" r="4"/>
  </g>
  <g fill="#5f8a3c" stroke="#2a2a2a" stroke-width="1.5">
    <ellipse cx="236" cy="600" rx="18" ry="9"/>
    <ellipse cx="262" cy="606" rx="14" ry="7"/>
    <ellipse cx="232" cy="612" rx="10" ry="5"/>
  </g>
  <!-- Mossville post across the lane -->
  <rect x="597" y="262" width="14" height="380" fill="#6b4a2b" stroke="#2a2a2a" stroke-width="2"/>
  <path d="M520 205 L604 150 L688 205 Z" fill="#3d6b3a" stroke="#2a2a2a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="522" y="202" width="166" height="62" rx="10" fill="#f3ead2" stroke="#3d6b3a" stroke-width="9"/>
  <rect x="522" y="202" width="166" height="62" rx="10" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="605" y="240" text-anchor="middle" font-family="serif" font-size="14" fill="#2a2a2a">Welcome to Mossville</text>
  <g fill="#5f8a3c" stroke="#2a2a2a" stroke-width="1.5">
    <ellipse cx="588" cy="630" rx="12" ry="7"/>
    <ellipse cx="618" cy="636" rx="11" ry="6"/>
  </g>
  <!-- fog bands -->
  <g fill="#f4f1e6" opacity="0.55">
    <rect x="0" y="430" width="800" height="40"/>
    <rect x="0" y="520" width="800" height="30"/>
    <rect x="0" y="690" width="800" height="50"/>
  </g>
  <g fill="#f4f1e6" opacity="0.35">
    <rect x="0" y="300" width="800" height="25"/>
    <rect x="0" y="740" width="800" height="60"/>
  </g>
  <!-- signature -->
  <text x="772" y="782" text-anchor="end" font-family="serif" font-size="18" fill="#2a2a2a">P.</text>
</svg>