<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fogBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5ef" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f7f5ef" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f7f5ef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d77a"/>
      <stop offset="1" stop-color="#e0b04e"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4f1ea"/>

  <!-- distant sky and ground -->
  <rect x="0" y="0" width="800" height="430" fill="#dfe6ea"/>
  <rect x="0" y="430" width="800" height="370" fill="#eef1f2"/>

  <!-- lane (snow-covered cobbles) -->
  <path d="M60 800 L360 460 L440 460 L740 800 Z" fill="#fbfbf8" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#9aa5ab" stroke-width="1.5" stroke-linecap="round">
    <ellipse cx="300" cy="500" rx="14" ry="5"/>
    <ellipse cx="480" cy="505" rx="12" ry="4"/>
    <ellipse cx="260" cy="560" rx="20" ry="7"/>
    <ellipse cx="540" cy="565" rx="18" ry="6"/>
    <ellipse cx="200" cy="650" rx="28" ry="9"/>
    <ellipse cx="610" cy="655" rx="26" ry="8"/>
    <ellipse cx="330" cy="620" rx="22" ry="7"/>
    <ellipse cx="470" cy="625" rx="20" ry="7"/>
    <ellipse cx="150" cy="740" rx="36" ry="11"/>
    <ellipse cx="660" cy="745" rx="34" ry="11"/>
    <ellipse cx="380" cy="700" rx="30" ry="9"/>
    <ellipse cx="420" cy="770" rx="40" ry="12"/>
  </g>

  <!-- left cottage (Pond Lane cottage) -->
  <rect x="40" y="340" width="190" height="270" fill="#e9dcc6" stroke="#2b2b2b" stroke-width="2.5"/>
  <path d="M28 348 L135 258 L242 348 Z" fill="#8c7b6b" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M60 318 L135 262 L210 318 L200 318 L135 270 L70 318 Z" fill="#fbfbf8" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="62" y="398" width="42" height="44" fill="url(#glow)" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="83" y1="398" x2="83" y2="442" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="168" y="398" width="42" height="44" fill="#c9d6dc" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="112" y="500" width="50" height="110" fill="#6d5a4b" stroke="#2b2b2b" stroke-width="2"/>
  <circle cx="154" cy="556" r="2.5" fill="#f3d77a"/>

  <!-- right cottage row -->
  <rect x="590" y="370" width="190" height="240" fill="#d9cdb8" stroke="#2b2b2b" stroke-width="2.5"/>
  <path d="M580 378 L685 292 L790 378 Z" fill="#6f7d86" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M615 350 L685 296 L755 350 L745 350 L685 303 L625 350 Z" fill="#fbfbf8" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="620" y="420" width="36" height="40" fill="#c9d6dc" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="712" y="420" width="36" height="40" fill="#c9d6dc" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="670" y="500" width="44" height="110" fill="#6d5a4b" stroke="#2b2b2b" stroke-width="2"/>

  <!-- fog bands -->
  <rect x="0" y="360" width="800" height="110" fill="url(#fogBand)"/>
  <rect x="0" y="470" width="800" height="90" fill="url(#fogBand)" opacity="0.8"/>
  <rect x="0" y="560" width="800" height="150" fill="url(#fogBand)" opacity="0.6"/>

  <!-- narrow bell tower at the end of the lane -->
  <rect x="375" y="230" width="50" height="240" fill="#cfc6b6" stroke="#2b2b2b" stroke-width="2.5"/>
  <g fill="#cfc6b6" stroke="#2b2b2b" stroke-width="2">
    <rect x="374" y="208" width="12" height="22"/>
    <rect x="394" y="208" width="12" height="22"/>
    <rect x="414" y="208" width="11" height="22"/>
  </g>
  <rect x="375" y="228" width="50" height="8" fill="#fbfbf8" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- clock face -->
  <circle cx="400" cy="270" r="22" fill="#fbfbf8" stroke="#2b2b2b" stroke-width="2.5"/>
  <circle cx="400" cy="270" r="17" fill="none" stroke="#2b2b2b" stroke-width="1"/>
  <line x1="400" y1="270" x2="400" y2="256" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="400" y1="270" x2="412" y2="278" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="400" cy="270" r="2.5" fill="#2b2b2b"/>
  <!-- belfry opening -->
  <path d="M388 326 V350 H412 V326 Q400 314 388 326 Z" fill="#5d6870" stroke="#2b2b2b" stroke-width="2"/>
  <!-- lower door -->
  <path d="M386 440 V412 Q400 398 414 412 V440 Z" fill="#6d5a4b" stroke="#2b2b2b" stroke-width="2"/>

  <!-- falling snow -->
  <g fill="#ffffff" stroke="#8a969c" stroke-width="0.8">
    <circle cx="250" cy="180" r="3"/>
    <circle cx="520" cy="150" r="2.5"/>
    <circle cx="610" cy="230" r="3"/>
    <circle cx="180" cy="300" r="2.5"/>
    <circle cx="470" cy="330" r="2"/>
    <circle cx="330" cy="120" r="2.5"/>
    <circle cx="690" cy="120" r="2"/>
    <circle cx="130" cy="190" r="2"/>
    <circle cx="560" cy="470" r="2.5"/>
    <circle cx="240" cy="430" r="2"/>
  </g>

  <!-- Percy's mark, bottom-right corner -->
  <path d="M752 790 V760 H762 A7 7 0 0 1 762 774 H752" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="768" cy="790" r="1.8" fill="#2b2b2b"/>
</svg>