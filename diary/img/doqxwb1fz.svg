<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f2ead8"/>

  <!-- back wall -->
  <rect x="0" y="0" width="800" height="520" fill="#e6d8bd"/>
  <!-- wall hatching -->
  <g stroke="#b9a883" stroke-width="1" opacity="0.5">
    <line x1="20" y1="30" x2="60" y2="0"/><line x1="20" y1="70" x2="100" y2="0"/>
    <line x1="20" y1="110" x2="140" y2="0"/><line x1="20" y1="150" x2="180" y2="0"/>
    <line x1="20" y1="190" x2="220" y2="0"/><line x1="20" y1="230" x2="260" y2="0"/>
    <line x1="20" y1="270" x2="300" y2="0"/><line x1="20" y1="310" x2="340" y2="0"/>
  </g>

  <!-- window with fog -->
  <rect x="520" y="60" width="230" height="230" fill="#d7e0e2" stroke="#2b2620" stroke-width="3"/>
  <g fill="#eef2f2" opacity="0.9">
    <ellipse cx="580" cy="150" rx="70" ry="22"/>
    <ellipse cx="660" cy="200" rx="80" ry="26"/>
    <ellipse cx="600" cy="250" rx="60" ry="18"/>
  </g>
  <line x1="635" y1="60" x2="635" y2="290" stroke="#2b2620" stroke-width="3"/>
  <line x1="520" y1="175" x2="750" y2="175" stroke="#2b2620" stroke-width="3"/>

  <!-- chalkboard in pine frame -->
  <rect x="98" y="98" width="324" height="354" fill="#c9a46a" stroke="#2b2620" stroke-width="3"/>
  <rect x="112" y="112" width="296" height="326" fill="#222a2a" stroke="#2b2620" stroke-width="2"/>
  <!-- cloth smudges -->
  <ellipse cx="122" cy="122" rx="22" ry="9" fill="#55605f" opacity="0.5"/>
  <ellipse cx="398" cy="428" rx="20" ry="12" fill="#55605f" opacity="0.5"/>
  <ellipse cx="400" cy="130" rx="14" ry="7" fill="#55605f" opacity="0.4"/>
  <!-- chalk writing -->
  <g fill="#f4f1ea" font-family="Georgia, serif">
    <text x="260" y="160" font-size="20" text-anchor="middle" letter-spacing="2">THE LANTERN CAFÉ</text>
    <text x="260" y="186" font-size="15" text-anchor="middle" letter-spacing="3">— MOSSBROOK —</text>
    <line x1="140" y1="200" x2="380" y2="200" stroke="#f4f1ea" stroke-width="1.5" opacity="0.8"/>
    <text x="140" y="236" font-size="17">Flat White</text>
    <text x="380" y="236" font-size="17" text-anchor="end">2.80</text>
    <text x="140" y="270" font-size="17">Espresso</text>
    <text x="380" y="270" font-size="17" text-anchor="end">2.20</text>
    <text x="140" y="304" font-size="17">Apple &amp; Cinnamon Cake</text>
    <text x="380" y="304" font-size="17" text-anchor="end">3.50</text>
    <text x="140" y="338" font-size="17">Toast &amp; Butter</text>
    <text x="380" y="338" font-size="17" text-anchor="end">1.90</text>
    <line x1="140" y1="360" x2="380" y2="360" stroke="#f4f1ea" stroke-width="1.5" opacity="0.8"/>
    <text x="140" y="396" font-size="17" font-style="italic">Today: Leek Soup</text>
  </g>

  <!-- clock on nail, slightly crooked -->
  <line x1="600" y1="100" x2="600" y2="116" stroke="#2b2620" stroke-width="2"/>
  <circle cx="600" cy="100" r="3" fill="#2b2620"/>
  <g transform="rotate(-8 600 190)">
    <circle cx="600" cy="190" r="58" fill="#6b4a2c" stroke="#2b2620" stroke-width="3"/>
    <circle cx="600" cy="190" r="46" fill="#fbf8f0" stroke="#2b2620" stroke-width="2"/>
    <line x1="600" y1="190" x2="600" y2="158" stroke="#1d1b18" stroke-width="4" stroke-linecap="round"/>
    <line x1="600" y1="190" x2="624" y2="200" stroke="#1d1b18" stroke-width="3" stroke-linecap="round"/>
    <circle cx="600" cy="190" r="4" fill="#1d1b18"/>
  </g>

  <!-- counter -->
  <rect x="0" y="520" width="800" height="90" fill="#8a5e3b" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="0" y="508" width="800" height="16" fill="#a87850" stroke="#2b2620" stroke-width="2.5"/>
  <g stroke="#6b4426" stroke-width="2" opacity="0.6">
    <line x1="0" y1="550" x2="800" y2="550"/><line x1="0" y1="580" x2="800" y2="580"/>
  </g>

  <!-- order pad on counter -->
  <g transform="rotate(-4 420 478)">
    <rect x="360" y="440" width="130" height="66" fill="#fffdf6" stroke="#2b2620" stroke-width="2"/>
    <g fill="#2b2620" font-family="Georgia, serif" font-size="10">
      <text x="368" y="458">Table ___</text>
      <text x="368" y="476">Qty ___</text>
      <text x="368" y="494">Item ___</text>
    </g>
  </g>

  <!-- cream bowl with brown sugar crust -->
  <path d="M190 470 L290 470 Q288 512 240 514 Q192 512 190 470 Z" fill="#f3e6c8" stroke="#2b2620" stroke-width="2.5"/>
  <ellipse cx="240" cy="470" rx="50" ry="13" fill="#f3e6c8" stroke="#2b2620" stroke-width="2.5"/>
  <ellipse cx="240" cy="470" rx="42" ry="9" fill="#8b5a2b"/>
  <ellipse cx="240" cy="468" rx="30" ry="5" fill="#b07a3e" opacity="0.8"/>
  <path d="M276 462 L286 458 L282 466" fill="#f2ead8" stroke="#2b2620" stroke-width="1.5"/>
  <path d="M190 480 Q240 496 290 480" fill="none" stroke="#c9b48a" stroke-width="2"/>

  <!-- floor with cobbles -->
  <rect x="0" y="610" width="800" height="190" fill="#8f8577"/>
  <g fill="#a69c8e" stroke="#4e463c" stroke-width="1.5">
    <ellipse cx="30" cy="640" rx="22" ry="10"/><ellipse cx="90" cy="636" rx="24" ry="10"/>
    <ellipse cx="160" cy="642" rx="22" ry="10"/><ellipse cx="230" cy="638" rx="24" ry="10"/>
    <ellipse cx="300" cy="644" rx="22" ry="10"/><ellipse cx="370" cy="640" rx="22" ry="10"/>
    <ellipse cx="60" cy="690" rx="24" ry="11"/><ellipse cx="140" cy="700" rx="26" ry="11"/>
    <ellipse cx="220" cy="688" rx="24" ry="11"/><ellipse cx="310" cy="706" rx="26" ry="11"/>
    <ellipse cx="30" cy="750" rx="26" ry="12"/><ellipse cx="120" cy="762" rx="28" ry="12"/>
    <ellipse cx="220" cy="752" rx="26" ry="12"/><ellipse cx="330" cy="772" rx="28" ry="12"/>
    <ellipse cx="450" cy="700" rx="24" ry="11"/><ellipse cx="520" cy="740" rx="26" ry="12"/>
    <ellipse cx="620" cy="770" rx="28" ry="12"/><ellipse cx="700" cy="720" rx="26" ry="11"/>
  </g>
  <!-- fog over floor -->
  <g fill="#e9e6df" opacity="0.6">
    <ellipse cx="400" cy="640" rx="260" ry="20"/>
    <ellipse cx="200" cy="700" rx="200" ry="18"/>
  </g>

  <!-- corner table -->
  <rect x="540" y="596" width="240" height="18" fill="#7a5233" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="558" y="614" width="10" height="130" fill="#6b4426" stroke="#2b2620" stroke-width="2"/>
  <rect x="742" y="614" width="10" height="130" fill="#6b4426" stroke="#2b2620" stroke-width="2"/>

  <!-- faded blue novel -->
  <g transform="rotate(-3 610 582)">
    <rect x="596" y="566" width="110" height="30" fill="#7e9fc4" stroke="#2b2620" stroke-width="2"/>
    <rect x="596" y="566" width="10" height="30" fill="#5d7fa8" stroke="#2b2620" stroke-width="1.5"/>
    <line x1="612" y1="575" x2="700" y2="575" stroke="#f4f1ea" stroke-width="0.8" opacity="0.7"/>
    <text x="616" y="586" font-family="Georgia, serif" font-size="7.5" fill="#f4f1ea">Cookery for Beginners, Ch. 4</text>
  </g>

  <!-- cup beside book -->
  <path d="M690 552 L724 552 L720 582 Q707 588 694 582 Z" fill="#fbf8f0" stroke="#2b2620" stroke-width="2.5"/>
  <path d="M724 558 Q736 560 732 570 Q728 578 719 576" fill="none" stroke="#2b2620" stroke-width="2.5"/>
  <ellipse cx="707" cy="552" rx="17" ry="4" fill="#6b4426" stroke="#2b2620" stroke-width="1.5"/>

  <!-- signature -->
  <text x="772" y="782" font-family="Georgia, serif" font-size="18" fill="#2b2620" text-anchor="end">P.</text>
</svg>