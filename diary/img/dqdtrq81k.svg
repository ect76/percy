<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <clipPath id="win">
      <rect x="330" y="130" width="440" height="430"/>
    </clipPath>
    <pattern id="rain" width="34" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="8" y1="4" x2="6" y2="18" stroke="#5f717e" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
      <line x1="25" y1="26" x2="23" y2="40" stroke="#5f717e" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>

  <!-- interior wall planks -->
  <g stroke="#cbbd9f" stroke-width="2" fill="none">
    <line x1="0" y1="90" x2="300" y2="90"/>
    <line x1="0" y1="230" x2="300" y2="230"/>
    <line x1="0" y1="370" x2="300" y2="370"/>
  </g>

  <!-- interior floor -->
  <rect x="0" y="700" width="800" height="100" fill="#8d6a4c" stroke="#2a2420" stroke-width="3"/>
  <g stroke="#6f5238" stroke-width="2" fill="none">
    <line x1="0" y1="740" x2="800" y2="740"/>
    <line x1="0" y1="775" x2="800" y2="775"/>
  </g>

  <!-- cupboard -->
  <rect x="60" y="470" width="200" height="230" fill="#a77650" stroke="#2a2420" stroke-width="4"/>
  <rect x="72" y="482" width="176" height="206" fill="#7a5235" stroke="#2a2420" stroke-width="3"/>
  <line x1="72" y1="560" x2="248" y2="560" stroke="#2a2420" stroke-width="3"/>
  <!-- loaf on top shelf -->
  <ellipse cx="160" cy="520" rx="62" ry="30" fill="#d89a52" stroke="#2a2420" stroke-width="3"/>
  <path d="M120 508 Q140 496 158 510 Q176 496 198 508" fill="none" stroke="#9a5f2c" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 528 Q160 540 190 528" fill="none" stroke="#b97a3a" stroke-width="2" stroke-linecap="round"/>
  <!-- sardine tins on lower shelf -->
  <rect x="86" y="594" width="44" height="28" fill="#8fa9b8" stroke="#2a2420" stroke-width="2.5"/>
  <rect x="140" y="594" width="44" height="28" fill="#8fa9b8" stroke="#2a2420" stroke-width="2.5"/>
  <rect x="194" y="594" width="44" height="28" fill="#8fa9b8" stroke="#2a2420" stroke-width="2.5"/>

  <!-- window: sky and fog -->
  <g clip-path="url(#win)">
    <rect x="330" y="130" width="440" height="430" fill="#cfd8dc"/>
    <!-- ground -->
    <rect x="330" y="400" width="440" height="160" fill="#8d9a8b"/>
    <!-- lane -->
    <polygon points="330,560 780,560 612,400 518,400" fill="#a79d8f" stroke="#2a2420" stroke-width="2"/>
    <!-- cobbles -->
    <g fill="#6f655b" opacity="0.7">
      <ellipse cx="420" cy="540" rx="8" ry="4"/>
      <ellipse cx="500" cy="548" rx="9" ry="4"/>
      <ellipse cx="600" cy="530" rx="8" ry="3.5"/>
      <ellipse cx="690" cy="545" rx="10" ry="4"/>
      <ellipse cx="470" cy="508" rx="6" ry="3"/>
      <ellipse cx="545" cy="494" rx="5" ry="2.5"/>
      <ellipse cx="588" cy="470" rx="4" ry="2"/>
      <ellipse cx="555" cy="440" rx="3" ry="1.5"/>
      <ellipse cx="640" cy="478" rx="5" ry="2.5"/>
      <ellipse cx="520" cy="456" rx="3" ry="1.5"/>
    </g>
    <!-- wet cobble shine -->
    <g stroke="#e8ecee" stroke-width="2" opacity="0.6">
      <line x1="430" y1="552" x2="446" y2="552"/>
      <line x1="620" y1="534" x2="632" y2="534"/>
      <line x1="560" y1="476" x2="570" y2="476"/>
    </g>
    <!-- bell tower at end of lane -->
    <polygon points="524,250 596,250 560,150" fill="#5e5852" stroke="#2a2420" stroke-width="3"/>
    <rect x="532" y="250" width="56" height="150" fill="#9a9288" stroke="#2a2420" stroke-width="3"/>
    <rect x="540" y="268" width="40" height="34" fill="#3b3733" stroke="#2a2420" stroke-width="2"/>
    <path d="M552 300 Q560 292 568 300 L572 308 L548 308 Z" fill="#b8925a" stroke="#2a2420" stroke-width="1.5"/>
    <rect x="540" y="330" width="40" height="40" fill="#5f5850" stroke="#2a2420" stroke-width="2"/>
    <line x1="560" y1="330" x2="560" y2="370" stroke="#2a2420" stroke-width="1.5"/>
    <rect x="528" y="382" width="64" height="20" fill="#7d766d" stroke="#2a2420" stroke-width="2"/>
    <!-- fog bands -->
    <rect x="330" y="330" width="440" height="50" fill="#e4e9ec" opacity="0.75"/>
    <rect x="330" y="392" width="440" height="30" fill="#e4e9ec" opacity="0.7"/>
    <rect x="330" y="200" width="440" height="60" fill="#e4e9ec" opacity="0.45"/>
    <rect x="330" y="455" width="440" height="30" fill="#e4e9ec" opacity="0.35"/>
    <!-- rain -->
    <rect x="330" y="130" width="440" height="430" fill="url(#rain)"/>
  </g>

  <!-- window frame -->
  <rect x="320" y="120" width="460" height="450" fill="none" stroke="#2a2420" stroke-width="14"/>
  <line x1="550" y1="120" x2="550" y2="570" stroke="#2a2420" stroke-width="8"/>
  <line x1="320" y1="340" x2="780" y2="340" stroke="#2a2420" stroke-width="8"/>
  <rect x="312" y="562" width="476" height="16" fill="#6b5240" stroke="#2a2420" stroke-width="3"/>

  <!-- signature mark: P. -->
  <g fill="none" stroke="#2a2420" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M730 742 V 776 M730 742 H 746 Q 756 742 756 752 Q 756 762 746 762 H 730"/>
  </g>
  <circle cx="764" cy="776" r="3" fill="#2a2420"/>
</svg>