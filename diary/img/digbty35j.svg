<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Wall and fog-grey sky -->
  <rect x="0" y="0" width="800" height="800" fill="#d9d4c7"/>
  <rect x="0" y="0" width="800" height="120" fill="#e6e2d8"/>

  <!-- Cobbled ground -->
  <rect x="0" y="560" width="800" height="240" fill="#a39d90"/>
  <g fill="#8c867a" stroke="#4a4540" stroke-width="2">
    <ellipse cx="60" cy="600" rx="36" ry="14"/>
    <ellipse cx="150" cy="600" rx="36" ry="14"/>
    <ellipse cx="240" cy="600" rx="36" ry="14"/>
    <ellipse cx="330" cy="600" rx="36" ry="14"/>
    <ellipse cx="420" cy="600" rx="36" ry="14"/>
    <ellipse cx="510" cy="600" rx="36" ry="14"/>
    <ellipse cx="600" cy="600" rx="36" ry="14"/>
    <ellipse cx="700" cy="600" rx="36" ry="14"/>
    <ellipse cx="105" cy="660" rx="36" ry="14"/>
    <ellipse cx="195" cy="660" rx="36" ry="14"/>
    <ellipse cx="285" cy="660" rx="36" ry="14"/>
    <ellipse cx="375" cy="660" rx="36" ry="14"/>
    <ellipse cx="465" cy="660" rx="36" ry="14"/>
    <ellipse cx="555" cy="660" rx="36" ry="14"/>
    <ellipse cx="645" cy="660" rx="36" ry="14"/>
    <ellipse cx="735" cy="660" rx="36" ry="14"/>
    <ellipse cx="60" cy="730" rx="36" ry="14"/>
    <ellipse cx="200" cy="735" rx="36" ry="14"/>
    <ellipse cx="340" cy="730" rx="36" ry="14"/>
    <ellipse cx="480" cy="735" rx="36" ry="14"/>
    <ellipse cx="620" cy="730" rx="36" ry="14"/>
    <ellipse cx="760" cy="735" rx="36" ry="14"/>
  </g>

  <!-- Shop window frame and glass -->
  <rect x="80" y="130" width="390" height="430" fill="#6b4f3a" stroke="#2b1d14" stroke-width="6"/>
  <rect x="100" y="150" width="350" height="390" fill="#cfe0e3" stroke="#2b1d14" stroke-width="3"/>
  <line x1="275" y1="150" x2="275" y2="540" stroke="#6b4f3a" stroke-width="8"/>
  <rect x="60" y="540" width="430" height="14" fill="#4a3526" stroke="#2b1d14" stroke-width="3"/>

  <!-- Shelf -->
  <rect x="100" y="430" width="350" height="12" fill="#8a6a4c" stroke="#2b1d14" stroke-width="3"/>

  <!-- Kit box -->
  <rect x="200" y="330" width="150" height="100" fill="#e8dcc0" stroke="#2b1d14" stroke-width="3"/>
  <line x1="200" y1="352" x2="350" y2="352" stroke="#2b1d14" stroke-width="2"/>
  <rect x="255" y="370" width="40" height="22" fill="none" stroke="#2b1d14" stroke-width="2"/>

  <!-- Kite leaning out of the box -->
  <polygon points="380,170 425,250 380,330 335,250" fill="#ffffff" stroke="#2b1d14" stroke-width="3"/>
  <polygon points="380,170 335,250 380,250" fill="#3d6fb5"/>
  <polygon points="380,170 425,250 380,250" fill="#f2c94c"/>
  <polygon points="335,250 380,250 380,330" fill="#ffffff"/>
  <polygon points="425,250 380,250 380,330" fill="#3d6fb5"/>
  <polygon points="380,170 425,250 380,330 335,250" fill="none" stroke="#2b1d14" stroke-width="3"/>
  <line x1="380" y1="170" x2="380" y2="330" stroke="#2b1d14" stroke-width="2"/>
  <line x1="335" y1="250" x2="425" y2="250" stroke="#2b1d14" stroke-width="2"/>

  <!-- Tail with bows and whistle -->
  <path d="M380 330 Q360 360 372 385 Q384 410 366 425" fill="none" stroke="#2b1d14" stroke-width="2.5"/>
  <polygon points="366,398 378,392 378,404" fill="#f2c94c" stroke="#2b1d14" stroke-width="1.5"/>
  <polygon points="362,412 374,418 374,406" fill="#3d6fb5" stroke="#2b1d14" stroke-width="1.5"/>
  <circle cx="372" cy="385" r="8" fill="#ffffff" stroke="#2b1d14" stroke-width="2.5"/>

  <!-- Price tag: 4 coins -->
  <line x1="215" y1="330" x2="182" y2="302" stroke="#2b1d14" stroke-width="1.5"/>
  <rect x="140" y="285" width="78" height="34" fill="#fff8e0" stroke="#2b1d14" stroke-width="2"/>
  <circle cx="152" cy="302" r="4" fill="#2b1d14"/>
  <text x="162" y="308" font-family="serif" font-size="15" fill="#2b1d14">4 coins</text>

  <!-- Door -->
  <rect x="520" y="300" width="110" height="240" fill="#5a3d2b" stroke="#2b1d14" stroke-width="4"/>
  <rect x="535" y="318" width="80" height="90" fill="none" stroke="#2b1d14" stroke-width="2"/>
  <rect x="535" y="422" width="80" height="100" fill="none" stroke="#2b1d14" stroke-width="2"/>
  <circle cx="612" cy="400" r="5" fill="#d9b44a" stroke="#2b1d14" stroke-width="1.5"/>

  <!-- Price card pinned beside door -->
  <g transform="rotate(-2 715 300)">
    <path d="M655 215 L775 215 L775 415 L655 415 Z" fill="#f6f0df" stroke="#2b1d14" stroke-width="2"/>
    <path d="M775 395 L775 415 L755 415 Z" fill="#e2d8bd" stroke="#2b1d14" stroke-width="1"/>
    <circle cx="662" cy="222" r="3" fill="#7a7266"/>
    <circle cx="768" cy="222" r="3" fill="#7a7266"/>
    <g font-family="serif" font-size="10" fill="#2b1d14">
      <text x="668" y="240" font-size="13" font-weight="bold">KITES</text>
      <text x="668" y="262">Small diamond 2.50</text>
      <text x="668" y="278">Box kite 6.00</text>
      <text x="668" y="294">Fighter kite 4.25</text>
      <text x="668" y="310">Repairs 1.00</text>
      <text x="668" y="336">Please ask for</text>
      <text x="668" y="350">paper colours</text>
    </g>
  </g>

  <!-- Fog banks -->
  <g fill="#ffffff" opacity="0.45">
    <ellipse cx="200" cy="580" rx="260" ry="26"/>
    <ellipse cx="600" cy="520" rx="240" ry="30"/>
    <ellipse cx="400" cy="680" rx="380" ry="34"/>
    <ellipse cx="120" cy="760" rx="220" ry="28"/>
  </g>
  <g fill="#ffffff" opacity="0.3">
    <ellipse cx="500" cy="150" rx="300" ry="40"/>
    <ellipse cx="100" cy="90" rx="260" ry="34"/>
  </g>

  <!-- Signature -->
  <text x="752" y="784" font-family="serif" font-size="20" fill="#2b1d14">P.</text>
</svg>