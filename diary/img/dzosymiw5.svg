  <ellipse cx="470" cy="526" rx="16" ry="6" fill="#6f8f5c" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="500" cy="530" rx="14" ry="5" fill="#7d9c68" stroke="#222" stroke-width="1.5"/>

