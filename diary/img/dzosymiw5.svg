  <line x1="492" y1="446" x2="492" y2="472" stroke="#b9a25a" stroke-width="2"/>
  <text x="452" y="466" font-family="serif" font-size="13" text-anchor="middle" fill="#2a2a2a">Welcome to Mossbrook</text>
