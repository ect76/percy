<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- sky and fog -->
  <rect x="0" y="0" width="800" height="800" fill="#e6ebef"/>
  <rect x="0" y="0" width="800" height="300" fill="#f3f6f8"/>
  <ellipse cx="400" cy="230" rx="330" ry="34" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="300" cy="150" rx="260" ry="22" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="560" cy="300" rx="280" ry="26" fill="#ffffff" opacity="0.55"/>

  <!-- distant rooftops in fog -->
  <rect x="280" y="250" width="70" height="110" fill="#cfd7dd" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="450" y="265" width="80" height="95" fill="#cfd7dd" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- snowy ground -->
  <polygon points="0,560 800,560 800,800 0,800" fill="#fbfdff"/>
  <!-- lane -->
  <polygon points="160,800 370,330 430,330 640,800" fill="#fbfdff" stroke="#2b2b2b" stroke-width="3"/>
  <!-- lane edge walls in snow -->
  <polyline points="160,800 370,330" fill="none" stroke="#2b2b2b" stroke-width="2"/>
  <polyline points="640,800 430,330" fill="none" stroke="#2b2b2b" stroke-width="2"/>

  <!-- cobbles -->
  <g fill="none" stroke="#7d8891" stroke-width="2">
    <ellipse cx="300" cy="350" rx="6" ry="3"/>
    <ellipse cx="380" cy="352" rx="5" ry="2.5"/>
    <ellipse cx="350" cy="380" rx="8" ry="4"/>
    <ellipse cx="420" cy="385" rx="7" ry="3.5"/>
    <ellipse cx="290" cy="420" rx="11" ry="5"/>
    <ellipse cx="440" cy="425" rx="10" ry="5"/>
    <ellipse cx="250" cy="500" rx="16" ry="7"/>
    <ellipse cx="500" cy="510" rx="15" ry="7"/>
    <ellipse cx="330" cy="560" rx="22" ry="9"/>
    <ellipse cx="480" cy="575" rx="20" ry="8"/>
    <ellipse cx="190" cy="660" rx="30" ry="12"/>
    <ellipse cx="590" cy="690" rx="28" ry="11"/>
    <ellipse cx="380" cy="720" rx="34" ry="13"/>
  </g>

  <!-- bell tower at end of lane -->
  <rect x="370" y="190" width="60" height="150" fill="#9a8775" stroke="#2b2b2b" stroke-width="2.5"/>
  <polygon points="366,190 400,118 434,190" fill="#4f4a52" stroke="#2b2b2b" stroke-width="2.5"/>
  <rect x="385" y="168" width="30" height="16" fill="#2b2b2b"/>
  <!-- belfry opening -->
  <rect x="385" y="158" width="30" height="0" fill="none"/>

  <!-- clock face -->
  <circle cx="400" cy="250" r="30" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
  <line x1="400" y1="250" x2="400" y2="230" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="400" y1="250" x2="417" y2="258" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="400" cy="250" r="2.5" fill="#1a1a1a"/>

  <!-- case plate and pendulum door -->
  <rect x="374" y="284" width="52" height="22" fill="#4a2e1e" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="400" y="292" font-size="5" fill="#f3e6cf" text-anchor="middle" textLength="46" lengthAdjust="spacingAndGlyphs">HATTERSLEY CLOCKS</text>
  <text x="400" y="301" font-size="5" fill="#f3e6cf" text-anchor="middle" textLength="30" lengthAdjust="spacingAndGlyphs">MOSSBROOK</text>
  <rect x="388" y="310" width="24" height="26" fill="#3a2418" stroke="#2b2b2b" stroke-width="1.5"/>
  <line x1="400" y1="312" x2="400" y2="334" stroke="#c9a53b" stroke-width="1.5"/>
  <circle cx="400" cy="336" r="4" fill="#d4af37" stroke="#2b2b2b" stroke-width="1"/>

  <!-- left cottage -->
  <rect x="0" y="330" width="150" height="330" fill="#c9a98a" stroke="#2b2b2b" stroke-width="3"/>
  <polygon points="-10,330 75,250 160,330" fill="#6b5a57" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="20" y="400" width="26" height="22" fill="#e8eef2" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="100" y="400" width="26" height="22" fill="#e8eef2" stroke="#2b2b2b" stroke-width="2"/>
  <!-- doorway -->
  <rect x="50" y="480" width="70" height="200" fill="#5a3d2b" stroke="#2b2b2b" stroke-width="3"/>
  <circle cx="108" cy="585" r="4" fill="#d4af37" stroke="#2b2b2b" stroke-width="1"/>
  <!-- doorstep -->
  <rect x="30" y="680" width="110" height="22" fill="#fbfdff" stroke="#2b2b2b" stroke-width="2.5"/>
  <rect x="20" y="702" width="130" height="14" fill="#e3e9ee" stroke="#2b2b2b" stroke-width="2"/>
  <!-- snow on roof -->
  <path d="M-10,330 L75,250 L160,330 Z" fill="none"/>
  <path d="M30,318 Q75,290 120,318" fill="none" stroke="#fbfdff" stroke-width="6" stroke-linecap="round"/>

  <!-- right wall -->
  <rect x="650" y="390" width="150" height="270" fill="#b7c2c9" stroke="#2b2b2b" stroke-width="3"/>
  <path d="M650,390 Q725,372 800,390" fill="none" stroke="#fbfdff" stroke-width="8"/>
  <path d="M650,460 L800,460 M650,530 L800,530" stroke="#8c99a3" stroke-width="2"/>

  <!-- foreground fog -->
  <ellipse cx="400" cy="770" rx="420" ry="40" fill="#ffffff" opacity="0.5"/>

  <!-- signature -->
  <text x="772" y="784" font-size="16" fill="#2b2b2b" text-anchor="end">P.</text>
</svg>