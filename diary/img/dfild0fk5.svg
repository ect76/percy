<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>
  <!-- sky -->
  <rect x="0" y="0" width="800" height="430" fill="#d9dfe0"/>
  <!-- distant rooftops in fog -->
  <path d="M0 360 L60 318 L120 360 L120 420 L0 420 Z" fill="#b9c2c4" opacity="0.8"/>
  <path d="M640 330 L710 290 L800 340 L800 420 L640 420 Z" fill="#b9c2c4" opacity="0.8"/>

  <!-- bell tower, dissolving into fog -->
  <g>
    <rect x="382" y="170" width="56" height="250" fill="#8a7f70" stroke="#2b2521" stroke-width="3"/>
    <path d="M374 170 L410 110 L446 170 Z" fill="#6b6257" stroke="#2b2521" stroke-width="3"/>
    <line x1="410" y1="110" x2="410" y2="82" stroke="#2b2521" stroke-width="3"/>
    <rect x="390" y="200" width="40" height="24" fill="#3b342d"/>
    <!-- clock face, cracked -->
    <circle cx="410" cy="250" r="22" fill="#e9e4d6" stroke="#2b2521" stroke-width="3"/>
    <line x1="410" y1="250" x2="418" y2="236" stroke="#2b2521" stroke-width="3" stroke-linecap="round"/>
    <line x1="410" y1="250" x2="398" y2="252" stroke="#2b2521" stroke-width="2" stroke-linecap="round"/>
    <path d="M400 232 L406 242 L402 248 L412 258" fill="none" stroke="#2b2521" stroke-width="1.5"/>
    <!-- louvres -->
    <line x1="392" y1="300" x2="428" y2="300" stroke="#2b2521" stroke-width="2"/>
    <line x1="392" y1="314" x2="428" y2="314" stroke="#2b2521" stroke-width="2"/>
    <line x1="392" y1="328" x2="428" y2="328" stroke="#2b2521" stroke-width="2"/>
  </g>

  <!-- left cottage -->
  <g stroke="#2b2521" stroke-width="3">
    <rect x="40" y="340" width="290" height="270" fill="#c9b49a"/>
    <path d="M30 345 L185 265 L340 345 Z" fill="#6e5a4a"/>
    <rect x="62" y="390" width="78" height="66" fill="#f6e7a8"/>
    <line x1="101" y1="390" x2="101" y2="456" stroke-width="2"/>
    <line x1="62" y1="423" x2="140" y2="423" stroke-width="2"/>
    <rect x="200" y="420" width="62" height="190" fill="#7a5b44"/>
    <circle cx="250" cy="515" r="3" fill="#2b2521"/>
  </g>
  <!-- pinned calendar by the door -->
  <g>
    <rect x="270" y="400" width="48" height="58" fill="#fbfaf4" stroke="#2b2521" stroke-width="2" transform="rotate(3 294 429)"/>
    <rect x="272" y="402" width="44" height="18" fill="#7fa2a8" transform="rotate(3 294 429)"/>
    <path d="M276 424 L284 416 L290 422 L300 412 L312 426 L276 426 Z" fill="#8c7a66" transform="rotate(3 294 429)"/>
    <circle cx="276" cy="403" r="2" fill="#2b2521"/>
    <text x="294" y="470" font-size="5" text-anchor="middle" fill="#2b2521" transform="rotate(3 294 429)">MOSSBROOK VILLAGE HALL - Monthly Notices</text>
  </g>

  <!-- right wall with crooked sign -->
  <rect x="500" y="330" width="300" height="290" fill="#d8c8ae" stroke="#2b2521" stroke-width="3"/>
  <line x1="500" y1="470" x2="800" y2="470" stroke="#2b2521" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="540" x2="800" y2="540" stroke="#2b2521" stroke-width="2" opacity="0.5"/>
  <line x1="540" y1="330" x2="540" y2="620" stroke="#2b2521" stroke-width="1.5" opacity="0.3"/>
  <!-- bracket -->
  <path d="M520 380 L600 380 L600 392" fill="none" stroke="#2b2521" stroke-width="4"/>
  <!-- crooked sign -->
  <g transform="rotate(-7 580 430)">
    <rect x="530" y="395" width="110" height="52" fill="#3f5e57" stroke="#2b2521" stroke-width="3"/>
    <text x="585" y="427" font-size="17" text-anchor="middle" fill="#f3ecdc">CRUMB'S</text>
    <text x="585" y="441" font-size="9" text-anchor="middle" fill="#f3ecdc">BAKERY</text>
    <line x1="545" y1="447" x2="545" y2="456" stroke="#2b2521" stroke-width="2"/>
    <line x1="625" y1="447" x2="625" y2="456" stroke="#2b2521" stroke-width="2"/>
  </g>
  <!-- lamp-less window on right wall -->
  <rect x="640" y="520" width="90" height="70" fill="#a9b8b6" stroke="#2b2521" stroke-width="3"/>
  <line x1="685" y1="520" x2="685" y2="590" stroke="#2b2521" stroke-width="2"/>

  <!-- lane: cobbled perspective toward the fog -->
  <path d="M0 800 L800 800 L520 470 L280 470 Z" fill="#b8ab98" stroke="#2b2521" stroke-width="3"/>
  <g fill="none" stroke="#2b2521" stroke-width="1.5" opacity="0.6">
    <ellipse cx="120" cy="760" rx="26" ry="12"/>
    <ellipse cx="260" cy="745" rx="22" ry="10"/>
    <ellipse cx="420" cy="750" rx="24" ry="11"/>
    <ellipse cx="580" cy="765" rx="28" ry="13"/>
    <ellipse cx="700" cy="735" rx="20" ry="9"/>
    <ellipse cx="200" cy="700" rx="18" ry="8"/>
    <ellipse cx="340" cy="690" rx="16" ry="7"/>
    <ellipse cx="480" cy="700" rx="18" ry="8"/>
    <ellipse cx="620" cy="690" rx="15" ry="7"/>
    <ellipse cx="310" cy="630" rx="12" ry="5"/>
    <ellipse cx="410" cy="625" rx="11" ry="5"/>
    <ellipse cx="500" cy="630" rx="12" ry="5"/>
    <ellipse cx="365" cy="570" rx="8" ry="3.5"/>
    <ellipse cx="440" cy="565" rx="8" ry="3.5"/>
  </g>
  <!-- puddles reflecting the lamplight -->
  <ellipse cx="150" cy="715" rx="60" ry="12" fill="#9fb6b8" stroke="#2b2521" stroke-width="2"/>
  <ellipse cx="610" cy="650" rx="50" ry="9" fill="#9fb6b8" stroke="#2b2521" stroke-width="2"/>
  <line x1="130" y1="715" x2="170" y2="715" stroke="#f3ecdc" stroke-width="2"/>

  <!-- fog bands -->
  <rect x="0" y="420" width="800" height="60" fill="#eef0ec" opacity="0.7"/>
  <rect x="0" y="330" width="800" height="50" fill="#eef0ec" opacity="0.55"/>
  <rect x="0" y="230" width="800" height="70" fill="#eef0ec" opacity="0.45"/>
  <rect x="0" y="480" width="800" height="40" fill="#eef0ec" opacity="0.35"/>
  <ellipse cx="400" cy="300" rx="260" ry="30" fill="#f7f8f5" opacity="0.5"/>
  <ellipse cx="150" cy="620" rx="200" ry="22" fill="#f7f8f5" opacity="0.3"/>

  <!-- signature -->
  <text x="752" y="780" font-size="22" fill="#2b2521" font-family="serif">P.</text>
</svg>