<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cob" width="40" height="28" patternUnits="userSpaceOnUse">
      <rect width="40" height="28" fill="#b9b1a2"/>
      <ellipse cx="10" cy="8" rx="8" ry="5" fill="#a39b8c" stroke="#2a2420" stroke-width="1.2"/>
      <ellipse cx="30" cy="8" rx="8" ry="5" fill="#c4bcad" stroke="#2a2420" stroke-width="1.2"/>
      <ellipse cx="0" cy="22" rx="7" ry="4.5" fill="#c4bcad" stroke="#2a2420" stroke-width="1.2"/>
      <ellipse cx="20" cy="22" rx="8" ry="5" fill="#a39b8c" stroke="#2a2420" stroke-width="1.2"/>
      <ellipse cx="40" cy="22" rx="7" ry="4.5" fill="#a39b8c" stroke="#2a2420" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#efe6d2"/>

  <!-- café wall -->
  <rect x="60" y="110" width="440" height="430" fill="#d9a86c" stroke="#2a2420" stroke-width="3"/>
  <!-- awning -->
  <rect x="50" y="88" width="460" height="26" fill="#7a3b2e" stroke="#2a2420" stroke-width="3"/>
  <path d="M60 114 L500 114" stroke="#2a2420" stroke-width="2"/>

  <!-- clock, crooked on its nail -->
  <g transform="translate(200 220) rotate(-9)">
    <line x1="0" y1="-98" x2="0" y2="-74" stroke="#2a2420" stroke-width="3"/>
    <circle cx="0" cy="0" r="60" fill="#6b4a2b" stroke="#2a2420" stroke-width="3"/>
    <circle cx="0" cy="0" r="46" fill="#fbf8ef" stroke="#2a2420" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="8" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#111"/>
  </g>

  <!-- chalkboard in pine frame -->
  <rect x="288" y="296" width="220" height="186" fill="#d8b57a" stroke="#2a2420" stroke-width="3"/>
  <rect x="300" y="308" width="196" height="162" fill="#2b3030"/>
  <path d="M300 320 L330 308 M440 470 L470 470 L496 448" stroke="#f2f0e6" stroke-width="2" opacity="0.15"/>
  <g fill="#f2f0e6" font-family="serif" font-size="11">
    <text x="312" y="332">THE LANTERN CAFÉ — MOSSBROOK</text>
    <text x="312" y="358">Flat White 2.80</text>
    <text x="312" y="377">Espresso 2.20</text>
    <text x="312" y="396">Apple &amp; Cinnamon Cake 3.50</text>
    <text x="312" y="415">Toast &amp; Butter 1.90</text>
    <text x="312" y="442">Today: Leek Soup</text>
  </g>

  <!-- counter -->
  <rect x="60" y="490" width="440" height="40" fill="#5a3a22" stroke="#2a2420" stroke-width="3"/>
  <rect x="60" y="490" width="440" height="8" fill="#7a5233"/>
  <!-- order pad -->
  <rect x="110" y="466" width="100" height="24" fill="#fbf8ef" stroke="#2a2420" stroke-width="2"/>
  <g font-family="serif" font-size="7" fill="#2a2420">
    <text x="114" y="476">Table ___ Qty ___</text>
    <text x="114" y="486">Item ___</text>
  </g>

  <!-- ground -->
  <rect x="0" y="530" width="800" height="270" fill="url(#cob)"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#2a2420" stroke-width="2"/>

  <!-- seated figure: chair back -->
  <rect x="540" y="392" width="8" height="170" fill="#5a3a22" stroke="#2a2420" stroke-width="2"/>
  <!-- chair seat and legs -->
  <rect x="540" y="540" width="70" height="8" fill="#7a5233" stroke="#2a2420" stroke-width="2"/>
  <line x1="545" y1="548" x2="540" y2="600" stroke="#2a2420" stroke-width="4"/>
  <line x1="600" y1="548" x2="606" y2="600" stroke="#2a2420" stroke-width="4"/>

  <!-- legs -->
  <line x1="570" y1="536" x2="584" y2="600" stroke="#2a2420" stroke-width="9" stroke-linecap="round"/>
  <line x1="600" y1="536" x2="616" y2="600" stroke="#2a2420" stroke-width="9" stroke-linecap="round"/>
  <!-- coat -->
  <polygon points="566,432 636,432 650,540 552,540" fill="#4f6b7a" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>
  <!-- arm resting on table -->
  <path d="M632 446 Q668 470 676 512" fill="none" stroke="#2a2420" stroke-width="9" stroke-linecap="round"/>
  <path d="M632 446 Q668 470 676 512" fill="none" stroke="#4f6b7a" stroke-width="5" stroke-linecap="round"/>
  <!-- head and hat -->
  <circle cx="601" cy="404" r="25" fill="#e8c4a0" stroke="#2a2420" stroke-width="3"/>
  <path d="M570 388 Q601 360 634 388 Z" fill="#3b3f4a" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>
  <rect x="566" y="384" width="70" height="8" rx="4" fill="#3b3f4a" stroke="#2a2420" stroke-width="2"/>
  <circle cx="593" cy="406" r="2.5" fill="#2a2420"/>
  <circle cx="610" cy="406" r="2.5" fill="#2a2420"/>
  <path d="M594 418 Q601 423 609 418" fill="none" stroke="#2a2420" stroke-width="2"/>

  <!-- small table with cup -->
  <line x1="690" y1="524" x2="690" y2="580" stroke="#2a2420" stroke-width="5"/>
  <ellipse cx="690" cy="520" rx="42" ry="9" fill="#7a5233" stroke="#2a2420" stroke-width="3"/>
  <path d="M676 500 L704 500 L701 514 L679 514 Z" fill="#fbf8ef" stroke="#2a2420" stroke-width="2"/>

  <!-- fog bands -->
  <rect x="-20" y="520" width="840" height="46" rx="23" fill="#efe6d2" opacity="0.55"/>
  <rect x="-20" y="612" width="840" height="60" rx="30" fill="#efe6d2" opacity="0.65"/>
  <rect x="-20" y="700" width="840" height="50" rx="25" fill="#efe6d2" opacity="0.5"/>
  <rect x="-20" y="150" width="200" height="40" rx="20" fill="#efe6d2" opacity="0.4"/>

  <!-- signature -->
  <text x="752" y="778" font-family="serif" font-size="18" fill="#2a2420">P.</text>
</svg>