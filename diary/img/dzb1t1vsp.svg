<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>
  <!-- fog bands -->
  <rect x="0" y="60" width="800" height="90" fill="#d9d5ca" opacity="0.7"/>
  <rect x="0" y="210" width="800" height="50" fill="#e4e0d5" opacity="0.8"/>
  <rect x="0" y="650" width="800" height="70" fill="#d9d5ca" opacity="0.7"/>
  <!-- cabinet -->
  <rect x="180" y="120" width="440" height="290" fill="#8a6a4a" stroke="#2b2118" stroke-width="4"/>
  <rect x="180" y="104" width="440" height="20" fill="#6b4a2e" stroke="#2b2118" stroke-width="3"/>
  <!-- drawers row 1 -->
  <g stroke="#2b2118" stroke-width="3" fill="#3e2a1a">
    <rect x="196" y="140" width="96" height="48"/>
    <rect x="300" y="140" width="96" height="48"/>
    <rect x="404" y="140" width="96" height="48"/>
    <rect x="508" y="140" width="96" height="48"/>
    <!-- row 2 -->
    <rect x="196" y="198" width="96" height="48"/>
    <rect x="404" y="198" width="96" height="48"/>
    <rect x="508" y="198" width="96" height="48"/>
    <!-- row 3 -->
    <rect x="196" y="256" width="96" height="48"/>
    <rect x="300" y="256" width="96" height="48"/>
    <rect x="404" y="256" width="96" height="48"/>
    <rect x="508" y="256" width="96" height="48"/>
    <!-- row 4 -->
    <rect x="196" y="314" width="96" height="48"/>
    <rect x="300" y="314" width="96" height="48"/>
    <rect x="404" y="314" width="96" height="48"/>
    <rect x="508" y="314" width="96" height="48"/>
  </g>
  <!-- pulled-out drawer, slightly ajar -->
  <rect x="304" y="206" width="96" height="48" fill="#2b1d12" stroke="#2b2118" stroke-width="3"/>
  <rect x="300" y="198" width="96" height="48" fill="#3e2a1a" stroke="#2b2118" stroke-width="3"/>
  <!-- pulls -->
  <g fill="#c9b48a" stroke="#2b2118" stroke-width="1.5">
    <rect x="236" y="160" width="16" height="6" rx="2"/>
    <rect x="340" y="160" width="16" height="6" rx="2"/>
    <rect x="444" y="160" width="16" height="6" rx="2"/>
    <rect x="548" y="160" width="16" height="6" rx="2"/>
    <rect x="236" y="218" width="16" height="6" rx="2"/>
    <rect x="340" y="218" width="16" height="6" rx="2"/>
    <rect x="444" y="218" width="16" height="6" rx="2"/>
    <rect x="548" y="218" width="16" height="6" rx="2"/>
    <rect x="236" y="276" width="16" height="6" rx="2"/>
    <rect x="340" y="276" width="16" height="6" rx="2"/>
    <rect x="444" y="276" width="16" height="6" rx="2"/>
    <rect x="548" y="276" width="16" height="6" rx="2"/>
    <rect x="236" y="334" width="16" height="6" rx="2"/>
    <rect x="340" y="334" width="16" height="6" rx="2"/>
    <rect x="444" y="334" width="16" height="6" rx="2"/>
    <rect x="548" y="334" width="16" height="6" rx="2"/>
  </g>
  <!-- desk -->
  <rect x="120" y="470" width="560" height="60" fill="#6b4a2e" stroke="#2b2118" stroke-width="4"/>
  <rect x="140" y="530" width="520" height="170" fill="#55391f" stroke="#2b2118" stroke-width="4"/>
  <!-- ink pad -->
  <ellipse cx="260" cy="500" rx="62" ry="20" fill="#2b2118"/>
  <ellipse cx="260" cy="497" rx="50" ry="13" fill="#7a3b2e"/>
  <!-- date stamp -->
  <rect x="535" y="380" width="46" height="62" rx="12" fill="#3a2a1c" stroke="#2b2118" stroke-width="3"/>
  <rect x="505" y="440" width="106" height="28" rx="3" fill="#1f1812" stroke="#2b2118" stroke-width="3"/>
  <rect x="515" y="464" width="86" height="6" fill="#7a3b2e"/>
  <!-- cobbles -->
  <g fill="#b9b3a4" stroke="#8c867a" stroke-width="2">
    <ellipse cx="90" cy="750" rx="34" ry="12"/>
    <ellipse cx="170" cy="772" rx="30" ry="10"/>
    <ellipse cx="260" cy="752" rx="36" ry="11"/>
    <ellipse cx="350" cy="776" rx="32" ry="10"/>
    <ellipse cx="440" cy="754" rx="34" ry="12"/>
    <ellipse cx="530" cy="778" rx="30" ry="10"/>
    <ellipse cx="620" cy="752" rx="36" ry="11"/>
    <ellipse cx="710" cy="774" rx="30" ry="10"/>
  </g>
  <!-- signature P. -->
  <g fill="none" stroke="#2b2118" stroke-width="3" stroke-linecap="round">
    <path d="M748 760 V788"/>
    <path d="M748 760 H760 Q770 760 770 769 Q770 778 760 778 H748"/>
  </g>
  <circle cx="777" cy="788" r="2.5" fill="#2b2118"/>
</svg>