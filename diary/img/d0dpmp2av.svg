<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cobble" width="44" height="30" patternUnits="userSpaceOnUse">
      <rect width="44" height="30" fill="#b3ab9b"/>
      <ellipse cx="11" cy="8" rx="9" ry="6" fill="#c7c0b1" stroke="#3a3128" stroke-width="1.5"/>
      <ellipse cx="33" cy="8" rx="8" ry="5" fill="#a79f8f" stroke="#3a3128" stroke-width="1.5"/>
      <ellipse cx="22" cy="23" rx="10" ry="5.5" fill="#bdb5a5" stroke="#3a3128" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#efe8d8"/>

  <!-- distant faded houses -->
  <g fill="#8e8678" opacity="0.35" stroke="#3a3128" stroke-width="2">
    <rect x="260" y="330" width="70" height="120"/>
    <polygon points="255,332 295,300 335,332"/>
    <rect x="470" y="322" width="80" height="128"/>
    <polygon points="465,324 510,290 555,324"/>
    <rect x="130" y="355" width="60" height="95"/>
  </g>

  <!-- fog band behind figure -->
  <rect x="0" y="210" width="800" height="90" fill="#f6f2e6" opacity="0.7"/>

  <!-- lane -->
  <polygon points="0,800 800,800 470,500 330,500" fill="url(#cobble)" stroke="#3a3128" stroke-width="3"/>

  <!-- halo -->
  <ellipse cx="420" cy="300" rx="78" ry="82" fill="none" stroke="#f3d87a" stroke-width="9" opacity="0.75"/>

  <!-- pedestal -->
  <path d="M340,520 L500,520 L515,560 L325,560 Z" fill="#c9a227" stroke="#3a3128" stroke-width="3"/>
  <rect x="300" y="560" width="240" height="26" fill="#b08d1f" stroke="#3a3128" stroke-width="3"/>

  <!-- robe body -->
  <path d="M330,520 C318,430 350,350 420,340 C490,350 522,430 510,520 Z" fill="#e08a2c" stroke="#3a3128" stroke-width="3"/>
  <path d="M345,470 Q420,502 495,470" fill="none" stroke="#3a3128" stroke-width="2.5"/>
  <path d="M372,390 Q365,440 360,512" fill="none" stroke="#a75a18" stroke-width="2.5"/>
  <path d="M468,390 Q475,440 480,512" fill="none" stroke="#a75a18" stroke-width="2.5"/>

  <!-- hands in lap -->
  <ellipse cx="372" cy="430" rx="22" ry="14" fill="#e8c04e" stroke="#3a3128" stroke-width="2.5"/>
  <ellipse cx="468" cy="430" rx="22" ry="14" fill="#e8c04e" stroke="#3a3128" stroke-width="2.5"/>

  <!-- head -->
  <circle cx="420" cy="300" r="44" fill="#e8c04e" stroke="#3a3128" stroke-width="3"/>
  <circle cx="420" cy="254" r="9" fill="#e8c04e" stroke="#3a3128" stroke-width="2.5"/>
  <path d="M395,302 Q402,307 409,302" fill="none" stroke="#3a3128" stroke-width="2.5"/>
  <path d="M431,302 Q438,307 445,302" fill="none" stroke="#3a3128" stroke-width="2.5"/>
  <path d="M408,322 Q420,328 432,322" fill="none" stroke="#3a3128" stroke-width="2"/>

  <!-- fog over lower lane -->
  <rect x="0" y="480" width="800" height="50" fill="#f6f2e6" opacity="0.55"/>

  <!-- doorstep and doorway (foreground left) -->
  <rect x="0" y="60" width="150" height="600" fill="#d9cbb3" stroke="#3a3128" stroke-width="3"/>
  <rect x="30" y="170" width="95" height="170" fill="#7a5a3c" stroke="#3a3128" stroke-width="3"/>
  <circle cx="112" cy="260" r="4" fill="#e0c060" stroke="#3a3128" stroke-width="1.5"/>
  <rect x="0" y="660" width="240" height="28" fill="#7d7266" stroke="#3a3128" stroke-width="3"/>
  <rect x="0" y="688" width="240" height="30" fill="#625a50" stroke="#3a3128" stroke-width="3"/>

  <!-- Mossville post (right) -->
  <rect x="630" y="380" width="16" height="270" fill="#6b4a2e" stroke="#3a3128" stroke-width="3"/>
  <polygon points="575,332 638,302 700,332" fill="#8a6a46" stroke="#3a3128" stroke-width="3"/>
  <rect x="580" y="332" width="116" height="72" rx="10" fill="#f5efdc" stroke="#2e7d4f" stroke-width="8"/>
  <g fill="#3a3128">
    <rect x="598" y="352" width="80" height="5" rx="2"/>
    <rect x="606" y="368" width="64" height="5" rx="2"/>
    <rect x="602" y="384" width="72" height="5" rx="2"/>
  </g>
  <path d="M600,404 L600,440 M680,404 L680,440" stroke="#c8a24a" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  <g fill="#6f9a4e" stroke="#3a3128" stroke-width="1.5" opacity="0.85">
    <ellipse cx="632" cy="640" rx="18" ry="9"/>
    <ellipse cx="650" cy="628" rx="12" ry="6"/>
    <ellipse cx="624" cy="600" rx="10" ry="5"/>
  </g>

  <!-- foreground fog -->
  <rect x="0" y="560" width="800" height="60" fill="#f6f2e6" opacity="0.35"/>

  <!-- signature "P." in corner -->
  <g fill="none" stroke="#3a3128" stroke-width="3" stroke-linecap="round">
    <path d="M744,784 V758 H756 Q766,758 766,768 Q766,778 756,778 H744"/>
  </g>
  <circle cx="774" cy="784" r="2.5" fill="#3a3128"/>
</svg>