<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cobbles" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect width="60" height="40" fill="#8e9196"/>
      <ellipse cx="15" cy="10" rx="13" ry="8" fill="#a7abb0" stroke="#2a2a2a" stroke-width="2"/>
      <ellipse cx="45" cy="10" rx="13" ry="8" fill="#9a9ea3" stroke="#2a2a2a" stroke-width="2"/>
      <ellipse cx="0" cy="30" rx="13" ry="8" fill="#9a9ea3" stroke="#2a2a2a" stroke-width="2"/>
      <ellipse cx="30" cy="30" rx="13" ry="8" fill="#a7abb0" stroke="#2a2a2a" stroke-width="2"/>
      <ellipse cx="60" cy="30" rx="13" ry="8" fill="#a7abb0" stroke="#2a2a2a" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#f4efe4"/>

  <!-- distant village in fog -->
  <g fill="#c3ccd2" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round">
    <rect x="60" y="380" width="90" height="120"/>
    <polygon points="55,380 105,335 155,380"/>
    <rect x="180" y="400" width="70" height="100"/>
    <polygon points="175,400 215,365 255,400"/>
    <rect x="560" y="390" width="95" height="110"/>
    <polygon points="555,390 607,345 660,390"/>
    <rect x="675" y="410" width="70" height="90"/>
    <polygon points="670,410 710,378 750,410"/>
  </g>
  <g fill="#e6e9eb" stroke="#2a2a2a" stroke-width="1.5">
    <rect x="85" y="410" width="18" height="24"/>
    <rect x="120" y="410" width="18" height="24"/>
    <rect x="205" y="425" width="18" height="24"/>
    <rect x="590" y="415" width="18" height="24"/>
    <rect x="625" y="415" width="18" height="24"/>
  </g>

  <!-- fog bands -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="200" cy="450" rx="240" ry="34"/>
    <ellipse cx="620" cy="470" rx="260" ry="30"/>
    <ellipse cx="400" cy="320" rx="330" ry="26"/>
  </g>

  <!-- cobbled ground -->
  <rect x="0" y="560" width="800" height="240" fill="url(#cobbles)"/>
  <rect x="0" y="560" width="800" height="240" fill="#ffffff" opacity="0.18"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#2a2a2a" stroke-width="3"/>

  <!-- wooden table edge -->
  <rect x="120" y="545" width="560" height="22" fill="#9b6b43" stroke="#2a2a2a" stroke-width="3"/>
  <g stroke="#2a2a2a" stroke-width="1.5" fill="none">
    <line x1="170" y1="550" x2="250" y2="550"/>
    <line x1="420" y1="552" x2="560" y2="552"/>
  </g>

  <!-- jar, tilted -->
  <g transform="rotate(-15 400 470)">
    <!-- glass body -->
    <path d="M300 385 Q300 370 320 370 L480 370 Q500 370 500 385 L500 545 Q500 575 470 575 L330 575 Q300 575 300 545 Z"
          fill="#d6ebf2" fill-opacity="0.85" stroke="#2a2a2a" stroke-width="3"/>
    <!-- water -->
    <path d="M302 520 L498 520 L498 545 Q498 573 470 573 L330 573 Q302 573 302 545 Z" fill="#8cc3d8"/>
    <!-- seeds at bottom -->
    <g fill="#8b5e34" stroke="#2a2a2a" stroke-width="1.5">
      <ellipse cx="330" cy="552" rx="7" ry="5"/>
      <ellipse cx="352" cy="560" rx="7" ry="5"/>
      <ellipse cx="380" cy="554" rx="7" ry="5"/>
      <ellipse cx="410" cy="562" rx="7" ry="5"/>
      <ellipse cx="438" cy="555" rx="7" ry="5"/>
      <ellipse cx="462" cy="561" rx="7" ry="5"/>
    </g>
    <!-- sprouts -->
    <g stroke="#3f7d3a" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M340 552 Q336 500 345 462"/>
      <path d="M372 556 Q380 510 368 470"/>
      <path d="M404 556 Q398 505 412 455"/>
      <path d="M440 552 Q446 512 436 478"/>
      <path d="M465 558 Q470 520 462 488"/>
    </g>
    <g fill="#7fbf6a" stroke="#2a2a2a" stroke-width="2">
      <ellipse cx="333" cy="462" rx="12" ry="7" transform="rotate(-30 333 462)"/>
      <ellipse cx="357" cy="462" rx="12" ry="7" transform="rotate(30 357 462)"/>
      <ellipse cx="362" cy="470" rx="11" ry="6" transform="rotate(-25 362 470)"/>
      <ellipse cx="418" cy="455" rx="12" ry="7" transform="rotate(-30 418 455)"/>
      <ellipse cx="428" cy="478" rx="11" ry="6" transform="rotate(25 428 478)"/>
      <ellipse cx="456" cy="488" rx="10" ry="6" transform="rotate(-20 456 488)"/>
    </g>
    <!-- glass highlight -->
    <path d="M318 395 L318 520" stroke="#ffffff" stroke-width="8" opacity="0.6" stroke-linecap="round"/>
    <!-- mesh cloth and ring at mouth -->
    <path d="M296 352 Q400 332 504 352 L504 372 Q400 352 296 372 Z" fill="#e9e2cf" stroke="#2a2a2a" stroke-width="2.5"/>
    <g stroke="#2a2a2a" stroke-width="1" opacity="0.6">
      <line x1="320" y1="342" x2="320" y2="366"/>
      <line x1="345" y1="339" x2="345" y2="364"/>
      <line x1="370" y1="337" x2="370" y2="362"/>
      <line x1="400" y1="336" x2="400" y2="360"/>
      <line x1="430" y1="337" x2="430" y2="362"/>
      <line x1="455" y1="339" x2="455" y2="364"/>
      <line x1="480" y1="342" x2="480" y2="366"/>
    </g>
    <rect x="292" y="368" width="216" height="10" rx="4" fill="#b8bcc0" stroke="#2a2a2a" stroke-width="2.5"/>
  </g>

  <!-- loose seeds and droplets on the table -->
  <g fill="#8b5e34" stroke="#2a2a2a" stroke-width="1.5">
    <ellipse cx="180" cy="600" rx="8" ry="5" transform="rotate(20 180 600)"/>
    <ellipse cx="200" cy="622" rx="8" ry="5" transform="rotate(-15 200 622)"/>
    <ellipse cx="620" cy="610" rx="8" ry="5" transform="rotate(10 620 610)"/>
    <ellipse cx="640" cy="636" rx="8" ry="5" transform="rotate(-30 640 636)"/>
  </g>
  <path d="M250 640 Q244 652 250 658 Q256 652 250 640 Z" fill="#8cc3d8" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M560 648 Q554 660 560 666 Q566 660 560 648 Z" fill="#8cc3d8" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- small P. signature, bottom right -->
  <g fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round">
    <path d="M740 728 V770 M740 728 H756 Q768 728 768 740 Q768 752 756 752 H740"/>
  </g>
  <circle cx="780" cy="768" r="3" fill="#2a2a2a"/>
</svg>