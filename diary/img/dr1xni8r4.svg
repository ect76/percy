<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>The Allotments Gate by P.</title>
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4eee0"/>
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="#3b3a36" stroke-width="2"/>

  <!-- distant fog banks -->
  <g fill="#d9d6cc" opacity="0.7">
    <ellipse cx="200" cy="200" rx="260" ry="34"/>
    <ellipse cx="620" cy="160" rx="230" ry="28"/>
    <ellipse cx="420" cy="250" rx="300" ry="26"/>
  </g>
  <g fill="#e8e4d8" opacity="0.8">
    <ellipse cx="120" cy="300" rx="200" ry="22"/>
    <ellipse cx="700" cy="310" rx="180" ry="24"/>
  </g>

  <!-- far hedge line, half lost in fog -->
  <path d="M40 430 Q120 410 200 428 T380 424 T560 420 T760 426" fill="none" stroke="#8c9a86" stroke-width="10" opacity="0.5"/>

  <!-- ground -->
  <rect x="20" y="580" width="760" height="200" fill="#e3dccb"/>
  <g fill="none" stroke="#7d766a" stroke-width="2">
    <ellipse cx="90" cy="610" rx="28" ry="10"/><ellipse cx="170" cy="606" rx="30" ry="10"/>
    <ellipse cx="260" cy="612" rx="28" ry="10"/><ellipse cx="350" cy="608" rx="30" ry="10"/>
    <ellipse cx="470" cy="610" rx="28" ry="10"/><ellipse cx="560" cy="606" rx="30" ry="10"/>
    <ellipse cx="660" cy="612" rx="28" ry="10"/><ellipse cx="730" cy="606" rx="26" ry="10"/>
    <ellipse cx="60" cy="660" rx="30" ry="11"/><ellipse cx="150" cy="668" rx="32" ry="11"/>
    <ellipse cx="240" cy="656" rx="30" ry="11"/><ellipse cx="330" cy="672" rx="32" ry="11"/>
    <ellipse cx="430" cy="660" rx="30" ry="11"/><ellipse cx="520" cy="668" rx="32" ry="11"/>
    <ellipse cx="620" cy="656" rx="30" ry="11"/><ellipse cx="710" cy="670" rx="32" ry="11"/>
    <ellipse cx="120" cy="720" rx="34" ry="12"/><ellipse cx="300" cy="730" rx="34" ry="12"/>
    <ellipse cx="500" cy="724" rx="34" ry="12"/><ellipse cx="680" cy="732" rx="34" ry="12"/>
  </g>

  <!-- fence to the left, fading into fog -->
  <g fill="#b9b1a0" stroke="#3b3a36" stroke-width="2" opacity="0.8">
    <rect x="40" y="380" width="8" height="200"/>
    <rect x="110" y="380" width="8" height="200"/>
    <rect x="180" y="380" width="8" height="200"/>
    <rect x="46" y="410" width="150" height="10"/>
    <rect x="46" y="470" width="150" height="10"/>
  </g>

  <!-- fence to the right -->
  <g fill="#b9b1a0" stroke="#3b3a36" stroke-width="2" opacity="0.85">
    <rect x="520" y="400" width="8" height="190"/>
    <rect x="600" y="400" width="8" height="190"/>
    <rect x="680" y="400" width="8" height="190"/>
    <rect x="526" y="430" width="160" height="10"/>
    <rect x="526" y="490" width="160" height="10"/>
  </g>

  <!-- rain barrel in far corner -->
  <g>
    <rect x="590" y="400" width="92" height="150" rx="8" fill="#6f8aa0" stroke="#2c2b28" stroke-width="3"/>
    <rect x="590" y="425" width="92" height="6" fill="#4b5e6e"/>
    <rect x="590" y="480" width="92" height="6" fill="#4b5e6e"/>
    <rect x="590" y="530" width="92" height="6" fill="#4b5e6e"/>
    <ellipse cx="636" cy="394" rx="54" ry="12" fill="#8c6a4a" stroke="#2c2b28" stroke-width="3"/>
    <path d="M610 390 L620 398 L614 404 L626 412 L622 418" fill="none" stroke="#2c2b28" stroke-width="2.5"/>
    <path d="M598 340 Q636 332 672 340" fill="none" stroke="#9a9a9a" stroke-width="0"/>
    <!-- tap beside barrel -->
    <rect x="688" y="470" width="20" height="12" fill="#7a7a7a" stroke="#2c2b28" stroke-width="2"/>
    <rect x="700" y="466" width="10" height="26" fill="#7a7a7a" stroke="#2c2b28" stroke-width="2"/>
    <path d="M700 520 L700 540 L712 540" fill="none" stroke="#7a7a7a" stroke-width="4"/>
  </g>

  <!-- gate -->
  <g stroke="#2c2b28" stroke-width="3">
    <!-- left post -->
    <rect x="222" y="300" width="22" height="280" fill="#8a7158"/>
    <!-- right post -->
    <rect x="398" y="300" width="22" height="280" fill="#8a7158"/>
    <polygon points="222,300 233,286 244,300" fill="#6a5440"/>
    <polygon points="398,300 409,286 420,300" fill="#6a5440"/>
    <!-- gate leaf -->
    <rect x="244" y="350" width="154" height="220" fill="#a58b6a"/>
    <line x1="265" y1="350" x2="265" y2="570" stroke-width="5"/>
    <line x1="296" y1="350" x2="296" y2="570" stroke-width="5"/>
    <line x1="327" y1="350" x2="327" y2="570" stroke-width="5"/>
    <line x1="358" y1="350" x2="358" y2="570" stroke-width="5"/>
    <line x1="252" y1="356" x2="390" y2="564" stroke-width="4"/>
    <rect x="244" y="380" width="154" height="10" fill="#6a5440"/>
    <rect x="244" y="535" width="154" height="10" fill="#6a5440"/>
  </g>

  <!-- loose iron loop latch, hanging slightly askew -->
  <g stroke="#2c2b28" stroke-width="3" fill="none">
    <rect x="382" y="438" width="22" height="8" fill="#5b5b5b"/>
    <path d="M390 446 L390 456 M386 452 L394 452" stroke-width="0"/>
    <ellipse cx="410" cy="470" rx="16" ry="20" transform="rotate(-14 410 470)" stroke="#4a4a4a" stroke-width="6"/>
    <circle cx="392" cy="442" r="4" fill="#4a4a4a"/>
  </g>

  <!-- KEEP GATE SHUT sign nailed to right post -->
  <g transform="rotate(-4 470 330)">
    <rect x="426" y="308" width="122" height="46" fill="#f7f3e6" stroke="#2c2b28" stroke-width="3"/>
    <text x="487" y="329" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8b1e1e">KEEP GATE</text>
    <text x="487" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8b1e1e">SHUT</text>
    <circle cx="434" cy="316" r="3" fill="#2c2b28"/>
    <circle cx="540" cy="346" r="3" fill="#2c2b28"/>
  </g>

  <!-- foreground fog wash -->
  <g fill="#f4eee0" opacity="0.55">
    <ellipse cx="400" cy="600" rx="420" ry="24"/>
    <ellipse cx="200" cy="700" rx="300" ry="30"/>
  </g>

  <!-- signature -->
  <text x="742" y="770" font-family="serif" font-size="22" fill="#3b3a36">P.</text>
</svg>