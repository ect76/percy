<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>
  <!-- distant fog bands -->
  <rect x="0" y="120" width="800" height="90" fill="#d9d6cf" opacity="0.7"/>
  <rect x="0" y="560" width="800" height="110" fill="#d6d3cc" opacity="0.6"/>
  <ellipse cx="160" cy="260" rx="200" ry="40" fill="#e6e2d9" opacity="0.8"/>
  <ellipse cx="660" cy="470" rx="220" ry="45" fill="#e2dfd6" opacity="0.8"/>

  <!-- tower stonework -->
  <rect x="235" y="90" width="330" height="710" fill="#b9b1a3"/>
  <rect x="235" y="90" width="330" height="710" fill="none" stroke="#2b2622" stroke-width="5"/>
  <!-- battlements (embattled top) -->
  <path d="M235 90 L235 40 L265 40 L265 65 L295 65 L295 40 L325 40 L325 65 L355 65 L355 40 L385 40 L385 65 L415 65 L415 40 L445 40 L445 65 L475 65 L475 40 L505 40 L505 90 Z" fill="#b9b1a3" stroke="#2b2622" stroke-width="5" stroke-linejoin="round"/>
  <!-- stone courses -->
  <g stroke="#7d756a" stroke-width="2" fill="none" opacity="0.8">
    <path d="M235 130 H565"/>
    <path d="M235 180 H565"/>
    <path d="M235 230 H565"/>
    <path d="M235 540 H565"/>
    <path d="M235 600 H565"/>
    <path d="M235 660 H565"/>
    <path d="M235 720 H565"/>
    <path d="M285 90 V130 M385 130 V180 M485 90 V130 M335 180 V230 M435 180 V230"/>
    <path d="M300 230 V280 M500 230 V280"/>
  </g>

  <!-- clock surround -->
  <circle cx="400" cy="380" r="172" fill="#8f877a" stroke="#2b2622" stroke-width="6"/>
  <circle cx="400" cy="380" r="150" fill="#3a3430" stroke="#2b2622" stroke-width="4"/>
  <!-- clock face -->
  <circle cx="400" cy="380" r="136" fill="#f7f4ec" stroke="#2b2622" stroke-width="3"/>

  <!-- hour ticks -->
  <g stroke="#2b2622" stroke-width="5" stroke-linecap="round">
    <line x1="400" y1="258" x2="400" y2="272"/>
    <line x1="502" y1="380" x2="516" y2="380"/>
    <line x1="400" y1="502" x2="400" y2="488"/>
    <line x1="298" y1="380" x2="284" y2="380"/>
  </g>
  <g stroke="#6b645b" stroke-width="2.5" stroke-linecap="round">
    <line x1="470" y1="290" x2="462" y2="300"/>
    <line x1="530" y1="350" x2="520" y2="356"/>
    <line x1="530" y1="410" x2="520" y2="404"/>
    <line x1="470" y1="470" x2="462" y2="460"/>
    <line x1="330" y1="470" x2="338" y2="460"/>
    <line x1="270" y1="410" x2="280" y2="404"/>
    <line x1="270" y1="350" x2="280" y2="356"/>
    <line x1="330" y1="290" x2="338" y2="300"/>
  </g>

  <!-- hour hand (pointing toward ten) -->
  <line x1="400" y1="380" x2="352" y2="334" stroke="#1d1a17" stroke-width="13" stroke-linecap="round"/>
  <!-- crooked minute hand: bent partway up -->
  <path d="M400 380 L414 302 L398 236" fill="none" stroke="#1d1a17" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- centre boss -->
  <circle cx="400" cy="380" r="9" fill="#1d1a17"/>
  <circle cx="400" cy="380" r="3" fill="#b9b1a3"/>

  <!-- hairline crack in the glass -->
  <path d="M476 282 L486 300 L478 316 L492 332 L484 348 L500 362 L494 376 L512 392 L506 404 L522 418" fill="none" stroke="#4a443e" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M486 300 L500 304 M492 332 L506 330" fill="none" stroke="#4a443e" stroke-width="1.2"/>

  <!-- glass glint -->
  <path d="M310 300 Q330 270 370 262" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- cobbled ground -->
  <rect x="0" y="700" width="800" height="100" fill="#c9c0b0"/>
  <g fill="none" stroke="#6e665b" stroke-width="2.5">
    <ellipse cx="120" cy="740" rx="50" ry="16"/>
    <ellipse cx="240" cy="772" rx="50" ry="16"/>
    <ellipse cx="380" cy="742" rx="50" ry="16"/>
    <ellipse cx="520" cy="774" rx="50" ry="16"/>
    <ellipse cx="660" cy="744" rx="50" ry="16"/>
    <ellipse cx="740" cy="780" rx="40" ry="14"/>
    <ellipse cx="60" cy="782" rx="40" ry="14"/>
  </g>
  <rect x="0" y="700" width="800" height="6" fill="#2b2622" opacity="0.6"/>

  <!-- signature -->
  <text x="752" y="780" font-size="22" fill="#2b2622" text-anchor="end">P.</text>
</svg>