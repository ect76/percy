<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and sky -->
  <rect width="800" height="800" fill="#e9e6dc"/>
  <rect x="0" y="0" width="800" height="330" fill="#d6d9d8"/>

  <!-- distant fog banks -->
  <ellipse cx="130" cy="330" rx="200" ry="30" fill="#f4f2ec" opacity="0.8"/>
  <ellipse cx="680" cy="310" rx="220" ry="34" fill="#f4f2ec" opacity="0.8"/>
  <ellipse cx="400" cy="420" rx="420" ry="26" fill="#f4f2ec" opacity="0.6"/>

  <!-- distant cottages in fog -->
  <g fill="#b9bdbd" stroke="#4a4f52" stroke-width="1.5">
    <rect x="40" y="380" width="70" height="60"/>
    <polygon points="34,380 75,344 116,380"/>
    <rect x="680" y="372" width="80" height="66"/>
    <polygon points="672,372 720,334 768,372"/>
  </g>

  <!-- building base steps -->
  <rect x="120" y="640" width="560" height="22" fill="#c9c3b4" stroke="#2c2c2c" stroke-width="3"/>
  <rect x="100" y="662" width="600" height="18" fill="#b5ae9d" stroke="#2c2c2c" stroke-width="3"/>

  <!-- main body -->
  <rect x="140" y="256" width="520" height="384" fill="#efe9da" stroke="#2c2c2c" stroke-width="4"/>
  <!-- cornice and pediment -->
  <rect x="124" y="236" width="552" height="22" fill="#d8cfb9" stroke="#2c2c2c" stroke-width="4"/>
  <polygon points="140,236 400,164 660,236" fill="#d8cfb9" stroke="#2c2c2c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="200,226 400,176 600,226" fill="#efe9da" stroke="#2c2c2c" stroke-width="2"/>

  <!-- cupola and gull weathervane -->
  <rect x="368" y="120" width="64" height="48" fill="#d8cfb9" stroke="#2c2c2c" stroke-width="3"/>
  <polygon points="356,122 400,96 444,122" fill="#7d8f8c" stroke="#2c2c2c" stroke-width="3" stroke-linejoin="round"/>
  <line x1="400" y1="96" x2="400" y2="46" stroke="#2c2c2c" stroke-width="3"/>
  <path d="M372,54 Q386,38 400,52 Q414,38 428,54 Q414,50 400,60 Q386,50 372,54 Z" fill="#4f6b6a" stroke="#2c2c2c" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="400" cy="46" r="3" fill="#2c2c2c"/>

  <!-- columns -->
  <g fill="#f7f3e8" stroke="#2c2c2c" stroke-width="3">
    <rect x="240" y="282" width="22" height="330"/>
    <rect x="320" y="282" width="22" height="330"/>
    <rect x="458" y="282" width="22" height="330"/>
    <rect x="538" y="282" width="22" height="330"/>
  </g>
  <g stroke="#2c2c2c" stroke-width="1.5" opacity="0.5">
    <line x1="248" y1="290" x2="248" y2="606"/>
    <line x1="328" y1="290" x2="328" y2="606"/>
    <line x1="466" y1="290" x2="466" y2="606"/>
    <line x1="546" y1="290" x2="546" y2="606"/>
  </g>
  <!-- capitals -->
  <g fill="#d8cfb9" stroke="#2c2c2c" stroke-width="2.5">
    <rect x="234" y="274" width="34" height="10"/>
    <rect x="314" y="274" width="34" height="10"/>
    <rect x="452" y="274" width="34" height="10"/>
    <rect x="532" y="274" width="34" height="10"/>
    <rect x="234" y="606" width="34" height="10"/>
    <rect x="314" y="606" width="34" height="10"/>
    <rect x="452" y="606" width="34" height="10"/>
    <rect x="532" y="606" width="34" height="10"/>
  </g>

  <!-- side windows -->
  <g stroke="#2c2c2c" stroke-width="3.5">
    <rect x="168" y="330" width="60" height="150" fill="#9fb3b0"/>
    <rect x="572" y="330" width="60" height="150" fill="#9fb3b0"/>
  </g>
  <!-- glimpse of glass tube in left window -->
  <rect x="193" y="350" width="10" height="112" fill="#f4f2ec" stroke="#2c2c2c" stroke-width="1.5"/>
  <rect x="195" y="382" width="6" height="80" fill="#b3322b"/>
  <!-- glimpse of round dial in right window -->
  <circle cx="602" cy="392" r="22" fill="#e9dcb0" stroke="#2c2c2c" stroke-width="2.5"/>
  <line x1="602" y1="392" x2="614" y2="380" stroke="#b08d3c" stroke-width="2.5"/>
  <rect x="580" y="420" width="44" height="50" fill="#6b4a2c" opacity="0.7"/>
  <!-- small blue book on left sill -->
  <rect x="164" y="482" width="44" height="12" fill="#c7d9ea" stroke="#2c2c2c" stroke-width="2"/>
  <rect x="164" y="484" width="44" height="2" fill="#7d9ab2"/>

  <!-- main doorway -->
  <rect x="360" y="478" width="80" height="128" fill="#5c4530" stroke="#2c2c2c" stroke-width="3.5"/>
  <rect x="368" y="486" width="64" height="58" fill="none" stroke="#2c2c2c" stroke-width="2"/>
  <rect x="368" y="552" width="64" height="48" fill="none" stroke="#2c2c2c" stroke-width="2"/>
  <circle cx="432" cy="548" r="3" fill="#d6b65a"/>
  <rect x="350" y="464" width="100" height="14" fill="#d8cfb9" stroke="#2c2c2c" stroke-width="3"/>

  <!-- plaque beside the left door -->
  <rect x="276" y="478" width="48" height="36" fill="#8c8a80" stroke="#2c2c2c" stroke-width="3"/>
  <rect x="282" y="484" width="36" height="24" fill="#c9c6b8" stroke="#2c2c2c" stroke-width="1.5"/>
  <line x1="287" y1="492" x2="313" y2="492" stroke="#2c2c2c" stroke-width="1.5"/>
  <line x1="287" y1="498" x2="309" y2="498" stroke="#2c2c2c" stroke-width="1.5"/>
  <line x1="287" y1="504" x2="312" y2="504" stroke="#2c2c2c" stroke-width="1.5"/>

  <!-- cobbled village street -->
  <rect x="0" y="680" width="800" height="120" fill="#cfc8b6"/>
  <g fill="none" stroke="#5b564b" stroke-width="2" opacity="0.8">
    <ellipse cx="60" cy="700" rx="22" ry="9"/>
    <ellipse cx="130" cy="716" rx="22" ry="9"/>
    <ellipse cx="200" cy="700" rx="22" ry="9"/>
    <ellipse cx="270" cy="718" rx="22" ry="9"/>
    <ellipse cx="340" cy="700" rx="22" ry="9"/>
    <ellipse cx="410" cy="718" rx="22" ry="9"/>
    <ellipse cx="480" cy="700" rx="22" ry="9"/>
    <ellipse cx="550" cy="718" rx="22" ry="9"/>
    <ellipse cx="620" cy="700" rx="22" ry="9"/>
    <ellipse cx="690" cy="718" rx="22" ry="9"/>
    <ellipse cx="750" cy="700" rx="22" ry="9"/>
    <ellipse cx="95" cy="750" rx="24" ry="10"/>
    <ellipse cx="170" cy="768" rx="24" ry="10"/>
    <ellipse cx="245" cy="750" rx="24" ry="10"/>
    <ellipse cx="320" cy="772" rx="24" ry="10"/>
    <ellipse cx="395" cy="750" rx="24" ry="10"/>
    <ellipse cx="470" cy="772" rx="24" ry="10"/>
    <ellipse cx="545" cy="750" rx="24" ry="10"/>
    <ellipse cx="620" cy="772" rx="24" ry="10"/>
    <ellipse cx="695" cy="750" rx="24" ry="10"/>
  </g>

  <!-- foreground fog -->
  <rect x="0" y="600" width="800" height="50" fill="#f4f2ec" opacity="0.45"/>
  <ellipse cx="400" cy="735" rx="460" ry="30" fill="#f4f2ec" opacity="0.6"/>
  <ellipse cx="60" cy="640" rx="140" ry="24" fill="#f4f2ec" opacity="0.7"/>

  <!-- signature -->
  <text x="752" y="780" font-size="22" fill="#2c2c2c" text-anchor="end">P.</text>
</svg>