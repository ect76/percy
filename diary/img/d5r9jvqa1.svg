<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fogUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4f6f7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f4f6f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fogDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f4f6f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#f4f1ea"/>

  <!-- misty sky -->
  <rect x="0" y="0" width="800" height="340" fill="#d6e0e6"/>
  <path d="M0 150 Q200 120 400 150 T800 140 V180 H0Z" fill="#c4d2db" stroke="#222" stroke-width="1.5" opacity="0.7"/>

  <!-- snowy ground -->
  <rect x="0" y="340" width="800" height="460" fill="#ffffff"/>
  <path d="M0 470 Q120 455 260 480" fill="none" stroke="#9aa8b2" stroke-width="1.2" opacity="0.6"/>
  <path d="M800 500 Q650 480 540 505" fill="none" stroke="#9aa8b2" stroke-width="1.2" opacity="0.6"/>

  <!-- lane -->
  <polygon points="0,800 800,800 430,345 370,345" fill="#eef3f6" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cobbles -->
  <g fill="none" stroke="#7d8790" stroke-width="1.3" opacity="0.8">
    <ellipse cx="120" cy="760" rx="14" ry="7"/>
    <ellipse cx="300" cy="740" rx="12" ry="6"/>
    <ellipse cx="500" cy="750" rx="13" ry="6"/>
    <ellipse cx="680" cy="770" rx="15" ry="7"/>
    <ellipse cx="220" cy="650" rx="9" ry="5"/>
    <ellipse cx="420" cy="640" rx="9" ry="5"/>
    <ellipse cx="350" cy="580" rx="7" ry="4"/>
    <ellipse cx="260" cy="520" rx="6" ry="3"/>
    <ellipse cx="402" cy="500" rx="6" ry="3"/>
    <ellipse cx="330" cy="420" rx="4" ry="2"/>
    <ellipse cx="368" cy="410" rx="4" ry="2"/>
  </g>
  <!-- cart ruts -->
  <path d="M180 800 L345 390" stroke="#c3ccd3" stroke-width="5" fill="none" opacity="0.7"/>
  <path d="M620 800 L455 390" stroke="#c3ccd3" stroke-width="5" fill="none" opacity="0.7"/>

  <!-- bell tower at the end of the lane -->
  <rect x="380" y="200" width="40" height="150" fill="#8c8577" stroke="#222" stroke-width="2.5"/>
  <line x1="390" y1="230" x2="390" y2="345" stroke="#5e5a52" stroke-width="1.5"/>
  <line x1="410" y1="230" x2="410" y2="345" stroke="#5e5a52" stroke-width="1.5"/>
  <rect x="386" y="178" width="28" height="24" fill="#3b3a36" stroke="#222" stroke-width="2"/>
  <path d="M378 182 L400 118 L422 182 Z" fill="#6a675f" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M390 150 L400 118 L410 150 Q400 146 390 150 Z" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <path d="M394 196 Q400 188 406 196 L408 202 H392 Z" fill="#d9b44a" stroke="#222" stroke-width="1.5"/>
  <rect x="384" y="330" width="32" height="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>

  <!-- left houses -->
  <g stroke="#222" stroke-width="2.5" stroke-linejoin="round">
    <rect x="0" y="340" width="120" height="360" fill="#c9a98a"/>
    <polygon points="-10,340 60,270 130,340" fill="#ffffff"/>
    <rect x="118" y="390" width="90" height="260" fill="#b8c4b0"/>
    <polygon points="112,390 163,330 214,390" fill="#ffffff"/>
    <rect x="205" y="425" width="60" height="180" fill="#d6b48f"/>
    <polygon points="200,425 235,385 270,425" fill="#ffffff"/>
    <rect x="262" y="440" width="40" height="140" fill="#a7b5c2"/>
    <polygon points="258,440 282,415 306,440" fill="#ffffff"/>
  </g>
  <g fill="#3b3a36" opacity="0.85">
    <rect x="20" y="400" width="18" height="24"/>
    <rect x="72" y="400" width="18" height="24"/>
    <rect x="20" y="480" width="18" height="24"/>
    <rect x="140" y="420" width="16" height="22"/>
    <rect x="180" y="460" width="12" height="18"/>
    <rect x="222" y="470" width="12" height="16"/>
    <rect x="272" y="480" width="10" height="14"/>
  </g>

  <!-- right houses -->
  <g stroke="#222" stroke-width="2.5" stroke-linejoin="round">
    <rect x="680" y="340" width="120" height="360" fill="#d8c3a5"/>
    <polygon points="670,340 740,270 810,340" fill="#ffffff"/>
    <rect x="592" y="390" width="90" height="260" fill="#c4b8a8"/>
    <polygon points="588,390 637,330 686,390" fill="#ffffff"/>
    <rect x="535" y="425" width="60" height="180" fill="#cfa98a"/>
    <polygon points="530,425 565,385 600,425" fill="#ffffff"/>
    <rect x="498" y="440" width="40" height="140" fill="#9fb0a0"/>
    <polygon points="494,440 518,415 542,440" fill="#ffffff"/>
  </g>
  <g fill="#3b3a36" opacity="0.85">
    <rect x="712" y="400" width="18" height="24"/>
    <rect x="740" y="470" width="18" height="24"/>
    <rect x="660" y="420" width="16" height="22"/>
    <rect x="606" y="460" width="12" height="18"/>
    <rect x="550" y="470" width="12" height="16"/>
    <rect x="512" y="480" width="10" height="14"/>
  </g>

  <!-- fog bands -->
  <rect x="0" y="330" width="800" height="150" fill="url(#fogUp)"/>
  <rect x="0" y="420" width="800" height="90" fill="url(#fogDown)" opacity="0.6"/>
  <rect x="0" y="250" width="800" height="60" fill="url(#fogUp)" opacity="0.7"/>

  <!-- falling snow -->
  <g fill="#ffffff" stroke="#8a97a2" stroke-width="0.8">
    <circle cx="150" cy="200" r="3"/>
    <circle cx="260" cy="150" r="2.5"/>
    <circle cx="540" cy="180" r="3"/>
    <circle cx="650" cy="230" r="2.5"/>
    <circle cx="90" cy="300" r="3"/>
    <circle cx="710" cy="320" r="3"/>
    <circle cx="330" cy="260" r="2"/>
    <circle cx="470" cy="300" r="2"/>
    <circle cx="200" cy="560" r="4"/>
    <circle cx="610" cy="600" r="4"/>
    <circle cx="410" cy="700" r="5"/>
    <circle cx="560" cy="700" r="4"/>
    <circle cx="260" cy="700" r="4"/>
  </g>

  <!-- signature -->
  <g fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round">
    <path d="M752 782 V752 H762 Q771 752 771 761 Q771 770 762 770 H752"/>
  </g>
  <circle cx="778" cy="782" r="2.2" fill="#222"/>
</svg>