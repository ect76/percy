<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>
  <!-- wall -->
  <rect x="20" y="20" width="760" height="620" fill="#e9dfc9"/>
  <!-- floor and cobbles -->
  <rect x="20" y="640" width="760" height="140" fill="#9c9282"/>
  <g fill="none" stroke="#5e5548" stroke-width="2">
    <ellipse cx="120" cy="690" rx="40" ry="14"/>
    <ellipse cx="240" cy="725" rx="46" ry="15"/>
    <ellipse cx="380" cy="690" rx="38" ry="13"/>
    <ellipse cx="520" cy="735" rx="44" ry="14"/>
    <ellipse cx="670" cy="692" rx="42" ry="13"/>
    <ellipse cx="300" cy="765" rx="40" ry="12"/>
  </g>

  <!-- window with fog and lane -->
  <rect x="470" y="110" width="220" height="220" fill="#dfe8ea" stroke="#2b2620" stroke-width="4"/>
  <path d="M470 290 Q560 262 690 282 L690 330 L470 330 Z" fill="#b9b3a4"/>
  <path d="M520 330 Q580 300 640 330 Z" fill="#8f8777"/>
  <g stroke="#2b2620" stroke-width="4" fill="none">
    <line x1="580" y1="110" x2="580" y2="330"/>
    <line x1="470" y1="220" x2="690" y2="220"/>
  </g>

  <!-- morning light beam -->
  <polygon points="470,330 690,330 745,470 425,470" fill="#f6e08f" opacity="0.5"/>

  <!-- cupboard -->
  <rect x="90" y="160" width="300" height="460" fill="#9a7450" stroke="#2b2620" stroke-width="4"/>
  <rect x="110" y="180" width="260" height="420" fill="#5b4330"/>
  <rect x="110" y="290" width="260" height="10" fill="#c8a77e" stroke="#2b2620" stroke-width="2"/>
  <rect x="110" y="410" width="260" height="10" fill="#c8a77e" stroke="#2b2620" stroke-width="2"/>
  <rect x="110" y="530" width="260" height="10" fill="#c8a77e" stroke="#2b2620" stroke-width="2"/>

  <!-- empty tins, shelf one -->
  <g stroke="#2b2620" stroke-width="3">
    <rect x="150" y="236" width="50" height="54" rx="6" fill="#b8bcc0"/>
    <ellipse cx="175" cy="236" rx="25" ry="5" fill="#d6dadd"/>
    <rect x="230" y="246" width="52" height="44" rx="6" fill="#a9aeb3"/>
    <ellipse cx="256" cy="246" rx="26" ry="5" fill="#c9cdd1"/>
  </g>
  <path d="M236 270 L262 262" stroke="#2b2620" stroke-width="2" fill="none"/>

  <!-- empty tin on shelf two, lying on its side -->
  <g stroke="#2b2620" stroke-width="3">
    <rect x="160" y="366" width="80" height="44" rx="6" fill="#b8bcc0"/>
    <ellipse cx="160" cy="388" rx="6" ry="22" fill="#d6dadd"/>
  </g>
  <rect x="250" y="380" width="40" height="30" fill="none" stroke="#2b2620" stroke-width="2" opacity="0"/>

  <!-- the one fish tin, shelf three -->
  <g stroke="#2b2620" stroke-width="3">
    <rect x="165" y="466" width="96" height="64" rx="8" fill="#3f6e8c"/>
    <ellipse cx="213" cy="466" rx="48" ry="6" fill="#6f98b2"/>
    <rect x="165" y="492" width="96" height="16" fill="#e8dcc0"/>
  </g>
  <path d="M190 500 Q205 486 226 500 Q205 514 190 500 Z" fill="#c9b27c" stroke="#2b2620" stroke-width="2"/>
  <path d="M226 500 L238 490 L238 510 Z" fill="#c9b27c" stroke="#2b2620" stroke-width="2"/>
  <circle cx="200" cy="498" r="2" fill="#2b2620"/>

  <!-- desk -->
  <rect x="430" y="470" width="300" height="18" fill="#a57c52" stroke="#2b2620" stroke-width="3"/>
  <rect x="450" y="488" width="14" height="150" fill="#8a6442" stroke="#2b2620" stroke-width="2"/>
  <rect x="706" y="488" width="14" height="150" fill="#8a6442" stroke="#2b2620" stroke-width="2"/>
  <rect x="520" y="488" width="150" height="40" fill="#8a6442" stroke="#2b2620" stroke-width="2"/>
  <line x1="595" y1="488" x2="595" y2="528" stroke="#2b2620" stroke-width="2"/>

  <!-- paper sheets -->
  <polygon points="450,458 530,452 536,468 456,474" fill="#fbf7ec" stroke="#2b2620" stroke-width="2"/>
  <polygon points="464,450 548,444 552,458 468,464" fill="#fffdf6" stroke="#2b2620" stroke-width="2"/>

  <!-- pencils -->
  <g stroke="#2b2620" stroke-width="3" stroke-linecap="round">
    <line x1="620" y1="462" x2="690" y2="456"/>
    <line x1="618" y1="468" x2="688" y2="462"/>
  </g>
  <g fill="#d9a33a" stroke="#2b2620" stroke-width="1.5">
    <polygon points="620,462 690,456 690,460 620,466"/>
  </g>

  <!-- old computer monitor -->
  <rect x="560" y="360" width="110" height="92" rx="6" fill="#5d6670" stroke="#2b2620" stroke-width="3"/>
  <rect x="572" y="372" width="86" height="68" fill="#cfd9d6" stroke="#2b2620" stroke-width="2"/>
  <rect x="604" y="452" width="22" height="18" fill="#5d6670" stroke="#2b2620" stroke-width="2"/>
  <rect x="580" y="466" width="70" height="6" rx="2" fill="#5d6670" stroke="#2b2620" stroke-width="2"/>

  <!-- signature -->
  <text x="758" y="782" font-size="22" text-anchor="end" fill="#2b2620">P.</text>
</svg>