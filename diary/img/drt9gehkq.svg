<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe4cc"/>
  <!-- wall texture bands -->
  <rect x="0" y="0" width="800" height="560" fill="#ead9b8"/>
  <!-- floor -->
  <rect x="0" y="560" width="800" height="240" fill="#b58a5c"/>
  <g stroke="#5a4130" stroke-width="2" fill="none" opacity="0.5">
    <line x1="0" y1="610" x2="800" y2="610"/>
    <line x1="0" y1="670" x2="800" y2="670"/>
    <line x1="0" y1="735" x2="800" y2="735"/>
  </g>

  <!-- window onto lane -->
  <rect x="90" y="90" width="240" height="240" fill="#8a9aa3" stroke="#222" stroke-width="3"/>
  <rect x="104" y="104" width="212" height="212" fill="#f3c86a"/>
  <path d="M104 250 L316 240 L316 316 L104 316 Z" fill="#7d6a52"/>
  <path d="M104 290 Q210 270 316 286 L316 316 L104 316 Z" fill="#5c4a38"/>
  <line x1="210" y1="104" x2="210" y2="316" stroke="#222" stroke-width="5"/>
  <line x1="104" y1="210" x2="316" y2="210" stroke="#222" stroke-width="5"/>
  <rect x="90" y="90" width="240" height="240" fill="none" stroke="#222" stroke-width="3"/>

  <!-- evening light spill from window -->
  <polygon points="104,330 316,330 420,560 60,560" fill="#f7d37a" opacity="0.28"/>

  <!-- cupboard body -->
  <rect x="470" y="190" width="250" height="330" fill="#8c6a4a" stroke="#222" stroke-width="3"/>
  <!-- cupboard interior visible through gap -->
  <rect x="560" y="200" width="150" height="310" fill="#3a2a1e"/>
  <rect x="560" y="390" width="150" height="8" fill="#6b4f36"/>
  <!-- tins on inner shelf -->
  <rect x="585" y="330" width="46" height="60" rx="6" fill="#c8483a" stroke="#222" stroke-width="2"/>
  <rect x="640" y="340" width="40" height="50" rx="6" fill="#d8b04a" stroke="#222" stroke-width="2"/>
  <!-- the single fish -->
  <path d="M600 470 Q640 452 680 470 Q640 488 600 470 Z" fill="#9fb6c4" stroke="#222" stroke-width="2.5"/>
  <path d="M680 470 L700 455 L700 485 Z" fill="#9fb6c4" stroke="#222" stroke-width="2.5"/>
  <circle cx="617" cy="467" r="3" fill="#222"/>
  <!-- open door -->
  <polygon points="470,190 565,205 565,520 470,520" fill="#9b7752" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <rect x="490" y="230" width="55" height="110" fill="none" stroke="#6e5036" stroke-width="3"/>
  <rect x="490" y="370" width="55" height="110" fill="none" stroke="#6e5036" stroke-width="3"/>
  <circle cx="552" cy="360" r="5" fill="#d8b04a" stroke="#222" stroke-width="1.5"/>

  <!-- table top -->
  <rect x="70" y="500" width="660" height="32" fill="#a8733f" stroke="#222" stroke-width="3"/>
  <rect x="82" y="532" width="22" height="230" fill="#7d5532" stroke="#222" stroke-width="2"/>
  <rect x="676" y="532" width="22" height="230" fill="#7d5532" stroke="#222" stroke-width="2"/>
  <rect x="380" y="532" width="18" height="200" fill="#7d5532" stroke="#222" stroke-width="2"/>

  <!-- empty open tins -->
  <g stroke="#222" stroke-width="3" stroke-linejoin="round">
    <rect x="200" y="440" width="62" height="60" fill="#c9cfd3"/>
    <ellipse cx="231" cy="440" rx="31" ry="7" fill="#3d3d3d"/>
    <rect x="200" y="462" width="62" height="10" fill="#c8483a" stroke="none"/>
    <rect x="278" y="450" width="58" height="50" fill="#c9cfd3"/>
    <ellipse cx="307" cy="450" rx="29" ry="6" fill="#3d3d3d"/>
    <rect x="278" y="470" width="58" height="8" fill="#d8b04a" stroke="none"/>
    <rect x="160" y="466" width="36" height="34" fill="#c9cfd3"/>
    <ellipse cx="178" cy="466" rx="18" ry="4" fill="#3d3d3d"/>
  </g>

  <!-- paper and pencils -->
  <polygon points="110,470 180,462 186,498 116,506" fill="#fbf7ec" stroke="#222" stroke-width="2.5"/>
  <g stroke="#7a7a7a" stroke-width="1.5">
    <line x1="122" y1="478" x2="172" y2="473"/>
    <line x1="124" y1="486" x2="176" y2="481"/>
    <line x1="126" y1="494" x2="178" y2="489"/>
  </g>
  <g stroke="#222" stroke-width="3" stroke-linecap="round">
    <line x1="500" y1="478" x2="610" y2="462"/>
    <line x1="500" y1="486" x2="606" y2="471"/>
  </g>
  <line x1="606" y1="462" x2="616" y2="461" stroke="#d8b04a" stroke-width="6"/>
  <line x1="602" y1="471" x2="612" y2="470" stroke="#c8483a" stroke-width="6"/>

  <!-- brass bubble level on table -->
  <rect x="300" y="476" width="150" height="24" rx="10" fill="#d1a84f" stroke="#222" stroke-width="3"/>
  <rect x="330" y="482" width="90" height="12" rx="6" fill="#f3e6b8" stroke="#222" stroke-width="2"/>
  <ellipse cx="372" cy="488" rx="8" ry="4" fill="#3a2a1e"/>
  <line x1="350" y1="486" x2="350" y2="490" stroke="#222" stroke-width="1.5"/>
  <line x1="405" y1="486" x2="405" y2="490" stroke="#222" stroke-width="1.5"/>

  <!-- small signature -->
  <text x="752" y="780" font-size="22" fill="#3a2a1e">P.</text>
</svg>