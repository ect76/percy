<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe3"/>
  <!-- foggy sky -->
  <rect x="0" y="0" width="800" height="430" fill="#dde4e3"/>
  <rect x="0" y="120" width="800" height="90" fill="#e8ece9" opacity="0.8"/>
  <rect x="0" y="260" width="800" height="70" fill="#eef1ee" opacity="0.7"/>
  <!-- distant cottages in fog -->
  <rect x="40" y="330" width="90" height="70" fill="#c4cbc8" opacity="0.7"/>
  <rect x="660" y="310" width="110" height="90" fill="#c4cbc8" opacity="0.6"/>
  <!-- lane (cobbles in perspective) -->
  <path d="M0,430 L800,430 L800,800 L0,800 Z" fill="#c2b9a6"/>
  <path d="M300,430 L500,430 L700,800 L100,800 Z" fill="#b3a993"/>
  <g fill="none" stroke="#7d7463" stroke-width="2" opacity="0.8">
    <ellipse cx="380" cy="460" rx="18" ry="6"/>
    <ellipse cx="300" cy="480" rx="22" ry="7"/>
    <ellipse cx="470" cy="482" rx="20" ry="7"/>
    <ellipse cx="250" cy="530" rx="28" ry="9"/>
    <ellipse cx="560" cy="535" rx="26" ry="9"/>
    <ellipse cx="180" cy="610" rx="36" ry="12"/>
    <ellipse cx="620" cy="620" rx="34" ry="12"/>
    <ellipse cx="400" cy="700" rx="48" ry="16"/>
    <ellipse cx="200" cy="760" rx="55" ry="18"/>
    <ellipse cx="610" cy="750" rx="52" ry="17"/>
  </g>
  <!-- cottage doorstep, bottom left -->
  <rect x="0" y="330" width="170" height="330" fill="#8a6246" stroke="#2b2118" stroke-width="3"/>
  <rect x="20" y="360" width="120" height="180" fill="#5b3d2a" stroke="#2b2118" stroke-width="3"/>
  <rect x="0" y="650" width="230" height="30" fill="#a89c88" stroke="#2b2118" stroke-width="3"/>
  <rect x="0" y="680" width="260" height="30" fill="#938671" stroke="#2b2118" stroke-width="3"/>
  <!-- window glow from cottage -->
  <rect x="150" y="420" width="0" height="0" fill="#ffe59a"/>
  <!-- lamp post -->
  <rect x="604" y="260" width="10" height="330" fill="#2b2118"/>
  <path d="M590,260 L628,260 L618,240 L600,240 Z" fill="#2b2118"/>
  <circle cx="609" cy="250" r="90" fill="#ffe59a" opacity="0.35"/>
  <circle cx="609" cy="250" r="45" fill="#ffe59a" opacity="0.6"/>
  <!-- halo -->
  <circle cx="380" cy="300" r="112" fill="none" stroke="#f3d77a" stroke-width="12" opacity="0.8"/>
  <circle cx="380" cy="300" r="112" fill="none" stroke="#2b2118" stroke-width="1.5" opacity="0.6"/>
  <!-- pedestal -->
  <path d="M220,530 L540,530 L562,578 L198,578 Z" fill="#c9962a" stroke="#2b2118" stroke-width="3"/>
  <path d="M250,548 Q380,566 510,548" fill="none" stroke="#8c6418" stroke-width="2"/>
  <!-- body (lap-sitting) -->
  <path d="M250,530 C228,430 268,368 380,360 C492,368 532,430 510,530 Z" fill="#e0b24a" stroke="#2b2118" stroke-width="3"/>
  <!-- saffron drape -->
  <path d="M268,420 C300,380 340,370 380,368 L392,528 C330,522 282,506 258,478 Z" fill="#e0782a" stroke="#2b2118" stroke-width="3"/>
  <path d="M300,420 C320,450 340,480 360,520" fill="none" stroke="#a84f16" stroke-width="2.5"/>
  <path d="M330,400 C350,430 360,470 368,512" fill="none" stroke="#a84f16" stroke-width="2"/>
  <!-- crossed legs / lap -->
  <ellipse cx="380" cy="500" rx="122" ry="34" fill="#e8c05a" stroke="#2b2118" stroke-width="3"/>
  <path d="M286,498 Q380,530 474,498" fill="none" stroke="#2b2118" stroke-width="2" opacity="0.6"/>
  <!-- hands resting in lap -->
  <ellipse cx="338" cy="478" rx="26" ry="14" fill="#f0cc68" stroke="#2b2118" stroke-width="2.5"/>
  <ellipse cx="422" cy="478" rx="26" ry="14" fill="#f0cc68" stroke="#2b2118" stroke-width="2.5"/>
  <!-- head -->
  <circle cx="380" cy="300" r="62" fill="#f0c95e" stroke="#2b2118" stroke-width="3"/>
  <!-- ushnisha bump -->
  <circle cx="380" cy="240" r="15" fill="#f0c95e" stroke="#2b2118" stroke-width="3"/>
  <!-- half-closed eyes -->
  <path d="M344,302 Q358,312 372,302" fill="none" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/>
  <path d="M388,302 Q402,312 416,302" fill="none" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/>
  <path d="M350,300 Q358,304 366,300" fill="#2b2118" opacity="0.5"/>
  <!-- calm mouth and brow mark -->
  <path d="M362,332 Q380,340 398,332" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="380" cy="280" r="3" fill="#b5751e"/>
  <!-- fog bands over base -->
  <ellipse cx="380" cy="590" rx="330" ry="26" fill="#f4f6f3" opacity="0.6"/>
  <ellipse cx="520" cy="470" rx="260" ry="20" fill="#f4f6f3" opacity="0.45"/>
  <ellipse cx="200" cy="420" rx="200" ry="18" fill="#f4f6f3" opacity="0.4"/>
  <!-- signature -->
  <text x="760" y="780" font-family="serif" font-size="26" fill="#2b2118" text-anchor="end">P.</text>
</svg>