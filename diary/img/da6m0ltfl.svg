    <ellipse cx="260" cy="610" rx="12" ry="5"/>
    <ellipse cx="310" cy="610" rx="12" ry="5"/>
    <ellipse cx="360" cy="610" rx="12" ry="5"/>
    <ellipse cx="410" cy="610" rx="12" ry="5"/>
    <ellipse cx="460" cy="610" rx="12" ry="5"/>
    <ellipse cx="510" cy="610" rx="12" ry="5"/>
    <ellipse cx="215" cy="690" rx="16" ry="6"/>
    <ellipse cx="275" cy="690" rx="16" ry="6"/>
    <ellipse cx="335" cy="690" rx="16" ry="6"/>
    <ellipse cx="395" cy="690" rx="16" ry="6"/>
    <ellipse cx="455" cy="690" rx="16" ry="6"/>
    <ellipse cx="515" cy="690" rx="16" ry="6"/>
    <ellipse cx="575" cy="690" rx="16" ry="6"/>
    <ellipse cx="165" cy="770" rx="22" ry="8"/>
    <ellipse cx="240" cy="770" rx="22" ry="8"/>
    <ellipse cx="320" cy="770" rx="22" ry="8"/>
    <ellipse cx="400" cy="770" rx="22" ry="8"/>
    <ellipse cx="480" cy="770" rx="22" ry="8"/>
    <ellipse cx="560" cy="770" rx="22" ry="8"/>
    <ellipse cx="635" cy="770" rx="22" ry="8"/>
