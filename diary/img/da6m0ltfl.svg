  <polygon points="-10,176 230,236 230,256 -10,194" fill="#3c3432" stroke="#15171c" stroke-width="2.5"/>
  <rect x="30" y="310" width="62" height="74" fill="#ffd27a" stroke="#15171c" stroke-width="2"/>
  <line x1="61" y1="310" x2="61" y2="384" stroke="#15171c" stroke-width="2"/>
  <line x1="30" y1="347" x2="92" y2="347" stroke="#15171c" stroke-width="2"/>
  <rect x="118" y="330" width="56" height="66" fill="#ffd27a" stroke="#15171c" stroke-width="2"/>
  <line x1="146" y1="330" x2="146" y2="396" stroke="#15171c" stroke-width="2"/>
  <rect x="50" y="470" width="44" height="90" fill="#3a2c24" stroke="#15171c" stroke-width="2"/>
  <circle cx="72" cy="515" r="60" fill="url(#glow)"/>
