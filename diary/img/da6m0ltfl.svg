  <rect x="370" y="190" width="60" height="50" fill="#55575e" stroke="#15171c" stroke-width="2.5"/>
  <path d="M380,240 L380,212 Q380,200 392,200 Q404,200 404,212 L404,240 Z" fill="#1b1d24"/>
  <path d="M414,240 L414,212 Q414,200 420,200 Q426,200 426,212 L426,240 Z" fill="#1b1d24"/>
  <circle cx="400" cy="272" r="22" fill="#f1ecd9" stroke="#15171c" stroke-width="2.5"/>
  <line x1="400" y1="272" x2="400" y2="256" stroke="#15171c" stroke-width="2.5"/>
  <line x1="400" y1="272" x2="413" y2="276" stroke="#15171c" stroke-width="2"/>
  <rect x="388" y="320" width="24" height="48" fill="#262a33" stroke="#15171c" stroke-width="2"/>
  <line x1="362" y1="300" x2="438" y2="300" stroke="#15171c" stroke-width="1.5" opacity="0.5"/>
  <line x1="362" y1="350" x2="438" y2="350" stroke="#15171c" stroke-width="1.5" opacity="0.5"/>

  <!-- left cottage -->
