<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2433"/>
      <stop offset="0.6" stop-color="#3a4256"/>
      <stop offset="1" stop-color="#6b6a6c"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e6e0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8e6e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8e6e0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- paper and sky -->
