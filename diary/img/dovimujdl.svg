<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e6dc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e9e6dc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fogLow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e4e1d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e4e1d6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#f4efe3"/>

  <!-- distant village silhouettes in fog -->
  <g fill="#b9b8b0" stroke="#3a3a38" stroke-width="2">
    <path d="M40 430 L40 330 L90 330 L90 300 L120 300 L120 340 L150 340 L150 420 Z"/>
    <path d="M620 420 L620 310 L670 310 L670 270 L700 270 L700 360 L760 360 L760 420 Z"/>
    <path d="M220 420 L220 350 L260 350 L260 320 L300 320 L300 420 Z"/>
  </g>
  <rect x="0" y="330" width="800" height="120" fill="url(#fog)"/>

  <!-- cobbled floor -->
  <g fill="#d8d1bf" stroke="#3a3a38" stroke-width="2.5">
    <rect x="30" y="610" width="90" height="44" rx="14"/>
    <rect x="130" y="610" width="110" height="44" rx="14"/>
    <rect x="250" y="610" width="95" height="44" rx="14"/>
    <rect x="355" y="610" width="105" height="44" rx="14"/>
    <rect x="470" y="610" width="90" height="44" rx="14"/>
    <rect x="570" y="610" width="115" height="44" rx="14"/>
    <rect x="695" y="610" width="90" height="44" rx="14"/>
    <rect x="70" y="666" width="100" height="44" rx="14"/>
    <rect x="180" y="666" width="120" height="44" rx="14"/>
    <rect x="310" y="666" width="90" height="44" rx="14"/>
    <rect x="410" y="666" width="115" height="44" rx="14"/>
    <rect x="535" y="666" width="100" height="44" rx="14"/>
    <rect x="645" y="666" width="120" height="44" rx="14"/>
    <rect x="20" y="722" width="120" height="50" rx="14"/>
    <rect x="150" y="722" width="95" height="50" rx="14"/>
    <rect x="255" y="722" width="130" height="50" rx="14"/>
    <rect x="395" y="722" width="100" height="50" rx="14"/>
    <rect x="505" y="722" width="125" height="50" rx="14"/>
    <rect x="640" y="722" width="140" height="50" rx="14"/>
  </g>
  <rect x="0" y="560" width="800" height="240" fill="url(#fogLow)" opacity="0.6"/>

  <!-- shadow under mouse -->
  <ellipse cx="400" cy="600" rx="230" ry="26" fill="#6d6a60" opacity="0.35"/>

  <!-- mouse, tipped to show underside -->
  <g transform="rotate(-12 400 400)" stroke="#1f1f1e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- tail -->
    <path d="M580 400 C640 380 670 340 705 355 C730 366 712 392 690 384" fill="none" stroke="#1f1f1e" stroke-width="7"/>

    <!-- legs (drawn behind body) -->
    <path d="M280 430 L215 468 L190 540 L168 548" fill="none" stroke="#1f1f1e" stroke-width="12"/>
    <path d="M300 470 L258 530 L232 600" fill="none" stroke="#1f1f1e" stroke-width="12"/>
    <path d="M500 440 L560 480 L580 548 L604 556" fill="none" stroke="#1f1f1e" stroke-width="12"/>
    <path d="M470 470 L500 540 L470 610" fill="none" stroke="#1f1f1e" stroke-width="12"/>
    <path d="M280 430 L215 468 L190 540 L168 548" fill="none" stroke="#9fb0b8" stroke-width="6"/>
    <path d="M300 470 L258 530 L232 600" fill="none" stroke="#9fb0b8" stroke-width="6"/>
    <path d="M500 440 L560 480 L580 548 L604 556" fill="none" stroke="#9fb0b8" stroke-width="6"/>
    <path d="M470 470 L500 540 L470 610" fill="none" stroke="#9fb0b8" stroke-width="6"/>

    <!-- head -->
    <ellipse cx="250" cy="372" rx="58" ry="46" fill="#9fb0b8"/>
    <circle cx="210" cy="346" r="22" fill="#c7b9a4"/>
    <circle cx="232" cy="330" r="16" fill="#c7b9a4"/>
    <circle cx="206" cy="372" r="5" fill="#1f1f1e"/>
    <ellipse cx="188" cy="384" rx="9" ry="6" fill="#c7b9a4"/>

    <!-- body shell -->
    <ellipse cx="410" cy="380" rx="170" ry="108" fill="#9fb0b8"/>
    <ellipse cx="410" cy="380" rx="150" ry="90" fill="#d7c7a2"/>

    <!-- rivets -->
    <g fill="#5b5a52" stroke="none">
      <circle cx="290" cy="320" r="4"/><circle cx="350" cy="296" r="4"/>
      <circle cx="430" cy="290" r="4"/><circle cx="510" cy="300" r="4"/>
      <circle cx="560" cy="340" r="4"/><circle cx="570" cy="410" r="4"/>
      <circle cx="540" cy="462" r="4"/><circle cx="460" cy="470" r="4"/>
      <circle cx="370" cy="466" r="4"/><circle cx="300" cy="440" r="4"/>
      <circle cx="282" cy="380" r="4"/>
    </g>

    <!-- gears and mainspring drum -->
    <circle cx="335" cy="375" r="46" fill="#b9a57a" stroke-width="3"/>
    <circle cx="335" cy="375" r="46" fill="none" stroke="#1f1f1e" stroke-width="10" stroke-dasharray="6 9"/>
    <circle cx="335" cy="375" r="14" fill="#f4efe3"/>
    <circle cx="465" cy="392" r="32" fill="#b9a57a" stroke-width="3"/>
    <circle cx="465" cy="392" r="18" fill="none" stroke="#1f1f1e" stroke-width="2"/>
    <circle cx="465" cy="392" r="6" fill="#1f1f1e"/>

    <!-- connecting rods from gears to legs -->
    <path d="M335 375 L290 430 L218 468" fill="none" stroke="#1f1f1e" stroke-width="6"/>
    <path d="M335 375 L330 430 L258 530" fill="none" stroke="#1f1f1e" stroke-width="6"/>
    <path d="M465 392 L500 440 L560 480" fill="none" stroke="#1f1f1e" stroke-width="6"/>
    <path d="M465 392 L470 470 L500 540" fill="none" stroke="#1f1f1e" stroke-width="6"/>
    <circle cx="290" cy="430" r="6" fill="#f4efe3"/>
    <circle cx="218" cy="468" r="6" fill="#f4efe3"/>
    <circle cx="258" cy="530" r="6" fill="#f4efe3"/>
    <circle cx="560" cy="480" r="6" fill="#f4efe3"/>
    <circle cx="500" cy="540" r="6" fill="#f4efe3"/>

    <!-- winding key on side -->
    <rect x="560" y="372" width="28" height="18" fill="#b9a57a" rx="3"/>
    <circle cx="594" cy="381" r="12" fill="#b9a57a"/>
    <circle cx="594" cy="381" r="4" fill="#1f1f1e"/>

    <!-- base seam -->
    <path d="M300 330 Q410 310 520 340" fill="none" stroke="#1f1f1e" stroke-width="2.5"/>
  </g>

  <!-- signature -->
  <text x="758" y="782" font-family="serif" font-size="22" fill="#1f1f1e" text-anchor="end">P.</text>
</svg>