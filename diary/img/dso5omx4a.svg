<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f4efe2"/>
  <!-- distant trees in fog -->
  <g fill="#b9c4b0" stroke="#2b2b2b" stroke-width="2">
    <ellipse cx="120" cy="300" rx="60" ry="70"/>
    <ellipse cx="260" cy="280" rx="50" ry="60"/>
    <ellipse cx="620" cy="290" rx="70" ry="80"/>
    <ellipse cx="730" cy="320" rx="50" ry="55"/>
  </g>
  <!-- grass green -->
  <rect x="0" y="380" width="800" height="420" fill="#a9c28a"/>
  <path d="M0 380 Q400 360 800 380" fill="none" stroke="#2b2b2b" stroke-width="2"/>
  <!-- fog bands -->
  <g fill="#f4efe2" opacity="0.7">
    <rect x="0" y="330" width="800" height="40"/>
    <rect x="0" y="420" width="800" height="30"/>
  </g>
  <!-- pond -->
  <ellipse cx="400" cy="560" rx="230" ry="90" fill="#7fa9b5" stroke="#2b2b2b" stroke-width="3"/>
  <g fill="none" stroke="#e9f2f3" stroke-width="3" stroke-linecap="round">
    <ellipse cx="360" cy="550" rx="90" ry="22"/>
    <ellipse cx="470" cy="585" rx="60" ry="14"/>
    <path d="M250 575 q20 -8 40 0"/>
  </g>
  <!-- fish splash ripples -->
  <g fill="none" stroke="#2b2b2b" stroke-width="2">
    <ellipse cx="450" cy="520" rx="34" ry="8"/>
    <ellipse cx="450" cy="520" rx="56" ry="13"/>
  </g>
  <!-- sign post -->
  <rect x="192" y="420" width="12" height="130" fill="#7a5a3a" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="110" y="360" width="236" height="78" rx="6" fill="#e8d9b0" stroke="#2b2b2b" stroke-width="3"/>
  <text x="228" y="392" text-anchor="middle" font-family="serif" font-size="22" fill="#2b2b2b">Welcome to</text>
  <text x="228" y="422" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#2b2b2b">Mossbrook</text>
  <!-- fishing line and rod tip -->
  <path d="M705 40 Q650 160 617 290" fill="none" stroke="#2b2b2b" stroke-width="2"/>
  <path d="M700 36 L720 20" stroke="#5a4030" stroke-width="5" stroke-linecap="round"/>
  <!-- caught fish -->
  <g transform="translate(560 330) rotate(-35)" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round">
    <polygon points="-68,0 -105,-28 -105,28" fill="#e08a3c"/>
    <path d="M-20,-30 Q0,-62 30,-30 Z" fill="#e08a3c"/>
    <ellipse cx="0" cy="0" rx="70" ry="32" fill="#f0a858"/>
    <circle cx="40" cy="-8" r="6" fill="#2b2b2b"/>
    <path d="M62 4 Q68 8 58 12" fill="none" stroke-width="2"/>
    <path d="M-10,-2 Q-2,10 -14,22" fill="none" stroke-width="2"/>
  </g>
  <!-- cobbles in foreground -->
  <g fill="#c9c0ac" stroke="#2b2b2b" stroke-width="2">
    <ellipse cx="60" cy="700" rx="40" ry="18"/>
    <ellipse cx="150" cy="690" rx="36" ry="16"/>
    <ellipse cx="240" cy="705" rx="42" ry="18"/>
    <ellipse cx="340" cy="692" rx="38" ry="16"/>
    <ellipse cx="450" cy="700" rx="40" ry="17"/>
    <ellipse cx="545" cy="688" rx="36" ry="16"/>
    <ellipse cx="640" cy="704" rx="42" ry="18"/>
    <ellipse cx="740" cy="692" rx="38" ry="16"/>
    <ellipse cx="100" cy="760" rx="44" ry="19"/>
    <ellipse cx="210" cy="772" rx="40" ry="17"/>
    <ellipse cx="320" cy="758" rx="42" ry="18"/>
    <ellipse cx="430" cy="776" rx="38" ry="16"/>
    <ellipse cx="535" cy="762" rx="44" ry="19"/>
    <ellipse cx="650" cy="778" rx="40" ry="17"/>
    <ellipse cx="755" cy="760" rx="40" ry="18"/>
  </g>
  <!-- signature -->
  <text x="772" y="782" text-anchor="end" font-family="serif" font-size="26" fill="#2b2b2b">P.</text>
</svg>