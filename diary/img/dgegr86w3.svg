<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and wall -->
  <rect x="0" y="0" width="800" height="800" fill="#f4ecd8"/>
  <rect x="0" y="0" width="800" height="760" fill="#efe3c6"/>
  <rect x="0" y="760" width="800" height="40" fill="#a88a66" stroke="#2a2420" stroke-width="4"/>

  <!-- window with fog and lane -->
  <rect x="470" y="90" width="260" height="240" fill="#dfe7ea"/>
  <rect x="470" y="180" width="40" height="150" fill="#b7c2c6"/>
  <rect x="690" y="150" width="40" height="180" fill="#b7c2c6"/>
  <polygon points="520,330 680,330 600,200 560,200" fill="#9aa3a6"/>
  <g stroke="#6d777a" stroke-width="2" fill="none">
    <path d="M540 300 h30 M620 300 h30 M575 270 h20 M605 240 h16 M545 318 h40 M630 318 h30"/>
  </g>
  <rect x="480" y="230" width="240" height="22" fill="#f4f7f8" opacity="0.7"/>
  <rect x="480" y="280" width="240" height="18" fill="#f4f7f8" opacity="0.6"/>
  <rect x="470" y="90" width="260" height="240" fill="none" stroke="#2a2420" stroke-width="8"/>
  <line x1="600" y1="90" x2="600" y2="330" stroke="#2a2420" stroke-width="6"/>
  <line x1="470" y1="210" x2="730" y2="210" stroke="#2a2420" stroke-width="6"/>

  <!-- cupboard -->
  <rect x="50" y="330" width="260" height="300" fill="#9c7a55" stroke="#2a2420" stroke-width="4"/>
  <line x1="180" y1="330" x2="180" y2="630" stroke="#2a2420" stroke-width="4"/>
  <line x1="50" y1="480" x2="310" y2="480" stroke="#2a2420" stroke-width="4"/>
  <circle cx="170" cy="480" r="4" fill="#2a2420"/>
  <circle cx="190" cy="480" r="4" fill="#2a2420"/>

  <!-- four tins of sardines on shelf -->
  <g stroke="#2a2420" stroke-width="3">
    <rect x="75" y="425" width="50" height="55" rx="6" fill="#c8d3d8"/>
    <rect x="130" y="425" width="50" height="55" rx="6" fill="#c8d3d8"/>
    <rect x="185" y="425" width="50" height="55" rx="6" fill="#c8d3d8"/>
    <rect x="240" y="425" width="50" height="55" rx="6" fill="#c8d3d8"/>
    <rect x="75" y="440" width="50" height="22" fill="#d9472b"/>
    <rect x="130" y="440" width="50" height="22" fill="#d9472b"/>
    <rect x="185" y="440" width="50" height="22" fill="#d9472b"/>
    <rect x="240" y="440" width="50" height="22" fill="#d9472b"/>
  </g>
  <g fill="#f4ecd8" stroke="#2a2420" stroke-width="1.5">
    <path d="M84 451 q6 -6 14 0 q-6 6 -14 0 z"/>
    <path d="M139 451 q6 -6 14 0 q-6 6 -14 0 z"/>
    <path d="M194 451 q6 -6 14 0 q-6 6 -14 0 z"/>
    <path d="M249 451 q6 -6 14 0 q-6 6 -14 0 z"/>
  </g>

  <!-- desk -->
  <polygon points="340,560 760,560 790,610 310,610" fill="#8a6a48" stroke="#2a2420" stroke-width="4"/>
  <rect x="310" y="610" width="480" height="22" fill="#6b4f35" stroke="#2a2420" stroke-width="4"/>
  <rect x="340" y="632" width="18" height="128" fill="#6b4f35" stroke="#2a2420" stroke-width="3"/>
  <rect x="740" y="632" width="18" height="128" fill="#6b4f35" stroke="#2a2420" stroke-width="3"/>

  <!-- paper -->
  <polygon points="380,575 520,572 528,598 388,601" fill="#fffdf4" stroke="#2a2420" stroke-width="3"/>
  <path d="M395 583 H500 M397 592 H510" stroke="#8a8a8a" stroke-width="2" fill="none"/>

  <!-- pencils -->
  <g stroke="#2a2420" stroke-width="2">
    <line x1="545" y1="580" x2="650" y2="572" stroke="#e0b020" stroke-width="8"/>
    <line x1="545" y1="592" x2="650" y2="586" stroke="#c9463d" stroke-width="8"/>
    <line x1="545" y1="604" x2="650" y2="600" stroke="#3f7f5a" stroke-width="8"/>
  </g>

  <!-- old computer -->
  <rect x="640" y="440" width="120" height="110" rx="8" fill="#5b5b5b" stroke="#2a2420" stroke-width="4"/>
  <rect x="654" y="455" width="92" height="76" fill="#a8c8b0" stroke="#2a2420" stroke-width="2"/>
  <rect x="680" y="550" width="40" height="12" fill="#5b5b5b" stroke="#2a2420" stroke-width="3"/>
  <rect x="660" y="562" width="80" height="6" fill="#5b5b5b" stroke="#2a2420" stroke-width="3"/>

  <!-- the fish caught in the pond, lying on the desk -->
  <path d="M428 592 L455 576 L452 592 L455 608 L428 592 Z" fill="#8fb3c9" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="382" cy="592" rx="50" ry="16" fill="#8fb3c9" stroke="#2a2420" stroke-width="3"/>
  <path d="M352 586 Q366 576 380 586" fill="none" stroke="#2a2420" stroke-width="2.5"/>
  <path d="M365 592 Q375 600 388 592" fill="none" stroke="#2a2420" stroke-width="2"/>
  <path d="M370 578 Q382 566 396 578" fill="#c9dfe9" stroke="#2a2420" stroke-width="2"/>
  <circle cx="348" cy="588" r="3.5" fill="#2a2420"/>

  <!-- signature -->
  <g fill="none" stroke="#2a2420" stroke-width="3" stroke-linecap="round">
    <path d="M735 752 V720 H750 Q762 720 762 732 Q762 744 750 744 H735"/>
  </g>
  <circle cx="770" cy="752" r="3" fill="#2a2420"/>
</svg>