<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cobbles" width="60" height="36" patternUnits="userSpaceOnUse">
      <ellipse cx="15" cy="10" rx="13" ry="8" fill="#b7b09c" stroke="#1d1a16" stroke-width="2"/>
      <ellipse cx="45" cy="10" rx="13" ry="8" fill="#a9a390" stroke="#1d1a16" stroke-width="2"/>
      <ellipse cx="30" cy="28" rx="13" ry="8" fill="#bdb6a2" stroke="#1d1a16" stroke-width="2"/>
      <ellipse cx="0" cy="28" rx="10" ry="6" fill="#a9a390" stroke="#1d1a16" stroke-width="2"/>
      <ellipse cx="60" cy="28" rx="10" ry="6" fill="#a9a390" stroke="#1d1a16" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#ece6d6"/>

  <!-- distant green fading into fog -->
  <rect x="0" y="470" width="800" height="90" fill="#c4cdb4"/>

  <!-- village green with cobbled path -->
  <rect x="0" y="580" width="800" height="220" fill="#9aae86"/>
  <path d="M0 610 Q400 590 800 615 L800 800 L0 800 Z" fill="url(#cobbles)" opacity="0.9"/>
  <path d="M0 610 Q400 590 800 615" fill="none" stroke="#1d1a16" stroke-width="3"/>

  <!-- bell tower -->
  <rect x="590" y="180" width="120" height="400" fill="#b9a88a" stroke="#1d1a16" stroke-width="3"/>
  <polygon points="572,184 650,80 728,184" fill="#5b3d24" stroke="#1d1a16" stroke-width="3"/>
  <line x1="650" y1="80" x2="650" y2="58" stroke="#1d1a16" stroke-width="3"/>
  <circle cx="650" cy="260" r="42" fill="#f7f1e0" stroke="#1d1a16" stroke-width="5"/>
  <line x1="650" y1="260" x2="650" y2="232" stroke="#1d1a16" stroke-width="4" stroke-linecap="round"/>
  <line x1="650" y1="260" x2="672" y2="270" stroke="#1d1a16" stroke-width="4" stroke-linecap="round"/>
  <polyline points="638,226 646,242 636,252 652,270 643,286 656,300" fill="none" stroke="#1d1a16" stroke-width="2.5"/>
  <rect x="620" y="330" width="60" height="40" fill="#3a3a3a" stroke="#1d1a16" stroke-width="3"/>
  <rect x="630" y="520" width="40" height="60" fill="#5b3d24" stroke="#1d1a16" stroke-width="3"/>
  <line x1="650" y1="520" x2="650" y2="580" stroke="#1d1a16" stroke-width="2"/>

  <!-- welcome sign post -->
  <rect x="248" y="300" width="24" height="340" fill="#6b4a2e" stroke="#1d1a16" stroke-width="3"/>

  <!-- brass chains -->
  <line x1="200" y1="330" x2="200" y2="382" stroke="#b8924a" stroke-width="4" stroke-dasharray="6 3"/>
  <line x1="320" y1="330" x2="320" y2="382" stroke="#b8924a" stroke-width="4" stroke-dasharray="6 3"/>

  <!-- cream board with green rim -->
  <rect x="160" y="230" width="200" height="100" rx="14" fill="#f3ead2" stroke="#3f6b3c" stroke-width="12"/>
  <rect x="160" y="230" width="200" height="100" rx="14" fill="none" stroke="#1d1a16" stroke-width="2"/>
  <text x="260" y="289" text-anchor="middle" font-family="serif" font-size="18" fill="#2a3a2a">Welcome to Mossville</text>

  <!-- pointed roof cap -->
  <polygon points="168,232 260,186 352,232" fill="#5b3d24" stroke="#1d1a16" stroke-width="3"/>

  <!-- moss at base -->
  <ellipse cx="236" cy="628" rx="22" ry="10" fill="#4d7a3a" stroke="#1d1a16" stroke-width="2"/>
  <ellipse cx="282" cy="634" rx="18" ry="9" fill="#5f8f44" stroke="#1d1a16" stroke-width="2"/>
  <ellipse cx="256" cy="640" rx="26" ry="8" fill="#3f6b3c" stroke="#1d1a16" stroke-width="2"/>

  <!-- fog bands -->
  <rect x="0" y="400" width="800" height="50" fill="#f2efe6" opacity="0.6"/>
  <rect x="0" y="540" width="800" height="40" fill="#f2efe6" opacity="0.5"/>
  <rect x="0" y="130" width="800" height="60" fill="#f2efe6" opacity="0.45"/>

  <!-- signature -->
  <text x="752" y="782" text-anchor="end" font-family="serif" font-size="20" fill="#1d1a16">P.</text>
</svg>