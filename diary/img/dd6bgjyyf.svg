<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f3efe4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb3b5"/>
      <stop offset="1" stop-color="#6f9598"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#efe9da"/>

  <!-- distant fog and trees -->
  <rect x="0" y="180" width="800" height="200" fill="#dcd9cc"/>
  <ellipse cx="120" cy="330" rx="110" ry="60" fill="#c9cfc0"/>
  <ellipse cx="640" cy="320" rx="130" ry="70" fill="#c9cfc0"/>

  <!-- green -->
  <path d="M0 430 Q200 410 400 425 T800 420 L800 800 L0 800 Z" fill="#9db889" stroke="#2b2b2b" stroke-width="2"/>
  <path d="M0 430 Q200 410 400 425 T800 420" fill="none" stroke="#2b2b2b" stroke-width="2"/>

  <!-- cobbled path from foreground to pond -->
  <path d="M300 800 L360 640 Q370 615 395 612 L470 612 Q490 620 480 650 L450 800 Z" fill="#c9c0ab" stroke="#2b2b2b" stroke-width="2"/>
  <g fill="#b3a993" stroke="#2b2b2b" stroke-width="1.2">
    <ellipse cx="330" cy="760" rx="14" ry="8"/>
    <ellipse cx="370" cy="740" rx="12" ry="7"/>
    <ellipse cx="410" cy="760" rx="14" ry="8"/>
    <ellipse cx="350" cy="710" rx="11" ry="6"/>
    <ellipse cx="395" cy="695" rx="11" ry="6"/>
    <ellipse cx="435" cy="720" rx="12" ry="7"/>
    <ellipse cx="455" cy="775" rx="13" ry="7"/>
    <ellipse cx="310" cy="785" rx="10" ry="6"/>
    <ellipse cx="380" cy="665" rx="10" ry="5"/>
    <ellipse cx="420" cy="650" rx="10" ry="5"/>
    <ellipse cx="445" cy="680" rx="10" ry="5"/>
  </g>

  <!-- pond -->
  <ellipse cx="430" cy="580" rx="196" ry="66" fill="#8a8373" stroke="#2b2b2b" stroke-width="2"/>
  <ellipse cx="430" cy="580" rx="182" ry="56" fill="url(#waterG)" stroke="#2b2b2b" stroke-width="1.5"/>
  <g fill="none" stroke="#e9f1ee" stroke-width="1.5" opacity="0.8">
    <ellipse cx="400" cy="575" rx="60" ry="12"/>
    <ellipse cx="400" cy="575" rx="95" ry="22"/>
    <ellipse cx="455" cy="595" rx="40" ry="8"/>
  </g>
  <!-- reeds on pond edge -->
  <g stroke="#2b2b2b" stroke-width="1.5" fill="#6f8a5a">
    <path d="M250 560 L246 528 M252 560 L258 524"/>
    <path d="M262 566 L262 536"/>
    <path d="M244 566 L238 540"/>
  </g>

  <!-- fish-diving spot: flat stone ledge at water's edge -->
  <path d="M560 540 L642 532 L650 546 L570 556 Z" fill="#b9b1a0" stroke="#2b2b2b" stroke-width="2"/>
  <path d="M570 556 L650 546 L650 556 L572 566 Z" fill="#8a8373" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- jumping fish and splash -->
  <path d="M520 552 Q528 514 548 506 Q542 524 552 540 Q536 548 520 552 Z" fill="#d98b4a" stroke="#2b2b2b" stroke-width="1.5"/>
  <circle cx="540" cy="516" r="2" fill="#2b2b2b"/>
  <path d="M508 566 Q520 560 530 566 M550 570 Q562 562 574 572" fill="none" stroke="#e9f1ee" stroke-width="2"/>
  <ellipse cx="530" cy="574" rx="26" ry="6" fill="none" stroke="#e9f1ee" stroke-width="1.5"/>

  <!-- signpost -->
  <rect x="243" y="370" width="14" height="140" fill="#6b4a2e" stroke="#2b2b2b" stroke-width="2"/>
  <!-- moss at base -->
  <g fill="#5f8a4a" stroke="#2b2b2b" stroke-width="1">
    <ellipse cx="240" cy="506" rx="12" ry="6"/>
    <ellipse cx="262" cy="510" rx="10" ry="5"/>
    <ellipse cx="252" cy="498" rx="7" ry="4"/>
  </g>

  <!-- dangling brass chains -->
  <g stroke="#b8953a" stroke-width="3" fill="none">
    <path d="M205 370 L205 400"/>
    <path d="M295 370 L295 400"/>
  </g>
  <g fill="none" stroke="#b8953a" stroke-width="2.5">
    <ellipse cx="205" cy="376" rx="3" ry="5"/>
    <ellipse cx="205" cy="386" rx="3" ry="5"/>
    <ellipse cx="205" cy="396" rx="3" ry="5"/>
    <ellipse cx="295" cy="376" rx="3" ry="5"/>
    <ellipse cx="295" cy="386" rx="3" ry="5"/>
    <ellipse cx="295" cy="396" rx="3" ry="5"/>
  </g>

  <!-- board -->
  <rect x="180" y="270" width="140" height="100" rx="14" fill="#2b2b2b" transform="translate(4,4)" opacity="0.25"/>
  <rect x="180" y="270" width="140" height="100" rx="14" fill="#f4ecd2" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="188" y="278" width="124" height="84" rx="9" fill="none" stroke="#4f7a4a" stroke-width="8"/>
  <text x="250" y="322" text-anchor="middle" font-family="serif" font-size="15" fill="#2b2b2b">Welcome to</text>
  <text x="250" y="344" text-anchor="middle" font-family="serif" font-size="17" font-weight="bold" fill="#2b2b2b">Mossville</text>

  <!-- small pointed roof cap -->
  <path d="M176 272 L250 238 L324 272 Z" fill="#4f6b45" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"/>

  <!-- fog bands across the scene -->
  <rect x="0" y="380" width="800" height="90" fill="url(#fogG)" opacity="0.7"/>
  <rect x="0" y="520" width="800" height="60" fill="url(#fogG)" opacity="0.35"/>
  <ellipse cx="120" cy="460" rx="180" ry="26" fill="#f3efe4" opacity="0.55"/>
  <ellipse cx="700" cy="410" rx="170" ry="22" fill="#f3efe4" opacity="0.6"/>

  <!-- signature -->
  <text x="762" y="780" text-anchor="end" font-family="serif" font-size="18" fill="#2b2b2b">P.</text>
</svg>