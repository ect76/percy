<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253049"/>
      <stop offset="0.55" stop-color="#6b5a6e"/>
      <stop offset="0.75" stop-color="#d9915e"/>
      <stop offset="1" stop-color="#e8b57a"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e4dc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e9e4dc" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e9e4dc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5f6b"/>
      <stop offset="1" stop-color="#2e3139"/>
    </linearGradient>
  </defs>

  <!-- dusk sky -->
  <rect x="0" y="0" width="800" height="800" fill="url(#sky)"/>

  <!-- distant rooftops in fog -->
  <g fill="#4c4658" stroke="#1d1b24" stroke-width="2">
    <rect x="300" y="350" width="70" height="90"/>
    <polygon points="300,350 335,322 370,350"/>
    <rect x="480" y="352" width="60" height="88"/>
    <polygon points="480,352 510,326 540,352"/>
  </g>

  <!-- narrow bell tower at end of lane -->
  <g stroke="#17161c" stroke-width="3" stroke-linejoin="round">
    <rect x="407" y="230" width="36" height="200" fill="#3f3d4d"/>
    <polygon points="403,232 425,158 447,232" fill="#2f2e3a"/>
    <circle cx="425" cy="270" r="12" fill="#e9dcc0"/>
    <path d="M425 270 L425 262 M425 270 L431 274" stroke="#17161c" stroke-width="2" fill="none"/>
    <rect x="413" y="300" width="24" height="30" fill="#17161c"/>
    <rect x="413" y="350" width="24" height="18" fill="#17161c"/>
  </g>

  <!-- right-hand cottage wall -->
  <g stroke="#17161c" stroke-width="3" stroke-linejoin="round">
    <polygon points="600,800 800,800 800,300 600,400" fill="#59493f"/>
    <rect x="640" y="520" width="50" height="70" fill="#2a2420"/>
    <rect x="720" y="470" width="40" height="60" fill="#2a2420"/>
  </g>

  <!-- lane, wet cobbles -->
  <polygon points="250,800 640,800 455,430 395,430" fill="url(#lane)" stroke="#17161c" stroke-width="3"/>
  <!-- reflection of tower light on wet stones -->
  <g fill="#e8b57a" opacity="0.45">
    <polygon points="418,435 432,435 470,800 380,800"/>
  </g>
  <g fill="none" stroke="#17161c" stroke-width="2" opacity="0.7">
    <ellipse cx="420" cy="455" rx="10" ry="4"/>
    <ellipse cx="380" cy="520" rx="22" ry="7"/>
    <ellipse cx="470" cy="515" rx="18" ry="6"/>
    <ellipse cx="340" cy="610" rx="34" ry="11"/>
    <ellipse cx="520" cy="620" rx="30" ry="10"/>
    <ellipse cx="300" cy="730" rx="48" ry="16"/>
    <ellipse cx="560" cy="740" rx="44" ry="15"/>
  </g>

  <!-- cottage (left foreground) -->
  <g stroke="#17161c" stroke-width="3" stroke-linejoin="round">
    <polygon points="-10,330 120,240 250,330 250,800 -10,800" fill="#c9b49a"/>
    <polygon points="-20,335 120,240 260,335 250,352 120,266 -10,352" fill="#4a3a36"/>
    <path d="M70 640 L70 470 Q70 420 120 420 Q170 420 170 470 L170 640 Z" fill="#3b2b25"/>
    <rect x="40" y="640" width="160" height="22" fill="#9d9488"/>
    <rect x="28" y="662" width="184" height="26" fill="#8a8277"/>
    <rect x="200" y="380" width="22" height="30" fill="#f2c173"/>
  </g>
  <!-- lamp glow beside door -->
  <circle cx="211" cy="395" r="60" fill="#f2c173" opacity="0.25"/>

  <!-- falling rain -->
  <g stroke="#dfe6ef" stroke-width="1.5" opacity="0.5">
    <line x1="90" y1="60" x2="78" y2="100"/>
    <line x1="180" y1="120" x2="168" y2="160"/>
    <line x1="300" y1="40" x2="288" y2="80"/>
    <line x1="520" y1="90" x2="508" y2="130"/>
    <line x1="700" y1="50" x2="688" y2="90"/>
    <line x1="640" y1="200" x2="628" y2="240"/>
    <line x1="750" y1="200" x2="738" y2="240"/>
    <line x1="60" y1="250" x2="48" y2="290"/>
    <line x1="330" y1="180" x2="318" y2="220"/>
    <line x1="600" y1="560" x2="584" y2="610"/>
    <line x1="720" y1="640" x2="704" y2="690"/>
    <line x1="120" y1="720" x2="104" y2="770"/>
    <line x1="470" y1="700" x2="454" y2="750"/>
  </g>

  <!-- fog bands -->
  <rect x="0" y="330" width="800" height="150" fill="url(#fog)"/>
  <rect x="0" y="450" width="800" height="120" fill="url(#fog)" opacity="0.6"/>

  <!-- signature -->
  <text x="752" y="780" font-size="22" fill="#f4eee4" opacity="0.85">P.</text>
</svg>