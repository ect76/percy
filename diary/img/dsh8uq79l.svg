  <rect x="0" y="690" width="800" height="40" fill="#e6ecee" opacity="0.45"/>
  <!-- ink hatching on wall -->
  <path d="M40 780 L780 780" stroke="#2a2420" stroke-width="3" fill="none"/>
  <!-- signature P. -->
  <g stroke="#2a2420" stroke-width="2.5" fill="none">
    <path d="M735 745 V770 M735 745 H743 A6 6 0 0 1 743 757 H735"/>
  </g>
  <circle cx="750" cy="770" r="2" fill="#2a2420"/>
