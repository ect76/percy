  <g fill="#b9ad98" stroke="#2a2420" stroke-width="2.5">
    <ellipse cx="200" cy="620" rx="60" ry="22"/>
    <ellipse cx="320" cy="640" rx="70" ry="24"/>
    <ellipse cx="460" cy="620" rx="55" ry="20"/>
    <ellipse cx="600" cy="650" rx="65" ry="22"/>
    <ellipse cx="140" cy="690" rx="70" ry="24"/>
    <ellipse cx="290" cy="720" rx="80" ry="26"/>
    <ellipse cx="470" cy="705" rx="70" ry="24"/>
    <ellipse cx="640" cy="725" rx="70" ry="25"/>
  </g>
  <!-- fog band across floor -->
