<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>

  <!-- distant fog banks -->
  <rect x="0" y="150" width="800" height="60" fill="#ffffff" opacity="0.5"/>
  <rect x="0" y="560" width="800" height="50" fill="#ffffff" opacity="0.45"/>

  <!-- cobbled ground -->
  <rect x="0" y="640" width="800" height="160" fill="#c4bdad"/>
  <g fill="#b3ab99" stroke="#2b2622" stroke-width="2">
    <ellipse cx="120" cy="690" rx="34" ry="14"/>
    <ellipse cx="250" cy="712" rx="40" ry="15"/>
    <ellipse cx="400" cy="690" rx="36" ry="13"/>
    <ellipse cx="545" cy="720" rx="42" ry="15"/>
    <ellipse cx="670" cy="688" rx="34" ry="13"/>
    <ellipse cx="180" cy="760" rx="44" ry="16"/>
    <ellipse cx="330" cy="772" rx="38" ry="14"/>
    <ellipse cx="480" cy="758" rx="40" ry="14"/>
    <ellipse cx="640" cy="775" rx="46" ry="15"/>
  </g>

  <!-- chimney smoke -->
  <g fill="none" stroke="#9c9890" stroke-width="14" stroke-linecap="round" opacity="0.7">
    <path d="M 502 200 C 480 170, 530 150, 505 115 C 490 95, 520 80, 500 50"/>
    <path d="M 512 200 C 540 175, 490 145, 525 120"/>
  </g>

  <!-- chimney -->
  <rect x="480" y="200" width="40" height="72" fill="#8a6f5e" stroke="#2b2622" stroke-width="4"/>
  <rect x="474" y="192" width="52" height="12" fill="#6e5649" stroke="#2b2622" stroke-width="3"/>

  <!-- roof -->
  <polygon points="196,342 400,196 604,342" fill="#6d5a4b" stroke="#2b2622" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#2b2622" stroke-width="2" opacity="0.5">
    <line x1="230" y1="320" x2="570" y2="320"/>
    <line x1="260" y1="296" x2="540" y2="296"/>
  </g>

  <!-- walls -->
  <rect x="220" y="340" width="360" height="300" fill="#e8d9bf" stroke="#2b2622" stroke-width="4"/>

  <!-- left window -->
  <rect x="250" y="370" width="60" height="60" fill="#f3e3a0" stroke="#2b2622" stroke-width="4"/>
  <line x1="280" y1="370" x2="280" y2="430" stroke="#2b2622" stroke-width="3"/>
  <line x1="250" y1="400" x2="310" y2="400" stroke="#2b2622" stroke-width="3"/>

  <!-- right window -->
  <rect x="490" y="370" width="60" height="60" fill="#f3e3a0" stroke="#2b2622" stroke-width="4"/>
  <line x1="520" y1="370" x2="520" y2="430" stroke="#2b2622" stroke-width="3"/>
  <line x1="490" y1="400" x2="550" y2="400" stroke="#2b2622" stroke-width="3"/>

  <!-- door -->
  <rect x="370" y="480" width="60" height="160" fill="#5a3d2b" stroke="#2b2622" stroke-width="4"/>
  <circle cx="420" cy="565" r="3.5" fill="#d9b35a"/>
  <rect x="362" y="472" width="76" height="8" fill="#2b2622"/>

  <!-- tin house-number plate reading 4 -->
  <rect x="440" y="428" width="44" height="38" fill="#c9d3d6" stroke="#2b2622" stroke-width="3"/>
  <path d="M 466 435 L 455 452 L 470 452 M 468 435 L 468 459" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="440" y1="428" x2="484" y2="466" stroke="#ffffff" stroke-width="0" />

  <!-- bracket arm for crooked sign -->
  <line x1="222" y1="455" x2="340" y2="455" stroke="#2b2622" stroke-width="6" stroke-linecap="round"/>
  <line x1="226" y1="492" x2="282" y2="455" stroke="#2b2622" stroke-width="5" stroke-linecap="round"/>

  <!-- crooked hanging sign -->
  <g transform="rotate(-9 290 480)">
    <line x1="262" y1="458" x2="262" y2="482" stroke="#2b2622" stroke-width="2.5"/>
    <line x1="318" y1="458" x2="318" y2="482" stroke="#2b2622" stroke-width="2.5"/>
    <rect x="252" y="482" width="76" height="56" fill="#7a5233" stroke="#2b2622" stroke-width="4" stroke-linejoin="round"/>
    <rect x="260" y="490" width="60" height="40" fill="none" stroke="#e3c99a" stroke-width="2"/>
    <path d="M 282 520 A 12 12 0 1 1 300 508 A 9 9 0 1 0 282 520 Z" fill="#e3c99a"/>
  </g>

  <!-- fog rolling over the cottage and street -->
  <rect x="180" y="250" width="440" height="70" fill="#ffffff" opacity="0.45"/>
  <rect x="180" y="420" width="440" height="36" fill="#ffffff" opacity="0.35"/>
  <rect x="0" y="600" width="800" height="50" fill="#ffffff" opacity="0.55"/>
  <rect x="0" y="690" width="800" height="110" fill="#ffffff" opacity="0.2"/>

  <!-- signature P. -->
  <g fill="none" stroke="#2b2622" stroke-width="3" stroke-linecap="round">
    <path d="M 752 738 V 768 M 752 738 H 764 A 8 8 0 0 1 764 754 H 752"/>
  </g>
  <circle cx="773" cy="768" r="2.5" fill="#2b2622"/>
</svg>