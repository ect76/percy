<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbf6e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbf6e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3efe4"/>
  <circle cx="200" cy="170" r="260" fill="url(#glow)"/>

  <!-- distant sky and hills in fog -->
  <rect x="0" y="0" width="800" height="380" fill="#dfe5e8"/>
  <path d="M0 300 Q120 270 230 296 T470 292 T800 280 L800 390 L0 390 Z" fill="#c9d2d6" opacity="0.7"/>

  <!-- bell tower at the end of the lane -->
  <rect x="362" y="190" width="76" height="240" fill="#bdb6a8" stroke="#2b2b2b" stroke-width="2.5"/>
  <rect x="352" y="120" width="96" height="74" fill="#aca597" stroke="#2b2b2b" stroke-width="2.5"/>
  <path d="M350 122 L400 40 L450 122 Z" fill="#6b6f78" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- belfry openings -->
  <path d="M368 150 Q368 136 380 136 Q392 136 392 150 L392 180 L368 180 Z" fill="#4d4a46" stroke="#2b2b2b" stroke-width="1.5"/>
  <path d="M408 150 Q408 136 420 136 Q432 136 432 150 L432 180 L408 180 Z" fill="#4d4a46" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- clock face -->
  <circle cx="400" cy="250" r="30" fill="#fbfaf4" stroke="#2b2b2b" stroke-width="3"/>
  <circle cx="400" cy="250" r="26" fill="none" stroke="#2b2b2b" stroke-width="1"/>
  <line x1="400" y1="250" x2="400" y2="232" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="400" y1="250" x2="413" y2="256" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="400" cy="250" r="2.5" fill="#2b2b2b"/>
  <!-- tower door and stone lines -->
  <path d="M388 430 L388 380 Q388 366 400 366 Q412 366 412 380 L412 430 Z" fill="#7d5c44" stroke="#2b2b2b" stroke-width="2"/>
  <path d="M362 300 H438 M362 340 H438" stroke="#8f887b" stroke-width="1.2"/>

  <!-- small oil tin on the tower step -->
  <rect x="440" y="412" width="24" height="18" rx="2" fill="#b9a27e" stroke="#2b2b2b" stroke-width="1.5"/>
  <ellipse cx="452" cy="412" rx="12" ry="3" fill="#9c4a2b" stroke="#2b2b2b" stroke-width="1.2"/>
  <rect x="442" y="420" width="20" height="5" fill="#fbfaf4" opacity="0.8"/>

  <!-- left cottage -->
  <path d="M0 250 L290 352 L290 530 L0 640 Z" fill="#c9a878" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M0 200 L300 330 L290 352 L0 250 Z" fill="#6b6f78" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cottage window with lamplight -->
  <path d="M50 380 L110 400 L110 470 L50 450 Z" fill="#f2dc9a" stroke="#2b2b2b" stroke-width="2"/>
  <path d="M80 390 L80 460" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- cottage door -->
  <path d="M160 470 L200 482 L200 580 L160 565 Z" fill="#7d5c44" stroke="#2b2b2b" stroke-width="2"/>
  <!-- stone courses -->
  <path d="M0 300 L290 404 M0 350 L290 454 M0 400 L290 504" stroke="#a88a61" stroke-width="1" opacity="0.7" fill="none"/>

  <!-- right wall -->
  <path d="M800 260 L510 370 L510 530 L800 640 Z" fill="#b8b2a6" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M800 310 L510 420 M800 360 L510 470 M800 410 L510 520" stroke="#8f887b" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- lane -->
  <path d="M80 800 L370 430 L430 430 L720 800 Z" fill="#a59c8c" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- cobbles, far to near -->
  <g fill="#8d8473" stroke="#2b2b2b" stroke-width="1">
    <ellipse cx="390" cy="450" rx="5" ry="3"/>
    <ellipse cx="410" cy="462" rx="5" ry="3"/>
    <ellipse cx="350" cy="476" rx="6" ry="3.5"/>
    <ellipse cx="380" cy="486" rx="6" ry="3.5"/>
    <ellipse cx="420" cy="490" rx="6" ry="3.5"/>
    <ellipse cx="340" cy="500" rx="7" ry="4"/>
    <ellipse cx="380" cy="510" rx="7" ry="4"/>
    <ellipse cx="420" cy="512" rx="7" ry="4"/>
    <ellipse cx="460" cy="500" rx="7" ry="4"/>
    <ellipse cx="300" cy="560" rx="9" ry="5"/>
    <ellipse cx="350" cy="566" rx="9" ry="5"/>
    <ellipse cx="400" cy="570" rx="9" ry="5"/>
    <ellipse cx="450" cy="566" rx="9" ry="5"/>
    <ellipse cx="500" cy="560" rx="9" ry="5"/>
    <ellipse cx="240" cy="640" rx="11" ry="6"/>
    <ellipse cx="300" cy="648" rx="11" ry="6"/>
    <ellipse cx="360" cy="652" rx="11" ry="6"/>
    <ellipse cx="420" cy="652" rx="11" ry="6"/>
    <ellipse cx="480" cy="648" rx="11" ry="6"/>
    <ellipse cx="540" cy="640" rx="11" ry="6"/>
    <ellipse cx="180" cy="720" rx="14" ry="8"/>
    <ellipse cx="250" cy="730" rx="14" ry="8"/>
    <ellipse cx="320" cy="736" rx="14" ry="8"/>
    <ellipse cx="400" cy="740" rx="14" ry="8"/>
    <ellipse cx="480" cy="736" rx="14" ry="8"/>
    <ellipse cx="550" cy="730" rx="14" ry="8"/>
    <ellipse cx="620" cy="720" rx="14" ry="8"/>
    <ellipse cx="130" cy="780" rx="18" ry="10"/>
    <ellipse cx="220" cy="784" rx="18" ry="10"/>
    <ellipse cx="320" cy="788" rx="18" ry="10"/>
    <ellipse cx="420" cy="788" rx="18" ry="10"/>
    <ellipse cx="520" cy="784" rx="18" ry="10"/>
    <ellipse cx="620" cy="780" rx="18" ry="10"/>
  </g>

  <!-- fog bands drifting across the scene -->
  <rect x="0" y="330" width="800" height="50" fill="#eef1f2" opacity="0.55"/>
  <rect x="0" y="420" width="800" height="45" fill="#eef1f2" opacity="0.45"/>
  <rect x="0" y="540" width="800" height="60" fill="#eef1f2" opacity="0.35"/>
  <rect x="0" y="650" width="800" height="40" fill="#eef1f2" opacity="0.25"/>

  <!-- signature -->
  <text x="740" y="770" font-size="28" fill="#2b2b2b">P.</text>
</svg>