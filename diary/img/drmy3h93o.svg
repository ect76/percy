<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe4"/>
  <!-- winter sky -->
  <rect x="0" y="0" width="800" height="400" fill="#d6dde0"/>
  <!-- thin low sun -->
  <circle cx="640" cy="290" r="34" fill="#f6e7a6" stroke="#2a2a2a" stroke-width="2"/>
  <!-- distant bare trees -->
  <g fill="none" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round">
    <path d="M300 380 V330 M300 350 L285 335 M300 345 L315 328"/>
    <path d="M520 385 V340 M520 360 L506 346 M520 352 L534 338"/>
    <path d="M610 390 V350 M610 366 L596 354"/>
  </g>
  <!-- bell tower at end of lane -->
  <rect x="380" y="200" width="40" height="140" fill="#b9ab98" stroke="#2a2a2a" stroke-width="2"/>
  <polygon points="374,200 400,132 426,200" fill="#6e6258" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="388" y="214" width="24" height="24" fill="#3d3d3d"/>
  <circle cx="400" cy="262" r="12" fill="#f4efe4" stroke="#2a2a2a" stroke-width="2"/>
  <path d="M400 262 V254 M400 262 L406 266" stroke="#2a2a2a" stroke-width="2" fill="none"/>
  <!-- distant houses on right -->
  <rect x="560" y="420" width="200" height="180" fill="#cfc3ae" stroke="#2a2a2a" stroke-width="2"/>
  <polygon points="550,420 660,350 770,420" fill="#8a6f5c" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="600" y="470" width="30" height="40" fill="#e9dfc9" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="690" y="470" width="30" height="40" fill="#e9dfc9" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- ground -->
  <rect x="0" y="400" width="800" height="400" fill="#c4bba8"/>
  <!-- lane -->
  <polygon points="40,800 760,800 432,340 368,340" fill="#a79c8a" stroke="#2a2a2a" stroke-width="2"/>
  <!-- cobbles -->
  <g fill="#8c8170" stroke="#2a2a2a" stroke-width="1.2">
    <ellipse cx="300" cy="370" rx="8" ry="4"/>
    <ellipse cx="410" cy="375" rx="7" ry="3.5"/>
    <ellipse cx="350" cy="410" rx="9" ry="4.5"/>
    <ellipse cx="450" cy="415" rx="8" ry="4"/>
    <ellipse cx="270" cy="470" rx="11" ry="5"/>
    <ellipse cx="380" cy="480" rx="10" ry="5"/>
    <ellipse cx="500" cy="478" rx="11" ry="5"/>
    <ellipse cx="200" cy="580" rx="16" ry="7"/>
    <ellipse cx="330" cy="600" rx="15" ry="7"/>
    <ellipse cx="480" cy="590" rx="14" ry="6"/>
    <ellipse cx="620" cy="620" rx="18" ry="8"/>
    <ellipse cx="150" cy="720" rx="22" ry="9"/>
    <ellipse cx="340" cy="740" rx="20" ry="9"/>
    <ellipse cx="520" cy="735" rx="21" ry="9"/>
    <ellipse cx="680" cy="760" rx="24" ry="10"/>
  </g>
  <!-- cottage on left -->
  <rect x="40" y="430" width="260" height="260" fill="#e8dcc4" stroke="#2a2a2a" stroke-width="2"/>
  <polygon points="20,434 170,320 320,434" fill="#7a5c4a" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="90" y="500" width="60" height="60" fill="#f2d98a" stroke="#2a2a2a" stroke-width="2"/>
  <path d="M120 500 V560 M90 530 H150" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="210" y="560" width="60" height="130" fill="#5b4636" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="260" cy="628" r="3" fill="#d9c58a"/>
  <!-- garden wall in front -->
  <rect x="0" y="690" width="300" height="20" fill="#b7ab97" stroke="#2a2a2a" stroke-width="2"/>
  <!-- fog bands -->
  <g fill="#f4efe4">
    <rect x="0" y="330" width="800" height="36" opacity="0.7"/>
    <rect x="0" y="372" width="800" height="28" opacity="0.5"/>
    <rect x="0" y="470" width="800" height="22" opacity="0.35"/>
    <rect x="0" y="560" width="800" height="30" opacity="0.2"/>
  </g>
  <!-- signature P. -->
  <g fill="none" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round">
    <path d="M736 764 V724 H748 Q760 724 760 736 Q760 748 748 748 H736"/>
  </g>
  <circle cx="768" cy="764" r="2.5" fill="#2a2a2a"/>
</svg>