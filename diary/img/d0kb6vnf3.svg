<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="fog" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- paper -->
  <rect width="800" height="800" fill="#efe8d8"/>
  <!-- sky -->
  <rect x="0" y="0" width="800" height="380" fill="#dcdcd2"/>
  <!-- distant ground -->
  <rect x="0" y="380" width="800" height="420" fill="#c9c2b0"/>
  <!-- lane -->
  <polygon points="150,800 650,800 430,420 370,420" fill="#b5ad9b" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <!-- cobbles -->
  <g fill="none" stroke="#2a2a2a" stroke-width="1.6" opacity="0.7">
    <ellipse cx="260" cy="760" rx="14" ry="7"/>
    <ellipse cx="330" cy="720" rx="11" ry="5"/>
    <ellipse cx="470" cy="735" rx="13" ry="6"/>
    <ellipse cx="560" cy="770" rx="16" ry="8"/>
    <ellipse cx="200" cy="640" rx="8" ry="4"/>
    <ellipse cx="400" cy="640" rx="9" ry="4"/>
    <ellipse cx="300" cy="590" rx="6" ry="3"/>
    <ellipse cx="455" cy="575" rx="6" ry="3"/>
    <ellipse cx="385" cy="520" rx="4" ry="2"/>
    <ellipse cx="415" cy="500" rx="4" ry="2"/>
    <ellipse cx="350" cy="480" rx="3" ry="1.5"/>
  </g>
  <!-- right-hand houses, faded -->
  <polygon points="800,250 560,345 560,600 800,705" fill="#d6cdbb" stroke="#2a2a2a" stroke-width="2" opacity="0.8"/>
  <polygon points="800,230 800,250 560,345 560,325" fill="#a9a08c" stroke="#2a2a2a" stroke-width="2" opacity="0.8"/>
  <!-- left cottage (Pond Lane cottage) -->
  <polygon points="-10,190 230,300 230,640 -10,680" fill="#c98f6b" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="-10,190 230,300 230,320 -10,205" fill="#7a5a4a" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="60,380 150,402 150,478 60,458" fill="#6f8f9a" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <line x1="105" y1="391" x2="105" y2="468" stroke="#2a2a2a" stroke-width="2.5"/>
  <polygon points="40,520 130,545 130,640 40,625" fill="#6b4a3a" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <!-- bell tower at end of lane -->
  <rect x="370" y="200" width="60" height="230" fill="#a89f8c" stroke="#2a2a2a" stroke-width="3"/>
  <polygon points="364,200 400,148 436,200" fill="#8a7f6c" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <!-- clock face, faint -->
  <circle cx="400" cy="250" r="20" fill="#f1ecdf" opacity="0.6" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M390 236 L396 248 L392 256" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.6"/>
  <path d="M400 250 L413 240 L416 236" fill="none" stroke="#2a2a2a" stroke-width="1.5" opacity="0.6"/>
  <path d="M400 250 L400 240" fill="none" stroke="#2a2a2a" stroke-width="1.5" opacity="0.6"/>
  <!-- pond sign -->
  <rect x="518" y="380" width="6" height="62" fill="#6b4a3a" stroke="#2a2a2a" stroke-width="2"/>
  <polygon points="524,384 580,384 596,394 580,404 524,404" fill="#e0c48a" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="600" cy="478" rx="44" ry="9" fill="#7d9aa0" stroke="#2a2a2a" stroke-width="2"/>
  <!-- fog bands -->
  <g fill="#f4f1ea">
    <ellipse cx="400" cy="345" rx="330" ry="34" opacity="0.7" filter="url(#fog)"/>
    <ellipse cx="400" cy="420" rx="380" ry="40" opacity="0.6" filter="url(#fog)"/>
    <ellipse cx="400" cy="520" rx="420" ry="50" opacity="0.45" filter="url(#fog)"/>
    <ellipse cx="400" cy="640" rx="460" ry="60" opacity="0.3" filter="url(#fog)"/>
  </g>
  <!-- signature -->
  <path d="M742 790 V762 H758 Q768 762 768 771 Q768 780 758 780 H742" fill="none" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="776" cy="790" r="2.5" fill="#2a2a2a"/>
</svg>