<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efeae0"/>
  <!-- sky -->
  <rect x="0" y="0" width="800" height="440" fill="#d7dcdf"/>
  <!-- distant fog band behind tower -->
  <rect x="0" y="300" width="800" height="60" fill="#f3f3f0" opacity="0.7"/>
  <!-- lane -->
  <polygon points="120,800 370,470 430,470 720,800" fill="#b8ab9b" stroke="#222" stroke-width="2.5"/>
  <!-- cobbles: converging rows -->
  <g fill="none" stroke="#5e544b" stroke-width="1.6" opacity="0.8">
    <path d="M190,700 Q400,690 610,700"/>
    <path d="M240,640 Q400,630 560,640"/>
    <path d="M285,590 Q400,582 515,590"/>
    <path d="M325,545 Q400,539 475,545"/>
    <path d="M352,510 Q400,505 448,510"/>
    <path d="M150,760 Q400,745 650,760"/>
  </g>
  <g fill="none" stroke="#5e544b" stroke-width="1.2" opacity="0.6">
    <path d="M300,600 L290,640 M380,540 L372,560 M480,600 L492,640 M420,700 L430,740 M330,700 L318,740 M250,760 L240,790 M560,760 L570,790"/>
  </g>
  <!-- low fog across lane -->
  <rect x="0" y="470" width="800" height="50" fill="#f3f3f0" opacity="0.55"/>
  <rect x="0" y="560" width="800" height="40" fill="#f3f3f0" opacity="0.4"/>
  <!-- left cottage -->
  <rect x="20" y="430" width="160" height="270" fill="#cdb59b" stroke="#222" stroke-width="2.5"/>
  <polygon points="10,432 100,355 190,432" fill="#6b5a4e" stroke="#222" stroke-width="2.5"/>
  <rect x="58" y="488" width="40" height="50" fill="#5f6b70" stroke="#222" stroke-width="2"/>
  <line x1="78" y1="488" x2="78" y2="538" stroke="#222" stroke-width="1.5"/>
  <rect x="120" y="580" width="42" height="120" fill="#4a3b32" stroke="#222" stroke-width="2"/>
  <circle cx="155" cy="642" r="2.5" fill="#d9c38a"/>
  <!-- right row of houses -->
  <rect x="600" y="455" width="200" height="120" fill="#bfb3a3" stroke="#222" stroke-width="2.5"/>
  <rect x="625" y="490" width="30" height="36" fill="#5f6b70" stroke="#222" stroke-width="1.5"/>
  <rect x="690" y="490" width="30" height="36" fill="#5f6b70" stroke="#222" stroke-width="1.5"/>
  <polygon points="595,457 700,410 805,457" fill="#7d7166" stroke="#222" stroke-width="2"/>
  <!-- bell tower at end of lane -->
  <polygon points="368,200 400,138 432,200" fill="#5d5853" stroke="#222" stroke-width="2"/>
  <rect x="366" y="198" width="68" height="54" fill="#7a756f" stroke="#222" stroke-width="2.5"/>
  <rect x="378" y="212" width="10" height="26" fill="#3a3632"/>
  <rect x="412" y="212" width="10" height="26" fill="#3a3632"/>
  <rect x="374" y="250" width="52" height="170" fill="#8a8580" stroke="#222" stroke-width="2.5"/>
  <!-- small grey clock face -->
  <circle cx="400" cy="270" r="16" fill="#a9aeb2" stroke="#222" stroke-width="2"/>
  <line x1="400" y1="270" x2="400" y2="259" stroke="#222" stroke-width="1.8"/>
  <line x1="400" y1="270" x2="408" y2="274" stroke="#222" stroke-width="1.4"/>
  <circle cx="400" cy="270" r="1.8" fill="#222"/>
  <!-- tower door -->
  <path d="M390,420 L390,385 Q400,372 410,385 L410,420 Z" fill="#4a3b32" stroke="#222" stroke-width="2"/>
  <rect x="374" y="250" width="52" height="8" fill="#6f6a64" opacity="0.6"/>
  <!-- wind-blown lines through the fog -->
  <g fill="none" stroke="#5f676b" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M90,300 Q180,285 270,300"/>
    <path d="M520,330 Q620,312 720,330"/>
    <path d="M130,380 Q200,370 260,384"/>
    <path d="M540,392 Q610,380 680,396"/>
    <path d="M60,240 Q150,226 240,240"/>
    <path d="M560,250 Q650,236 740,252"/>
  </g>
  <!-- leaning lamp post on left edge -->
  <line x1="715" y1="800" x2="705" y2="560" stroke="#222" stroke-width="3"/>
  <path d="M705,560 Q700,540 680,545" fill="none" stroke="#222" stroke-width="2.5"/>
  <rect x="668" y="543" width="16" height="12" fill="#e8d9a0" stroke="#222" stroke-width="1.5"/>
  <!-- signature -->
  <text x="752" y="780" font-family="serif" font-size="22" fill="#222">P.</text>
</svg>