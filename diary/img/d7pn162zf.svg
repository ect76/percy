<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd77a" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#f2b653" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f2b653" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0.6" stop-color="#2a2420" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a2420" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4eee0"/>

  <!-- wall -->
  <rect x="20" y="20" width="760" height="620" fill="#c9b99a" stroke="#2a2420" stroke-width="3"/>

  <!-- wall hatching -->
  <g stroke="#a8966f" stroke-width="1.5" opacity="0.6">
    <line x1="40" y1="60" x2="90" y2="20"/>
    <line x1="40" y1="110" x2="140" y2="20"/>
    <line x1="40" y1="160" x2="190" y2="20"/>
    <line x1="60" y1="200" x2="200" y2="60"/>
    <line x1="600" y1="500" x2="760" y2="340"/>
    <line x1="600" y1="560" x2="760" y2="400"/>
    <line x1="600" y1="620" x2="760" y2="460"/>
  </g>

  <!-- small window with fog -->
  <rect x="610" y="70" width="120" height="150" fill="#dfe4e2" stroke="#2a2420" stroke-width="3"/>
  <g stroke="#9aa6a6" stroke-width="2" fill="none">
    <path d="M618 110 Q650 100 680 112 T724 110"/>
    <path d="M618 140 Q650 130 680 142 T724 140"/>
    <path d="M618 170 Q650 160 680 172 T724 170"/>
    <path d="M610 70 V220 M730 70 V220"/>
  </g>
  <line x1="670" y1="70" x2="670" y2="220" stroke="#2a2420" stroke-width="3"/>

  <!-- cupboard frame -->
  <rect x="230" y="170" width="340" height="470" fill="#8a6a46" stroke="#2a2420" stroke-width="4"/>
  <!-- cupboard interior -->
  <rect x="250" y="190" width="300" height="430" fill="#4a3826" stroke="#2a2420" stroke-width="3"/>

  <!-- empty top shelf -->
  <rect x="250" y="330" width="300" height="12" fill="#a07c52" stroke="#2a2420" stroke-width="2.5"/>
  <!-- bare middle shelf (where tins stand) -->
  <rect x="250" y="470" width="300" height="12" fill="#a07c52" stroke="#2a2420" stroke-width="2.5"/>
  <!-- cupboard floor -->
  <rect x="250" y="600" width="300" height="20" fill="#7a5c3a" stroke="#2a2420" stroke-width="2.5"/>

  <!-- open doors -->
  <path d="M230 170 L200 185 L200 625 L230 640 Z" fill="#8a6a46" stroke="#2a2420" stroke-width="3"/>
  <path d="M570 170 L600 185 L600 625 L570 640 Z" fill="#8a6a46" stroke="#2a2420" stroke-width="3"/>

  <!-- seed tin -->
  <rect x="320" y="405" width="72" height="65" fill="#b8473a" stroke="#2a2420" stroke-width="2.5"/>
  <ellipse cx="356" cy="405" rx="36" ry="8" fill="#d9c28a" stroke="#2a2420" stroke-width="2.5"/>
  <rect x="320" y="440" width="72" height="8" fill="#e8d7a8"/>
  <g fill="#e8d7a8" stroke="#2a2420" stroke-width="1">
    <circle cx="334" cy="424" r="3"/>
    <circle cx="350" cy="428" r="3"/>
    <circle cx="368" cy="424" r="3"/>
    <circle cx="380" cy="430" r="3"/>
  </g>

  <!-- sprout tin -->
  <rect x="430" y="400" width="72" height="70" fill="#5f8f4e" stroke="#2a2420" stroke-width="2.5"/>
  <ellipse cx="466" cy="400" rx="36" ry="8" fill="#d9c28a" stroke="#2a2420" stroke-width="2.5"/>
  <path d="M466 448 V420" stroke="#2a2420" stroke-width="2.5" fill="none"/>
  <path d="M466 424 Q448 418 446 402 Q462 404 466 424 Z" fill="#c7e0a6" stroke="#2a2420" stroke-width="2"/>
  <path d="M466 422 Q484 416 488 400 Q470 402 466 422 Z" fill="#c7e0a6" stroke="#2a2420" stroke-width="2"/>

  <!-- small level on the bare shelf -->
  <rect x="520" y="457" width="30" height="13" rx="3" fill="#c9a24a" stroke="#2a2420" stroke-width="2"/>
  <circle cx="535" cy="463" r="3" fill="#f4eee0" stroke="#2a2420" stroke-width="1"/>

  <!-- floor -->
  <rect x="20" y="640" width="760" height="140" fill="#8c7050" stroke="#2a2420" stroke-width="3"/>
  <g stroke="#5e4a33" stroke-width="2" fill="none">
    <line x1="20" y1="680" x2="780" y2="680"/>
    <line x1="20" y1="720" x2="780" y2="720"/>
    <line x1="20" y1="760" x2="780" y2="760"/>
    <line x1="150" y1="640" x2="150" y2="680"/>
    <line x1="420" y1="680" x2="420" y2="720"/>
    <line x1="260" y1="720" x2="260" y2="760"/>
    <line x1="600" y1="720" x2="600" y2="760"/>
  </g>

  <!-- oil lamp on the left -->
  <circle cx="150" cy="380" r="260" fill="url(#lamp)"/>
  <rect x="135" y="520" width="30" height="110" fill="#6b5a48" stroke="#2a2420" stroke-width="2.5"/>
  <ellipse cx="150" cy="520" rx="34" ry="8" fill="#6b5a48" stroke="#2a2420" stroke-width="2.5"/>
  <path d="M120 470 L180 470 L168 415 L132 415 Z" fill="#e7b85a" stroke="#2a2420" stroke-width="2.5"/>
  <ellipse cx="150" cy="440" rx="16" ry="20" fill="#ffe59a" stroke="#2a2420" stroke-width="1.5"/>

  <!-- warm light wash over cupboard -->
  <rect x="230" y="170" width="340" height="470" fill="#ffd77a" opacity="0.12"/>

  <!-- vignette -->
  <rect x="0" y="0" width="800" height="800" fill="url(#vignette)"/>

  <!-- outer paper border -->
  <rect x="8" y="8" width="784" height="784" fill="none" stroke="#2a2420" stroke-width="2"/>

  <!-- signature "P." in corner -->
  <g stroke="#2a2420" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M735 735 V765 M735 735 H746 Q756 735 756 745 Q756 755 746 755 H735"/>
  </g>
  <circle cx="766" cy="764" r="3" fill="#2a2420"/>
</svg>