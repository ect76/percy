<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f4ecd8"/>
  <g fill="#dfe6ea" opacity="0.7">
    <ellipse cx="400" cy="730" rx="420" ry="60"/>
    <ellipse cx="150" cy="680" rx="200" ry="40"/>
    <ellipse cx="660" cy="700" rx="220" ry="50"/>
  </g>
  <g fill="none" stroke="#7d8790" stroke-width="3" opacity="0.6">
    <ellipse cx="260" cy="740" rx="30" ry="12"/>
    <ellipse cx="330" cy="752" rx="28" ry="11"/>
    <ellipse cx="520" cy="745" rx="32" ry="12"/>
    <ellipse cx="600" cy="758" rx="26" ry="10"/>
  </g>

  <!-- legs -->
  <g stroke="#222" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M300 430 L250 500 L220 560"/>
    <path d="M330 470 L300 560 L280 600"/>
    <path d="M490 470 L520 560 L545 600"/>
    <path d="M520 430 L570 500 L600 560"/>
  </g>
  <g fill="#8a969f" stroke="#222" stroke-width="4">
    <ellipse cx="212" cy="570" rx="22" ry="10"/>
    <ellipse cx="272" cy="610" rx="22" ry="10"/>
    <ellipse cx="552" cy="610" rx="22" ry="10"/>
    <ellipse cx="610" cy="570" rx="22" ry="10"/>
  </g>

  <!-- tail -->
  <path d="M215 370 Q120 330 150 250 Q170 200 120 180" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round"/>

  <!-- body underside -->
  <ellipse cx="400" cy="380" rx="190" ry="120" fill="#b9c4cc" stroke="#222" stroke-width="5"/>
  <!-- head -->
  <circle cx="580" cy="360" r="60" fill="#b9c4cc" stroke="#222" stroke-width="5"/>
  <circle cx="600" cy="300" r="20" fill="#e3a7a7" stroke="#222" stroke-width="4"/>
  <circle cx="555" cy="296" r="18" fill="#e3a7a7" stroke="#222" stroke-width="4"/>
  <circle cx="625" cy="345" r="5" fill="#222"/>

  <!-- baseplate -->
  <rect x="290" y="330" width="200" height="100" rx="10" fill="#8a969f" stroke="#222" stroke-width="4"/>

  <!-- ratchet wheel with teeth -->
  <circle cx="360" cy="380" r="38" fill="#c9a24a" stroke="#222" stroke-width="4" stroke-dasharray="8 7"/>
  <circle cx="360" cy="380" r="30" fill="#c9a24a" stroke="#222" stroke-width="3"/>
  <circle cx="360" cy="380" r="7" fill="#222"/>

  <!-- cam on drive -->
  <circle cx="425" cy="380" r="16" fill="#e0b860" stroke="#222" stroke-width="4"/>
  <circle cx="433" cy="380" r="4" fill="#222"/>

  <!-- hypothetical trip lever (dashed, uncertain) -->
  <path d="M425 380 L470 300 L505 312" fill="none" stroke="#b33a3a" stroke-width="5" stroke-dasharray="12 8" stroke-linecap="round"/>
  <circle cx="470" cy="300" r="8" fill="#f4ecd8" stroke="#b33a3a" stroke-width="4"/>
  <path d="M440 470 Q470 430 500 450" fill="none" stroke="#b33a3a" stroke-width="3" stroke-dasharray="4 6"/>
  <text x="505" cy="270" x2="0" y="262" font-size="22" fill="#b33a3a">trip lever?</text>

  <!-- wire key spring -->
  <path d="M230 380 Q250 340 270 380 T310 380" fill="none" stroke="#444" stroke-width="4"/>

  <!-- ink hatching on body -->
  <g stroke="#222" stroke-width="1.5" opacity="0.5">
    <line x1="250" y1="420" x2="270" y2="440"/>
    <line x1="260" y1="410" x2="282" y2="432"/>
    <line x1="510" y1="420" x2="530" y2="440"/>
    <line x1="520" y1="410" x2="542" y2="432"/>
  </g>

  <!-- signature -->
  <text x="752" y="768" font-size="28" fill="#222">P.</text>
</svg>