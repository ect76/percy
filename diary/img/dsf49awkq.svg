<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdb"/>
  <rect x="0" y="0" width="800" height="452" fill="#e6dcc6"/>

  <!-- window frame -->
  <rect x="460" y="100" width="260" height="300" fill="#7e5a3a" stroke="#2a211a" stroke-width="5"/>
  <!-- glass -->
  <rect x="478" y="118" width="224" height="264" fill="#b7c6c9"/>
  <!-- lane outside: cobbles and grey houses -->
  <rect x="478" y="118" width="224" height="150" fill="#c9d3d3"/>
  <rect x="500" y="190" width="70" height="90" fill="#8b9596" stroke="#2a211a" stroke-width="2"/>
  <rect x="598" y="222" width="90" height="58" fill="#9aa5a5" stroke="#2a211a" stroke-width="2"/>
  <path d="M478 300 L702 300 L702 382 L478 382 Z" fill="#9aa4a2"/>
  <g fill="none" stroke="#6f7c7c" stroke-width="2">
    <ellipse cx="520" cy="330" rx="10" ry="4"/>
    <ellipse cx="560" cy="345" rx="10" ry="4"/>
    <ellipse cx="620" cy="332" rx="10" ry="4"/>
    <ellipse cx="650" cy="362" rx="10" ry="4"/>
    <ellipse cx="500" cy="366" rx="10" ry="4"/>
  </g>
  <!-- fog bands -->
  <rect x="478" y="236" width="224" height="34" fill="#ffffff" opacity="0.55"/>
  <rect x="478" y="150" width="224" height="22" fill="#ffffff" opacity="0.4"/>
  <!-- rain -->
  <g stroke="#3f5a66" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="492" y1="140" x2="484" y2="160"/>
    <line x1="528" y1="128" x2="520" y2="150"/>
    <line x1="566" y1="150" x2="558" y2="172"/>
    <line x1="604" y1="132" x2="596" y2="156"/>
    <line x1="640" y1="146" x2="632" y2="168"/>
    <line x1="676" y1="128" x2="668" y2="150"/>
    <line x1="700" y1="176" x2="692" y2="198"/>
    <line x1="486" y1="200" x2="478" y2="222"/>
    <line x1="540" y1="282" x2="532" y2="304"/>
    <line x1="620" y1="286" x2="612" y2="308"/>
    <line x1="684" y1="270" x2="676" y2="292"/>
    <line x1="508" y1="390" x2="500" y2="372"/>
    <line x1="700" y1="106" x2="692" y2="126"/>
    <line x1="580" y1="200" x2="572" y2="222"/>
  </g>
  <!-- window mullions -->
  <line x1="590" y1="118" x2="590" y2="382" stroke="#2a211a" stroke-width="5"/>
  <line x1="478" y1="250" x2="702" y2="250" stroke="#2a211a" stroke-width="5"/>
  <!-- window sill -->
  <rect x="450" y="382" width="280" height="22" fill="#8e6741" stroke="#2a211a" stroke-width="4"/>

  <!-- cupboard -->
  <rect x="90" y="130" width="300" height="322" fill="#b98a5a" stroke="#2a211a" stroke-width="6"/>
  <!-- open interior -->
  <rect x="110" y="150" width="260" height="284" fill="#3b2c20"/>
  <!-- empty shelves -->
  <rect x="110" y="230" width="260" height="8" fill="#7a5634"/>
  <rect x="110" y="310" width="260" height="8" fill="#7a5634"/>
  <rect x="110" y="390" width="260" height="8" fill="#7a5634"/>
  <!-- inner shadows -->
  <rect x="110" y="150" width="260" height="14" fill="#241a12" opacity="0.6"/>
  <!-- door frame panels -->
  <rect x="100" y="140" width="280" height="302" fill="none" stroke="#5b3f25" stroke-width="3"/>
  <!-- handles -->
  <circle cx="380" cy="300" r="6" fill="#c9a23c" stroke="#2a211a" stroke-width="2"/>
  <circle cx="380" cy="330" r="6" fill="#c9a23c" stroke="#2a211a" stroke-width="2"/>

  <!-- floor band (cobbles) -->
  <rect x="0" y="660" width="800" height="140" fill="#7d766b"/>
  <g fill="#6a645a" stroke="#2a211a" stroke-width="2">
    <ellipse cx="60" cy="700" rx="36" ry="14"/>
    <ellipse cx="150" cy="730" rx="40" ry="14"/>
    <ellipse cx="260" cy="700" rx="36" ry="14"/>
    <ellipse cx="360" cy="745" rx="40" ry="14"/>
    <ellipse cx="470" cy="710" rx="36" ry="14"/>
    <ellipse cx="560" cy="750" rx="40" ry="14"/>
    <ellipse cx="660" cy="705" rx="36" ry="14"/>
    <ellipse cx="90" cy="775" rx="40" ry="14"/>
    <ellipse cx="230" cy="785" rx="40" ry="12"/>
  </g>
  <!-- low fog over floor -->
  <rect x="0" y="650" width="800" height="22" fill="#f3ecdb" opacity="0.35"/>

  <!-- table legs -->
  <rect x="60" y="490" width="18" height="170" fill="#7a5034" stroke="#2a211a" stroke-width="4"/>
  <rect x="722" y="490" width="18" height="170" fill="#7a5034" stroke="#2a211a" stroke-width="4"/>
  <!-- table front edge -->
  <rect x="40" y="478" width="720" height="14" fill="#8e6041" stroke="#2a211a" stroke-width="4"/>
  <!-- table top -->
  <rect x="40" y="452" width="720" height="26" fill="#a9764a" stroke="#2a211a" stroke-width="4"/>
  <line x1="60" y1="464" x2="250" y2="464" stroke="#8e6041" stroke-width="2"/>
  <line x1="420" y1="466" x2="520" y2="466" stroke="#8e6041" stroke-width="2"/>

  <!-- the one coin -->
  <ellipse cx="300" cy="462" rx="22" ry="8" fill="#d9a93a" stroke="#2a211a" stroke-width="3"/>
  <ellipse cx="300" cy="461" rx="14" ry="5" fill="none" stroke="#9c7420" stroke-width="2"/>
  <ellipse cx="296" cy="459" rx="6" ry="2" fill="#f4dc8a" opacity="0.8"/>

  <!-- brass bubble vial (spirit level) -->
  <rect x="540" y="436" width="150" height="17" rx="8" fill="#e7e1cf" stroke="#2a211a" stroke-width="3"/>
  <rect x="530" y="432" width="14" height="25" rx="3" fill="#c9a23c" stroke="#2a211a" stroke-width="2"/>
  <rect x="686" y="432" width="14" height="25" rx="3" fill="#c9a23c" stroke="#2a211a" stroke-width="2"/>
  <circle cx="615" cy="444" r="6" fill="#ffffff" stroke="#2a211a" stroke-width="2"/>
  <line x1="606" y1="444" x2="624" y2="444" stroke="#2a211a" stroke-width="1"/>

  <!-- ink signature P. -->
  <g fill="none" stroke="#2a211a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M730 752 V778 M730 752 H742 Q752 752 752 760 Q752 768 742 768 H730"/>
  </g>
  <circle cx="758" cy="778" r="2.5" fill="#2a211a"/>
</svg>