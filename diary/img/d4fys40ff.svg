<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect width="800" height="800" fill="#f4ecd8"/>

  <!-- wall -->
  <rect x="0" y="0" width="800" height="600" fill="#d9b98a"/>

  <!-- window with fog and bell tower -->
  <rect x="520" y="80" width="230" height="240" fill="#c9d3d2" stroke="#2a2420" stroke-width="4"/>
  <rect x="618" y="120" width="44" height="200" fill="#8f9a9c"/>
  <polygon points="612,120 640,80 668,120" fill="#6e7a7c"/>
  <rect x="520" y="200" width="230" height="8" fill="#e6ecea" opacity="0.7"/>
  <rect x="520" y="250" width="230" height="8" fill="#e6ecea" opacity="0.7"/>
  <line x1="635" y1="80" x2="635" y2="320" stroke="#2a2420" stroke-width="4"/>
  <rect x="520" y="80" width="230" height="240" fill="none" stroke="#2a2420" stroke-width="4"/>

  <!-- lamp glow -->
  <circle cx="150" cy="380" r="170" fill="#ffd76a" opacity="0.28"/>
  <circle cx="150" cy="380" r="95" fill="#ffe59a" opacity="0.35"/>

  <!-- lamp -->
  <rect x="128" y="500" width="44" height="18" fill="#7a5230" stroke="#2a2420" stroke-width="3"/>
  <rect x="142" y="440" width="16" height="62" fill="#7a5230" stroke="#2a2420" stroke-width="3"/>
  <rect x="130" y="402" width="40" height="40" fill="#fff6d6" stroke="#2a2420" stroke-width="3"/>
  <path d="M150,410 C158,422 160,432 150,438 C140,432 142,422 150,410 Z" fill="#ffb72e" stroke="#2a2420" stroke-width="2"/>
  <rect x="124" y="394" width="52" height="8" fill="#5a3a22" stroke="#2a2420" stroke-width="3"/>

  <!-- table -->
  <rect x="60" y="520" width="700" height="26" fill="#8a5a34" stroke="#2a2420" stroke-width="4"/>
  <rect x="80" y="546" width="18" height="150" fill="#6b4226" stroke="#2a2420" stroke-width="3"/>
  <rect x="702" y="546" width="18" height="150" fill="#6b4226" stroke="#2a2420" stroke-width="3"/>

  <!-- plate -->
  <ellipse cx="420" cy="478" rx="200" ry="44" fill="#b9c8cb" stroke="#2a2420" stroke-width="3"/>
  <ellipse cx="420" cy="478" rx="150" ry="30" fill="#a4b5b9"/>

  <!-- fish tail -->
  <path d="M530,450 L560,392 Q552,450 560,508 Z" fill="#5f8fa0" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>

  <!-- fish body -->
  <path d="M300,450 C330,400 420,388 480,424 L548,396 L532,450 L548,504 L480,476 C420,512 330,500 300,450 Z" fill="#7fb2c0" stroke="#2a2420" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- belly -->
  <path d="M320,462 C360,494 430,500 480,474 C430,486 370,482 320,462 Z" fill="#d8ecef"/>
  <!-- back shade -->
  <path d="M330,440 C370,412 430,410 480,430 C440,420 380,424 330,440 Z" fill="#3e6d7c" opacity="0.6"/>

  <!-- fins -->
  <path d="M380,402 C400,370 440,368 462,400 Z" fill="#4f7f8e" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>
  <path d="M352,470 C366,492 386,494 398,482 C382,472 366,466 352,470 Z" fill="#c9dfe4" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>

  <!-- gill line -->
  <path d="M356,412 C364,440 364,462 356,488" fill="none" stroke="#2a2420" stroke-width="3"/>

  <!-- scales -->
  <g fill="none" stroke="#2a2420" stroke-width="1.8" opacity="0.7">
    <path d="M380,430 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M404,438 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M428,446 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M452,454 q8,-8 16,0"/>
    <path d="M388,452 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M412,460 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M436,468 q8,-8 16,0"/>
    <path d="M378,470 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M402,478 q8,-8 16,0"/>
  </g>

  <!-- wet-scale light catches (lit from lamp, left side) -->
  <g fill="#ffffff">
    <ellipse cx="338" cy="438" rx="18" ry="5" opacity="0.85" transform="rotate(-18 338 438)"/>
    <ellipse cx="362" cy="424" rx="14" ry="4" opacity="0.8" transform="rotate(-12 362 424)"/>
    <ellipse cx="390" cy="416" rx="11" ry="3" opacity="0.7" transform="rotate(-6 390 416)"/>
    <ellipse cx="318" cy="456" rx="8" ry="3" opacity="0.8"/>
    <ellipse cx="410" cy="440" rx="10" ry="3" opacity="0.6"/>
    <ellipse cx="440" cy="452" rx="9" ry="2.5" opacity="0.55"/>
  </g>

  <!-- eye -->
  <circle cx="330" cy="440" r="9" fill="#1f1a16" stroke="#2a2420" stroke-width="2"/>
  <circle cx="333" cy="437" r="2.6" fill="#ffffff"/>

  <!-- water droplets -->
  <g fill="#e8f6f8" stroke="#2a2420" stroke-width="1.5">
    <circle cx="300" cy="500" r="4"/>
    <circle cx="470" cy="512" r="3"/>
    <circle cx="520" cy="478" r="3.5"/>
    <circle cx="372" cy="506" r="2.5"/>
    <circle cx="256" cy="470" r="3"/>
  </g>

  <!-- floor cobbles -->
  <rect x="0" y="646" width="800" height="154" fill="#7d7468"/>
  <g fill="#a39a8a" stroke="#2a2420" stroke-width="2">
    <ellipse cx="60" cy="680" rx="40" ry="18"/>
    <ellipse cx="150" cy="704" rx="46" ry="20"/>
    <ellipse cx="260" cy="676" rx="38" ry="16"/>
    <ellipse cx="340" cy="716" rx="44" ry="18"/>
    <ellipse cx="460" cy="684" rx="42" ry="17"/>
    <ellipse cx="560" cy="722" rx="48" ry="19"/>
    <ellipse cx="680" cy="690" rx="44" ry="18"/>
    <ellipse cx="740" cy="750" rx="46" ry="18"/>
    <ellipse cx="110" cy="762" rx="44" ry="17"/>
    <ellipse cx="300" cy="774" rx="50" ry="19"/>
    <ellipse cx="500" cy="770" rx="46" ry="17"/>
    <ellipse cx="640" cy="780" rx="52" ry="16"/>
  </g>

  <!-- signature -->
  <text x="752" y="784" font-size="28" fill="#2a2420" text-anchor="end">P.</text>
</svg>