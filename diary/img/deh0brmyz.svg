<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect width="800" height="800" fill="#f2ebdb"/>
  <!-- distant fog sky -->
  <rect x="0" y="0" width="800" height="330" fill="#e4e0d6"/>
  <!-- lane ground -->
  <polygon points="120,800 700,800 452,478 368,478" fill="#cfc3a3" stroke="#2a2623" stroke-width="2"/>
  <!-- verge on right -->
  <polygon points="700,800 800,800 800,520 452,478" fill="#b9bca0" stroke="#2a2623" stroke-width="2"/>
  <!-- cobbles -->
  <g fill="none" stroke="#2a2623" stroke-width="1.5" opacity="0.7">
    <ellipse cx="300" cy="690" rx="16" ry="8"/>
    <ellipse cx="380" cy="700" rx="18" ry="9"/>
    <ellipse cx="470" cy="712" rx="20" ry="10"/>
    <ellipse cx="560" cy="735" rx="24" ry="11"/>
    <ellipse cx="240" cy="760" rx="22" ry="10"/>
    <ellipse cx="400" cy="770" rx="26" ry="11"/>
    <ellipse cx="520" cy="782" rx="30" ry="12"/>
    <ellipse cx="350" cy="600" rx="10" ry="5"/>
    <ellipse cx="420" cy="612" rx="11" ry="5"/>
    <ellipse cx="385" cy="545" rx="6" ry="3"/>
    <ellipse cx="415" cy="552" rx="6" ry="3"/>
    <ellipse cx="395" cy="515" rx="4" ry="2"/>
  </g>
  <!-- bell tower at end of lane -->
  <rect x="368" y="250" width="84" height="232" fill="#d8d0bf" stroke="#2a2623" stroke-width="2"/>
  <polygon points="362,252 410,150 458,252" fill="#4d4a50" stroke="#2a2623" stroke-width="2"/>
  <rect x="330" y="400" width="10" height="12" fill="#2a2623"/>
  <path d="M396,482 L396,440 Q410,424 424,440 L424,482 Z" fill="#3a2d26" stroke="#2a2623" stroke-width="2"/>
  <circle cx="410" cy="300" r="26" fill="#fbf8ef" stroke="#2a2623" stroke-width="2"/>
  <line x1="410" y1="300" x2="410" y2="284" stroke="#2a2623" stroke-width="3" stroke-linecap="round"/>
  <line x1="410" y1="300" x2="423" y2="309" stroke="#2a2623" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="410" cy="300" r="2.5" fill="#2a2623"/>
  <rect x="396" y="330" width="28" height="36" fill="#8f8775" stroke="#2a2623" stroke-width="1.5"/>
  <!-- fog bands over distance -->
  <ellipse cx="410" cy="470" rx="280" ry="38" fill="#f6f3ea" opacity="0.55"/>
  <ellipse cx="420" cy="420" rx="220" ry="30" fill="#f6f3ea" opacity="0.4"/>
  <!-- cottage on left -->
  <rect x="0" y="330" width="260" height="290" fill="#b9674a" stroke="#2a2623" stroke-width="2"/>
  <polygon points="-12,332 130,226 272,332" fill="#4d4a50" stroke="#2a2623" stroke-width="2"/>
  <rect x="52" y="390" width="78" height="66" fill="#f6d77a" stroke="#2a2623" stroke-width="2"/>
  <line x1="91" y1="390" x2="91" y2="456" stroke="#2a2623" stroke-width="2"/>
  <line x1="52" y1="423" x2="130" y2="423" stroke="#2a2623" stroke-width="2"/>
  <rect x="172" y="496" width="58" height="124" fill="#5a3d2b" stroke="#2a2623" stroke-width="2"/>
  <circle cx="222" cy="560" r="3" fill="#f6d77a"/>
  <!-- cottage shadow on lane -->
  <polygon points="0,620 0,800 150,800 230,620" fill="#8f8572" opacity="0.35"/>
  <!-- fog in front of cottage edge -->
  <rect x="250" y="330" width="80" height="470" fill="#f6f3ea" opacity="0.25"/>
  <!-- snow blowing across -->
  <g stroke="#fbfaf5" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="520" y1="120" x2="470" y2="140"/>
    <line x1="640" y1="200" x2="580" y2="222"/>
    <line x1="700" y1="300" x2="640" y2="322"/>
    <line x1="560" y1="360" x2="500" y2="380"/>
    <line x1="740" y1="430" x2="670" y2="452"/>
    <line x1="600" y1="500" x2="530" y2="520"/>
    <line x1="520" y1="600" x2="450" y2="622"/>
    <line x1="660" y1="660" x2="590" y2="684"/>
    <line x1="360" y1="250" x2="330" y2="262"/>
    <line x1="300" y1="170" x2="262" y2="186"/>
    <line x1="780" y1="560" x2="710" y2="584"/>
    <line x1="470" y1="750" x2="400" y2="772"/>
    <line x1="640" y1="760" x2="560" y2="786"/>
  </g>
  <g fill="#fbfaf5" stroke="#8f8772" stroke-width="0.8">
    <circle cx="610" cy="150" r="3"/>
    <circle cx="500" cy="260" r="2.5"/>
    <circle cx="690" cy="380" r="3"/>
    <circle cx="480" cy="470" r="2.5"/>
    <circle cx="620" cy="600" r="3"/>
    <circle cx="700" cy="720" r="2.5"/>
    <circle cx="540" cy="700" r="3"/>
    <circle cx="300" cy="300" r="2.5"/>
    <circle cx="200" cy="200" r="3"/>
  </g>
  <!-- signature -->
  <text x="770" y="780" font-family="serif" font-size="22" fill="#2a2623" text-anchor="end">P.</text>
</svg>