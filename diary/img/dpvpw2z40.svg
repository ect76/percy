<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#e4e8e8"/>
  <!-- distant village in fog -->
  <g fill="#b9c2c4" stroke="#3a4142" stroke-width="3">
    <path d="M40 520 L40 430 L95 380 L150 430 L150 520 Z"/>
    <path d="M160 530 L160 455 L215 405 L270 455 L270 530 Z"/>
    <path d="M560 520 L560 440 L615 390 L670 440 L670 520 Z"/>
    <path d="M680 530 L680 470 L730 425 L780 470 L780 530 Z"/>
  </g>
  <g fill="#d3d9da" stroke="#3a4142" stroke-width="2">
    <rect x="62" y="470" width="24" height="26"/>
    <rect x="110" y="470" width="24" height="26"/>
    <rect x="182" y="480" width="24" height="26"/>
    <rect x="240" y="480" width="24" height="26"/>
    <rect x="585" y="475" width="24" height="26"/>
    <rect x="640" y="475" width="24" height="26"/>
    <rect x="700" y="490" width="24" height="26"/>
  </g>
  <!-- fog bands -->
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="200" cy="560" rx="260" ry="26"/>
    <ellipse cx="620" cy="545" rx="230" ry="22"/>
    <ellipse cx="400" cy="600" rx="380" ry="20"/>
  </g>
  <!-- cobbled ground -->
  <path d="M0 600 L800 600 L800 800 L0 800 Z" fill="#a7a49c" stroke="#3a3a36" stroke-width="3"/>
  <g fill="#c8c4b8" stroke="#3a3a36" stroke-width="2">
    <ellipse cx="90" cy="650" rx="55" ry="18"/>
    <ellipse cx="230" cy="690" rx="60" ry="20"/>
    <ellipse cx="380" cy="650" rx="50" ry="16"/>
    <ellipse cx="520" cy="710" rx="62" ry="20"/>
    <ellipse cx="690" cy="655" rx="58" ry="18"/>
    <ellipse cx="150" cy="750" rx="70" ry="22"/>
    <ellipse cx="420" cy="765" rx="75" ry="22"/>
    <ellipse cx="660" cy="760" rx="70" ry="20"/>
  </g>
  <!-- windowsill -->
  <rect x="120" y="585" width="560" height="28" fill="#8a6a4a" stroke="#2e2218" stroke-width="3"/>
  <!-- jar -->
  <g transform="translate(400,440) rotate(-12)">
    <!-- mesh lid -->
    <rect x="-72" y="-142" width="144" height="26" fill="#9aa5a0" stroke="#222" stroke-width="4"/>
    <g stroke="#222" stroke-width="1.5">
      <line x1="-60" y1="-142" x2="-60" y2="-116"/>
      <line x1="-40" y1="-142" x2="-40" y2="-116"/>
      <line x1="-20" y1="-142" x2="-20" y2="-116"/>
      <line x1="0" y1="-142" x2="0" y2="-116"/>
      <line x1="20" y1="-142" x2="20" y2="-116"/>
      <line x1="40" y1="-142" x2="40" y2="-116"/>
      <line x1="60" y1="-142" x2="60" y2="-116"/>
    </g>
    <!-- glass body -->
    <path d="M-72 -116 L-72 80 Q-72 112 -40 116 L40 116 Q72 112 72 80 L72 -116 Z" fill="#d6ecf0" opacity="0.7" stroke="#222" stroke-width="5"/>
    <!-- water -->
    <path d="M-68 -20 L68 -20 L68 80 Q68 108 40 112 L-40 112 Q-68 108 -68 80 Z" fill="#7fb6c8" opacity="0.45"/>
    <!-- seeds at bottom -->
    <g fill="#c9a25a" stroke="#4a3418" stroke-width="2">
      <ellipse cx="-42" cy="96" rx="9" ry="6"/>
      <ellipse cx="-18" cy="100" rx="9" ry="6"/>
      <ellipse cx="6" cy="94" rx="9" ry="6"/>
      <ellipse cx="30" cy="99" rx="9" ry="6"/>
      <ellipse cx="50" cy="92" rx="8" ry="5"/>
    </g>
    <!-- roots -->
    <g stroke="#e8dcc0" stroke-width="3" fill="none">
      <path d="M-42 92 Q-46 70 -38 56"/>
      <path d="M-18 96 Q-12 74 -20 60"/>
      <path d="M6 90 Q2 68 10 52"/>
      <path d="M30 95 Q36 76 28 62"/>
      <path d="M50 88 Q44 70 50 58"/>
    </g>
    <!-- shoots -->
    <g stroke="#4f8f42" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-38 56 Q-40 20 -34 -10"/>
      <path d="M-20 60 Q-18 25 -10 -4"/>
      <path d="M10 52 Q14 18 6 -14"/>
      <path d="M28 62 Q30 30 38 2"/>
      <path d="M50 58 Q48 34 56 12"/>
    </g>
    <!-- cotyledon leaves -->
    <g fill="#7cc26a" stroke="#2f5e28" stroke-width="2.5">
      <ellipse cx="-42" cy="-12" rx="12" ry="6" transform="rotate(-30 -42 -12)"/>
      <ellipse cx="-26" cy="-8" rx="12" ry="6" transform="rotate(25 -26 -8)"/>
      <ellipse cx="-2" cy="-16" rx="12" ry="6" transform="rotate(-30 -2 -16)"/>
      <ellipse cx="16" cy="-14" rx="12" ry="6" transform="rotate(30 16 -14)"/>
      <ellipse cx="46" cy="6" rx="12" ry="6" transform="rotate(-25 46 6)"/>
    </g>
    <!-- glass highlight -->
    <path d="M-56 -90 L-56 60" stroke="#ffffff" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
  </g>
  <!-- signature -->
  <text x="752" y="782" font-family="sans-serif" font-size="22" fill="#2b2b2b">P.</text>
</svg>