<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdb"/>
  <rect x="30" y="30" width="740" height="740" fill="none" stroke="#3a3530" stroke-width="2"/>

  <!-- distant village roofs in fog -->
  <path d="M60 470 L120 410 L180 470 Z M190 480 L260 400 L330 480 Z M560 470 L630 395 L700 470 Z M660 480 L720 430 L770 480 Z" fill="#c9cfd3" stroke="#3a3530" stroke-width="1.5" opacity="0.8"/>
  <rect x="112" y="440" width="18" height="34" fill="#b7bec4" stroke="#3a3530" stroke-width="1"/>
  <rect x="610" y="440" width="18" height="30" fill="#b7bec4" stroke="#3a3530" stroke-width="1"/>

  <!-- fog bands -->
  <ellipse cx="400" cy="380" rx="420" ry="40" fill="#f7f4ec" opacity="0.7"/>
  <ellipse cx="200" cy="520" rx="260" ry="28" fill="#f7f4ec" opacity="0.65"/>
  <ellipse cx="620" cy="560" rx="240" ry="26" fill="#f7f4ec" opacity="0.6"/>

  <!-- cobbles -->
  <rect x="30" y="625" width="740" height="145" fill="#d7cdb8"/>
  <g fill="#cbbfa6" stroke="#3a3530" stroke-width="1.5">
    <ellipse cx="90" cy="660" rx="44" ry="18"/>
    <ellipse cx="200" cy="690" rx="50" ry="20"/>
    <ellipse cx="330" cy="655" rx="46" ry="17"/>
    <ellipse cx="470" cy="700" rx="52" ry="20"/>
    <ellipse cx="610" cy="662" rx="48" ry="18"/>
    <ellipse cx="715" cy="715" rx="40" ry="17"/>
    <ellipse cx="140" cy="740" rx="48" ry="18"/>
    <ellipse cx="380" cy="745" rx="44" ry="16"/>
    <ellipse cx="560" cy="752" rx="50" ry="18"/>
  </g>
  <line x1="30" y1="625" x2="770" y2="625" stroke="#3a3530" stroke-width="2"/>

  <!-- mouse tail -->
  <path d="M236 470 C190 470 160 430 140 390 C128 366 150 356 162 374 C180 402 200 440 236 448" fill="none" stroke="#3a3530" stroke-width="10" stroke-linecap="round"/>
  <path d="M236 470 C190 470 160 430 140 390 C128 366 150 356 162 374 C180 402 200 440 236 448" fill="none" stroke="#9aa6ae" stroke-width="5" stroke-linecap="round"/>

  <!-- back legs -->
  <rect x="290" y="520" width="26" height="78" rx="6" fill="#a9b6bf" stroke="#3a3530" stroke-width="2.5"/>
  <rect x="268" y="590" width="40" height="16" rx="5" fill="#8c98a1" stroke="#3a3530" stroke-width="2.5"/>

  <!-- front legs -->
  <rect x="440" y="520" width="26" height="80" rx="6" fill="#a9b6bf" stroke="#3a3530" stroke-width="2.5"/>
  <rect x="436" y="592" width="40" height="16" rx="5" fill="#8c98a1" stroke="#3a3530" stroke-width="2.5"/>

  <!-- body -->
  <ellipse cx="380" cy="470" rx="150" ry="82" fill="#bcc8d0" stroke="#3a3530" stroke-width="3"/>
  <path d="M260 455 Q380 430 500 455" fill="none" stroke="#3a3530" stroke-width="1.5" opacity="0.6"/>
  <path d="M250 490 Q380 512 505 488" fill="none" stroke="#3a3530" stroke-width="1.5" opacity="0.6"/>

  <!-- belly window with cam disc -->
  <ellipse cx="350" cy="500" rx="48" ry="26" fill="#e7dfcb" stroke="#3a3530" stroke-width="2"/>
  <circle cx="350" cy="500" r="18" fill="#8c98a1" stroke="#3a3530" stroke-width="1.5"/>
  <circle cx="350" cy="500" r="4" fill="#3a3530"/>
  <!-- follower wire resting lightly on cam -->
  <path d="M368 494 L410 470 L424 470" fill="none" stroke="#3a3530" stroke-width="2.5"/>
  <path d="M368 494 L410 470 L424 470" fill="none" stroke="#e0e6ea" stroke-width="0.8"/>

  <!-- rivets -->
  <g fill="#3a3530">
    <circle cx="270" cy="470" r="3"/>
    <circle cx="300" cy="430" r="3"/>
    <circle cx="470" cy="430" r="3"/>
    <circle cx="500" cy="478" r="3"/>
  </g>

  <!-- spring key on top -->
  <line x1="380" y1="390" x2="380" y2="372" stroke="#3a3530" stroke-width="5"/>
  <circle cx="380" cy="362" r="14" fill="#d9c58e" stroke="#3a3530" stroke-width="2.5"/>
  <circle cx="380" cy="362" r="5" fill="#f3ecdb" stroke="#3a3530" stroke-width="1.5"/>
  <line x1="380" y1="352" x2="380" y2="336" stroke="#3a3530" stroke-width="3"/>
  <rect x="372" y="330" width="16" height="8" fill="#d9c58e" stroke="#3a3530" stroke-width="1.5"/>

  <!-- head -->
  <circle cx="530" cy="430" r="58" fill="#bcc8d0" stroke="#3a3530" stroke-width="3"/>

  <!-- ears -->
  <circle cx="507" cy="378" r="27" fill="#bcc8d0" stroke="#3a3530" stroke-width="3"/>
  <circle cx="507" cy="378" r="14" fill="#e8b3b0" stroke="#3a3530" stroke-width="1.5"/>
  <circle cx="556" cy="382" r="24" fill="#bcc8d0" stroke="#3a3530" stroke-width="3"/>
  <circle cx="556" cy="382" r="12" fill="#e8b3b0" stroke="#3a3530" stroke-width="1.5"/>

  <!-- snout -->
  <ellipse cx="582" cy="447" rx="30" ry="21" fill="#c9d3da" stroke="#3a3530" stroke-width="2.5"/>
  <circle cx="606" cy="440" r="6" fill="#3a3530"/>

  <!-- eye -->
  <circle cx="548" cy="421" r="6" fill="#3a3530"/>
  <circle cx="550" cy="419" r="1.8" fill="#f3ecdb"/>

  <!-- painted whiskers -->
  <g fill="none" stroke="#3a3530" stroke-width="1.8" stroke-linecap="round">
    <path d="M592 446 Q630 436 668 430"/>
    <path d="M592 452 Q632 452 670 456"/>
    <path d="M592 458 Q628 466 662 480"/>
    <path d="M574 446 Q536 436 500 430"/>
    <path d="M574 452 Q534 452 496 458"/>
  </g>

  <!-- pencil lying beside, not touching -->
  <g transform="rotate(-18 690 690)">
    <rect x="600" y="684" width="170" height="12" fill="#e2b84a" stroke="#3a3530" stroke-width="2"/>
    <polygon points="770,684 790,690 770,696" fill="#e8d3b0" stroke="#3a3530" stroke-width="1.5"/>
    <rect x="600" y="684" width="16" height="12" fill="#c98a8a" stroke="#3a3530" stroke-width="1.5"/>
  </g>

  <!-- signature -->
  <text x="700" y="760" font-family="serif" font-size="26" fill="#3a3530">P.</text>
</svg>