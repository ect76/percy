<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cob" width="48" height="36" patternUnits="userSpaceOnUse">
      <ellipse cx="14" cy="10" rx="13" ry="8" fill="#a39d90" stroke="#3a3834" stroke-width="1.5"/>
      <ellipse cx="38" cy="8" rx="9" ry="6" fill="#968f81" stroke="#3a3834" stroke-width="1.5"/>
      <ellipse cx="30" cy="28" rx="13" ry="7" fill="#aaa496" stroke="#3a3834" stroke-width="1.5"/>
      <ellipse cx="2" cy="30" rx="8" ry="6" fill="#968f81" stroke="#3a3834" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#efe9dc"/>

  <!-- grey sky -->
  <rect x="0" y="0" width="800" height="470" fill="#a9afb6"/>
  <rect x="0" y="0" width="800" height="200" fill="#9aa1a9" opacity="0.6"/>

  <!-- bell tower -->
  <polygon points="522,192 565,92 608,192" fill="#6d7480" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <rect x="530" y="188" width="70" height="46" fill="#b7ae9b" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="544" y="196" width="18" height="30" fill="#3d3d44"/>
  <rect x="568" y="196" width="18" height="30" fill="#3d3d44"/>
  <rect x="530" y="232" width="70" height="210" fill="#cfc6b4" stroke="#2b2b2b" stroke-width="3"/>
  <circle cx="565" cy="268" r="17" fill="#f3efe4" stroke="#2b2b2b" stroke-width="2.5"/>
  <line x1="565" y1="268" x2="565" y2="256" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="565" y1="268" x2="576" y2="272" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="548" y1="300" x2="582" y2="300" stroke="#8a8170" stroke-width="2"/>
  <line x1="548" y1="330" x2="582" y2="330" stroke="#8a8170" stroke-width="2"/>
  <rect x="552" y="380" width="26" height="62" fill="#7d7564" stroke="#2b2b2b" stroke-width="3"/>

  <!-- fog bands -->
  <ellipse cx="400" cy="330" rx="430" ry="36" fill="#e4e8ea" opacity="0.6"/>
  <ellipse cx="300" cy="420" rx="400" ry="30" fill="#e4e8ea" opacity="0.7"/>

  <!-- distant trees -->
  <g fill="#5d7a52" stroke="#2b2b2b" stroke-width="2">
    <circle cx="90" cy="380" r="48"/>
    <circle cx="150" cy="392" r="36"/>
    <circle cx="700" cy="390" r="52"/>
  </g>
  <rect x="84" y="420" width="12" height="30" fill="#5a4632"/>
  <rect x="694" y="430" width="12" height="30" fill="#5a4632"/>

  <!-- village green -->
  <rect x="0" y="430" width="800" height="210" fill="#7d9a6a"/>
  <path d="M0 500 Q400 470 800 500 L800 520 Q400 492 0 520 Z" fill="#6b8859" opacity="0.8"/>

  <!-- cottage -->
  <rect x="0" y="250" width="255" height="390" fill="#e8dcc4" stroke="#2b2b2b" stroke-width="3"/>
  <polygon points="-10,252 130,168 265,252" fill="#5b5a57" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="300" width="60" height="60" fill="#c9d6d8" stroke="#2b2b2b" stroke-width="3"/>
  <line x1="60" y1="300" x2="60" y2="360" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="30" y1="330" x2="90" y2="330" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="150" y="330" width="80" height="310" fill="#6b4a33" stroke="#2b2b2b" stroke-width="3"/>
  <circle cx="220" cy="490" r="4" fill="#d9b25a"/>

  <!-- pond -->
  <ellipse cx="430" cy="560" rx="225" ry="60" fill="#6f8b8c" stroke="#2b2b2b" stroke-width="3"/>
  <g fill="none" stroke="#e9f0ee" stroke-width="2" opacity="0.9">
    <ellipse cx="360" cy="548" rx="30" ry="9"/>
    <ellipse cx="360" cy="548" rx="58" ry="17"/>
    <ellipse cx="360" cy="548" rx="88" ry="26" opacity="0.6"/>
    <ellipse cx="520" cy="580" rx="20" ry="6"/>
    <ellipse cx="520" cy="580" rx="40" ry="12"/>
    <ellipse cx="600" cy="535" rx="14" ry="4"/>
  </g>
  <!-- rising fish -->
  <path d="M458 572 Q470 560 484 572 Q470 584 458 572 Z" fill="#d9783a" stroke="#2b2b2b" stroke-width="1.5"/>
  <path d="M484 572 L494 564 L494 580 Z" fill="#d9783a" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- tower reflection -->
  <g stroke="#c8ced1" stroke-width="3" opacity="0.7">
    <line x1="545" y1="508" x2="580" y2="508"/>
    <line x1="550" y1="522" x2="575" y2="522"/>
    <line x1="548" y1="536" x2="582" y2="536"/>
  </g>

  <!-- foreground doorstep and cobbles -->
  <rect x="0" y="640" width="800" height="160" fill="url(#cob)"/>
  <rect x="0" y="636" width="800" height="6" fill="#5e5a52"/>
  <rect x="122" y="618" width="146" height="24" fill="#b5b0a4" stroke="#2b2b2b" stroke-width="3"/>

  <!-- rain -->
  <g stroke="#3b4046" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <line x1="60" y1="60" x2="46" y2="104"/>
    <line x1="160" y1="20" x2="146" y2="64"/>
    <line x1="260" y1="90" x2="246" y2="134"/>
    <line x1="380" y1="30" x2="366" y2="74"/>
    <line x1="470" y1="120" x2="456" y2="164"/>
    <line x1="640" y1="40" x2="626" y2="84"/>
    <line x1="720" y1="150" x2="706" y2="194"/>
    <line x1="330" y1="210" x2="316" y2="254"/>
    <line x1="40" y1="230" x2="26" y2="274"/>
    <line x1="700" y1="300" x2="686" y2="344"/>
    <line x1="420" y1="330" x2="406" y2="374"/>
    <line x1="290" y1="380" x2="276" y2="424"/>
    <line x1="770" y1="420" x2="756" y2="464"/>
    <line x1="500" y1="440" x2="486" y2="484"/>
    <line x1="200" y1="470" x2="186" y2="514"/>
    <line x1="60" y1="500" x2="46" y2="544"/>
    <line x1="750" y1="520" x2="736" y2="564"/>
    <line x1="620" y1="610" x2="606" y2="654"/>
    <line x1="340" y1="700" x2="326" y2="744"/>
    <line x1="60" y1="740" x2="46" y2="784"/>
  </g>

  <!-- signature -->
  <text x="752" y="782" font-family="serif" font-size="22" fill="#2b2b2b" text-anchor="end">P.</text>
</svg>