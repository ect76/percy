<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#f4eee0"/>
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="#3a3a3a" stroke-width="2"/>

  <!-- wall shadow -->
  <rect x="60" y="80" width="680" height="600" fill="#e6dcc6"/>

  <!-- cupboard carcass -->
  <rect x="140" y="120" width="520" height="520" fill="#b98a5a" stroke="#2b2b2b" stroke-width="5"/>
  <!-- open interior -->
  <rect x="170" y="150" width="460" height="400" fill="#6f4a2e" stroke="#2b2b2b" stroke-width="3"/>
  <!-- open door edge -->
  <path d="M140 120 L110 140 L110 660 L140 640 Z" fill="#a27447" stroke="#2b2b2b" stroke-width="4"/>

  <!-- shelves -->
  <rect x="170" y="330" width="460" height="10" fill="#c99b67" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="170" y="500" width="460" height="10" fill="#c99b67" stroke="#2b2b2b" stroke-width="2"/>

  <!-- three fish on top shelf -->
  <g stroke="#1f2a33" stroke-width="3" fill="#7fa3b8">
    <!-- fish 1 -->
    <path d="M190 300 Q230 268 275 300 Q230 332 190 300 Z"/>
    <path d="M272 300 L300 280 L300 320 Z"/>
    <!-- fish 2 -->
    <path d="M320 300 Q360 268 405 300 Q360 332 320 300 Z"/>
    <path d="M402 300 L430 280 L430 320 Z"/>
    <!-- fish 3 -->
    <path d="M450 300 Q490 268 535 300 Q490 332 450 300 Z"/>
    <path d="M532 300 L560 280 L560 320 Z"/>
  </g>
  <g fill="#1f2a33">
    <circle cx="208" cy="296" r="4"/>
    <circle cx="338" cy="296" r="4"/>
    <circle cx="468" cy="296" r="4"/>
  </g>
  <!-- fish scale highlights -->
  <g stroke="#e9f1f5" stroke-width="2" fill="none" opacity="0.8">
    <path d="M225 290 Q235 300 225 310"/>
    <path d="M255 290 Q265 300 255 310"/>
    <path d="M355 290 Q365 300 355 310"/>
    <path d="M385 290 Q395 300 385 310"/>
    <path d="M485 290 Q495 300 485 310"/>
    <path d="M515 290 Q525 300 515 310"/>
  </g>

  <!-- empty place where one fish was eaten: small plate and crumbs -->
  <ellipse cx="590" cy="318" rx="42" ry="10" fill="#d9d2bf" stroke="#2b2b2b" stroke-width="2"/>
  <g fill="#c99b67" stroke="#2b2b2b" stroke-width="1">
    <circle cx="578" cy="312" r="3"/>
    <circle cx="592" cy="308" r="2.5"/>
    <circle cx="603" cy="316" r="2"/>
    <circle cx="585" cy="322" r="2"/>
  </g>

  <!-- bottom shelf: loaves on the left -->
  <g stroke="#2b2b2b" stroke-width="3">
    <ellipse cx="235" cy="470" rx="55" ry="30" fill="#c8843c"/>
    <ellipse cx="335" cy="470" rx="50" ry="28" fill="#d69a52"/>
  </g>
  <g stroke="#7a4a20" stroke-width="2" fill="none">
    <path d="M215 455 Q235 445 255 455"/>
    <path d="M318 458 Q335 450 352 458"/>
  </g>

  <!-- tins on the right of bottom shelf -->
  <g stroke="#2b2b2b" stroke-width="3">
    <rect x="400" y="430" width="60" height="70" rx="6" fill="#8ea7b5"/>
    <rect x="400" y="425" width="60" height="12" fill="#a0422e"/>
    <rect x="480" y="430" width="60" height="70" rx="6" fill="#8ea7b5"/>
    <rect x="480" y="425" width="60" height="12" fill="#a0422e"/>
    <rect x="560" y="436" width="46" height="64" rx="5" fill="#8ea7b5"/>
    <rect x="560" y="431" width="46" height="10" fill="#a0422e"/>
  </g>
  <g fill="#e8dfc8">
    <rect x="410" y="458" width="40" height="18"/>
    <rect x="490" y="458" width="40" height="18"/>
    <rect x="568" y="462" width="30" height="14"/>
  </g>

  <!-- fog bands at the base -->
  <g fill="#b9b7b0" opacity="0.55">
    <rect x="20" y="640" width="760" height="40"/>
  </g>
  <g fill="#d6d3ca" opacity="0.7">
    <rect x="20" y="675" width="760" height="50"/>
    <rect x="20" y="715" width="760" height="40"/>
  </g>

  <!-- signature -->
  <text x="752" y="772" font-size="22" text-anchor="end" fill="#2b2b2b">P.</text>
</svg>