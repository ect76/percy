<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#efe9dc"/>

  <!-- distant schoolhouse in fog -->
  <g stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round">
    <rect x="520" y="150" width="180" height="150" fill="#b9b2a4"/>
    <polygon points="510,150 610,78 710,150" fill="#8f8a80"/>
    <rect x="596" y="40" width="28" height="40" fill="#b9b2a4"/>
    <rect x="555" y="190" width="30" height="36" fill="#7d8a8a"/>
    <rect x="615" y="190" width="30" height="36" fill="#7d8a8a"/>
    <rect x="655" y="190" width="30" height="36" fill="#7d8a8a"/>
    <rect x="590" y="250" width="50" height="50" fill="#6f655a"/>
  </g>

  <!-- fog bands -->
  <g fill="#ffffff" opacity="0.45">
    <ellipse cx="260" cy="180" rx="320" ry="40"/>
    <ellipse cx="620" cy="300" rx="260" ry="34"/>
    <ellipse cx="400" cy="560" rx="460" ry="30"/>
  </g>

  <!-- rain gauge (left) -->
  <g transform="translate(-110,0)" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round">
    <rect x="193" y="430" width="14" height="170" fill="#8a6a4a"/>
    <rect x="182" y="330" width="36" height="112" fill="#cfe3e6" opacity="0.85"/>
    <rect x="184" y="402" width="32" height="40" fill="#5b8fb0" stroke="none"/>
    <path d="M130,280 L270,280 L212,330 L188,330 Z" fill="#f7f7f2"/>
    <ellipse cx="200" cy="280" rx="70" ry="6" fill="#e2e2dc"/>
    <line x1="222" y1="420" x2="232" y2="420"/>
    <line x1="222" y1="393" x2="232" y2="393"/>
    <line x1="222" y1="366" x2="232" y2="366"/>
    <line x1="222" y1="339" x2="232" y2="339"/>
  </g>
  <g transform="translate(-110,0)" font-family="serif" font-size="11" fill="#2a2a2a">
    <text x="236" y="424">0</text>
    <text x="236" y="397">10</text>
    <text x="236" y="370">20</text>
    <text x="236" y="343">30 mm</text>
  </g>

  <!-- cobbled ground -->
  <rect x="0" y="600" width="800" height="200" fill="#b8b1a2"/>
  <g fill="none" stroke="#6e675c" stroke-width="2" opacity="0.8">
    <ellipse cx="60" cy="630" rx="30" ry="12"/>
    <ellipse cx="150" cy="622" rx="26" ry="10"/>
    <ellipse cx="240" cy="640" rx="32" ry="12"/>
    <ellipse cx="340" cy="628" rx="28" ry="11"/>
    <ellipse cx="440" cy="645" rx="30" ry="12"/>
    <ellipse cx="540" cy="625" rx="26" ry="10"/>
    <ellipse cx="640" cy="640" rx="32" ry="12"/>
    <ellipse cx="735" cy="628" rx="28" ry="11"/>
    <ellipse cx="100" cy="700" rx="34" ry="13"/>
    <ellipse cx="220" cy="722" rx="30" ry="12"/>
    <ellipse cx="350" cy="705" rx="34" ry="13"/>
    <ellipse cx="480" cy="728" rx="30" ry="12"/>
    <ellipse cx="610" cy="708" rx="34" ry="13"/>
    <ellipse cx="730" cy="735" rx="30" ry="12"/>
    <ellipse cx="160" cy="770" rx="34" ry="12"/>
    <ellipse cx="400" cy="775" rx="36" ry="12"/>
    <ellipse cx="640" cy="772" rx="34" ry="12"/>
  </g>

  <!-- table -->
  <g stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round">
    <rect x="120" y="470" width="560" height="30" fill="#8a6a4a"/>
    <rect x="140" y="500" width="14" height="110" fill="#6e5238"/>
    <rect x="646" y="500" width="14" height="110" fill="#6e5238"/>
  </g>

  <!-- mantel clock -->
  <g stroke="#2a2a2a" stroke-width="3">
    <rect x="150" y="385" width="64" height="85" rx="8" fill="#c9a66b"/>
    <circle cx="182" cy="415" r="22" fill="#f7f7f2"/>
    <line x1="182" y1="415" x2="182" y2="400"/>
    <line x1="182" y1="415" x2="194" y2="421"/>
    <rect x="170" y="446" width="24" height="9" fill="#8a6a4a"/>
  </g>

  <!-- teacup and saucer -->
  <g stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round">
    <ellipse cx="300" cy="462" rx="40" ry="8" fill="#f7f7f2"/>
    <path d="M280,420 L325,420 L325,455 Q325,462 302,462 Q280,462 280,455 Z" fill="#f7f7f2"/>
    <path d="M325,428 Q340,428 340,440 Q340,452 324,450" fill="none"/>
    <path d="M282,426 L323,426 L323,430 L282,430 Z" fill="#b5524a" stroke="none"/>
  </g>

  <!-- green ledger -->
  <g stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round">
    <rect x="330" y="400" width="150" height="70" rx="3" fill="#2f5c46"/>
    <rect x="336" y="406" width="138" height="58" fill="#f4f0e4" stroke-width="1.5"/>
    <g stroke="#7a7a72" stroke-width="1.2">
      <line x1="342" y1="418" x2="468" y2="418"/>
      <line x1="342" y1="430" x2="468" y2="430"/>
      <line x1="342" y1="442" x2="468" y2="442"/>
      <line x1="342" y1="454" x2="468" y2="454"/>
    </g>
    <path d="M340,412 L348,438" stroke="#1b3a2b" stroke-width="2" fill="none"/>
  </g>

  <!-- green notebook with pencil on string -->
  <g stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round">
    <rect x="520" y="420" width="110" height="50" rx="2" fill="#2f5c46"/>
    <rect x="520" y="420" width="6" height="50" fill="#1b3a2b" stroke="none"/>
    <path d="M522,420 L532,420 L522,430 Z" fill="#c9bfa8" stroke="none"/>
    <path d="M628,470 L628,420 L630,420 L630,470 Z" fill="#c9bfa8" stroke="none"/>
    <path d="M522,470 L530,470 L522,462 Z" fill="#c9bfa8" stroke="none"/>
    <path d="M524,420 Q508,432 518,448 Q522,456 530,452" fill="none" stroke="#8a6a4a" stroke-width="2"/>
    <polygon points="600,420 640,392 644,398 604,426" fill="#e2b93b"/>
    <polygon points="640,392 648,388 650,393 644,398" fill="#d9a7a0"/>
  </g>

  <!-- signature -->
  <text x="752" y="780" font-family="serif" font-size="18" fill="#2a2a2a">P.</text>
</svg>