<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe6d2"/>
  <!-- back wall of cottage -->
  <rect x="0" y="0" width="800" height="520" fill="#d8c9ab"/>
  <g stroke="#2a2420" stroke-width="3" fill="none">
    <path d="M0 150 H800"/>
    <path d="M120 0 V150 M460 0 V150 M700 40 V150"/>
  </g>
  <!-- window glow -->
  <rect x="520" y="30" width="170" height="100" fill="#e9eef0" stroke="#2a2420" stroke-width="4"/>
  <path d="M605 30 V130 M520 80 H690" stroke="#2a2420" stroke-width="4"/>
  <!-- table -->
  <rect x="30" y="300" width="290" height="18" fill="#8a5f3a" stroke="#2a2420" stroke-width="4"/>
  <rect x="50" y="318" width="16" height="210" fill="#7a5233" stroke="#2a2420" stroke-width="4"/>
  <rect x="290" y="318" width="16" height="210" fill="#7a5233" stroke="#2a2420" stroke-width="4"/>
  <!-- cobbled floor -->
  <rect x="0" y="520" width="800" height="280" fill="#b9ad98"/>
  <g fill="#c9bea8" stroke="#2a2420" stroke-width="2.5">
    <ellipse cx="60" cy="560" rx="50" ry="18"/>
    <ellipse cx="170" cy="555" rx="55" ry="18"/>
    <ellipse cx="300" cy="565" rx="48" ry="17"/>
    <ellipse cx="520" cy="558" rx="52" ry="18"/>
    <ellipse cx="660" cy="562" rx="60" ry="19"/>
    <ellipse cx="90" cy="620" rx="62" ry="22"/>
    <ellipse cx="230" cy="630" rx="58" ry="21"/>
    <ellipse cx="400" cy="622" rx="60" ry="20"/>
    <ellipse cx="600" cy="640" rx="66" ry="22"/>
    <ellipse cx="740" cy="612" rx="50" ry="18"/>
    <ellipse cx="120" cy="710" rx="75" ry="26"/>
    <ellipse cx="330" cy="720" rx="70" ry="25"/>
    <ellipse cx="540" cy="705" rx="72" ry="25"/>
    <ellipse cx="710" cy="740" rx="70" ry="26"/>
  </g>
  <!-- mouse shadow -->
  <ellipse cx="440" cy="546" rx="130" ry="16" fill="#6e6252" opacity="0.45"/>
  <!-- tail -->
  <path d="M322 458 C260 440 236 384 282 356" fill="none" stroke="#2a2420" stroke-width="12" stroke-linecap="round"/>
  <path d="M322 458 C260 440 236 384 282 356" fill="none" stroke="#d9a6a0" stroke-width="5" stroke-linecap="round"/>
  <!-- back legs -->
  <g stroke="#2a2420" stroke-width="4" fill="#9fb0ba">
    <rect x="356" y="492" width="16" height="44" rx="4"/>
    <rect x="394" y="496" width="16" height="40" rx="4"/>
  </g>
  <!-- front legs -->
  <g stroke="#2a2420" stroke-width="4" fill="#9fb0ba">
    <rect x="470" y="496" width="16" height="42" rx="4"/>
    <rect x="506" y="492" width="16" height="44" rx="4"/>
  </g>
  <!-- body -->
  <ellipse cx="430" cy="460" rx="110" ry="55" fill="#b8c7d1" stroke="#2a2420" stroke-width="4"/>
  <path d="M340 452 C380 472 480 472 520 448" fill="none" stroke="#2a2420" stroke-width="3"/>
  <path d="M360 430 C400 420 460 420 500 430" fill="none" stroke="#e8f0f4" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- rivets -->
  <g fill="#2a2420">
    <circle cx="370" cy="450" r="3"/>
    <circle cx="400" cy="478" r="3"/>
    <circle cx="460" cy="478" r="3"/>
    <circle cx="492" cy="456" r="3"/>
  </g>
  <!-- wind key -->
  <circle cx="420" cy="458" r="20" fill="#c9a24a" stroke="#2a2420" stroke-width="4"/>
  <path d="M420 444 V472 M406 458 H434" stroke="#2a2420" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="530" cy="440" rx="45" ry="36" fill="#b8c7d1" stroke="#2a2420" stroke-width="4"/>
  <!-- ears -->
  <circle cx="514" cy="402" r="20" fill="#b8c7d1" stroke="#2a2420" stroke-width="4"/>
  <circle cx="514" cy="402" r="11" fill="#e0a39b"/>
  <circle cx="548" cy="398" r="18" fill="#b8c7d1" stroke="#2a2420" stroke-width="4"/>
  <circle cx="548" cy="398" r="10" fill="#e0a39b"/>
  <!-- snout -->
  <ellipse cx="572" cy="452" rx="20" ry="13" fill="#c8d5dd" stroke="#2a2420" stroke-width="4"/>
  <circle cx="588" cy="448" r="5" fill="#6b3a3a"/>
  <!-- eye -->
  <circle cx="543" cy="434" r="6" fill="#2a2420"/>
  <circle cx="545" cy="432" r="2" fill="#ffffff"/>
  <path d="M556 466 Q562 470 566 466" fill="none" stroke="#2a2420" stroke-width="2.5"/>
  <!-- whiskers -->
  <g stroke="#2a2420" stroke-width="2" fill="none">
    <path d="M580 452 L620 440"/>
    <path d="M580 458 L620 462"/>
    <path d="M578 446 L612 424"/>
  </g>
  <!-- fog layers -->
  <g fill="#f4f2ec" opacity="0.55">
    <ellipse cx="150" cy="200" rx="260" ry="50"/>
    <ellipse cx="640" cy="260" rx="240" ry="46"/>
    <ellipse cx="400" cy="610" rx="420" ry="60"/>
    <ellipse cx="200" cy="740" rx="320" ry="50"/>
  </g>
  <g fill="#e9e7e0" opacity="0.5">
    <ellipse cx="400" cy="20" rx="400" ry="40"/>
    <ellipse cx="620" cy="520" rx="260" ry="36"/>
  </g>
  <!-- signature P. -->
  <path d="M742 758 V788 M742 758 H754 Q764 758 764 768 Q764 778 754 778 H742" fill="none" stroke="#2a2420" stroke-width="3" stroke-linecap="round"/>
  <circle cx="772" cy="788" r="2.5" fill="#2a2420"/>
</svg>