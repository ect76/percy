<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe2"/>

  <!-- distant houses in fog -->
  <rect x="520" y="250" width="120" height="200" fill="#d8cfbd" stroke="#2b2622" stroke-width="3"/>
  <rect x="650" y="300" width="110" height="160" fill="#cfc4ae" stroke="#2b2622" stroke-width="3"/>

  <!-- left house wall with faded spray mural -->
  <rect x="0" y="170" width="230" height="400" fill="#d9c9a8" stroke="#2b2622" stroke-width="4"/>
  <line x1="0" y1="260" x2="230" y2="260" stroke="#2b2622" stroke-width="2" opacity="0.5"/>
  <rect x="40" y="200" width="60" height="50" fill="#8fa3ad" stroke="#2b2622" stroke-width="3"/>
  <rect x="130" y="200" width="60" height="50" fill="#8fa3ad" stroke="#2b2622" stroke-width="3"/>
  <circle cx="110" cy="390" r="46" fill="#e9b83a" opacity="0.45"/>
  <ellipse cx="110" cy="390" rx="30" ry="22" fill="#e8861e" opacity="0.35"/>
  <path d="M60 470 Q110 450 160 470" fill="none" stroke="#2b2622" stroke-width="2" opacity="0.4"/>

  <!-- halo -->
  <ellipse cx="430" cy="290" rx="105" ry="115" fill="none" stroke="#f5dc7a" stroke-width="14" opacity="0.7"/>

  <!-- pedestal -->
  <path d="M300 530 L560 530 L584 582 L276 582 Z" fill="#c9951c" stroke="#2b2622" stroke-width="3"/>
  <path d="M320 556 Q430 572 540 556" fill="none" stroke="#2b2622" stroke-width="2" opacity="0.5"/>

  <!-- lap-sitting body draped in saffron cloth -->
  <path d="M330 530 C318 430 348 362 430 356 C512 362 542 430 530 530 Z" fill="#e8861e" stroke="#2b2622" stroke-width="4"/>
  <path d="M360 420 Q380 470 370 528" fill="none" stroke="#2b2622" stroke-width="2.5" opacity="0.6"/>
  <path d="M430 400 Q446 470 436 528" fill="none" stroke="#2b2622" stroke-width="2.5" opacity="0.6"/>
  <path d="M500 420 Q480 470 492 528" fill="none" stroke="#2b2622" stroke-width="2.5" opacity="0.6"/>

  <!-- golden hands resting in lap -->
  <ellipse cx="385" cy="480" rx="30" ry="18" fill="#e9b83a" stroke="#2b2622" stroke-width="3"/>
  <ellipse cx="478" cy="480" rx="30" ry="18" fill="#e9b83a" stroke="#2b2622" stroke-width="3"/>

  <!-- head -->
  <circle cx="430" cy="290" r="60" fill="#e9b83a" stroke="#2b2622" stroke-width="4"/>
  <!-- small bump on top -->
  <circle cx="430" cy="230" r="10" fill="#e9b83a" stroke="#2b2622" stroke-width="3"/>

  <!-- half-closed serene eyes -->
  <path d="M398 290 Q408 298 418 290" fill="none" stroke="#2b2622" stroke-width="3"/>
  <path d="M442 290 Q452 298 462 290" fill="none" stroke="#2b2622" stroke-width="3"/>
  <!-- gentle smile -->
  <path d="M410 320 Q430 332 450 320" fill="none" stroke="#2b2622" stroke-width="3"/>

  <!-- cobbled lane -->
  <polygon points="230,570 800,570 800,800 0,800 0,600" fill="#bfb3a0"/>
  <g fill="none" stroke="#2b2622" stroke-width="2" opacity="0.6">
    <ellipse cx="60" cy="640" rx="26" ry="12"/>
    <ellipse cx="150" cy="650" rx="26" ry="12"/>
    <ellipse cx="240" cy="700" rx="30" ry="14"/>
    <ellipse cx="90" cy="740" rx="34" ry="16"/>
    <ellipse cx="300" cy="620" rx="22" ry="10"/>
    <ellipse cx="380" cy="660" rx="26" ry="12"/>
    <ellipse cx="520" cy="640" rx="24" ry="11"/>
    <ellipse cx="600" cy="690" rx="30" ry="14"/>
    <ellipse cx="700" cy="630" rx="22" ry="10"/>
    <ellipse cx="470" cy="740" rx="34" ry="15"/>
    <ellipse cx="660" cy="760" rx="36" ry="16"/>
    <ellipse cx="330" cy="775" rx="30" ry="13"/>
  </g>
  <line x1="230" y1="570" x2="0" y2="800" stroke="#2b2622" stroke-width="2" opacity="0.3"/>

  <!-- fog bands -->
  <rect x="0" y="330" width="800" height="40" fill="#e9e6df" opacity="0.55"/>
  <rect x="0" y="470" width="800" height="30" fill="#e9e6df" opacity="0.45"/>
  <rect x="0" y="190" width="800" height="36" fill="#e9e6df" opacity="0.6"/>
  <rect x="0" y="560" width="800" height="22" fill="#e9e6df" opacity="0.5"/>

  <!-- signature "P." drawn as paths -->
  <path d="M736 742 V772 M736 742 H748 Q758 742 758 751 Q758 760 748 760 H736" fill="none" stroke="#2b2622" stroke-width="3" stroke-linecap="round"/>
  <circle cx="768" cy="770" r="2.8" fill="#2b2622"/>
</svg>