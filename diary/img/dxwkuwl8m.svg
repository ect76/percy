<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bfc3"/>
      <stop offset="1" stop-color="#d9dcdc"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e9b9e"/>
      <stop offset="1" stop-color="#a9b4b5"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="800" fill="url(#sky)"/>

  <!-- distant cloud bands -->
  <path d="M0 150 Q200 120 400 150 T800 140 L800 185 Q600 170 400 190 T0 185 Z" fill="#c4cacc" opacity="0.7"/>
  <path d="M0 260 Q180 235 380 262 T800 252 L800 290 Q600 275 400 296 T0 292 Z" fill="#cfd4d5" opacity="0.6"/>

  <!-- distant cottage in fog -->
  <rect x="560" y="330" width="120" height="90" fill="#a7afb0" stroke="#2b2f31" stroke-width="2"/>
  <path d="M550 332 L620 282 L690 332 Z" fill="#8c9597" stroke="#2b2f31" stroke-width="2"/>
  <rect x="598" y="372" width="18" height="30" fill="#6f7779"/>
  <rect x="630" y="356" width="16" height="16" fill="#dfe3dc" stroke="#2b2f31" stroke-width="1.5"/>

  <!-- bare trees in fog -->
  <g fill="none" stroke="#4d5557" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M120 440 L118 300"/>
    <path d="M118 360 L80 320"/>
    <path d="M119 340 L156 300"/>
    <path d="M100 430 Q90 370 70 350"/>
    <path d="M700 470 L706 330"/>
    <path d="M705 380 L740 340"/>
    <path d="M706 350 L672 318"/>
  </g>

  <!-- green -->
  <path d="M0 430 Q200 415 400 425 T800 420 L800 800 L0 800 Z" fill="#9aa88a" stroke="#2b2f31" stroke-width="2"/>
  <path d="M0 520 Q300 505 800 515 L800 800 L0 800 Z" fill="#8a9a7a" opacity="0.6"/>

  <!-- cobbled path edge -->
  <g fill="#c2c3b8" stroke="#2b2f31" stroke-width="1.5">
    <ellipse cx="90" cy="700" rx="22" ry="10"/>
    <ellipse cx="130" cy="716" rx="22" ry="10"/>
    <ellipse cx="72" cy="736" rx="22" ry="10"/>
    <ellipse cx="118" cy="752" rx="22" ry="10"/>
    <ellipse cx="165" cy="738" rx="22" ry="10"/>
    <ellipse cx="60" cy="772" rx="22" ry="10"/>
  </g>

  <!-- open pond -->
  <ellipse cx="530" cy="640" rx="225" ry="72" fill="#2b2f31"/>
  <ellipse cx="530" cy="640" rx="218" ry="66" fill="url(#water)"/>
  <g fill="none" stroke="#e8ecec" stroke-width="2" opacity="0.8" stroke-linecap="round">
    <path d="M380 630 Q400 624 420 630"/>
    <path d="M480 660 Q505 652 530 660"/>
    <path d="M600 620 Q625 614 650 620"/>
    <path d="M430 672 Q450 667 470 672"/>
    <path d="M640 668 Q660 662 680 668"/>
  </g>
  <!-- grey light reflections -->
  <ellipse cx="520" cy="625" rx="90" ry="8" fill="#c9d0d1" opacity="0.6"/>
  <ellipse cx="610" cy="655" rx="50" ry="5" fill="#c9d0d1" opacity="0.5"/>
  <!-- pond rim -->
  <ellipse cx="530" cy="640" rx="225" ry="72" fill="none" stroke="#2b2f31" stroke-width="2.5"/>

  <!-- sign post -->
  <rect x="330" y="330" width="16" height="215" fill="#7a5d3e" stroke="#2b2f31" stroke-width="2.5"/>

  <!-- chains -->
  <g stroke="#b08d3c" stroke-width="3" fill="none">
    <path d="M276 343 L276 378"/>
    <path d="M286 343 L286 378"/>
    <path d="M384 343 L384 378"/>
    <path d="M394 343 L394 378"/>
  </g>
  <g fill="#c9a24a" stroke="#2b2f31" stroke-width="1">
    <ellipse cx="281" cy="382" rx="7" ry="4"/>
    <ellipse cx="389" cy="382" rx="7" ry="4"/>
  </g>

  <!-- sign board -->
  <rect x="240" y="260" width="200" height="90" rx="18" fill="#3f6b45" stroke="#2b2f31" stroke-width="2.5"/>
  <rect x="250" y="270" width="180" height="70" rx="12" fill="#efe9d2" stroke="#2b2f31" stroke-width="2"/>
  <text x="340" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#2b2f31">Welcome to</text>
  <text x="340" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2b2f31">Mossbrook</text>

  <!-- roof cap -->
  <path d="M236 262 L340 214 L444 262 Z" fill="#5a4330" stroke="#2b2f31" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- moss at base -->
  <g fill="#5f7d45" stroke="#2b2f31" stroke-width="1.5">
    <path d="M318 548 Q326 526 336 546 Q342 530 352 552 Z"/>
    <path d="M300 556 Q308 540 316 556 Z"/>
    <path d="M354 558 Q362 540 370 558 Z"/>
  </g>
  <ellipse cx="340" cy="556" rx="46" ry="8" fill="#6f8a52" stroke="#2b2f31" stroke-width="1.5"/>

  <!-- fog veil -->
  <rect x="0" y="470" width="800" height="50" fill="#e4e7e6" opacity="0.45"/>
  <rect x="0" y="560" width="800" height="40" fill="#e4e7e6" opacity="0.35"/>

  <!-- signature -->
  <text x="752" y="780" text-anchor="end" font-family="Georgia, serif" font-size="20" fill="#2b2f31">P.</text>
</svg>