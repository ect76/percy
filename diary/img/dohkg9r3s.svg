<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1e8" stop-opacity="0"/>
      <stop offset="1" stop-color="#f4f1e8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b8"/>
      <stop offset="1" stop-color="#f2c96a"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#ece6d6"/>
  <!-- sky -->
  <rect x="0" y="0" width="800" height="330" fill="#b9c6cc"/>

  <!-- distant rooftops, faded -->
  <polygon points="250,300 250,220 300,200 330,215 340,190 390,180 420,192 470,205 500,190 550,215 560,300" fill="#9fb0b6" opacity="0.7"/>

  <!-- left terrace -->
  <polygon points="0,200 180,250 180,560 0,600" fill="#b8a98f" stroke="#2b2620" stroke-width="2"/>
  <polygon points="0,200 180,250 180,262 0,214" fill="#7d6f5c" stroke="#2b2620" stroke-width="1.5"/>
  <rect x="200" y="330" width="0" height="0"/>

  <!-- right terrace -->
  <polygon points="800,200 620,250 620,560 800,600" fill="#c4b59a" stroke="#2b2620" stroke-width="2"/>
  <polygon points="800,200 620,250 620,262 800,214" fill="#7d6f5c" stroke="#2b2620" stroke-width="1.5"/>

  <!-- Odd Socks & Co. window (left terrace) -->
  <rect x="32" y="436" width="78" height="62" fill="#6e6252" stroke="#2b2620" stroke-width="2"/>
  <rect x="36" y="440" width="70" height="54" fill="#fdfbf2" stroke="#2b2620" stroke-width="1"/>
  <line x1="40" y1="452" x2="102" y2="452" stroke="#9aa6b8" stroke-width="0.8"/>
  <line x1="40" y1="462" x2="102" y2="462" stroke="#9aa6b8" stroke-width="0.8"/>
  <line x1="40" y1="472" x2="102" y2="472" stroke="#9aa6b8" stroke-width="0.8"/>
  <line x1="40" y1="482" x2="102" y2="482" stroke="#9aa6b8" stroke-width="0.8"/>
  <polygon points="36,440 60,440 56,448 36,448" fill="#e6d48a" opacity="0.8"/>
  <polygon points="90,490 106,490 106,494 90,494" fill="#e6d48a" opacity="0.8"/>
  <text x="41" y="458" font-size="7" fill="#2b2620">Odd Socks &amp; Co.</text>
  <text x="41" y="470" font-size="5.5" fill="#2b2620">Mossbrook Tues-Sat</text>

  <!-- Hattersley Clocks (right terrace) -->
  <rect x="684" y="420" width="34" height="100" fill="#5a3d28" stroke="#2b2620" stroke-width="2"/>
  <circle cx="701" cy="446" r="9" fill="#fbf8ee" stroke="#2b2620" stroke-width="1.2"/>
  <line x1="701" y1="446" x2="701" y2="440" stroke="#2b2620" stroke-width="1"/>
  <line x1="701" y1="446" x2="706" y2="446" stroke="#2b2620" stroke-width="1"/>
  <rect x="692" y="478" width="18" height="30" fill="#2a1d14"/>
  <line x1="701" y1="478" x2="701" y2="506" stroke="#c9a14a" stroke-width="1"/>
  <circle cx="701" cy="508" r="2.5" fill="#c9a14a"/>
  <text x="652" y="418" font-size="6" fill="#2b2620">HATTERSLEY CLOCKS</text>

  <!-- library: pediment and cupola -->
  <polygon points="260,190 400,130 540,190" fill="#cfc5ae" stroke="#2b2620" stroke-width="2"/>
  <polygon points="380,110 400,88 420,110" fill="#bfb49c" stroke="#2b2620" stroke-width="1.5"/>
  <rect x="385" y="110" width="30" height="24" fill="#d9d0bd" stroke="#2b2620" stroke-width="1.5"/>

  <!-- library main body -->
  <rect x="270" y="190" width="260" height="330" fill="#d9d0bd" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="262" y="184" width="276" height="10" fill="#bfb49c" stroke="#2b2620" stroke-width="1.5"/>
  <!-- stone courses -->
  <g stroke="#b5aa90" stroke-width="1" opacity="0.8">
    <line x1="270" y1="230" x2="530" y2="230"/>
    <line x1="270" y1="270" x2="530" y2="270"/>
    <line x1="270" y1="330" x2="530" y2="330"/>
    <line x1="270" y1="370" x2="530" y2="370"/>
    <line x1="270" y1="410" x2="530" y2="410"/>
  </g>

  <!-- upper arched windows, lit -->
  <g stroke="#2b2620" stroke-width="2">
    <path d="M296,330 L296,250 A22,22 0 0 1 340,250 L340,330 Z" fill="url(#glow)"/>
    <path d="M378,330 L378,250 A22,22 0 0 1 422,250 L422,330 Z" fill="url(#glow)"/>
    <path d="M460,330 L460,250 A22,22 0 0 1 504,250 L504,330 Z" fill="url(#glow)"/>
  </g>
  <g stroke="#2b2620" stroke-width="1.2" opacity="0.7">
    <line x1="318" y1="228" x2="318" y2="330"/>
    <line x1="400" y1="228" x2="400" y2="330"/>
    <line x1="482" y1="228" x2="482" y2="330"/>
  </g>

  <!-- lower arched windows, lit -->
  <g stroke="#2b2620" stroke-width="2">
    <path d="M296,500 L296,420 A22,22 0 0 1 340,420 L340,500 Z" fill="url(#glow)"/>
    <path d="M460,500 L460,420 A22,22 0 0 1 504,420 L504,500 Z" fill="url(#glow)"/>
  </g>

  <!-- entrance: open door with warm light inside -->
  <path d="M368,520 L368,392 Q400,362 432,392 L432,520 Z" fill="#fff0b0" stroke="#2b2620" stroke-width="2.5"/>
  <path d="M378,520 L378,398 Q400,376 422,398 L422,520" fill="#ffd978" opacity="0.6"/>
  <polygon points="368,392 344,404 344,512 368,520" fill="#6b4a2e" stroke="#2b2620" stroke-width="2"/>
  <polygon points="352,410 362,414 362,500 352,506" fill="#8a6440"/>

  <!-- steps -->
  <rect x="250" y="520" width="300" height="10" fill="#cbc2aa" stroke="#2b2620" stroke-width="2"/>
  <rect x="225" y="530" width="350" height="12" fill="#bdb49b" stroke="#2b2620" stroke-width="2"/>
  <rect x="200" y="542" width="400" height="14" fill="#aea48b" stroke="#2b2620" stroke-width="2"/>

  <!-- street lamps -->
  <g stroke="#2b2620" stroke-width="3">
    <line x1="200" y1="300" x2="200" y2="560"/>
    <line x1="600" y1="300" x2="600" y2="560"/>
  </g>
  <circle cx="200" cy="296" r="9" fill="#ffe27a" stroke="#2b2620" stroke-width="1.5"/>
  <circle cx="600" cy="296" r="9" fill="#ffe27a" stroke="#2b2620" stroke-width="1.5"/>

  <!-- cobbled street -->
  <polygon points="0,800 800,800 430,556 370,556" fill="#8f8a80" stroke="#2b2620" stroke-width="2"/>
  <g fill="none" stroke="#5e5a52" stroke-width="1.2" opacity="0.8">
    <ellipse cx="400" cy="572" rx="14" ry="5"/>
    <ellipse cx="330" cy="596" rx="18" ry="6"/>
    <ellipse cx="470" cy="598" rx="18" ry="6"/>
    <ellipse cx="260" cy="650" rx="26" ry="8"/>
    <ellipse cx="540" cy="652" rx="26" ry="8"/>
    <ellipse cx="380" cy="700" rx="36" ry="10"/>
    <ellipse cx="200" cy="770" rx="40" ry="12"/>
    <ellipse cx="610" cy="760" rx="44" ry="12"/>
    <ellipse cx="420" cy="750" rx="30" ry="9"/>
  </g>

  <!-- foreground sign post: Welcome to Mossville -->
  <rect x="104" y="596" width="12" height="124" fill="#5a4330" stroke="#2b2620" stroke-width="1.5"/>
  <polygon points="58,540 110,510 162,540" fill="#6b5a46" stroke="#2b2620" stroke-width="2"/>
  <rect x="62" y="540" width="96" height="56" rx="8" fill="#f3ecd6" stroke="#4f7a4a" stroke-width="5"/>
  <text x="110" y="566" font-size="10" text-anchor="middle" fill="#2b2620">Welcome to</text>
  <text x="110" y="582" font-size="10" text-anchor="middle" fill="#2b2620">Mossville</text>
  <line x1="74" y1="596" x2="74" y2="628" stroke="#b08d4e" stroke-width="2"/>
  <line x1="146" y1="596" x2="146" y2="628" stroke="#b08d4e" stroke-width="2"/>
  <ellipse cx="74" cy="630" rx="4" ry="3" fill="none" stroke="#b08d4e" stroke-width="1.5"/>
  <ellipse cx="146" cy="630" rx="4" ry="3" fill="none" stroke="#b08d4e" stroke-width="1.5"/>
  <!-- moss at base -->
  <ellipse cx="96" cy="716" rx="22" ry="6" fill="#6f8f55" opacity="0.85"/>
  <ellipse cx="124" cy="720" rx="16" ry="5" fill="#557544" opacity="0.85"/>
  <ellipse cx="110" cy="708" rx="8" ry="3" fill="#8aa868" opacity="0.8"/>

  <!-- fog layers -->
  <rect x="0" y="420" width="800" height="200" fill="url(#fogG)"/>
  <rect x="0" y="560" width="800" height="110" fill="#f4f1e8" opacity="0.35"/>
  <rect x="0" y="300" width="800" height="90" fill="#f4f1e8" opacity="0.3"/>

  <!-- signature -->
  <text x="772" y="784" font-size="14" text-anchor="end" fill="#2b2620">P.</text>
</svg>