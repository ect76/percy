<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#ece8dd"/>
  <!-- sky wash -->
  <rect x="0" y="0" width="800" height="520" fill="#d6dbdc"/>
  <!-- roof -->
  <polygon points="276,128 400,58 524,128" fill="#4a4540" stroke="#1d1b19" stroke-width="3" stroke-linejoin="round"/>
  <!-- tower body -->
  <rect x="290" y="120" width="220" height="600" fill="#8f887b" stroke="#1d1b19" stroke-width="3"/>
  <rect x="462" y="120" width="48" height="600" fill="#6f695e"/>
  <line x1="290" y1="120" x2="290" y2="720" stroke="#1d1b19" stroke-width="3"/>
  <line x1="510" y1="120" x2="510" y2="720" stroke="#1d1b19" stroke-width="3"/>
  <!-- stone courses -->
  <g stroke="#5d574d" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="290" y1="180" x2="510" y2="180"/>
    <line x1="290" y1="230" x2="510" y2="230"/>
    <line x1="290" y1="420" x2="510" y2="420"/>
    <line x1="290" y1="470" x2="510" y2="470"/>
    <line x1="290" y1="520" x2="510" y2="520"/>
    <line x1="290" y1="620" x2="510" y2="620"/>
  </g>
  <!-- clock case -->
  <circle cx="400" cy="262" r="102" fill="#2c2824" stroke="#1d1b19" stroke-width="4"/>
  <circle cx="400" cy="262" r="88" fill="#f4f1e8" stroke="#1d1b19" stroke-width="2"/>
  <!-- hour ticks -->
  <g stroke="#1d1b19" stroke-width="3" stroke-linecap="round">
    <line x1="400" y1="184" x2="400" y2="196"/>
    <line x1="478" y1="262" x2="466" y2="262"/>
    <line x1="400" y1="340" x2="400" y2="328"/>
    <line x1="322" y1="262" x2="334" y2="262"/>
  </g>
  <!-- cracks in glass -->
  <polyline points="326,206 352,228 344,246 370,270 358,300" fill="none" stroke="#1d1b19" stroke-width="1.6"/>
  <polyline points="352,228 384,220 404,236" fill="none" stroke="#1d1b19" stroke-width="1.2"/>
  <polyline points="470,300 452,286 466,262 448,246" fill="none" stroke="#1d1b19" stroke-width="1.2"/>
  <!-- hour hand -->
  <line x1="400" y1="262" x2="432" y2="246" stroke="#1d1b19" stroke-width="7" stroke-linecap="round"/>
  <!-- bent minute hand -->
  <polyline points="400,262 414,224 400,186" fill="none" stroke="#1d1b19" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="400" cy="262" r="6" fill="#1d1b19"/>
  <!-- ledge -->
  <rect x="280" y="345" width="240" height="14" fill="#b8b1a2" stroke="#1d1b19" stroke-width="2.5"/>
  <!-- pigeon streaks -->
  <g fill="#f7f5ef" stroke="#1d1b19" stroke-width="1" opacity="0.95">
    <path d="M318 359 q-3 10 0 18 q3 -4 3 -18 z"/>
    <path d="M346 359 q-2 7 0 12 q2 -3 2 -12 z"/>
    <path d="M395 359 q-4 14 0 24 q4 -8 3 -24 z"/>
    <path d="M440 359 q-2 9 0 15 q2 -4 2 -15 z"/>
    <path d="M482 359 q-3 8 0 13 q3 -3 3 -13 z"/>
  </g>
  <g fill="#f7f5ef" opacity="0.9">
    <ellipse cx="331" cy="356" rx="7" ry="3"/>
    <ellipse cx="418" cy="354" rx="8" ry="3.5"/>
    <ellipse cx="462" cy="357" rx="5" ry="2.5"/>
  </g>
  <!-- iron hook bracket above door (empty) -->
  <rect x="388" y="440" width="26" height="10" fill="#4b4740" stroke="#1d1b19" stroke-width="2"/>
  <path d="M401 450 L401 474 Q401 490 414 490 Q426 490 426 478" fill="none" stroke="#1d1b19" stroke-width="4" stroke-linecap="round"/>
  <!-- door -->
  <path d="M362 700 L362 592 Q362 552 400 552 Q438 552 438 592 L438 700 Z" fill="#3a2e26" stroke="#1d1b19" stroke-width="3"/>
  <line x1="400" y1="560" x2="400" y2="700" stroke="#1d1b19" stroke-width="1.5" opacity="0.6"/>
  <!-- cobbles -->
  <rect x="0" y="700" width="800" height="100" fill="#8c867b"/>
  <g fill="#6e685e" stroke="#1d1b19" stroke-width="1.5">
    <ellipse cx="60" cy="730" rx="26" ry="12"/>
    <ellipse cx="150" cy="752" rx="30" ry="13"/>
    <ellipse cx="250" cy="726" rx="24" ry="11"/>
    <ellipse cx="560" cy="734" rx="28" ry="12"/>
    <ellipse cx="660" cy="760" rx="32" ry="13"/>
    <ellipse cx="740" cy="728" rx="26" ry="11"/>
    <ellipse cx="330" cy="770" rx="34" ry="14"/>
    <ellipse cx="480" cy="778" rx="30" ry="12"/>
  </g>
  <!-- fog bands -->
  <rect x="0" y="300" width="800" height="70" fill="#f3f1ea" opacity="0.55"/>
  <rect x="0" y="600" width="800" height="90" fill="#f3f1ea" opacity="0.5"/>
  <rect x="0" y="150" width="800" height="50" fill="#f3f1ea" opacity="0.35"/>
  <!-- ink signature "P." -->
  <g fill="none" stroke="#1d1b19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 760 V786 M30 760 H40 Q48 760 48 768 Q48 776 40 776 H30"/>
  </g>
  <circle cx="58" cy="786" r="2.5" fill="#1d1b19"/>
</svg>