<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and fog -->
  <rect x="0" y="0" width="800" height="800" fill="#ece4cc"/>
  <rect x="0" y="0" width="800" height="420" fill="#cdd5d7"/>
  <ellipse cx="180" cy="120" rx="260" ry="60" fill="#f4f6f5" opacity="0.55"/>
  <ellipse cx="600" cy="230" rx="300" ry="70" fill="#f4f6f5" opacity="0.5"/>
  <ellipse cx="330" cy="330" rx="340" ry="50" fill="#f4f6f5" opacity="0.45"/>

  <!-- desk -->
  <rect x="0" y="640" width="800" height="160" fill="#6e4d30" stroke="#222" stroke-width="4"/>
  <path d="M0 690 H800 M0 740 H800" stroke="#56391f" stroke-width="3" fill="none"/>
  <rect x="0" y="630" width="800" height="18" fill="#8a6440" stroke="#222" stroke-width="4"/>

  <!-- loose pencils -->
  <g transform="rotate(-18 690 600)">
    <rect x="610" y="588" width="170" height="20" fill="#e2b13c" stroke="#222" stroke-width="3"/>
    <polygon points="780,588 800,598 780,608" fill="#d9c7a6" stroke="#222" stroke-width="3"/>
    <rect x="610" y="588" width="22" height="20" fill="#b9655a" stroke="#222" stroke-width="3"/>
  </g>

  <!-- motion marks around the jerking mouse -->
  <g fill="none" stroke="#222" stroke-width="4" stroke-linecap="round">
    <path d="M150 380 Q140 400 150 420"/>
    <path d="M128 350 Q112 372 124 400"/>
    <path d="M440 300 Q458 318 446 342"/>
    <path d="M462 330 Q480 350 466 376"/>
  </g>

  <!-- tin mouse, mid-jerk -->
  <g transform="translate(330 430) rotate(-14)">
    <!-- tail -->
    <path d="M100 -5 C150 -10 170 -60 150 -80" fill="none" stroke="#222" stroke-width="12" stroke-linecap="round"/>
    <path d="M100 -5 C150 -10 170 -60 150 -80" fill="none" stroke="#b9c3cc" stroke-width="5" stroke-linecap="round"/>
    <!-- back legs -->
    <path d="M40 40 L52 100 M40 40 L52 100" stroke="#222" stroke-width="16" stroke-linecap="round"/>
    <path d="M40 40 L52 100" stroke="#7d8b97" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="60" cy="104" rx="16" ry="7" fill="#7d8b97" stroke="#222" stroke-width="3"/>
    <!-- front legs, kicked forward -->
    <path d="M-40 42 L-70 92" stroke="#222" stroke-width="16" stroke-linecap="round"/>
    <path d="M-40 42 L-70 92" stroke="#7d8b97" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="-80" cy="96" rx="16" ry="7" fill="#7d8b97" stroke="#222" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="105" ry="55" fill="#9aa8b4" stroke="#222" stroke-width="4"/>
    <path d="M-60 -30 Q-10 -48 50 -40" fill="none" stroke="#c6d0d8" stroke-width="6" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="-100" cy="-18" rx="45" ry="36" fill="#9aa8b4" stroke="#222" stroke-width="4"/>
    <!-- ears -->
    <circle cx="-110" cy="-54" r="26" fill="#c98f85" stroke="#222" stroke-width="4"/>
    <circle cx="-80" cy="-50" r="22" fill="#c98f85" stroke="#222" stroke-width="4"/>
    <!-- snout and nose -->
    <ellipse cx="-138" cy="-12" rx="14" ry="10" fill="#7d8b97" stroke="#222" stroke-width="3"/>
    <circle cx="-152" cy="-14" r="5" fill="#222"/>
    <!-- eye -->
    <circle cx="-110" cy="-24" r="6" fill="#222"/>
    <circle cx="-108" cy="-26" r="2" fill="#fff"/>
    <!-- wind key on the back -->
    <rect x="-20" y="-62" width="10" height="18" fill="#c9a44a" stroke="#222" stroke-width="3"/>
    <circle cx="-15" cy="-68" r="9" fill="#d9b35a" stroke="#222" stroke-width="3"/>
    <!-- side seam rivets -->
    <circle cx="-30" cy="10" r="4" fill="#56616b"/>
    <circle cx="20" cy="12" r="4" fill="#56616b"/>
  </g>

  <!-- brass spring key on the desk -->
  <g>
    <!-- bow -->
    <circle cx="500" cy="598" r="40" fill="#d9a945" stroke="#222" stroke-width="4"/>
    <circle cx="500" cy="598" r="16" fill="#ece4cc" stroke="#222" stroke-width="3"/>
    <!-- coiled spring along shaft -->
    <path d="M540 598 q8 -16 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
    <path d="M540 598 q8 -16 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#c9a44a" stroke-width="2"/>
    <!-- shaft -->
    <rect x="540" y="590" width="180" height="16" fill="#d9a945" stroke="#222" stroke-width="4"/>
    <!-- bit teeth -->
    <rect x="690" y="606" width="14" height="26" fill="#d9a945" stroke="#222" stroke-width="3"/>
    <rect x="712" y="606" width="14" height="18" fill="#d9a945" stroke="#222" stroke-width="3"/>
    <!-- highlight -->
    <path d="M478 580 Q490 566 510 566" fill="none" stroke="#f3dc9a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- signature -->
  <text x="745" y="780" font-size="28" fill="#222">P.</text>
</svg>