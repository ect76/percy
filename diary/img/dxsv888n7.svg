<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <clipPath id="bodyClip">
      <ellipse cx="640" cy="470" rx="115" ry="100"/>
    </clipPath>
  </defs>

  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#e8e5dc"/>

  <!-- fog bands -->
  <ellipse cx="160" cy="200" rx="260" ry="50" fill="#d6dad8" opacity="0.7"/>
  <ellipse cx="620" cy="150" rx="240" ry="40" fill="#dde0dd" opacity="0.8"/>
  <ellipse cx="400" cy="300" rx="320" ry="30" fill="#d2d7d5" opacity="0.5"/>

  <!-- counter -->
  <rect x="0" y="560" width="800" height="240" fill="#9a7356"/>
  <rect x="0" y="556" width="800" height="10" fill="#6b4c36" stroke="#2e2420" stroke-width="3"/>
  <line x1="0" y1="610" x2="800" y2="610" stroke="#7d5a40" stroke-width="2"/>
  <line x1="0" y1="680" x2="800" y2="680" stroke="#7d5a40" stroke-width="2"/>

  <!-- teapot body -->
  <ellipse cx="640" cy="470" rx="115" ry="100" fill="#fbfbf7" stroke="#2e2420" stroke-width="4"/>
  <g clip-path="url(#bodyClip)">
    <rect x="500" y="478" width="280" height="28" fill="#3f6fa8"/>
    <line x1="500" y1="478" x2="780" y2="478" stroke="#2c4f7c" stroke-width="3"/>
    <line x1="500" y1="506" x2="780" y2="506" stroke="#2c4f7c" stroke-width="3"/>
  </g>
  <!-- chipped spout -->
  <path d="M530 440 Q500 420 492 396 L506 392 Q516 414 540 428 Z" fill="#fbfbf7" stroke="#2e2420" stroke-width="3"/>
  <path d="M500 396 L506 392 L503 402 Z" fill="#e8e5dc"/>
  <!-- crooked lid -->
  <g transform="rotate(-9 640 372)">
    <ellipse cx="640" cy="372" rx="64" ry="17" fill="#fbfbf7" stroke="#2e2420" stroke-width="4"/>
    <ellipse cx="640" cy="366" rx="64" ry="8" fill="#3f6fa8" opacity="0.0"/>
    <circle cx="640" cy="350" r="10" fill="#fbfbf7" stroke="#2e2420" stroke-width="3"/>
  </g>
  <path d="M586 470 Q640 500 694 470" fill="none" stroke="#2c4f7c" stroke-width="0"/>

  <!-- recipe card, lying face-up -->
  <g transform="translate(190 380) rotate(-4)">
    <!-- shadow -->
    <rect x="8" y="10" width="360" height="260" rx="4" fill="#4a3a2c" opacity="0.35"/>
    <!-- card body with soft curled corners -->
    <path d="M14 0 L346 0 Q360 0 360 14 L360 246 Q360 260 346 260 L14 260 Q0 260 0 246 L0 14 Q0 0 14 0 Z"
          fill="#f6efdc" stroke="#2e2420" stroke-width="3"/>
    <!-- curled corner highlights -->
    <path d="M340 0 Q360 2 360 22" fill="none" stroke="#c9bb9a" stroke-width="4"/>
    <path d="M0 240 Q2 260 22 260" fill="none" stroke="#c9bb9a" stroke-width="4"/>
    <!-- faint brown tea ring -->
    <circle cx="42" cy="46" r="30" fill="none" stroke="#8a5a2b" stroke-width="7" opacity="0.45"/>
    <!-- handwritten text -->
    <g font-family="serif" font-style="italic" fill="#2e2420">
      <text x="88" y="54" font-size="24">Dot's scone recipe</text>
      <text x="26" y="104" font-size="17">225g self-raising flour, pinch of salt</text>
      <text x="26" y="132" font-size="17">50g butter, rubbed in</text>
      <text x="26" y="160" font-size="17">1 tbsp sugar, 150ml milk</text>
      <text x="26" y="200" font-size="17">Bake 220C, 12 minutes.</text>
      <text x="26" y="228" font-size="17">Eat the same day.</text>
    </g>
  </g>

  <!-- signature -->
  <text x="30" y="775" font-family="serif" font-size="26" fill="#2e2420">P.</text>
</svg>