<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d3d3"/>
      <stop offset="0.6" stop-color="#e4e7e2"/>
      <stop offset="1" stop-color="#f1ecdf"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9f9884"/>
      <stop offset="1" stop-color="#bdb5a0"/>
    </linearGradient>
    <linearGradient id="fogband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ea" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f6f3ea" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f6f3ea" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ede0"/>
  <rect x="0" y="0" width="800" height="800" fill="url(#sky)" opacity="0.9"/>

  <!-- distant roofs in fog -->
  <polygon points="520,250 580,220 640,250 640,380 520,380" fill="#aab3b3" stroke="#2b2622" stroke-width="1.5"/>
  <polygon points="650,300 700,275 760,300 760,400 650,400" fill="#b8bfbb" stroke="#2b2622" stroke-width="1.5"/>
  <polygon points="300,300 345,270 380,300 380,400 300,400" fill="#c3c9c4" stroke="#2b2622" stroke-width="1.2"/>

  <!-- bell tower at end of lane -->
  <polygon points="402,200 450,200 426,112" fill="#5d6670" stroke="#2b2622" stroke-width="2"/>
  <rect x="402" y="200" width="48" height="42" fill="#cfc7b3" stroke="#2b2622" stroke-width="2"/>
  <path d="M412 242 V214 Q420 204 428 214 V242 Z" fill="#2b2622"/>
  <path d="M432 242 V218 Q439 210 446 218 V242 Z" fill="#2b2622"/>
  <rect x="408" y="242" width="36" height="222" fill="#bdb6a4" stroke="#2b2622" stroke-width="2"/>
  <rect x="408" y="242" width="9" height="222" fill="#8f8877" opacity="0.7"/>
  <line x1="408" y1="300" x2="444" y2="300" stroke="#2b2622" stroke-width="1"/>
  <line x1="408" y1="360" x2="444" y2="360" stroke="#2b2622" stroke-width="1"/>
  <path d="M414 420 V446 Q426 436 438 446 V420 Z" fill="#3e3a33"/>

  <!-- back wall on right -->
  <polygon points="800,380 480,428 480,468 800,560" fill="#d2c9b3" stroke="#2b2622" stroke-width="2"/>
  <polygon points="800,372 480,420 480,428 800,380" fill="#7d7663" stroke="#2b2622" stroke-width="1.5"/>

  <!-- fog bands -->
  <rect x="0" y="330" width="800" height="90" fill="url(#fogband)"/>
  <rect x="0" y="420" width="800" height="60" fill="url(#fogband)" opacity="0.8"/>

  <!-- cottage roof edge -->
  <polygon points="0,196 330,364 330,410 0,240" fill="#5d6670" stroke="#2b2622" stroke-width="2"/>

  <!-- cottage facade (plaster with timber frame) -->
  <polygon points="0,240 330,410 330,590 0,770" fill="#e8e0cc" stroke="#2b2622" stroke-width="2.5"/>
  <!-- timber posts and beams -->
  <g stroke="#6b4a33" stroke-width="9" stroke-linecap="square" fill="none">
    <line x1="4" y1="244" x2="4" y2="772"/>
    <line x1="112" y1="296" x2="112" y2="708"/>
    <line x1="222" y1="350" x2="222" y2="650"/>
    <line x1="326" y1="406" x2="326" y2="588"/>
    <line x1="0" y1="400" x2="330" y2="570"/>
  </g>
  <g stroke="#2b2622" stroke-width="1.5" fill="none">
    <line x1="112" y1="296" x2="112" y2="708"/>
    <line x1="222" y1="350" x2="222" y2="650"/>
    <line x1="0" y1="400" x2="330" y2="570"/>
    <line x1="0" y1="330" x2="330" y2="500"/>
  </g>
  <!-- window -->
  <polygon points="130,372 200,408 200,490 130,454" fill="#4b5a5e" stroke="#2b2622" stroke-width="2"/>
  <line x1="165" y1="390" x2="165" y2="471" stroke="#6b4a33" stroke-width="4"/>
  <!-- wet stains down the front -->
  <g fill="#4a3424" opacity="0.18">
    <polygon points="60,320 66,320 66,520 60,520"/>
    <polygon points="160,380 166,380 168,600 162,600"/>
    <polygon points="268,430 274,430 274,560 268,560"/>
  </g>
  <!-- rain running down the timber front -->
  <g stroke="#3b4a52" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <path d="M28 352 V420 M28 440 V470"/>
    <path d="M78 330 V402 M78 420 V470 M78 500 V530"/>
    <path d="M140 372 V398 M140 420 V446"/>
    <path d="M190 402 V460 M190 480 V540"/>
    <path d="M250 430 V480 M250 500 V552"/>
    <path d="M300 462 V510 M300 530 V560"/>
    <path d="M52 470 V540 M52 560 V600"/>
    <path d="M110 500 V560 M110 580 V640"/>
    <path d="M230 520 V590 M230 610 V650"/>
  </g>
  <!-- cottage base -->
  <polygon points="0,770 330,590 330,606 0,786" fill="#6f6a5c" stroke="#2b2622" stroke-width="2"/>

  <!-- lane -->
  <polygon points="0,800 330,600 410,462 455,462 800,560 800,800" fill="url(#lane)" stroke="#2b2622" stroke-width="2"/>
  <polygon points="0,800 330,600 332,606 0,800" fill="#7a7364"/>

  <!-- cobbles -->
  <g fill="#d6cfbd" stroke="#2b2622" stroke-width="1.2">
    <ellipse cx="60" cy="770" rx="26" ry="9"/>
    <ellipse cx="150" cy="742" rx="20" ry="7"/>
    <ellipse cx="240" cy="700" rx="16" ry="6"/>
    <ellipse cx="600" cy="740" rx="30" ry="10"/>
    <ellipse cx="700" cy="690" rx="22" ry="8"/>
    <ellipse cx="520" cy="650" rx="16" ry="6"/>
    <ellipse cx="450" cy="530" rx="12" ry="4"/>
    <ellipse cx="380" cy="500" rx="8" ry="3"/>
    <ellipse cx="640" cy="600" rx="12" ry="4"/>
    <ellipse cx="330" cy="640" rx="14" ry="5"/>
  </g>

  <!-- puddles reflecting the tower -->
  <ellipse cx="300" cy="690" rx="95" ry="16" fill="#8fa7b0" stroke="#2b2622" stroke-width="1.5"/>
  <ellipse cx="560" cy="700" rx="120" ry="18" fill="#8fa7b0" stroke="#2b2622" stroke-width="1.5"/>
  <ellipse cx="438" cy="520" rx="36" ry="7" fill="#8fa7b0" stroke="#2b2622" stroke-width="1.2"/>
  <rect x="424" y="470" width="10" height="46" fill="#bdb6a4" opacity="0.7"/>
  <line x1="280" y1="684" x2="330" y2="696" stroke="#f6f3ea" stroke-width="2" opacity="0.8"/>
  <line x1="520" y1="694" x2="600" y2="706" stroke="#f6f3ea" stroke-width="2" opacity="0.8"/>

  <!-- rain -->
  <g stroke="#34434b" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
    <line x1="120" y1="60" x2="104" y2="104"/>
    <line x1="200" y1="40" x2="184" y2="88"/>
    <line x1="290" y1="90" x2="274" y2="134"/>
    <line x1="360" y1="30" x2="344" y2="70"/>
    <line x1="500" y1="50" x2="484" y2="96"/>
    <line x1="580" y1="120" x2="564" y2="160"/>
    <line x1="690" y1="40" x2="674" y2="88"/>
    <line x1="750" y1="150" x2="734" y2="194"/>
    <line x1="60" y1="190" x2="44" y2="236"/>
    <line x1="500" y1="200" x2="484" y2="244"/>
    <line x1="620" y1="300" x2="604" y2="344"/>
    <line x1="730" y1="320" x2="714" y2="364"/>
    <line x1="170" y1="130" x2="154" y2="176"/>
    <line x1="400" y1="150" x2="384" y2="196"/>
    <line x1="260" y1="230" x2="244" y2="270"/>
    <line x1="700" y1="470" x2="684" y2="512"/>
    <line x1="560" y1="520" x2="544" y2="560"/>
    <line x1="640" y1="620" x2="624" y2="660"/>
    <line x1="740" y1="680" x2="724" y2="720"/>
    <line x1="120" y1="620" x2="104" y2="660"/>
    <line x1="40" y1="560" x2="24" y2="600"/>
    <line x1="470" y1="620" x2="454" y2="660"/>
    <line x1="380" y1="740" x2="364" y2="780"/>
    <line x1="680" y1="770" x2="664" y2="800"/>
    <line x1="250" y1="110" x2="234" y2="150"/>
    <line x1="450" y1="300" x2="434" y2="340"/>
    <line x1="330" y1="330" x2="314" y2="368"/>
  </g>

  <!-- signature -->
  <text x="758" y="782" font-size="18" fill="#2b2622" text-anchor="end">P.</text>
</svg>