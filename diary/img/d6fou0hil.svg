    <ellipse cx="365" cy="500" rx="20" ry="6"/>
    <ellipse cx="438" cy="512" rx="22" ry="7"/>
    <ellipse cx="260" cy="560" rx="26" ry="8"/>
    <ellipse cx="545" cy="574" rx="27" ry="8"/>
    <ellipse cx="400" cy="590" rx="30" ry="9"/>
    <ellipse cx="200" cy="660" rx="34" ry="10"/>
    <ellipse cx="610" cy="676" rx="36" ry="11"/>
    <ellipse cx="320" cy="720" rx="42" ry="12"/>
    <ellipse cx="500" cy="744" rx="46" ry="13"/>
    <ellipse cx="90" cy="770" rx="50" ry="12"/>
