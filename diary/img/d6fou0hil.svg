  <!-- artist's mark -->
  <path d="M748 782 V750 H760 Q771 750 771 761 Q771 772 760 772 H748" fill="none" stroke="#e6e0cf" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="776" cy="782" r="2" fill="#e6e0cf"/>
