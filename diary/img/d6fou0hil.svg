    <line x1="150" y1="40" x2="134" y2="80"/>
    <line x1="240" y1="110" x2="224" y2="150"/>
    <line x1="330" y1="60" x2="314" y2="100"/>
    <line x1="520" y1="50" x2="504" y2="90"/>
    <line x1="610" y1="120" x2="594" y2="160"/>
    <line x1="700" y1="60" x2="684" y2="100"/>
    <line x1="760" y1="200" x2="744" y2="240"/>
    <line x1="40" y1="260" x2="24" y2="300"/>
    <line x1="110" y1="500" x2="94" y2="540"/>
    <line x1="200" y1="610" x2="184" y2="650"/>
    <line x1="280" y1="720" x2="264" y2="760"/>
    <line x1="520" y1="620" x2="504" y2="660"/>
    <line x1="600" y1="520" x2="584" y2="560"/>
    <line x1="690" y1="700" x2="674" y2="740"/>
    <line x1="750" y1="540" x2="734" y2="580"/>
    <line x1="360" y1="180" x2="344" y2="220"/>
    <line x1="450" y1="260" x2="434" y2="300"/>
    <line x1="170" y1="420" x2="154" y2="460"/>
    <line x1="470" y1="400" x2="454" y2="440"/>
    <line x1="30" y1="640" x2="14" y2="680"/>
