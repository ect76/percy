<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b28"/>
      <stop offset="0.5" stop-color="#2a3344"/>
      <stop offset="1" stop-color="#3b4558"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="1" stop-color="#1f242e"/>
    </linearGradient>
  </defs>

  <!-- paper and night sky -->
  <rect x="0" y="0" width="800" height="800" fill="url(#sky)"/>

  <!-- distant fog banks -->
  <ellipse cx="400" cy="335" rx="150" ry="28" fill="#c9d2dc" opacity="0.22"/>
  <ellipse cx="400" cy="300" rx="260" ry="22" fill="#c9d2dc" opacity="0.12"/>

  <!-- bell tower at the far end -->
  <polygon points="372,190 400,118 428,190" fill="#2e3442" stroke="#0d0f14" stroke-width="2.5"/>
  <rect x="372" y="190" width="56" height="44" fill="#3c4250" stroke="#0d0f14" stroke-width="2.5"/>
  <rect x="380" y="200" width="8" height="18" fill="#12151c"/>
  <rect x="412" y="200" width="8" height="18" fill="#12151c"/>
  <rect x="378" y="234" width="44" height="106" fill="#4a5060" stroke="#0d0f14" stroke-width="2.5"/>
  <circle cx="400" cy="212" r="12" fill="#d8d2bf" stroke="#0d0f14" stroke-width="1.5" opacity="0.8"/>
  <line x1="400" y1="212" x2="404" y2="203" stroke="#0d0f14" stroke-width="1.8"/>
  <line x1="400" y1="212" x2="392" y2="214" stroke="#0d0f14" stroke-width="2"/>
  <path d="M396 204 l4 4 l-3 3 l3 3" fill="none" stroke="#0d0f14" stroke-width="0.8"/>
  <rect x="392" y="262" width="16" height="22" fill="#12151c"/>
  <ellipse cx="400" cy="338" rx="120" ry="22" fill="#c9d2dc" opacity="0.25"/>

  <!-- left cottage wall -->
  <polygon points="0,140 290,300 290,490 0,760" fill="#5a4c42" stroke="#0d0f14" stroke-width="3"/>
  <line x1="0" y1="130" x2="290" y2="290" stroke="#0d0f14" stroke-width="5"/>
  <polygon points="60,332 130,340 130,425 60,438" fill="#171a22" stroke="#0d0f14" stroke-width="2"/>
  <polygon points="170,344 230,351 230,406 170,418" fill="#171a22" stroke="#0d0f14" stroke-width="2"/>

  <!-- right cottage wall -->
  <polygon points="800,140 510,300 510,490 800,760" fill="#4d4139" stroke="#0d0f14" stroke-width="3"/>
  <line x1="800" y1="130" x2="510" y2="290" stroke="#0d0f14" stroke-width="5"/>
  <polygon points="740,332 670,340 670,425 740,438" fill="#171a22" stroke="#0d0f14" stroke-width="2"/>
  <polygon points="630,344 570,351 570,406 630,418" fill="#171a22" stroke="#0d0f14" stroke-width="2"/>

  <!-- lane -->
  <polygon points="120,800 370,340 430,340 680,800" fill="url(#lane)" stroke="#0d0f14" stroke-width="3"/>

  <!-- cobbles -->
  <g fill="#2c323e" stroke="#0d0f14" stroke-width="1.2">
    <ellipse cx="390" cy="372" rx="8" ry="3"/>
    <ellipse cx="412" cy="378" rx="7" ry="3"/>
    <ellipse cx="380" cy="392" rx="10" ry="4"/>
    <ellipse cx="418" cy="398" rx="9" ry="4"/>
