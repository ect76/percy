<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect width="800" height="800" fill="#f3eee2"/>
  <!-- sky -->
  <rect x="0" y="0" width="800" height="400" fill="#d3dadd"/>
  <!-- distant fog bands -->
  <rect x="0" y="330" width="800" height="110" fill="#eef1f1" opacity="0.8"/>
  <rect x="0" y="380" width="800" height="60" fill="#f7f8f6" opacity="0.7"/>
  <!-- bell tower -->
  <rect x="402" y="230" width="38" height="210" fill="#8f8070" stroke="#2b2b2b" stroke-width="2"/>
  <polygon points="398,232 421,150 444,232" fill="#6e6259" stroke="#2b2b2b" stroke-width="2"/>
  <polygon points="410,190 421,150 432,190" fill="#fbfcfc" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="412" y="262" width="18" height="22" fill="#2b2b2b"/>
  <rect x="412" y="300" width="18" height="22" fill="#2b2b2b"/>
  <rect x="410" y="232" width="22" height="6" fill="#fbfcfc"/>
  <!-- fog over tower base -->
  <rect x="380" y="380" width="90" height="70" fill="#f7f8f6" opacity="0.75"/>
  <!-- left cottage wall -->
  <polygon points="0,130 230,290 230,800 0,800" fill="#c9b79c" stroke="#2b2b2b" stroke-width="2.5"/>
  <!-- snow on cottage roof -->
  <polygon points="0,110 0,130 230,290 230,262 0,110" fill="#fbfcfc" stroke="#2b2b2b" stroke-width="2"/>
  <!-- cottage window with warm light -->
  <polygon points="40,330 120,380 120,470 40,430" fill="#e6c27a" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="80" y1="355" x2="80" y2="450" stroke="#2b2b2b" stroke-width="2"/>
  <polygon points="36,426 124,476 124,482 36,436" fill="#fbfcfc" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- right row of houses -->
  <polygon points="800,170 640,300 640,800 800,800" fill="#b5aa98" stroke="#2b2b2b" stroke-width="2.5"/>
  <polygon points="800,150 800,170 640,300 640,282" fill="#fbfcfc" stroke="#2b2b2b" stroke-width="2"/>
  <polygon points="700,420 770,460 770,560 700,520" fill="#8d8474" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- snowy lane -->
  <polygon points="200,800 610,800 445,432 405,432" fill="#fbfcfc" stroke="#2b2b2b" stroke-width="2.5"/>
  <!-- lane edge snow banks -->
  <polygon points="230,800 200,800 405,432 418,432" fill="#e3e8ea" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- cobbles -->
  <g fill="#b9c1c6" stroke="#2b2b2b" stroke-width="1">
    <ellipse cx="300" cy="760" rx="22" ry="8"/>
    <ellipse cx="470" cy="740" rx="24" ry="8"/>
    <ellipse cx="380" cy="650" rx="16" ry="6"/>
    <ellipse cx="520" cy="620" rx="14" ry="5"/>
    <ellipse cx="350" cy="560" rx="10" ry="4"/>
    <ellipse cx="440" cy="520" rx="9" ry="4"/>
    <ellipse cx="415" cy="470" rx="6" ry="3"/>
    <ellipse cx="260" cy="700" rx="16" ry="6"/>
    <ellipse cx="560" cy="700" rx="18" ry="6"/>
  </g>
  <!-- doorstep -->
  <polygon points="0,700 230,690 250,800 0,800" fill="#a79d8e" stroke="#2b2b2b" stroke-width="2.5"/>
  <line x1="0" y1="740" x2="240" y2="735" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- fog bank in front of lane end -->
  <rect x="330" y="420" width="200" height="40" fill="#f7f8f6" opacity="0.6"/>
  <!-- rain -->
  <g stroke="#4f5b63" stroke-width="1.6" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="40" x2="48" y2="80"/>
    <line x1="150" y1="20" x2="138" y2="60"/>
    <line x1="240" y1="60" x2="228" y2="100"/>
    <line x1="330" y1="10" x2="318" y2="50"/>
    <line x1="470" y1="30" x2="458" y2="70"/>
    <line x1="560" y1="90" x2="548" y2="130"/>
    <line x1="700" y1="40" x2="688" y2="80"/>
    <line x1="760" y1="200" x2="748" y2="240"/>
    <line x1="30" y1="180" x2="18" y2="220"/>
    <line x1="180" y1="150" x2="168" y2="190"/>
    <line x1="280" y1="200" x2="268" y2="240"/>
    <line x1="520" y1="210" x2="508" y2="250"/>
    <line x1="620" y1="160" x2="608" y2="200"/>
    <line x1="90" y1="520" x2="78" y2="560"/>
    <line x1="150" y1="600" x2="138" y2="640"/>
    <line x1="300" y1="300" x2="288" y2="340"/>
    <line x1="700" y1="620" x2="688" y2="660"/>
    <line x1="740" y1="720" x2="728" y2="760"/>
    <line x1="600" y1="500" x2="588" y2="540"/>
    <line x1="520" y1="330" x2="508" y2="370"/>
    <line x1="400" y1="110" x2="388" y2="150"/>
    <line x1="110" y1="290" x2="98" y2="330"/>
  </g>
  <!-- signature -->
  <text x="772" y="780" font-size="18" fill="#2b2b2b" text-anchor="end" font-family="serif">P.</text>
</svg>