  <polygon points="0,130 200,215 200,198 0,80" fill="#6f6a66" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="150" y="190" width="14" height="30" fill="#8a7f78" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="30,300 80,318 80,400 30,420" fill="#7d8f98" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="110,350 160,362 160,440 110,460" fill="#7d8f98" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="20,520 60,532 60,590 20,600" fill="#5c4f45" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- right cottage row -->
  <polygon points="800,130 600,215 600,551 800,790" fill="#bfb29b" stroke="#2b2b2b" stroke-width="2"/>
  <polygon points="800,130 600,215 600,198 800,80" fill="#6f6a66" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="636" y="190" width="14" height="30" fill="#8a7f78" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="720,300 670,318 670,400 720,420" fill="#7d8f98" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="640,350 690,362 690,440 640,460" fill="#7d8f98" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="740,520 780,532 780,590 740,600" fill="#5c4f45" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- lane -->
  <polygon points="0,800 800,800 430,340 370,340" fill="#9a9187" stroke="#2b2b2b" stroke-width="2"/>
  <!-- cobbles -->
  <g fill="#7a7268" opacity="0.7">
    <ellipse cx="120" cy="760" rx="14" ry="7"/>
    <ellipse cx="260" cy="720" rx="10" ry="5"/>
    <ellipse cx="520" cy="750" rx="13" ry="6"/>
    <ellipse cx="410" cy="690" rx="8" ry="4"/>
