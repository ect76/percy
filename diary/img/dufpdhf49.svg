<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efeae0"/>

  <!-- grey sky -->
  <rect x="0" y="0" width="800" height="340" fill="#c3c9cd"/>
  <rect x="0" y="260" width="800" height="90" fill="#dfe3e4" opacity="0.8"/>

  <!-- distant fog band -->
  <rect x="0" y="330" width="800" height="50" fill="#e9ecec" opacity="0.85"/>

  <!-- narrow bell tower at end of lane -->
