  <rect x="380" y="170" width="40" height="160" fill="#7d8288" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="386" y="190" width="28" height="30" fill="#3a3d42" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="370" y="328" width="60" height="14" fill="#6a6f75" stroke="#2b2b2b" stroke-width="2"/>
  <!-- grey streaks on tower -->
  <g stroke="#4f545a" stroke-width="2" opacity="0.5" fill="none">
    <line x1="388" y1="230" x2="387" y2="318"/>
    <line x1="398" y1="226" x2="399" y2="300"/>
    <line x1="410" y1="240" x2="409" y2="322"/>
    <line x1="419" y1="220" x2="418" y2="290"/>
  </g>

  <!-- left cottage row -->
