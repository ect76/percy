    <line x1="260" y1="250" x2="230" y2="310"/>
    <line x1="330" y1="150" x2="300" y2="210"/>
    <line x1="560" y1="250" x2="530" y2="310"/>
    <line x1="480" y1="180" x2="450" y2="240"/>
    <line x1="650" y1="330" x2="620" y2="390"/>
    <line x1="720" y1="420" x2="690" y2="480"/>
    <line x1="40" y1="400" x2="10" y2="460"/>
    <line x1="110" y1="480" x2="80" y2="540"/>
    <line x1="200" y1="620" x2="170" y2="680"/>
    <line x1="260" y1="520" x2="230" y2="580"/>
    <line x1="60" y1="650" x2="30" y2="710"/>
    <line x1="350" y1="540" x2="320" y2="600"/>
    <line x1="470" y1="560" x2="440" y2="620"/>
    <line x1="560" y1="480" x2="530" y2="540"/>
    <line x1="700" y1="580" x2="670" y2="640"/>
    <line x1="780" y1="650" x2="750" y2="710"/>
    <line x1="400" y1="700" x2="370" y2="760"/>
    <line x1="520" y1="720" x2="490" y2="780"/>
    <line x1="630" y1="740" x2="600" y2="790"/>
