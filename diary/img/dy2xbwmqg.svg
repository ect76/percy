  <!-- signature P. -->
  <g fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M730 760 L730 712 L746 712 Q758 712 758 724 Q758 736 746 736 L730 736"/>
  </g>
  <circle cx="768" cy="758" r="3" fill="#2a2a2a"/>
</svg>