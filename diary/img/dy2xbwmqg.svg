<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4f1e8"/>

  <!-- fog bands -->
  <rect x="0" y="0" width="800" height="330" fill="#dde2e4"/>
  <ellipse cx="200" cy="200" rx="260" ry="34" fill="#eef0f0" opacity="0.8"/>
  <ellipse cx="620" cy="150" rx="240" ry="30" fill="#eef0f0" opacity="0.7"/>
  <ellipse cx="400" cy="300" rx="380" ry="26" fill="#eef0f0" opacity="0.9"/>

  <!-- distant cottages in the fog -->
  <g stroke="#2a2a2a" stroke-width="2" fill="#b7c2c8">
    <path d="M90 330 V282 L125 258 L160 282 V330 Z"/>
    <path d="M520 332 V290 L560 262 L600 290 V332 Z"/>
    <path d="M640 332 V302 L668 282 L696 302 V332 Z"/>
  </g>

  <!-- green -->
  <path d="M0 330 Q400 310 800 330 V800 H0 Z" fill="#9dbd7c" stroke="#2a2a2a" stroke-width="2.5"/>

  <!-- pond -->
  <ellipse cx="420" cy="590" rx="300" ry="135" fill="#56879b" stroke="#1f1f1f" stroke-width="3"/>
  <ellipse cx="400" cy="570" rx="240" ry="95" fill="#6fa2b4" opacity="0.8"/>
  <path d="M190 560 Q230 530 270 548" fill="none" stroke="#c9e3ea" stroke-width="3" opacity="0.7"/>
  <path d="M520 620 Q560 600 600 618" fill="none" stroke="#c9e3ea" stroke-width="3" opacity="0.7"/>

  <!-- ripples from the dives -->
  <g fill="none" stroke="#e6f3f6" stroke-width="3">
    <ellipse cx="330" cy="610" rx="30" ry="9"/>
    <ellipse cx="330" cy="610" rx="66" ry="20" opacity="0.9"/>
    <ellipse cx="330" cy="610" rx="108" ry="33" opacity="0.7"/>
    <ellipse cx="330" cy="610" rx="150" ry="46" opacity="0.5"/>
  </g>
  <g fill="none" stroke="#e6f3f6" stroke-width="2.5">
    <ellipse cx="560" cy="555" rx="18" ry="5"/>
    <ellipse cx="560" cy="555" rx="44" ry="13" opacity="0.9"/>
    <ellipse cx="560" cy="555" rx="78" ry="24" opacity="0.6"/>
  </g>
  <!-- splash droplets -->
  <g fill="#e6f3f6" stroke="#1f1f1f" stroke-width="1">
    <circle cx="318" cy="588" r="3"/>
    <circle cx="344" cy="584" r="2.5"/>
    <circle cx="552" cy="536" r="2.5"/>
    <circle cx="570" cy="532" r="2"/>
  </g>

  <!-- sign post -->
  <path d="M146 360 L154 360 L158 580 L142 580 Z" fill="#7a5a3c" stroke="#1f1f1f" stroke-width="3"/>
  <!-- chains -->
  <g fill="none" stroke="#b08d3c" stroke-width="3">
    <path d="M112 420 L112 452"/>
    <path d="M128 420 L128 452"/>
  </g>
  <g fill="#c9a24a" stroke="#1f1f1f" stroke-width="1">
    <ellipse cx="112" cy="424" rx="4" ry="5"/>
    <ellipse cx="112" cy="434" rx="4" ry="5"/>
    <ellipse cx="112" cy="444" rx="4" ry="5"/>
    <ellipse cx="128" cy="424" rx="4" ry="5"/>
    <ellipse cx="128" cy="434" rx="4" ry="5"/>
    <ellipse cx="128" cy="444" rx="4" ry="5"/>
  </g>
  <!-- board with green rim -->
  <rect x="68" y="330" width="200" height="92" rx="12" fill="#3f6b3a" stroke="#1f1f1f" stroke-width="3"/>
  <rect x="80" y="342" width="176" height="68" rx="8" fill="#f6f0dc" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="168" y="382" font-family="serif" font-size="19" text-anchor="middle" fill="#2a3d2a">Welcome to Mossbrook</text>
  <!-- pointed roof cap -->
  <path d="M60 330 L168 296 L276 330 Z" fill="#8a4f3a" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>
  <!-- moss at base -->
  <g fill="#5f8a45" stroke="#1f1f1f" stroke-width="1.5">
    <ellipse cx="150" cy="578" rx="22" ry="8"/>
    <ellipse cx="172" cy="584" rx="16" ry="6"/>
    <ellipse cx="136" cy="586" rx="12" ry="5"/>
