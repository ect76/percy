  <g stroke="#4f6470" stroke-width="1.3" opacity="0.6" stroke-linecap="round">
    <path d="M60 60 L50 84"/><path d="M130 40 L120 64"/><path d="M200 90 L190 114"/>
    <path d="M270 30 L260 54"/><path d="M340 80 L330 104"/><path d="M410 20 L400 44"/>
    <path d="M480 70 L470 94"/><path d="M550 36 L540 60"/><path d="M620 96 L610 120"/>
    <path d="M690 44 L680 68"/><path d="M750 110 L740 134"/><path d="M30 170 L20 194"/>
    <path d="M90 200 L80 224"/><path d="M250 190 L240 214"/><path d="M430 200 L420 224"/>
    <path d="M700 200 L690 224"/><path d="M770 260 L760 284"/><path d="M40 300 L30 324"/>
    <path d="M360 250 L350 274"/><path d="M520 180 L510 204"/><path d="M600 240 L590 264"/>
    <path d="M740 380 L730 404"/><path d="M660 430 L650 454"/><path d="M520 390 L510 414"/>
    <path d="M40 420 L30 444"/><path d="M220 470 L210 494"/><path d="M310 430 L300 454"/>
    <path d="M700 520 L690 544"/><path d="M90 540 L80 564"/><path d="M780 470 L770 494"/>
    <path d="M740 660 L730 684"/><path d="M660 700 L650 724"/><path d="M60 700 L50 724"/>
    <path d="M200 740 L190 764"/><path d="M480 760 L470 784"/><path d="M620 770 L610 794"/>
    <path d="M400 700 L390 724"/><path d="M130 650 L120 674"/><path d="M770 600 L760 624"/>
