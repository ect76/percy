<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe8d8"/>

  <!-- dusk sky, flat bands -->
  <rect x="0" y="0" width="800" height="250" fill="#3e4b63"/>
  <rect x="0" y="250" width="800" height="130" fill="#6f7088"/>
  <rect x="0" y="380" width="800" height="80" fill="#b08a7a"/>
  <rect x="0" y="460" width="800" height="50" fill="#d6a86c"/>

  <!-- faint village roofs in the fog -->
  <g fill="#4c4a5c" stroke="#1d1d24" stroke-width="2" opacity="0.7">
    <path d="M60,470 L60,430 L95,400 L130,430 L130,470 Z"/>
    <path d="M140,468 L140,440 L170,415 L200,440 L200,468 Z"/>
    <path d="M590,466 L590,428 L625,398 L660,428 L660,466 Z"/>
    <path d="M675,468 L675,442 L705,420 L735,442 L735,468 Z"/>
  </g>

  <!-- low fog bands -->
  <rect x="0" y="420" width="800" height="50" fill="#e9e3d6" opacity="0.55"/>
  <rect x="0" y="470" width="800" height="45" fill="#e9e3d6" opacity="0.4"/>

  <!-- grass field -->
  <path d="M0,500 Q400,470 800,500 L800,800 L0,800 Z" fill="#5d7747" stroke="#1d1d24" stroke-width="2"/>
  <path d="M0,560 Q400,530 800,560 L800,800 L0,800 Z" fill="#4c6539"/>

  <!-- empty bare patch around the stone -->
  <ellipse cx="380" cy="600" rx="170" ry="52" fill="#9aa173" stroke="#1d1d24" stroke-width="2" stroke-dasharray="6 5"/>
  <ellipse cx="380" cy="600" rx="110" ry="32" fill="#aab07f" opacity="0.7"/>

  <!-- grass tufts, sparse -->
  <g stroke="#2f4224" stroke-width="2" fill="none">
    <path d="M200,640 l-4,-14 M204,640 l0,-18 M208,640 l5,-13"/>
    <path d="M560,630 l-4,-14 M564,630 l0,-18 M568,630 l5,-13"/>
    <path d="M250,700 l-4,-14 M254,700 l0,-18 M258,700 l5,-13"/>
    <path d="M520,710 l-4,-14 M524,710 l0,-18 M528,710 l5,-13"/>
  </g>

  <!-- hum: faint concentric arcs from the stone top -->
  <g fill="none" stroke="#2a2a33" stroke-width="2" opacity="0.55">
    <path d="M300,180 Q280,150 300,120"/>
    <path d="M280,180 Q240,140 280,100"/>
    <path d="M260,180 Q200,130 260,80"/>
    <path d="M460,180 Q480,150 460,120"/>
    <path d="M480,180 Q520,140 480,100"/>
    <path d="M500,180 Q560,130 500,80"/>
  </g>

  <!-- the standing stone -->
  <path d="M330,610 L338,260 Q352,172 378,150 Q402,172 412,262 L424,610 Z" fill="#7d8088" stroke="#1d1d24" stroke-width="3" stroke-linejoin="round"/>
  <path d="M378,150 Q402,172 412,262 L424,610 L392,610 Q398,420 386,250 Q382,200 378,150 Z" fill="#5a5d66"/>
  <!-- stone marks -->
  <g fill="none" stroke="#2a2b31" stroke-width="2" opacity="0.7">
    <path d="M352,330 l10,-8 l6,10"/>
    <path d="M360,470 l12,-6 l4,8"/>
    <path d="M345,540 l8,-5"/>
  </g>
  <!-- stone base line -->
  <path d="M322,612 Q378,622 432,612" fill="none" stroke="#1d1d24" stroke-width="3"/>

  <!-- cobbles in the foreground -->
  <g fill="#6b6259" stroke="#1d1d24" stroke-width="2">
    <rect x="30" y="700" width="70" height="26" rx="10"/>
    <rect x="110" y="706" width="80" height="26" rx="10"/>
    <rect x="200" y="716" width="90" height="28" rx="11"/>
    <rect x="300" y="726" width="100" height="30" rx="12"/>
    <rect x="410" y="728" width="110" height="30" rx="12"/>
    <rect x="530" y="718" width="90" height="28" rx="11"/>
    <rect x="630" y="706" width="80" height="26" rx="10"/>
    <rect x="720" y="700" width="70" height="26" rx="10"/>
    <rect x="70" y="750" width="100" height="32" rx="12"/>
    <rect x="190" y="762" width="120" height="32" rx="13"/>
    <rect x="330" y="770" width="130" height="28" rx="12"/>
    <rect x="480" y="762" width="120" height="32" rx="13"/>
    <rect x="620" y="750" width="110" height="32" rx="12"/>
  </g>
  <g fill="#7f766b" opacity="0.6">
    <rect x="120" y="710" width="30" height="8" rx="4"/>
    <rect x="320" y="732" width="34" height="8" rx="4"/>
    <rect x="500" y="722" width="28" height="7" rx="4"/>
    <rect x="210" y="768" width="36" height="8" rx="4"/>
  </g>

  <!-- fog over the foreground -->
  <rect x="0" y="640" width="800" height="60" fill="#efe8d8" opacity="0.35"/>
  <rect x="0" y="735" width="800" height="40" fill="#efe8d8" opacity="0.3"/>

  <!-- signature -->
  <text x="756" y="784" font-family="serif" font-size="22" fill="#2a2a33">P.</text>
</svg>