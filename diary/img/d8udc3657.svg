<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Paper and sky -->
  <rect x="0" y="0" width="800" height="800" fill="#e6ecef"/>
  <rect x="0" y="0" width="800" height="360" fill="#dfe8ec"/>
  <!-- Morning glow behind the tower -->
  <circle cx="520" cy="300" r="150" fill="#fff1c9" opacity="0.7"/>
  <circle cx="520" cy="300" r="90" fill="#fff8e1" opacity="0.8"/>

  <!-- Distant hills in fog -->
  <path d="M0 360 Q120 300 240 345 T480 330 T800 320 L800 420 L0 420 Z" fill="#c9d6dc" opacity="0.8"/>
  <path d="M0 395 Q150 355 300 390 T620 380 T800 370 L800 450 L0 450 Z" fill="#d7e1e6" opacity="0.8"/>

  <!-- Bell tower at the end of the lane -->
  <g stroke="#2b2622" stroke-width="3" stroke-linejoin="round">
    <rect x="500" y="250" width="42" height="150" fill="#8c837a"/>
    <polygon points="497,252 521,178 545,252" fill="#5f5a57"/>
    <rect x="508" y="272" width="26" height="30" fill="#3b3430"/>
    <line x1="521" y1="272" x2="521" y2="302" stroke="#8c837a" stroke-width="2"/>
    <circle cx="521" cy="262" r="9" fill="#f5efe3"/>
    <path d="M521 262 L521 256 M521 262 L526 264" stroke="#2b2622" stroke-width="1.5" fill="none"/>
    <rect x="508" y="335" width="26" height="40" fill="#5b5450"/>
    <path d="M497 252 L521 178 L545 252" fill="none"/>
  </g>
  <path d="M500 252 L521 180 L542 252 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Right-hand cottages receding -->
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="560,340 620,310 620,430 580,420" fill="#c7b59b"/>
    <polygon points="630,300 700,268 700,410 630,420" fill="#bfae92"/>
    <polygon points="705,262 800,230 800,430 705,410" fill="#d1bfa3"/>
    <polygon points="560,340 620,305 630,300 700,262 705,262 705,300 620,335 580,350" fill="#f6fafc"/>
  </g>
  <rect x="650" y="340" width="18" height="24" fill="#ffd98a" stroke="#2b2622" stroke-width="2"/>
  <rect x="735" y="310" width="18" height="24" fill="#ffd98a" stroke="#2b2622" stroke-width="2"/>

  <!-- Fog band over the mid-distance -->
  <rect x="0" y="330" width="800" height="90" fill="#f2f6f8" opacity="0.55"/>

  <!-- The snowy lane -->
  <polygon points="60,800 740,800 565,345 478,345" fill="#f7fbfd" stroke="#2b2622" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#9fb0b9" stroke-width="2" stroke-linecap="round">
    <ellipse cx="260" cy="720" rx="22" ry="6"/>
    <ellipse cx="470" cy="610" rx="14" ry="4"/>
    <ellipse cx="380" cy="520" rx="9" ry="3"/>
    <ellipse cx="520" cy="470" rx="7" ry="2.5"/>
    <ellipse cx="610" cy="700" rx="26" ry="7"/>
    <ellipse cx="420" cy="410" rx="5" ry="2"/>
  </g>
  <!-- Cart tracks in snow -->
  <path d="M230 800 Q300 600 420 400" fill="none" stroke="#cfdbe2" stroke-width="6" opacity="0.8"/>
  <path d="M290 800 Q340 620 455 400" fill="none" stroke="#cfdbe2" stroke-width="6" opacity="0.8"/>

  <!-- Low fog across the lane -->
  <rect x="0" y="400" width="800" height="70" fill="#f4f8fa" opacity="0.5"/>
  <rect x="0" y="470" width="800" height="40" fill="#f4f8fa" opacity="0.3"/>

  <!-- Cottage on the left -->
  <g stroke="#2b2622" stroke-width="3" stroke-linejoin="round">
    <polygon points="0,230 250,300 250,800 0,800" fill="#dcc7a6"/>
    <polygon points="0,230 250,300 262,284 0,200" fill="#7d6f66"/>
    <polygon points="0,200 262,284 262,296 0,214" fill="#5f5450"/>
  </g>
  <!-- Snow on roof -->
  <path d="M0 200 L262 284 L262 292 Q180 268 130 262 Q60 240 0 224 Z" fill="#ffffff" stroke="#2b2622" stroke-width="2"/>
  <!-- Window -->
  <g stroke="#2b2622" stroke-width="3">
    <rect x="40" y="380" width="72" height="92" fill="#ffd98a"/>
    <line x1="76" y1="380" x2="76" y2="472" stroke-width="2.5"/>
    <line x1="40" y1="426" x2="112" y2="426" stroke-width="2.5"/>
    <path d="M32 380 L120 380 L120 372 L32 372 Z" fill="#ffffff"/>
  </g>
  <!-- Door -->
  <g stroke="#2b2622" stroke-width="3">
    <rect x="150" y="500" width="80" height="220" fill="#5a3d2b"/>
    <circle cx="219" cy="610" r="4" fill="#e6c77a"/>
  </g>
  <path d="M142 500 L238 500 L238 494 L142 494 Z" fill="#ffffff" stroke="#2b2622" stroke-width="2"/>
  <!-- Doorstep -->
  <g stroke="#2b2622" stroke-width="3">
    <rect x="136" y="716" width="112" height="22" fill="#b9aa98"/>
  </g>
  <path d="M130 712 L254 712 L254 716 L130 716 Z" fill="#ffffff"/>
  <!-- Snow on doorstep -->
  <path d="M136 716 Q190 700 248 716 Z" fill="#ffffff" stroke="#2b2622" stroke-width="2"/>

  <!-- Foreground cobbles at the doorstep -->
  <g fill="none" stroke="#8fa0aa" stroke-width="2" opacity="0.8">
    <ellipse cx="90" cy="770" rx="28" ry="8"/>
    <ellipse cx="200" cy="775" rx="20" ry="6"/>
    <ellipse cx="320" cy="760" rx="24" ry="7"/>
    <ellipse cx="450" cy="785" rx="30" ry="8"/>
    <ellipse cx="640" cy="765" rx="32" ry="8"/>
  </g>

  <!-- Falling snow -->
  <g fill="#ffffff" stroke="#8fa0aa" stroke-width="1">
    <circle cx="350" cy="140" r="3"/>
    <circle cx="420" cy="200" r="2.5"/>
    <circle cx="300" cy="250" r="2"/>
    <circle cx="610" cy="150" r="3"/>
    <circle cx="700" cy="200" r="2.5"/>
    <circle cx="160" cy="130" r="2.5"/>
    <circle cx="250" cy="90" r="2"/>
    <circle cx="560" cy="90" r="2"/>
    <circle cx="740" cy="110" r="2.5"/>
    <circle cx="380" cy="320" r="2"/>
    <circle cx="660" cy="520" r="2.5"/>
    <circle cx="700" cy="620" r="2"/>
    <circle cx="390" cy="620" r="2"/>
  </g>

  <!-- Signature "P." in the bottom-right corner -->
  <g stroke="#2b2622" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M752 752 L752 780 M752 752 L764 752 Q772 752 772 760 Q772 768 764 768 L752 768"/>
  </g>
  <circle cx="780" cy="780" r="2.5" fill="#2b2622"/>
</svg>