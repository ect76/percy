<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and sky -->
  <rect x="0" y="0" width="800" height="800" fill="#e9e4d8"/>
  <rect x="0" y="0" width="800" height="330" fill="#cfd6d8"/>

  <!-- distant fog-hidden trees -->
  <g fill="#aeb9bb" stroke="#2b2118" stroke-width="2" opacity="0.8">
    <ellipse cx="90" cy="300" rx="40" ry="60"/>
    <ellipse cx="170" cy="290" rx="34" ry="52"/>
    <ellipse cx="660" cy="295" rx="38" ry="58"/>
    <ellipse cx="735" cy="310" rx="30" ry="46"/>
  </g>
  <rect x="0" y="300" width="800" height="60" fill="#e0e4e2" opacity="0.7"/>

  <!-- cottage shadow on lane -->
  <polygon points="200,600 600,600 620,640 180,640" fill="#8f9a98" opacity="0.5"/>

  <!-- cottage walls (cream plaster) -->
  <rect x="220" y="330" width="360" height="270" fill="#f4efe2" stroke="#2b2118" stroke-width="3"/>

  <!-- roof: thatch with ridge -->
  <polygon points="190,340 400,215 610,340" fill="#8a7a58" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="190,340 400,215 400,235 210,345" fill="#6f6044"/>
  <g stroke="#4e4330" stroke-width="2" fill="none">
    <path d="M230 330 Q300 300 370 290"/>
    <path d="M260 310 Q330 280 400 270"/>
    <path d="M430 270 Q500 280 570 330"/>
    <path d="M410 290 Q480 300 585 340"/>
  </g>
  <rect x="470" y="245" width="26" height="60" fill="#7a6a4c" stroke="#2b2118" stroke-width="2"/>

  <!-- timber frame -->
  <g stroke="#2b2118" stroke-width="8" fill="none" stroke-linecap="square">
    <line x1="220" y1="330" x2="580" y2="330"/>
    <line x1="220" y1="330" x2="220" y2="600"/>
    <line x1="580" y1="330" x2="580" y2="600"/>
    <line x1="220" y1="420" x2="580" y2="420"/>
    <line x1="300" y1="330" x2="300" y2="420"/>
    <line x1="500" y1="330" x2="500" y2="420"/>
    <line x1="220" y1="330" x2="300" y2="420"/>
    <line x1="580" y1="330" x2="500" y2="420"/>
    <line x1="220" y1="600" x2="300" y2="600"/>
    <line x1="500" y1="600" x2="580" y2="600"/>
  </g>
  <g stroke="#2b2118" stroke-width="3" fill="none">
    <line x1="260" y1="420" x2="260" y2="470"/>
    <line x1="420" y1="420" x2="420" y2="470"/>
    <line x1="260" y1="330" x2="260" y2="420" stroke-dasharray="0"/>
    <line x1="540" y1="330" x2="540" y2="420"/>
  </g>

  <!-- upper windows -->
  <rect x="330" y="350" width="60" height="44" fill="#3d4a4e" stroke="#2b2118" stroke-width="3"/>
  <line x1="360" y1="350" x2="360" y2="394" stroke="#2b2118" stroke-width="3"/>
  <line x1="330" y1="372" x2="390" y2="372" stroke="#2b2118" stroke-width="3"/>

  <!-- ground-floor windows, warm light -->
  <rect x="250" y="440" width="70" height="60" fill="#f2c96b" stroke="#2b2118" stroke-width="3"/>
  <line x1="285" y1="440" x2="285" y2="500" stroke="#2b2118" stroke-width="3"/>
  <line x1="250" y1="470" x2="320" y2="470" stroke="#2b2118" stroke-width="3"/>
  <rect x="480" y="440" width="70" height="60" fill="#f2c96b" stroke="#2b2118" stroke-width="3"/>
  <line x1="515" y1="440" x2="515" y2="500" stroke="#2b2118" stroke-width="3"/>
  <line x1="480" y1="470" x2="550" y2="470" stroke="#2b2118" stroke-width="3"/>

  <!-- door -->
  <rect x="368" y="480" width="64" height="120" fill="#6b4a2e" stroke="#2b2118" stroke-width="3"/>
  <rect x="376" y="490" width="48" height="50" fill="none" stroke="#2b2118" stroke-width="2"/>
  <circle cx="422" cy="552" r="4" fill="#d9b25f" stroke="#2b2118" stroke-width="1.5"/>
  <polygon points="350,480 450,480 462,462 338,462" fill="#7a6a4c" stroke="#2b2118" stroke-width="2"/>

  <!-- lane (wet cobbles) -->
  <polygon points="0,600 800,600 800,800 0,800" fill="#6e7a7a"/>
  <g fill="#8d9896" opacity="0.8">
    <ellipse cx="120" cy="650" rx="60" ry="8"/>
    <ellipse cx="600" cy="690" rx="90" ry="10"/>
    <ellipse cx="300" cy="740" rx="110" ry="12"/>
    <ellipse cx="700" cy="760" rx="70" ry="9"/>
  </g>
  <g stroke="#4a5555" stroke-width="2" fill="none">
    <ellipse cx="60" cy="620" rx="22" ry="8"/>
    <ellipse cx="150" cy="700" rx="26" ry="9"/>
    <ellipse cx="260" cy="650" rx="20" ry="7"/>
    <ellipse cx="470" cy="720" rx="28" ry="9"/>
    <ellipse cx="640" cy="640" rx="22" ry="7"/>
    <ellipse cx="520" cy="780" rx="30" ry="10"/>
    <ellipse cx="90" cy="770" rx="30" ry="10"/>
  </g>

  <!-- doorstep -->
  <polygon points="340,600 460,600 472,624 328,624" fill="#b9b2a2" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
  <line x1="340" y1="612" x2="460" y2="612" stroke="#2b2118" stroke-width="1.5"/>

  <!-- signpost and sign -->
  <g stroke="#2b2118" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="400" x2="160" y2="650"/>
    <line x1="160" y1="410" x2="230" y2="410"/>
  </g>
  <line x1="190" y1="410" x2="190" y2="430" stroke="#2b2118" stroke-width="2"/>
  <rect x="112" y="430" width="156" height="42" rx="3" fill="#8c5e36" stroke="#2b2118" stroke-width="3"/>
  <text x="190" y="457" text-anchor="middle" font-family="serif" font-size="17" fill="#f4efe2">Percy's cottage</text>

  <!-- fog layers in front -->
  <rect x="0" y="520" width="800" height="50" fill="#e9e4d8" opacity="0.35"/>
  <rect x="0" y="560" width="800" height="30" fill="#e9e4d8" opacity="0.4"/>
  <ellipse cx="400" cy="300" rx="420" ry="40" fill="#e9e4d8" opacity="0.45"/>
  <ellipse cx="100" cy="700" rx="200" ry="50" fill="#e9e4d8" opacity="0.3"/>

  <!-- signature -->
  <text x="752" y="780" text-anchor="end" font-family="serif" font-size="22" fill="#2b2118">P.</text>
</svg>