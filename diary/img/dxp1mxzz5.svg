<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe2"/>
  <rect x="24" y="24" width="752" height="752" fill="none" stroke="#2b2620" stroke-width="1.5" opacity="0.35"/>

  <!-- fog bands -->
  <ellipse cx="170" cy="250" rx="190" ry="40" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="640" cy="330" rx="200" ry="46" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="200" cy="600" rx="220" ry="34" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="620" cy="520" rx="180" ry="30" fill="#ffffff" opacity="0.4"/>

  <!-- cobbled ground -->
  <rect x="0" y="704" width="800" height="96" fill="#cfc5ae"/>
  <g fill="#e4dccb" stroke="#2b2620" stroke-width="1.2">
    <ellipse cx="90" cy="730" rx="36" ry="12"/>
    <ellipse cx="200" cy="752" rx="42" ry="13"/>
    <ellipse cx="320" cy="728" rx="34" ry="11"/>
    <ellipse cx="470" cy="760" rx="40" ry="12"/>
    <ellipse cx="600" cy="733" rx="36" ry="12"/>
    <ellipse cx="710" cy="762" rx="44" ry="13"/>
    <ellipse cx="150" cy="782" rx="34" ry="10"/>
    <ellipse cx="400" cy="788" rx="46" ry="10"/>
    <ellipse cx="560" cy="790" rx="36" ry="9"/>
  </g>
  <line x1="0" y1="704" x2="800" y2="704" stroke="#2b2620" stroke-width="1.5"/>

  <!-- wooden post and base -->
  <rect x="380" y="540" width="40" height="150" fill="#8a6642" stroke="#2b2620" stroke-width="2"/>
  <g stroke="#5a4128" stroke-width="1.2" fill="none">
    <line x1="390" y1="560" x2="390" y2="680"/>
    <line x1="402" y1="552" x2="402" y2="684"/>
    <line x1="412" y1="566" x2="412" y2="676"/>
  </g>
  <rect x="358" y="688" width="84" height="16" fill="#6b4c2e" stroke="#2b2620" stroke-width="2"/>

  <!-- clamp bracket around cylinder -->
  <rect x="346" y="522" width="108" height="16" fill="#5a4128" stroke="#2b2620" stroke-width="2"/>

  <!-- funnel -->
  <path d="M240,190 L560,190 Q560,262 432,290 L432,302 L368,302 L368,290 Q240,262 240,190 Z"
        fill="#fbfbf6" stroke="#2b2620" stroke-width="2.5"/>
  <ellipse cx="400" cy="190" rx="160" ry="24" fill="#fbfbf6" stroke="#2b2620" stroke-width="2.5"/>
  <ellipse cx="400" cy="192" rx="146" ry="17" fill="#d9d4c6" stroke="#2b2620" stroke-width="1.2"/>
  <!-- enamel chips -->
  <g fill="#c9c2b0">
    <circle cx="300" cy="222" r="3"/>
    <circle cx="492" cy="236" r="2.5"/>
    <circle cx="352" cy="262" r="2"/>
  </g>

  <!-- glass cylinder -->
  <path d="M368,302 L368,520 Q368,540 400,540 Q432,540 432,520 L432,302 Z"
        fill="#e2f0f2" stroke="#2b2620" stroke-width="2.5"/>
  <!-- water -->
  <path d="M369,508 L431,508 L431,520 Q431,539 400,539 Q369,539 369,520 Z" fill="#6fa8c8"/>
  <line x1="369" y1="508" x2="431" y2="508" stroke="#3d7ea3" stroke-width="1.5"/>
  <!-- glass highlight -->
  <line x1="378" y1="318" x2="378" y2="492" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- scale marks -->
  <g stroke="#2b2620" stroke-width="1.8">
    <line x1="432" y1="508" x2="444" y2="508"/>
    <line x1="432" y1="468" x2="440" y2="468"/>
    <line x1="432" y1="428" x2="444" y2="428"/>
    <line x1="432" y1="388" x2="440" y2="388"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#2b2620">
    <text x="450" y="513">0</text>
    <text x="450" y="473">10</text>
    <text x="450" y="433">20</text>
    <text x="450" y="393">30 mm</text>
  </g>

  <!-- ink shading on cylinder edge -->
  <g stroke="#2b2620" stroke-width="1" opacity="0.6">
    <line x1="422" y1="330" x2="422" y2="500"/>
    <line x1="426" y1="340" x2="426" y2="492"/>
  </g>

  <!-- signature -->
  <text x="752" y="782" font-family="sans-serif" font-size="18" fill="#2b2620" text-anchor="end">P.</text>
</svg>