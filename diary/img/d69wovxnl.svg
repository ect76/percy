<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecd8"/>

  <!-- back wall -->
  <rect x="0" y="0" width="800" height="545" fill="#e4d9bf"/>
  <!-- window with fog -->
  <rect x="560" y="80" width="170" height="210" fill="#c9d3d6" stroke="#2b2f33" stroke-width="6"/>
  <ellipse cx="620" cy="150" rx="90" ry="22" fill="#f3f6f6" opacity="0.8"/>
  <ellipse cx="650" cy="205" rx="110" ry="26" fill="#f3f6f6" opacity="0.7"/>
  <ellipse cx="610" cy="250" rx="80" ry="18" fill="#f3f6f6" opacity="0.6"/>
  <line x1="645" y1="80" x2="645" y2="290" stroke="#2b2f33" stroke-width="5"/>
  <line x1="560" y1="185" x2="730" y2="185" stroke="#2b2f33" stroke-width="5"/>

  <!-- floorboards -->
  <rect x="0" y="545" width="800" height="255" fill="#b58a5c"/>
  <g stroke="#7d5b3a" stroke-width="3" fill="none">
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="660" x2="800" y2="660"/>
    <line x1="0" y1="725" x2="800" y2="725"/>
    <line x1="120" y1="545" x2="120" y2="600"/>
    <line x1="420" y1="600" x2="420" y2="660"/>
    <line x1="260" y1="660" x2="260" y2="725"/>
    <line x1="610" y1="600" x2="610" y2="660"/>
    <line x1="500" y1="725" x2="500" y2="800"/>
  </g>
  <!-- baseboard -->
  <rect x="0" y="530" width="800" height="16" fill="#8c6a48" stroke="#2b2f33" stroke-width="3"/>

  <!-- shadow -->
  <ellipse cx="400" cy="575" rx="170" ry="18" fill="#4a3322" opacity="0.28"/>

  <!-- motion arcs -->
  <g fill="none" stroke="#2b2f33" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14">
    <path d="M250 340 Q230 400 262 460"/>
    <path d="M222 360 Q200 410 230 470"/>
  </g>

  <!-- mouse (mid-turn) -->
  <g transform="translate(400,440) rotate(-18)">
    <!-- tail -->
    <path d="M-100 10 Q-190 0 -200 -50 Q-210 -90 -240 -70" fill="none" stroke="#2b2f33" stroke-width="12" stroke-linecap="round"/>
    <path d="M-100 10 Q-190 0 -200 -50 Q-210 -90 -240 -70" fill="none" stroke="#c99a94" stroke-width="5" stroke-linecap="round"/>

    <!-- legs (ink outline then tin fill) -->
    <g stroke-linecap="round" fill="none">
      <path d="M60 40 L70 110 L95 118" stroke="#2b2f33" stroke-width="30"/>
      <path d="M60 40 L70 110 L95 118" stroke="#9aa3ab" stroke-width="20"/>
      <path d="M-50 45 L-70 115 L-100 112" stroke="#2b2f33" stroke-width="30"/>
      <path d="M-50 45 L-70 115 L-100 112" stroke="#9aa3ab" stroke-width="20"/>
      <path d="M30 50 L20 100 L-5 108" stroke="#2b2f33" stroke-width="28"/>
      <path d="M30 50 L20 100 L-5 108" stroke="#b1b9bf" stroke-width="18"/>
      <path d="M-20 50 L-30 90 L-55 92" stroke="#2b2f33" stroke-width="28"/>
      <path d="M-20 50 L-30 90 L-55 92" stroke="#b1b9bf" stroke-width="18"/>
    </g>

    <!-- ears -->
    <circle cx="95" cy="-50" r="28" fill="#b9c0c6" stroke="#2b2f33" stroke-width="5"/>
    <circle cx="95" cy="-50" r="14" fill="#e0a7a4"/>
    <circle cx="130" cy="-52" r="26" fill="#b9c0c6" stroke="#2b2f33" stroke-width="5"/>
    <circle cx="130" cy="-52" r="13" fill="#e0a7a4"/>

    <!-- body -->
    <ellipse cx="0" cy="0" rx="112" ry="62" fill="#9aa3ab" stroke="#2b2f33" stroke-width="6"/>
    <ellipse cx="-5" cy="16" rx="82" ry="34" fill="#c9d0d5"/>
    <!-- tin seams and rivets -->
    <path d="M-60 -40 Q-20 -58 30 -55" fill="none" stroke="#5d656c" stroke-width="3"/>
    <circle cx="-50" cy="-10" r="4" fill="#5d656c"/>
    <circle cx="-20" cy="-18" r="4" fill="#5d656c"/>
    <circle cx="10" cy="-12" r="4" fill="#5d656c"/>
    <!-- base plate line -->
    <path d="M-95 30 Q0 58 95 30" fill="none" stroke="#2b2f33" stroke-width="3"/>

    <!-- head -->
    <ellipse cx="112" cy="-8" rx="46" ry="40" fill="#9aa3ab" stroke="#2b2f33" stroke-width="6"/>
    <ellipse cx="150" cy="6" rx="24" ry="16" fill="#d9a3a0" stroke="#2b2f33" stroke-width="4"/>
    <circle cx="150" cy="4" r="5" fill="#2b2f33"/>
    <circle cx="124" cy="-18" r="7" fill="#2b2f33"/>
    <circle cx="126" cy="-20" r="2" fill="#f3ecd8"/>
    <line x1="168" y1="-6" x2="190" y2="-12" stroke="#2b2f33" stroke-width="3" stroke-linecap="round"/>
    <line x1="168" y1="4" x2="192" y2="4" stroke="#2b2f33" stroke-width="3" stroke-linecap="round"/>

    <!-- brass key on back -->
    <line x1="-4" y1="-58" x2="-4" y2="-112" stroke="#6b5222" stroke-width="10" stroke-linecap="round"/>
    <line x1="-4" y1="-58" x2="-4" y2="-112" stroke="#d9b45a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-4" cy="-126" r="15" fill="none" stroke="#6b5222" stroke-width="10"/>
    <circle cx="-4" cy="-126" r="15" fill="none" stroke="#e2c46e" stroke-width="5"/>
    <path d="M-4 -112 L14 -112 L14 -100 L8 -100 L8 -106 L-4 -106 Z" fill="#d9b45a" stroke="#6b5222" stroke-width="3"/>
  </g>

  <!-- fog drifts across foreground -->
  <g fill="#f3f6f6" opacity="0.55">
    <ellipse cx="120" cy="640" rx="260" ry="26"/>
    <ellipse cx="640" cy="700" rx="280" ry="30"/>
    <ellipse cx="400" cy="780" rx="320" ry="28"/>
  </g>

  <!-- signature -->
  <g fill="none" stroke="#2b2f33" stroke-width="4" stroke-linecap="round">
    <path d="M735 735 V775 M735 735 H750 Q766 735 766 748 Q766 761 750 761 H735"/>
  </g>
  <circle cx="778" cy="775" r="3.5" fill="#2b2f33"/>
</svg>