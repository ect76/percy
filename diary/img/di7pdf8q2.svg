<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e6dc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e9e6dc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe2"/>

  <!-- distant fog bank -->
  <rect x="0" y="180" width="800" height="200" fill="url(#fog)"/>
  <ellipse cx="150" cy="260" rx="170" ry="30" fill="#ddd9cc" opacity="0.7"/>
  <ellipse cx="640" cy="230" rx="200" ry="26" fill="#ddd9cc" opacity="0.7"/>

  <!-- cottage wall hint -->
  <rect x="0" y="300" width="800" height="90" fill="#d8cdb6" opacity="0.6"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1c1c1c" stroke-width="3"/>

  <!-- floor cobbles -->
  <g stroke="#1c1c1c" stroke-width="2.5" fill="#b7aea0">
    <ellipse cx="90" cy="650" rx="44" ry="18"/>
    <ellipse cx="190" cy="648" rx="46" ry="18"/>
    <ellipse cx="300" cy="652" rx="40" ry="17"/>
    <ellipse cx="520" cy="650" rx="44" ry="18"/>
    <ellipse cx="625" cy="646" rx="46" ry="18"/>
    <ellipse cx="720" cy="652" rx="44" ry="18"/>
    <ellipse cx="140" cy="712" rx="50" ry="20" fill="#a99f90"/>
    <ellipse cx="260" cy="716" rx="46" ry="19" fill="#a99f90"/>
    <ellipse cx="410" cy="714" rx="48" ry="19" fill="#a99f90"/>
    <ellipse cx="560" cy="718" rx="50" ry="20" fill="#a99f90"/>
    <ellipse cx="680" cy="712" rx="48" ry="19" fill="#a99f90"/>
    <ellipse cx="80" cy="770" rx="60" ry="22" fill="#9b9283"/>
    <ellipse cx="260" cy="772" rx="56" ry="22" fill="#9b9283"/>
    <ellipse cx="450" cy="772" rx="60" ry="22" fill="#9b9283"/>
    <ellipse cx="640" cy="770" rx="58" ry="22" fill="#9b9283"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="400" cy="598" rx="235" ry="24" fill="#1c1c1c" opacity="0.18"/>

  <!-- tail -->
  <path d="M255,400 C205,385 175,335 195,300" fill="none" stroke="#1c1c1c" stroke-width="12" stroke-linecap="round"/>
  <path d="M255,400 C205,385 175,335 195,300" fill="none" stroke="#e0a48e" stroke-width="5" stroke-linecap="round"/>

  <!-- back legs -->
  <path d="M300,470 L270,530 L255,560" fill="none" stroke="#1c1c1c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300,470 L270,530 L255,560" fill="none" stroke="#b5452f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M340,480 L345,540 L320,575" fill="none" stroke="#1c1c1c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M340,480 L345,540 L320,575" fill="none" stroke="#b5452f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="400" cy="400" rx="150" ry="88" fill="#c8553d" stroke="#1c1c1c" stroke-width="4"/>

  <!-- belly plate with cutaway window showing underside -->
  <path d="M275,430 Q400,500 525,430 L520,448 Q400,512 280,448 Z" fill="#b9b2a0" stroke="#1c1c1c" stroke-width="3"/>
  <ellipse cx="400" cy="464" rx="72" ry="18" fill="#2b2b2b" stroke="#1c1c1c" stroke-width="3"/>
  <circle cx="362" cy="464" r="15" fill="#d9b44a" stroke="#1c1c1c" stroke-width="2.5"/>
  <circle cx="362" cy="464" r="5" fill="#1c1c1c"/>
  <circle cx="404" cy="462" r="11" fill="#d9b44a" stroke="#1c1c1c" stroke-width="2.5"/>
  <circle cx="404" cy="462" r="3.5" fill="#1c1c1c"/>
  <path d="M424,462 q5,-7 10,0 t10,0 t10,0 t10,0" fill="none" stroke="#d9b44a" stroke-width="3"/>
  <path d="M430,455 q5,7 10,0 t10,0 t10,0" fill="none" stroke="#d9b44a" stroke-width="3" opacity="0.7"/>
  <rect x="330" y="447" width="140" height="0" fill="none"/>

  <!-- body rivets and seam -->
  <path d="M290,380 Q400,350 515,380" fill="none" stroke="#1c1c1c" stroke-width="2.5" opacity="0.6"/>
  <g fill="#f4efe2" stroke="#1c1c1c" stroke-width="1.5">
    <circle cx="300" cy="395" r="3.5"/>
    <circle cx="500" cy="395" r="3.5"/>
    <circle cx="330" cy="425" r="3.5"/>
    <circle cx="470" cy="425" r="3.5"/>
  </g>

  <!-- winding key on top of body -->
  <rect x="380" y="330" width="40" height="24" rx="4" fill="#d9b44a" stroke="#1c1c1c" stroke-width="3"/>
  <line x1="400" y1="330" x2="400" y2="290" stroke="#1c1c1c" stroke-width="6"/>
  <line x1="400" y1="290" x2="400" y2="290" stroke="#1c1c1c" stroke-width="6"/>
  <line x1="400" y1="292" x2="400" y2="280" stroke="#d9b44a" stroke-width="2"/>
  <circle cx="400" cy="270" r="20" fill="#d9b44a" stroke="#1c1c1c" stroke-width="3.5"/>
  <circle cx="400" cy="270" r="7" fill="#f4efe2" stroke="#1c1c1c" stroke-width="2"/>
  <line x1="380" y1="270" x2="420" y2="270" stroke="#1c1c1c" stroke-width="3"/>

  <!-- front legs (mid-stride) -->
  <path d="M440,480 L470,540 L500,570" fill="none" stroke="#1c1c1c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440,480 L470,540 L500,570" fill="none" stroke="#b5452f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M480,470 L520,520 L538,542" fill="none" stroke="#1c1c1c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M480,470 L520,520 L538,542" fill="none" stroke="#b5452f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- head -->
  <circle cx="545" cy="360" r="52" fill="#c8553d" stroke="#1c1c1c" stroke-width="4"/>
  <circle cx="525" cy="308" r="26" fill="#e8a58c" stroke="#1c1c1c" stroke-width="3.5"/>
  <circle cx="567" cy="305" r="22" fill="#e8a58c" stroke="#1c1c1c" stroke-width="3.5"/>
  <ellipse cx="598" cy="381" rx="30" ry="18" fill="#d9775f" stroke="#1c1c1c" stroke-width="3.5"/>
  <circle cx="625" cy="376" r="6" fill="#1c1c1c"/>
  <circle cx="560" cy="350" r="6" fill="#1c1c1c"/>
  <circle cx="562" cy="348" r="1.8" fill="#f4efe2"/>
  <path d="M580,392 q8,4 14,-2" fill="none" stroke="#1c1c1c" stroke-width="2"/>

  <!-- ground contact glints -->
  <ellipse cx="255" cy="566" rx="12" ry="5" fill="#1c1c1c" opacity="0.5"/>
  <ellipse cx="320" cy="580" rx="12" ry="5" fill="#1c1c1c" opacity="0.5"/>
  <ellipse cx="500" cy="576" rx="12" ry="5" fill="#1c1c1c" opacity="0.5"/>
  <ellipse cx="538" cy="548" rx="11" ry="5" fill="#1c1c1c" opacity="0.5"/>

  <!-- signature "P." -->
  <g fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round">
    <path d="M735,752 V728 H743 A7,7 0 0 1 743,742 H735"/>
  </g>
  <circle cx="752" cy="752" r="2.8" fill="#1c1c1c"/>
</svg>