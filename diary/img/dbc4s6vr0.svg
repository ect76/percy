<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a6b"/>
      <stop offset="1" stop-color="#8c7f8f"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde3" stop-opacity="0"/>
      <stop offset="1" stop-color="#d9dde3" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>

  <!-- wall -->
  <rect x="20" y="20" width="760" height="600" fill="#58607a" stroke="#1d1b1a" stroke-width="3"/>

  <!-- floor -->
  <path d="M20 620 H780 V780 H20 Z" fill="#6b4f3a" stroke="#1d1b1a" stroke-width="3"/>
  <path d="M20 660 H780 M20 700 H780 M20 740 H780" stroke="#4e3828" stroke-width="2" fill="none"/>

  <!-- window -->
  <rect x="470" y="110" width="260" height="290" fill="url(#dusk)" stroke="#1d1b1a" stroke-width="3"/>
  <!-- lane beyond -->
  <path d="M470 330 L560 290 L640 290 L730 330 L730 400 L470 400 Z" fill="#7d7a78"/>
  <path d="M500 350 h22 M540 362 h26 M600 345 h20 M655 368 h24 M520 382 h18 M690 380 h20" stroke="#5a5856" stroke-width="2" fill="none"/>
  <rect x="470" y="300" width="260" height="100" fill="url(#fog)"/>
  <!-- rain -->
  <g stroke="#cdd7e6" stroke-width="1.5" opacity="0.8">
    <line x1="490" y1="130" x2="478" y2="158"/>
    <line x1="530" y1="122" x2="518" y2="150"/>
    <line x1="575" y1="140" x2="563" y2="168"/>
    <line x1="612" y1="128" x2="600" y2="156"/>
    <line x1="655" y1="150" x2="643" y2="178"/>
    <line x1="700" y1="132" x2="688" y2="160"/>
    <line x1="500" y1="205" x2="488" y2="233"/>
    <line x1="548" y1="218" x2="536" y2="246"/>
    <line x1="598" y1="200" x2="586" y2="228"/>
    <line x1="640" y1="222" x2="628" y2="250"/>
    <line x1="692" y1="210" x2="680" y2="238"/>
    <line x1="520" y1="262" x2="508" y2="290"/>
    <line x1="622" y1="268" x2="610" y2="296"/>
    <line x1="672" y1="258" x2="660" y2="286"/>
  </g>
  <!-- window frame -->
  <rect x="470" y="110" width="260" height="290" fill="none" stroke="#1d1b1a" stroke-width="6"/>
  <line x1="600" y1="110" x2="600" y2="400" stroke="#1d1b1a" stroke-width="5"/>
  <line x1="470" y1="255" x2="730" y2="255" stroke="#1d1b1a" stroke-width="5"/>

  <!-- cupboard -->
  <rect x="470" y="440" width="260" height="180" fill="#8a5e3c" stroke="#1d1b1a" stroke-width="3"/>
  <line x1="600" y1="440" x2="600" y2="620" stroke="#1d1b1a" stroke-width="3"/>
  <line x1="470" y1="500" x2="730" y2="500" stroke="#1d1b1a" stroke-width="3"/>
  <line x1="470" y1="560" x2="730" y2="560" stroke="#1d1b1a" stroke-width="3"/>
  <circle cx="588" cy="470" r="4" fill="#1d1b1a"/>
  <circle cx="612" cy="470" r="4" fill="#1d1b1a"/>
  <!-- empty tins -->
  <g stroke="#1d1b1a" stroke-width="2.5" fill="#b8b2a6">
    <rect x="490" y="462" width="34" height="38"/>
    <rect x="532" y="468" width="30" height="32"/>
    <rect x="495" y="522" width="40" height="38"/>
    <rect x="545" y="526" width="34" height="34"/>
    <rect x="620" y="520" width="34" height="40"/>
    <rect x="490" y="585" width="40" height="35"/>
    <rect x="640" y="580" width="36" height="40"/>
  </g>
  <g stroke="#1d1b1a" stroke-width="2" fill="none">
    <line x1="490" y1="472" x2="524" y2="472"/>
    <line x1="495" y1="532" x2="535" y2="532"/>
    <line x1="620" y1="530" x2="654" y2="530"/>
    <line x1="490" y1="594" x2="530" y2="594"/>
  </g>

  <!-- old computer on desk -->
  <rect x="270" y="300" width="110" height="105" fill="#2e3036" stroke="#1d1b1a" stroke-width="3"/>
  <rect x="280" y="310" width="90" height="75" fill="#6e8a8a" stroke="#1d1b1a" stroke-width="2"/>
  <path d="M300 385 H350 L355 395 H295 Z" fill="#3a3d44" stroke="#1d1b1a" stroke-width="2"/>

  <!-- desk -->
  <rect x="110" y="430" width="330" height="26" fill="#8a5e3c" stroke="#1d1b1a" stroke-width="3"/>
  <rect x="120" y="456" width="16" height="164" fill="#6d4a2e" stroke="#1d1b1a" stroke-width="3"/>
  <rect x="414" y="456" width="16" height="164" fill="#6d4a2e" stroke="#1d1b1a" stroke-width="3"/>

  <!-- paper sheets -->
  <polygon points="130,438 240,436 246,428 136,430" fill="#f4efe2" stroke="#1d1b1a" stroke-width="2"/>
  <polygon points="160,436 250,434 262,424 170,426" fill="#fbf8f0" stroke="#1d1b1a" stroke-width="2"/>
  <polygon points="200,434 300,434 300,432 205,432" fill="#fbf8f0" stroke="#1d1b1a" stroke-width="2"/>
  <path d="M180 436 h60 M180 440 h40" stroke="#7a7a7a" stroke-width="1.5" fill="none"/>

  <!-- pencils -->
  <g stroke-width="5" stroke-linecap="butt">
    <line x1="300" y1="430" x2="380" y2="418" stroke="#d9a72f"/>
    <line x1="302" y1="436" x2="384" y2="426" stroke="#b5382e"/>
    <line x1="310" y1="442" x2="392" y2="432" stroke="#d9a72f"/>
  </g>
  <g stroke="#1d1b1a" stroke-width="1.5">
    <line x1="380" y1="418" x2="388" y2="417"/>
    <line x1="384" y1="426" x2="392" y2="425"/>
    <line x1="392" y1="432" x2="400" y2="431"/>
  </g>

  <!-- wind-up tin mouse -->
  <g stroke="#1d1b1a" stroke-width="2.5">
    <path d="M150 410 C120 400 118 380 132 376 C140 374 146 386 160 392" fill="none" stroke-width="4"/>
    <rect x="172" y="424" width="6" height="10" fill="#9aa3ad"/>
    <rect x="196" y="424" width="6" height="10" fill="#9aa3ad"/>
    <ellipse cx="190" cy="406" rx="42" ry="22" fill="#9aa3ad"/>
    <circle cx="230" cy="392" r="18" fill="#9aa3ad"/>
    <circle cx="224" cy="374" r="9" fill="#c4a6a0"/>
    <circle cx="242" cy="374" r="9" fill="#c4a6a0"/>
    <path d="M244 390 L256 395" stroke-width="3"/>
    <circle cx="239" cy="386" r="3" fill="#1d1b1a"/>
    <rect x="178" y="386" width="18" height="10" rx="2" fill="#6f7882"/>
    <circle cx="200" cy="391" r="4" fill="#6f7882"/>
    <line x1="182" y1="404" x2="214" y2="404" stroke-width="1.5"/>
    <line x1="180" y1="414" x2="206" y2="414" stroke-width="1.5"/>
  </g>

  <!-- bare-bones bed corner hint at left edge -->
  <rect x="20" y="520" width="60" height="100" fill="#6f5a6a" stroke="#1d1b1a" stroke-width="3"/>

  <!-- signature P. -->
  <g stroke="#1d1b1a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M736 790 V760 H748 a7 7 0 0 1 0 14 H736"/>
  </g>
  <circle cx="756" cy="790" r="2.5" fill="#1d1b1a"/>
</svg>