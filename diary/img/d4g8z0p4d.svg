<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Wall -->
  <rect x="0" y="0" width="800" height="490" fill="#d8cfbd"/>
  <g stroke="#b9ad98" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20 60 Q60 50 100 62"/>
    <path d="M420 110 Q470 100 520 118"/>
    <path d="M610 30 Q650 42 690 28"/>
    <path d="M140 210 Q190 200 240 214"/>
    <path d="M560 260 Q600 250 640 266"/>
    <path d="M30 380 Q80 372 120 386"/>
    <path d="M700 420 Q740 412 780 426"/>
  </g>

  <!-- Fog bands -->
  <rect x="0" y="90" width="800" height="90" fill="#f4f2ec" opacity="0.45"/>
  <rect x="0" y="200" width="800" height="110" fill="#f4f2ec" opacity="0.35"/>
  <rect x="0" y="360" width="800" height="60" fill="#f4f2ec" opacity="0.25"/>

  <!-- Shelf -->
  <rect x="30" y="490" width="740" height="8" fill="#4a3320" opacity="0.5"/>
  <rect x="30" y="468" width="740" height="22" fill="#7a5a3a" stroke="#3a2a1a" stroke-width="3"/>

  <!-- Cupboard -->
  <rect x="40" y="498" width="720" height="242" fill="#6b4a2e" stroke="#2e1f12" stroke-width="3"/>
  <rect x="70" y="524" width="300" height="200" fill="none" stroke="#4d3420" stroke-width="2"/>
  <rect x="430" y="524" width="300" height="200" fill="none" stroke="#4d3420" stroke-width="2"/>
  <circle cx="400" cy="620" r="5" fill="#c9a24a" stroke="#2e1f12" stroke-width="1.5"/>

  <!-- Vell's Seeds book -->
  <rect x="50" y="300" width="80" height="168" rx="2" fill="#24365c" stroke="#111" stroke-width="2"/>
  <rect x="50" y="300" width="6" height="6" fill="#9aa0a8"/>
  <rect x="124" y="300" width="6" height="6" fill="#9aa0a8"/>
  <rect x="50" y="462" width="6" height="6" fill="#9aa0a8"/>
  <rect x="124" y="462" width="6" height="6" fill="#9aa0a8"/>
  <text x="90" y="340" font-family="serif" font-size="11" fill="#e8e0c8" text-anchor="middle">VELL'S</text>
  <text x="90" y="354" font-family="serif" font-size="11" fill="#e8e0c8" text-anchor="middle">SEEDS</text>
  <path d="M92 468 L92 502 L98 498 L98 468 Z" fill="#b22a2a"/>

  <!-- Price slip tucked against book -->
  <rect x="118" y="330" width="84" height="104" fill="#f7f1df" stroke="#555" stroke-width="1.5"/>
  <g font-family="serif" font-size="7.5" fill="#2a2a2a">
    <text x="123" y="346">PRICES - SEASON 2</text>
    <text x="123" y="366">Carrot 1.20</text>
    <text x="123" y="382">Beans, runner 1.50</text>
    <text x="123" y="398">Onion sets 2.00</text>
    <text x="123" y="414">Marigold 0.90</text>
  </g>

  <!-- Seed tin -->
  <rect x="220" y="340" width="160" height="128" rx="6" fill="#7d8a7a" stroke="#2f3a2e" stroke-width="3"/>
  <rect x="214" y="330" width="172" height="16" rx="4" fill="#5f6b5d" stroke="#2f3a2e" stroke-width="3"/>
  <rect x="240" y="380" width="120" height="48" fill="#e8dfc6" stroke="#4a4a4a" stroke-width="1.5"/>
  <path d="M250 392 H350 M250 402 H340 M250 412 H346" stroke="#9a9078" stroke-width="2"/>

  <!-- Carrot packet, label facing viewer -->
  <g transform="rotate(-3 470 395)">
    <rect x="400" y="330" width="140" height="130" fill="#f5efdc" stroke="#4a4030" stroke-width="2"/>
    <path d="M400 330 L420 330 L400 350 Z" fill="#e2d6b8"/>
    <path d="M530 360 Q526 380 514 400 Q520 382 530 360 Z" fill="#e8772e" stroke="#7a3a10" stroke-width="1.5"/>
    <path d="M522 352 Q520 340 516 332 M524 352 Q528 342 534 336" stroke="#4f7a30" stroke-width="2" fill="none"/>
    <path d="M508 372 Q504 392 496 410 Q506 392 512 372 Z" fill="#e8772e" stroke="#7a3a10" stroke-width="1.5"/>
    <g font-family="serif" fill="#2a2016">
      <text x="410" y="352" font-size="10" font-weight="bold">VELL'S SEEDS</text>
      <text x="410" y="369" font-size="10">CARROT, CHANTENAY</text>
      <text x="410" y="386" font-size="10">Sow 1/2 inch deep,</text>
      <text x="410" y="401" font-size="10">2 inches apart</text>
      <text x="410" y="446" font-size="9">Approx. 500 seeds</text>
    </g>
  </g>

  <!-- Marigold packet -->
  <rect x="560" y="380" width="70" height="88" fill="#f0b43a" stroke="#7a5a10" stroke-width="2"/>
  <circle cx="595" cy="418" r="14" fill="#e8861e" stroke="#7a4a10" stroke-width="1.5"/>
  <circle cx="595" cy="418" r="4" fill="#f7d35a"/>
  <text x="595" y="450" font-family="serif" font-size="8" fill="#3a2a10" text-anchor="middle">MARIGOLD</text>

  <!-- Runner beans on shelf -->
  <g stroke="#2e3e1e" stroke-width="1.5">
    <ellipse cx="238" cy="460" rx="10" ry="6" fill="#5b7a3a"/>
    <ellipse cx="262" cy="463" rx="10" ry="6" fill="#4f6e33"/>
    <ellipse cx="286" cy="459" rx="10" ry="6" fill="#5b7a3a"/>
    <ellipse cx="310" cy="463" rx="10" ry="6" fill="#4f6e33"/>
    <ellipse cx="274" cy="452" rx="9" ry="5" fill="#63843f"/>
  </g>
  <g fill="#3a2a1a">
    <circle cx="235" cy="459" r="1.5"/><circle cx="244" cy="462" r="1.5"/>
    <circle cx="260" cy="461" r="1.5"/><circle cx="268" cy="465" r="1.5"/>
    <circle cx="284" cy="457" r="1.5"/><circle cx="306" cy="461" r="1.5"/>
  </g>

  <!-- Onion sets (bulbs) -->
  <g stroke="#5a3a1e" stroke-width="1.5">
    <path d="M664 444 Q670 428 676 444 Z" fill="#b98a4e"/>
    <ellipse cx="668" cy="458" rx="12" ry="9" fill="#c9995a"/>
    <ellipse cx="692" cy="462" rx="12" ry="9" fill="#b98a4e"/>
    <ellipse cx="716" cy="458" rx="12" ry="9" fill="#c9995a"/>
    <ellipse cx="700" cy="446" rx="10" ry="8" fill="#a87a42"/>
  </g>
  <path d="M664 450 Q668 440 672 450 M714 450 Q718 440 722 450" stroke="#8a6030" stroke-width="1" fill="none"/>

  <!-- Floor cobbles -->
  <rect x="0" y="740" width="800" height="60" fill="#8d8a80"/>
  <g fill="#a29e93" stroke="#5e5b53" stroke-width="1.5">
    <ellipse cx="30" cy="758" rx="26" ry="12"/>
    <ellipse cx="90" cy="752" rx="26" ry="12"/>
    <ellipse cx="150" cy="766" rx="26" ry="12"/>
    <ellipse cx="210" cy="756" rx="26" ry="12"/>
    <ellipse cx="270" cy="770" rx="26" ry="12"/>
    <ellipse cx="330" cy="754" rx="26" ry="12"/>
    <ellipse cx="390" cy="768" rx="26" ry="12"/>
    <ellipse cx="450" cy="756" rx="26" ry="12"/>
    <ellipse cx="510" cy="770" rx="26" ry="12"/>
    <ellipse cx="570" cy="754" rx="26" ry="12"/>
    <ellipse cx="630" cy="766" rx="26" ry="12"/>
    <ellipse cx="690" cy="756" rx="26" ry="12"/>
    <ellipse cx="750" cy="768" rx="26" ry="12"/>
  </g>

  <!-- Low fog over floor -->
  <rect x="0" y="720" width="800" height="40" fill="#f4f2ec" opacity="0.3"/>

  <!-- Signature -->
  <text x="772" y="786" font-family="serif" font-size="20" fill="#2e2418" text-anchor="end">P.</text>
</svg>