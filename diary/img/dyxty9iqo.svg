<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ec" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f6f3ec" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f6f3ec" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#ece5d4"/>

  <!-- distant village silhouettes in fog -->
  <g fill="#c9c2b0" opacity="0.6">
    <rect x="0" y="330" width="90" height="70"/>
    <polygon points="90,330 120,300 150,330"/>
    <rect x="620" y="300" width="110" height="60"/>
    <polygon points="650,300 675,270 700,300"/>
  </g>
  <rect x="0" y="280" width="800" height="150" fill="url(#fog)"/>

  <!-- shelves -->
  <g stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linejoin="round">
    <line x1="40" y1="170" x2="370" y2="170"/>
    <line x1="40" y1="270" x2="370" y2="270"/>
    <line x1="40" y1="170" x2="40" y2="270"/>
    <line x1="370" y1="170" x2="370" y2="270"/>
  </g>
  <g stroke="#2b2b2b" stroke-width="1.5">
    <rect x="60" y="120" width="18" height="50" fill="#6e4f3a"/>
    <rect x="80" y="126" width="14" height="44" fill="#8f8b7c"/>
    <rect x="96" y="112" width="22" height="58" fill="#3f5a4e"/>
    <rect x="120" y="130" width="16" height="40" fill="#a0573f"/>
    <rect x="138" y="118" width="20" height="52" fill="#c9b27a"/>
    <rect x="200" y="122" width="18" height="48" fill="#5c4a6b"/>
    <rect x="220" y="110" width="14" height="60" fill="#8f8b7c"/>
    <rect x="236" y="126" width="24" height="44" fill="#6e4f3a"/>
    <rect x="62" y="220" width="20" height="50" fill="#a0573f"/>
    <rect x="84" y="228" width="16" height="42" fill="#3f5a4e"/>
    <rect x="102" y="214" width="22" height="56" fill="#c9b27a"/>
    <rect x="200" y="222" width="18" height="48" fill="#8f8b7c"/>
    <rect x="220" y="214" width="16" height="56" fill="#5c4a6b"/>
    <rect x="240" y="230" width="20" height="40" fill="#6e4f3a"/>
  </g>

  <!-- desk corner -->
  <polygon points="360,500 800,500 800,540 360,540" fill="#8a6d52" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <rect x="360" y="540" width="440" height="260" fill="#6f553f" stroke="#2b2b2b" stroke-width="3"/>
  <line x1="360" y1="600" x2="800" y2="600" stroke="#2b2b2b" stroke-width="1.5" opacity="0.6"/>

  <!-- slip of paper with the question -->
  <g transform="rotate(-4 540 440)">
    <rect x="430" y="380" width="220" height="130" fill="#fbf8f0" stroke="#2b2b2b" stroke-width="2.5"/>
    <line x1="450" y1="410" x2="620" y2="410" stroke="#9a9384" stroke-width="2"/>
    <line x1="450" y1="428" x2="620" y2="428" stroke="#9a9384" stroke-width="2"/>
    <line x1="450" y1="446" x2="580" y2="446" stroke="#9a9384" stroke-width="2"/>
  </g>
  <circle cx="545" cy="450" r="46" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M528 430 Q528 404 546 404 Q566 404 566 424 Q566 438 548 446 Q542 449 542 460" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="542" cy="478" r="4" fill="#2b2b2b"/>

  <!-- ink pad, lid missing -->
  <rect x="60" y="680" width="160" height="62" rx="5" fill="#7a6248" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="72" y="690" width="136" height="40" rx="3" fill="#1d2a4a"/>
  <rect x="206" y="692" width="14" height="12" fill="#5a4632" stroke="#2b2b2b" stroke-width="2"/>
  <path d="M60 742 L220 742" stroke="#2b2b2b" stroke-width="2"/>

  <!-- date stamp, lying at an angle -->
  <g transform="rotate(-25 360 600)">
    <rect x="290" y="583" width="140" height="34" rx="12" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <rect x="425" y="578" width="18" height="44" fill="#333" stroke="#000" stroke-width="2"/>
    <rect x="443" y="572" width="62" height="56" rx="3" fill="#8b7f6c" stroke="#2b2b2b" stroke-width="2.5"/>
    <line x1="452" y1="584" x2="496" y2="584" stroke="#6b6152" stroke-width="2"/>
    <line x1="452" y1="600" x2="496" y2="600" stroke="#6b6152" stroke-width="2"/>
    <line x1="452" y1="616" x2="496" y2="616" stroke="#6b6152" stroke-width="2"/>
  </g>

  <!-- cobbles -->
  <g fill="#d6cdbb" stroke="#2b2b2b" stroke-width="1.5">
    <ellipse cx="90" cy="770" rx="34" ry="12"/>
    <ellipse cx="150" cy="775" rx="28" ry="10"/>
    <ellipse cx="220" cy="765" rx="36" ry="12"/>
    <ellipse cx="290" cy="780" rx="30" ry="11"/>
    <ellipse cx="40" cy="700" rx="22" ry="8"/>
  </g>

  <!-- tangle of little arrows -->
  <g fill="none" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)">
    <path d="M140 672 C160 640, 180 620, 280 600"/>
    <path d="M300 575 C250 520, 200 470, 140 440"/>
    <path d="M160 300 C200 340, 240 360, 300 420"/>
    <path d="M340 410 C380 430, 400 400, 430 430"/>
    <path d="M500 540 C520 520, 530 500, 530 500"/>
    <path d="M420 560 C440 520, 470 490, 500 470"/>
    <path d="M365 230 C420 260, 470 320, 510 390"/>
    <path d="M600 330 C640 360, 650 420, 610 445"/>
    <path d="M300 690 C340 650, 380 660, 420 610"/>
    <path d="M100 560 C90 500, 120 470, 150 470"/>
    <path d="M520 600 C560 580, 600 560, 640 620"/>
    <path d="M220 720 C260 740, 300 700, 340 730"/>
  </g>

  <!-- signature P. -->
  <g fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M722 30 V60 M722 30 H734 Q744 30 744 40 Q744 50 734 50 H722"/>
  </g>
  <circle cx="752" cy="60" r="2.5" fill="#2b2b2b"/>
</svg>