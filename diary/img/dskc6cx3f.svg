<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#f1e8d4"/>
  <!-- wall -->
  <rect x="0" y="0" width="800" height="560" fill="#e6d7b9"/>
  <!-- floor boards -->
  <rect x="0" y="560" width="800" height="240" fill="#a57c52"/>
  <g stroke="#6e4f30" stroke-width="2" fill="none">
    <line x1="0" y1="610" x2="800" y2="610"/>
    <line x1="0" y1="665" x2="800" y2="665"/>
    <line x1="0" y1="725" x2="800" y2="725"/>
    <line x1="0" y1="785" x2="800" y2="785"/>
  </g>

  <!-- window onto lane -->
  <rect x="80" y="90" width="220" height="210" fill="#d6e2e6" stroke="#222" stroke-width="4"/>
  <rect x="80" y="90" width="220" height="210" fill="#c9d8dd"/>
  <path d="M80 240 L300 220 L300 300 L80 300 Z" fill="#b8aa95" opacity="0.9"/>
  <path d="M120 300 L200 210 L260 214 L300 300 Z" fill="#8f877a"/>
  <rect x="150" y="190" width="40" height="30" fill="#9c8f7c"/>
  <rect x="210" y="180" width="50" height="40" fill="#a39482"/>
  <g stroke="#222" stroke-width="4">
    <line x1="190" y1="90" x2="190" y2="300"/>
    <line x1="80" y1="195" x2="300" y2="195"/>
  </g>
  <rect x="80" y="90" width="220" height="210" fill="none" stroke="#222" stroke-width="4"/>

  <!-- wall calendar on board -->
  <rect x="510" y="70" width="240" height="290" rx="4" fill="#b08b5c" stroke="#222" stroke-width="3"/>
  <rect x="528" y="86" width="204" height="90" fill="#9fb8c4" stroke="#222" stroke-width="2"/>
  <path d="M528 150 Q600 105 650 130 Q690 115 732 150 L732 176 L528 176 Z" fill="#6f8a5a"/>
  <rect x="528" y="190" width="204" height="150" fill="#fbf8ef" stroke="#222" stroke-width="2"/>
  <g stroke="#7d7566" stroke-width="1.5">
    <line x1="528" y1="208" x2="732" y2="208"/>
    <line x1="568" y1="190" x2="568" y2="340"/>
    <line x1="608" y1="190" x2="608" y2="340"/>
    <line x1="648" y1="190" x2="648" y2="340"/>
    <line x1="688" y1="190" x2="688" y2="340"/>
  </g>
  <g stroke="#3b3b3b" stroke-width="2" stroke-linecap="round">
    <line x1="538" y1="224" x2="552" y2="236"/>
    <line x1="578" y1="224" x2="592" y2="236"/>
    <line x1="578" y1="260" x2="592" y2="272"/>
    <line x1="618" y1="260" x2="632" y2="272"/>
    <line x1="658" y1="260" x2="672" y2="272"/>
    <line x1="698" y1="296" x2="712" y2="308"/>
    <line x1="618" y1="296" x2="632" y2="308"/>
    <line x1="538" y1="332" x2="552" y2="318"/>
  </g>
  <text x="630" y="352" text-anchor="middle" font-size="9" fill="#2b2b2b">Mossbrook Parish Notices — Market Day Thursdays</text>

  <!-- desk legs -->
  <rect x="140" y="400" width="18" height="170" fill="#6b4a2c" stroke="#222" stroke-width="3"/>
  <rect x="642" y="400" width="18" height="170" fill="#6b4a2c" stroke="#222" stroke-width="3"/>
  <!-- desk top -->
  <rect x="110" y="380" width="580" height="22" fill="#8a6440" stroke="#222" stroke-width="3"/>

  <!-- paper sheet with start-to-finish marks -->
  <rect x="110" y="322" width="140" height="58" fill="#fffdf6" stroke="#222" stroke-width="2"/>
  <g stroke="#3b3b3b" stroke-width="2" stroke-linecap="round">
    <line x1="122" y1="336" x2="122" y2="346"/>
    <line x1="134" y1="336" x2="134" y2="346"/>
    <line x1="146" y1="336" x2="146" y2="346"/>
    <line x1="158" y1="336" x2="158" y2="346"/>
    <line x1="170" y1="336" x2="170" y2="346"/>
    <line x1="182" y1="336" x2="182" y2="346"/>
    <line x1="194" y1="336" x2="194" y2="346"/>
    <line x1="206" y1="336" x2="206" y2="346"/>
    <line x1="218" y1="336" x2="218" y2="346"/>
    <line x1="230" y1="336" x2="230" y2="346"/>
    <line x1="122" y1="356" x2="122" y2="366"/>
    <line x1="134" y1="356" x2="134" y2="366"/>
    <line x1="146" y1="356" x2="146" y2="366"/>
    <line x1="158" y1="356" x2="158" y2="366"/>
    <line x1="170" y1="356" x2="170" y2="366"/>
  </g>
  <line x1="180" y1="356" x2="236" y2="368" stroke="#3b3b3b" stroke-width="2"/>
  <line x1="236" y1="356" x2="180" y2="368" stroke="#3b3b3b" stroke-width="2"/>

  <!-- laptop -->
  <rect x="300" y="226" width="200" height="142" rx="6" fill="#555" stroke="#222" stroke-width="3"/>
  <rect x="314" y="240" width="172" height="112" fill="#9fb9b0" stroke="#222" stroke-width="2"/>
  <g stroke="#e9efe9" stroke-width="4" stroke-linecap="round">
    <line x1="330" y1="262" x2="420" y2="262"/>
    <line x1="330" y1="282" x2="466" y2="282"/>
    <line x1="330" y1="302" x2="450" y2="302"/>
    <line x1="330" y1="322" x2="400" y2="322"/>
  </g>
  <path d="M276 368 L524 368 L536 384 L264 384 Z" fill="#9a9a94" stroke="#222" stroke-width="3"/>
  <rect x="380" y="368" width="40" height="5" fill="#777"/>

  <!-- coin lying beside the laptop -->
  <ellipse cx="588" cy="392" rx="22" ry="9" fill="#d9a92f" stroke="#222" stroke-width="3"/>
  <ellipse cx="588" cy="391" rx="14" ry="5" fill="none" stroke="#9c7419" stroke-width="2"/>

  <!-- pencil resting on desk -->
  <g transform="rotate(-4 300 402)">
    <polygon points="170,398 150,402 170,406" fill="#e9c9a0" stroke="#222" stroke-width="2"/>
    <polygon points="150,402 157,400 157,404" fill="#222"/>
    <rect x="170" y="396" width="200" height="12" fill="#e8c24a" stroke="#222" stroke-width="2"/>
    <rect x="370" y="396" width="20" height="12" fill="#c77b7b" stroke="#222" stroke-width="2"/>
  </g>

  <!-- sardine tins on floor beside desk -->
  <g stroke="#222" stroke-width="3">
    <rect x="652" y="500" width="50" height="22" rx="4" fill="#4f7fa0"/>
    <rect x="708" y="500" width="50" height="22" rx="4" fill="#4f7fa0"/>
    <rect x="680" y="478" width="50" height="22" rx="4" fill="#4f7fa0"/>
  </g>
  <g stroke="#e0e8ea" stroke-width="2">
    <line x1="658" y1="511" x2="696" y2="511"/>
    <line x1="714" y1="511" x2="752" y2="511"/>
    <line x1="686" y1="489" x2="724" y2="489"/>
  </g>

  <!-- signature corner -->
  <text x="772" y="784" text-anchor="end" font-size="18" fill="#2b2b2b">P.</text>
</svg>