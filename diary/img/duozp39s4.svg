<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#f1eee6"/>
  <rect x="40" y="40" width="720" height="720" fill="#ebe7dc" opacity="0.6"/>

  <!-- grey winter light from the window at left -->
  <rect x="60" y="90" width="90" height="620" fill="#d9dde0" opacity="0.5"/>
  <path d="M60,90 L150,90 L150,710 L60,710 Z" fill="none" stroke="#8d969c" stroke-width="1" opacity="0.4"/>

  <!-- cupboard back panel -->
  <rect x="150" y="120" width="500" height="560" fill="#cdc8bd"/>
  <!-- faint wall grain -->
  <path d="M170,150 V660 M240,150 V660 M320,150 V660 M410,150 V660 M500,150 V660 M590,150 V660" stroke="#b3ad a0" stroke-width="1" opacity="0.35"/>

  <!-- cupboard frame -->
  <rect x="140" y="110" width="20" height="580" fill="#8a7a66" stroke="#2a2622" stroke-width="3"/>
  <rect x="640" y="110" width="20" height="580" fill="#8a7a66" stroke="#2a2622" stroke-width="3"/>
  <rect x="140" y="104" width="520" height="16" fill="#8a7a66" stroke="#2a2622" stroke-width="3"/>

  <!-- shelves (bare) -->
  <rect x="150" y="290" width="500" height="14" fill="#a39479" stroke="#2a2622" stroke-width="3"/>
  <rect x="150" y="470" width="500" height="14" fill="#a39479" stroke="#2a2622" stroke-width="3"/>
  <rect x="150" y="646" width="500" height="16" fill="#a39479" stroke="#2a2622" stroke-width="3"/>

  <!-- dust marks on shelves -->
  <path d="M200,304 H260 M420,484 H470" stroke="#7d756a" stroke-width="2" opacity="0.5"/>

  <!-- shadow of fish on the bottom shelf -->
  <ellipse cx="410" cy="646" rx="92" ry="7" fill="#6d665c" opacity="0.35"/>

  <!-- fish -->
  <path d="M400,586 C410,566 426,568 434,586 Z" fill="#5d6c76" stroke="#2a2622" stroke-width="3" stroke-linejoin="round"/>
  <path d="M330,614 C360,584 420,580 455,606 C465,612 470,614 480,606 L490,590 L490,632 L480,622 C470,614 465,618 455,622 C420,646 360,644 330,614 Z" fill="#7f8e98" stroke="#2a2622" stroke-width="3" stroke-linejoin="round"/>
  <path d="M330,614 C360,600 420,598 455,612 C420,622 360,626 330,614 Z" fill="#a9b6bd"/>
  <path d="M388,598 C394,610 394,620 388,630" fill="none" stroke="#2a2622" stroke-width="2.5"/>
  <path d="M430,606 C436,614 436,620 430,626" fill="none" stroke="#2a2622" stroke-width="2"/>
  <circle cx="356" cy="610" r="4.5" fill="#2a2622"/>
  <circle cx="357.5" cy="608.5" r="1.3" fill="#f1eee6"/>
  <path d="M330,614 C360,584 420,580 455,606 C465,612 470,614 480,606" fill="none" stroke="#2a2622" stroke-width="0"/>

  <!-- fog wash over lower edge -->
  <rect x="40" y="680" width="720" height="80" fill="#e4e6e6" opacity="0.55"/>

  <!-- signature "P." in corner -->
  <path d="M728,738 V762 M728,738 H738 C746,738 746,750 738,750 H728" fill="none" stroke="#2a2622" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="750" cy="762" r="2" fill="#2a2622"/>
</svg>