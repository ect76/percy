<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe8d8"/>

  <!-- back wall -->
  <rect x="120" y="90" width="560" height="430" fill="#d9cdb4" stroke="#2b2620" stroke-width="3"/>

  <!-- floor -->
  <polygon points="120,520 680,520 760,700 40,700" fill="#b89a72" stroke="#2b2620" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#8a6d4b" stroke-width="2" fill="none">
    <line x1="200" y1="520" x2="130" y2="700"/>
    <line x1="320" y1="520" x2="290" y2="700"/>
    <line x1="480" y1="520" x2="500" y2="700"/>
    <line x1="600" y1="520" x2="650" y2="700"/>
    <line x1="60" y1="580" x2="740" y2="580"/>
    <line x1="50" y1="640" x2="750" y2="640"/>
  </g>

  <!-- light shafts from windows -->
  <polygon points="140,380 240,380 330,690 170,690" fill="#fff3c4" opacity="0.6"/>
  <polygon points="270,380 370,380 430,690 300,690" fill="#fff3c4" opacity="0.5"/>

  <!-- windows -->
  <rect x="140" y="130" width="100" height="250" fill="#f7f0d2" stroke="#2b2620" stroke-width="4"/>
  <line x1="190" y1="130" x2="190" y2="380" stroke="#2b2620" stroke-width="4"/>
  <line x1="140" y1="255" x2="240" y2="255" stroke="#2b2620" stroke-width="4"/>
  <rect x="270" y="130" width="100" height="250" fill="#f7f0d2" stroke="#2b2620" stroke-width="4"/>
  <line x1="320" y1="130" x2="320" y2="380" stroke="#2b2620" stroke-width="4"/>
  <line x1="270" y1="255" x2="370" y2="255" stroke="#2b2620" stroke-width="4"/>

  <!-- wall clock -->
  <circle cx="470" cy="220" r="66" fill="#6b4a2b" stroke="#2b2620" stroke-width="3"/>
  <circle cx="470" cy="220" r="56" fill="#f4ecd8" stroke="#2b2620" stroke-width="2"/>
  <g stroke="#2b2620" stroke-width="2">
    <line x1="470" y1="170" x2="470" y2="176"/>
    <line x1="520" y1="220" x2="514" y2="220"/>
    <line x1="470" y1="270" x2="470" y2="264"/>
    <line x1="420" y1="220" x2="426" y2="220"/>
  </g>
  <line x1="470" y1="220" x2="470" y2="184" stroke="#2b2620" stroke-width="4" stroke-linecap="round"/>
  <line x1="470" y1="220" x2="498" y2="232" stroke="#2b2620" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="220" r="4" fill="#2b2620"/>
  <!-- pendulum case -->
  <rect x="445" y="286" width="50" height="90" fill="#6b4a2b" stroke="#2b2620" stroke-width="3"/>
  <line x1="470" y1="286" x2="470" y2="340" stroke="#2b2620" stroke-width="2"/>
  <circle cx="470" cy="352" r="12" fill="#b8862e" stroke="#2b2620" stroke-width="2"/>

  <!-- attendance card on blackboard -->
  <rect x="560" y="150" width="150" height="110" fill="#3d4a3a" stroke="#2b2620" stroke-width="4"/>
  <g fill="#eee8d6" font-size="11">
    <text x="574" y="180">Attendance.</text>
    <text x="574" y="203">Mossbrook School</text>
    <text x="574" y="226">Please sign on arrival.</text>
  </g>

  <!-- table -->
  <rect x="400" y="430" width="340" height="18" fill="#7a5a3a" stroke="#2b2620" stroke-width="3"/>
  <rect x="420" y="448" width="14" height="130" fill="#6a4c30" stroke="#2b2620" stroke-width="2"/>
  <rect x="706" y="448" width="14" height="130" fill="#6a4c30" stroke="#2b2620" stroke-width="2"/>

  <!-- dented kettle -->
  <rect x="470" y="426" width="60" height="6" fill="#5e666e" stroke="#2b2620" stroke-width="2"/>
  <path d="M452 395 L420 368 L430 358 L462 384 Z" fill="#8c949c" stroke="#2b2620" stroke-width="3" stroke-linejoin="round"/>
  <path d="M470 370 Q500 326 530 370" fill="none" stroke="#2b2620" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="500" cy="396" rx="45" ry="34" fill="#8c949c" stroke="#2b2620" stroke-width="3"/>
  <path d="M530 380 Q540 396 528 414 Q520 400 530 380 Z" fill="#5e666e"/>
  <path d="M478 372 L522 372 L520 366 L480 366 Z" fill="#5e666e" stroke="#2b2620" stroke-width="2"/>

  <!-- red tin -->
  <rect x="600" y="340" width="80" height="90" fill="#b5462f" stroke="#2b2620" stroke-width="3"/>
  <path d="M652 362 Q666 380 656 402 Q644 390 652 362 Z" fill="#8f3322"/>
  <ellipse cx="640" cy="340" rx="40" ry="10" fill="#7e2a1c" stroke="#2b2620" stroke-width="3"/>
  <rect x="610" y="368" width="60" height="30" fill="#f0e0b0" stroke="#2b2620" stroke-width="1.5"/>
  <text x="614" y="387" font-size="7" fill="#2b2620">CLOCK OIL</text>

  <!-- small corner signature -->
  <text x="768" y="784" font-size="16" text-anchor="end" fill="#2b2620">P.</text>
</svg>