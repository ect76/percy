<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>
  <!-- floor wash -->
  <rect x="0" y="680" width="800" height="120" fill="#e4d9c0"/>
  <line x1="0" y1="680" x2="800" y2="680" stroke="#2a1d14" stroke-width="3"/>
  <!-- cupboard frame -->
  <rect x="200" y="110" width="400" height="580" fill="#8a5a3b" stroke="#2a1d14" stroke-width="6"/>
  <!-- inner recess -->
  <rect x="240" y="150" width="320" height="520" fill="#5a3a28" stroke="#2a1d14" stroke-width="4"/>
  <!-- door panel lines -->
  <rect x="222" y="132" width="356" height="536" fill="none" stroke="#2a1d14" stroke-width="3"/>
  <!-- shelves -->
  <rect x="240" y="290" width="320" height="14" fill="#b98a5e" stroke="#2a1d14" stroke-width="4"/>
  <rect x="240" y="430" width="320" height="14" fill="#b98a5e" stroke="#2a1d14" stroke-width="4"/>
  <rect x="240" y="570" width="320" height="14" fill="#b98a5e" stroke="#2a1d14" stroke-width="4"/>
  <!-- dust specks on empty shelves -->
  <circle cx="290" cy="286" r="2" fill="#2a1d14"/>
  <circle cx="420" cy="284" r="2" fill="#2a1d14"/>
  <circle cx="510" cy="287" r="2" fill="#2a1d14"/>
  <circle cx="300" cy="426" r="2" fill="#2a1d14"/>
  <circle cx="500" cy="424" r="2" fill="#2a1d14"/>
  <!-- seed tin standing alone -->
  <ellipse cx="400" cy="584" rx="48" ry="8" fill="#3b2619" opacity="0.5"/>
  <rect x="362" y="492" width="76" height="92" fill="#c9b27a" stroke="#2a1d14" stroke-width="4"/>
  <rect x="362" y="492" width="76" height="16" fill="#9c8650" stroke="#2a1d14" stroke-width="4"/>
  <ellipse cx="400" cy="492" rx="38" ry="8" fill="#e2d4a6" stroke="#2a1d14" stroke-width="4"/>
  <rect x="374" y="528" width="52" height="34" fill="#f3ecdc" stroke="#2a1d14" stroke-width="3"/>
  <line x1="380" y1="538" x2="420" y2="538" stroke="#2a1d14" stroke-width="2"/>
  <line x1="380" y1="548" x2="410" y2="548" stroke="#2a1d14" stroke-width="2"/>
  <!-- hanging hook -->
  <path d="M400 124 Q400 116 408 116" fill="none" stroke="#2a1d14" stroke-width="4"/>
  <!-- signature P. -->
  <path d="M735 770 V738 H752 A11 11 0 0 1 752 760 H735" fill="none" stroke="#2a1d14" stroke-width="3"/>
  <circle cx="762" cy="770" r="2.5" fill="#2a1d14"/>
</svg>