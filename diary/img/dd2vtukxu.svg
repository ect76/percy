<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3b4c"/>
      <stop offset="0.6" stop-color="#6e6a72"/>
      <stop offset="1" stop-color="#c79a6a"/>
    </linearGradient>
    <linearGradient id="fogband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d4cc" stop-opacity="0"/>
      <stop offset="1" stop-color="#d9d4cc" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#f3ecdd"/>

  <!-- dusk sky -->
  <rect x="0" y="0" width="800" height="470" fill="url(#sky)"/>

  <!-- distant cottages -->
  <g fill="#3a3640" stroke="#1d1a22" stroke-width="2">
    <path d="M60 470 V412 L92 384 L124 412 V470 Z"/>
    <path d="M130 470 V426 L160 402 L190 426 V470 Z"/>
    <path d="M620 470 V404 L656 372 L692 404 V470 Z"/>
    <path d="M700 470 V430 L728 408 L756 430 V470 Z"/>
    <path d="M520 470 V436 L548 414 L576 436 V470 Z"/>
  </g>
  <g fill="#e8b96a">
    <rect x="80" y="424" width="10" height="10"/>
    <rect x="636" y="410" width="10" height="10"/>
    <rect x="540" y="442" width="8" height="8"/>
  </g>

  <!-- fog bands -->
  <rect x="0" y="380" width="800" height="90" fill="url(#fogband)"/>
  <rect x="0" y="440" width="800" height="70" fill="#e4dfd6" opacity="0.45"/>

  <!-- green -->
  <path d="M0 470 Q400 452 800 470 V800 H0 Z" fill="#5f7b4b" stroke="#2d3b26" stroke-width="3"/>
  <path d="M0 540 Q400 520 800 540" fill="none" stroke="#4a6239" stroke-width="2"/>

  <!-- cobbled path -->
  <path d="M0 720 Q200 690 330 640 L370 650 Q240 710 60 800 H0 Z" fill="#8c8578" stroke="#2d2a25" stroke-width="2"/>
  <g fill="#a69f90" stroke="#2d2a25" stroke-width="1.5">
    <ellipse cx="40" cy="760" rx="14" ry="7"/>
    <ellipse cx="90" cy="740" rx="12" ry="6"/>
    <ellipse cx="140" cy="720" rx="12" ry="6"/>
    <ellipse cx="200" cy="700" rx="11" ry="5"/>
    <ellipse cx="260" cy="680" rx="11" ry="5"/>
    <ellipse cx="60" cy="790" rx="16" ry="8"/>
    <ellipse cx="170" cy="772" rx="14" ry="7"/>
  </g>

  <!-- pond -->
  <ellipse cx="470" cy="610" rx="230" ry="82" fill="#22313c" stroke="#0f161c" stroke-width="4"/>
  <ellipse cx="470" cy="610" rx="200" ry="66" fill="#2d4250" opacity="0.6"/>
  <g fill="none" stroke="#8fa6b0" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M380 606 Q392 600 404 606"/>
    <path d="M520 628 Q534 622 548 628"/>
    <path d="M430 644 Q440 640 450 644"/>
    <path d="M560 596 Q570 592 580 596"/>
  </g>
  <!-- reflection of dusk glow -->
  <path d="M460 560 L470 600 L480 560" fill="#d9a064" opacity="0.35"/>

  <!-- reeds -->
  <g stroke="#2a3a22" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M250 630 Q248 590 256 556"/>
    <path d="M262 634 Q266 600 258 570"/>
    <path d="M660 600 Q664 566 656 538"/>
    <path d="M672 606 Q668 580 676 552"/>
    <path d="M690 620 Q694 596 688 572"/>
  </g>
  <g fill="#3d5230" stroke="#2a3a22" stroke-width="1.5">
    <ellipse cx="256" cy="552" rx="4" ry="9"/>
    <ellipse cx="258" cy="566" rx="4" ry="9"/>
    <ellipse cx="656" cy="534" rx="4" ry="9"/>
    <ellipse cx="676" cy="548" rx="4" ry="9"/>
    <ellipse cx="688" cy="568" rx="4" ry="9"/>
  </g>

  <!-- welcome sign -->
  <rect x="181" y="330" width="18" height="320" fill="#5a4030" stroke="#25190f" stroke-width="3"/>
  <!-- roof-like cap -->
  <path d="M96 318 L190 262 L284 318 Z" fill="#3e3a36" stroke="#1b1916" stroke-width="3" stroke-linejoin="round"/>
  <!-- cream board with green rim -->
  <rect x="100" y="314" width="180" height="104" rx="16" fill="#4f6b3c" stroke="#1f2c18" stroke-width="3"/>
  <rect x="112" y="326" width="156" height="80" rx="10" fill="#efe6cc" stroke="#1f2c18" stroke-width="2"/>
  <text x="190" y="372" text-anchor="middle" font-family="serif" font-size="20" fill="#222019">Welcome to</text>
  <text x="190" y="396" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#222019">Mossbrook</text>
  <!-- moss tufts at post base -->
  <g fill="#4e7a3a" stroke="#1f3016" stroke-width="1.5">
    <path d="M166 650 Q170 634 176 646 Q180 630 186 646 Q192 636 196 652 Z"/>
    <path d="M196 652 Q202 640 208 652 Q214 644 218 654 Z"/>
    <path d="M152 654 Q158 642 164 654 Z"/>
  </g>

  <!-- lamp glow on the far bank -->
  <circle cx="600" cy="520" r="40" fill="#f2c27a" opacity="0.18"/>
  <circle cx="600" cy="520" r="6" fill="#f6d28c" stroke="#3a2a18" stroke-width="1.5"/>
  <path d="M600 526 V546" stroke="#2a2118" stroke-width="3"/>

  <!-- foreground fog wisps -->
  <g fill="#f3ecdd" opacity="0.35">
    <ellipse cx="400" cy="700" rx="380" ry="26"/>
    <ellipse cx="120" cy="560" rx="160" ry="14"/>
  </g>

  <!-- signature -->
  <text x="752" y="776" text-anchor="end" font-family="serif" font-size="24" fill="#222019">P.</text>
</svg>