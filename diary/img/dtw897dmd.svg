<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3eee2"/>

  <!-- back wall -->
  <rect x="20" y="20" width="760" height="540" fill="#e6d9bf" stroke="#2a2320" stroke-width="2.5"/>

  <!-- window, fog outside -->
  <rect x="540" y="70" width="200" height="260" fill="#d9dee0" stroke="#2a2320" stroke-width="2.5"/>
  <path d="M540 150 Q620 130 740 160 L740 200 Q650 185 540 210 Z" fill="#eef1f1" stroke="#2a2320" stroke-width="1.5"/>
  <path d="M540 260 Q630 240 740 270 L740 300 Q640 285 540 305 Z" fill="#eef1f1" stroke="#2a2320" stroke-width="1.5"/>
  <line x1="640" y1="70" x2="640" y2="330" stroke="#2a2320" stroke-width="2.5"/>
  <line x1="540" y1="200" x2="740" y2="200" stroke="#2a2320" stroke-width="2.5"/>

  <!-- late light through window -->
  <polygon points="540,330 740,330 820,560 470,560" fill="#f6c76b" opacity="0.35"/>

  <!-- chalkboard: pine frame -->
  <rect x="60" y="120" width="220" height="310" fill="#d9b77e" stroke="#2a2320" stroke-width="2.5"/>
  <rect x="74" y="134" width="192" height="282" fill="#262626" stroke="#2a2320" stroke-width="1.5"/>
  <!-- smudges where cloth wiped -->
  <ellipse cx="88" cy="150" rx="16" ry="9" fill="#555" opacity="0.45"/>
  <ellipse cx="250" cy="398" rx="18" ry="10" fill="#555" opacity="0.45"/>
  <ellipse cx="256" cy="160" rx="10" ry="14" fill="#555" opacity="0.35"/>
  <!-- chalk writing -->
  <g fill="#f5f5f0" font-size="13">
    <text x="84" y="172" font-weight="bold">THE LANTERN CAFÉ — MOSSBROOK</text>
    <text x="84" y="212">Flat White 2.80</text>
    <text x="84" y="242">Espresso 2.20</text>
    <text x="84" y="272">Apple &amp; Cinnamon Cake 3.50</text>
    <text x="84" y="302">Toast &amp; Butter 1.90</text>
    <text x="84" y="352" font-style="italic">Today: Leek Soup</text>
  </g>
  <line x1="84" y1="182" x2="256" y2="182" stroke="#f5f5f0" stroke-width="1" opacity="0.7"/>

  <!-- crooked clock on nail above counter -->
  <line x1="330" y1="150" x2="330" y2="166" stroke="#2a2320" stroke-width="2"/>
  <circle cx="330" cy="168" r="3" fill="#2a2320"/>
  <g transform="rotate(-8 330 230)">
    <circle cx="330" cy="230" r="62" fill="#8a5a33" stroke="#2a2320" stroke-width="2.5"/>
    <circle cx="330" cy="230" r="46" fill="#ffffff" stroke="#2a2320" stroke-width="2"/>
    <line x1="330" y1="230" x2="330" y2="200" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="330" y1="230" x2="354" y2="236" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="330" cy="230" r="3" fill="#111"/>
  </g>

  <!-- counter -->
  <rect x="120" y="430" width="400" height="22" fill="#9c6e42" stroke="#2a2320" stroke-width="2.5"/>
  <rect x="120" y="452" width="400" height="108" fill="#7a5230" stroke="#2a2320" stroke-width="2.5"/>
  <line x1="180" y1="452" x2="180" y2="560" stroke="#2a2320" stroke-width="1.5"/>
  <line x1="260" y1="452" x2="260" y2="560" stroke="#2a2320" stroke-width="1.5"/>
  <line x1="340" y1="452" x2="340" y2="560" stroke="#2a2320" stroke-width="1.5"/>
  <line x1="420" y1="452" x2="420" y2="560" stroke="#2a2320" stroke-width="1.5"/>
  <line x1="500" y1="452" x2="500" y2="560" stroke="#2a2320" stroke-width="1.5"/>

  <!-- cream-glazed sugar bowl -->
  <path d="M384 392 Q384 428 420 428 Q456 428 456 392 Z" fill="#f4ead3" stroke="#2a2320" stroke-width="2.5"/>
  <ellipse cx="420" cy="392" rx="36" ry="12" fill="#f4ead3" stroke="#2a2320" stroke-width="2.5"/>
  <ellipse cx="420" cy="393" rx="29" ry="7" fill="#7a4a22"/>
  <path d="M448 384 L453 390 L447 392" fill="none" stroke="#2a2320" stroke-width="1.2"/>
  <path d="M396 404 Q420 412 444 404" fill="none" stroke="#c9b58f" stroke-width="1.5"/>

  <!-- floor -->
  <rect x="20" y="560" width="760" height="220" fill="#c9b396" stroke="#2a2320" stroke-width="2.5"/>
  <g fill="none" stroke="#2a2320" stroke-width="1.2" opacity="0.6">
    <path d="M40 600 Q70 592 100 602 Q120 614 100 630 Q70 636 44 626 Z"/>
    <path d="M300 590 Q330 582 362 592 Q378 604 360 616 Q330 622 304 612 Z"/>
    <path d="M120 700 Q150 692 182 702 Q198 714 180 726 Q150 732 124 722 Z"/>
    <path d="M430 730 Q460 722 492 732 Q508 744 490 756 Q460 762 434 752 Z"/>
    <path d="M660 640 Q690 632 720 642 Q736 654 718 666 Q690 672 664 662 Z"/>
  </g>

  <!-- empty table, left foreground -->
  <g stroke="#2a2320" stroke-width="2.5">
    <rect x="216" y="652" width="6" height="90" fill="#6e4b2b"/>
    <path d="M190 742 L250 742" fill="none"/>
    <ellipse cx="220" cy="640" rx="90" ry="28" fill="#a57a4c"/>
  </g>

  <!-- empty table, right, with empty chair -->
  <g stroke="#2a2320" stroke-width="2.5">
    <rect x="586" y="622" width="6" height="90" fill="#6e4b2b"/>
    <path d="M560 712 L620 712" fill="none"/>
    <ellipse cx="590" cy="610" rx="70" ry="22" fill="#a57a4c"/>
  </g>
  <!-- empty chair behind right table -->
  <g stroke="#2a2320" stroke-width="2.5" fill="#b08858">
    <rect x="680" y="540" width="60" height="10" />
    <rect x="684" y="550" width="5" height="60"/>
    <rect x="729" y="550" width="5" height="60"/>
    <rect x="684" y="500" width="5" height="50"/>
    <rect x="729" y="500" width="5" height="50"/>
    <rect x="684" y="500" width="50" height="8"/>
  </g>

  <!-- fog band at floor edge -->
  <rect x="20" y="740" width="760" height="40" fill="#f3eee2" opacity="0.55"/>

  <!-- signature -->
  <text x="758" y="780" font-size="18" fill="#2a2320" text-anchor="end">P.</text>
</svg>