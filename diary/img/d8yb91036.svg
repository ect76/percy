<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and fog -->
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>
  <rect x="0" y="90" width="800" height="60" fill="#dcd8cd" opacity="0.6"/>
  <rect x="0" y="640" width="800" height="50" fill="#dcd8cd" opacity="0.5"/>
  <rect x="0" y="720" width="800" height="80" fill="#d3cfc3" opacity="0.5"/>

  <!-- barometer case -->
  <rect x="130" y="130" width="340" height="340" rx="30" fill="#4a2f1d" stroke="#2b2118" stroke-width="3"/>
  <rect x="150" y="150" width="300" height="300" rx="20" fill="#5e3e27" stroke="#2b2118" stroke-width="2"/>
  <circle cx="300" cy="300" r="140" fill="#f7f3e8" stroke="#2b2118" stroke-width="3"/>
  <!-- glass sheen -->
  <path d="M200 215 A130 130 0 0 1 280 170" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.8"/>

  <!-- scale -->
  <path d="M191.7 362.5 A125 125 0 1 1 408.3 362.5" fill="none" stroke="#2b2118" stroke-width="2"/>
  <g stroke="#2b2118" stroke-width="2">
    <line x1="191.7" y1="362.5" x2="200" y2="357"/>
    <line x1="300" y1="175" x2="300" y2="188"/>
    <line x1="408.3" y1="362.5" x2="400" y2="357"/>
    <line x1="232" y1="268" x2="242" y2="276"/>
    <line x1="368" y1="268" x2="358" y2="276"/>
  </g>

  <!-- scale words -->
  <g font-family="sans-serif" font-size="14" fill="#2b2118" text-anchor="middle">
    <text x="196" y="346" text-anchor="end">STORMY</text>
    <text x="222" y="236">RAIN</text>
    <text x="300" y="196">CHANGE</text>
    <text x="378" y="236">FAIR</text>
    <text x="404" y="346" text-anchor="start">VERY DRY</text>
  </g>

  <!-- brass needle (points just past middle) -->
  <line x1="300" y1="300" x2="339" y2="192" stroke="#b08a3e" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="300" x2="339" y2="192" stroke="#2b2118" stroke-width="1"/>
  <circle cx="300" cy="300" r="9" fill="#b08a3e" stroke="#2b2118" stroke-width="2"/>

  <!-- rain gauge: post -->
  <rect x="589" y="445" width="22" height="245" fill="#6b4a2e" stroke="#2b2118" stroke-width="3"/>
  <rect x="558" y="688" width="84" height="14" fill="#4a2f1d" stroke="#2b2118" stroke-width="3"/>

  <!-- rain gauge: cylinder -->
  <rect x="582" y="280" width="36" height="150" fill="#e8f2f4" stroke="#2b2118" stroke-width="3"/>
  <rect x="592" y="248" width="16" height="32" fill="#e8f2f4" stroke="#2b2118" stroke-width="3"/>
  <rect x="583" y="385" width="34" height="45" fill="#9fc7d6" opacity="0.8"/>
  <g stroke="#2b2118" stroke-width="1.5">
    <line x1="618" y1="415" x2="628" y2="415"/>
    <line x1="618" y1="385" x2="626" y2="385"/>
    <line x1="618" y1="355" x2="628" y2="355"/>
    <line x1="618" y1="325" x2="626" y2="325"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#2b2118">
    <text x="632" y="419">0</text>
    <text x="632" y="389">10</text>
    <text x="632" y="359">20</text>
    <text x="632" y="329">30 mm</text>
  </g>

  <!-- white enamel funnel -->
  <path d="M533 395 L667 395 L627 446 L573 446 Z" fill="#fbfbf7" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="600" cy="395" rx="67" ry="6" fill="#fbfbf7" stroke="#2b2118" stroke-width="2"/>

  <!-- folded cream sheet -->
  <path d="M120 560 L420 540 L470 640 L150 690 Z" fill="#f6eed8" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
  <path d="M420 540 L500 600 L470 640 Z" fill="#ebe2c6" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
  <path d="M150 690 L470 640" fill="none" stroke="#2b2118" stroke-width="1.5" opacity="0.5"/>

  <!-- signature -->
  <text x="772" y="782" font-family="serif" font-size="20" fill="#2b2118" text-anchor="end">P.</text>
</svg>