<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and fog -->
  <rect width="800" height="800" fill="#e9ecef"/>
  <rect y="0" width="800" height="300" fill="#dfe4e8"/>
  <!-- distant fogged cottages -->
  <g fill="#c5ccd3" stroke="#8d969f" stroke-width="1.5">
    <path d="M40 330 L90 290 L140 330 L140 400 L40 400 Z"/>
    <path d="M650 300 L710 250 L770 300 L770 410 L650 410 Z"/>
    <path d="M20 360 L60 340 L60 420 L20 420 Z"/>
  </g>
  <!-- fog bands -->
  <rect y="380" width="800" height="40" fill="#f4f6f8" opacity="0.7"/>
  <rect y="210" width="800" height="30" fill="#f4f6f8" opacity="0.6"/>

  <!-- cottage wall -->
  <rect x="150" y="262" width="500" height="360" fill="#c9b79c" stroke="#222" stroke-width="4"/>
  <!-- stone courses -->
  <g stroke="#8a7a62" stroke-width="2" fill="none">
    <path d="M150 300 H650 M150 340 H650 M150 380 H650 M150 420 H650 M150 460 H650 M150 500 H650 M150 540 H650 M150 580 H650"/>
    <path d="M200 262 V300 M280 300 V340 M360 340 V380 M520 300 V340 M600 340 V380 M240 380 V420 M600 420 V460 M200 460 V500 M560 500 V540 M250 540 V580"/>
  </g>
  <!-- rain-darkened wall streaks -->
  <g stroke="#7a8590" stroke-width="2" opacity="0.35">
    <path d="M170 300 V420 M320 270 V330 M620 290 V470 M180 470 V560"/>
  </g>

  <!-- roof -->
  <path d="M110 268 L400 110 L690 268 Z" fill="#5d6670" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#434b53" stroke-width="2">
    <path d="M160 245 L400 118 M240 220 L400 132 M560 220 L400 132 M640 245 L400 118"/>
  </g>
  <!-- eave edge -->
  <rect x="110" y="262" width="580" height="14" fill="#3f474f" stroke="#222" stroke-width="3"/>

  <!-- water running off eaves -->
  <g stroke="#5c7f99" stroke-width="3" stroke-linecap="round" fill="#5c7f99">
    <path d="M130 276 V320 M185 276 V342 M240 276 V312 M300 276 V336 M520 276 V330 M580 276 V318 M640 276 V346 M690 276 V310"/>
    <circle cx="130" cy="324" r="4" stroke="none"/>
    <circle cx="185" cy="346" r="4" stroke="none"/>
    <circle cx="240" cy="316" r="4" stroke="none"/>
    <circle cx="300" cy="340" r="4" stroke="none"/>
    <circle cx="520" cy="334" r="4" stroke="none"/>
    <circle cx="580" cy="322" r="4" stroke="none"/>
    <circle cx="640" cy="350" r="4" stroke="none"/>
    <circle cx="690" cy="314" r="4" stroke="none"/>
  </g>

  <!-- downpipe -->
  <rect x="142" y="290" width="10" height="330" fill="#6b747c" stroke="#222" stroke-width="2"/>

  <!-- windows -->
  <g stroke="#222" stroke-width="3">
    <rect x="200" y="320" width="100" height="90" fill="#f2d98a"/>
    <rect x="510" y="320" width="100" height="90" fill="#f2d98a"/>
  </g>
  <g stroke="#222" stroke-width="3" fill="none">
    <path d="M250 320 V410 M200 365 H300 M560 320 V410 M510 365 H610"/>
  </g>
  <!-- window sills and wet glass -->
  <rect x="192" y="410" width="116" height="10" fill="#8e8475" stroke="#222" stroke-width="2"/>
  <rect x="502" y="410" width="116" height="10" fill="#8e8475" stroke="#222" stroke-width="2"/>
  <g stroke="#9fb6c8" stroke-width="2" opacity="0.7">
    <path d="M215 330 V345 M283 330 V350 M525 330 V348 M595 330 V344"/>
  </g>

  <!-- door -->
  <rect x="330" y="400" width="140" height="222" fill="#4a3a2c" stroke="#222" stroke-width="4"/>
  <rect x="345" y="418" width="110" height="80" fill="none" stroke="#2c211a" stroke-width="3"/>
  <rect x="345" y="512" width="110" height="94" fill="none" stroke="#2c211a" stroke-width="3"/>
  <circle cx="450" cy="555" r="5" fill="#c9a24a" stroke="#222" stroke-width="1.5"/>

  <!-- crooked wall sign: bracket and chains -->
  <path d="M480 378 H500 V398 H486 Z" fill="none" stroke="#222" stroke-width="0"/>
  <path d="M478 360 L505 360 L505 400" fill="none" stroke="#222" stroke-width="4"/>
  <path d="M490 360 L560 380 M522 368 L560 392" stroke="#222" stroke-width="2"/>
  <!-- sign board, tilted -->
  <g transform="rotate(-7 560 395)">
    <rect x="498" y="350" width="130" height="90" rx="6" fill="#2f4a3f" stroke="#222" stroke-width="4"/>
    <rect x="508" y="360" width="110" height="70" fill="none" stroke="#c8d6c4" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- lantern pictogram -->
    <path d="M553 376 H567 L570 384 H550 Z" fill="#d9b25c" stroke="#222" stroke-width="2"/>
    <rect x="551" y="384" width="18" height="24" fill="#f2d98a" stroke="#222" stroke-width="2"/>
    <path d="M549 408 H571 L567 414 H553 Z" fill="#d9b25c" stroke="#222" stroke-width="2"/>
    <path d="M560 368 V376" stroke="#222" stroke-width="2"/>
    <path d="M530 386 H542 M578 386 H590" stroke="#c8d6c4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- doorstep -->
  <path d="M300 622 H500 L520 650 H280 Z" fill="#9c958b" stroke="#222" stroke-width="3"/>
  <path d="M300 636 H510" stroke="#6f6a62" stroke-width="2"/>

  <!-- cobbled foreground -->
  <rect y="650" width="800" height="150" fill="#b3aba0"/>
  <g fill="#8f877c" stroke="#4d4740" stroke-width="2">
    <ellipse cx="90" cy="680" rx="42" ry="14"/>
    <ellipse cx="200" cy="676" rx="38" ry="13"/>
    <ellipse cx="310" cy="686" rx="44" ry="15"/>
    <ellipse cx="420" cy="676" rx="40" ry="13"/>
    <ellipse cx="530" cy="684" rx="42" ry="14"/>
    <ellipse cx="640" cy="677" rx="40" ry="13"/>
    <ellipse cx="740" cy="688" rx="44" ry="14"/>
    <ellipse cx="50" cy="730" rx="52" ry="18"/>
    <ellipse cx="170" cy="738" rx="56" ry="19"/>
    <ellipse cx="290" cy="724" rx="50" ry="17"/>
    <ellipse cx="410" cy="742" rx="58" ry="19"/>
    <ellipse cx="535" cy="728" rx="52" ry="17"/>
    <ellipse cx="660" cy="744" rx="56" ry="19"/>
    <ellipse cx="770" cy="732" rx="50" ry="18"/>
    <ellipse cx="110" cy="780" rx="70" ry="22"/>
    <ellipse cx="320" cy="782" rx="72" ry="22"/>
    <ellipse cx="540" cy="780" rx="70" ry="22"/>
    <ellipse cx="740" cy="784" rx="66" ry="20"/>
  </g>
  <!-- puddles -->
  <g fill="#8fa8ba" opacity="0.7">
    <ellipse cx="240" cy="700" rx="60" ry="8"/>
    <ellipse cx="600" cy="716" rx="70" ry="9"/>
  </g>

  <!-- falling rain -->
  <g stroke="#5c7f99" stroke-width="1.5" opacity="0.55" stroke-linecap="round">
    <path d="M60 120 L48 150 M120 90 L108 120 M200 60 L188 90 M270 150 L258 180 M360 40 L348 70 M440 110 L428 140 M520 60 L508 90 M600 150 L588 180 M690 90 L678 120 M750 40 L738 70 M30 240 L18 270 M760 230 L748 260 M80 360 L68 390 M740 380 L728 410 M400 200 L388 230 M300 240 L288 270 M480 220 L468 250"/>
    <path d="M700 520 L688 550 M740 600 L728 630 M60 540 L48 570 M30 630 L18 660 M160 700 L148 730"/>
  </g>

  <!-- signature -->
  <text x="758" y="782" font-family="serif" font-size="22" fill="#222" text-anchor="end">P.</text>
</svg>