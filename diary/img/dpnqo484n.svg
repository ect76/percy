<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#f3efe4"/>
  <!-- fog bands -->
  <rect x="0" y="120" width="800" height="60" fill="#e4e1d6" opacity="0.7"/>
  <rect x="0" y="560" width="800" height="50" fill="#e4e1d6" opacity="0.6"/>
  <!-- cobbles -->
  <g fill="#dcd6c6" stroke="#2a2a2a" stroke-width="2.5">
    <ellipse cx="120" cy="700" rx="60" ry="18"/>
    <ellipse cx="240" cy="725" rx="70" ry="20"/>
    <ellipse cx="380" cy="705" rx="62" ry="17"/>
    <ellipse cx="520" cy="735" rx="75" ry="21"/>
    <ellipse cx="660" cy="700" rx="64" ry="18"/>
    <ellipse cx="200" cy="770" rx="80" ry="16"/>
    <ellipse cx="600" cy="775" rx="90" ry="17"/>
  </g>
  <!-- handle -->
  <path d="M340,352 C326,226 474,216 460,352" fill="none" stroke="#2a2a2a" stroke-width="9" stroke-linecap="round"/>
  <!-- spout -->
  <path d="M272,505 L112,320 L100,334 L262,548 Z" fill="#b9c6cb" stroke="#2a2a2a" stroke-width="4" stroke-linejoin="round"/>
  <!-- rose head -->
  <path d="M66,300 L106,284 L124,320 L84,336 Z" fill="#9aa8ad" stroke="#2a2a2a" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#2a2a2a">
    <circle cx="82" cy="308" r="3"/>
    <circle cx="94" cy="318" r="3"/>
    <circle cx="106" cy="302" r="3"/>
  </g>
  <!-- body -->
  <path d="M262,345 L274,585 Q396,606 518,585 L530,345 Z" fill="#c9d4d8" stroke="#2a2a2a" stroke-width="4" stroke-linejoin="round"/>
  <!-- highlight -->
  <path d="M296,372 L306,566" stroke="#eef4f5" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <!-- dent on right side -->
  <path d="M470,400 Q500,450 482,520 Q470,470 452,420 Z" fill="#8a9a a0" fill-opacity="0.6" stroke="#2a2a2a" stroke-width="2.5"/>
  <path d="M468,398 Q498,452 480,524" fill="none" stroke="#2a2a2a" stroke-width="2" opacity="0.7"/>
  <!-- faded V2 stamp -->
  <text x="396" y="520" font-family="serif" font-size="44" fill="#7d8a8f" opacity="0.45" text-anchor="middle">V2</text>
  <!-- base -->
  <ellipse cx="396" cy="598" rx="120" ry="14" fill="#8e9ca1" stroke="#2a2a2a" stroke-width="4"/>
  <!-- rim -->
  <ellipse cx="396" cy="345" rx="134" ry="20" fill="#9aa8ad" stroke="#2a2a2a" stroke-width="4"/>
  <!-- soil in rim -->
  <ellipse cx="380" cy="346" rx="42" ry="8" fill="#7a5a3a" stroke="#2a2a2a" stroke-width="2"/>
  <g fill="#4a3522">
    <circle cx="362" cy="344" r="2.5"/>
    <circle cx="384" cy="349" r="2"/>
    <circle cx="402" cy="343" r="2.5"/>
    <circle cx="395" cy="350" r="1.8"/>
  </g>
  <!-- signature -->
  <text x="740" y="772" font-family="serif" font-size="28" fill="#2a2a2a" text-anchor="end">P.</text>
</svg>