<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe6d2"/>
  <!-- faint paper grain lines -->
  <g stroke="#d9ccb2" stroke-width="2" fill="none">
    <path d="M40 90 H250"/><path d="M40 120 H220"/><path d="M40 150 H240"/>
  </g>
  <!-- desk -->
  <rect x="0" y="640" width="800" height="160" fill="#7a5a3a"/>
  <rect x="0" y="632" width="800" height="12" fill="#5c4228" stroke="#1d1d1d" stroke-width="4"/>
  <!-- pencil on desk -->
  <g stroke="#1d1d1d" stroke-width="4">
    <polygon points="60,700 300,670 306,684 66,714" fill="#e8c24a"/>
    <polygon points="300,670 326,664 332,678 306,684" fill="#f2d9b0"/>
  </g>
  <!-- tin mouse tail -->
  <path d="M600 385 C660 395 690 340 730 318" fill="none" stroke="#1d1d1d" stroke-width="14" stroke-linecap="round"/>
  <path d="M600 385 C660 395 690 340 730 318" fill="none" stroke="#9aa59a" stroke-width="6" stroke-linecap="round"/>
  <!-- ears -->
  <circle cx="196" cy="292" r="36" fill="#b9c2b5" stroke="#1d1d1d" stroke-width="6"/>
  <circle cx="252" cy="280" r="32" fill="#b9c2b5" stroke="#1d1d1d" stroke-width="6"/>
  <!-- body -->
  <ellipse cx="400" cy="380" rx="220" ry="130" fill="#9aa59a" stroke="#1d1d1d" stroke-width="6"/>
  <!-- head -->
  <ellipse cx="230" cy="352" rx="92" ry="80" fill="#9aa59a" stroke="#1d1d1d" stroke-width="6"/>
  <!-- underside shading -->
  <path d="M250 430 Q400 500 580 420" fill="none" stroke="#6f7a6e" stroke-width="10" stroke-linecap="round"/>
  <!-- dent -->
  <ellipse cx="410" cy="380" rx="88" ry="58" fill="#6d766c" stroke="#1d1d1d" stroke-width="5"/>
  <ellipse cx="404" cy="372" rx="70" ry="42" fill="#5a6358"/>
  <path d="M340 350 Q360 330 384 326" fill="none" stroke="#c9d2c4" stroke-width="5" stroke-linecap="round"/>
  <path d="M430 418 Q470 424 486 404" fill="none" stroke="#2f352d" stroke-width="4" stroke-linecap="round"/>
  <!-- scratched brass around key -->
  <g stroke="#f5e1a0" stroke-width="3" stroke-linecap="round">
    <line x1="350" y1="330" x2="362" y2="344"/>
    <line x1="462" y1="330" x2="452" y2="344"/>
    <line x1="338" y1="392" x2="352" y2="390"/>
    <line x1="466" y1="440" x2="458" y2="428"/>
    <line x1="372" y1="430" x2="384" y2="422"/>
    <line x1="478" y1="356" x2="490" y2="364"/>
  </g>
  <!-- spring key -->
  <rect x="446" y="370" width="104" height="18" fill="#d9a84a" stroke="#1d1d1d" stroke-width="4"/>
  <rect x="540" y="362" width="22" height="34" fill="#c08e34" stroke="#1d1d1d" stroke-width="4"/>
  <circle cx="410" cy="380" r="40" fill="#e0b25a" stroke="#1d1d1d" stroke-width="5"/>
  <circle cx="410" cy="380" r="16" fill="#6b4a1e" stroke="#1d1d1d" stroke-width="3"/>
  <path d="M384 356 Q398 344 414 344" fill="none" stroke="#fff3c4" stroke-width="4" stroke-linecap="round"/>
  <!-- signature -->
  <text x="752" y="780" font-size="28" fill="#1d1d1d">P.</text>
</svg>