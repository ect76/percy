<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and sky -->
  <rect x="0" y="0" width="800" height="800" fill="#ece6d6"/>
  <rect x="0" y="0" width="800" height="360" fill="#d6e2e4"/>
  <circle cx="640" cy="150" r="120" fill="#fff3c4" opacity="0.7"/>
  <circle cx="640" cy="150" r="50" fill="#fff9e0"/>

  <!-- distant trees in fog -->
  <path d="M0 330 Q40 290 80 325 Q120 285 160 322 Q200 292 240 326 Q280 298 320 330 L320 360 L0 360 Z" fill="#b7c4bb" opacity="0.8"/>
  <path d="M480 330 Q520 296 560 326 Q600 290 640 324 Q680 294 720 328 Q760 300 800 330 L800 360 L480 360 Z" fill="#b7c4bb" opacity="0.8"/>
  <rect x="0" y="318" width="800" height="50" fill="#f2f2ee" opacity="0.7"/>

  <!-- grass and ground -->
  <polygon points="0,700 0,800 60,800 390,360 0,360" fill="#a9bb8f"/>
  <polygon points="760,800 800,800 800,300 470,360" fill="#9cb389" stroke="#2b2420" stroke-width="2"/>

  <!-- lane -->
  <polygon points="60,800 760,800 470,360 390,360" fill="#c9bb9d" stroke="#2b2420" stroke-width="3"/>
  <g stroke="#7d6e58" stroke-width="2" fill="none">
    <line x1="300" y1="480" x2="549" y2="480"/>
    <line x1="225" y1="580" x2="615" y2="580"/>
    <line x1="135" y1="700" x2="694" y2="700"/>
  </g>
  <g fill="#b3a385" stroke="#7d6e58" stroke-width="1.5">
    <ellipse cx="340" cy="520" rx="14" ry="6"/>
    <ellipse cx="450" cy="508" rx="12" ry="5"/>
    <ellipse cx="270" cy="620" rx="18" ry="7"/>
    <ellipse cx="520" cy="610" rx="16" ry="6"/>
    <ellipse cx="380" cy="660" rx="20" ry="8"/>
    <ellipse cx="610" cy="750" rx="24" ry="9"/>
    <ellipse cx="200" cy="760" rx="26" ry="10"/>
    <ellipse cx="420" cy="730" rx="22" ry="8"/>
  </g>

  <!-- morning light across the lane -->
  <polygon points="520,0 620,0 300,700 180,700" fill="#fff4c0" opacity="0.35"/>

  <!-- cottage wall and roof -->
  <rect x="0" y="215" width="380" height="475" fill="#f4ecd8" stroke="#2b2420" stroke-width="3"/>
  <polygon points="-10,215 190,95 390,215" fill="#6b4f3a" stroke="#2b2420" stroke-width="3"/>

  <!-- upper windows -->
  <rect x="30" y="325" width="80" height="65" fill="#cfe3e8" stroke="#2b2420" stroke-width="3"/>
  <rect x="270" y="325" width="80" height="65" fill="#cfe3e8" stroke="#2b2420" stroke-width="3"/>
  <!-- lower window -->
  <rect x="30" y="510" width="80" height="70" fill="#cfe3e8" stroke="#2b2420" stroke-width="3"/>

  <!-- timber frame -->
  <g fill="#3a2a1f">
    <rect x="0" y="215" width="12" height="475"/>
    <rect x="124" y="215" width="12" height="475"/>
    <rect x="244" y="215" width="12" height="475"/>
    <rect x="368" y="215" width="12" height="475"/>
    <rect x="0" y="300" width="380" height="12"/>
    <rect x="0" y="472" width="380" height="12"/>
  </g>
  <g stroke="#3a2a1f" stroke-width="8" fill="none">
    <line x1="12" y1="472" x2="124" y2="312"/>
    <line x1="256" y1="472" x2="368" y2="312"/>
  </g>
  <g stroke="#3a2a1f" stroke-width="5">
    <line x1="70" y1="325" x2="70" y2="390"/>
    <line x1="30" y1="357" x2="110" y2="357"/>
    <line x1="310" y1="325" x2="310" y2="390"/>
    <line x1="270" y1="357" x2="350" y2="357"/>
    <line x1="70" y1="510" x2="70" y2="580"/>
    <line x1="30" y1="545" x2="110" y2="545"/>
  </g>

  <!-- door and doorstep -->
  <rect x="150" y="500" width="80" height="190" fill="#5a3b2a" stroke="#2b2420" stroke-width="3"/>
  <circle cx="218" cy="600" r="4" fill="#d4a94a"/>
  <rect x="136" y="690" width="108" height="18" fill="#bdb7a8" stroke="#2b2420" stroke-width="2"/>

  <!-- hanging sign -->
  <line x1="160" y1="215" x2="160" y2="235" stroke="#2b2420" stroke-width="2"/>
  <line x1="320" y1="215" x2="320" y2="235" stroke="#2b2420" stroke-width="2"/>
  <rect x="140" y="235" width="200" height="46" rx="4" fill="#e8d9b0" stroke="#2b2420" stroke-width="3"/>
  <text x="240" y="266" text-anchor="middle" font-family="serif" font-size="24" fill="#2b1f17">Percy's Cottage</text>

  <!-- fog over the far lane and foreground -->
  <ellipse cx="420" cy="360" rx="260" ry="40" fill="#f5f5f0" opacity="0.6"/>
  <ellipse cx="560" cy="700" rx="320" ry="50" fill="#f5f5f0" opacity="0.25"/>

  <!-- signature -->
  <text x="772" y="784" text-anchor="end" font-family="serif" font-size="22" fill="#2b2420">P.</text>
</svg>