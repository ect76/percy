<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper and wall -->
  <rect x="0" y="0" width="800" height="800" fill="#f4ecd8"/>
  <rect x="0" y="0" width="800" height="250" fill="#e6dcc4"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#2a1f17" stroke-width="4"/>

  <!-- lane window on wall -->
  <rect x="520" y="40" width="200" height="160" fill="#cfe3ea" stroke="#2a1f17" stroke-width="4"/>
  <line x1="620" y1="40" x2="620" y2="200" stroke="#2a1f17" stroke-width="4"/>
  <line x1="520" y1="120" x2="720" y2="120" stroke="#2a1f17" stroke-width="4"/>

  <!-- floor boards -->
  <rect x="0" y="250" width="800" height="550" fill="#b98a5a"/>
  <rect x="0" y="300" width="800" height="50" fill="#a87444"/>
  <rect x="0" y="410" width="800" height="70" fill="#a87444"/>
  <rect x="0" y="560" width="800" height="90" fill="#a87444"/>
  <g stroke="#5a3d25" stroke-width="3" fill="none">
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="410" x2="800" y2="410"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="0" y1="650" x2="800" y2="650"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
    <line x1="150" y1="250" x2="150" y2="300"/>
    <line x1="380" y1="250" x2="380" y2="300"/>
    <line x1="260" y1="300" x2="260" y2="350"/>
    <line x1="610" y1="300" x2="610" y2="350"/>
    <line x1="90" y1="350" x2="90" y2="410"/>
    <line x1="500" y1="350" x2="500" y2="410"/>
    <line x1="300" y1="410" x2="300" y2="480"/>
    <line x1="700" y1="410" x2="700" y2="480"/>
    <line x1="180" y1="480" x2="180" y2="560"/>
    <line x1="560" y1="480" x2="560" y2="560"/>
    <line x1="420" y1="560" x2="420" y2="650"/>
    <line x1="90" y1="650" x2="90" y2="750"/>
    <line x1="680" y1="650" x2="680" y2="750"/>
  </g>

  <!-- table leg at left -->
  <rect x="40" y="250" width="40" height="300" fill="#6b4a2e" stroke="#2a1f17" stroke-width="4"/>
  <rect x="30" y="530" width="60" height="14" fill="#4f3520" stroke="#2a1f17" stroke-width="3"/>

  <!-- sunlight from the lane window across the boards -->
  <polygon points="520,250 720,250 560,560 260,560" fill="#fff1a8" opacity="0.8"/>
  <polygon points="520,250 720,250 560,560 260,560" fill="none" stroke="#d9b75a" stroke-width="2" opacity="0.6"/>

  <!-- mouse shadow -->
  <ellipse cx="450" cy="582" rx="170" ry="14" fill="#3a2a1a" opacity="0.35"/>

  <!-- tail -->
  <path d="M335 500 C280 500 260 450 230 440" fill="none" stroke="#2a1f17" stroke-width="6" stroke-linecap="round"/>

  <!-- back feet (further away, darker) -->
  <rect x="395" y="556" width="30" height="22" rx="4" fill="#6c7176" stroke="#2a1f17" stroke-width="3"/>
  <rect x="500" y="556" width="30" height="22" rx="4" fill="#6c7176" stroke="#2a1f17" stroke-width="3"/>

  <!-- front feet with scuffs -->
  <rect x="360" y="552" width="36" height="26" rx="4" fill="#8a8f94" stroke="#2a1f17" stroke-width="3"/>
  <rect x="470" y="552" width="36" height="26" rx="4" fill="#8a8f94" stroke="#2a1f17" stroke-width="3"/>
  <g stroke="#3a2a1a" stroke-width="2" fill="none">
    <line x1="368" y1="562" x2="378" y2="558"/>
    <line x1="372" y1="570" x2="386" y2="568"/>
    <line x1="478" y1="566" x2="490" y2="562"/>
    <line x1="484" y1="572" x2="496" y2="570"/>
  </g>

  <!-- wire from body to rear foot -->
  <path d="M480 560 Q490 590 470 600" fill="none" stroke="#2a1f17" stroke-width="2"/>

  <!-- tinplate body -->
  <rect x="330" y="470" width="240" height="90" rx="26" fill="#b9c7d0" stroke="#2a1f17" stroke-width="4"/>
  <rect x="350" y="482" width="200" height="10" rx="5" fill="#e8f0f4"/>
  <circle cx="360" cy="520" r="5" fill="#8c9ca6" stroke="#2a1f17" stroke-width="2"/>
  <circle cx="545" cy="520" r="5" fill="#8c9ca6" stroke="#2a1f17" stroke-width="2"/>
  <!-- rust scuff near base -->
  <path d="M440 548 q10 -6 22 0 q-8 6 -22 0z" fill="#9a5a34" opacity="0.7"/>

  <!-- spring key on side -->
  <rect x="410" y="452" width="14" height="22" fill="#d4a94a" stroke="#2a1f17" stroke-width="2"/>
  <circle cx="417" cy="446" r="12" fill="#d4a94a" stroke="#2a1f17" stroke-width="3"/>
  <line x1="403" y1="446" x2="431" y2="446" stroke="#2a1f17" stroke-width="3"/>
  <circle cx="420" cy="510" r="16" fill="#c9cfd3" stroke="#2a1f17" stroke-width="3"/>
  <circle cx="420" cy="510" r="5" fill="#2a1f17"/>

  <!-- head and ears -->
  <circle cx="560" cy="428" r="20" fill="#d8a9a4" stroke="#2a1f17" stroke-width="4"/>
  <circle cx="584" cy="426" r="18" fill="#d8a9a4" stroke="#2a1f17" stroke-width="4"/>
  <ellipse cx="580" cy="480" rx="46" ry="40" fill="#b9c7d0" stroke="#2a1f17" stroke-width="4"/>
  <ellipse cx="625" cy="492" rx="18" ry="12" fill="#d8b9b0" stroke="#2a1f17" stroke-width="3"/>
  <circle cx="592" cy="472" r="5" fill="#2a1f17"/>
  <circle cx="642" cy="488" r="4" fill="#2a1f17"/>

  <!-- signature P. -->
  <path d="M742 780 V738 H756 Q766 738 766 748 Q766 758 756 758 H742" fill="none" stroke="#2a1f17" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="774" cy="778" r="4" fill="#2a1f17"/>
</svg>