<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>

  <!-- back wall -->
  <rect x="40" y="40" width="720" height="560" fill="#d9d4c7" stroke="#1a1a1a" stroke-width="3"/>

  <!-- window onto the lane -->
  <rect x="500" y="110" width="190" height="250" fill="#b9c2c8" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="595" y1="110" x2="595" y2="360" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="500" y1="235" x2="690" y2="235" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="488" y="100" width="214" height="12" fill="#8a7458" stroke="#1a1a1a" stroke-width="2"/>

  <!-- grey light falling from the window onto the planks -->
  <polygon points="500,360 690,360 745,600 430,600" fill="#a9b4ba" opacity="0.6"/>
  <polygon points="520,360 670,360 705,600 470,600" fill="#c3ccd1" opacity="0.5"/>

  <!-- cupboard -->
  <rect x="110" y="150" width="320" height="450" fill="#7a5a3c" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="135" y="175" width="270" height="400" fill="#5e4330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- bare shelves -->
  <rect x="135" y="290" width="270" height="12" fill="#9c7a57" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="135" y="420" width="270" height="12" fill="#9c7a57" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="135" y="550" width="270" height="12" fill="#9c7a57" stroke="#1a1a1a" stroke-width="2"/>

  <!-- cupboard door handle -->
  <circle cx="392" cy="380" r="6" fill="#c9b49a" stroke="#1a1a1a" stroke-width="2"/>

  <!-- wooden planks floor -->
  <rect x="40" y="600" width="720" height="160" fill="#8a6a4a" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="40" y1="640" x2="760" y2="640" stroke="#4a3828" stroke-width="2"/>
  <line x1="40" y1="680" x2="760" y2="680" stroke="#4a3828" stroke-width="2"/>
  <line x1="40" y1="720" x2="760" y2="720" stroke="#4a3828" stroke-width="2"/>
  <line x1="230" y1="600" x2="230" y2="640" stroke="#4a3828" stroke-width="2"/>
  <line x1="560" y1="640" x2="560" y2="680" stroke="#4a3828" stroke-width="2"/>
  <line x1="330" y1="680" x2="330" y2="720" stroke="#4a3828" stroke-width="2"/>
  <line x1="180" y1="720" x2="180" y2="760" stroke="#4a3828" stroke-width="2"/>
  <line x1="640" y1="720" x2="640" y2="760" stroke="#4a3828" stroke-width="2"/>

  <!-- empty tin lying on its side -->
  <rect x="300" y="628" width="110" height="44" rx="12" fill="#b8b2a4" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="318" y1="628" x2="318" y2="672" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="410" cy="650" rx="10" ry="22" fill="#6d675c" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="410" cy="650" rx="4" ry="9" fill="#3d3a34"/>

  <!-- single coin on the wood -->
  <ellipse cx="476" cy="708" rx="26" ry="22" fill="#5a4330" opacity="0.35"/>
  <circle cx="470" cy="700" r="22" fill="#c9a646" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="470" cy="700" r="15" fill="none" stroke="#8a6a1e" stroke-width="2"/>

  <!-- signature -->
  <text x="752" y="780" font-family="serif" font-size="24" text-anchor="end" fill="#1a1a1a">P.</text>
</svg>