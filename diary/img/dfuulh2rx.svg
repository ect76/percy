<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b76a"/>
      <stop offset="1" stop-color="#f3e3bf"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b09274"/>
      <stop offset="1" stop-color="#cdb797"/>
    </linearGradient>
    <clipPath id="opening">
      <rect x="110" y="90" width="580" height="520"/>
    </clipPath>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#f4ecd8"/>

  <!-- window view -->
  <g clip-path="url(#opening)">
    <rect x="110" y="90" width="580" height="520" fill="url(#sky)"/>

    <!-- distant hills in fog -->
    <path d="M110 300 Q250 250 360 300 T690 290 L690 380 L110 380 Z" fill="#b8c2bf" opacity="0.8"/>

    <!-- left cottage -->
    <polygon points="110,250 250,250 250,520 110,520" fill="#8c6f58" stroke="#2b2620" stroke-width="2"/>
    <polygon points="100,250 180,190 260,250" fill="#5e4a3c" stroke="#2b2620" stroke-width="2"/>
    <rect x="150" y="330" width="44" height="60" fill="#f2d89a" stroke="#2b2620" stroke-width="2"/>
    <line x1="172" y1="330" x2="172" y2="390" stroke="#2b2620" stroke-width="2"/>

    <!-- right cottages -->
    <polygon points="460,300 640,300 640,430 460,420" fill="#a68a70" stroke="#2b2620" stroke-width="2"/>
    <polygon points="450,300 550,250 650,300" fill="#6a5545" stroke="#2b2620" stroke-width="2"/>
    <rect x="490" y="340" width="36" height="50" fill="#f2d89a" stroke="#2b2620" stroke-width="2"/>
    <rect x="580" y="350" width="36" height="50" fill="#e3c98f" stroke="#2b2620" stroke-width="2"/>

    <!-- narrow bell tower -->
    <polygon points="540,160 564,108 588,160" fill="#5d5448" stroke="#2b2620" stroke-width="2"/>
    <rect x="546" y="158" width="36" height="36" fill="#6f6559" stroke="#2b2620" stroke-width="2"/>
    <rect x="554" y="168" width="8" height="18" fill="#2b2620"/>
    <rect x="568" y="168" width="8" height="18" fill="#2b2620"/>
    <rect x="540" y="192" width="48" height="300" fill="#8a7f70" stroke="#2b2620" stroke-width="2"/>
    <circle cx="564" cy="212" r="11" fill="#f6e9c8" stroke="#2b2620" stroke-width="2"/>
    <line x1="564" y1="212" x2="564" y2="204" stroke="#2b2620" stroke-width="2"/>
    <line x1="564" y1="212" x2="570" y2="215" stroke="#2b2620" stroke-width="2"/>
    <rect x="552" y="400" width="24" height="92" fill="#3b322a"/>

    <!-- rust-red tin and folded rag on tower step -->
    <rect x="566" y="482" width="20" height="16" fill="#c9bfae" stroke="#2b2620" stroke-width="1.5"/>
    <rect x="566" y="478" width="20" height="5" fill="#a4462c" stroke="#2b2620" stroke-width="1.5"/>
    <rect x="590" y="489" width="14" height="8" fill="#e6dccb" stroke="#2b2620" stroke-width="1"/>

    <!-- lane -->
    <polygon points="110,610 690,610 460,420 380,420" fill="url(#lane)" stroke="#2b2620" stroke-width="2"/>
    <!-- cobbles -->
    <g fill="none" stroke="#6b5a48" stroke-width="1.5">
      <ellipse cx="200" cy="580" rx="14" ry="6"/>
      <ellipse cx="330" cy="560" rx="12" ry="5"/>
      <ellipse cx="470" cy="570" rx="16" ry="6"/>
      <ellipse cx="600" cy="590" rx="18" ry="7"/>
      <ellipse cx="260" cy="520" rx="9" ry="4"/>
      <ellipse cx="410" cy="500" rx="10" ry="4"/>
      <ellipse cx="500" cy="470" rx="7" ry="3"/>
      <ellipse cx="350" cy="460" rx="7" ry="3"/>
      <ellipse cx="430" cy="445" rx="5" ry="2"/>
    </g>

    <!-- lamp at the bend -->
    <circle cx="395" cy="330" r="60" fill="#ffe9a8" opacity="0.45"/>
    <rect x="390" y="345" width="6" height="80" fill="#2b2620"/>
    <rect x="382" y="322" width="22" height="20" fill="#ffd76a" stroke="#2b2620" stroke-width="2"/>
    <polygon points="378,322 415,322 396,308" fill="#2b2620"/>

    <!-- fog bands -->
    <rect x="110" y="370" width="580" height="50" fill="#f6efdf" opacity="0.45"/>
    <rect x="110" y="470" width="580" height="60" fill="#f6efdf" opacity="0.35"/>
    <rect x="110" y="540" width="580" height="70" fill="#f6efdf" opacity="0.25"/>

    <!-- low sun shaft -->
    <polygon points="110,90 260,90 470,610 330,610" fill="#fff4d0" opacity="0.18"/>
  </g>

  <!-- cottage window frame -->
  <rect x="110" y="90" width="580" height="520" fill="none" stroke="#6b5544" stroke-width="22"/>
  <rect x="99" y="79" width="602" height="542" fill="none" stroke="#2b2620" stroke-width="2"/>
  <rect x="399" y="90" width="12" height="520" fill="#6b5544"/>
  <rect x="110" y="330" width="580" height="12" fill="#6b5544"/>
  <!-- sill -->
  <rect x="84" y="610" width="632" height="26" fill="#8a7059" stroke="#2b2620" stroke-width="2"/>

  <!-- signature -->
  <text x="752" y="780" font-size="22" fill="#3b322a">P.</text>
</svg>