<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdc"/>

  <!-- interior wall -->
  <rect x="20" y="20" width="760" height="450" fill="#e6d3ab" stroke="#2a2420" stroke-width="2.5"/>

  <!-- counter -->
  <rect x="20" y="430" width="760" height="40" fill="#8a5a33" stroke="#2a2420" stroke-width="2.5"/>
  <rect x="20" y="470" width="760" height="0" fill="none"/>

  <!-- clock: nail, cord, crooked case -->
  <circle cx="300" cy="40" r="4" fill="#2a2420"/>
  <line x1="300" y1="44" x2="300" y2="60" stroke="#2a2420" stroke-width="2"/>
  <g transform="rotate(-6 300 130)">
    <circle cx="300" cy="130" r="72" fill="#7a4e2a" stroke="#2a2420" stroke-width="2.5"/>
    <circle cx="300" cy="130" r="58" fill="#fbf8ef" stroke="#2a2420" stroke-width="2"/>
    <line x1="300" y1="130" x2="300" y2="92" stroke="#1d1a17" stroke-width="5" stroke-linecap="round"/>
    <line x1="300" y1="130" x2="330" y2="136" stroke="#1d1a17" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="130" r="4" fill="#1d1a17"/>
  </g>

  <!-- chalkboard in plain wooden frame -->
  <rect x="470" y="170" width="250" height="230" fill="#9a6b3e" stroke="#2a2420" stroke-width="2.5"/>
  <rect x="482" y="182" width="226" height="206" fill="#37403e" stroke="#2a2420" stroke-width="1.5"/>
  <path d="M482,300 Q560,292 640,298 T708,296" fill="none" stroke="#5b6664" stroke-width="6" opacity="0.6"/>
  <g font-family="serif" fill="#f1ede0">
    <text x="595" y="204" font-size="14" text-anchor="middle" font-weight="bold">DOT'S TEAROOM</text>
    <text x="490" y="228" font-size="11">Pot of tea (large)</text>
    <text x="700" y="228" font-size="11" text-anchor="end">2.40</text>
    <text x="490" y="251" font-size="11">Pot of tea (small)</text>
    <text x="700" y="251" font-size="11" text-anchor="end">1.60</text>
    <text x="490" y="274" font-size="11">Scone with jam &amp; cream</text>
    <text x="700" y="274" font-size="11" text-anchor="end">3.20</text>
    <text x="490" y="297" font-size="11">Victoria sponge slice</text>
    <text x="700" y="297" font-size="11" text-anchor="end">2.80</text>
    <text x="490" y="320" font-size="11">Toasted teacake</text>
    <text x="700" y="320" font-size="11" text-anchor="end">2.10</text>
    <text x="490" y="343" font-size="11">Mossbrook honey, jar to take away</text>
    <text x="700" y="343" font-size="11" text-anchor="end">4.50</text>
  </g>

  <!-- sugar bowl on counter -->
  <path d="M265,388 Q262,432 300,434 Q338,432 335,388 Z" fill="#f2e8cc" stroke="#2a2420" stroke-width="2.5"/>
  <ellipse cx="300" cy="388" rx="35" ry="9" fill="#f2e8cc" stroke="#2a2420" stroke-width="2.5"/>
  <ellipse cx="300" cy="388" rx="29" ry="5.5" fill="#8b5a2b"/>
  <path d="M328,381 L334,389 L326,392 Z" fill="#e6d3ab" stroke="#2a2420" stroke-width="1.5"/>

  <!-- fog band behind village -->
  <ellipse cx="400" cy="500" rx="460" ry="30" fill="#fbf8ef" opacity="0.7"/>

  <!-- ground of cobbles -->
  <rect x="0" y="500" width="800" height="300" fill="#bdb4a0" stroke="#2a2420" stroke-width="2.5"/>
  <g fill="#d8d0bd" stroke="#2a2420" stroke-width="1.8">
    <ellipse cx="30" cy="530" rx="26" ry="11"/>
    <ellipse cx="90" cy="545" rx="24" ry="10"/>
    <ellipse cx="160" cy="528" rx="22" ry="10"/>
    <ellipse cx="240" cy="550" rx="26" ry="11"/>
    <ellipse cx="420" cy="530" rx="24" ry="10"/>
    <ellipse cx="500" cy="548" rx="24" ry="10"/>
    <ellipse cx="580" cy="528" rx="26" ry="11"/>
    <ellipse cx="660" cy="552" rx="24" ry="10"/>
    <ellipse cx="740" cy="530" rx="24" ry="10"/>
    <ellipse cx="50" cy="700" rx="28" ry="12"/>
    <ellipse cx="150" cy="720" rx="26" ry="11"/>
    <ellipse cx="260" cy="700" rx="28" ry="12"/>
    <ellipse cx="370" cy="722" rx="26" ry="11"/>
    <ellipse cx="480" cy="700" rx="28" ry="12"/>
    <ellipse cx="600" cy="722" rx="26" ry="11"/>
    <ellipse cx="710" cy="700" rx="28" ry="12"/>
    <ellipse cx="100" cy="770" rx="30" ry="12"/>
    <ellipse cx="230" cy="785" rx="28" ry="12"/>
    <ellipse cx="400" cy="772" rx="30" ry="12"/>
    <ellipse cx="560" cy="790" rx="28" ry="12"/>
    <ellipse cx="700" cy="768" rx="30" ry="12"/>
  </g>

  <!-- cottage -->
  <rect x="60" y="500" width="230" height="200" fill="#d9b48f" stroke="#2a2420" stroke-width="2.5"/>
  <polygon points="40,502 175,420 310,502" fill="#7a4a3a" stroke="#2a2420" stroke-width="2.5"/>
  <rect x="80" y="540" width="50" height="45" fill="#f7e7a6" stroke="#2a2420" stroke-width="2"/>
  <line x1="105" y1="540" x2="105" y2="585" stroke="#2a2420" stroke-width="1.5"/>
  <line x1="80" y1="562" x2="130" y2="562" stroke="#2a2420" stroke-width="1.5"/>
  <rect x="150" y="600" width="40" height="100" fill="#4e3a2c" stroke="#2a2420" stroke-width="2"/>
  <circle cx="182" cy="652" r="2.5" fill="#e6c36a"/>

  <!-- bench -->
  <rect x="330" y="640" width="95" height="12" fill="#6e4a2b" stroke="#2a2420" stroke-width="2"/>
  <line x1="340" y1="652" x2="340" y2="690" stroke="#2a2420" stroke-width="3"/>
  <line x1="415" y1="652" x2="415" y2="690" stroke="#2a2420" stroke-width="3"/>

  <!-- seated figure -->
  <circle cx="375" cy="560" r="18" fill="#e8b893" stroke="#2a2420" stroke-width="2"/>
  <path d="M357,552 Q375,532 393,552 Z" fill="#5a4030" stroke="#2a2420" stroke-width="2"/>
  <path d="M352,580 L396,580 L400,640 L348,640 Z" fill="#4c6a8a" stroke="#2a2420" stroke-width="2.5"/>
  <path d="M352,585 Q336,610 340,640 L352,640 Z" fill="#4c6a8a" stroke="#2a2420" stroke-width="2"/>
  <path d="M396,585 L402,628 L398,640 L392,630 Z" fill="#4c6a8a" stroke="#2a2420" stroke-width="2"/>
  <path d="M352,640 L414,640 L414,652 L352,652 Z" fill="#33414f" stroke="#2a2420" stroke-width="2"/>
  <rect x="412" y="648" width="12" height="10" fill="#2a2420"/>
  <rect x="352" y="652" width="12" height="10" fill="#2a2420"/>

  <!-- foreground fog -->
  <ellipse cx="200" cy="470" rx="220" ry="26" fill="#fbf8ef" opacity="0.65"/>
  <ellipse cx="620" cy="620" rx="260" ry="30" fill="#fbf8ef" opacity="0.55"/>
  <ellipse cx="400" cy="745" rx="330" ry="28" fill="#fbf8ef" opacity="0.5"/>

  <!-- signature -->
  <text x="772" y="784" font-family="serif" font-size="20" fill="#2a2420" text-anchor="end">P.</text>
</svg>