  <text x="370" y="466" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#3a3a3a">Garden seed - not for sprouting</text>

  <!-- marigold packet -->
  <rect x="176" y="418" width="66" height="102" fill="#e0a13a" stroke="#222" stroke-width="2.5"/>
  <circle cx="209" cy="446" r="14" fill="#d9731c" stroke="#222" stroke-width="1.5"/>
  <text x="209" y="492" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#222">MARIGOLD</text>

  <!-- carrot packet -->
  <rect x="486" y="386" width="84" height="134" fill="#e8f0e6" stroke="#222" stroke-width="2.5"/>
  <rect x="486" y="386" width="84" height="22" fill="#d4622a" stroke="#222" stroke-width="2"/>
  <path d="M528 430 L520 500 L536 500 Z" fill="#e8823a" stroke="#222" stroke-width="1.5"/>
  <path d="M528 430 L516 418 M528 430 L540 418" stroke="#3f7a3a" stroke-width="3"/>
