  <ellipse cx="672" cy="492" rx="16" ry="13" fill="#c9a06a" stroke="#222" stroke-width="2"/>
  <ellipse cx="700" cy="488" rx="17" ry="14" fill="#d2ab74" stroke="#222" stroke-width="2"/>
  <ellipse cx="724" cy="496" rx="14" ry="12" fill="#c49a61" stroke="#222" stroke-width="2"/>
  <path d="M672 480 Q674 468 678 462 M700 474 Q702 462 704 456" fill="none" stroke="#7a6a3a" stroke-width="2"/>

