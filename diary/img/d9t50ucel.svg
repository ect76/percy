  <rect x="60" y="380" width="112" height="140" fill="#2a4a6e" stroke="#222" stroke-width="2.5"/>
  <rect x="60" y="380" width="112" height="140" fill="none" stroke="#9a9a9a" stroke-width="0"/>
  <rect x="60" y="380" width="10" height="10" fill="#9a9a9a"/>
  <rect x="162" y="380" width="10" height="10" fill="#9a9a9a"/>
  <rect x="60" y="510" width="10" height="10" fill="#9a9a9a"/>
  <rect x="162" y="510" width="10" height="10" fill="#9a9a9a"/>
  <text x="116" y="404" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#e8e2d0">VELL'S SEEDS</text>
  <text x="116" y="430" font-family="Georgia, serif" font-size="7" text-anchor="middle" fill="#e8e2d0">PRICES - SEASON 2</text>
  <text x="116" y="446" font-family="Georgia, serif" font-size="7" text-anchor="middle" fill="#e8e2d0">Carrot 1.20</text>
  <text x="116" y="460" font-family="Georgia, serif" font-size="7" text-anchor="middle" fill="#e8e2d0">Beans, runner 1.50</text>
  <text x="116" y="474" font-family="Georgia, serif" font-size="7" text-anchor="middle" fill="#e8e2d0">Onion sets 2.00</text>
  <text x="116" y="488" font-family="Georgia, serif" font-size="7" text-anchor="middle" fill="#e8e2d0">Marigold 0.90</text>
  <!-- red ribbon marker -->
  <path d="M130 380 L130 528 L138 520 L142 528 L142 380 Z" fill="#b8282a" stroke="#222" stroke-width="1.5"/>

  <!-- shelf -->
  <rect x="30" y="520" width="740" height="22" fill="#7a5a3c" stroke="#222" stroke-width="2.5"/>
  <rect x="30" y="542" width="740" height="10" fill="#5a4129" stroke="#222" stroke-width="1.5"/>

