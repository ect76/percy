  <rect x="582" y="404" width="72" height="116" fill="#f1ebd5" stroke="#222" stroke-width="2.5"/>
  <rect x="582" y="404" width="72" height="20" fill="#3f7a3a" stroke="#222" stroke-width="2"/>
  <path d="M600 470 Q612 450 624 470 Q636 490 644 460" fill="none" stroke="#2e5e2a" stroke-width="3"/>
  <ellipse cx="610" cy="480" rx="6" ry="3.5" fill="#7b3f2a"/>
