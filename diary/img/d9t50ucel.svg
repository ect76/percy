  <rect x="0" y="420" width="800" height="200" fill="url(#fog)"/>
  <rect x="0" y="560" width="800" height="240" fill="#e4e0d4"/>
  <path d="M0 600 Q200 580 400 600 T800 600" fill="none" stroke="#f4f1ea" stroke-width="18" opacity="0.8"/>
  <path d="M0 650 Q200 630 400 650 T800 650" fill="none" stroke="#f4f1ea" stroke-width="14" opacity="0.7"/>

