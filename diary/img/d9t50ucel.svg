<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ea" stop-opacity="0"/>
      <stop offset="1" stop-color="#f4f1ea" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- paper and wall -->
  <rect width="800" height="800" fill="#ece6d6"/>
  <rect x="0" y="0" width="800" height="520" fill="#c9cfc6"/>

  <!-- window with village in fog -->
  <rect x="560" y="80" width="190" height="190" fill="#dfe4dc" stroke="#222" stroke-width="3"/>
  <path d="M570 250 L570 200 L590 200 L590 185 L610 185 L610 205 L630 205 L630 175 L650 160 L670 175 L670 205 L690 205 L690 190 L715 190 L715 250 Z" fill="#9aa59b" stroke="#222" stroke-width="1.5"/>
  <rect x="560" y="200" width="190" height="70" fill="#f4f1ea" opacity="0.6"/>
  <line x1="655" y1="80" x2="655" y2="270" stroke="#222" stroke-width="3"/>
  <line x1="560" y1="175" x2="750" y2="175" stroke="#222" stroke-width="3"/>

  <!-- tin lid and body -->
  <rect x="252" y="340" width="236" height="28" rx="4" fill="#6d7d70" stroke="#222" stroke-width="2.5"/>
  <rect x="260" y="366" width="220" height="154" rx="6" fill="#8a9a8c" stroke="#222" stroke-width="2.5"/>
