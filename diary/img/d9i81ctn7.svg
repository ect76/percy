<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3eee2"/>

  <!-- back wall -->
  <rect x="90" y="90" width="620" height="530" fill="#e6d9c1" stroke="#2a2320" stroke-width="3"/>

  <!-- ceiling stain -->
  <path d="M330 90 L470 90 L462 118 Q440 132 420 124 Q400 138 380 126 Q352 132 336 116 Z" fill="#b9a688" stroke="#2a2320" stroke-width="2"/>

  <!-- empty shelves with brackets -->
  <g stroke="#2a2320" stroke-width="3" fill="none">
    <path d="M130 250 L670 250"/>
    <path d="M130 250 L130 262 M670 250 L670 262"/>
    <path d="M130 250 L142 268 L118 268 Z" fill="#8a6a48"/>
    <path d="M670 250 L682 268 L658 268 Z" fill="#8a6a48"/>
    <path d="M130 370 L670 370"/>
    <path d="M130 370 L142 388 L118 388 Z" fill="#8a6a48"/>
    <path d="M670 370 L682 388 L658 388 Z" fill="#8a6a48"/>
    <path d="M130 490 L670 490"/>
    <path d="M130 490 L142 508 L118 508 Z" fill="#8a6a48"/>
    <path d="M670 490 L682 508 L658 508 Z" fill="#8a6a48"/>
  </g>
  <g fill="#c9b595">
    <rect x="130" y="250" width="540" height="6"/>
    <rect x="130" y="370" width="540" height="6"/>
    <rect x="130" y="490" width="540" height="6"/>
  </g>

  <!-- drip falling from stain -->
  <path d="M400 128 L400 150" stroke="#5d7a86" stroke-width="4" stroke-linecap="round"/>
  <path d="M400 186 L400 200" stroke="#5d7a86" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M400 250 L400 272" stroke="#5d7a86" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M400 330 L400 352" stroke="#5d7a86" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M400 420 L400 442" stroke="#5d7a86" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M400 480 L400 500" stroke="#5d7a86" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M400 498 Q406 508 400 514 Q394 508 400 498 Z" fill="#7d9aa5" stroke="#2a2320" stroke-width="1.5"/>

  <!-- counter top (bare) -->
  <path d="M80 520 L720 520 L720 548 L80 548 Z" fill="#d9bf92" stroke="#2a2320" stroke-width="3"/>
  <!-- puddle under drip on counter -->
  <ellipse cx="400" cy="534" rx="34" ry="7" fill="#9fb8c0" stroke="#2a2320" stroke-width="2"/>

  <!-- counter front -->
  <rect x="90" y="548" width="620" height="112" fill="#b8925f" stroke="#2a2320" stroke-width="3"/>
  <g stroke="#2a2320" stroke-width="2" fill="none" opacity="0.6">
    <path d="M180 560 L180 648"/>
    <path d="M320 560 L320 648"/>
    <path d="M480 560 L480 648"/>
    <path d="M620 560 L620 648"/>
  </g>

  <!-- door frame -->
  <path d="M30 30 L770 30 L770 800 L730 800 L730 60 L70 60 L70 800 L30 800 Z" fill="#6b4c33" stroke="#2a2320" stroke-width="3"/>

  <!-- cobbled floor -->
  <g fill="#bfb6a6" stroke="#2a2320" stroke-width="2">
    <ellipse cx="200" cy="700" rx="46" ry="18"/>
    <ellipse cx="330" cy="716" rx="52" ry="18"/>
    <ellipse cx="470" cy="700" rx="48" ry="18"/>
    <ellipse cx="600" cy="718" rx="50" ry="18"/>
    <ellipse cx="260" cy="762" rx="60" ry="20"/>
    <ellipse cx="420" cy="772" rx="58" ry="20"/>
    <ellipse cx="580" cy="760" rx="56" ry="18"/>
  </g>

  <!-- fog bands -->
  <g fill="#f3eee2" opacity="0.55">
    <rect x="30" y="640" width="740" height="36"/>
    <rect x="30" y="735" width="740" height="30"/>
  </g>
  <g fill="#f3eee2" opacity="0.35">
    <ellipse cx="150" cy="690" rx="120" ry="16"/>
    <ellipse cx="640" cy="705" rx="130" ry="18"/>
  </g>

  <!-- signature -->
  <text x="752" y="784" font-family="serif" font-size="22" fill="#2a2320" text-anchor="end">P.</text>
</svg>