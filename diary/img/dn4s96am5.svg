<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe9dd"/>
  <!-- sky -->
  <rect x="0" y="0" width="800" height="330" fill="#c8d2d5"/>
  <!-- distant rooftops in fog -->
  <g fill="#aeb9bd" stroke="#2b2f31" stroke-width="1.5">
    <path d="M300 300 L300 262 L330 240 L360 262 L360 300 Z"/>
    <path d="M440 300 L440 270 L470 252 L500 270 L500 300 Z"/>
    <path d="M700 300 L700 268 L730 248 L760 268 L760 300 Z"/>
  </g>
  <!-- snow on distant roofs -->
  <g fill="#f7f9f9" stroke="#2b2f31" stroke-width="1">
    <path d="M296 262 L330 236 L364 262 L356 262 L330 244 L304 262 Z"/>
    <path d="M436 270 L470 248 L504 270 L496 270 L470 256 L444 270 Z"/>
  </g>

  <!-- bell tower at end of lane -->
  <g stroke="#2b2f31" stroke-width="2.5" stroke-linejoin="round">
    <path d="M400 118 L436 200 L364 200 Z" fill="#7d8a90"/>
    <path d="M400 118 L400 200 L364 200 Z" fill="#6a767c"/>
    <path d="M400 118 L392 112 L400 104 L408 112 Z" fill="#f7f9f9"/>
    <rect x="364" y="200" width="72" height="50" fill="#b9b1a5"/>
    <rect x="376" y="212" width="20" height="26" fill="#2d3134"/>
    <rect x="404" y="212" width="20" height="26" fill="#2d3134"/>
    <path d="M364 200 L400 190 L436 200 Z" fill="#f7f9f9"/>
    <rect x="376" y="250" width="48" height="180" fill="#c2b9ab"/>
    <rect x="390" y="290" width="20" height="30" fill="#3a3f42"/>
    <path d="M376 250 L400 240 L424 250 Z" fill="#f7f9f9"/>
  </g>

  <!-- fog band over distance -->
  <ellipse cx="400" cy="360" rx="420" ry="34" fill="#f2f4f3" opacity="0.7"/>
  <ellipse cx="420" cy="430" rx="360" ry="22" fill="#f2f4f3" opacity="0.6"/>

  <!-- ground -->
  <rect x="0" y="425" width="800" height="375" fill="#cfd6d6"/>

  <!-- lane -->
  <path d="M170 800 L380 430 L420 430 L650 800 Z" fill="#8e8579" stroke="#2b2f31" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cobble lines -->
  <g fill="none" stroke="#5c554d" stroke-width="1.6" opacity="0.8">
    <path d="M250 800 Q260 760 270 720 Q300 640 320 580 Q340 520 360 470"/>
    <path d="M420 800 Q420 760 430 730 Q470 640 490 580"/>
    <path d="M190 700 L320 700"/><path d="M215 620 L340 620"/><path d="M270 550 L360 550"/>
    <path d="M160 770 L290 770"/><path d="M500 720 L620 720"/><path d="M470 650 L560 650"/>
    <path d="M300 500 L375 500"/>
  </g>
  <!-- snow on lane -->
  <g fill="#f7f9f9" opacity="0.9">
    <path d="M330 470 Q360 462 380 470 L372 476 Q350 474 330 470 Z"/>
    <path d="M250 640 Q300 620 340 636 Q300 650 250 640 Z"/>
    <path d="M430 700 Q500 680 560 700 Q500 712 430 700 Z"/>
    <path d="M190 780 Q250 760 300 778 Q250 792 190 780 Z"/>
  </g>

  <!-- cottage on left (Pond Lane cottage) -->
  <path d="M0 250 L250 380 L250 700 L0 800 Z" fill="#d9c8ac" stroke="#2b2f31" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M0 210 L250 340 L268 330 L18 200 Z" fill="#6f5a4c" stroke="#2b2f31" stroke-width="2" stroke-linejoin="round"/>
  <path d="M0 210 L250 340 L252 348 L0 220 Z" fill="#f7f9f9" stroke="#2b2f31" stroke-width="1.5"/>
  <!-- cottage window -->
  <path d="M60 400 L150 440 L150 520 L60 485 Z" fill="#3c4a4f" stroke="#2b2f31" stroke-width="2"/>
  <path d="M60 400 L150 440 L150 452 L60 412 Z" fill="#f7f9f9" stroke="#2b2f31" stroke-width="1.5"/>
  <path d="M105 420 L105 506" stroke="#2b2f31" stroke-width="2"/>
  <!-- cottage door -->
  <path d="M170 540 L220 562 L220 700 L170 680 Z" fill="#7a5a44" stroke="#2b2f31" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="208" cy="622" r="3" fill="#e2c46a"/>
  <!-- snow on cottage step -->
  <path d="M160 690 L230 720 L232 728 L160 698 Z" fill="#f7f9f9" stroke="#2b2f31" stroke-width="1.2"/>

  <!-- lamp post -->
  <g stroke="#2b2f31" stroke-width="3" fill="none">
    <path d="M300 560 L300 430"/>
    <path d="M300 430 L312 428"/>
  </g>
  <path d="M308 428 L318 436 L308 440 L302 434 Z" fill="#f2d98a" stroke="#2b2f31" stroke-width="1.5"/>

  <!-- bakery across north-east -->
  <g stroke="#2b2f31" stroke-width="2" stroke-linejoin="round">
    <rect x="560" y="330" width="120" height="100" fill="#e6d4b2"/>
    <path d="M550 352 L690 340 L694 372 L554 384 Z" fill="#c9413a"/>
    <path d="M586 348 L596 347 L600 379 L590 380 Z" fill="#f7f4ea" stroke="none"/>
    <path d="M622 344 L632 343 L636 375 L626 376 Z" fill="#f7f4ea" stroke="none"/>
    <path d="M658 341 L668 340 L672 372 L662 373 Z" fill="#f7f4ea" stroke="none"/>
    <rect x="580" y="400" width="80" height="30" fill="#7b6049"/>
    <rect x="590" y="408" width="60" height="6" fill="#e6c98b"/>
  </g>
  <path d="M560 330 L650 320 L680 330 L570 340 Z" fill="#f7f9f9" stroke="#2b2f31" stroke-width="1.5"/>

  <!-- fog bands near -->
  <ellipse cx="500" cy="500" rx="380" ry="40" fill="#eef1f0" opacity="0.55"/>
  <ellipse cx="300" cy="600" rx="300" ry="30" fill="#eef1f0" opacity="0.35"/>

  <!-- rain -->
  <g stroke="#4f5f67" stroke-width="1.2" opacity="0.45" stroke-linecap="round">
    <path d="M90 90 L80 120"/><path d="M160 60 L150 90"/><path d="M240 120 L230 150"/>
    <path d="M330 40 L320 70"/><path d="M420 90 L410 120"/><path d="M520 50 L510 80"/>
    <path d="M610 110 L600 140"/><path d="M700 60 L690 90"/><path d="M760 170 L750 200"/>
    <path d="M60 260 L50 290"/><path d="M140 300 L130 330"/><path d="M720 380 L710 410"/>
    <path d="M640 470 L628 502"/><path d="M750 560 L738 592"/><path d="M80 560 L68 590"/>
    <path d="M200 740 L188 772"/><path d="M600 760 L588 792"/><path d="M470 300 L460 330"/>
    <path d="M280 220 L270 250"/><path d="M540 220 L530 250"/><path d="M180 180 L170 210"/>
  </g>

  <!-- Percy's mark: "P." -->
  <g fill="none" stroke="#2b2f31" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M744 748 L744 772 M744 748 L756 748 Q764 748 764 756 Q764 764 756 764 L744 764"/>
    <circle cx="772" cy="772" r="2.5" fill="#2b2f31"/>
  </g>
</svg>