<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#f3eee2"/>
  <!-- distant fog bands -->
  <rect x="0" y="150" width="800" height="70" fill="#d9d9d4" opacity="0.6"/>
  <rect x="0" y="260" width="800" height="50" fill="#e4e3dd" opacity="0.7"/>
  <!-- distant bell tower -->
  <rect x="600" y="170" width="60" height="150" fill="#c9c4b8" stroke="#2a2a2a" stroke-width="3"/>
  <polygon points="592,170 630,110 668,170" fill="#8c8478" stroke="#2a2a2a" stroke-width="3"/>
  <rect x="617" y="200" width="26" height="22" fill="#5b5448" stroke="#2a2a2a" stroke-width="2"/>
  <!-- green -->
  <rect x="0" y="380" width="800" height="420" fill="#a9bf8e"/>
  <path d="M0 380 Q400 360 800 380" fill="none" stroke="#2a2a2a" stroke-width="3"/>
  <!-- right tree -->
  <rect x="690" y="330" width="16" height="130" fill="#6b4e33" stroke="#2a2a2a" stroke-width="3"/>
  <circle cx="698" cy="300" r="62" fill="#6f9a5c" stroke="#2a2a2a" stroke-width="3"/>
  <circle cx="660" cy="320" r="40" fill="#6f9a5c" stroke="#2a2a2a" stroke-width="3"/>
  <!-- cobbles -->
  <g fill="#cfc6b3" stroke="#2a2a2a" stroke-width="2.5">
    <ellipse cx="90" cy="700" rx="30" ry="14"/>
    <ellipse cx="150" cy="720" rx="30" ry="14"/>
    <ellipse cx="210" cy="698" rx="30" ry="14"/>
    <ellipse cx="260" cy="745" rx="30" ry="14"/>
    <ellipse cx="60" cy="760" rx="30" ry="14"/>
    <ellipse cx="330" cy="772" rx="30" ry="14"/>
    <ellipse cx="520" cy="740" rx="30" ry="14"/>
    <ellipse cx="600" cy="712" rx="30" ry="14"/>
    <ellipse cx="680" cy="760" rx="30" ry="14"/>
    <ellipse cx="740" cy="700" rx="30" ry="14"/>
    <ellipse cx="450" cy="785" rx="30" ry="14"/>
    <ellipse cx="400" cy="700" rx="30" ry="14"/>
  </g>
  <!-- pond -->
  <ellipse cx="400" cy="540" rx="235" ry="115" fill="#7d9ea9" stroke="#2a2a2a" stroke-width="4"/>
  <ellipse cx="400" cy="540" rx="200" ry="90" fill="none" stroke="#5b7f8a" stroke-width="2"/>
  <!-- ripples where he dived -->
  <g fill="none" stroke="#f3eee2" stroke-width="3">
    <ellipse cx="440" cy="520" rx="22" ry="8"/>
    <ellipse cx="440" cy="520" rx="46" ry="16"/>
    <ellipse cx="440" cy="520" rx="74" ry="26"/>
    <ellipse cx="440" cy="520" rx="104" ry="36"/>
  </g>
  <!-- fish -->
  <path d="M330 575 Q350 562 372 575 Q350 588 330 575 Z" fill="#d98b4a" stroke="#2a2a2a" stroke-width="2"/>
  <polygon points="372,575 382,566 382,584" fill="#d98b4a" stroke="#2a2a2a" stroke-width="2"/>
  <!-- splash droplets -->
  <g fill="#f3eee2" stroke="#2a2a2a" stroke-width="1.5">
    <circle cx="420" cy="492" r="4"/>
    <circle cx="446" cy="484" r="5"/>
    <circle cx="462" cy="496" r="3.5"/>
  </g>
  <!-- welcome sign -->
  <rect x="166" y="330" width="10" height="190" fill="#6b4e33" stroke="#2a2a2a" stroke-width="3"/>
  <rect x="90" y="250" width="240" height="90" rx="6" fill="#e8d7a8" stroke="#2a2a2a" stroke-width="4"/>
  <text x="210" y="290" font-family="serif" font-size="22" text-anchor="middle" fill="#2a2a2a">Welcome to</text>
  <text x="210" y="322" font-family="serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2a2a2a">Mossbrook</text>
  <!-- rain -->
  <g stroke="#5a6470" stroke-width="1.5" opacity="0.6">
    <line x1="60" y1="40" x2="40" y2="80"/>
    <line x1="150" y1="20" x2="130" y2="60"/>
    <line x1="260" y1="60" x2="240" y2="100"/>
    <line x1="340" y1="30" x2="320" y2="70"/>
    <line x1="470" y1="50" x2="450" y2="90"/>
    <line x1="560" y1="20" x2="540" y2="60"/>
    <line x1="720" y1="40" x2="700" y2="80"/>
    <line x1="30" y1="170" x2="10" y2="210"/>
    <line x1="400" y1="140" x2="380" y2="180"/>
    <line x1="520" y1="210" x2="500" y2="250"/>
    <line x1="760" y1="180" x2="740" y2="220"/>
    <line x1="300" y1="230" x2="280" y2="270"/>
    <line x1="60" y1="420" x2="40" y2="460"/>
    <line x1="250" y1="400" x2="230" y2="440"/>
    <line x1="620" y1="430" x2="600" y2="470"/>
    <line x1="760" y1="450" x2="740" y2="490"/>
    <line x1="120" y1="600" x2="100" y2="640"/>
    <line x1="700" y1="620" x2="680" y2="660"/>
    <line x1="560" y1="660" x2="540" y2="700"/>
    <line x1="200" y1="780" x2="180" y2="790"/>
  </g>
  <!-- signature -->
  <text x="752" y="775" font-family="serif" font-size="26" text-anchor="end" fill="#2a2a2a">P.</text>
</svg>