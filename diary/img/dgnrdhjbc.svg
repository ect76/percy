    <rect x="312" y="422" width="16" height="180" fill="#7a5c3f"/>
    <rect x="542" y="422" width="16" height="180" fill="#7a5c3f"/>
    <rect x="312" y="500" width="246" height="12" fill="#7a5c3f"/>
