  <!-- sardine tins on lowest shelf -->
  <g stroke="#1d1b19" stroke-width="2.5" stroke-linejoin="round">
    <rect x="622" y="482" width="30" height="38" rx="5" fill="#c7d3dc"/>
    <rect x="622" y="496" width="30" height="6" fill="#b5443a"/>
    <rect x="660" y="482" width="30" height="38" rx="5" fill="#c7d3dc"/>
    <rect x="660" y="496" width="30" height="6" fill="#b5443a"/>
    <rect x="698" y="482" width="30" height="38" rx="5" fill="#c7d3dc"/>
    <rect x="698" y="496" width="30" height="6" fill="#b5443a"/>
  </g>
  <!-- signature -->
  <text x="34" y="772" font-size="26" fill="#1d1b19">P.</text>
