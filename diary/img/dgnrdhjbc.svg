  <path d="M352 412 L420 404" stroke="#1d1b19" stroke-width="4" stroke-linecap="round"/>
  <path d="M420 404 L426 402" stroke="#1d1b19" stroke-width="2"/>
  <!-- old computer -->
  <g stroke="#1d1b19" stroke-width="3" stroke-linejoin="round">
    <rect x="420" y="290" width="120" height="96" rx="6" fill="#5b5b5b"/>
    <rect x="432" y="302" width="96" height="70" fill="#9fb3a8"/>
    <rect x="466" y="386" width="28" height="14" fill="#5b5b5b"/>
    <rect x="430" y="398" width="110" height="10" rx="3" fill="#8c8c8c"/>
  </g>
  <!-- cupboard -->
  <g stroke="#1d1b19" stroke-width="3" stroke-linejoin="round">
    <rect x="600" y="250" width="160" height="350" fill="#a57f5a"/>
    <rect x="612" y="262" width="62" height="326" fill="#94704e"/>
    <rect x="686" y="262" width="62" height="326" fill="#94704e"/>
    <line x1="612" y1="340" x2="674" y2="340"/>
    <line x1="612" y1="430" x2="674" y2="430"/>
    <line x1="612" y1="520" x2="674" y2="520"/>
    <line x1="686" y1="340" x2="748" y2="340"/>
    <line x1="686" y1="430" x2="748" y2="430"/>
    <line x1="686" y1="520" x2="748" y2="520"/>
    <circle cx="670" cy="400" r="4" fill="#1d1b19"/>
    <circle cx="690" cy="400" r="4" fill="#1d1b19"/>
