  <g fill="none" stroke="#8f7f69" stroke-width="2">
    <ellipse cx="120" cy="660" rx="40" ry="14"/>
    <ellipse cx="260" cy="720" rx="46" ry="15"/>
    <ellipse cx="470" cy="690" rx="38" ry="12"/>
    <ellipse cx="640" cy="740" rx="50" ry="16"/>
