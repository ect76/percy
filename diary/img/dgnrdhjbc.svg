    <line x1="346" y1="372" x2="438" y2="366" stroke="#6f7a86" stroke-width="1.5"/>
    <line x1="347" y1="384" x2="442" y2="378" stroke="#6f7a86" stroke-width="1.5"/>
    <line x1="348" y1="396" x2="446" y2="390" stroke="#6f7a86" stroke-width="1.5"/>
  </g>
  <!-- pencils -->
  <g stroke="#1d1b19" stroke-width="2.5" stroke-linejoin="round">
    <path d="M472 398 L540 372 L545 380 L477 406 Z" fill="#d1a52e"/>
    <path d="M472 398 L462 402 L477 406 Z" fill="#e8d3a0"/>
    <path d="M478 410 L548 386 L552 393 L483 418 Z" fill="#b5443a"/>
