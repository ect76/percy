  </g>
  <!-- window onto lane -->
  <rect x="70" y="90" width="200" height="200" fill="#cfd8da" stroke="#1d1b19" stroke-width="3"/>
  <path d="M70 250 Q140 215 270 240 L270 290 L70 290 Z" fill="#9c9b92"/>
  <rect x="70" y="150" width="200" height="50" fill="#e4e9ea"/>
  <rect x="70" y="90" width="200" height="200" fill="none" stroke="#1d1b19" stroke-width="3"/>
