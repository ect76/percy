<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#ece6d6"/>

  <!-- sky wash -->
  <rect x="0" y="0" width="800" height="330" fill="#d9dfe0"/>

  <!-- distant bare treeline in fog -->
  <g fill="#b9c2c3" stroke="#3b3a38" stroke-width="1.5">
    <path d="M0 330 Q60 280 120 320 Q180 270 250 318 Q320 282 390 322 Q460 276 530 316 Q600 284 670 320 Q740 290 800 318 L800 360 L0 360 Z"/>
  </g>

  <!-- building: main block -->
  <rect x="470" y="250" width="250" height="230" fill="#c9a98a" stroke="#2b2622" stroke-width="3"/>
  <!-- roof -->
  <polygon points="458,252 732,252 700,200 490,200" fill="#4a3b33" stroke="#2b2622" stroke-width="3"/>
  <!-- chimney -->
  <rect x="640" y="150" width="26" height="50" fill="#6b5548" stroke="#2b2622" stroke-width="2.5"/>
  <!-- brick lines -->
  <g stroke="#9c7b62" stroke-width="1.5" fill="none">
    <path d="M470 290 H720 M470 330 H720 M470 370 H720 M470 410 H720 M470 450 H720 M470 470 H720"/>
  </g>

  <!-- shop window, dim warm light -->
  <rect x="495" y="330" width="70" height="60" fill="#e8c57a" stroke="#2b2622" stroke-width="3"/>
  <path d="M530 330 V390 M495 360 H565" stroke="#2b2622" stroke-width="2"/>

  <!-- dark bakery door -->
  <rect x="590" y="360" width="62" height="120" fill="#2a211d" stroke="#2b2622" stroke-width="3"/>
  <circle cx="644" cy="425" r="3" fill="#c9a050"/>
  <rect x="590" y="352" width="62" height="10" fill="#6b5548"/>

  <!-- hanging sign and bracket -->
  <path d="M478 300 L500 268 M500 268 H530" stroke="#2b2622" stroke-width="3" fill="none"/>
  <rect x="488" y="282" width="158" height="44" fill="#eadcc0" stroke="#2b2622" stroke-width="3"/>
  <text x="567" y="310" font-family="serif" font-size="17" text-anchor="middle" fill="#2b2622">CRUMB'S BAKERY</text>

  <!-- green -->
  <path d="M0 420 Q200 400 400 418 Q600 436 800 412 L800 800 L0 800 Z" fill="#a3b08c"/>
  <path d="M0 420 Q200 400 400 418 Q600 436 800 412" fill="none" stroke="#3b3a38" stroke-width="2"/>

  <!-- cobbled path from door toward pond -->
  <g fill="#b8b1a2" stroke="#4a4540" stroke-width="1.5">
    <ellipse cx="600" cy="500" rx="26" ry="12"/>
    <ellipse cx="580" cy="530" rx="24" ry="11"/>
    <ellipse cx="620" cy="552" rx="27" ry="12"/>
    <ellipse cx="596" cy="580" rx="24" ry="11"/>
    <ellipse cx="640" cy="604" rx="26" ry="11"/>
  </g>

  <!-- bare trees on the green, left -->
  <g stroke="#3f3129" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M110 430 V250"/>
    <path d="M110 330 L70 270 M110 300 L150 250 M110 360 L60 330"/>
    <path d="M190 440 V300"/>
    <path d="M190 360 L230 310 M190 330 L160 290"/>
  </g>

  <!-- pond: soaked, dark water -->
  <ellipse cx="330" cy="610" rx="240" ry="100" fill="#55707a" stroke="#2b2622" stroke-width="3"/>
  <!-- wet bank rim -->
  <ellipse cx="330" cy="610" rx="250" ry="108" fill="none" stroke="#5f6b4c" stroke-width="6" opacity="0.6"/>
  <!-- reflection of bakery front on water -->
  <path d="M470 560 L700 560 L690 610 L480 610 Z" fill="#e8c57a" opacity="0.35"/>
  <path d="M590 560 L652 560 L652 600 L590 600 Z" fill="#2a211d" opacity="0.35"/>
  <!-- ripples -->
  <g stroke="#c8d6d6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M190 600 Q210 594 230 600"/>
    <path d="M270 640 Q300 632 330 640"/>
    <path d="M380 580 Q400 574 420 580"/>
    <path d="M150 630 Q164 626 178 630"/>
    <path d="M440 650 Q470 642 500 650"/>
  </g>
  <!-- reeds, bare stalks at the cold edge -->
  <g stroke="#6d6040" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M90 690 Q96 650 92 620"/>
    <path d="M110 700 Q112 664 120 640"/>
    <path d="M560 700 Q556 668 562 646"/>
  </g>

  <!-- foreground cold edge: frost-grey bank -->
  <path d="M0 720 Q200 700 400 718 Q600 736 800 710 L800 800 L0 800 Z" fill="#8a9590" stroke="#2b2622" stroke-width="2"/>

  <!-- fog bands drifting across -->
  <rect x="0" y="300" width="800" height="70" fill="#f2f2ee" opacity="0.55"/>
  <rect x="0" y="470" width="800" height="50" fill="#f2f2ee" opacity="0.45"/>
  <rect x="0" y="640" width="800" height="40" fill="#f2f2ee" opacity="0.35"/>

  <!-- signature -->
  <text x="762" y="780" font-family="serif" font-size="16" text-anchor="end" fill="#2b2622">P.</text>
</svg>