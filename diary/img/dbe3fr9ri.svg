  <!-- sky wash -->
  <rect x="0" y="0" width="800" height="400" fill="#d9dedd"/>

  <!-- faint cottages in fog -->
  <g opacity="0.45" fill="#b9bdb8" stroke="#2b2622" stroke-width="1.5">
    <rect x="30" y="300" width="90" height="100"/>
    <polygon points="25,300 75,260 125,300"/>
    <rect x="680" y="290" width="95" height="110"/>
    <polygon points="675,290 727,250 780,290"/>
  </g>

  <!-- bell tower -->
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="352,172 400,88 448,172" fill="#6b625a"/>
    <rect x="360" y="170" width="80" height="232" fill="#8a8178"/>
    <rect x="372" y="330" width="56" height="72" fill="#5e564f"/>
    <path d="M372 350 L428 350" fill="none"/>
    <circle cx="400" cy="220" r="28" fill="#f5f1e6"/>
  </g>
