    <rect x="140" y="320" width="120" height="100" rx="6" fill="#6f8c86"/>
    <rect x="152" y="332" width="96" height="76" fill="#4d6b73"/>
    <rect x="186" y="420" width="28" height="24" fill="#6f8c86"/>
