    <ellipse cx="428" cy="392" rx="46" ry="30" fill="#d99a4a"/>
    <path d="M352 380 Q375 368 398 380" fill="none" stroke-width="3"/>
    <path d="M405 380 Q428 368 451 380" fill="none" stroke-width="3"/>
    <path d="M330 420 L400 432 L470 420" fill="none" stroke-width="2"/>
  </g>

  <text x="752" y="784" font-family="serif" font-size="22" fill="#2b2620" text-anchor="end">P.</text>
