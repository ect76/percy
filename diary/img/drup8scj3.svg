    <line x1="545" y1="470" x2="530" y2="330" stroke-width="10" fill="none" stroke="#7a5230"/>
    <path d="M500 300 Q520 262 560 280 Q580 300 560 330 Q530 350 505 330 Z" fill="#c9a06a"/>
  </g>

  <g stroke="#2b2620" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
