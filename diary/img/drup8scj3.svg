    <rect x="622" y="282" width="50" height="10" rx="4" fill="#e9c46a" stroke="none"/>
    <rect x="690" y="282" width="50" height="10" rx="4" fill="#e9c46a" stroke="none"/>
    <rect x="620" y="370" width="40" height="30" rx="6" fill="#3f6c9a"/>
    <rect x="640" y="370" width="0" height="0"/>
    <rect x="622" y="370" width="38" height="8" rx="3" fill="#e9c46a" stroke="none"/>
    <rect x="702" y="370" width="40" height="30" rx="6" fill="#3f6c9a"/>
