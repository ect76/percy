<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cobbles" width="40" height="30" patternUnits="userSpaceOnUse">
      <rect width="40" height="30" fill="#8c8074"/>
      <ellipse cx="10" cy="8" rx="9" ry="6" fill="#a39687" stroke="#2a2420" stroke-width="2"/>
      <ellipse cx="30" cy="8" rx="9" ry="6" fill="#9a8e80" stroke="#2a2420" stroke-width="2"/>
      <ellipse cx="20" cy="22" rx="9" ry="6" fill="#a7998a" stroke="#2a2420" stroke-width="2"/>
    </pattern>
    <g id="fish">
      <ellipse cx="0" cy="0" rx="22" ry="10" fill="#b9c6cb" stroke="#1d1d1d" stroke-width="2.5"/>
      <polygon points="19,0 34,-10 34,10" fill="#8fa1a8" stroke="#1d1d1d" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="-11" cy="-2" r="2.2" fill="#1d1d1d"/>
      <path d="M-4,-6 Q2,0 -4,6" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#f4ecd8"/>

  <!-- back wall -->
  <rect x="40" y="40" width="720" height="560" fill="#e6d6b4" stroke="#1d1d1d" stroke-width="3"/>

  <!-- window onto lane -->
  <rect x="480" y="80" width="230" height="200" fill="#c9d7dc" stroke="#1d1d1d" stroke-width="4"/>
  <rect x="480" y="80" width="230" height="200" fill="none" stroke="#1d1d1d" stroke-width="3"/>
  <!-- cottage across the lane -->
  <rect x="500" y="150" width="60" height="130" fill="#b58f6a" stroke="#1d1d1d" stroke-width="2"/>
  <polygon points="495,150 530,120 565,150" fill="#6e4b3a" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="640" y="170" width="50" height="110" fill="#c4a27c" stroke="#1d1d1d" stroke-width="2"/>
  <polygon points="635,170 665,142 695,170" fill="#7d5a44" stroke="#1d1d1d" stroke-width="2"/>
  <!-- lane -->
  <polygon points="520,280 690,280 710,280 600,280" fill="#8c8074"/>
  <!-- fog bands -->
  <rect x="480" y="120" width="230" height="30" fill="#ffffff" opacity="0.55"/>
  <rect x="480" y="190" width="230" height="40" fill="#ffffff" opacity="0.45"/>
  <rect x="480" y="245" width="230" height="35" fill="#ffffff" opacity="0.6"/>
  <rect x="480" y="80" width="230" height="200" fill="none" stroke="#1d1d1d" stroke-width="4"/>
  <line x1="595" y1="80" x2="595" y2="280" stroke="#1d1d1d" stroke-width="4"/>

  <!-- cupboard -->
  <rect x="60" y="300" width="220" height="260" fill="#a57c52" stroke="#1d1d1d" stroke-width="3.5"/>
  <rect x="85" y="322" width="170" height="216" fill="#5e4129" stroke="#1d1d1d" stroke-width="2.5"/>
  <line x1="85" y1="392" x2="255" y2="392" stroke="#1d1d1d" stroke-width="3"/>
  <line x1="85" y1="462" x2="255" y2="462" stroke="#1d1d1d" stroke-width="3"/>
  <!-- four fish in the cupboard -->
  
  
  
  
  <!-- tins on lower shelf -->
  <rect x="100" y="482" width="40" height="34" rx="4" fill="#c0392b" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="150" y="482" width="40" height="34" rx="4" fill="#d9a441" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="200" y="482" width="40" height="34" rx="4" fill="#4f7fa3" stroke="#1d1d1d" stroke-width="2"/>

  <!-- desk -->
  <rect x="340" y="500" width="390" height="22" fill="#8b6540" stroke="#1d1d1d" stroke-width="3"/>
  <rect x="352" y="522" width="16" height="92" fill="#6e4f30" stroke="#1d1d1d" stroke-width="2.5"/>
  <rect x="700" y="522" width="16" height="92" fill="#6e4f30" stroke="#1d1d1d" stroke-width="2.5"/>

  <!-- paper sheet on desk -->
  <rect x="368" y="470" width="120" height="32" fill="#fffdf6" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="378" y1="480" x2="470" y2="480" stroke="#7a8a9a" stroke-width="1.5"/>
  <line x1="378" y1="490" x2="460" y2="490" stroke="#7a8a9a" stroke-width="1.5"/>

  <!-- pencils -->
  <g stroke="#1d1d1d" stroke-width="2">
    <rect x="505" y="492" width="62" height="7" fill="#e8b84a" transform="rotate(-6 505 492)"/>
    <rect x="507" y="502" width="58" height="7" fill="#d9534f" transform="rotate(-6 507 502)"/>
  </g>

  <!-- freshly caught fish laid out on the desk -->
  <g transform="translate(420,482) scale(1.5)">
    <ellipse cx="0" cy="0" rx="24" ry="12" fill="#7d9a4c" stroke="#1d1d1d" stroke-width="2.5"/>
    <polygon points="20,0 38,-12 38,12" fill="#5d7637" stroke="#1d1d1d" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-12" cy="-3" r="2.4" fill="#1d1d1d"/>
    <path d="M-6,-8 Q0,0 -6,8" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
    <path d="M-2,-12 Q4,-4 -2,4" fill="none" stroke="#c9b25a" stroke-width="2"/>
  </g>

  <!-- old computer -->
  <rect x="545" y="380" width="130" height="100" fill="#3d3d3d" stroke="#1d1d1d" stroke-width="3"/>
  <rect x="555" y="390" width="110" height="75" fill="#9fb8a8" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="596" y="480" width="18" height="20" fill="#555" stroke="#1d1d1d" stroke-width="2"/>
  <rect x="580" y="498" width="50" height="6" fill="#555" stroke="#1d1d1d" stroke-width="2"/>

  <!-- cobbled floor -->
  <rect x="40" y="600" width="720" height="160" fill="url(#cobbles)" stroke="#1d1d1d" stroke-width="3"/>
  <line x1="40" y1="600" x2="760" y2="600" stroke="#1d1d1d" stroke-width="4"/>

  <!-- ink hatching on wall edge -->
  <g stroke="#1d1d1d" stroke-width="1.2" opacity="0.5">
    <line x1="52" y1="60" x2="70" y2="80"/>
    <line x1="52" y1="80" x2="70" y2="100"/>
    <line x1="52" y1="100" x2="70" y2="120"/>
  </g>

  <!-- signature -->
  <text x="752" y="784" font-size="22" fill="#1d1d1d" text-anchor="end">P.</text>
</svg>