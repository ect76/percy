<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebe8e1" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ebe8e1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ebe8e1" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="cobbles" width="40" height="28" patternUnits="userSpaceOnUse">
      <rect width="40" height="28" fill="#b9b1a2"/>
      <ellipse cx="10" cy="8" rx="9" ry="6" fill="#a79e8f" stroke="#2a2620" stroke-width="1"/>
      <ellipse cx="30" cy="8" rx="9" ry="6" fill="#c2baab" stroke="#2a2620" stroke-width="1"/>
      <ellipse cx="0" cy="24" rx="9" ry="6" fill="#c2baab" stroke="#2a2620" stroke-width="1"/>
      <ellipse cx="20" cy="24" rx="9" ry="6" fill="#a79e8f" stroke="#2a2620" stroke-width="1"/>
      <ellipse cx="40" cy="24" rx="9" ry="6" fill="#a79e8f" stroke="#2a2620" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#f4efe2"/>

  <!-- distant sky -->
  <rect x="0" y="0" width="800" height="300" fill="#dcdcd6"/>

  <!-- green -->
  <rect x="0" y="410" width="800" height="120" fill="#8fa873" stroke="#2a2620" stroke-width="2.5"/>
  <path d="M260 420 Q500 404 800 418" fill="none" stroke="#2a2620" stroke-width="1.5"/>

  <!-- bell tower -->
  <rect x="600" y="230" width="60" height="190" fill="#d9cdb5" stroke="#2a2620" stroke-width="2.5"/>
  <rect x="612" y="262" width="36" height="32" fill="#5b5249" stroke="#2a2620" stroke-width="2"/>
  <polygon points="594,232 630,166 666,232" fill="#5c4a3f" stroke="#2a2620" stroke-width="2.5"/>
  <line x1="630" y1="166" x2="630" y2="144" stroke="#2a2620" stroke-width="2"/>

  <!-- tree by the pond -->
  <circle cx="455" cy="372" r="34" fill="#6f8a5a" stroke="#2a2620" stroke-width="2.5"/>
  <rect x="451" y="400" width="8" height="24" fill="#6b4a35" stroke="#2a2620" stroke-width="1.5"/>

  <!-- welcome sign -->
  <rect x="325" y="392" width="8" height="90" fill="#6b4a35" stroke="#2a2620" stroke-width="2"/>
  <rect x="284" y="352" width="100" height="44" fill="#f0e2b0" stroke="#2a2620" stroke-width="2.5"/>
  <line x1="298" y1="368" x2="370" y2="368" stroke="#2a2620" stroke-width="2"/>
  <line x1="298" y1="380" x2="356" y2="380" stroke="#2a2620" stroke-width="2"/>
  <polygon points="356,372 372,380 356,388" fill="#2a2620"/>

  <!-- pond -->
  <ellipse cx="520" cy="472" rx="122" ry="27" fill="#7f9fa6" stroke="#2a2620" stroke-width="2.5"/>
  <path d="M460 470 Q480 462 500 470" fill="none" stroke="#2a2620" stroke-width="1.2"/>
  <path d="M540 478 Q565 470 588 478" fill="none" stroke="#2a2620" stroke-width="1.2"/>

  <!-- cobbled ground -->
  <rect x="0" y="520" width="800" height="280" fill="url(#cobbles)" stroke="#2a2620" stroke-width="2.5"/>

  <!-- cottage -->
  <rect x="20" y="250" width="250" height="290" fill="#e8d9b8" stroke="#2a2620" stroke-width="2.5"/>
  <polygon points="0,252 145,160 290,252" fill="#8a5a44" stroke="#2a2620" stroke-width="2.5"/>
  <rect x="50" y="300" width="60" height="60" fill="#cfd8d6" stroke="#2a2620" stroke-width="2.5"/>
  <line x1="80" y1="300" x2="80" y2="360" stroke="#2a2620" stroke-width="2"/>
  <line x1="50" y1="330" x2="110" y2="330" stroke="#2a2620" stroke-width="2"/>
  <rect x="170" y="330" width="80" height="190" fill="#6b4a35" stroke="#2a2620" stroke-width="2.5"/>
  <circle cx="234" cy="432" r="4" fill="#d9b25a" stroke="#2a2620" stroke-width="1"/>

  <!-- doorstep -->
  <rect x="160" y="520" width="120" height="18" fill="#9c9385" stroke="#2a2620" stroke-width="2.5"/>

  <!-- fog bank over pond, green and tower base -->
  <rect x="0" y="280" width="800" height="240" fill="url(#fogG)"/>
  <path d="M0 300 Q120 280 240 302 T480 298 T800 290 L800 330 L0 330 Z" fill="#ebe8e1" opacity="0.55"/>
  <ellipse cx="420" cy="440" rx="200" ry="22" fill="#f2f0ea" opacity="0.6"/>
  <ellipse cx="640" cy="470" rx="170" ry="18" fill="#f2f0ea" opacity="0.5"/>

  <!-- signature -->
  <path d="M738 738 V768 M738 738 H750 Q760 738 760 748 Q760 758 750 758 H738" fill="none" stroke="#2a2620" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="770" cy="768" r="2.5" fill="#2a2620"/>
</svg>