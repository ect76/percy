<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f4ecd8"/>
  <!-- distant trees and rooftops, dimmed by fog -->
  <g fill="#8c8a80" opacity="0.45" stroke="#3a342c" stroke-width="1.5">
    <path d="M60 330 L90 280 L120 330 Z"/>
    <path d="M110 340 L150 270 L190 340 Z"/>
    <path d="M620 320 L660 262 L700 320 Z"/>
    <path d="M680 330 L720 280 L760 330 Z"/>
  </g>
  <!-- bell tower, faint in the distance -->
  <g opacity="0.55" stroke="#3a342c" stroke-width="2" fill="#b7b1a2">
    <rect x="380" y="230" width="40" height="110"/>
    <path d="M375 230 L400 180 L425 230 Z"/>
    <path d="M388 260 L412 260 M388 285 L412 285" fill="none"/>
  </g>
  <!-- cottages on the left and right -->
  <g opacity="0.6" stroke="#3a342c" stroke-width="2" fill="#c9bfa6">
    <rect x="200" y="300" width="80" height="60"/>
    <path d="M195 300 L240 262 L285 300 Z"/>
    <rect x="530" y="310" width="90" height="55"/>
    <path d="M525 310 L575 270 L625 310 Z"/>
  </g>
  <!-- village green -->
  <ellipse cx="400" cy="560" rx="300" ry="120" fill="#9bb46a" stroke="#3a342c" stroke-width="2.5"/>
  <!-- grass strokes -->
  <g stroke="#5f7440" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M160 540 l6 -8 M168 548 l6 -8 M600 575 l6 -8 M610 582 l6 -8 M260 600 l6 -8 M480 530 l6 -8 M330 530 l6 -8"/>
  </g>
  <!-- pond -->
  <ellipse cx="430" cy="600" rx="130" ry="45" fill="#6f8fa0" stroke="#3a342c" stroke-width="2.5"/>
  <g fill="none" stroke="#dfe8ea" stroke-width="1.5" opacity="0.7">
    <path d="M360 600 q15 -6 30 0 t30 0"/>
    <path d="M440 612 q15 -6 30 0 t30 0"/>
    <path d="M395 585 q12 -5 24 0 t24 0"/>
  </g>
  <!-- welcome sign, faint -->
  <g stroke="#3a342c" stroke-width="2.5">
    <line x1="230" y1="480" x2="230" y2="520"/>
    <line x1="330" y1="470" x2="330" y2="510"/>
  </g>
  <g opacity="0.55">
    <rect x="195" y="425" width="170" height="60" rx="3" fill="#e8dcc0" stroke="#3a342c" stroke-width="2"/>
    <text x="280" y="461" text-anchor="middle" font-family="serif" font-size="16" fill="#4a4438">Welcome to Mossbrook</text>
  </g>
  <!-- fog bands drifting across the scene -->
  <g fill="#efeadf">
    <rect x="0" y="250" width="800" height="70" opacity="0.6"/>
    <rect x="0" y="360" width="800" height="60" opacity="0.7"/>
    <rect x="0" y="470" width="800" height="50" opacity="0.55"/>
    <rect x="0" y="540" width="800" height="45" opacity="0.4"/>
  </g>
  <!-- ink outline of the nearby reeds at the pond edge -->
  <g stroke="#3a342c" stroke-width="1.5" fill="none">
    <path d="M300 640 q-4 -20 2 -36 M308 640 q2 -24 10 -40 M560 640 q4 -18 -2 -32"/>
  </g>
  <!-- heavier fog over the far edges -->
  <rect x="0" y="0" width="800" height="260" fill="#efeadf" opacity="0.65"/>
  <rect x="0" y="640" width="800" height="160" fill="#efeadf" opacity="0.5"/>
  <!-- signature -->
  <text x="752" y="778" text-anchor="end" font-family="serif" font-size="22" fill="#3a342c">P.</text>
</svg>