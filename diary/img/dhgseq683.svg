<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="scales" patternUnits="userSpaceOnUse" width="26" height="18">
      <rect width="26" height="18" fill="#6b9a94"/>
      <path d="M0 18 A13 13 0 0 1 26 18 M-13 9 A13 13 0 0 1 13 9 M13 9 A13 13 0 0 1 39 9" fill="none" stroke="#2b2620" stroke-width="1.4" stroke-opacity="0.7"/>
    </pattern>
    <filter id="smudge" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="fog" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect width="800" height="800" fill="#f4efe3"/>

  <!-- fog bands -->
  <g filter="url(#fog)" fill="#d9d4c8" opacity="0.7">
    <ellipse cx="200" cy="90" rx="260" ry="34"/>
    <ellipse cx="620" cy="140" rx="240" ry="30"/>
    <ellipse cx="400" cy="380" rx="420" ry="26"/>
  </g>

  <!-- grass -->
  <path d="M0 420 Q200 400 400 415 T800 410 L800 800 L0 800 Z" fill="#8fae6a"/>
  <path d="M0 470 Q260 450 480 470 T800 468 L800 800 L0 800 Z" fill="#7a9d5c"/>
  <g stroke="#2b2620" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M60 560 l-6 -14 M66 560 l0 -16 M72 560 l6 -13"/>
    <path d="M700 620 l-6 -14 M706 620 l0 -16 M712 620 l6 -13"/>
    <path d="M110 720 l-6 -14 M116 720 l0 -16 M122 720 l6 -13"/>
  </g>

  <!-- pond with fish-scale edge -->
  <ellipse cx="530" cy="650" rx="240" ry="100" fill="#2b2620" opacity="0.25" transform="translate(6,8)"/>
  <ellipse cx="530" cy="650" rx="235" ry="96" fill="url(#scales)" stroke="#2b2620" stroke-width="3"/>
  <ellipse cx="530" cy="650" rx="200" ry="72" fill="none" stroke="#2b2620" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 6"/>
  <!-- reflections -->
  <path d="M430 655 Q470 645 510 655" fill="none" stroke="#f4efe3" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M580 680 Q615 672 650 682" fill="none" stroke="#f4efe3" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- pond rim pebbles -->
  <g fill="#b9b2a0" stroke="#2b2620" stroke-width="2">
    <ellipse cx="300" cy="700" rx="12" ry="8"/>
    <ellipse cx="318" cy="716" rx="9" ry="6"/>
    <ellipse cx="760" cy="700" rx="10" ry="7"/>
  </g>

  <!-- Welcome sign: post -->
  <rect x="230" y="290" width="20" height="270" fill="#8a6a4a" stroke="#2b2620" stroke-width="3"/>
  <path d="M236 300 v250 M244 300 v250" stroke="#2b2620" stroke-width="1" opacity="0.4"/>

  <!-- chains -->
  <g stroke="#b8923a" stroke-width="4" fill="none">
    <path d="M188 290 L188 340"/>
    <path d="M292 290 L292 340"/>
  </g>
  <g fill="#c9a24a" stroke="#2b2620" stroke-width="1.5">
    <circle cx="188" cy="344" r="5"/>
    <circle cx="292" cy="344" r="5"/>
  </g>

  <!-- pointed roof cap -->
  <polygon points="158,202 240,140 322,202" fill="#5c4632" stroke="#2b2620" stroke-width="3" stroke-linejoin="round"/>

  <!-- board -->
  <rect x="168" y="200" width="144" height="90" rx="12" fill="#f2ead2" stroke="#3e6b3f" stroke-width="9"/>
  <rect x="168" y="200" width="144" height="90" rx="12" fill="none" stroke="#2b2620" stroke-width="2"/>
  <text x="240" y="244" text-anchor="middle" font-family="serif" font-size="17" fill="#2b2620">Welcome to</text>
  <text x="240" y="268" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#2b2620">Mossville</text>

  <!-- mossy patches at base -->
  <g fill="#4f7d3a" stroke="#2b2620" stroke-width="1.5" opacity="0.9">
    <ellipse cx="236" cy="552" rx="30" ry="10"/>
    <ellipse cx="222" cy="544" rx="12" ry="6"/>
    <ellipse cx="256" cy="560" rx="14" ry="6"/>
  </g>
  <rect x="222" y="556" width="36" height="8" fill="#5a4a36" stroke="#2b2620" stroke-width="2"/>

  <!-- wet hand smudges -->
  <g fill="#7b6e5e" filter="url(#smudge)" opacity="0.14">
    <ellipse cx="420" cy="300" rx="90" ry="50"/>
    <ellipse cx="660" cy="500" rx="70" ry="40"/>
    <ellipse cx="120" cy="650" rx="60" ry="35"/>
  </g>

  <!-- signature -->
  <text x="748" y="770" text-anchor="end" font-family="serif" font-size="22" fill="#2b2620">P.</text>
</svg>