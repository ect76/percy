<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6f85"/>
      <stop offset="0.55" stop-color="#b9a98e"/>
      <stop offset="1" stop-color="#d9b77a"/>
    </linearGradient>
    <linearGradient id="fogband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4eee2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f4eee2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3ecdd"/>

  <!-- dusk sky -->
  <rect x="0" y="0" width="800" height="470" fill="url(#sky)"/>

  <!-- distant rooftops in fog -->
  <path d="M0 400 L60 360 L120 392 L180 350 L240 388 L300 372 L340 400 L0 400 Z" fill="#8b8798" opacity="0.6"/>
  <path d="M460 390 L520 352 L580 384 L640 346 L700 380 L760 362 L800 386 L800 410 L460 410 Z" fill="#8b8798" opacity="0.6"/>

  <!-- left cottage -->
  <path d="M30 330 L150 290 L230 330 L230 540 L30 540 Z" fill="#c9a98a" stroke="#2b2420" stroke-width="3" stroke-linejoin="round"/>
  <path d="M20 335 L130 288 L240 335 L226 346 L130 304 L34 346 Z" fill="#6b4a3c" stroke="#2b2420" stroke-width="3" stroke-linejoin="round"/>
  <rect x="88" y="380" width="54" height="52" fill="#f2c96b" stroke="#2b2420" stroke-width="3"/>
  <line x1="115" y1="380" x2="115" y2="432" stroke="#2b2420" stroke-width="2"/>
  <line x1="88" y1="406" x2="142" y2="406" stroke="#2b2420" stroke-width="2"/>
  <rect x="164" y="440" width="44" height="100" fill="#6b4a3c" stroke="#2b2420" stroke-width="3"/>
  <rect x="48" y="450" width="26" height="30" fill="#e9dcc2" stroke="#2b2420" stroke-width="2"/>

  <!-- right cottage silhouette -->
  <path d="M620 380 L700 340 L790 380 L790 540 L620 540 Z" fill="#4e4a5c" stroke="#2b2420" stroke-width="3" stroke-linejoin="round"/>
  <rect x="690" y="420" width="30" height="36" fill="#e9c77a" opacity="0.8"/>

  <!-- lane: cobbles converge to vanishing point -->
  <path d="M-20 800 L370 450 L430 450 L820 800 Z" fill="#8f7c68" stroke="#2b2420" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#5e4f42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300 520 L340 520 M430 520 L470 520"/>
    <path d="M250 580 L300 580 M380 580 L420 580 M480 580 L540 580"/>
    <path d="M190 660 L260 660 M360 660 L430 660 M520 660 L600 660"/>
    <path d="M90 750 L200 750 M300 750 L420 750 M520 750 L650 750 M700 750 L770 750"/>
    <path d="M330 480 L355 480 M440 490 L470 490 M300 620 L330 620 M470 630 L500 630"/>
  </g>

  <!-- bell tower at the end of Pond Lane -->
  <path d="M400 118 L424 178 L376 178 Z" fill="#4a4156" stroke="#2b2420" stroke-width="3" stroke-linejoin="round"/>
  <rect x="372" y="178" width="56" height="88" fill="#6b5a6e" stroke="#2b2420" stroke-width="3"/>
  <rect x="372" y="262" width="56" height="258" fill="#7d6a58" stroke="#2b2420" stroke-width="3"/>
  <!-- bell opening -->
  <path d="M384 190 Q400 178 416 190 L416 204 L384 204 Z" fill="#2b2420"/>
  <!-- clock face -->
  <circle cx="400" cy="232" r="27" fill="#fbf7ee" stroke="#2b2420" stroke-width="3"/>
  <line x1="400" y1="232" x2="400" y2="214" stroke="#1b1714" stroke-width="3" stroke-linecap="round"/>
  <line x1="400" y1="232" x2="415" y2="238" stroke="#1b1714" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="400" cy="232" r="2.5" fill="#1b1714"/>
  <!-- clock case plaque -->
  <rect x="380" y="275" width="40" height="8" fill="#e9dcc2" stroke="#2b2420" stroke-width="1"/>
  <text x="400" y="282" font-size="5" text-anchor="middle" fill="#2b2420">HATTERSLEY CLOCKS - MOSSBROOK</text>
  <!-- glass door with brass pendulum -->
  <rect x="386" y="462" width="28" height="48" fill="#3a2a22" stroke="#2b2420" stroke-width="2"/>
  <rect x="389" y="465" width="22" height="42" fill="#b9c4c6" opacity="0.35"/>
  <line x1="400" y1="462" x2="400" y2="478" stroke="#c9a14a" stroke-width="1.5"/>
  <circle cx="400" cy="486" r="6" fill="#d4a94a" stroke="#2b2420" stroke-width="1.5"/>
  <!-- tower base -->
  <rect x="366" y="512" width="68" height="14" fill="#5e4f42" stroke="#2b2420" stroke-width="3"/>

  <!-- fog bands -->
  <rect x="0" y="380" width="800" height="110" fill="url(#fogband)"/>
  <rect x="0" y="470" width="800" height="120" fill="url(#fogband)" opacity="0.9"/>
  <rect x="0" y="600" width="800" height="200" fill="url(#fogband)" opacity="0.5"/>

  <!-- lamp glow and last light -->
  <circle cx="400" cy="232" r="70" fill="#f6e7b4" opacity="0.12"/>

  <!-- signature -->
  <text x="752" y="772" font-size="22" fill="#2b2420">P.</text>
</svg>