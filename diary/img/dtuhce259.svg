<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="cobbles" width="34" height="22" patternUnits="userSpaceOnUse">
      <ellipse cx="9" cy="6" rx="8" ry="5" fill="#a89a84" stroke="#4a4236" stroke-width="1.2"/>
      <ellipse cx="26" cy="5" rx="7" ry="4.5" fill="#b8aa93" stroke="#4a4236" stroke-width="1.2"/>
      <ellipse cx="17" cy="17" rx="8" ry="4.5" fill="#9c8f79" stroke="#4a4236" stroke-width="1.2"/>
      <ellipse cx="34" cy="17" rx="6" ry="4" fill="#a89a84" stroke="#4a4236" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="330" fill="#d6dce0"/>

  <!-- distant village silhouettes in fog -->
  <path d="M0,350 L60,330 L90,340 L130,310 L150,325 L210,300 L240,320 L300,335 L330,345 L0,360 Z" fill="#b7c0c6" stroke="#55606a" stroke-width="1.5"/>
  <path d="M560,345 L600,320 L640,330 L660,300 L690,315 L720,305 L800,340 L800,360 L560,360 Z" fill="#b7c0c6" stroke="#55606a" stroke-width="1.5"/>

  <!-- fog bank behind cottage -->
  <rect x="0" y="360" width="800" height="50" fill="#eef1f2" opacity="0.7"/>

  <!-- tree on left, leaves swept by wind -->
  <path d="M120,520 C118,460 112,420 100,380 L108,378 C120,420 128,470 132,520 Z" fill="#6b5640" stroke="#2f2620" stroke-width="2"/>
  <path d="M60,420 C90,380 130,370 190,380 C170,395 140,400 120,420 C100,430 80,430 60,420 Z" fill="#7d8c6a" stroke="#2f2620" stroke-width="2"/>
  <path d="M40,460 C80,430 120,425 160,440 C130,450 100,458 70,470 Z" fill="#6c7d5b" stroke="#2f2620" stroke-width="2"/>
  <path d="M170,400 l18,-6 l-6,10 Z M190,392 l14,-2 l-8,8 Z" fill="#7d8c6a" stroke="#2f2620" stroke-width="1.5"/>

  <!-- cottage roof -->
  <path d="M322,246 L525,118 L728,246 Z" fill="#5d6670" stroke="#22262b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M340,226 L525,130 L712,226" fill="none" stroke="#3d444c" stroke-width="2"/>
  <path d="M400,200 l20,-40 M460,172 l16,-30 M600,200 l-20,-40" stroke="#3d444c" stroke-width="2"/>

  <!-- cottage front -->
  <rect x="330" y="246" width="390" height="434" fill="#f4efe4" stroke="#22262b" stroke-width="3"/>

  <!-- timber framing -->
  <g stroke="#5a3d2b" stroke-width="10" fill="none" stroke-linecap="square">
    <line x1="330" y1="246" x2="330" y2="680"/>
    <line x1="720" y1="246" x2="720" y2="680"/>
    <line x1="525" y1="246" x2="525" y2="330"/>
    <line x1="330" y1="330" x2="720" y2="330"/>
    <line x1="330" y1="470" x2="720" y2="470"/>
    <line x1="330" y1="600" x2="720" y2="600"/>
  </g>
  <g stroke="#5a3d2b" stroke-width="5" fill="none">
    <path d="M330,330 L370,400 L330,470"/>
    <path d="M720,330 L680,400 L720,470"/>
    <path d="M345,600 L400,470"/>
    <path d="M705,600 L650,470"/>
    <path d="M400,330 L440,330"/>
    <path d="M610,330 L650,330"/>
  </g>

  <!-- windows -->
  <rect x="362" y="356" width="120" height="96" fill="#8fa6a8" stroke="#2c2620" stroke-width="4"/>
  <line x1="422" y1="356" x2="422" y2="452" stroke="#2c2620" stroke-width="4"/>
  <line x1="362" y1="404" x2="482" y2="404" stroke="#2c2620" stroke-width="4"/>
  <path d="M370,366 L392,366 L370,388 Z" fill="#c9d8d9" opacity="0.8"/>
  <rect x="568" y="356" width="120" height="96" fill="#8fa6a8" stroke="#2c2620" stroke-width="4"/>
  <line x1="628" y1="356" x2="628" y2="452" stroke="#2c2620" stroke-width="4"/>
  <line x1="568" y1="404" x2="688" y2="404" stroke="#2c2620" stroke-width="4"/>
  <path d="M576,366 L598,366 L576,388 Z" fill="#c9d8d9" opacity="0.8"/>

  <!-- door -->
  <rect x="480" y="500" width="90" height="180" fill="#6b4a33" stroke="#2c2620" stroke-width="4"/>
  <rect x="492" y="516" width="66" height="60" fill="none" stroke="#2c2620" stroke-width="2"/>
  <rect x="492" y="588" width="66" height="78" fill="none" stroke="#2c2620" stroke-width="2"/>
  <circle cx="556" cy="605" r="4" fill="#c2a34f" stroke="#2c2620" stroke-width="1.5"/>

  <!-- brass bell on bracket, painted over -->
  <line x1="440" y1="440" x2="440" y2="470" stroke="#2c2620" stroke-width="4"/>
  <path d="M410,470 L470,470 L470,476 L410,476 Z" fill="#5a3d2b" stroke="#2c2620" stroke-width="2"/>
  <path d="M422,476 C422,462 430,454 440,454 C450,454 458,462 458,476 L464,488 L416,488 Z" fill="#9c8a4e" stroke="#2c2620" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M424,470 C428,464 434,460 440,460 M444,462 L452,474" stroke="#6f6a58" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M418,482 Q440,478 462,482" stroke="#6f6a58" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="440" cy="492" r="3" fill="#6f6a58" stroke="#2c2620" stroke-width="1.5"/>
  <line x1="440" y1="495" x2="440" y2="520" stroke="#2c2620" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- doorstep -->
  <rect x="462" y="680" width="126" height="12" fill="#8c8273" stroke="#2c2620" stroke-width="3"/>

  <!-- lane and ground -->
  <path d="M0,800 L800,800 L740,690 L330,690 L300,560 L250,500 L0,520 Z" fill="url(#cobbles)" stroke="#2c2620" stroke-width="3" stroke-linejoin="round"/>
  <path d="M330,690 L300,560 L250,500 L0,520" fill="none" stroke="#2c2620" stroke-width="2"/>
  <rect x="330" y="692" width="410" height="108" fill="#b9ac96" opacity="0.25"/>

  <!-- fog bands over lane -->
  <rect x="0" y="480" width="800" height="36" fill="#eef1f2" opacity="0.6"/>
  <rect x="0" y="540" width="520" height="30" fill="#eef1f2" opacity="0.5"/>
  <rect x="0" y="610" width="800" height="26" fill="#eef1f2" opacity="0.45"/>

  <!-- wind strokes -->
  <g fill="none" stroke="#3d444c" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M20,600 C120,585 200,600 260,640"/>
    <path d="M60,650 C160,632 230,650 300,700"/>
    <path d="M10,710 C90,700 140,716 190,750"/>
    <path d="M770,380 C720,360 690,372 660,350"/>
    <path d="M300,300 C260,290 230,300 200,284"/>
  </g>

  <!-- signature mark: P. -->
  <g fill="none" stroke="#2c2620" stroke-width="2.5" stroke-linecap="round">
    <path d="M750,758 V780 M750,758 H758 A6,6 0 0 1 758,770 H750"/>
  </g>
  <circle cx="765" cy="781" r="2" fill="#2c2620"/>
</svg>