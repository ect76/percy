<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#d9dfdf"/>
  <!-- distant fog banks -->
  <rect x="0" y="120" width="800" height="90" fill="#eef2f1" opacity="0.6"/>
  <rect x="0" y="300" width="800" height="70" fill="#f3f6f5" opacity="0.5"/>
  <rect x="0" y="560" width="800" height="60" fill="#eef2f1" opacity="0.55"/>

  <!-- museum wall -->
  <rect x="60" y="40" width="680" height="640" fill="#e9e4d6" stroke="#2b2a28" stroke-width="2.5"/>

  <!-- thermometer board -->
  <rect x="190" y="80" width="150" height="580" fill="#fbfbf8" stroke="#2b2a28" stroke-width="2.5"/>
  <rect x="218" y="660" width="94" height="18" fill="#8a6a4a" stroke="#2b2a28" stroke-width="2"/>

  <!-- scale ticks and labels -->
  <g stroke="#2b2a28" stroke-width="1.8">
    <line x1="256" y1="600" x2="264" y2="600"/>
    <line x1="256" y1="520" x2="264" y2="520"/>
    <line x1="256" y1="440" x2="264" y2="440"/>
    <line x1="256" y1="360" x2="264" y2="360"/>
    <line x1="256" y1="280" x2="264" y2="280"/>
    <line x1="256" y1="200" x2="264" y2="200"/>
    <line x1="256" y1="120" x2="264" y2="120"/>
  </g>
  <g font-family="serif" font-size="13" fill="#2b2a28" text-anchor="end">
    <text x="252" y="604">-20</text>
    <text x="252" y="524">0</text>
    <text x="252" y="444">20</text>
    <text x="252" y="364">40</text>
    <text x="252" y="284">60</text>
    <text x="252" y="204">80</text>
    <text x="252" y="124">100 F</text>
  </g>

  <!-- glass tube -->
  <rect x="266" y="110" width="28" height="530" rx="14" fill="#eef5f3" stroke="#2b2a28" stroke-width="2.5"/>
  <!-- red liquid column -->
  <rect x="273" y="320" width="14" height="300" fill="#c8322b"/>
  <circle cx="280" cy="622" r="22" fill="#c8322b" stroke="#2b2a28" stroke-width="2.5"/>
  <!-- glass highlight -->
  <line x1="275" y1="130" x2="275" y2="300" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <!-- glass bulb outline -->
  <circle cx="280" cy="622" r="22" fill="none" stroke="#2b2a28" stroke-width="2.5"/>

  <!-- cream paper notice -->
  <g transform="rotate(-2 520 340)">
    <rect x="410" y="190" width="230" height="300" fill="#f3ead0" stroke="#2b2a28" stroke-width="2.5"/>
    <rect x="410" y="330" width="230" height="8" fill="#e2d2a4" opacity="0.8"/>
    <rect x="410" y="190" width="230" height="10" fill="#e8dbb4" opacity="0.7"/>
    <line x1="410" y1="334" x2="640" y2="334" stroke="#8c7d58" stroke-width="1.5"/>
    <g font-family="serif" font-size="15" fill="#1f1e1c">
      <text x="428" y="232" font-weight="bold">WEATHER MUSEUM,</text>
      <text x="428" y="256" font-weight="bold">MOSSBROOK.</text>
      <text x="428" y="292">Please keep to the</text>
      <text x="428" y="312">marked floor.</text>
      <text x="428" y="354">Admission by donation.</text>
      <text x="428" y="394">Open Tuesday to Saturday,</text>
      <text x="428" y="414">10 until 4.</text>
    </g>
  </g>

  <!-- cobbled street -->
  <rect x="0" y="690" width="800" height="110" fill="#b9bcb8"/>
  <g fill="#9ea39f" stroke="#2b2a28" stroke-width="1.5">
    <ellipse cx="60" cy="712" rx="34" ry="12"/>
    <ellipse cx="150" cy="708" rx="30" ry="11"/>
    <ellipse cx="240" cy="716" rx="36" ry="12"/>
    <ellipse cx="335" cy="710" rx="30" ry="11"/>
    <ellipse cx="425" cy="714" rx="34" ry="12"/>
    <ellipse cx="520" cy="708" rx="30" ry="11"/>
    <ellipse cx="610" cy="716" rx="36" ry="12"/>
    <ellipse cx="710" cy="710" rx="30" ry="11"/>
    <ellipse cx="100" cy="752" rx="36" ry="12"/>
    <ellipse cx="205" cy="760" rx="30" ry="11"/>
    <ellipse cx="300" cy="750" rx="36" ry="12"/>
    <ellipse cx="400" cy="762" rx="30" ry="11"/>
    <ellipse cx="495" cy="752" rx="36" ry="12"/>
    <ellipse cx="595" cy="760" rx="30" ry="11"/>
    <ellipse cx="690" cy="750" rx="36" ry="12"/>
    <ellipse cx="50" cy="784" rx="28" ry="10"/>
    <ellipse cx="350" cy="786" rx="28" ry="10"/>
    <ellipse cx="650" cy="786" rx="28" ry="10"/>
  </g>

  <!-- foreground fog -->
  <rect x="0" y="640" width="800" height="50" fill="#f3f6f5" opacity="0.45"/>

  <!-- signature -->
  <text x="752" y="784" font-family="serif" font-size="16" fill="#2b2a28">P.</text>
</svg>