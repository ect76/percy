<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="0" y="0" width="800" height="800" fill="#efe6d2"/>
  <rect x="0" y="0" width="800" height="800" fill="#c9b99c" opacity="0.25"/>
  <!-- wall -->
  <rect x="20" y="20" width="760" height="760" fill="#d8c7a4" stroke="#1d1712" stroke-width="3"/>
  <!-- window onto lane -->
  <rect x="50" y="110" width="130" height="170" fill="#b9c8cc" stroke="#1d1712" stroke-width="5"/>
  <path d="M50 230 L180 210 L180 280 L50 280 Z" fill="#8c8377"/>
  <path d="M50 280 L180 280 L180 280" stroke="#5e5850" stroke-width="2"/>
  <ellipse cx="90" cy="180" rx="60" ry="22" fill="#eef3f2" opacity="0.7"/>
  <ellipse cx="150" cy="150" rx="50" ry="18" fill="#eef3f2" opacity="0.6"/>
  <ellipse cx="110" cy="250" rx="70" ry="14" fill="#eef3f2" opacity="0.5"/>
  <line x1="115" y1="110" x2="115" y2="280" stroke="#1d1712" stroke-width="3"/>
