<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f4efe3"/>
  <!-- fog bands -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="180" cy="150" rx="260" ry="36"/>
    <ellipse cx="640" cy="230" rx="230" ry="30"/>
    <ellipse cx="200" cy="470" rx="240" ry="28"/>
    <ellipse cx="620" cy="520" rx="260" ry="34"/>
  </g>
  <!-- ground and cobbles -->
  <rect x="0" y="700" width="800" height="100" fill="#dcd3c0"/>
  <g fill="#ccc2ad" stroke="#2a2420" stroke-width="2.5">
    <ellipse cx="120" cy="725" rx="34" ry="12"/>
    <ellipse cx="240" cy="722" rx="36" ry="12"/>
    <ellipse cx="360" cy="728" rx="34" ry="11"/>
    <ellipse cx="480" cy="722" rx="36" ry="12"/>
    <ellipse cx="600" cy="726" rx="34" ry="12"/>
    <ellipse cx="700" cy="720" rx="30" ry="11"/>
    <ellipse cx="180" cy="760" rx="38" ry="13"/>
    <ellipse cx="310" cy="768" rx="40" ry="13"/>
    <ellipse cx="440" cy="762" rx="38" ry="13"/>
    <ellipse cx="570" cy="770" rx="40" ry="13"/>
    <ellipse cx="90" cy="782" rx="36" ry="12"/>
  </g>
  <!-- post -->
  <rect x="385" y="318" width="30" height="376" fill="#8a6446" stroke="#2a2420" stroke-width="3"/>
  <g stroke="#2a2420" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M395 340 L395 360"/>
    <path d="M392 420 L392 445"/>
    <path d="M398 520 L398 548"/>
    <path d="M391 600 L391 626"/>
  </g>
  <!-- moss at base -->
  <g fill="#6f9a4f" stroke="#2a2420" stroke-width="2">
    <ellipse cx="372" cy="672" rx="22" ry="12"/>
    <ellipse cx="420" cy="668" rx="18" ry="11"/>
    <ellipse cx="398" cy="688" rx="28" ry="10"/>
    <ellipse cx="354" cy="692" rx="14" ry="8"/>
    <ellipse cx="440" cy="690" rx="14" ry="8"/>
  </g>
  <g fill="#8fb566">
    <circle cx="366" cy="664" r="5"/>
    <circle cx="414" cy="660" r="4"/>
    <circle cx="396" cy="682" r="5"/>
  </g>
  <!-- dangling brass chains -->
  <g fill="none" stroke="#b08d3c" stroke-width="4">
    <path d="M316 322 L316 372"/>
    <path d="M484 322 L484 372"/>
  </g>
  <g fill="none" stroke="#7a5f22" stroke-width="2">
    <ellipse cx="316" cy="330" rx="4" ry="6"/>
    <ellipse cx="316" cy="342" rx="4" ry="6"/>
    <ellipse cx="316" cy="354" rx="4" ry="6"/>
    <ellipse cx="316" cy="366" rx="4" ry="6"/>
    <ellipse cx="484" cy="330" rx="4" ry="6"/>
    <ellipse cx="484" cy="342" rx="4" ry="6"/>
    <ellipse cx="484" cy="354" rx="4" ry="6"/>
    <ellipse cx="484" cy="366" rx="4" ry="6"/>
  </g>
  <!-- board with green rim -->
  <rect x="270" y="200" width="260" height="120" rx="16" fill="#4f7a4a" stroke="#2a2420" stroke-width="3"/>
  <rect x="284" y="214" width="232" height="92" rx="10" fill="#f3ead2" stroke="#2a2420" stroke-width="2"/>
  <text x="400" y="269" font-family="serif" font-size="27" fill="#2f3b2c" text-anchor="middle">Welcome to Mossville</text>
  <!-- roof cap -->
  <polygon points="282,202 400,132 518,202" fill="#5a4a3e" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>
  <line x1="400" y1="132" x2="400" y2="112" stroke="#2a2420" stroke-width="3"/>
  <circle cx="400" cy="110" r="4" fill="#b08d3c" stroke="#2a2420" stroke-width="1.5"/>
  <!-- signature -->
  <text x="768" y="782" font-family="serif" font-size="22" fill="#2a2420" text-anchor="end">P.</text>
</svg>