<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f4ecd8"/>
  <!-- cottage floor: cobbles -->
  <rect x="0" y="590" width="800" height="210" fill="#d9ccb0"/>
  <g fill="#c7b899" stroke="#5a4a36" stroke-width="2.5">
    <ellipse cx="90" cy="630" rx="60" ry="22"/>
    <ellipse cx="230" cy="660" rx="70" ry="24"/>
    <ellipse cx="410" cy="640" rx="64" ry="20"/>
    <ellipse cx="580" cy="665" rx="72" ry="24"/>
    <ellipse cx="720" cy="630" rx="58" ry="21"/>
    <ellipse cx="160" cy="730" rx="80" ry="26"/>
    <ellipse cx="380" cy="750" rx="90" ry="28"/>
    <ellipse cx="640" cy="735" rx="84" ry="26"/>
  </g>
  <!-- fog bands -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="200" cy="90" rx="260" ry="40"/>
    <ellipse cx="620" cy="150" rx="240" ry="36"/>
    <ellipse cx="400" cy="560" rx="380" ry="34"/>
  </g>
  <!-- mouse body, underside up -->
  <!-- tail -->
  <path d="M590 390 C680 380 700 300 668 262" fill="none" stroke="#3b3b3b" stroke-width="10" stroke-linecap="round"/>
  <path d="M590 390 C680 380 700 300 668 262" fill="none" stroke="#8fa0ad" stroke-width="5" stroke-linecap="round"/>
  <!-- legs (rear and front) -->
  <g stroke="#222" stroke-width="4" fill="#8fa0ad" stroke-linecap="round">
    <path d="M320 300 L285 240"/>
    <path d="M330 480 L290 540"/>
    <path d="M500 300 L530 235"/>
    <path d="M490 480 L520 545"/>
  </g>
  <!-- feet -->
  <g stroke="#222" stroke-width="3.5" fill="#6d7d88">
    <rect x="262" y="222" width="46" height="22" rx="8" transform="rotate(-25 285 233)"/>
    <rect x="266" y="530" width="46" height="22" rx="8" transform="rotate(25 289 541)"/>
    <rect x="506" y="222" width="46" height="22" rx="8" transform="rotate(25 529 233)"/>
    <rect x="496" y="534" width="46" height="22" rx="8" transform="rotate(-25 519 545)"/>
  </g>
  <!-- body shell -->
  <ellipse cx="400" cy="390" rx="200" ry="120" fill="#b5c1c9" stroke="#1d1d1d" stroke-width="5"/>
  <!-- belly plate -->
  <ellipse cx="400" cy="390" rx="165" ry="95" fill="#9aa9b4" stroke="#1d1d1d" stroke-width="3"/>
  <g fill="#3a3a3a">
    <circle cx="260" cy="340" r="4"/><circle cx="260" cy="440" r="4"/>
    <circle cx="330" cy="318" r="4"/><circle cx="330" cy="462" r="4"/>
    <circle cx="470" cy="318" r="4"/><circle cx="470" cy="462" r="4"/>
    <circle cx="540" cy="340" r="4"/><circle cx="540" cy="440" r="4"/>
  </g>
  <!-- head -->
  <circle cx="190" cy="390" r="62" fill="#b5c1c9" stroke="#1d1d1d" stroke-width="5"/>
  <ellipse cx="150" cy="330" rx="18" ry="20" fill="#d9a0a0" stroke="#1d1d1d" stroke-width="3"/>
  <ellipse cx="150" cy="450" rx="18" ry="20" fill="#d9a0a0" stroke="#1d1d1d" stroke-width="3"/>
  <circle cx="132" cy="380" r="6" fill="#1d1d1d"/>
  <circle cx="132" cy="400" r="6" fill="#1d1d1d"/>
  <!-- drive gear (ratchet) -->
  <circle cx="330" cy="420" r="32" fill="#b8c2c9" stroke="#4f5b63" stroke-width="10" stroke-dasharray="6 6"/>
  <circle cx="330" cy="420" r="26" fill="#c9a24a" stroke="#1d1d1d" stroke-width="3"/>
  <circle cx="330" cy="420" r="6" fill="#1d1d1d"/>
  <!-- pawl -->
  <path d="M300 395 L282 372 L292 366 L312 386 Z" fill="#7a5a2a" stroke="#1d1d1d" stroke-width="3"/>
  <!-- cam disc -->
  <circle cx="420" cy="380" r="44" fill="#c9a24a" stroke="#1d1d1d" stroke-width="4"/>
  <g fill="#c9a24a" stroke="#1d1d1d" stroke-width="3">
    <rect x="455" y="372" width="12" height="16"/>
    <rect x="410" y="326" width="16" height="12"/>
    <rect x="368" y="372" width="12" height="16"/>
  </g>
  <circle cx="420" cy="380" r="8" fill="#1d1d1d"/>
  <!-- trip lever -->
  <path d="M440 352 L482 300 L492 308 L452 362 Z" fill="#7a8a95" stroke="#1d1d1d" stroke-width="3"/>
  <circle cx="486" cy="304" r="7" fill="#1d1d1d"/>
  <path d="M482 300 L500 286" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round"/>
  <!-- linkage rods to legs -->
  <g fill="none" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round">
    <path d="M420 336 L500 300"/>
    <path d="M420 424 L490 470"/>
    <path d="M362 390 L330 300"/>
  </g>
  <!-- key/winding slot at tail root -->
  <ellipse cx="560" cy="390" rx="14" ry="22" fill="#4f5b63" stroke="#1d1d1d" stroke-width="3"/>
  <!-- note -->
  <text x="500" y="262" font-size="16" fill="#333">trip lever (inferred)</text>
  <path d="M498 268 L486 296" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- signature -->
  <text x="752" y="776" font-size="22" fill="#222">P.</text>
</svg>