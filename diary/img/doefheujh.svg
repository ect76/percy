<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Wall and floor -->
  <rect x="0" y="0" width="800" height="800" fill="#efe6d2"/>
  <rect x="0" y="690" width="800" height="110" fill="#8c6e52" stroke="#2b2620" stroke-width="2.5"/>
  <g stroke="#6e5640" stroke-width="1.5" fill="none">
    <line x1="0" y1="720" x2="800" y2="720"/>
    <line x1="0" y1="752" x2="800" y2="752"/>
    <line x1="0" y1="782" x2="800" y2="782"/>
  </g>

  <!-- Window -->
  <rect x="460" y="80" width="270" height="290" fill="#6b4a33" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="476" y="96" width="238" height="258" fill="#dfe6e2"/>
  <!-- fog hills and lane -->
  <path d="M476 230 Q540 200 600 225 T714 218 L714 290 L476 290 Z" fill="#c3ccc8"/>
  <path d="M520 354 L600 250 L650 250 L690 354 Z" fill="#9aa59f" stroke="#2b2620" stroke-width="1.5"/>
  <g stroke="#6f7a75" stroke-width="1.2" fill="none">
    <line x1="560" y1="300" x2="572" y2="300"/>
    <line x1="600" y1="318" x2="616" y2="318"/>
    <line x1="545" y1="335" x2="565" y2="335"/>
    <line x1="630" y1="290" x2="642" y2="290"/>
  </g>
  <!-- rain streaks -->
  <g stroke="#8fa7b5" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <line x1="492" y1="120" x2="482" y2="148"/>
    <line x1="520" y1="104" x2="510" y2="140"/>
    <line x1="548" y1="130" x2="538" y2="170"/>
    <line x1="500" y1="180" x2="490" y2="212"/>
    <line x1="690" y1="112" x2="680" y2="150"/>
    <line x1="712" y1="170" x2="702" y2="206"/>
    <line x1="684" y1="260" x2="674" y2="292"/>
    <line x1="700" y1="300" x2="690" y2="330"/>
    <line x1="500" y1="290" x2="490" y2="320"/>
    <line x1="622" y1="102" x2="612" y2="138"/>
  </g>
  <!-- window bars -->
  <rect x="586" y="96" width="10" height="258" fill="#6b4a33"/>
  <rect x="476" y="218" width="238" height="10" fill="#6b4a33"/>

  <!-- Taped sign -->
  <g transform="rotate(-4 600 210)">
    <rect x="540" y="150" width="130" height="110" fill="#fbf8ee" stroke="#3b2f25" stroke-width="1"/>
    <rect x="530" y="144" width="28" height="12" fill="#e9d98a" opacity="0.85" transform="rotate(-20 544 150)"/>
    <rect x="652" y="144" width="28" height="12" fill="#e9d98a" opacity="0.85" transform="rotate(15 666 150)"/>
    <rect x="530" y="252" width="28" height="12" fill="#e9d98a" opacity="0.85" transform="rotate(12 544 258)"/>
    <rect x="652" y="252" width="28" height="12" fill="#e9d98a" opacity="0.85" transform="rotate(-14 666 258)"/>
    <g font-family="serif" fill="#2b2620">
      <text x="548" y="172" font-size="13" font-weight="bold">Odd Socks &amp; Co.</text>
      <text x="548" y="190" font-size="10">Mossbrook</text>
      <text x="548" y="204" font-size="10">Open Tues to Sat,</text>
      <text x="548" y="218" font-size="10">9 till 5.</text>
      <text x="548" y="236" font-size="10">No returns on odd pairs.</text>
      <text x="548" y="250" font-size="10">Sorry.</text>
    </g>
  </g>

  <!-- Cupboard -->
  <rect x="60" y="250" width="240" height="350" fill="#9c7a55" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="70" y="260" width="110" height="330" fill="#5b4330" stroke="#2b2620" stroke-width="2"/>
  <g stroke="#2b2620" stroke-width="2">
    <line x1="70" y1="330" x2="180" y2="330"/>
    <line x1="70" y1="410" x2="180" y2="410"/>
    <line x1="70" y1="490" x2="180" y2="490"/>
  </g>
  <!-- sardine tins -->
  <g stroke="#2b2620" stroke-width="2">
    <rect x="86" y="302" width="50" height="28" rx="6" fill="#c9302c"/>
    <rect x="86" y="310" width="50" height="6" fill="#f2d16b"/>
    <rect x="92" y="384" width="44" height="26" rx="6" fill="#c9302c"/>
    <rect x="92" y="392" width="44" height="6" fill="#f2d16b"/>
    <rect x="140" y="384" width="34" height="26" rx="6" fill="#c9302c"/>
    <rect x="140" y="392" width="34" height="6" fill="#f2d16b"/>
    <rect x="110" y="464" width="50" height="26" rx="6" fill="#c9302c"/>
    <rect x="110" y="472" width="50" height="6" fill="#f2d16b"/>
  </g>
  <!-- closed door -->
  <rect x="190" y="260" width="100" height="330" fill="#b08a62" stroke="#2b2620" stroke-width="2"/>
  <circle cx="272" cy="428" r="6" fill="#4a3a2a" stroke="#2b2620" stroke-width="1.5"/>

  <!-- Desk -->
  <rect x="440" y="518" width="14" height="170" fill="#7a4f33" stroke="#2b2620" stroke-width="2"/>
  <rect x="740" y="518" width="14" height="170" fill="#7a4f33" stroke="#2b2620" stroke-width="2"/>
  <rect x="420" y="500" width="350" height="18" fill="#8a5a3b" stroke="#2b2620" stroke-width="2.5"/>

  <!-- Old computer -->
  <rect x="600" y="380" width="120" height="100" rx="6" fill="#d9cfb8" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="612" y="392" width="96" height="72" fill="#9fb3a6" stroke="#2b2620" stroke-width="1.5"/>
  <rect x="645" y="480" width="30" height="20" fill="#c4b89e" stroke="#2b2620" stroke-width="1.5"/>
  <rect x="590" y="498" width="140" height="10" rx="3" fill="#c4b89e" stroke="#2b2620" stroke-width="1.5"/>

  <!-- Paper and pencils -->
  <rect x="436" y="482" width="124" height="18" fill="#fffdf5" stroke="#2b2620" stroke-width="2"/>
  <line x1="446" y1="474" x2="536" y2="466" stroke="#e3b93c" stroke-width="6"/>
  <polygon points="536,466 546,465 536,471" fill="#3b2f25"/>
  <line x1="450" y1="492" x2="520" y2="488" stroke="#4f7fa8" stroke-width="5"/>
  <polygon points="520,488 528,487 520,492" fill="#3b2f25"/>

  <!-- Tin mouse -->
  <g stroke="#2b2620" stroke-width="2.5" stroke-linecap="round">
    <path d="M462 462 Q430 440 418 420" fill="none"/>
    <line x1="484" y1="478" x2="478" y2="500" fill="none"/>
    <line x1="516" y1="478" x2="522" y2="500" fill="none"/>
  </g>
  <ellipse cx="500" cy="458" rx="40" ry="22" fill="#b7c4cc" stroke="#2b2620" stroke-width="2.5"/>
  <rect x="493" y="430" width="14" height="6" fill="#7f8f99" stroke="#2b2620" stroke-width="1.5"/>
  <circle cx="540" cy="450" r="16" fill="#b7c4cc" stroke="#2b2620" stroke-width="2.5"/>
  <circle cx="540" cy="432" r="7" fill="#c9a6a0" stroke="#2b2620" stroke-width="2"/>
  <circle cx="551" cy="433" r="6" fill="#c9a6a0" stroke="#2b2620" stroke-width="2"/>
  <circle cx="554" cy="452" r="3" fill="#2b2620"/>
  <path d="M478 500 L470 500" stroke="#2b2620" stroke-width="3" stroke-linecap="round"/>

  <!-- Signature -->
  <text x="752" y="784" font-family="serif" font-size="22" fill="#2b2620">P.</text>
</svg>