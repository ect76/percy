<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f4ecdc"/>
  <!-- distant village fog -->
  <rect x="0" y="0" width="800" height="260" fill="#e4dccb"/>
  <path d="M0 150 Q120 120 240 150 T480 150 T800 140 L800 260 L0 260 Z" fill="#d6cdb8" opacity="0.8"/>
  <!-- neighbouring roofs in fog -->
  <path d="M40 230 L90 170 L140 230 Z" fill="#b9b0a0" stroke="#2b2118" stroke-width="2"/>
  <path d="M640 220 L700 160 L760 220 Z" fill="#b9b0a0" stroke="#2b2118" stroke-width="2"/>
  <rect x="60" y="230" width="70" height="90" fill="#cfc6b3" stroke="#2b2118" stroke-width="2"/>
  <rect x="660" y="220" width="90" height="100" fill="#cfc6b3" stroke="#2b2118" stroke-width="2"/>
  <!-- bakery facade -->
  <rect x="200" y="200" width="400" height="440" fill="#c9a98a" stroke="#2b2118" stroke-width="4"/>
  <rect x="220" y="170" width="360" height="40" fill="#7a4e33" stroke="#2b2118" stroke-width="3"/>
  <rect x="300" y="182" width="200" height="16" fill="#e8dcc4"/>
  <!-- doorway interior -->
  <rect x="250" y="250" width="300" height="390" fill="#e6d3b3" stroke="#2b2118" stroke-width="4"/>
  <!-- back wall shelves, empty -->
  <rect x="290" y="280" width="220" height="10" fill="#6b4530" stroke="#2b2118" stroke-width="2"/>
  <rect x="290" y="350" width="220" height="10" fill="#6b4530" stroke="#2b2118" stroke-width="2"/>
  <rect x="290" y="420" width="220" height="10" fill="#6b4530" stroke="#2b2118" stroke-width="2"/>
  <rect x="290" y="250" width="8" height="180" fill="#6b4530"/>
  <rect x="502" y="250" width="8" height="180" fill="#6b4530"/>
  <!-- counter -->
  <rect x="270" y="478" width="260" height="22" fill="#a9764f" stroke="#2b2118" stroke-width="3"/>
  <rect x="270" y="500" width="260" height="110" fill="#8a5a3b" stroke="#2b2118" stroke-width="3"/>
  <line x1="320" y1="500" x2="320" y2="610" stroke="#2b2118" stroke-width="2"/>
  <line x1="480" y1="500" x2="480" y2="610" stroke="#2b2118" stroke-width="2"/>
  <!-- the single coin -->
  <circle cx="400" cy="462" r="14" fill="#c9a227" stroke="#2b2118" stroke-width="2"/>
  <circle cx="400" cy="462" r="7" fill="none" stroke="#7a5c12" stroke-width="1.5"/>
  <!-- brass bell -->
  <path d="M385 225 Q400 205 415 225 L420 238 L380 238 Z" fill="#c9a227" stroke="#2b2118" stroke-width="2"/>
  <circle cx="400" cy="242" r="4" fill="#7a5c12"/>
  <!-- baker's peel leaning on wall -->
  <line x1="560" y1="590" x2="610" y2="300" stroke="#5a3b25" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="612" cy="284" rx="26" ry="34" transform="rotate(12 612 284)" fill="#e0c79a" stroke="#2b2118" stroke-width="3"/>
  <rect x="604" y="272" width="12" height="8" fill="#8a6a45" opacity="0.8"/>
  <!-- window glow -->
  <rect x="210" y="330" width="26" height="36" fill="#f5e6b0" stroke="#2b2118" stroke-width="2"/>
  <!-- cobbled foreground -->
  <rect x="0" y="640" width="800" height="160" fill="#b7ab95"/>
  <g fill="#d8cdb6" stroke="#2b2118" stroke-width="2">
    <ellipse cx="90" cy="680" rx="50" ry="18"/>
    <ellipse cx="250" cy="700" rx="60" ry="20"/>
    <ellipse cx="420" cy="676" rx="54" ry="17"/>
    <ellipse cx="600" cy="698" rx="62" ry="20"/>
    <ellipse cx="730" cy="672" rx="48" ry="16"/>
    <ellipse cx="160" cy="750" rx="70" ry="22"/>
    <ellipse cx="360" cy="762" rx="66" ry="22"/>
    <ellipse cx="560" cy="752" rx="72" ry="22"/>
    <ellipse cx="740" cy="770" rx="60" ry="20"/>
  </g>
  <!-- step -->
  <rect x="240" y="640" width="320" height="14" fill="#9a8c74" stroke="#2b2118" stroke-width="3"/>
  <!-- fog veil over the foreground -->
  <rect x="0" y="560" width="800" height="50" fill="#f4ecdc" opacity="0.35"/>
  <!-- signature P. -->
  <g stroke="#2b2118" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M735 752 L735 778 M735 752 L750 752 Q758 752 758 761 Q758 770 750 770 L735 770"/>
  </g>
  <circle cx="765" cy="778" r="2.5" fill="#2b2118"/>
</svg>