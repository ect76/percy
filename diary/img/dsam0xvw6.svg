<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f4efe4"/>
  <!-- foggy sky -->
  <rect x="0" y="0" width="800" height="150" fill="#dfe5e6"/>
  <!-- building wall -->
  <rect x="150" y="130" width="500" height="520" fill="#d9c7a7" stroke="#2b2118" stroke-width="3"/>
  <!-- roof eave -->
  <rect x="136" y="112" width="528" height="26" fill="#7a4a32" stroke="#2b2118" stroke-width="3"/>
  <!-- window glass with warm light -->
  <rect x="200" y="230" width="300" height="330" fill="#f6e3a6" stroke="#2b2118" stroke-width="3"/>
  <!-- counter -->
  <rect x="210" y="395" width="280" height="20" fill="#6b4226" stroke="#2b2118" stroke-width="2"/>
  <rect x="210" y="415" width="280" height="10" fill="#4a2c18"/>
  <!-- back wall shelf lines -->
  <line x1="210" y1="360" x2="490" y2="360" stroke="#b89a68" stroke-width="2"/>

  <!-- pine-framed chalkboard -->
  <rect x="250" y="240" width="92" height="170" fill="#d8b77a" stroke="#2b2118" stroke-width="2"/>
  <rect x="258" y="248" width="76" height="154" fill="#222"/>
  <ellipse cx="282" cy="390" rx="10" ry="3" fill="#777" opacity="0.5"/>
  <ellipse cx="326" cy="258" rx="8" ry="4" fill="#777" opacity="0.5"/>
  <g fill="#f5f5f0" font-size="8" text-anchor="middle">
    <text x="304" y="264">THE LANTERN CAFÉ</text>
    <text x="304" y="276">— MOSSBROOK —</text>
    <text x="264" y="296" text-anchor="start">Flat White 2.80</text>
    <text x="264" y="310" text-anchor="start">Espresso 2.20</text>
    <text x="264" y="324" text-anchor="start">Apple &amp; Cinnamon</text>
    <text x="264" y="336" text-anchor="start">Cake 3.50</text>
    <text x="264" y="352" text-anchor="start">Toast &amp; Butter 1.90</text>
    <text x="264" y="372" text-anchor="start">Today: Leek Soup</text>
  </g>

  <!-- clock, set crooked on a nail -->
  <line x1="470" y1="200" x2="470" y2="256" stroke="#2b2118" stroke-width="2"/>
  <circle cx="470" cy="200" r="3" fill="#2b2118"/>
  <g transform="rotate(-6 470 300)">
    <circle cx="470" cy="300" r="44" fill="#7b4f2a" stroke="#2b2118" stroke-width="3"/>
    <circle cx="470" cy="300" r="34" fill="#ffffff" stroke="#2b2118" stroke-width="1.5"/>
    <line x1="470" y1="300" x2="478" y2="316" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <line x1="470" y1="300" x2="487" y2="281" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="470" cy="300" r="3" fill="#111"/>
  </g>

  <!-- order pad on counter -->
  <rect x="410" y="382" width="54" height="30" fill="#ffffff" stroke="#2b2118" stroke-width="1.5"/>
  <g stroke="#7a7a7a" stroke-width="1">
    <line x1="414" y1="392" x2="460" y2="392"/>
    <line x1="414" y1="400" x2="460" y2="400"/>
    <line x1="414" y1="408" x2="460" y2="408"/>
  </g>

  <!-- tables and chairs in window -->
  <g stroke="#2b2118" stroke-width="2" fill="#a0653a">
    <rect x="225" y="455" width="60" height="10" rx="3"/>
    <rect x="236" y="465" width="6" height="40"/>
    <rect x="270" y="465" width="6" height="40"/>
    <rect x="330" y="455" width="60" height="10" rx="3"/>
    <rect x="341" y="465" width="6" height="40"/>
    <rect x="375" y="465" width="6" height="40"/>
  </g>
  <g stroke="#2b2118" stroke-width="2" fill="#8a5630">
    <rect x="222" y="440" width="8" height="16"/>
    <rect x="290" y="440" width="8" height="16"/>
    <rect x="327" y="440" width="8" height="16"/>
    <rect x="395" y="440" width="8" height="16"/>
  </g>
  <!-- corner table with cup and face-down book -->
  <rect x="418" y="470" width="62" height="10" rx="3" fill="#a0653a" stroke="#2b2118" stroke-width="2"/>
  <rect x="440" y="480" width="6" height="34" fill="#8a5630" stroke="#2b2118" stroke-width="1.5"/>
  <rect x="424" y="446" width="22" height="22" rx="2" fill="#4a6fa5" stroke="#2b2118" stroke-width="2" transform="rotate(-8 435 457)"/>
  <rect x="426" y="448" width="18" height="3" fill="#8fa9c9" transform="rotate(-8 435 457)"/>
  <path d="M452 448 h16 v12 q0 8 -8 8 q-8 0 -8 -8 z" fill="#ffffff" stroke="#2b2118" stroke-width="1.5"/>
  <!-- shoulders of figures-less window: pendant lamp glow -->
  <circle cx="330" cy="300" r="0" fill="#fff"/>

  <!-- window mullions -->
  <g stroke="#2b2118" stroke-width="4">
    <line x1="350" y1="230" x2="350" y2="560"/>
    <line x1="200" y1="530" x2="500" y2="530" stroke-width="3"/>
  </g>
  <rect x="192" y="556" width="316" height="10" fill="#7a4a32" stroke="#2b2118" stroke-width="2"/>

  <!-- door -->
  <rect x="530" y="440" width="80" height="200" fill="#5a3a22" stroke="#2b2118" stroke-width="3"/>
  <rect x="542" y="456" width="56" height="60" fill="#f6e3a6" stroke="#2b2118" stroke-width="2"/>
  <circle cx="598" cy="550" r="3" fill="#d8b77a"/>

  <!-- teapot sign on bracket -->
  <line x1="650" y1="236" x2="716" y2="236" stroke="#2b2118" stroke-width="4"/>
  <line x1="650" y1="236" x2="672" y2="262" stroke="#2b2118" stroke-width="1.5"/>
  <line x1="716" y1="236" x2="728" y2="262" stroke="#2b2118" stroke-width="1.5"/>
  <rect x="664" y="262" width="72" height="72" rx="10" fill="#3c7a7a" stroke="#2b2118" stroke-width="3"/>
  <!-- teapot -->
  <ellipse cx="700" cy="302" rx="22" ry="18" fill="#f4efe4" stroke="#2b2118" stroke-width="2"/>
  <path d="M722 298 q14 -10 16 -22" fill="none" stroke="#f4efe4" stroke-width="5" stroke-linecap="round"/>
  <path d="M678 296 q-14 4 -12 18 q2 8 12 8" fill="none" stroke="#2b2118" stroke-width="2.5"/>
  <path d="M690 286 q10 -12 20 0" fill="none" stroke="#2b2118" stroke-width="2"/>
  <rect x="692" y="278" width="16" height="6" rx="3" fill="#f4efe4" stroke="#2b2118" stroke-width="1.5"/>
  <circle cx="700" cy="276" r="3" fill="#f4efe4" stroke="#2b2118" stroke-width="1.5"/>
  <rect x="682" y="318" width="36" height="5" fill="#2b2118"/>

  <!-- cobbled green -->
  <rect x="0" y="640" width="800" height="160" fill="#8fb07a"/>
  <rect x="0" y="640" width="800" height="10" fill="#6d8f5c"/>
  <g fill="none" stroke="#5f7d4c" stroke-width="2">
    <ellipse cx="90" cy="690" rx="26" ry="10"/>
    <ellipse cx="170" cy="730" rx="30" ry="11"/>
    <ellipse cx="260" cy="700" rx="22" ry="9"/>
    <ellipse cx="350" cy="750" rx="34" ry="12"/>
    <ellipse cx="460" cy="712" rx="28" ry="10"/>
    <ellipse cx="560" cy="770" rx="30" ry="11"/>
    <ellipse cx="660" cy="700" rx="26" ry="10"/>
    <ellipse cx="720" cy="752" rx="32" ry="12"/>
    <ellipse cx="240" cy="780" rx="24" ry="8"/>
  </g>

  <!-- fog bands -->
  <rect x="0" y="180" width="800" height="50" fill="#f4efe4" opacity="0.55"/>
  <rect x="0" y="600" width="800" height="50" fill="#f4efe4" opacity="0.6"/>
  <rect x="0" y="660" width="800" height="36" fill="#f4efe4" opacity="0.35"/>

  <!-- signature -->
  <text x="768" y="782" font-size="18" fill="#2b2118" text-anchor="end">P.</text>
</svg>