<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect width="800" height="800" fill="#f2ede3"/>
  <!-- foggy sky -->
  <rect x="0" y="0" width="800" height="430" fill="#d5dcdf"/>
  <!-- distant bell tower, dimmed -->
  <g fill="#aeb4b8" stroke="#2a2a2a" stroke-width="2" stroke-linejoin="round">
    <polygon points="384,250 400,198 416,250"/>
    <rect x="384" y="250" width="32" height="180"/>
  </g>
  <rect x="392" y="274" width="16" height="22" fill="#6d7478"/>
  <circle cx="400" cy="318" r="7" fill="#e8e6df" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- horizon fog banks -->
  <rect x="0" y="330" width="800" height="70" fill="#f4f4f0" opacity="0.6"/>
  <rect x="0" y="385" width="800" height="45" fill="#f4f4f0" opacity="0.45"/>
  <!-- lane -->
  <polygon points="60,800 760,800 428,425 372,425" fill="#cdc3ae" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cobbles -->
  <g fill="none" stroke="#8c8270" stroke-width="1.6">
    <ellipse cx="400" cy="500" rx="14" ry="5"/>
    <ellipse cx="350" cy="502" rx="12" ry="4.5"/>
    <ellipse cx="450" cy="504" rx="12" ry="4.5"/>
    <ellipse cx="300" cy="600" rx="22" ry="8"/>
    <ellipse cx="400" cy="606" rx="20" ry="7"/>
    <ellipse cx="510" cy="604" rx="20" ry="7"/>
    <ellipse cx="200" cy="710" rx="30" ry="11"/>
    <ellipse cx="330" cy="716" rx="30" ry="11"/>
    <ellipse cx="460" cy="714" rx="30" ry="11"/>
    <ellipse cx="610" cy="712" rx="28" ry="10"/>
    <ellipse cx="120" cy="790" rx="40" ry="14"/>
    <ellipse cx="270" cy="792" rx="40" ry="14"/>
    <ellipse cx="420" cy="794" rx="40" ry="14"/>
    <ellipse cx="580" cy="792" rx="40" ry="14"/>
  </g>
  <!-- left cottage wall -->
  <polygon points="0,170 300,365 300,513 0,792" fill="#e6dccb" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- thatched roof -->
  <polygon points="0,110 300,285 300,365 0,170" fill="#8f7a55" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#5e4e35" stroke-width="1.5" fill="none">
    <line x1="0" y1="130" x2="300" y2="305"/>
    <line x1="0" y1="150" x2="300" y2="325"/>
  </g>
  <!-- window -->
  <polygon points="70,300 140,333 140,405 70,372" fill="#b9cbd0" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="105" y1="316" x2="105" y2="388" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="70" y1="336" x2="140" y2="369" stroke="#2a2a2a" stroke-width="2"/>
  <!-- door -->
  <polygon points="170,360 230,390 230,570 170,600" fill="#7a5a3c" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="220" cy="480" r="3" fill="#d9b25a"/>
  <!-- right stone building -->
  <polygon points="428,300 800,460 800,800 760,800 428,425" fill="#bfb6a6" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#7d7566" stroke-width="1.5" fill="none">
    <line x1="600" y1="380" x2="600" y2="620"/>
    <line x1="680" y1="415" x2="680" y2="700"/>
    <line x1="520" y1="345" x2="520" y2="520"/>
  </g>
  <!-- lamp post -->
  <g stroke="#2a2a2a" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="318" y1="520" x2="318" y2="470"/>
  </g>
  <circle cx="318" cy="464" r="7" fill="#f3e3a0" stroke="#2a2a2a" stroke-width="2"/>
  <!-- low foreground fog -->
  <rect x="0" y="600" width="800" height="200" fill="#f4f4f0" opacity="0.18"/>
  <rect x="0" y="700" width="800" height="100" fill="#f4f4f0" opacity="0.25"/>
  <!-- signature -->
  <text x="770" y="775" font-family="serif" font-size="22" fill="#2a2a2a">P.</text>
</svg>