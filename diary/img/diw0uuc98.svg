<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="ovenGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="60%" stop-color="#ff8a2a"/>
      <stop offset="100%" stop-color="#8a3a1a"/>
    </radialGradient>
    <radialGradient id="roomGlow" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#5a4a52"/>
      <stop offset="100%" stop-color="#262434"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7dee4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b7c2cb" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- back wall -->
  <rect x="0" y="0" width="800" height="800" fill="url(#roomGlow)"/>

  <!-- front window (grimy) -->
  <rect x="50" y="80" width="290" height="360" fill="#2c2f3d" stroke="#1d1a1a" stroke-width="4"/>
  <rect x="62" y="92" width="266" height="336" fill="#8d9aa6"/>
  <!-- outside cobbles -->
  <rect x="62" y="352" width="266" height="76" fill="#6f7a84"/>
  <g fill="none" stroke="#4d565e" stroke-width="2">
    <ellipse cx="90" cy="372" rx="18" ry="8"/>
    <ellipse cx="140" cy="392" rx="20" ry="8"/>
    <ellipse cx="200" cy="370" rx="18" ry="8"/>
    <ellipse cx="250" cy="396" rx="22" ry="8"/>
    <ellipse cx="300" cy="376" rx="16" ry="7"/>
    <ellipse cx="110" cy="414" rx="18" ry="7"/>
    <ellipse cx="220" cy="416" rx="20" ry="7"/>
  </g>
  <!-- fog over window -->
  <rect x="62" y="92" width="266" height="336" fill="url(#fog)"/>
  <g fill="#e9eef2" opacity="0.5">
    <ellipse cx="110" cy="200" rx="60" ry="22"/>
    <ellipse cx="260" cy="260" rx="70" ry="26"/>
    <ellipse cx="150" cy="320" rx="80" ry="18"/>
  </g>
  <!-- grime smudges -->
  <g fill="#4a4f58" opacity="0.35">
    <path d="M70 130 Q100 110 130 140 T180 150 L170 170 Q120 160 80 180 Z"/>
    <path d="M230 110 Q270 130 300 120 L300 170 Q270 160 240 175 Z"/>
    <path d="M70 300 Q110 280 150 300 L140 330 Q100 320 70 335 Z"/>
    <path d="M250 290 Q290 300 310 280 L310 330 Q280 320 255 335 Z"/>
  </g>
  <!-- mullions -->
  <g stroke="#2c2f3d" stroke-width="8">
    <line x1="195" y1="92" x2="195" y2="428"/>
    <line x1="62" y1="260" x2="328" y2="260"/>
  </g>

  <!-- oven -->
  <rect x="430" y="300" width="200" height="220" fill="#5a4a44" stroke="#1d1a1a" stroke-width="4"/>
  <rect x="455" y="330" width="150" height="20" fill="#3a2f2b"/>
  <rect x="460" y="380" width="140" height="110" rx="10" fill="url(#ovenGlow)" stroke="#1d1a1a" stroke-width="4"/>
  <rect x="450" y="496" width="160" height="10" fill="#2e2521"/>
  <line x1="470" y1="500" x2="470" y2="505" stroke="#1d1a1a" stroke-width="3"/>

  <!-- calendar (yellowed, two red rings) -->
  <rect x="660" y="110" width="100" height="140" fill="#e9dcae" stroke="#1d1a1a" stroke-width="3"/>
  <rect x="660" y="110" width="100" height="22" fill="#c9a870"/>
  <g stroke="#9c8a62" stroke-width="1.5">
    <line x1="672" y1="150" x2="748" y2="150"/>
    <line x1="672" y1="170" x2="748" y2="170"/>
    <line x1="672" y1="190" x2="748" y2="190"/>
    <line x1="672" y1="210" x2="748" y2="210"/>
    <line x1="692" y1="140" x2="692" y2="238"/>
    <line x1="714" y1="140" x2="714" y2="238"/>
    <line x1="736" y1="140" x2="736" y2="238"/>
  </g>
  <g fill="none" stroke="#b3262a" stroke-width="2.5">
    <ellipse cx="714" cy="190" rx="14" ry="11"/>
    <ellipse cx="715" cy="191" rx="16" ry="13"/>
  </g>

  <!-- star cutter with dough crumbs -->
  <line x1="625" y1="128" x2="625" y2="160" stroke="#1d1a1a" stroke-width="2"/>
  <path d="M625 160 L632 176 L650 178 L636 189 L641 207 L625 197 L609 207 L614 189 L600 178 L618 176 Z"
        fill="#b8bcc4" stroke="#1d1a1a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M625 168 L628 178 L637 180 L630 186 L632 195 L625 190 L618 195 L620 186 L613 180 L622 178 Z"
        fill="#8d9199"/>
  <g fill="#e8d3a0" stroke="#b89a64" stroke-width="1">
    <circle cx="611" cy="184" r="2.5"/>
    <circle cx="638" cy="196" r="2"/>
    <circle cx="606" cy="199" r="2"/>
    <circle cx="643" cy="181" r="2.5"/>
  </g>

  <!-- pipe and drip -->
  <rect x="460" y="0" width="10" height="455" fill="#6d7680" stroke="#1d1a1a" stroke-width="2"/>
  <path d="M466 462 Q460 474 466 480 Q472 474 466 462 Z" fill="#9fd3e8" stroke="#1d1a1a" stroke-width="1.5"/>
  <circle cx="466" cy="500" r="0" fill="none"/>

  <!-- counter -->
  <rect x="0" y="520" width="800" height="26" fill="#a06a42" stroke="#1d1a1a" stroke-width="3"/>
  <rect x="0" y="546" width="800" height="254" fill="#5e3b28"/>
  <g stroke="#3f2618" stroke-width="3" fill="none">
    <rect x="40" y="580" width="180" height="200" rx="4"/>
    <rect x="310" y="580" width="180" height="200" rx="4"/>
    <rect x="580" y="580" width="180" height="200" rx="4"/>
  </g>

  <!-- till -->
  <rect x="180" y="430" width="120" height="90" fill="#7c8a6a" stroke="#1d1a1a" stroke-width="3"/>
  <rect x="195" y="440" width="60" height="26" fill="#cfe3c0" stroke="#1d1a1a" stroke-width="2"/>
  <rect x="265" y="446" width="22" height="8" fill="#4a5440"/>
  <rect x="188" y="482" width="104" height="28" fill="#5f6b52" stroke="#1d1a1a" stroke-width="2"/>
  <circle cx="240" cy="496" r="4" fill="#d9c27a"/>

  <!-- cardboard tube in brown paper -->
  <rect x="330" y="436" width="36" height="84" fill="#b08455" stroke="#1d1a1a" stroke-width="3"/>
  <ellipse cx="348" cy="436" rx="18" ry="5" fill="#d9b58a" stroke="#1d1a1a" stroke-width="2"/>
  <line x1="330" y1="466" x2="366" y2="466" stroke="#7a5630" stroke-width="2"/>
  <line x1="330" y1="490" x2="366" y2="490" stroke="#7a5630" stroke-width="2"/>

  <!-- bowl -->
  <ellipse cx="466" cy="508" rx="48" ry="9" fill="#f1e6cf" stroke="#1d1a1a" stroke-width="3"/>
  <path d="M418 508 Q430 540 466 542 Q502 540 514 508 Z" fill="#e6d8b8" stroke="#1d1a1a" stroke-width="3"/>
  <ellipse cx="466" cy="508" rx="36" ry="5" fill="#d8c59e"/>

  <!-- peel leaning at right -->
  <line x1="745" y1="520" x2="705" y2="330" stroke="#8a6a46" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="703" cy="318" rx="22" ry="20" fill="#c9a77a" stroke="#1d1a1a" stroke-width="3"/>

  <!-- signature -->
  <text x="768" y="782" font-family="serif" font-size="22" fill="#f0e6d0" text-anchor="end">P.</text>
</svg>