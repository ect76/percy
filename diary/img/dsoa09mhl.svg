  <g fill="#7d8688" stroke="#222" stroke-width="1">
    <ellipse cx="120" cy="335" rx="12" ry="5"/>
    <ellipse cx="160" cy="350" rx="12" ry="5"/>
    <ellipse cx="205" cy="338" rx="12" ry="5"/>
    <ellipse cx="250" cy="354" rx="12" ry="5"/>
    <ellipse cx="140" cy="366" rx="12" ry="4"/>
    <ellipse cx="230" cy="368" rx="12" ry="4"/>
  </g>
  <g fill="#f7f7f2" opacity="0.8">
