    <ellipse cx="150" cy="300" rx="90" ry="20"/>
    <ellipse cx="240" cy="160" rx="60" ry="16"/>
  </g>
  <line x1="200" y1="110" x2="200" y2="300" stroke="#222" stroke-width="3"/>
  <line x1="90" y1="205" x2="310" y2="205" stroke="#222" stroke-width="3"/>

  <!-- cupboard with tins -->
  <rect x="560" y="120" width="190" height="170" fill="#c9a77c" stroke="#222" stroke-width="3"/>
  <line x1="560" y1="200" x2="750" y2="200" stroke="#222" stroke-width="2"/>
  <g fill="#8aa3b5" stroke="#222" stroke-width="2">
    <rect x="580" y="155" width="30" height="20"/>
    <rect x="620" y="155" width="30" height="20"/>
    <rect x="660" y="155" width="30" height="20"/>
    <rect x="590" y="222" width="30" height="20"/>
    <rect x="630" y="222" width="30" height="20"/>
  </g>

  <!-- desk -->
  <rect x="60" y="520" width="680" height="30" fill="#8b5e3c" stroke="#222" stroke-width="3"/>
  <rect x="90" y="550" width="20" height="180" fill="#6e4a2e" stroke="#222" stroke-width="2"/>
  <rect x="690" y="550" width="20" height="180" fill="#6e4a2e" stroke="#222" stroke-width="2"/>

