    <line x1="114" y1="450" x2="208" y2="444"/>
    <line x1="116" y1="464" x2="210" y2="458"/>
  </g>

  <!-- paper bag with two loaves -->
  <path d="M300 520 L318 404 L442 404 L460 520 Z" fill="#d8b77a" stroke="#222" stroke-width="3"/>
  <path d="M318 404 L330 428 L380 418 L442 404" fill="#c9a666" stroke="#222" stroke-width="2"/>
  <line x1="340" y1="450" x2="340" y2="520" stroke="#b08d55" stroke-width="2"/>
  <line x1="420" y1="450" x2="420" y2="520" stroke="#b08d55" stroke-width="2"/>
  <ellipse cx="352" cy="398" rx="46" ry="28" fill="#c98a3e" stroke="#222" stroke-width="3"/>
  <ellipse cx="418" cy="394" rx="46" ry="30" fill="#c98a3e" stroke="#222" stroke-width="3"/>
  <path d="M332 392 Q352 380 372 392" fill="none" stroke="#8a5a24" stroke-width="3"/>
  <path d="M398 388 Q418 376 440 390" fill="none" stroke="#8a5a24" stroke-width="3"/>
  <path d="M340 404 Q352 398 364 404" fill="none" stroke="#e7b06a" stroke-width="2"/>

  <!-- bread peel -->
  <path d="M195 500 L120 528" stroke="#7a5230" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="252" cy="506" rx="58" ry="22" fill="#d9b98a" stroke="#222" stroke-width="3"/>
  <circle cx="268" cy="504" r="5" fill="none" stroke="#8a6a40" stroke-width="2"/>
  <line x1="236" y1="500" x2="262" y2="500" stroke="#8a6a40" stroke-width="1.5"/>

  <!-- old computer -->
  <rect x="530" y="350" width="130" height="95" fill="#3b3b3b" stroke="#222" stroke-width="2"/>
  <rect x="540" y="360" width="110" height="72" fill="#a9c2b4"/>
  <rect x="586" y="445" width="18" height="12" fill="#3b3b3b"/>
  <rect x="565" y="455" width="70" height="8" fill="#3b3b3b" stroke="#222" stroke-width="1"/>
  <rect x="540" y="488" width="120" height="12" fill="#dcd6c8" stroke="#222" stroke-width="2"/>

