  <rect x="700" y="440" width="40" height="80" fill="#6f8f7a" stroke="#222" stroke-width="2"/>
  <line x1="712" y1="440" x2="706" y2="412" stroke="#e0b040" stroke-width="5"/>
  <line x1="722" y1="440" x2="724" y2="410" stroke="#c75f4a" stroke-width="5"/>
  <line x1="730" y1="440" x2="738" y2="416" stroke="#3f6fa0" stroke-width="5"/>

  <!-- signature "P." -->
  <g fill="none" stroke="#222" stroke-width="2.5">
    <path d="M752 790 V756 H764 Q772 756 772 764 Q772 772 764 772 H752"/>
  </g>
  <circle cx="778" cy="790" r="2.5" fill="#222"/>
