<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <clipPath id="teapotBody">
      <circle cx="0" cy="0" r="55"/>
    </clipPath>
    <clipPath id="windowClip">
      <rect x="60" y="90" width="190" height="310"/>
    </clipPath>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#efe9dc"/>

  <!-- window with snowy lane -->
  <g clip-path="url(#windowClip)">
    <rect x="60" y="90" width="190" height="310" fill="#dfe6ea"/>
    <!-- faint houses in fog -->
    <rect x="70" y="170" width="40" height="90" fill="#b7c2c8"/>
    <rect x="120" y="150" width="50" height="110" fill="#c3ccd2"/>
    <rect x="185" y="180" width="60" height="80" fill="#b7c2c8"/>
    <!-- snowy ground -->
    <polygon points="60,260 250,250 250,400 60,400" fill="#f6f9fb"/>
    <!-- lane converging -->
    <polygon points="110,400 205,400 165,262 145,262" fill="#c9bfb0" stroke="#2a2420" stroke-width="2"/>
    <g fill="#8e857a">
      <circle cx="130" cy="380" r="4"/><circle cx="170" cy="372" r="4"/>
      <circle cx="150" cy="345" r="3"/><circle cx="160" cy="312" r="3"/>
      <circle cx="140" cy="290" r="2.5"/><circle cx="118" cy="330" r="3"/>
    </g>
    <!-- snowflakes -->
    <g fill="#ffffff">
      <circle cx="90" cy="130" r="3"/><circle cx="215" cy="150" r="2.5"/>
      <circle cx="235" cy="220" r="3"/><circle cx="80" cy="230" r="2.5"/>
      <circle cx="200" cy="300" r="2"/><circle cx="95" cy="350" r="2.5"/>
    </g>
    <!-- fog bands -->
    <rect x="60" y="230" width="190" height="30" fill="#ffffff" opacity="0.45"/>
    <rect x="60" y="130" width="190" height="20" fill="#ffffff" opacity="0.35"/>
  </g>
  <rect x="60" y="90" width="190" height="310" fill="none" stroke="#2a2420" stroke-width="4"/>
  <line x1="155" y1="90" x2="155" y2="400" stroke="#2a2420" stroke-width="4"/>
  <line x1="60" y1="245" x2="250" y2="245" stroke="#2a2420" stroke-width="4"/>

  <!-- clock nail -->
  <circle cx="400" cy="118" r="4" fill="#2a2420"/>

  <!-- crooked wooden clock -->
  <g transform="translate(400,232) rotate(-7)">
    <circle cx="0" cy="0" r="100" fill="#8a5a2b" stroke="#2a2420" stroke-width="3"/>
    <circle cx="0" cy="0" r="80" fill="#fbfaf4" stroke="#2a2420" stroke-width="2"/>
    <g stroke="#2a2420" stroke-width="3">
      <line x1="0" y1="-70" x2="0" y2="-62"/>
      <line x1="70" y1="0" x2="62" y2="0"/>
      <line x1="0" y1="70" x2="0" y2="62"/>
      <line x1="-70" y1="0" x2="-62" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-42" stroke="#1d1a17" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="34" y2="-50" stroke="#1d1a17" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#1d1a17"/>
  </g>

  <!-- counter -->
  <rect x="60" y="500" width="680" height="40" fill="#a0683f" stroke="#2a2420" stroke-width="3"/>
  <rect x="60" y="540" width="680" height="260" fill="#6b4423" stroke="#2a2420" stroke-width="3"/>
  <g stroke="#4f3119" stroke-width="3" fill="none">
    <path d="M120 580 L120 760"/><path d="M300 580 L300 760"/>
    <path d="M480 580 L480 760"/><path d="M660 580 L660 760"/>
  </g>

  <!-- order slips with peg -->
  <g transform="translate(365,470)">
    <rect x="-62" y="-36" width="124" height="56" fill="#f5efa8" stroke="#2a2420" stroke-width="2" transform="rotate(-3)"/>
    <rect x="-58" y="-30" width="124" height="56" fill="#f8f2b4" stroke="#2a2420" stroke-width="2"/>
    <rect x="-56" y="-26" width="124" height="56" fill="#fbf6c4" stroke="#2a2420" stroke-width="2" transform="rotate(2)"/>
    <text x="-48" y="-2" font-family="sans-serif" font-size="11" fill="#2a2420">Table ___ Qty ___</text>
    <text x="-48" y="14" font-family="sans-serif" font-size="11" fill="#2a2420">Item ___</text>
  </g>
  <rect x="300" y="418" width="130" height="10" rx="5" fill="#b07a45" stroke="#2a2420" stroke-width="2"/>
  <circle cx="306" cy="423" r="6" fill="#8a5a2b" stroke="#2a2420" stroke-width="2"/>
  <circle cx="424" cy="423" r="6" fill="#8a5a2b" stroke="#2a2420" stroke-width="2"/>

  <!-- hanging teapot sign -->
  <line x1="520" y1="200" x2="680" y2="200" stroke="#2a2420" stroke-width="5" stroke-linecap="round"/>
  <line x1="545" y1="200" x2="572" y2="262" stroke="#2a2420" stroke-width="2"/>
  <line x1="655" y1="200" x2="628" y2="262" stroke="#2a2420" stroke-width="2"/>

  <g transform="translate(600,335) rotate(-4)">
    <!-- spout -->
    <path d="M-50,12 L-96,-42 L-88,-48 L-40,-6 Z" fill="#ffffff" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-96,-42 L-90,-36 L-94,-30 L-88,-48" fill="#8a8a8a" stroke="#2a2420" stroke-width="1.5"/>
    <!-- handle -->
    <path d="M48,-26 Q98,0 48,30" fill="none" stroke="#2a2420" stroke-width="13" stroke-linecap="round"/>
    <path d="M48,-26 Q98,0 48,30" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <!-- body -->
    <circle cx="0" cy="0" r="55" fill="#ffffff" stroke="#2a2420" stroke-width="3"/>
    <rect x="-60" y="-12" width="120" height="24" fill="#3a6fb0" clip-path="url(#teapotBody)"/>
    <line x1="-55" y1="-12" x2="55" y2="-12" stroke="#2a2420" stroke-width="1.5" clip-path="url(#teapotBody)"/>
    <line x1="-55" y1="12" x2="55" y2="12" stroke="#2a2420" stroke-width="1.5" clip-path="url(#teapotBody)"/>
    <!-- crooked lid -->
    <g transform="rotate(-9) translate(0,-52)">
      <ellipse cx="0" cy="0" rx="30" ry="8" fill="#ffffff" stroke="#2a2420" stroke-width="3"/>
      <circle cx="0" cy="-12" r="6" fill="#ffffff" stroke="#2a2420" stroke-width="2.5"/>
    </g>
  </g>

  <!-- fog at edges -->
  <ellipse cx="400" cy="790" rx="460" ry="50" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="60" cy="60" rx="120" ry="40" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="760" cy="90" rx="110" ry="36" fill="#ffffff" opacity="0.4"/>

  <!-- signature -->
  <text x="760" y="782" font-family="sans-serif" font-size="18" fill="#2a2420" text-anchor="end">P.</text>
</svg>