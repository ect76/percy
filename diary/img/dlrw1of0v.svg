    <polygon points="620,420 670,372 720,420 720,465 620,465"/>
    <polygon points="700,440 735,405 770,440 770,470 700,470"/>
  </g>

  <!-- fog bands -->
  <g fill="#f8f5ee" opacity="0.6">
    <ellipse cx="200" cy="420" rx="260" ry="34"/>
    <ellipse cx="620" cy="470" rx="240" ry="30"/>
    <ellipse cx="400" cy="300" rx="320" ry="26"/>
  </g>

  <!-- cobbled ground -->
  <rect x="0" y="600" width="800" height="200" fill="#c7bca9"/>
  <g fill="none" stroke="#8f8474" stroke-width="2" opacity="0.8">
