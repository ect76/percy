    <rect x="388" y="372" width="12" height="9" rx="2"/>
    <rect x="406" y="372" width="12" height="9" rx="2"/>
    <rect x="424" y="372" width="12" height="9" rx="2"/>
    <rect x="442" y="372" width="12" height="9" rx="2"/>
    <rect x="460" y="372" width="12" height="9" rx="2"/>
    <rect x="478" y="372" width="12" height="9" rx="2"/>
    <rect x="496" y="372" width="12" height="9" rx="2"/>
    <rect x="514" y="372" width="12" height="9" rx="2"/>
    <rect x="361" y="384" width="12" height="9" rx="2"/>
    <rect x="379" y="384" width="12" height="9" rx="2"/>
    <rect x="397" y="384" width="12" height="9" rx="2"/>
    <rect x="415" y="384" width="12" height="9" rx="2"/>
    <rect x="433" y="384" width="12" height="9" rx="2"/>
    <rect x="451" y="384" width="12" height="9" rx="2"/>
    <rect x="469" y="384" width="12" height="9" rx="2"/>
    <rect x="487" y="384" width="12" height="9" rx="2"/>
    <rect x="505" y="384" width="12" height="9" rx="2"/>
