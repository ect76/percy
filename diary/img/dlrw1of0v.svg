  <rect x="345" y="428" width="200" height="34" fill="#3a2a12" opacity="0.35"/>
  <text x="445" y="450" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#2b1d08" letter-spacing="1">NO SALE WITHOUT RECEIPT</text>
  <!-- hanging-open drawer -->
  <rect x="346" y="510" width="200" height="16" fill="#8f6a2c" stroke="#4a3514" stroke-width="3"/>

  <!-- cardboard tube in soft brown paper -->
  <rect x="604" y="330" width="52" height="270" fill="#b08860" stroke="#5e4428" stroke-width="4"/>
  <g stroke="#8a6842" stroke-width="2" fill="none" opacity="0.7">
    <line x1="614" y1="360" x2="614" y2="580"/>
    <line x1="630" y1="350" x2="630" y2="590"/>
    <line x1="646" y1="362" x2="646" y2="578"/>
  </g>
  <ellipse cx="630" cy="330" rx="26" ry="8" fill="#d2b08a" stroke="#5e4428" stroke-width="3"/>
  <ellipse cx="630" cy="600" rx="26" ry="8" fill="#9c7650" stroke="#5e4428" stroke-width="3"/>

  <!-- star-shaped silver loop with wooden grip -->
  <path fill="#c9d2d8" stroke="#6f7b84" stroke-width="3" fill-rule="evenodd"
        d="M420,600 L496,655 L467,745 L373,745 L344,655 Z M440,652 L452,690 L420,714 L388,690 L400,652 Z"/>
  <rect x="408" y="548" width="24" height="52" rx="5" fill="#8a5a2b" stroke="#4a2e14" stroke-width="2"/>
  <circle cx="420" cy="556" r="3" fill="#4a4a4a"/>

  <!-- signature -->
  <text x="762" y="780" font-family="Georgia, serif" font-size="20" text-anchor="end" fill="#3b3024">P.</text>
