    <rect x="156" y="258" width="60" height="66"/>
    <rect x="226" y="258" width="60" height="66"/>
    <rect x="86" y="338" width="60" height="66"/>
    <rect x="86" y="418" width="60" height="66"/>
    <rect x="156" y="418" width="60" height="66"/>
    <rect x="226" y="418" width="60" height="66"/>
    <rect x="86" y="498" width="60" height="66"/>
    <rect x="156" y="498" width="60" height="66"/>
    <rect x="226" y="498" width="60" height="66"/>
