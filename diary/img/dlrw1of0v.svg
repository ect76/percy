  <!-- open drawer, pulled out -->
  <rect x="160" y="346" width="64" height="66" fill="#4a3324" stroke="#120c08" stroke-width="2"/>
  <rect x="160" y="346" width="64" height="8" fill="#1f150f"/>
  <!-- brass pulls -->
  <g fill="#c8a24a" stroke="#6b5220" stroke-width="1">
    <rect x="112" y="266" width="8" height="5"/>
    <rect x="182" y="266" width="8" height="5"/>
    <rect x="252" y="266" width="8" height="5"/>
    <rect x="112" y="346" width="8" height="5"/>
    <rect x="112" y="426" width="8" height="5"/>
