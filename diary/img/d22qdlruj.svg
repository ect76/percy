<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper -->
  <rect x="0" y="0" width="800" height="800" fill="#f3eedf"/>
  <!-- distant fog bands -->
  <rect x="0" y="180" width="800" height="90" fill="#dcdcd2" opacity="0.6"/>
  <ellipse cx="160" cy="250" rx="180" ry="30" fill="#e9e7dc" opacity="0.9"/>
  <ellipse cx="640" cy="200" rx="200" ry="34" fill="#e9e7dc" opacity="0.9"/>
  <ellipse cx="400" cy="300" rx="260" ry="26" fill="#e4e2d6" opacity="0.8"/>
  <!-- ground -->
  <rect x="0" y="680" width="800" height="120" fill="#c9c3b0"/>
  <ellipse cx="380" cy="690" rx="420" ry="34" fill="#7fa06a" stroke="#2b2b2b" stroke-width="2.5"/>
  <!-- cobbles -->
  <g fill="#e8e1cc" stroke="#2b2b2b" stroke-width="2">
    <ellipse cx="60" cy="730" rx="34" ry="12"/>
    <ellipse cx="150" cy="750" rx="40" ry="13"/>
    <ellipse cx="260" cy="728" rx="36" ry="12"/>
    <ellipse cx="340" cy="772" rx="44" ry="13"/>
    <ellipse cx="470" cy="740" rx="38" ry="12"/>
    <ellipse cx="580" cy="770" rx="42" ry="13"/>
    <ellipse cx="690" cy="735" rx="36" ry="12"/>
    <ellipse cx="740" cy="782" rx="34" ry="11"/>
    <ellipse cx="110" cy="785" rx="30" ry="10"/>
  </g>

  <!-- LEFT SIGN (small, with roof cap and chains) -->
  <g stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round">
    <!-- post -->
    <rect x="222" y="560" width="14" height="122" fill="#8a6a4a"/>
    <!-- roof cap -->
    <polygon points="200,474 264,474 232,440" fill="#5d4a36"/>
    <!-- chains -->
    <path d="M186,532 q-4,8 0,14 q4,6 0,12" fill="none" stroke="#b08d3c" stroke-width="3"/>
    <path d="M270,532 q4,8 0,14 q-4,6 0,12" fill="none" stroke="#b08d3c" stroke-width="3"/>
    <!-- board -->
    <rect x="172" y="474" width="110" height="58" rx="10" fill="#f6f1de" stroke="#4f7a4a" stroke-width="7"/>
  </g>
  <g font-family="serif" font-size="11" fill="#2b2b2b" text-anchor="middle">
    <text x="227" y="497">Welcome to</text>
    <text x="227" y="515">Mossville</text>
  </g>
  <!-- moss at left post base -->
  <g fill="#5f8f4e" stroke="#2b2b2b" stroke-width="1.5">
    <path d="M206,684 q6,-16 14,-4 q6,-14 14,2 q8,-10 12,4 L206,690 Z"/>
    <path d="M250,682 q5,-12 12,-2 q6,-10 10,4 L250,688 Z"/>
  </g>

  <!-- RIGHT SIGN (tall, flat board, Weather Museum) -->
  <g stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round">
    <!-- post -->
    <rect x="512" y="400" width="18" height="282" fill="#8a6a4a"/>
    <!-- roof cap -->
    <polygon points="500,334 580,334 540,296" fill="#5d4a36"/>
    <!-- board -->
    <rect x="436" y="334" width="208" height="76" rx="14" fill="#f6f1de" stroke="#4f7a4a" stroke-width="9"/>
  </g>
  <text x="540" y="380" font-family="serif" font-size="20" fill="#2b2b2b" text-anchor="middle">Welcome to Mossville</text>
  <!-- moss at right post base -->
  <g fill="#5f8f4e" stroke="#2b2b2b" stroke-width="1.5">
    <path d="M496,684 q7,-22 18,-6 q8,-18 18,2 q9,-14 14,6 L496,690 Z"/>
    <path d="M532,686 q6,-14 14,-2 q6,-12 12,2 L532,690 Z"/>
  </g>

  <!-- signature -->
  <text x="760" y="780" font-family="serif" font-size="18" fill="#2b2b2b" text-anchor="end">P.</text>
</svg>