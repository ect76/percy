<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- paper ground -->
  <rect x="0" y="0" width="800" height="800" fill="#f2ead8"/>
  <!-- faint paper grain strokes -->
  <g stroke="#e4d9c0" stroke-width="1" fill="none" opacity="0.7">
    <path d="M20 90 Q60 85 100 92"/>
    <path d="M520 40 Q560 46 600 38"/>
    <path d="M140 700 Q190 694 230 702"/>
    <path d="M600 640 Q650 648 690 636"/>
  </g>

  <!-- left panel frame -->
  <rect x="40" y="90" width="340" height="520" fill="#e9dfc9" stroke="#2b2622" stroke-width="3"/>
  <!-- right panel frame (remembered, fainter) -->
  <rect x="420" y="90" width="340" height="520" fill="#f2ead8" stroke="#6e655b" stroke-width="2" stroke-dasharray="10 7"/>

  <!-- LEFT: cottage cupboard -->
  <rect x="70" y="130" width="280" height="430" fill="#b98a5e" stroke="#2b2622" stroke-width="3"/>
  <rect x="82" y="142" width="256" height="406" fill="#a67648" stroke="#2b2622" stroke-width="2"/>
  <!-- shelves -->
  <rect x="82" y="300" width="256" height="10" fill="#7d5532" stroke="#2b2622" stroke-width="2"/>
  <rect x="82" y="440" width="256" height="10" fill="#7d5532" stroke="#2b2622" stroke-width="2"/>
  <!-- cupboard door lines -->
  <path d="M210 142 L210 548" stroke="#2b2622" stroke-width="2" fill="none"/>

  <!-- loaf on top shelf -->
  <path d="M120 300 Q118 236 186 230 Q254 224 292 262 Q300 282 294 300 Z" fill="#d9a25f" stroke="#2b2622" stroke-width="3"/>
  <path d="M140 262 Q168 246 196 254" stroke="#2b2622" stroke-width="2" fill="none"/>
  <path d="M180 252 Q210 238 240 250" stroke="#2b2622" stroke-width="2" fill="none"/>
  <path d="M226 244 Q248 238 268 252" stroke="#2b2622" stroke-width="2" fill="none"/>
  <path d="M136 290 Q200 282 280 288" stroke="#b5773a" stroke-width="2" fill="none"/>

  <!-- brass bubble vial on shelf -->
  <rect x="318" y="282" width="34" height="18" rx="9" fill="#d4af55" stroke="#2b2622" stroke-width="2"/>
  <rect x="326" y="286" width="18" height="10" rx="5" fill="#f5e7b5" stroke="#2b2622" stroke-width="1.5"/>
  <circle cx="335" cy="291" r="2.5" fill="#2b2622"/>

  <!-- sardine tins on lower shelf -->
  <rect x="100" y="396" width="44" height="44" rx="4" fill="#5f7fa0" stroke="#2b2622" stroke-width="2.5"/>
  <rect x="100" y="410" width="44" height="14" fill="#e0c26a" stroke="#2b2622" stroke-width="1.5"/>
  <rect x="158" y="396" width="44" height="44" rx="4" fill="#5f7fa0" stroke="#2b2622" stroke-width="2.5"/>
  <rect x="158" y="410" width="44" height="14" fill="#e0c26a" stroke="#2b2622" stroke-width="1.5"/>
  <rect x="216" y="396" width="44" height="44" rx="4" fill="#5f7fa0" stroke="#2b2622" stroke-width="2.5"/>
  <rect x="216" y="410" width="44" height="14" fill="#e0c26a" stroke="#2b2622" stroke-width="1.5"/>

  <!-- cottage window glimpse behind cupboard top -->
  <rect x="96" y="96" width="0" height="0" fill="none"/>

  <!-- RIGHT: bakery counter, bare, drawn from memory -->
  <rect x="450" y="380" width="280" height="22" fill="#cdbf9f" stroke="#6e655b" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="462" y="402" width="256" height="150" fill="#d8cdb3" stroke="#6e655b" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M500 402 L500 552 M580 402 L580 552 M660 402 L660 552" stroke="#8c8276" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>

  <!-- five remembered items, ghosted on the bare counter -->
  <rect x="478" y="340" width="40" height="40" rx="4" fill="none" stroke="#6e655b" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="530" y="340" width="40" height="40" rx="4" fill="none" stroke="#6e655b" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="598" y="332" width="50" height="10" rx="5" fill="none" stroke="#6e655b" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="640" y="300" width="30" height="50" fill="none" stroke="#6e655b" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="500" cy="300" r="14" fill="none" stroke="#6e655b" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- fog bands -->
  <rect x="40" y="520" width="340" height="60" fill="#f2ead8" opacity="0.45"/>
  <rect x="420" y="470" width="340" height="80" fill="#f2ead8" opacity="0.55"/>
  <rect x="0" y="640" width="800" height="160" fill="#e8e1d0" opacity="0.8"/>
  <rect x="0" y="690" width="800" height="110" fill="#f2ead8" opacity="0.6"/>

  <!-- ground line -->
  <path d="M40 640 Q200 630 400 640 T760 640" stroke="#2b2622" stroke-width="2" fill="none"/>

  <!-- signature -->
  <text x="752" y="772" font-size="22" text-anchor="end" fill="#2b2622">P.</text>
</svg>