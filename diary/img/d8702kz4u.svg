<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="scales" patternUnits="userSpaceOnUse" width="22" height="18">
      <path d="M0,9 A11,9 0 0 0 22,9 M-11,18 A11,9 0 0 0 11,18 M11,18 A11,9 0 0 0 33,18" fill="none" stroke="#3a2e24" stroke-width="1.2" stroke-opacity="0.7"/>
      <ellipse cx="11" cy="5" rx="3" ry="2" fill="#fffbe6" opacity="0.85"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- paper and wall -->
  <rect x="0" y="0" width="800" height="800" fill="#f4ecd8"/>
  <rect x="0" y="0" width="800" height="520" fill="#e8dcc0"/>

  <!-- window -->
  <rect x="470" y="60" width="280" height="270" fill="#cfe3ea" stroke="#2b2118" stroke-width="4"/>
  <line x1="610" y1="60" x2="610" y2="330" stroke="#2b2118" stroke-width="4"/>
  <line x1="470" y1="195" x2="750" y2="195" stroke="#2b2118" stroke-width="4"/>
  <rect x="455" y="48" width="310" height="10" fill="#8a6a48"/>

  <!-- light falling from window onto table -->
  <polygon points="470,330 750,330 790,520 430,520" fill="url(#beam)"/>

  <!-- table -->
  <rect x="0" y="520" width="800" height="280" fill="#8b6a4a"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#2b2118" stroke-width="4"/>
  <g stroke="#6e5238" stroke-width="2" fill="none">
    <line x1="0" y1="580" x2="800" y2="580"/>
    <line x1="0" y1="650" x2="800" y2="650"/>
    <line x1="0" y1="720" x2="800" y2="720"/>
  </g>

  <!-- shadows -->
  <ellipse cx="300" cy="620" rx="150" ry="20" fill="#5a4330" opacity="0.35"/>
  <ellipse cx="440" cy="690" rx="130" ry="18" fill="#5a4330" opacity="0.35"/>

  <!-- fish one -->
  <g transform="translate(160,560) rotate(-12)">
    <path d="M120,-58 Q150,-102 186,-60 Z" fill="#b5552f" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
    <path d="M60,8 Q100,40 130,10 Q105,22 60,8 Z" fill="#b5552f" stroke="#2b2118" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0,0 C60,-70 180,-75 230,-10 L270,-50 L265,0 L270,50 L230,10 C180,75 60,70 0,0 Z" fill="#d9a441"/>
    <path d="M0,0 C60,-70 180,-75 230,-10 L270,-50 L265,0 L270,50 L230,10 C180,75 60,70 0,0 Z" fill="url(#scales)" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
    <path d="M62,-38 Q76,0 62,38" fill="none" stroke="#2b2118" stroke-width="3"/>
    <circle cx="40" cy="-12" r="8" fill="#2b2118"/>
    <circle cx="42" cy="-14" r="2.5" fill="#fffbe6"/>
  </g>

  <!-- fish two -->
  <g transform="translate(400,640) rotate(8) scale(0.9)">
    <path d="M120,-58 Q150,-102 186,-60 Z" fill="#4f6f7e" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
    <path d="M60,8 Q100,40 130,10 Q105,22 60,8 Z" fill="#4f6f7e" stroke="#2b2118" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0,0 C60,-70 180,-75 230,-10 L270,-50 L265,0 L270,50 L230,10 C180,75 60,70 0,0 Z" fill="#9fc3cf"/>
    <path d="M0,0 C60,-70 180,-75 230,-10 L270,-50 L265,0 L270,50 L230,10 C180,75 60,70 0,0 Z" fill="url(#scales)" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
    <path d="M62,-38 Q76,0 62,38" fill="none" stroke="#2b2118" stroke-width="3"/>
    <circle cx="40" cy="-12" r="8" fill="#2b2118"/>
    <circle cx="42" cy="-14" r="2.5" fill="#fffbe6"/>
  </g>

  <!-- signature P. -->
  <path d="M736,752 V722 H748 Q758,722 758,732 Q758,742 748,742 H736" fill="none" stroke="#2b2118" stroke-width="2.5"/>
  <circle cx="764" cy="752" r="2.5" fill="#2b2118"/>
</svg>