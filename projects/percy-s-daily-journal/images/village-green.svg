    </g>
    <g id="flower">
      <path d="M0 0 L0 14" stroke="#1f3a2a" stroke-width="1.8" fill="none"/>
      <circle cx="0" cy="0" r="4.5" fill="#fff8e0" stroke="#2a2a3a" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="1.6" fill="#e9b73a"/>
