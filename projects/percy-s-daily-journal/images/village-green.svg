  <path d="M575 495 l-8 -8 M575 495 l0 -12 M720 495 l8 -8 M720 495 l2 -12" stroke="#1f3a2a" stroke-width="2" fill="none"/>

  <!-- tufts -->
  
  
  
  
  
  
  
  

  <!-- flowers -->
  
  
  
  
  
  
  

