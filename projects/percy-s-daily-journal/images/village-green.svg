    <path d="M356 240 L377 188 L398 240 Z"/>
  </g>
  <rect x="0" y="180" width="800" height="70" fill="#f0efe8" opacity="0.55"/>
  <rect x="0" y="250" width="800" height="70" fill="#f0efe8" opacity="0.5"/>

