  <path d="M0 322 Q200 308 400 318 T800 316 L800 360 Q400 380 0 358 Z" fill="#b6d6a0" opacity="0.8"/>
  <rect x="0" y="300" width="800" height="40" fill="#f0efe8" opacity="0.45"/>

