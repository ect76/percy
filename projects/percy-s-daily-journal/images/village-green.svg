    <g id="buttercup">
      <path d="M0 0 L0 12" stroke="#1f3a2a" stroke-width="1.8" fill="none"/>
      <circle cx="0" cy="0" r="4" fill="#f0c43c" stroke="#2a2a3a" stroke-width="1.5"/>
